<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathTrail spike widget</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #171717;
        --bg: #ffffff;
        --muted: #6b6b6b;
        --border: #d8d8d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #fafafa;
          --bg: #171717;
          --muted: #a0a0a0;
          --border: #3a3a3a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      section {
        margin-bottom: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        margin: 0;
      }
      .drawing {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 13px;
        line-height: 1.3;
        white-space: pre;
        overflow-x: auto;
      }
      button {
        display: block;
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font-size: 14px;
      }
      button:active {
        opacity: 0.7;
      }
      #log {
        max-height: 160px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>MathTrail spike widget (T03)</h1>

    <section>
      <h2>Text drawing</h2>
      <div class="drawing" id="drawing"></div>
    </section>

    <section>
      <h2>Host context</h2>
      <pre id="context">connecting…</pre>
    </section>

    <section>
      <h2>Actions</h2>
      <button id="btn-poke">Call widget-only tool (widget_poke)</button>
      <button id="btn-message">Send ui/message</button>
      <button id="btn-update-context">Send ui/update-model-context</button>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
