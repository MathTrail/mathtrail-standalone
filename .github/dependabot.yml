# Dependabot proposes new versions; a pull request changes a pinned version and
# nothing else, because every version in this repository is exact.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Routine bumps travel together. A major version arrives on its own,
      # because it is the one that has to be read before it is merged.
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]

  # The load tool's one dependency of its own. Everything else it builds with
  # comes from the service, at the service's versions, and moves with it.
  - package-ecosystem: gomod
    directory: /tools/load
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-name: github.com/tsenart/vegeta/v12

  # The packages the widget is built from, and the tools it is built with.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # What the widget speaks to its host: the library it is written against
      # and the client and core that library runs on. Their version updates
      # arrive together, in a pull request of their own, so that a change to the
      # protocol is never one line among the tools' bumps. Major versions come
      # in the same pull request: a major version of the library is likely to
      # need one of its client and core, and a pull request of this group is
      # read before it is merged whatever it moves.
      mcp-packages:
        patterns:
          - "@modelcontextprotocol/ext-apps"
          - "@modelcontextprotocol/client"
          - "@modelcontextprotocol/core"
      npm-packages:
        patterns: ["*"]
        exclude-patterns:
          - "@modelcontextprotocol/ext-apps"
          - "@modelcontextprotocol/client"
          - "@modelcontextprotocol/core"
        update-types: [minor, patch]
    ignore:
      # The types of Node's own modules follow the major version of the Node
      # the scripts run on, which moves only by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workflows, and the actions of this repository that use actions of
  # their own.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The image the service runs on, and the one it is developed in.
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The widget is built by the Node its tests run on, which the development
      # image installs from an ARG that no update here touches. So a new Node
      # version, however small, comes in by hand and in both places at once;
      # only a fresh digest of the same version is proposed here.
      - dependency-name: node
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
