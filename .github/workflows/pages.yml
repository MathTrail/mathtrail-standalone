# Builds the site and publishes it: the site of a release, built from its tag,
# so that the cards its pages draw name the release the chats run. The build
# runs inside the same toolchain image as every other check, so a page built
# here and a page built on a laptop come from the same Node and the same
# packages, and are judged by the same checker; the deployment itself runs on
# the runner, because that is where the Pages API is reachable. Before the
# site, the build makes the data of the page "Research": the numbers of the
# student model, computed by the bench from the commit it builds, and their
# table in the job's summary.
name: Pages

on:
  # A release, named by its tag: the site is built from that tag, and the
  # cards on its pages name it.
  workflow_call:
    inputs:
      version:
        description: "The release to publish the site of: the tag it is built from and names."
        type: string
        required: true
  # A branch may be published by hand, exactly as it is checked out, and its
  # cards name no release. It is how a new deployment puts its privacy policy
  # online before any release exists: the sign-in needs the policy's address.
  workflow_dispatch:
  # On a pull request the site is built and checked, never published.
  pull_request:

permissions:
  contents: read
  packages: read

# Every publication of main's site, a release's or one started by hand, waits
# in one queue: one runs at a time, and a newer one takes the place of one
# still waiting, so two never write the site at once and an older one never
# lands last. A deployment is never cancelled halfway: the site that is live
# would be left half replaced. A new push to a pull request replaces its run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git refuses a repository whose files belong to somebody else, which is what a
  # checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - uses: ./.github/actions/just
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=$(just ci-toolchain-image)" >> "$GITHUB_OUTPUT"

  build:
    name: Build the site
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Fixed places for what Go downloads and builds, so that the paths the job
      # caches and the paths Go reads are the same ones.
      GOMODCACHE: /tmp/go/mod
      GOCACHE: /tmp/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      # What Go downloads and builds, on a pull request alone: a run that
      # publishes builds the bench from nothing an earlier run left behind.
      - if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-site-${{ hashFiles('go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - name: Build the bench and name what the page's numbers are computed from
        id: research
        run: |
          key=$(just _research-inputs)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # A pull request takes the numbers kept for the same build of the bench. A
      # run that publishes only asks whether they are kept, and computes its own
      # from the commit it builds.
      - name: Take the page's numbers kept for this build
        id: numbers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/learners/results/page
          key: research-${{ steps.research.outputs.key }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
      - name: Make the data of the page "Research" and show its goals
        run: just research-data | tee -a "$GITHUB_STEP_SUMMARY"
      # A key once kept is never written again, so only numbers no run has kept
      # are kept: a release's go to every pull request after it.
      - name: Keep the page's numbers for the runs after this one
        if: steps.numbers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/learners/results/page
          key: research-${{ steps.research.outputs.key }}
      - name: Build the site and hold it to its own rules
        env:
          # The release the cards on the pages name; empty, they name none.
          VITE_VERSION: ${{ inputs.version }}
        run: just ci-site
      - name: Keep the site for the deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # The archive drops dotfiles unless it is told otherwise, and .nojekyll
          # is a dotfile.
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # pages lets the token create a deployment; id-token mints the OIDC token
      # the Pages API checks the deployment's origin with.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
