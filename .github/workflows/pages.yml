# Builds the site and publishes it: the site of a release, built from its tag,
# so that the cards its pages draw name the release the chats run. The build
# runs inside the same toolchain image as every other check, so a page built
# here and a page built on a laptop come from the same Node and the same
# packages, and are judged by the same checker; the deployment itself runs on
# the runner, because that is where the Pages API is reachable. A release's
# build takes the data of the page "Research", and the paper's PDF once there
# is a clean one, from the research's run of the same commit, which built the
# paper and held the experiments to their results first; a pull request's
# site is built by that run too, and published by no one. A site published by
# hand makes its own data before the site: the numbers of the student model,
# computed by the bench from the commit it builds, and their table in the
# job's summary, with no paper.
name: Pages

on:
  # A release, named by its tag: the site is built from that tag, and the
  # cards on its pages name it.
  workflow_call:
    inputs:
      version:
        description: "The release to publish the site of: the tag it is built from and names."
        type: string
        required: true
      research:
        description: "Take the page's data, and the paper's PDF it names, from the artifact research-data of the same run rather than make the data."
        type: boolean
        default: false
  # A branch may be published by hand, exactly as it is checked out, and its
  # cards name no release. It is how a new deployment puts its privacy policy
  # online before any release exists: the sign-in needs the policy's address.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Every publication of main's site, a release's or one started by hand, waits
# in one queue: one runs at a time, and a newer one takes the place of one
# still waiting, so two never write the site at once and an older one never
# lands last. A deployment is never cancelled halfway: the site that is live
# would be left half replaced.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Git refuses a repository whose files belong to somebody else, which is what a
  # checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - uses: ./.github/actions/just
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        # Read into a variable first: inside the echo, a recipe that failed
        # would leave the step green and the reference empty.
        run: |
          reference="$(just ci-toolchain-image)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  build:
    name: Build the site
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      # A site published by hand computes its own numbers from the commit it
      # builds, with nothing an earlier run kept.
      - name: Make the data of the page "Research"
        if: ${{ !inputs.research }}
        uses: ./.github/actions/page-data
      # A release's data, with the paper's PDF, comes from the research's run
      # of the same commit, which held the experiments to their results and
      # built the paper first.
      - name: Build the site
        uses: ./.github/actions/site
        with:
          research: ${{ inputs.research }}
          # The release the cards on the pages name; a site published by hand
          # names none.
          version: ${{ inputs.version }}
      - name: Keep the site for the deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # The archive drops dotfiles unless it is told otherwise, and .nojekyll
          # is a dotfile.
          include-hidden-files: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # pages lets the token create a deployment; id-token mints the OIDC token
      # the Pages API checks the deployment's origin with.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
