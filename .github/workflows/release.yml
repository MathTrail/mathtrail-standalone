# What a tag produces: the server built for the architectures it runs on, the
# sums of what was built, and a signature for each of them. A release here is a
# record of provenance rather than a delivery — the service is deployed from
# main continuously — so what matters is that anybody can check that a binary
# came from this repository, from this workflow, at this commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Creating the release and uploading what it holds.
      contents: write
      # The short-lived identity the signature is made with: no key is stored
      # anywhere, and the certificate records which workflow signed what.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the version stamped into the binary comes from
          # git describe, and a shallow clone cannot see the tags.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/just

      - run: just release-artifacts

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign every artifact
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
              cosign sign-blob --yes \
                  --output-signature "${file}.sig" \
                  --output-certificate "${file}.pem" \
                  "$file"
          done
          ls -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
