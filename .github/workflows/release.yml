# What a green main produces: the server built for the architectures it runs on,
# the sums of what was built, and a signature for each of them, and then the
# service deployed, the research's data made and the site published with it,
# and the README's pictures photographed from the release's tag. What matters
# in the release is that anybody can check that a binary came from this
# repository, from this workflow, at this commit;
# what matters in the delivery, the site and the pictures after it is that all
# three name the release the service runs.
#
# Nobody tags anything by hand: the version is the next patch of the line the
# releases are numbered in, and the tag is created with the release. The button
# exists for the release that deserves a number of its own.
name: Release and deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as v1.0.0. Left empty, the patch number goes up by one."
        required: false

permissions:
  contents: read

# The line the releases are numbered in: the major and minor version every
# release carries, the patch counting up within it. A change that deserves a
# new number raises it here, and the release after it is the line's first.
env:
  RELEASE_LINE: "0.3"

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, sign and publish
    # Releases queue rather than overlap: the second one has to see the version
    # the first one published before it can work out the next. The queue holds
    # the release alone, not the delivery after it, which queues on its own.
    concurrency:
      group: release
      cancel-in-progress: false
    # Only from a commit the checks have already passed on, and only when that
    # commit is this repository's own. A pull request from a fork runs the checks
    # here as well, carrying the fork's code, and the branch filter above matches
    # on the name of the branch it came from — so a fork whose branch is called
    # main would otherwise have its code built, signed and published under this
    # repository's identity, with the permissions this job holds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      newest: ${{ steps.newest.outputs.newest }}
    permissions:
      # Creating the release and uploading what it holds.
      contents: write
      # The short-lived identity the signature is made with: no key is stored
      # anywhere, and the certificate records which workflow signed what.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the checks ran on, and the whole history with it: the
          # next version is read from the tags, which a shallow clone lacks.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/just

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(just release-version "$RELEASE_LINE" "${REQUESTED:-}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Every binary carries the widget, and the widget is built with Node.
      - uses: ./.github/actions/node

      - run: just release-artifacts "${{ steps.version.outputs.version }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Signed before anything is published: a release that appears without its
      # signatures is worse than no release at all, so the failure has to happen
      # while there is still nothing to see.
      #
      # One bundle per artifact, carrying the signature and the certificate that
      # says which workflow made it. Verified with:
      #   cosign verify-blob --bundle <artifact>.sigstore.json \
      #       --certificate-identity-regexp "^https://github.com/MathTrail/mathtrail-standalone/" \
      #       --certificate-oidc-issuer https://token.actions.githubusercontent.com <artifact>
      - name: Sign every artifact
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          ls -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # The notes run from the release before this one. The paper's
          # releases carry tags of their own, and the notes could otherwise
          # start from one of them.
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)
          start=()
          if [ -n "$previous" ]; then start=(--notes-start-tag "$previous"); fi
          gh release create "$VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$VERSION" \
              --generate-notes "${start[@]}"

      # Asked once the release is out, as late as it can be. The checks of an
      # older commit can finish after a newer one's, or be run again, and its
      # release would then carry a higher number than the code the service
      # already runs.
      - name: Whether main still ends at this commit
        id: newest
        env:
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" = "$TARGET" ]; then
              echo "newest=true" >> "$GITHUB_OUTPUT"
          else
              echo "newest=false" >> "$GITHUB_OUTPUT"
              echo "main ends at $tip now: $TARGET is released, and neither deployed nor its site and pictures published"
          fi

  # A delivery, a site or pictures that failed are started again with "Re-run
  # failed jobs": run again with all jobs, the release job would publish the
  # same commit once more, under the next number.
  deploy:
    name: Deploy the release
    needs: release
    # Only the newest of main is deployed, so the service never goes back to
    # older code: a release of a commit main has moved past, or of another
    # branch, is published and deployed by nobody.
    if: needs.release.outputs.newest == 'true'
    permissions:
      contents: read
      # The federated token the delivery signs in to Google Cloud with.
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    # The delivery's own: the billing account, and the OAuth client's secret
    # for the first apply of a deployment.
    secrets: inherit

  # The research's data of the release: paper A's experiments held to the
  # results the release's commit keeps, paper A built from them, and from that
  # commit the data of the page "Research", with the paper's PDF once it prints
  # no placeholder, handed to the site as one artifact. When any of it fails
  # the site is not published, and the service is delivered all the same.
  research:
    name: Make the release's research data
    needs: release
    if: needs.release.outputs.newest == 'true'
    permissions:
      contents: read
      # The toolchain image the data is made in, published when it is new.
      packages: write
    uses: ./.github/workflows/research.yml
    with:
      version: ${{ needs.release.outputs.version }}

  # The site of the release goes out beside its delivery rather than after it,
  # once the research's data and paper of the same commit are made. The site
  # is published about when the service is rolled out, so the privacy policy
  # and the topics' pages a card links to are online with the service that
  # points at them; and neither holds the other back when it fails. The cards
  # on the site name the release about when the chats run it, and, when a
  # delivery fails, until the next one succeeds.
  site:
    name: Publish the release's site
    needs: [release, research]
    # The same newest commit of main the delivery takes: the site never goes
    # back to older pages either.
    if: needs.release.outputs.newest == 'true'
    permissions:
      contents: read
      # The toolchain image the site is built in, published when it is new.
      packages: write
      # The deployment to Pages, and the token its origin is checked by.
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.release.outputs.version }}
      research: true

  # The README's pictures of the release: its cards, photographed from its tag
  # once the release is delivered, so that the version they name is the one the
  # service runs. A picture kept in main could never name it, since the merge
  # that brings a picture in is itself released under the next number. The
  # pictures live on a branch of their own instead, which the README shows them
  # from; a delivery or a photograph that fails leaves there the pictures of
  # the release before.
  screens:
    name: Photograph the release for the README
    needs: [release, deploy]
    if: needs.release.outputs.newest == 'true'
    # This job stays on the runner: the browsers run in an image of their own,
    # which needs a Docker daemon. It runs the widget's packages and a browser,
    # so it holds no right to write anything: the job after it publishes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: ./.github/actions/just
      # The preview the cards are photographed in is the widget's own page,
      # served from its sources.
      - uses: ./.github/actions/node
      - name: Photograph the cards
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: just web-screens "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens
          path: web/screens/
          if-no-files-found: error
          retention-days: 1

  # The token that may write to the repository is held by this job alone,
  # which runs none of the repository's packages.
  screens-publish:
    name: Publish the README's pictures
    needs: [release, screens]
    # One at a time, so that two never read the branch at once; one still
    # waiting gives its place to a newer one, as the site's publications do.
    concurrency:
      group: screens
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Writing the branch the README shows the pictures from.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screens
          path: ${{ runner.temp }}/screens
      # The branch's commit names the release its pictures are of, and a
      # release older than that leaves them alone: a job run again once a
      # newer release is delivered would otherwise put the older pictures back.
      # The files come from a job that ran the widget's packages, so only a
      # picture's plain name is taken. One commit with no parent, holding the
      # pictures alone, then takes the branch's place, so the branch never
      # grows a history of pictures nobody shows any more.
      - name: Publish the pictures on the branch the README shows them from
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PICTURES: ${{ runner.temp }}/screens
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          shown=""
          if [ -n "$(git ls-remote origin refs/heads/screens)" ]; then
              git fetch -q --depth 1 origin refs/heads/screens
              shown="$(git log -1 --format=%s FETCH_HEAD | sed -n 's/^The README.s pictures of //p')"
          fi
          if [ -n "$shown" ] && [ "$(printf '%s\n' "$shown" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "the branch holds the pictures of $shown, newer than $VERSION, and keeps them"
              exit 0
          fi
          entries=""
          for picture in "$PICTURES"/*; do
              name="${picture##*/}"
              if [[ ! "$name" =~ ^[a-z][a-z-]*\.png$ ]]; then
                  echo "screens: refusing a file that is no picture of the README: $name" >&2
                  exit 1
              fi
              entries+="$(printf '100644 blob %s\t%s' "$(git hash-object -w "$picture")" "$name")"$'\n'
          done
          tree="$(printf '%s' "$entries" | git mktree)"
          commit="$(git commit-tree "$tree" -m "The README's pictures of $VERSION")"
          git push --force origin "$commit:refs/heads/screens"
          git ls-tree --name-only "$commit"
