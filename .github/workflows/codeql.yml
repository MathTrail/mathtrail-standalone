# Static analysis that follows data rather than matching patterns: where a value
# taken from a request or a file ends up, and whether it reaches somewhere it
# must not. The linter's own security checks stay where they are; this one sees
# what a single file cannot.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # A query set that grows between our commits would otherwise only ever run
  # against code somebody happened to touch.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Where the findings are written, and what the Security tab reads.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scanner builds the code itself, and the version it builds with is
      # the one the module declares: a second place to write it down is a second
      # place to forget.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - run: go build ./...

      # The research module is a Go module of its own, which the root's build
      # does not reach; it builds against the product at the version it
      # requires, and only its own code is reported.
      - run: go build ./...
        working-directory: research

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

  analyze-widget:
    name: Analyze TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The widget draws what a model wrote in front of a child; where a value
      # from a tool's result ends up in the page is what this reads. TypeScript
      # is read from its sources, with nothing to build.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          # The research page's design draft and the coach's prototype the
          # site frames run their own copy of React to show themselves in a
          # browser. Both are a design tool's export, none of it code written
          # here, so they are left out of the analysis.
          config: |
            paths-ignore:
              - research/draft-ui
              - site/assets/coach-prototype.html

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
