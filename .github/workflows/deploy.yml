# Continuous delivery: brings the cloud up to what this repository describes,
# then builds the image of a release and rolls a revision of the service.
#
# Every step is a pinned action or a recipe of the justfile, so the same
# commands work from a laptop; the identity is federated, and the only secret
# anywhere is the one value that exists nowhere but the Google console.
name: CD

on:
  # What main delivers is a release, handed over by the workflow that has just
  # published it, once the checks have passed: the image is built from the
  # release's tag, so the service and its widget name the version they run.
  workflow_call:
    inputs:
      version:
        description: "The release to deploy: the tag the image is built from."
        type: string
        required: true
  # A branch, main among them, may be deployed deliberately, by hand, and goes
  # out exactly as it is checked out, named by how far past a release it is.
  workflow_dispatch:
  # On a pull request the same configuration is only read, never applied.
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - 'justfile'

permissions:
  contents: read
  # The federated token: this, and only this, is what gets into Google Cloud.
  id-token: write

# One delivery at a time, and never cancelled halfway: a cancelled apply or
# roll-out leaves a state nobody decided about.
concurrency:
  group: cd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: What an apply would change
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - uses: ./.github/actions/deployment-target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper turns every terraform call into a step output, which is
          # noise for a recipe that reads terraform's own stdout.
          terraform_wrapper: false
      - name: Plan
        env:
          # The one fact about the deployment that is not written down beside
          # the others: it names the account that pays.
          TF_VAR_billing_account: ${{ secrets.TF_VAR_billing_account }}
        run: just ci-tf-plan | tee -a "$GITHUB_STEP_SUMMARY"

  infra:
    name: The cloud, as described
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      deploy_service_account: ${{ steps.target.outputs.deploy_service_account }}
      image_repository: ${{ steps.target.outputs.image_repository }}
      service: ${{ steps.target.outputs.service }}
      region: ${{ steps.target.outputs.region }}
      public_url: ${{ steps.target.outputs.public_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release handed over, or, started by hand, the branch chosen.
          ref: ${{ inputs.version }}
      - uses: ./.github/actions/just
      - uses: ./.github/actions/deployment-target
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCLOUD_VERSION }}
      - name: Apply
        env:
          # Used once, on the first apply of a deployment, and ignored on every
          # apply after it: a secret that already holds a version is left alone.
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          # The one fact about the deployment that is not written down beside
          # the others: it names the account that pays.
          TF_VAR_billing_account: ${{ secrets.TF_VAR_billing_account }}
        run: just ci-tf-apply
      - id: target
        name: Where the image goes
        run: just ci-tf-outputs >> "$GITHUB_OUTPUT"

  deploy:
    name: The image of this commit
    needs: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          # The whole history with its tags: a branch started by hand is named
          # by how far past a release it is, which a shallow clone cannot say.
          fetch-depth: 0
      - uses: ./.github/actions/just
      - uses: ./.github/actions/deployment-target
      # A narrower identity than the one that applied the configuration: it may
      # push an image and roll a revision, and nothing else.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ needs.infra.outputs.deploy_service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ env.GCLOUD_VERSION }}
      - id: image
        name: Publish the image
        env:
          REPOSITORY: ${{ needs.infra.outputs.image_repository }}
          RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A release is stamped with its own number: a commit can carry more
          # than one tag, and git describe would name whichever sorts first.
          # A branch started by hand is named by git describe.
          version=()
          if [ -n "$RELEASE" ]; then
              version=(--set VERSION "$RELEASE")
          fi
          echo "reference=$(just "${version[@]}" ci-image-push "$REPOSITORY/server")" >> "$GITHUB_OUTPUT"
      - name: Roll out the revision
        env:
          SERVICE: ${{ needs.infra.outputs.service }}
          REGION: ${{ needs.infra.outputs.region }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: just ci-deploy "$SERVICE" "$REGION" "$IMAGE"
      - name: Check what answers is this commit
        env:
          PUBLIC_URL: ${{ needs.infra.outputs.public_url }}
        run: just ci-smoke "$PUBLIC_URL"
