# Builds the image of one commit, publishes it and rolls a new revision of the
# service. Every step is a pinned action or a recipe of the justfile, so the
# same three commands deploy from a laptop; the identity is federated, and
# nothing here reads a secret.
name: Deploy

on:
  push:
    branches: [main]
  # Deploying anything else is a deliberate act, so it is started by hand and
  # takes whatever branch it was started from.
  workflow_dispatch:

permissions:
  contents: read
  # The federated token: this, and only this, is what gets into Google Cloud.
  id-token: write

# One deployment at a time, and never cancelled halfway: a cancelled roll-out
# leaves a revision nobody decided about.
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build, publish, roll out
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just

      # The version lives where the tool is installed, as the default of an ARG,
      # so it is written down once and read from there.
      - id: gcloud
        name: The gcloud version this repository pins
        run: echo "version=$(sed -n 's/^ARG GCLOUD_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ steps.gcloud.outputs.version }}

      - id: image
        name: Publish the image
        env:
          REPOSITORY: ${{ vars.GCP_IMAGE_REPOSITORY }}
        run: echo "reference=$(just ci-image-push "$REPOSITORY/server")" >> "$GITHUB_OUTPUT"

      - name: Roll out the revision
        env:
          SERVICE: ${{ vars.GCP_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: just ci-deploy "$SERVICE" "$REGION" "$IMAGE"

      - name: Check what answers is this commit
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: just ci-smoke "$PUBLIC_URL"
