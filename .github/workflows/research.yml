# The research's data, made from one commit. Paper A's experiments are held to
# the results the repository keeps, paper A is built from them, and from the
# same commit comes the data of the site's page "Research", which takes the
# paper's PDF in once the paper prints no placeholder. An experiment is run
# again only when its program or its results changed: a key names both, and a
# run that reproduced them keeps a mark under it. A release's run hands the
# page's data and the PDF on, as one artifact, to the site's build after it; a
# pull request's run builds the site from them itself, and publishes nothing.
name: Research

on:
  # A release, named by its tag: everything is made from that tag.
  workflow_call:
    inputs:
      version:
        description: "The release whose commit the data is made from."
        type: string
        required: true
  # By hand, on any branch, with every experiment run again when asked.
  workflow_dispatch:
    inputs:
      again:
        description: "Run every experiment again, whatever reproductions are kept."
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read
  # The toolchain image the data is made in.
  packages: read

# A new push replaces a pull request's run. A run started by hand waits in a
# queue of its own, so that it never takes the place of a release's run, whose
# site waits for it: called by a release, the run carries the release's
# workflow and event, a release started by hand among them.
concurrency:
  group: research-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git refuses a repository whose files belong to somebody else, which is what a
  # checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    name: Reproduce ${{ matrix.experiment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # On the runner itself, with the Go the research module declares: the
    # toolchain image follows the product's Go, and the paper's experiments are
    # built by the paper's.
    strategy:
      fail-fast: false
      matrix:
        experiment: [faultinject, learnersim, perf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      # What Go downloads and builds is kept by the research's dependencies: it
      # speeds the build and changes no byte of the program, whose key is its
      # own bytes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - uses: ./.github/actions/just
      - id: key
        name: Name what the results are reproduced from
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          key=$(just research experiment-key "$EXPERIMENT")
          if [ -z "$key" ]; then
              echo "No key was made for $EXPERIMENT." >&2
              exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # A mark is kept only by a run that reproduced the results under its key.
      # A pull request's marks are its own, and main trusts only marks main kept.
      - id: mark
        name: Ask whether these results were reproduced by this program
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/reproduced
          key: reproduced-${{ matrix.experiment }}-${{ steps.key.outputs.key }}
      - name: Name the run that reproduced them
        if: steps.mark.outputs.cache-hit == 'true' && !inputs.again
        run: cat "$RUNNER_TEMP/reproduced/note" >> "$GITHUB_STEP_SUMMARY"
      # Under bash the pipe keeps the recipe's exit as the step's own.
      - name: Run the experiment again and hold it to its results
        if: steps.mark.outputs.cache-hit != 'true' || inputs.again
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: just research reproduce "$EXPERIMENT" "$RUNNER_TEMP/run" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep what the run wrote
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduced-${{ matrix.experiment }}
          path: ${{ runner.temp }}/run
          retention-days: 14
      - name: Note the run that reproduced them
        if: steps.mark.outputs.cache-hit != 'true'
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/reproduced"
          echo "$EXPERIMENT: these results were reproduced by $RUN, at $(git rev-parse --short HEAD)." > "$RUNNER_TEMP/reproduced/note"
      - name: Keep the mark
        if: steps.mark.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/reproduced
          key: reproduced-${{ matrix.experiment }}-${{ steps.key.outputs.key }}

  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - uses: ./.github/actions/just
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=$(just ci-toolchain-image)" >> "$GITHUB_OUTPUT"

  paper:
    name: Paper A
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # On the runner itself: the paper is typeset in an image of its own, and the
    # toolchain image has no docker client to start it with. Go is the version
    # the research module declares.
    outputs:
      clean: ${{ steps.site.outputs.clean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          # The whole history: the paper's claims are proven at the commit it
          # describes, and its version names the commit it is built from.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: research/go.mod
          cache-dependency-path: research/go.sum
      - uses: ./.github/actions/just
      # One run of both recipes holds the paper to its checks once. The
      # submission is built last, and refuses a TBD left in the text: the build
      # writes the first on a line of its own, "PAPER-A-TBD: " and what is left,
      # and the named and the anonymous paper are built by then. Any other
      # failure fails the job.
      - name: Build the named and the anonymous paper, and the one for submission once no TBD is left
        run: |
          if just research paper-a paper-a-final 2>&1 | tee "$RUNNER_TEMP/paper.log"; then
              echo "The paper for submission was built." >> "$GITHUB_STEP_SUMMARY"
          else
              waits=$(sed -n '/^PAPER-A-TBD: /{s///p;q}' "$RUNNER_TEMP/paper.log")
              if [ -z "$waits" ]; then exit 1; fi
              echo "The paper for submission waits, as the text still holds a TBD: $waits." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Every run makes the named PDF ready for the site, and hands it on only
      # once the paper prints no placeholder: until then the page shows the
      # paper's title alone.
      - id: site
        name: Make the named paper ready for the site, and hand it on once it prints no placeholder
        run: |
          just _paper-to-site
          left=$(just _paper-placeholders)
          if [ -z "$left" ]; then
              echo "clean=true" >> "$GITHUB_OUTPUT"
              echo "The named PDF goes to the site with the page's data." >> "$GITHUB_STEP_SUMMARY"
          else
              echo "clean=false" >> "$GITHUB_OUTPUT"
              {
                  echo
                  echo "The page shows the paper's title alone, as the paper still prints $(wc -l <<< "$left") placeholders:"
                  echo
                  echo '```'
                  echo "$left"
                  echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Name what is handed on
        run: |
          processor=$(sed -n 's/^machine_processor=//p' research/experiments/perf/results/numbers.txt)
          {
              echo
              echo "Paper A, version of $(just research _paper-a-version), handed on as paper-a:"
              echo
              echo '```'
              for pdf in research/paper-a/build/*.pdf; do
                  job=$(basename "$pdf" .pdf)
                  pages=$(sed -n -E "s/^Output written on build\/$job\.pdf \(([0-9]+) pages?, .*/\1/p" "research/paper-a/build/$job.log")
                  echo "$(sha256sum < "$pdf" | cut -c1-64)  $job.pdf, $pages pages"
              done
              echo '```'
              echo
              echo "E-A4's times are those of the run the paper describes, on $processor."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-a
          path: research/paper-a/build/*.pdf
          retention-days: 7
          overwrite: true
      - name: Hand the named paper on to the page's data
        if: steps.site.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-a-site
          path: |
            site/research/paper-a.en.pdf
            site/research/paper.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      # The builds and their logs are kept when the paper fails: they show the
      # page that ran over, or the line that ran past the margins.
      - name: Keep the paper's builds
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-a-builds
          path: |
            research/paper-a/build/*.pdf
            research/paper-a/build/*.log
          retention-days: 14

  data:
    name: The page's data
    needs: [toolchain, paper]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # In the image the site is built in, so that the bench's build, and the key
    # its numbers are kept under, are those of the site's own builds.
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Fixed places for what Go downloads and builds, so that the paths the job
      # caches and the paths Go reads are the same ones.
      GOMODCACHE: /tmp/go/mod
      GOCACHE: /tmp/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      # What Go downloads and builds, on a pull request alone: a release builds
      # the bench from nothing an earlier run left behind.
      - if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-site-${{ hashFiles('go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      # The paper's facts go into the page's data beside the bench's numbers.
      - name: Take the named paper the site offers
        if: needs.paper.outputs.clean == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paper-a-site
          path: site/research
      # A pull request takes the numbers kept for the same build of the bench.
      # A release computes them from its commit with nothing an earlier run
      # kept, and keeps them for the pull requests after it when no run kept
      # them.
      - name: Make the data of the page "Research"
        uses: ./.github/actions/page-data
        with:
          restore: ${{ github.event_name == 'pull_request' }}
      - name: Name what is handed on
        run: |
          handed=(site/research/research.json)
          if [ -f site/research/paper-a.en.pdf ]; then handed+=(site/research/paper-a.en.pdf); fi
          {
              echo
              echo "Handed on as research-data:"
              echo
              echo '```'
              sha256sum "${handed[@]}"
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Both lie in site/research, which the artifact holds as its root.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-data
          path: |
            site/research/research.json
            site/research/paper-a.en.pdf
          retention-days: 7
          if-no-files-found: error
          # A job run again replaces what its first attempt handed on.
          overwrite: true

  # A pull request's site is built as a release's is, from the data and the
  # paper of the same run, and published by no one.
  site:
    name: Build the site
    needs: [toolchain, data]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with its tags, which the build is named by.
          fetch-depth: 0
          persist-credentials: false
      # A release's cards draw the version they are given, so a pull request's
      # name its build as a build between releases names itself, and its pages
      # weigh what a release's do.
      - id: build
        name: Name the build
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Build the site
        uses: ./.github/actions/site
        with:
          research: true
          version: ${{ steps.build.outputs.version }}
