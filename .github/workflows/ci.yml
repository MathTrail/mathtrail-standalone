# Every check that decides whether a change may be merged. The checks run inside the toolchain
# stage of the development image, so a verdict here and a verdict on a laptop come from the same
# tools at the same versions; the work itself lives in the justfile.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# A new push replaces the run of the branch it belongs to; on main every commit
# is checked, because that is the history a deployment is cut from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Settings every job needs, passed through the environment rather than written into
# a home directory, so that they hold for every step whatever user it runs as.
env:
  # Git refuses a repository whose files belong to somebody else, which is what a
  # checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  # Fixed places for what Go downloads and builds, so that the paths a job caches
  # and the paths Go reads are the same ones.
  GOMODCACHE: /tmp/go/mod
  GOCACHE: /tmp/go/build

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=$(just ci-toolchain-image)" >> "$GITHUB_OUTPUT"

  lint:
    name: Formatting and lint
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - run: just ci-lint
      - run: just load-lint
      - run: just learners-lint

  test:
    name: Tests
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - run: just ci-test
      - name: Send the coverage profile to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          slug: MathTrail/mathtrail-standalone
          # Coverage is something to read, not a gate: an upload that fails,
          # or a run with no token to upload with, does not fail the tests.
          fail_ci_if_error: false
      - name: Keep the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      - run: just load-test
      - run: just learners-test

  learners-guard:
    name: Student model guard
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      # The guard's table goes to the run's summary, and the pipe keeps the
      # guard's own exit as the step's: a number outside its band fails it.
      - run: just ci-learners | tee -a "$GITHUB_STEP_SUMMARY"

  widget:
    name: Widget
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: just ci-web
      # The report names its files from the repository's root, where both of its
      # readers look for them.
      - name: Send the widget's coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          slug: MathTrail/mathtrail-standalone
          fail_ci_if_error: false
      - name: Keep the widget's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-widget
          path: web/coverage/lcov.info
          retention-days: 14

  layout:
    name: Widget layout ${{ matrix.part }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job stays on the runner: the browsers run in an image of their own,
    # which needs a Docker daemon. The widget's packages are installed here, by
    # the Node the development image pins, and the image runs over them.
    #
    # On one runner the pages take some twenty minutes, nearly all of it the
    # browser drawing each page's cards on a single thread, and the two engines
    # slow each other down; six runners measure a sixth of them each, at once.
    # Every part runs to its end, so that a card that fails in one hides
    # nothing the others find.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - uses: ./.github/actions/node
      - run: just web-layout --shard ${{ matrix.part }}/${{ strategy.job-total }}
      # What the browsers found, and a picture of every card written right to
      # left, are kept whether the run passed or not: they are what is looked
      # at either way.
      - name: Keep what the layout showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: widget-layout-${{ matrix.part }}
          path: web/layout/
          retention-days: 14

  analytics:
    name: The SQL of the counts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # On the runner itself: the tests run the SQL against a BigQuery emulator
    # the recipe starts in a container of its own, and the toolchain image has
    # no docker client to start it with. Go is the version the module declares.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/just
      - run: just analytics-test

  sonar:
    name: Static analysis
    needs: [test, widget]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This one stays on the runner: the scanner installs itself here and has no
    # business inside the environment the code is built in.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: what makes a line "new" is which commit added it.
          fetch-depth: 0
      # The coverage the tests already measured, rather than a second run of them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-widget
          path: web/coverage
      # A pull request's run has the token only when it was given the secret:
      # not one from a fork, nor one Dependabot starts while the token is not
      # among the secrets kept for Dependabot. Such a run is not analysed, since
      # a check nobody can pass has no business being red, and what it changes
      # is analysed once it reaches main — where a missing token is a failure.
      - id: token
        run: echo "present=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.token.outputs.present == 'true' || github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mocks:
    name: Generated mocks
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - run: just ci-mocks-check

  dependencies:
    name: Vulnerabilities and licenses
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - run: just ci-vuln
      - run: just ci-licenses

  secrets:
    name: Secrets
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The whole history: a key that was committed and then removed is still
      # published, and a shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum', 'tools/load/go.sum', 'tools/learners/go.sum') }}
          restore-keys: go-
      - run: just ci-secrets

  image:
    name: Runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This one job stays on the runner: it needs a Docker daemon, and the docker client reaches
    # the development image through a devcontainer feature, which a plain build does not apply.
    # The image is built, asked for its widget, scanned and thrown away — nothing leaves the
    # runner. One run of just builds it once for both checks: a second run would stamp another
    # build date into it and build it again. Each recipe is given its tag, since a recipe that
    # takes one would read the next recipe's name as its tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - run: just ci-image-widget mathtrail:dev ci-image-scan mathtrail:dev
