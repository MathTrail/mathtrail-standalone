# Every check that decides whether a change may be merged. The checks run inside the toolchain
# stage of the development image, so a verdict here and a verdict on a laptop come from the same
# tools at the same versions; the work itself lives in the justfile.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# A new push replaces the run of the branch it belongs to; on main every commit
# is checked, because that is the history a deployment is cut from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Settings every job needs, passed through the environment rather than written into
# a home directory, so that they hold for every step whatever user it runs as.
env:
  # Git refuses a repository whose files belong to somebody else, which is what a
  # checkout inside a container looks like to it.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  # Fixed places for what Go downloads and builds, so that the paths a job caches
  # and the paths Go reads are the same ones.
  GOMODCACHE: /tmp/go/mod
  GOCACHE: /tmp/go/build

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=$(just ci-toolchain-image)" >> "$GITHUB_OUTPUT"

  lint:
    name: Formatting and lint
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - run: just ci-lint

  test:
    name: Tests
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - run: just ci-test
      - name: Send the coverage profile to Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          slug: MathTrail/mathtrail-standalone
          # Coverage is something to read, not a gate: an upload that fails,
          # or a run with no token to upload with, does not fail the tests.
          fail_ci_if_error: false
      - name: Keep the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  mocks:
    name: Generated mocks
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - run: just ci-mocks-check

  dependencies:
    name: Vulnerabilities and licenses
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - run: just ci-vuln
      - run: just ci-licenses

  secrets:
    name: Secrets
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The whole history: a key that was committed and then removed is still
      # published, and a shallow clone would not see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/go/mod
            /tmp/go/build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - run: just ci-secrets

  image:
    name: Runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This one job stays on the runner: it needs a Docker daemon, and the docker client reaches
    # the development image through a devcontainer feature, which a plain build does not apply.
    # The image is built and thrown away — nothing leaves the runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/just
      - run: just docker-build
