# The page of the techniques of olympiad problem solving, for a parent, in
# Japanese. Which techniques there are, their groups and order, the topics
# each one leads to, and each example's level and the answer its solver proves
# are the site's data; the words here follow them, technique by technique. The
# pictures of a technique's steps are laid out by the page, and only their
# words are here.

title: 算数オリンピックの解法：問題の考え方と解き方
description: 小学生向けの算数オリンピックの多くの問題に通用する解法と考え方を、それぞれ問題、図、くわしい解き方つきで紹介します。どの解法を試せばよいかのヒントもあります。

hero:
  title: 算数オリンピックで使える解法
  lead: >-
    算数オリンピックの問題には、決まった解き方がありません。そのかわり、多くの問題に共通して使える解法があります。ここでは、特によく使う{count}を、それぞれ問題、図、解き方とともに紹介します。
  advice: >-
    解き方を開く前に、お子さまと一緒に問題に挑戦してみてください。いちばん大切なのは、どの解法がうまくいったかに気づいて、次に出会ったときに見分けられるようにすることです。

start:
  title: どんな問題も、まずここから
  lead: >-
    解法を選ぶ前に、4つのステップをたどると役に立ちます。数学者ジョージ・ポリアが、著書『*いかにして問題をとくか*』（1945年）で示したステップです。
  steps:
    - title: 問題を理解する
      text: 自分の言葉で言ってみよう。わかっていることは何？求めるものは何？
    - title: 計画を立てる
      text: 何かに似ていない？このページのどの解法を試せそう？
    - title: 計画を実行する
      text: 一歩ずつ、それぞれの手順でわかったことを書きながら進めよう。
    - title: ふり返ってみる
      text: 答えを問題に当てはめてみよう。全部ぴったり合う？ほかの答えはないかな？

groups:
  see:
    title: 問題を見えるようにする
    lead: >-
      まず、問題を理解しなければなりません。ここにある解法は、言葉を図や表、小さな例に置きかえます。
  find:
    title: 答えを見つける
    lead: >-
      何が起きているかがわかったら、ここにある解法で、途中で何も取りこぼさずに答えまでたどり着けます。
  prove:
    title: 証明する
    lead: >-
      算数オリンピックの問題では、「いくつ」ではなく「ありえるか」と聞かれることがよくあります。そのときは数えるだけでは足りず、なぜそれ以外にはなりえないのかを説明しなければなりません。

techniques:
  draw:
    name: 図をかく
    what: >-
      絵や図にすると、言葉が目で見えるものに変わります。線と点と矢印があれば十分で、きれいにかく必要はありません。
    when: 「〜より○多い」、年齢、道のり、全体と部分。
    task: >-
      兄は妹より4才年上です。兄と妹の年れいを合わせると16才です。兄は何才ですか。
    steps:
      - 妹の年齢を帯で表し、兄の年齢は、それと同じ帯に4歳分をつけ足して表します。
      - 余分な4歳を取り除きます。16 − 4 = 12で、これが同じ長さの帯2本分です。
      - 帯1本分は12 ÷ 2 = 6歳で、これが妹の年齢です。兄は6 + 4 = 10歳です。
    answer: 兄は10歳です。
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: 上：妹、下：兄。合わせて16歳
      less: 16 − 4 = 12、同じ帯が2本
      found: 兄は6 + 4 = 10歳
    caption: >-
      図にすると、頭の中だけでは考えにくいことが見えてきます。余分な4歳を除けば、兄と妹は同じ年齢です。
  table:
    name: 表をつくる
    what: >-
      手がかりが多いと、全部を頭の中に置いておくのは大変です。表なら、代わりに覚えておいてくれます。手がかりはそれぞれバツ印になり、ある行に空いたマスが1つだけ残ったら、それが答えです。
    when: 何人かの人、いくつかのもの、「ない」のある手がかり。
    task: >-
      アオイ、ケンタ、リンは、ねこ、犬、インコのどれかを1ぴきずつ飼っています。アオイはねこを飼っていません。ケンタは犬がこわいです。ねこはケンタの家にはいません。だれがどのペットを飼っていますか。
    steps:
      - 手がかりごとにバツ印をつけます：アオイはねこではない、ケンタは犬ではない、ねこはケンタの家にいない。
      - ケンタの行に残った空きマスは1つだけで、それはインコです。だから、アオイもリンもインコは飼っていません。
      - アオイには犬が、リンにはねこが残ります。
    answer: アオイは犬、ケンタはインコ、リンはねこです。
    pictures:
      children:
        anya: アオイ
        borya: ケンタ
        vera: リン
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: ア
        borya: ケ
        vera: リ
      pets:
        cat: ねこ
        dog: 犬
        parrot: インコ
    caption: マスの中の小さな数字は、その印をつけた解き方の手順の番号です。
  small-numbers:
    name: 小さい数で試す
    aka: 特別な場合を考える
    what: >-
      数が大きくて、どこから手をつければよいかわからないときは、同じ問題を小さい数で解いてみます。きまりを見つけたら、それを大きい数に当てはめます。
    when: 大きな数、「100」「1000」、長い列。
    task: >-
      長さ100メートルの道にそって、5メートルごとに柱を立てます。両はしにも立てます。柱は何本いりますか。
    steps:
      - 100メートルの道はかけないので、10mの道で考えます。柱は0、5、10mのところに立つので、間が2つで柱は3本です。
      - 15mと20mでも同じです。柱はいつも、間の数より1本多くなります。
      - 100mでは間が100 ÷ 5 = 20あるので、柱は21本です。
    answer: 柱は21本です。
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: 10m：間2つ、柱3本
      fifteen: 15m：間3つ、柱4本
      twenty: 20m：間4つ、柱5本
      table: 道の長さ（m）、間の数、柱の数
    caption: >-
      きまりは短い道で、もう見えています。あとは、それを100メートルに当てはめるだけです。
  systematic:
    name: 順序よく書き出す
    what: >-
      思いついた順に書き出すと、きっと何かがもれたり、二重に数えたりします。順序よく書き出すときは、まずある特徴で、次にその次の特徴で、と順番に進めます。そのときは樹形図が便利です。
    when: 「何通り」「何個の数」「すべて書き出しなさい」。
    task: >-
      2、4、6、8の数字を使って2けたの数をつくります。どの数でも、同じ数字はくり返し使えません。ちがう数は何個できますか。
    steps:
      - 順番を決めます：まず十の位、次に一の位。
      - 十の位は2、4、6、8のどれかです。どれを選んでも、一の位には残りの3つが使えます。
      - 枝ごとに書き出します：24、26、28、42、46、48、62、64、68、82、84、86。もれなく、重なりなく書けています。
    answer: 数は12個です。
    pictures:
      first: 最初の数字は4つのうちのどれか
      total: 枝4本 × 3個 = 12
    caption: 樹形図なら何ももれません。最初の数字ごとに、それぞれの枝があるからです。
  backwards:
    name: 後ろから考える
    aka: 逆算
    what: >-
      お話の終わりがわかっていて、始めがどうだったかを聞かれたら、後ろから考えます。どの行動も反対にします。「食べた」は「返した」に、「かけた」は「わった」にします。
    when: 最後にどうなったかがわかっていて、最初にどうだったかを求めるとき。
    task: >-
      お皿にりんごがいくつかありました。マイがその半分を食べました。次にユウが、残りの半分と、さらに1個を食べました。りんごは2個残りました。はじめにりんごは何個ありましたか。
    steps:
      - わかっていることから始めます：最後に、りんごは2個でした。
      - ユウが食べる前の状態に戻します。さらに食べた分を返すと、2 + 1 = 3。これが半分だったので、6個ありました。
      - マイが食べる前の状態に戻します。6個が半分だったので、12個ありました。確かめ：12 → 6 → 6 − 3 − 1 = 2。
    answer: りんごは12個です。
    pictures:
      end: 最後
      undo-petya: +1、×2
      undo-tanya: ×2
      check: 確かめ：
    caption: >-
      右から左へ進み、すべてを反対にします。「半分食べた」は「2倍する」に、「もう1個食べた」は「1をたす」になります。
  all-the-same:
    name: 全部同じだと考える
    aka: つるかめ算
    what: >-
      問題に2種類のものが出てきたら、全部が1種類だと考えてみます。答えがどれだけずれるかを数えれば、いくつ入れ替えればよいかがわかります。
    when: 2種類のものと、わかっている合計：頭と足、金額のちがう2種類の硬貨。
    task: >-
      庭ににわとりとうさぎが歩いています。頭の数は合わせて10、足の数は合わせて28本です。庭にうさぎは何びきいますか。
    steps:
      - 10羽すべてがにわとりだと考えます。すると、足は10 × 2 = 20本です。
      - 実際には足は28本なので、8本多くなっています。
      - にわとりをうさぎに替えるたびに足は2本増えるので、うさぎは8 ÷ 2 = 4匹です。確かめ：4 × 4 + 6 × 2 = 28。
    answer: うさぎは4匹です。
    # What each counter under the problem stands for.
    legend:
      hen: にわとり（足2本）
      rabbit: うさぎ（足4本）
    pictures:
      guess: "= 足20本"
      short: 足りない足
      fits: うさぎ4匹とにわとり6羽：16 + 12 = 28本
    caption: >-
      まず全部同じだとして数え、それから、合うのに必要な数だけちょうど入れ替えます。
  pattern:
    name: きまりを見つける
    what: >-
      最初のいくつかを見て、くり返している部分を見つけます。くり返すまとまりがわかれば、間をすべてかかなくても、ずっと先まで一気に進めます。
    when: もよう、列、カレンダー：「20番目は何」「100番目は何」。
    task: >-
      旗が、赤、黄、緑、青、また赤、黄、緑、青と、この順にくり返しつるしてあります。23番目の旗は何色ですか。
    steps:
      - くり返すまとまりを見つけます：赤、黄、緑、青の4本です。
      - 23本は、4本のまとまり5つ分の20本と、あと3本です。
      - 23番目は、そのまとまりの3番目で、3番目はいつも緑です。
    answer: 緑です。
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21、22、23番目
    caption: >-
      23本の旗を全部かく必要はありません。その旗が4本のまとまりの何番目にあたるかがわかれば十分です。
  opposite:
    name: 反対を仮定する
    aka: 背理法
    what: >-
      あることがありえないと証明するには、ありえると仮定して、矛盾にぶつかるまで考えを進めます。正直者とうそつきの問題は、ほとんどがこの方法で解けます。
    when: 「ありえるか」「ありえないことを証明せよ」、だれが本当のことを言っているか。
    task: >-
      ある島には、いつも本当のことを言う正直者と、いつもうそをつくうそつきが住んでいます。アオイは「ケンタはうそつきです」と言いました。ケンタは「アオイもわたしも正直者です」と言いました。アオイとケンタは、それぞれ正直者ですか、うそつきですか。
    steps:
      - >-
        **ケンタが正直者だと仮定します**。すると、ケンタの言葉は本当なので、アオイも正直者です。ところが、正直者のアオイは、ケンタはうそつきだと言いました。**矛盾です**。
      - つまり、ケンタはうそつきで、その言葉はうそです。アオイとケンタがどちらも正直者、ということはありません。これなら、つじつまが合います。
      - アオイは「ケンタはうそつきです」と言い、それは本当です。本当のことを言うのは正直者だけなので、アオイは正直者です。
    answer: アオイは正直者で、ケンタはうそつきです。
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: ア
      borya: ケ
      anya-said: 「ケンタはうそつきです」
      borya-said: 「アオイもわたしも正直者です」
    pictures:
      said: 「ケンタはうそつきです」
      false: 「どちらも正直者」はうそ
      true: 「ケンタはうそつきです」は本当
    caption: 一方の道は行き止まりなので、もう一方が正しいのです。
  parity:
    name: 偶数・奇数に目をつける
    what: >-
      すべてを知らなくてもよいときがあります。数が偶数か奇数かがわかれば十分なのです。何かが動くたびに偶数と奇数が入れ替わるなら、その回数を見るだけで、どこにたどり着けて、どこにはたどり着けないかがすぐにわかります。
    when: ジャンプ、移動、入れ替え、「1つおき」「〜になりえるか」。
    task: >-
      バッタが数直線のゼロにいます。ジャンプするたびに、左か右にちょうど1だけ動きます。5回ジャンプしたあとで、ゼロにもどっていることはありますか。
    steps:
      - マスを偶数と奇数で交互に色分けします。
      - ジャンプするたびに色が変わります：偶数のマスから奇数のマスへ、そしてまた偶数のマスへ。
      - 5回のジャンプは奇数回なので、そのあとのバッタは必ず奇数のマスにいます。そしてゼロは偶数です。
    answer: いいえ、もどれません。
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: 青は偶数、オレンジは奇数、矢印はスタート地点
      jumps: 何回目のジャンプかと、そのあとのマスの色
      after: 5回目のジャンプのあとは、奇数のマスだけ
    caption: >-
      バッタがどこへ行ったかを正確に追う必要はありません。いるマスの色を追うだけで十分です。
  pigeonhole:
    name: ハトと巣箱
    aka: ハトの巣原理
    what: >-
      ハトが巣箱より多ければ、どこかの巣箱には少なくとも2羽のハトが入ります。当たり前に聞こえますが、確かめようがなさそうなことまで証明できます。
    when: 「必ずあることを証明せよ」「少なくとも2つ」「確実に」。
    task: >-
      さいころを何回ふれば、どれかの目が2回以上出ると確実に言えますか。
    steps:
      - さいころの目は6つあり、これが6つの「巣箱」です。振った結果が「ハト」です。
      - 6回振ったあとでも、出た目がすべて違うことはありえます：1、2、3、4、5、6。
      - 7回目には、空いている巣箱がもうありません。どれかの目がもう一度出るのです。だから7回です。
    answer: 7回です。
    pictures:
      throw: 青い点は、振った結果
      seventh: 7回目は、もう埋まっているマスに入る
    caption: 最初の6回がすべて違っても、7回目はそのどれかと同じになるしかありません。
  mirror:
    name: 相手のまねをする
    aka: 対称な作戦
    what: >-
      2人で対戦するゲームでは、相手の手を鏡に映したようにまねできる人が勝つことがよくあります。そうすれば、相手に打つ手がある限り、こちらにも必ず返す手があります。
    when: 2人で対戦するゲーム：「正しく打てばどちらが勝つか」。
    task: >-
      横一列に9つのマスがならんでいます。先手と後手が交代で、空いているマスにこまを置きます。ただし、こまのあるマスのとなりには置けません。こまを置けなくなったほうの負けです。後手がどう打っても勝つためには、先手は最初のこまをどこに置けばよいですか。
    steps:
      - 最初の手で、真ん中の5番目のマスにこまを置きます。
      - 相手のどの手にも、鏡に映した手で答えます：真ん中をはさんで反対側のマスです。
      - 相手が置いたマスが空いていて、こまの隣でなかったなら、鏡に映したマスも同じです。だから、先に打つ手がなくなるのは相手のほうです。
    answer: 真ん中の5番目のマスに置き、あとは相手の手をすべて鏡に映したようにまねます。
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: 先手
      second: 後手
      moves: 数字は何手目か
    pictures:
      answer: 後手が1番目に置けば、先手は9番目
      stuck: 空いたマスはどれも、こまの隣：後手の負け
    caption: >-
      列の真ん中は1つだけで、ほかのマスにはどれも鏡に映した相手のマスがあります。だから先手は、打つ手がなくなることがありません。

labels:
  when: 使える場面：
  task: 問題 · {grades}
  show: 解き方を見る
  hide: 解き方を閉じる
  topics: 関連するテーマ：

cues:
  title: どの解法を試すか
  lead: >-
    問題文の言葉から考えるヒントです。決まりではありません。多くの問題は、2つの解法のどちらでも解けます。
  if: 問題に…があれば
  try: …を試してください
  rows:
    - 「〜より○多い」、年齢、全体と部分
    - たくさんの人やもの、「ない」のある手がかり
    - 大きな数で、どこから始めればよいかわからない
    - 「何通り」「何個の数」
    - 終わりがわかっていて、聞かれているのは始め
    - 2種類のものと、その合計
    - 何かがくり返す：「20番目は何」
    - 「ありえるか」「ありえないことを証明せよ」
    - 「確実に」「少なくとも2つ」
    - 2人で対戦するゲーム：「どちらが勝つか」
