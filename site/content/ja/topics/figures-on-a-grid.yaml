# The page of the topic of figures on a square grid, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 方眼紙の図形
description: 方眼紙で考える面積とまわりの長さの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    方眼紙に図形をかいてみてください。図形はいくつのマスをおおい、ふちの長さはどれだけでしょう？こうした問題では、面積をマスの数で、まわりの長さをマスの辺の数で数えます。この2つは取りちがえやすく、長方形は角のマスがなくなっても、まわりの長さが変わらないことがあります。もれなく、重なりなく数えること、それが求められる力のすべてです。
  method: マスごとに外側の辺を数える
  teaches: 面積とまわりの長さを区別し、マスと辺をもれなく、重なりなく数える力
  # The words of its drawing: the figure over it, what each of its two copies
  # counts, and what the numbers in the cells mean.
  art:
    line: 3マスの図形
    area: 面積：3マス
    perimeter: まわりの長さ：辺8本
    out: 右の図の数字：そのマスの外側を向いた辺の数、3 + 2 + 3 = 8

basis:
  title: マス目のルール
  cards:
    - title: 面積はマスの数
      text: >-
        方眼紙にかいた図形の面積は、その図形がおおうマスの数です。半分のマス2つで、1マスになります。
      art:
        cells: 3マス
    - title: まわりの長さは辺の数
      text: >-
        まわりの長さは、ふちにあるマスの辺の数です。図形のマスどうしが共有する辺は内側にあるので、数えません。
      art:
        shared: 内側で共有する辺は数えない
    - title: 別のもの
      text: >-
        面積が同じでも、まわりの長さがちがう図形があります。一列に並んだ4マスのまわりの長さは10、正方形に並んだ4マスは8です。
      art:
        perimeter: まわりの長さ{count}

idea:
  title: 外側の辺を数える
  lead: どのマスにも辺は4本あります。辺がまわりの長さに入るのは、その辺の向こう側に図形のマスがないときだけです。
  table:
    head:
      - 図形
      - 面積（マス）
      - まわりの長さ（辺）
    rows:
      - - 1マス
        - "1"
        - "4"
      - - となり合う2マス
        - "2"
        - 4 + 4 − 2 = 6
      - - 一列に並んだ4マス
        - "4"
        - "10"
      - - 2 × 2の正方形
        - "4"
        - "8"
  note:
    title: なぜ大切か
    text: >-
      子どもはよく、まわりの長さとしてマスの数を数えたり、すべてのマスのすべての辺を数えて、共有する辺を二重に数えたりします。外側を向いた辺だけを数えれば、どちらの間違いも防げます。

method:
  title: 解き方：ふちをたどる
  lead: >-
    図形を方眼紙にかきます。面積は、マスを横の列ごとに数えます。まわりの長さは、ふちをひと回りたどりながら、通ったマスの辺を数えます。図形を切り分けるときは、もれも重なりも出ない順番で部分を書き出します。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 図形を方眼紙にかく
    - 面積はマスを、まわりの長さは外側の辺を数える
    - 別の数え方で確かめる
  # The key under the steps: what the drawings' lines and numbers mean.
  legend:
    border: ふち（まわりの長さ）
    cut: 切る線
    count: 数字：外側を向いた辺の数

examples:
  - title: 十字形
    question: >-
      5マスで十字形を作ります。まん中に1マスあり、その上下左右に1マスずつつけます。十字形のまわりの長さは、マスの辺何本分ですか。
    steps:
      - 十字の先の4マスには、外側を向いた辺がそれぞれ3本あるので、4 × 3 = 12本です。
      - まん中のマスには、外側を向いた辺がありません。どの辺も先のマスに接しているからです。
      - したがって、まわりの長さはマスの辺12本分です。
    answer: マスの辺12本分です。
    note:
      title: 別の数え方
      text: >-
        5マスの辺は、全部で5 × 4 = 20本です。まん中と先のマスの間の4本は、両方のマスから数えられて二重になっているうえ、内側にあります。20 − 2 × 4 = 12です。
    art:
      ends: 先の4マス、それぞれ3本
      middle: まん中：0
      border: ふち：12本
      inner: 赤：内側の4本
  - title: 帯を2つに
    question: >-
      たて2マス、横4マスの帯を、マス目の線にそって、4マスずつの2つの部分に切り分けます。どちらの部分も、ばらばらにならずにつながっていなければなりません。切り方は何通りありますか。
    steps:
      - まん中で横にまっすぐ切ると、4マスが一列に並んだ部分が2つできます。これで1通りです。
      - まん中でたてにまっすぐ切ると、2 × 2の正方形が2つできます。これで1通りです。
      - >-
        たて、横、たての順に切ると、L字形の部分が2つできます。段差はどちら向きにもできるので、2通りです。全部で4通りです。
    answer: 4通りです。
    note:
      title: なぜ8ではない？
      text: >-
        部分を1つずつ書き出すと、どの切り方も両方の部分から見つかるので、二重に数えてしまいます。最初の部分には左上のマスが入る、と決めておけば、どの切り方も一度だけ数えられます。
    art:
      along: 横に切る
      across: たてに切る
      step: 段差
      back: 逆向き
      same: 同じ切り方
      dot: 点は左上のマス。いつも青い部分に入る
  - title: 対角線
    question: >-
      方眼紙に、たて3マス、横5マスの長方形をかき、角から向かい合う角まで線を引きます。この線が通るマスは、何マスですか。線がマスの内側を通るときは数え、マスの角にふれるだけのときは数えません。
    steps:
      - >-
        角から角へ進むあいだ、線は、長方形の内側でマス目の線を横切るたびに、新しいマスに入ります。
      - >-
        線は、一方の向きの線を4本、もう一方の向きの線を2本横切り、2本を同時に横切ることはありません。3と5の公約数は1だけなので、途中でマス目の角（格子点）を通らないからです。
      - 線は1マスから始まり、さらに4 + 2 = 6マスに入るので、全部で7マスです。
    answer: 7マスです。
    note:
      title: マス目の角を通るとき
      text: >-
        たて4マス、横6マスの長方形では、線がマス目の角を通ります。そこでは2本の線を同時に横切り、入るマスは2つではなく1つです。線が通るマスは4 + 6 − 2 = 8マスです。2は、4と6の両方をわり切る数のうち、いちばん大きい数です。
    art:
      points: 点：対角線がマス目の線と交わるところ
      down: たての線4本
      across: 横の線2本
      green: 緑のマス：1 + 4 + 2 = 7マス
      node: 赤い点は格子点：8マス

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      同じものを二重に数えてしまいます。マスどうしが共有する辺をまわりの長さに加えたり、帯の切り方を、2つの部分それぞれについて書き出したりします。
    say: 「両側から数えている辺や切り方はない？」
    art:
      question: となり合う2マスのまわりの長さ
  missed_case:
    shows: >-
      場合がもれてしまいます。たとえば、段差が逆向きの切り方、へこんだ角にあるふちの一部、横向きのドミノのほかにある、たて向きのドミノです。
    say: 「まだ試していない方法はない？逆向きはどう？」
    art:
      question: 2 × 4の帯の切り方
  ignored_condition:
    shows: >-
      条件を見落としてしまいます。ばらばらになった部分をひとまとまりの部分として数えたり、角でふれているだけのマスをとなりのマスとして数えたり、線がふれるだけのマスを通ったとしたりします。
    say: 「この部分やこのマスは、本当に問題の条件に合っている？」
    art:
      question: どの部分もひとつながり
      broken: 青い部分がばらばら
      whole: どちらの部分もひとつながり

home:
  - title: 方眼紙
    text: >-
      方眼紙を手もとに置いて、4マスや5マスの図形を一緒にかいてみましょう。ふちがいちばん長いのはどれ？いちばん短いのはどれ？
  - title: ふちをたどる
    text: >-
      指でふちを1辺ずつたどりながら、まわりの長さを数えます。それから、各マスの外側の辺を数え、両方の数が合うか確かめましょう。
  - title: 切って数える
    text: >-
      紙の帯を、同じ大きさの2つの部分に、見つけられるだけ多くの方法で切ってみましょう。もれも重なりもないように並べます。

# What a parent can write in the chat to get a task on this topic.
ask: 方眼紙の図形の問題を出してください
