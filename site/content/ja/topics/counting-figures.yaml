# The page of the topic of counting figures, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "図形を数える"
description: "図形を数える問題やマッチ棒パズルとはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。"
hero:
  lead: "数本の線でかいた絵には、ぱっと見たよりも多くの三角形や正方形がかくれています。小さいものもあれば、いくつかの部分でできた大きいものもあります。こうした問題では、それをすべて数えたり、形を変えるにはどのマッチ棒を取ればよいかを考えたりします。大きさごとに、小さいほうから数えることがすべてです。"
  method: "大きさごとに、小さいほうから数える"
  teaches: "どの図形も一度だけ、もれなく重なりなく数える力"
  art:
    count: "小さい正方形4つと大きい正方形1つ：5"
basis:
  title: "どれが図形として数えられるか"
  cards:
    - title: "大きいものも数える"
      text: "2×2マスの正方形には、小さい正方形が4つと、それをかこむ大きい正方形が1つあります。いくつかの部分でできた図形も数えます。"
      art:
        count: "4 + 1 = 5つの正方形"
    - title: "辺は線の上に"
      text: "三角形は、どの辺も絵の線の上にあるときだけ数えます。正方形に角から角へ2本の線を引くと、三角形は8つできます。"
      art:
        count: "小さいもの4つと2つ分のもの4つ：8"
    - title: "マッチ棒1本は辺1つ"
      text: "マッチ棒の正方形どうしがとなり合うところでは、マッチ棒1本を共有します。正方形3つの列には、12本ではなく10本いります。"
      art:
        count: "3 + 3 + 4 = 10本"
idea:
  title: "大きさごとに数える"
  lead: "図形を大きさの順にならべます。まずいちばん小さいもの、次に2つ分のもの、それから大きいものを数えて、たし合わせます。"
  table:
    head:
      - "絵"
      - "いちばん小さいもの"
      - "大きいもの"
      - "全部"
    rows:
      - - "2×2マスの正方形"
        - "4"
        - "1"
        - "5"
      - - "3×3マスの正方形"
        - "9"
        - "4 + 1"
        - "14"
      - - "2×3マスの長方形"
        - "6"
        - "2"
        - "8"
  note:
    title: "なぜ大切か"
    text: "子どもは小さい図形だけを数えたり、大きい図形をその2つの部分から2回数えたりしがちです。大きさごとに進め、大きさごとに数を書いておけば、どちらも防げます。"
method:
  title: "解き方：小さいほうから"
  lead: "絵にありうる図形の大きさをすべて挙げ、大きさごとに数えてから、たし合わせます。マッチ棒なら、それぞれのマッチ棒がどの正方形の辺になっているかを考えます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。"
  steps:
    - "いちばん小さい図形を見つけて数える"
    - "大きい図形を大きさの順に数える"
    - "たし合わせ、数えわすれた大きさがないか確かめる"
examples:
  - title: "頂点からの2本の線"
    question: "三角形の上の角から底辺まで、2本の線がのびています。絵の中に三角形はいくつありますか。"
    steps:
      - "2本の線で、三角形は小さい三角形3つに分かれます。"
      - "となり合う小さい三角形2つで1つの三角形になり、そういう組が2つあります。"
      - "三角形全体がもう1つです。全部で 3 + 2 + 1 = 6 です。"
    answer: "6個です。"
    note:
      title: "すばやい確かめ方"
      text: "ここではどの三角形も、頂点は上の角に、底辺は下の線の上にあります。下の線には点が4つあり、そのうち2つを選ぶと底辺が決まります。その選び方は6通りです。"
    art:
      count: "3 + 2 + 1 = 6"
  - title: "3×3の正方形"
    question: "3×3マスの正方形が、すべての線とともにかかれています。いろいろな大きさの正方形は、全部でいくつありますか。"
    steps:
      - "1マスの正方形は、3つずつ3列で9つです。"
      - "2×2の正方形は、2か所ずつ2列に入るので4つです。"
      - "3×3の正方形全体がもう1つです。全部で 9 + 4 + 1 = 14 です。"
    answer: "14個です。"
    note:
      title: "9ではない"
      text: "9は小さい正方形だけを数えた数です。いくつかのマスでできた正方形も正方形です。"
    art:
      sizes: "1マスが9つ、2×2が4つ、3×3が1つ"
  - title: "取るマッチ棒"
    question: "12本のマッチ棒で2×2マスの正方形が作ってあります。どんな大きさの正方形も残らないようにするには、少なくとも何本のマッチ棒を取ればよいですか。"
    steps:
      - "正方形は5つあります。小さい4つと大きい1つです。"
      - "マッチ棒1本はせいぜい2つの正方形の辺なので、2本では多くても4つしかこわせず、1つが残ります。"
      - "内側でたてに立っている2本で小さい正方形4つがこわれ、上の1本で大きい正方形がこわれます。だから3本です。"
    answer: "3本です。"
    note:
      title: "2本ではだめなわけ"
      text: "マッチ棒1本でこわれる正方形は1つか2つで、こわす正方形は5つあるので、2本では足りません。"
    art:
      taken: "点線のマッチ棒を取る"
traps:
  missed_case:
    shows: "ある大きさの図形を見落とします。小さい正方形をかこむ大きい正方形や、2つ分の三角形などです。"
    say: "「いくつかの部分でできた大きい図形はない？」"
  double_count:
    shows: "同じ図形をその2つの部分から2回数えたり、共有するマッチ棒を両方の正方形で数えたりします。"
    say: "「この図形はもう数えた？」"
  stopped_early:
    shows: "いちばん小さい図形や、正しそうに見えた最初の答えで数えるのをやめてしまいます。"
    say: "「ほかの大きさの図形はない？」"
home:
  - title: "方眼紙"
    text: "2×2マスの正方形を一緒にかいて、その中の正方形を数えてみましょう。次は3×3でやってみましょう。"
  - title: "マッチ棒"
    text: "マッチ棒や棒で正方形の列を作ってみましょう。正方形4つには何本いるでしょう？5つなら？"
  - title: "大きさごとに"
    text: "数えるときは、小さいもの、2つ分のもの、大きいもの、と大きさを声に出しましょう。数を書いて、たし合わせましょう。"
ask: "図形を数える問題を出してください"
