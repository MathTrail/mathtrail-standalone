# The page of the topic of cubes and paper, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "立方体と紙"
description: "立方体の展開図や紙を折る問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。"
hero:
  lead: "6つの正方形でできた平らな展開図は、組み立てると立方体になります。折った紙に一度穴をあけて開くと、穴がいくつもあらわれます。列の上をころがるさいころの上の目は、前もって求めることができます。こうした問題は、折る、ころがす、開くようすを一歩ずつ思いうかべて解きます。"
  method: "一歩ずつ、折る・ころがす・開く"
  teaches: "平らな形が立体になるようすと、その逆を思いうかべる力"
  art:
    opposite: "1と5が向かい合う"
basis:
  title: "折るときのきまり"
  cards:
    - title: "向かい合う面はとなり合わない"
      text: "展開図で、同じ列にあって間に正方形を1つはさむ2つの正方形は、立方体の向かい合う面になります。"
      art:
        opposite: "3と6が向かい合う"
    - title: "折ると重なりが2倍になる"
      text: "一度折った紙は、折って重ねたところが2枚重ねに、もう一度折ると4枚重ねになります。穴はどの紙にもあきます。"
      art:
        holes: "2回折って、4枚、穴4つ"
    - title: "さいころは7になる"
      text: "さいころでは、向かい合う面の目をたすと7になります。1と6、2と5、3と4です。"
      art:
        bottom: "上が2、下が5"
idea:
  title: "一歩ずつ進む"
  lead: "頭の中で一歩ずつ折り、ころがし、開いて、一歩ごとに何が起きるかを確かめます。"
  table:
    head:
      - "すること"
      - "変わること"
    rows:
      - - "展開図の正方形を1つ折り上げる"
        - "立方体の次の面になる"
      - - "紙を1回折る"
        - "重なったところの枚数が2倍になる"
      - - "さいころを辺で1回たおす"
        - "横の面が上に来る"
      - - "さいころをまっすぐ2回たおす"
        - "下の面が上に来る"
  note:
    title: "なぜ大切か"
    text: "子どもは結果をいっぺんに当てようとしがちです。一歩ずつはやさしく、一つずつたどれば当てずっぽうはいりません。"
method:
  title: "解き方：一回ずつ折る"
  lead: "最初に来る正方形、折り目、ころがしを決め、それで何が起きるかを言ってから、次に進みます。できれば紙の展開図を切りぬいたり、本物のさいころを使ったりして確かめましょう。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。"
  steps:
    - "最初の正方形、折り目、ころがしを選ぶ"
    - "それで面や紙の重なりがどうなるかを言う"
    - "一歩ずつ進め、紙やさいころで確かめる"
examples:
  - title: "向かい合う面"
    question: "立方体の展開図は十字の形です。上から1、2、3、4と番号のついた4つの正方形がたてにならび、正方形2の両側に正方形5と6があります。組み立てると、2と向かい合うのはどの数ですか。"
    steps:
      - "正方形1と3は、たての列で2のとなりにあるので2とくっつきます。"
      - "正方形5と6は2の両側にあるので、これも2とくっつきます。"
      - "正方形4は2の2つ下にあり、間に3をはさむので、2と向かい合います。"
    answer: "4です。"
    note:
      title: "紙で確かめる"
      text: "十字を方眼紙にかいて切りぬき、組み立ててみましょう。2と4が向かい合います。"
    art:
      opposite: "2と4が向かい合う"
  - title: "2回折って穴1つ"
    question: "正方形の紙を半分に折り、もう一度半分に折ります。折った紙に穴を1つあけます。紙を開くと、穴はいくつありますか。"
    steps:
      - "1回目に折ると2枚重ねになります。"
      - "2回目に折ると2倍の4枚重ねになります。"
      - "穴は4枚すべてにあくので、開いた紙には穴が4つあります。"
    answer: "4つです。"
    note:
      title: "穴の場所"
      text: "穴は紙の4つの区画に1つずつあり、どれも折り目をはさんでとなりの穴と鏡にうつしたような位置にあります。"
    art:
      holes: "区画ごとに穴が1つ"
  - title: "ころがるさいころ"
    question: "さいころの上の目が2です。辺を軸にまっすぐ前へ2回たおします。さいころの向かい合う面の目をたすと7になります。いま上の目はいくつですか。"
    steps:
      - "1回目で、うしろの面が上に来ます。"
      - "2回目で、はじめに下にあった面が上に来ます。"
      - "下にあったのは2と向かい合う目なので、7 − 2 = 5 です。"
    answer: "5です。"
    note:
      title: "4回たおすと"
      text: "さらに2回たおすと、2がまた上に来ます。まっすぐころがすと、上の面は4回ごとにもどってきます。"
    art:
      top: "上が5"
traps:
  missed_case:
    shows: "面や紙の重なりや場合を見落とします。折るとほかの正方形とくっつく正方形や、穴がつきぬける重なりなどです。"
    say: "「まだ数えていない面や重なりはない？」"
  ignored_condition:
    shows: "問題のきまりを見失います。となり合う正方形を向かい合う面だと考えたり、さいころの向かい合う面の和が7であることをわすれたりします。"
    say: "「これは問題のきまりに合っている？」"
  stopped_early:
    shows: "解き方が一歩手前で止まります。1回目に折ったところや、さいころを1回たおしたところで終えてしまいます。"
    say: "「まだ一歩残っていない？」"
home:
  - title: "紙の展開図"
    text: "6つの正方形の十字をかいて切りぬき、立方体に組み立ててみましょう。どの正方形が向かい合いましたか。"
  - title: "折って穴をあける"
    text: "紙を2回折り、えんぴつで穴を1つあけて、開く前に穴の数を一緒に当ててみましょう。"
  - title: "本物のさいころ"
    text: "さいころを一緒に見て、どの目が向かい合っているかを調べましょう。机の上でころがし、見る前に上の目を言ってみましょう。"
ask: "立方体と紙の問題を出してください"
