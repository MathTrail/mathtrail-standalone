# The page of the topic of parity and alternation, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 偶奇と交互
description: 偶数・奇数や、交互に入れかわるものの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words the page's drawings say of a number and of a corner of the cube.
art:
  even: 偶数
  odd: 奇数
  start: 出発点

hero:
  lead: >-
    15人の子どもが輪になって、男の子、女の子、男の子、女の子と、ぐるりと一周交互に並ぶことはできるでしょうか。こうした問題では、全部を数えたり、あらゆるやり方を試したりしなくても、偶数か奇数かで答えがわかります。たとえば、フェリーがどちらの岸にいるか、その得点がありえるか、最後の一手をだれが打つか、です。多くの子どもにとって偶奇は、手がどう進んでも変わらないものとの、初めての出会いです。
  method: 一手ごとに、偶数・奇数がどうなるかを見る
  teaches: すべてのやり方を試さずに、「ありえる？」に答える力
  # The words of its drawing: who takes turns, the key of the colours, and
  # what the two circles show.
  art:
    line: 男の子と女の子が輪になって交互に並ぶ
    boy: 男の子
    girl: 女の子
    six: 6人：できる
    five: 5人：できない
    even: 輪になって交互に並べるのは、子どもが偶数人のときだけ

basis:
  title: 偶数と奇数のルール
  cards:
    - title: 偶数はペアに分けられる
      text: >-
        偶数個のものは、あまりを出さずにペアに分けられます。奇数個のときは、必ず1つがペアになれずに残ります。
    - title: 大事なのは奇数だけ
      text: >-
        偶数と偶数をたすと偶数、奇数と奇数をたすと偶数、偶数と奇数をたすと奇数です。だから、和が偶数かどうかは、その中に奇数がいくつあるかだけで決まります。
    - title: 交互に並ぶ
      text: >-
        2種類のものが交互に並ぶとき、片方は奇数番目に、もう片方は偶数番目に来ます。輪の上でぐるりと一周交互に並べるのは、場所の数が偶数のときだけです。
      art:
        places: 男の子は奇数番目、女の子は偶数番目

idea:
  title: 奇数だけを数える
  lead: 和が偶数かどうかを知るのに、たし算をする必要はありません。その中に奇数がいくつあるかを数えます。
  table:
    head:
      - たし算
      - 奇数の個数
      - 和は
    rows:
      - - 4 + 6 + 8
        - なし
        - 偶数
      - - 3 + 5
        - "2"
        - 偶数
      - - 3 + 5 + 7
        - "3"
        - 奇数
      - - 1 + 2 + … + 10
        - "5"
        - 奇数
  note:
    title: なぜ大切か
    text: >-
      算数オリンピックの問題には、そもそもそれが起こりうるかどうかを聞くものがたくさんあります。偶奇を使えば、やり方を試さなくても「ありえない」と答えられます。どの手でも数が偶数のままなのに、目標ではその数が奇数でなければならないなら、どんな手を打ってもそこへはたどり着けません。

method:
  title: 解き方：偶数か奇数かを追う
  lead: >-
    問題の中から、偶数か奇数かになる数を見つけます。ものの数、和、列の中の位置などです。一手ごとに、また手順ごとに、その数が変わるのか変わらないのかを見て、はじめと目標を比べます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 偶数か奇数かになるものを見つける
    - 手順ごとに、それがどうなるかを見る
    - はじめと目標を比べる

examples:
  - title: フェリー
    question: >-
      フェリーが車を乗せて、川を何度も行ったり来たりしています。はじめは左の岸にいます。川を7回わたったあと、フェリーはどちらの岸にいますか。
    steps:
      - 1回わたると、フェリーは右の岸に、2回わたると左の岸にもどります。
      - >-
        2回わたるたびに、出発した岸にもどります。だから、わたった回数が偶数なら左の岸、奇数なら右の岸にいます。
      - 7は奇数なので、フェリーは右の岸にいます。
    answer: 右の岸です。
    badge: →
    note:
      title: 数えればいいのでは？
      text: >-
        7回なら、数えてもすぐです。でもこのきまりなら、100回でも同じくらいすぐに答えられます。もっと難しい問題で必要になるのは、このきまりのほうです。
    art:
      start: はじめは左の岸
      none: 0回
      one: 1回
      two: 2回
      left: 左の岸
      right: 右の岸
  - title: 4本のダーツ
    question: >-
      リクは、輪ごとに1点、3点、5点、7点がもらえる的に、ダーツを4本投げました。ダーツはどれも的に当たりました。リクは15点取ったと言っています。それは本当にありえますか。
    steps:
      - どの輪の得点も奇数です。
      - >-
        奇数と奇数をたすと偶数です。ダーツ4本はペア2組で、どのペアも得点は偶数なので、4本合わせた得点も偶数になります。
      - 15は奇数なので、リクがその得点を取ったはずはありません。
    answer: ありえません。
    badge: ✕
    note:
      title: では、3本なら？
      text: >-
        奇数を3つたすと奇数になるので、15点はありえます。5 + 5 + 5や、7 + 7 + 1です。
    art:
      darts: 4本とも的に当たった
      rings: どの輪も奇数
      only-even: 4本では偶数の得点にしかならない
  - title: 立方体の上のクモ
    question: >-
      クモが、針金でできた立方体の頂点にいます。クモは1分ごとに辺を1本はって、となりの頂点へ動きます。ちょうど7分後に、出発した頂点にもどっていることはありますか。
    steps:
      - >-
        頂点に色をぬります。出発点を白、そのとなりを黒、さらにそのとなりを白、というように続けます。図のように、どの辺も黒い頂点と白い頂点を結んでいます。
      - >-
        だから、クモが動くたびに色が変わります。1分後のクモは黒、2分後は白、そして奇数分後なら、いつも黒い頂点にいます。
      - 7は奇数で、出発点は白です。クモはもどれません。
    answer: もどれません。
    badge: ✕
    note:
      title: では、8分後なら？
      text: >-
        もどれます。1本の辺を行って帰るのを4回くり返せば、出発点にもどります。色でわかるのは、できないときです。偶数分あれば足りることは、それとは別に示さなければなりません。
    art:
      edge: 1分に辺を1本
      minutes: 分：偶数分は白い頂点、奇数分は黒い頂点
      seven: 7分後
      back: 行って帰る × 4
      eight: 8分

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_parity:
    shows: >-
      偶数と奇数が入れかわってしまいます。7回わたったフェリーは出発した岸にもどっていると考えたり、奇数を4つたすと奇数になると考えたりします。
    say: 「小さい数で試してみよう。1回わたったら、フェリーはどこ？2回なら？」
    art:
      question: 7回わたったら、フェリーはどこ？
  ignored_condition:
    shows: >-
      問題の条件が1つ抜け落ちます。3本のダーツで15点を出して、リクが投げたのは4本だったことを忘れたり、片方の手がかりには合っても、もう片方には合わない数を選んだりします。
    say: 「もう一度問題を読んでみよう。その答えは、問題のどの言葉にも合っている？」
    art:
      question: ダーツ：4本
      three: 3本
      always: いつも偶数
  off_by_one:
    shows: >-
      列の中の位置を、1つずらして数えてしまいます。出発したときを1回目として数えたり、男の子で始まり男の子で終わる列に、男の子と女の子が同じ数いると考えたりします。
    say: 「最初のいくつかを書き出してみよう。1番目はどれ？」
    art:
      equal: 同じ数ずつ

home:
  - title: 奇数か偶数か？
    text: >-
      ボタンをひとつかみ、にぎった手の中にかくして、お子さまに当ててもらいましょう。きすうかな、ぐうすうかな？そのあと、ボタンをペアにして並べ、一緒に確かめます。
  - title: 10手目はだれ？
    text: >-
      2人が交互に手を打つゲームなら、どんなゲームでも、終わる前に聞いてみましょう。10手目を打つのはだれ？15手目は？最後まで遊ばなくても、偶数か奇数かで答えがわかります。
  - title: 家の番号
    text: >-
      通りに並ぶ家の番号を見てみましょう。片側は偶数、反対側は奇数です。37番の家はどっち側？

# What a parent can write in the chat to get a task on this topic.
ask: 偶奇と交互の問題を出してください
