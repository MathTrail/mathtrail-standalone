# The page of the topic of clocks, for a parent, in Japanese. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: 時計と時間
description: 時刻と時間を求める、時計と時間の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words the page's drawings write a length of time in.
art:
  minutes: "{count}分"
  hours: "{count}時間"
  both: "{hours}時間{minutes}分"

hero:
  lead: >-
    散歩が4:50に始まり、25分続きます。終わるのは何時何分でしょう？こうした時刻と時間の問題で、子どもは時間をたしたりひいたりします。気をつけたいのは、1時間が100分ではなく60分だということです。間違いがいちばん多いのは、ちょうどの時刻や正午、午前0時をまたぐところです。
  method: ちょうどの時刻まで進め、そこから先へ進む
  teaches: ちょうどの時刻や午前0時をまたいで時間を数え、時刻と時間を見分ける力
  # The words of its drawing: the walk over it, and what its line of time
  # shows under it.
  art:
    line: "4:50から25分間の散歩"
    whole: まずちょうどの時刻まで、それから先へ

basis:
  title: 時計のルール
  cards:
    - title: 1時間は60分
      text: >-
        100分ではありません。ですから8:50の20分後は8:70ではなく9:10、110分は1時間10分ではなく1時間50分です。
    - title: ちょうどの時刻を通る
      text: >-
        ちょうどの時刻をまたいで時間をたすときは、まずちょうどの時刻まで進め、残りをそのあとでたします。8:50からなら、9:00まで10分、そこからさらに10分です。
    - title: 1日は24時間
      text: >-
        23:59の次は、次の日の0:00です。22:00から6:00までは、午前0時までの2時間と、そのあとの6時間です。
      art:
        midnight: "0:00は午前0時、次の日の始まり"

idea:
  title: ちょうどの時刻を通る
  lead: ある時刻から別の時刻まで、どれだけの時間がたつでしょう？途中で、ちょうどの時刻に一度止まります。すると、難しいひき算が、やさしい2つの手順に変わります。
  table:
    head:
      - いつからいつまで
      - ちょうどの時刻を通って
      - かかる時間
    rows:
      - - "8:40から9:15まで"
        - 20分 + 15分
        - 35分
      - - "10:50から12:30まで"
        - 10分 + 1時間30分
        - 1時間40分
      - - "22:30から6:00まで"
        - 1時間30分 + 6時間
        - 7時間30分
  note:
    title: なぜ大切か
    text: >-
      9:15 − 8:40のように時刻どうしを筆算でひくと、子どもはつい、60分ではなく100分をくり下げてしまいます。ちょうどの時刻を通って数え進めれば、そうはなりません。

method:
  title: 解き方：時間の数直線
  lead: >-
    線をかき、時刻を順に書きこみます。早い時刻ほど左です。まずちょうどの時刻まで進め、次に時間単位で進め、最後に残りの分をたします。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 時刻を線の上に、早いほうから並べる
    - ちょうどの時刻まで進め、そこから先へ進む
    - 進んだ時間をたし、答えが前か後か、正しい向きになっているかを確かめる
  # The key under the steps: what the drawings' boxes and arrows mean.
  legend:
    whole: ちょうどの時刻
    lasts: かかる時間

examples:
  - title: 水泳教室
    question: >-
      トモの水泳教室は3:45に始まり、40分間続きます。何時何分に終わりますか。
    steps:
      - "3:45から、ちょうどの時刻の4:00までは15分です。"
      - "4:00のあとに、40 − 15 = 25分が残ります。"
      - "4:00の25分後は4:25です。"
    answer: "4:25です。"
    note:
      title: なぜ3:85ではない？
      text: >-
        45 + 40 = 85ですが、時計に85分はありません。60分になると、次の時に切りかわります。先にちょうどの時刻まで進めれば、こんな時刻は出てきません。
    art:
      start: 教室の始まり、40分間
      split: 40分 = 4:00までの15分 + そのあとの25分
      never: こんな時刻はない
      right: 正しい
  - title: チェス大会
    question: >-
      チェス大会では、試合が5回あります。どの試合も50分で、試合と試合の間には15分の休けいがあります。最初の試合は10:00に始まります。最後の試合が終わるのは何時何分ですか。
    steps:
      - "50分の試合が5回なので、試合の時間は5 × 50 = 250分です。"
      - >-
        休憩は試合と試合の間にしかないので、5回ではなく4回です。4 × 15 = 60分。
      - >-
        250 + 60 = 310分で、これは5時間10分です。10:00の5時間10分後は15:10です。
    answer: "15:10です。"
    note:
      title: なぜ13:10ではない？
      text: >-
        310分は3時間10分ではありません。1時間は100分ではなく60分です。310 = 5 × 60 + 10。
    art:
      round: 試合、50分
      break: 休憩、15分
      rounds: 5 × 50 = 250分
      breaks: 休憩は試合より1回少ない：4 × 15 = 60
      total: 310分 = 5 × 60 + 10
      hours: 60分ずつの5時間と、あと10分
  - title: 2つの町
    question: >-
      おばあちゃんが、別の町に住むユイに会いに、飛行機で出かけます。飛行機は、おばあちゃんの町の時計で8:00に飛び立ち、ユイの町の時計で8:30に着陸します。ユイの町の時計は、おばあちゃんの町の時計より4時間おくれています。飛行時間は何時間何分ですか。
    steps:
      - >-
        8:00と8:30は別々の時計で読んだ時刻です。そこでまず、両方の時刻をおばあちゃんの時計にそろえます。
      - "ユイの町の時計が8:30を指すとき、おばあちゃんの町の時計は4時間進んだ12:30を指しています。"
      - "同じ時計で見ると、8:00から12:30までは4時間30分です。"
    answer: 4時間30分です。
    badge: "4:30"
    note:
      title: 30分？
      text: >-
        8:30 − 8:00が30分になるのは、両方の時刻が同じ時計のものであるときだけです。別々の町の時刻は、一方をもう一方の時計にそろえてから比べます。
    art:
      take-off: おばあちゃんの町で離陸
      landing: ユイの町で着陸
      grandma-clock: おばあちゃんの時計
      ann-clock: ユイの時計
      at-ann: ユイの町
      at-grandma: おばあちゃんの町
      grandma: 祖母
      ann: ユイ
      other: 別々の時計

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_operation:
    shows: >-
      問題が求めていない計算をしてしまいます。時刻どうしを量のようにたして3時と5時で8時にしたり、数え進めるだけでよいところでかけ算をしたりします。時刻は線の上の点で、量ではありません。
    say: 「これは時刻？それとも時間？」
    art:
      question: "3:00から5:00まで、何時間？"
  time_unit_mixup:
    shows: >-
      1時間に100分あるかのように分を数えてしまいます。3:45の40分後が3:85になったり、310分が3時間10分になったりします。
    say: 「1時間は何分？」
    art:
      question: "3:45の40分後"
  reversed_relation:
    shows: >-
      前と後が入れかわってしまいます。問題は先へ進むのに逆向きに数えたり、ひくべき時差をたしたりして、飛行機が離陸より前に着陸することになります。
    say: 「答えは始まりより前？それとも後？」
    art:
      question: おばあちゃんの時計で8:00に離陸
      before: 離陸より前に着陸？

home:
  - title: 針のある時計
    text: >-
      お子さまから見えるところに針のある時計を置いて、ふとしたときに聞いてみましょう。15分後は何時何分？20分前は何時何分だった？
  - title: あとどれくらい？
    text: >-
      アニメや散歩の前に、あとどれくらい待つのかを一緒に予想して、時計で確かめましょう。本当に待ってみると、分の長さが実感できます。
  - title: 一日の予定
    text: >-
      休みの日の予定を、時刻を入れて書いてみましょう。11:30から12:15まで散歩、12:30に昼ごはん。それぞれ何分かかる？その間は何分ある？

# What a parent can write in the chat to get a task on this topic.
ask: 時計と時間の問題を出してください
