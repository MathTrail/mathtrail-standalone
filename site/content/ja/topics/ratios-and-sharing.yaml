# The page of the topic of ratios and sharing, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 比と比例配分
description: 比の問題とも呼ばれる、比と比例配分の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words the page's drawings name their people and boxes in.
art:
  ann: ユイ
  ben: リク
  a: A
  b: B

hero:
  lead: >-
    ユイとリクが、35個のあめを3:4の比で分けます。それぞれ何個もらえますか。こうした問題の比が表すのは、物の数ではなく、それぞれが同じ大きさの部分をいくつずつもらうかです。先に部分の数を数え、1つ分がいくつかを求めれば、どの比の問題もわり算になります。
  method: 部分の数を数えてから、1つ分を求める
  teaches: 比を同じ大きさの部分としてとらえ、レシピの分量を増やしたり減らしたりする力
  # The words of its drawing: what is shared over it, and what the parts come
  # to under it.
  art:
    line: 35個のあめを3:4の比で
    parts: 7つ分 = 35、1つ分 = 5
    shares: ユイは3 × 5 = 15、リクは4 × 5 = 20

basis:
  title: 比のルール
  cards:
    - title: 比は部分の数を表す
      text: >-
        3:4とは、同じ大きさの部分で数えて、一方が3つ分なら、もう一方は4つ分ということです。合わせると7つ分で、3つ分でも4つ分でもありません。
      art:
        seven: 3:4は合わせて7つ分
    - title: まず1つ分
      text: >-
        全体を部分の数でわって1つ分を求めてから、それにそれぞれの部分の数をかけます。35 ÷ 7 = 5なので、3つ分は15、4つ分は20です。
      art:
        one: 1つ分は35 ÷ 7 = 5
    - title: 両方に同じ数をかける
      text: >-
        比の両方の数に同じ数をかけても、比は変わりません。3:4は、6:8とも30:40とも同じです。レシピの分量も、こうして増やします。

idea:
  title: 部分の数を数える
  lead: どんな比でも、まず比の数をたします。その合計が、全体を同じ大きさに分けた部分の数です。
  table:
    head:
      - 分けるもの
      - 部分の数
      - 1つ分と分け前
    rows:
      - - あめ35個、3:4
        - 3 + 4 = 7
        - 35 ÷ 7 = 5なので、15と20
      - - カード60枚、1:2:3
        - 1 + 2 + 3 = 6
        - 60 ÷ 6 = 10なので、10、20、30
      - - ビーズ45個、2:7
        - 2 + 7 = 9
        - 45 ÷ 9 = 5なので、10と35
  note:
    title: なぜ大切か
    text: >-
      いちばん多い間違いは、比の数の合計でわらずに、比の数のどれかでわってしまうことです。たとえば35 ÷ 3や35 ÷ 4です。部分ごとに箱をかけば、合計を見落とすことはありません。

method:
  title: 解き方：部分ごとに箱をかく
  lead: >-
    比の部分ごとに箱をかき、分ける人ごとに箱を一列に並べます。箱を全部数えて、1箱分がいくつかを求め、それから分け前を書き入れます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 部分ごとに箱をかく
    - 1箱分がいくつかを求める
    - 分け前を書き入れ、合計を確かめる
  # The key under the steps: what a tile of the drawings means.
  legend:
    one: 1つ分と、そこに入る数
    spoken: 問題文に出てくる部分

examples:
  - title: きのこ
    question: >-
      ソウとレナは、きのこを合わせて45個とりました。ソウが4個とるごとに、レナは5個とりました。レナがとったきのこは何個ですか。
    steps:
      - 4:5は、ソウが4つ分、レナが5つ分ということで、合わせて同じ大きさの部分が9つです。
      - 1つ分は45 ÷ 9 = 5個です。
      - レナは5つ分なので、5 × 5 = 25個です。確かめ：ソウは20個で、20 + 25 = 45です。
    answer: きのこは25個です。
    note:
      title: なぜ45 ÷ 5ではないのか
      text: >-
        45 ÷ 5 = 9は、レナの数だけでわっています。45個のきのこは、ソウとレナの分を合わせた9つ分全部です。
    art:
      max: ソ
      lena: レ
      together: 合わせて45個のきのこ
      max-name: ソウ
      lena-name: レナ
      nine: 9箱で、きのこ45個
      each: どの箱にも45 ÷ 9 = 5個
      only-lena: レナの分だけ
  - title: 合唱団
    question: >-
      ある合唱団では、男の子4人に対して女の子が7人の割合になっていて、女の子は男の子より9人多くいます。合唱団で歌っている子どもは何人ですか。
    steps:
      - >-
        男の子は4つ分、女の子は7つ分なので、女の子は男の子より3つ分多くなります。
      - この3つ分が、多い分の女の子9人です。1つ分は9 ÷ 3 = 3人です。
      - >-
        合唱団全体は4 + 7 = 11個分なので、11 × 3 = 33人です。確かめ：男の子12人と女の子21人で、女の子が9人多くなっています。
    answer: 子どもは33人です。
    note:
      title: 9人にあたるのはどの部分か
      text: >-
        9人にあたるのは、女の子の7つ分ではなく、女の子が男の子より多い3つ分です。9を7や11でわっても、子どもの人数は整数になりません。
    art:
      boys: 男の子
      girls: 女の子
      nine: 女の子9人
      choir: 11箱 × 3 = 33
      this-nine: ここが9
  - title: 2つの箱
    question: >-
      2つの箱に、ビー玉が3:1の比で入っています。1つ目の箱から2つ目の箱へビー玉を10個移すと、どちらの箱のビー玉も同じ数になりました。ビー玉は全部で何個ありますか。
    steps:
      - >-
        ビー玉を一方の箱からもう一方へ移しても、全体の数は変わりません。移す前も後も同じです。
      - >-
        移す前、全体は4つ分で、1つ目の箱にはそのうちの3つ分が入っています。移した後に入っているのは、全体の半分、つまり同じ4つ分のうちの2つ分です。ですから、1つ分を渡したことになります。
      - >-
        その部分が、移した10個のビー玉です。全体は4 × 10 = 40個です。確かめ：移す前は30個と10個、移した後は20個と20個です。
    answer: ビー玉は40個です。
    note:
      title: 変わらないもの
      text: >-
        比の問題には、変わらないものがよく隠れています。ここでは全体の数です。どちらの比も、その同じ全体を分けた部分で表すからこそ、比べることができます。
    art:
      box-a: 箱A
      box-b: 箱B
      four: 移す前も後も、全部で4つ分
      before: 前
      after: 後
      part: 1つ分

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ratio_total_confusion:
    shows: >-
      比の数を、全体の中の割合と取り違えます。4:5を「5つのうち4つ」と読んだり、45個のきのこを4 + 5 = 9つ分ではなく5でわったりします。
    say: 「同じ大きさの部分は、全部でいくつある？」
    art:
      question: きのこ45個、4:5
      one: 1つ分
  wrong_operation:
    shows: >-
      比ならかけ算が必要なところで、たし算をしてしまいます。人数が6人増えたからといって、レシピの卵も6個増やすのです。本当は、卵は人数と同じ割合で増やさなければなりません。
    say: 「人数が2倍になったら、卵はどうなる？」
    art:
      question: 2人で卵3個なら、8人では？
  ignored_condition:
    shows: >-
      条件を1つ落としてしまいます。砂糖300gでは足りないのに小麦粉1000gを全部使ったり、3:4に分けるはずの貝がら56個を28個ずつに分けたりします。
    say: 「小麦粉を全部使うのに、砂糖は足りる？」
    art:
      question: 小麦粉と砂糖5:2、1000gと300g
      short: 砂糖が足りない
      one: 1つ分

home:
  - title: 比で料理をつくる
    text: >-
      お子さまと一緒に、比を使って飲み物や生地をつくってみてください。たとえば、ジュース1カップに水3カップです。次に2倍の量をつくり、何が2倍になるかを見てみましょう。
  - title: 紙に箱をかく
    text: >-
      あめでもお手伝いでも、家で何かを分けるときは、部分ごとに箱をかいて、そこに書き入れてみてください。箱が代わりに考えてくれます。
  - title: 地図と模型
    text: >-
      地図や車の模型の縮尺を見てみてください。1:50なら、1センチメートルが50センチメートルを表します。一緒に何かを測って、実際の大きさに直してみましょう。

# What a parent can write in the chat to get a task on this topic.
ask: 比と比例配分の問題を出してください
