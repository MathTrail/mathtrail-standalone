# The page of the topic of gaps and boundaries, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 植木算
description: 植木算の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    木が6本、一列に並んでいたら、木と木の間はいくつ？丸太を切って5本にしたら、切ったのは何回？こうした問題で子どもが数えるのは、物か、物と物の間のどちらかで、この2つの数は1ちがいます。間違った答えの大半はこの1のちがいから生まれ、それを正すのが、小さい場合をさっとかいた図です。
  method: 小さい場合を図にかいて数える
  teaches: 物とその間を見分け、きまりを図で確かめる力
  # The words of its drawing: the fence and the rule over it, and the two
  # counts under it.
  art:
    line: さくの柱4本
    rule: 柱を数え、次に柱と柱の間を数える
    posts: "**4**本の柱"
    spans: "**3**つの間"

basis:
  title: 間の数のルール
  cards:
    - title: 一列なら1つ少ない
      text: >-
        間は物と物にはさまれているので、一列に並んでいれば、間はいつも物より1つ少なくなります。木が6本なら間は5つ、丸太を切って5本にするなら、切るのは4回です。
      art:
        trees: 木6本、間5つ
    - title: 輪なら同じ数
      text: >-
        花だんを囲む低木のように、列がとじて輪になると、最後の物と最初の物の間も数に入ります。間の数は物の数と同じです。
      art:
        bushes: 低木8本、間8つ
    - title: 両はしも数える
      text: >-
        3ページから7ページまでは、7 − 3 = 4つ進むだけですが、読むページは5ページです。最初のページも読むからです。両はしをふくめて「…から…まで」を数えると、1つ多くなります。
      art:
        steps: 4つ進む
        pages: 4つ進むが、5ページ

idea:
  title: 物か、間か？
  lead: どの問題も、そのどちらか一方を数えます。一列、輪、「…から…まで」では数え方がちがい、どうちがうかは小さな図をかけばわかります。
  table:
    head:
      - 図
      - 数えるもの
      - いくつ
    rows:
      - - 一列に並んだ木6本
        - となりどうしの間
        - 6 − 1 = 5
      - - 切って5本にした丸太
        - 切った回数
        - 5 − 1 = 4
      - - 花だんを囲む低木8本
        - となりどうしの間
        - "8"
      - - 3〜7ページ
        - 読んだページ
        - 7 − 3 + 1 = 5
  note:
    title: なぜ大切か
    text: >-
      1つずれた答えはほとんど正しく見えるので、子どもはめったに気づきません。紙に柱を2〜3本かいてみれば、1をたすのか、1をひくのか、どちらもしないのかが、すぐにわかります。

method:
  title: 解き方：小さい場合を図にかく
  lead: >-
    物を点や柱で表して図にかきます。はじめは2つか3つの小さい数でかきます。図の上で間を数えてきまりを見つけ、それから初めて問題の数に当てはめます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 物と間を図にかく
    - 問題がどちらを数えているかを見つける
    - 計算し、きまりを小さい場合で確かめる
  # The key under the steps: what the drawings' blue and red mean.
  legend:
    counted: 青：数えるもの
    cut: 切れ目

examples:
  - title: バスの路線
    question: >-
      バスの路線に停留所が6つあります。バスは、ある停留所から次の停留所まで3分で進みます。最初の停留所から最後の停留所まで、何分かかりますか。
    steps:
      - 6つの停留所を点で表します。バスは、点と点の間を走ります。
      - 6つの停留所の間は5つで、停留所より1つ少なくなります。
      - どの間も3分かかるので、5 × 3 = 15です。
    answer: 15分です。
    note:
      title: なぜ18ではない？
      text: >-
        6 × 3 = 18では、どの停留所にもそれぞれの間があることになります。しかし、最後の停留所のあと、バスはどこへも進みません。時間がかかるのは、停留所と停留所の間です。
    art:
      stops: 停留所6つ、となりまで3分
      minutes: "{count}分"
      total: 5 × 3 = 15分
      end: 6つ目の停留所の先に道はない
  - title: 9階と3階
    question: >-
      同じマンションの9階にレナが、3階にマキが住んでいます。どちらも1階から歩いて上ります。どの階の間の階段も、段の数は同じです。レナが上る段の数は、マキの何倍ですか。
    steps:
      - >-
        マキは1階から3階まで上ります。1階から2階、2階から3階で、2階分です。
      - >-
        レナは1階から9階まで上ります。8階分で、住んでいる階の数字より1つ少なくなります。
      - 階段はどれも同じなので、8 ÷ 2 = 4です。レナはマキの4倍の段を上ります。
    answer: 4倍です。
    note:
      title: なぜ3倍ではない？
      text: >-
        9 ÷ 3 = 3は階の数をわっています。しかし、段があるのは階と階の間の階段で、1階まで上る人はいません。
    art:
      masha: マ
      lena: レ
      third: 3階
      ninth: 9階
      from: どちらも1階から歩いて上る
      masha-name: マキ
      lena-name: レナ
      two: 階分
      eight: 階分
      times: レナの8階分は、マキの2階分の4倍
      floors: 階の数
      flights: 階段の数
  - title: 丸太は何本？
    question: >-
      きこりたちが何本かの丸太を切りました。どの丸太も、少なくとも1回は切りました。切った回数は全部で9回で、丸太は14本に分かれました。きこりたちが切った丸太は、何本ですか。
    steps:
      - >-
        丸太を1本切ってみます。1回切ると2本、2回切ると3本になります。どの丸太も、切った回数より1本多くなります。
      - これをすべての丸太で合計します。できた本数は、切った回数より、丸太1本につき1本ずつ多くなります。
      - 14 − 9 = 5なので、丸太は5本でした。
    answer: 丸太は5本でした。
    note:
      title: 切る回数の分け方は関係ある？
      text: >-
        関係ありません。丸太5本を9回切れば、1本がほとんどの回数を受け持っても、ほぼ同じ回数ずつ分けても、14本になります。切るたびに、1本が2本に増えるからです。
    art:
      cuts: 9回切る
      pieces: 14本
      logs: 丸太：？
      one: 1回で2本
      two: 2回で3本
      sum: 本数 = 切った回数 + 丸太の数：9 = 6 + 3
      all: 9回 · 14本 · 丸太5本

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      子どもが、停留所の間ではなく停留所を数えたり、柱ではなく間を数えたりします。停留所が6つだから6 × 3 = 18分、としてしまうのです。答えが1つずれているだけなので、ほとんど正しく見えます。
    say: 「停留所を3つかいてみよう。間はいくつある？」
  wrong_operation:
    shows: >-
      子どもが、図が求めていない計算を問題の数でしてしまいます。間を数えて、それぞれにかかる時間を当てはめるのではなく、6 + 3とたしたり、どちらかを倍にしたりします。
    say: 「間1つで何分かかる？間はいくつある？」
  number_from_text:
    shows: >-
      問題文の数が、そのまま答えになってしまいます。何分かを聞かれているのに停留所の6を答えたり、何階分上るかを聞かれているのに9階を答えたりします。
    say: 「この数は何を数えているの？停留所？それとも間？」
    art:
      question: 聞かれていること：何分？
      stops: 停留所
      minutes: 分

home:
  - title: 指と指の間
    text: >-
      手を広げてみてください。指は5本、その間は4つです。このテーマ全体をいちばん手早く表す図で、いつでも手もとにあります。
  - title: 帰り道の階段
    text: >-
      階段では、階の数と階段の数を一緒に数えましょう。1階から4階までは何階分？2階から4階までは？
  - title: 柱とベンチ
    text: >-
      散歩のときに、さくの柱とその間や、池のまわりのベンチを数えてみましょう。一列なら間は1つ少なく、輪なら同じ数です。

# What a parent can write in the chat to get a task on this topic.
ask: 植木算の問題を出してください
