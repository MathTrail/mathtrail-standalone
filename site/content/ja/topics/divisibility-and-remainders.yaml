# The page of the topic of divisibility and remainders, for a parent, in
# Japanese. The topic's name, its group, its grades and its traps' names are not
# here: they are the card's words and the catalog's numbers. The page's
# drawings, each example's level, and the answer its solver proves, are the
# site's data; an example here is worked through to that answer. The traps are
# the topic's commonest, counted in its reference tasks.

title: 倍数・約数とあまり
description: 倍数・約数とあまりの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    29人の児童が車で遠足に出かけ、どの車にも4人ずつ乗ります。車は何台必要でしょう？こうした問題で、子どもはあまりのあるわり算をしてから、そのあまりが何を表すのかを考えます。車がもう1台いるのか、あめが残るのか、次の列の席なのか。倍数の見分け方を使えば、わり算をまったくしなくても「わり切れる？」に答えられます。
  method: 数を、同じ数ずつのグループとあまりで表す
  teaches: あまりを問題の言葉で読みとり、わり算をせずにわり切れるかを確かめる力
  # The words of its drawing: what it divides over it, and what the division
  # comes to under it.
  art:
    line: 14個を3個ずつに分ける
    groups: グループ4つと、あまり2個

basis:
  title: わり算のルール
  cards:
    - title: あまりはわる数より小さい
      text: >-
        7でわると、あまりは0、1、2と続いて6までのどれかです。7以上になったら、グループをまだ作れます。
      art:
        remainders: 7でわったときのあまり：0〜6
    - title: あまりが表すもの
      text: >-
        29人が4人乗りの車に乗ると、満席の車が7台と、あまりが1人なので、車は8台必要です。同じわり算から、答えは7にも8にも1にもなります。決めるのは問題です。
      art:
        cars: 29 = 7 × 4 + 1なので、車は8台必要
    - title: かんたんな見分け方
      text: >-
        数は、一の位が偶数なら2で、一の位が0か5なら5でわり切れます。3や9でわり切れるかどうかは、各位の数字の和がそれでわり切れるかどうかで決まります。
      # The rules on its drawing, the digits each looks at in bold.
      art:
        by-two: 2の倍数
        even: "一の位が偶数：13**6**"
        by-five: 5の倍数
        five: "一の位が0か5：24**5**"
        by-three: 3・9の倍数
        digits: "各位の数字の和：3 + 8 + 1 + 6 = **18**"

idea:
  title: グループとあまり
  lead: どんな整数も、同じ数ずつのグループとあまりで表せます。そのどちらを求めるのかは、問題が決めます。
  table:
    head:
      - 問い
      - わり算 · 青は聞かれていること
      - 答え
    rows:
      - - 29人の児童に、4人乗りの車は何台必要？
        - 29 = 7 × 4 + 1
        - 8台
      - - 29個のあめを4人の子どもで分けると、それぞれ何個？
        - 29 = 7 × 4 + 1
        - それぞれ7個
      - - 29個のあめのうち、何個あまる？
        - 29 = 7 × 4 + 1
        - 1個
  note:
    title: なぜ大切か
    text: >-
      どの行もわり算は同じで、変わるのは意味だけです。わり算が正しくできる子どもでも、あまりを聞かれているのにグループの数を答えたり、最後に残った児童のための車を忘れたりします。

method:
  title: 解き方：グループとあまり
  lead: >-
    数を、同じ数ずつのグループとあまりで表します。それから問題をもう一度読み、何を求めているのかを見きわめます。グループの数か、あまりか、それともグループをもう1つふやした数か。いちばん小さい数や、ある性質をもつ数字を聞かれたら、順に試していきます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 同じ数ずつのグループとあまりに分ける
    - 問題が何を聞いているかを見きわめる
    - 答えを問題の言葉と照らし合わせる
  # The key under the steps: what the drawings' groups mean.
  legend:
    group: グループ
    rest: あまり

examples:
  - title: 遠足のバス
    question: >-
      150人の児童が遠足に行きます。どのバスにも席が40あります。バスは何台必要ですか。
    steps:
      - "児童を40人ずつ数えます。150 = 3 × 40 + 30なので、バス3台が満席になり、30人が残ります。"
      - 満席にはならなくても、この30人にもバスが必要です。
      - 3 + 1 = 4台です。
    answer: 4台です。
    note:
      title: なぜ3や30ではない？
      text: >-
        3は満席のバスの数、30は最後のバスに乗る児童の数です。問題が聞いているのは、必要なバス全部の台数です。
    art:
      seats: 40席
      pupils: 150人
      left: あまり
      part: 40席のうち30席
      full: 満席
      last: 最後のバス
      all: バス全部
  - title: 38*6の星印
    question: >-
      38*6の星印のところにどの数字を入れると、この数は9でわり切れますか。
    steps:
      - 数が9でわり切れるかどうかは、各位の数字の和がわり切れるかどうかで決まります。
      - >-
        わかっている数字の和は3 + 8 + 6 = 17で、星印は0から9のどれかの数字なので、和は17から26のどれかです。
      - "17から26までで9でわり切れるのは18だけなので、星印は1です。3816 = 9 × 424。"
    answer: 数字の1です。
    note:
      title: 3でわるなら？
      text: >-
        3なら、和が3でわり切れればよいので、18、21、24のどれでもかまいません。星印は1、4、7のどれでもよいのです。9の見分け方はもっときびしく、ここでは数字が1つにしぼられます。
    art:
      sum: 各位の数字の和は9でわり切れる？
  - title: 100個の2
    question: >-
      2を100個かけ合わせます：2 × 2 × 2 × … × 2。この答えの一の位の数字は何ですか。
    steps:
      - >-
        順にかけていきながら、一の位を見ます：2、4、8、16、32、64、128、256。一の位は2、4、8、6と進み、そのあとくり返します。
      - >-
        きまりは4つでひと回りし、100 = 25 × 4です。100個目の2は、きまりの25回目のひと回りの終わり、その4番目にきます。
      - ひと回りの4番目は6なので、答えの一の位は6です。
    answer: 6です。
    note:
      title: かくれたあまり
      text: >-
        大事だったのは、100を4でわったあまりだけです。それが、100個目の2がきまりのどこにくるかを教えてくれました。あまりは、くり返すものについての多くの問いに答えてくれます。一の位の数字、曜日、円に並んだ場所などです。
    art:
      first: 青は、きまりの最初のひと回り
      rounds: 2を4個ずつ25回 = 2を100個
      place: あまり0：ひと回りの最後、4番目

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  remainder_vs_quotient:
    shows: >-
      グループとあまりが入れかわってしまいます。バスの台数を聞かれているのにあまりの30人を答えたり、きまりのひと回りが何回あるかを表す25を、きまりの中の位置ととりちがえたりします。
    say: 「聞かれているのは、グループの数？それとも、あまり？」
    art:
      question: バスは何台必要？
      left: あまりの人数
      buses: バスの台数
  off_by_one:
    shows: >-
      答えがグループ1つ分ずれます。最後の30人のバスを忘れて4台ではなく3台にしたり、きまりの中の位置を1からではなく0から数えたりします。
    say: 「あまりのために、グループがもう1つ必要？」
    art:
      question: 150人、どのバスも40席
  missed_case:
    shows: >-
      場合を1つ見つけたところで、探すのをやめてしまいます。3でわり切れるかを聞かれているのに、星印が1だとわかると、4や7もあてはまるかを確かめません。
    say: 「0から9までの数字を全部ためした？」
    art:
      question: 38*6は3でわり切れる
      more: それで全部？

home:
  - title: あまりのある分け方
    text: >-
      あめやカードを家族で分け、結果を2つの数で言ってみましょう。それぞれ何個もらえるかと、何個あまるかです。
  - title: 数字で確かめる
    text: >-
      大きな数を作り、各位の数字をたして、3や9でわり切れるかを確かめましょう。そのあと電卓でわってみて、見分け方が正しいことを確かめます。
  - title: くり返すもの
    text: >-
      ひと回りしてくり返すきまりを探しましょう。曜日、ネックレスの色の並び、3、9、27、81の一の位などです。50個先に何が来るかを聞いてみましょう。

# What a parent can write in the chat to get a task on this topic.
ask: 倍数・約数とあまりの問題を出してください
