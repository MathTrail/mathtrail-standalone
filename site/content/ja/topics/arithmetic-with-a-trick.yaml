# The page of the topic of arithmetic with a trick, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 計算のくふう
description: 計算のくふうと「ある数を思いうかべました」の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    19 + 23 + 81 + 77はいくつでしょう？前から順にたすと、くり上がりのあるたし算が3回続きます。19 + 81と23 + 77を組にすれば、100 + 100です。こうした問題では、うまい順番さえ見つかれば計算はやさしくなります。「ある数を思いうかべました」のパズルは、手順を後ろから元にもどしていけば解けます。大事なのは、計算する前に見る力です。
  method: 計算する前に、楽な順番を探す
  teaches: たし算やかけ算の式を組みかえ、一連の手順を後ろから元にもどす力
  # The words of its drawing: the sum's numbers paired colour by colour into
  # two easy hundreds.
  art:
    pairs: 同じ色の組をたす
    look: まず見て、それから計算

basis:
  title: 計算のくふうのルール
  cards:
    - title: 順番は自由
      text: >-
        数は、どんな順番でたしてもかけてもよく、どこを組にしてもかまいません。25 × 9 × 4は25 × 4 × 9、つまり100 × 9です。
    - title: きりのいい数
      text: >-
        36 + 64、25 × 4、125 × 8のように、10、100、1000になる組を探します。きりのいい数なら、その先の計算が楽です。
    - title: 後ろから元にもどす
      text: >-
        「ある数を思いうかべました」の問題では、結果から逆にたどって、それぞれの手順を元にもどします。たしたものはひき、倍にしたものは半分にします。
      art:
        undoes: の逆は
        back: 結果から逆にたどる

idea:
  title: 計算する前に見る
  lead: 同じ計算でも、長くなることもあれば、短くすむこともあります。計算する前に、きりのいい数になる組やまとまりを探します。
  table:
    head:
      - 問題
      - 楽なやり方
      - 答え
    rows:
      - - 19 + 23 + 81 + 77
        - (19 + 81) + (23 + 77)
        - "200"
      - - 4 × 19 × 25
        - (4 × 25) × 19
        - "1900"
      - - 1 + 2 + 3 + … + 10
        - 1 + 10や2 + 9のような、11になる組が5つ
        - "55"
  # The words of the drawings of the easy way, all rows' in one place.
  art:
    pairs: 11になる組が5つ
  note:
    title: なぜ大切か
    text: >-
      算数オリンピックの問題では、ふつうに計算すると時間のかかる式がわざと出されます。問われているのは、近道に気づけるかどうかです。まず組を探す子どもは、問題がどう組み立てられているかが見えるようになります。それは、計算をはるかに超えて大切なことです。

method:
  title: 解き方：きりのいい数を探す
  lead: >-
    計算する前に、問題全体を見ます。たしてきりのいい数になる数は組にし、かけて10や100になる数はとなりに並べ、いくつも続く手順は後ろから順に元にもどします。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - まず問題全体を見る
    - きりのいい数に組みかえるか、後ろから元にもどす
    - 別のやり方で答えを確かめる
  # The key under the steps: what the drawings' colours mean.
  legend:
    pair: 同じ色どうしが組
    undo: 元にもどす手順

examples:
  - title: 10になる組
    question: >-
      6 + 7 + 8 + 2 + 3 + 4はいくつですか。
    steps:
      - 10になる組を探します。ここには6 + 4、7 + 3、8 + 2の3組があります。
      - 10が3つで30です。
      - "だから6 + 7 + 8 + 2 + 3 + 4 = 30で、くり上がりは一度もありません。"
    answer: "30です。"
    note:
      title: 遠回りの計算
      text: >-
        6 + 7 = 13、続けて21、23、26、30。答えは同じですが、1回ですむ計算が5回になり、そのたびに間違えるおそれがあります。
    art:
      tens: 同じ色どうしが、10になる組
  - title: 思いうかべた数を求める
    question: >-
      マキはある数を思いうかべました。その数を2倍して7をたし、出た数を3でわると、9になりました。マキが思いうかべた数はいくつですか。
    steps:
      - 後ろからたどって、最後の手順から順に元にもどします。
      - >-
        3でわって9になったので、その前は9 × 3 = 27です。7をたしたので、その前は27 − 7 = 20です。
      - "倍にしたので、もとの数は20 ÷ 2 = 10です。確かめ：10 × 2 + 7 = 27、27 ÷ 3 = 9。"
    answer: "10です。"
    note:
      title: 逆の順番で元にもどす
      text: >-
        最後にした手順を、いちばん先に元にもどします。くつ下より先にくつをぬぐのと同じです。手順をした順番のまま元にもどすと、間違った数になります。
    art:
      masha: マキ
      back: 後ろから
      check: 確かめ
      "on": はく
      "off": ぬぐ
      socks: くつした
      shoes: くつ
  - title: 2つの大きな積
    question: >-
      2026 × 2026 − 2027 × 2025はいくつですか。大きな数どうしをかけずに求めましょう。
    steps:
      - >-
        どちらの積にも2026 × 2025がかくれています。2026 × 2026は、2026 × 2025に、さらに2026をたしたものです。
      - そして2027 × 2025は、2026 × 2025に、さらに2025をたしたものです。
      - "だから差は2026 − 2025 = 1で、大きな数のかけ算は一度もしていません。"
    answer: "1です。"
    note:
      title: 小さい数で試す
      text: >-
        同じことは、どんな数でも成り立ちます。5 × 5 − 6 × 4 = 25 − 24 = 1。くふうを信じるには、まず小さい数で試すのがいちばん確かな方法です。
    art:
      cancel: 同じ部分は打ち消し合い、帯が残る

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  stopped_early:
    shows: >-
      最後まで解かずに止まってしまいます。3組のうち2組だけをたして残りを忘れたり、手順を1つだけ元にもどして、その結果を答えにしたりします。
    say: 「どの数も使った？どの手順も元にもどした？」
  wrong_operation:
    shows: >-
      手順を、反対の計算ではなく同じ計算で元にもどそうとします。7をひくかわりにもう一度たしたり、9と3でかけ算をするかわりにわり算をしたりします。
    say: 「たし算を元にもどすのは何？わり算を元にもどすのは何？」
    art:
      undo: 27から「+ 7」を元にもどす
  number_from_text:
    shows: >-
      問題文の数が、そのまま答えになってしまいます。マキが思いうかべた数ではなく、最後に出た9や、とちゅうでたした7を答えにします。
    say: 「これは計算して出た数？それとも思いうかべた数？」
    art:
      question: マキが思いうかべた数は？
      got: 計算して出た数
      thought: 思いうかべた数

home:
  - title: 10になる組
    text: >-
      小さな数を6つか8つカードに書き、全部たす前に、10になる組をお子さまに探してもらいましょう。
  - title: 数あてゲーム
    text: >-
      「ある数を思いうかべました」を、役を入れかえて遊びましょう。手順と結果を伝えてお子さまに数を当ててもらい、次はお子さまに手順を考えてもらいます。
  - title: 買い物で計算のくふう
    text: >-
      お店では、値段をくふうした順番でたしてみましょう。99は100より1少なく、49と51で100です。先にきりのいい数にして、あとでずれを直します。

# What a parent can write in the chat to get a task on this topic.
ask: 計算のくふうの問題を出してください
