# The page of the topic of games with a winning strategy, for a parent, in
# Japanese. The topic's name, its group, its grades and its traps' names are not
# here: they are the card's words and the catalog's numbers. The page's
# drawings, each example's level, and the answer its solver proves, are the
# site's data; an example here is worked through to that answer. The traps are
# the topic's commonest, counted in its reference tasks.

title: 必勝法のあるゲーム
description: 必勝法のあるゲームの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words the page's drawings say of a position.
art:
  loses: 手番の人が負ける
  wins: 勝てる

hero:
  lead: >-
    テーブルにマッチ棒が20本あります。先手と後手が交互に、1本、2本、3本のどれかを取っていき、最後のマッチ棒を取った人の勝ちです。先手は必ず勝てるでしょうか。こうした問題で子どもが探すのは、相手がどんな手を選んでも勝てる計画です。その計画は、ゲームの終わりから逆にたどり、どの局面が手番の人にとって負けになるかを調べることで見つかります。
  method: 終わりから逆にたどり、負けの局面を見つける
  teaches: 相手がどんな手を選んでも勝てる計画を見つける力
  # The words of its drawing: the game it is drawn for.
  art:
    line: 1本、2本、3本のどれかを取り、最後のマッチ棒を取れば勝ち

basis:
  title: ゲームのルール
  cards:
    - title: 終わりから
      text: >-
        勝ち負けがはっきりしているゲームの終わりから始めて、逆にたどります。ある局面からのどの手も、相手にとって勝ちの局面につながるなら、その局面は負けです。
      art:
        back: ゲームの終わりの0から、大きい数へ
    - title: 負けの局面を相手に渡す
      text: >-
        勝つための手とは、相手に負けの局面を残す手です。そんな手がなければ、手番の人がどんなにかしこくても、その局面は負けです。
      art:
        take: 2本取る
        losing: 相手には負けの局面
    - title: まねをする、鏡に映す
      text: >-
        多くのゲームでは、勝つ人がつり合いを保ちます。相手の手と自分の手の合計がいつも同じになるように答えたり、鏡に映した反対側で同じ手を打ったりするのです。
      art:
        they: 相手が取る
        answer: 自分が取る

idea:
  title: 負けの局面
  lead: マッチ棒を1本、2本、3本のどれか取り、最後のマッチ棒を取った人が勝つゲームでは、手番の人が負ける局面が4本ごとにやってきます。
  table:
    head:
      - 残りのマッチ棒
      - いちばんよい手
      - 理由
    rows:
      - - 1本、2本、3本
        - 全部取る
        - 最後のマッチ棒を取れば勝ち
      - - "4"
        - 勝てる手はない
        - どう取っても、相手が残りを全部取る
      - - 5本、6本、7本
        - 1本、2本、3本のどれかを取って4本残す
        - 相手に負けの4本がまわる
      - - "8"
        - 勝てる手はない
        - どう取っても5本、6本、7本のどれかが残る
  note:
    title: なぜ大切か
    text: >-
      子どもはよく、先手が必ず勝つと思いこんだり、相手のミスを期待して遊んだりします。必勝法は、相手がいちばんよい手を打ってきても通用するものです。それを見つけるには終わりから考える必要があり、この習慣はゲームをはるかに超えて役に立ちます。

method:
  title: 解き方：ゲームの終わりから
  lead: >-
    局面を小さいほうから順に書き出します。そこからのどの手も勝ちの局面につながるなら、その局面に負けの印を、負けの局面につながる手があれば勝ちの印をつけます。はじめの局面から勝つための手は、負けの局面を残す手です。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 終わりの局面から始める
    - 小さいほうから順に、勝ちか負けかの印をつける
    - 相手に負けの局面を残す手を見つける

examples:
  - title: ボウルのあめ
    question: >-
      ボウルにあめが23個入っています。ユキとレオが順番にあめを取っていき、ユキが先に取ります。どちらも、自分の番に1個、2個、3個、4個のどれかを取ります。最後のあめを取った人の勝ちです。ユキが確実に勝つには、最初に何個取ればよいですか。
    steps:
      - >-
        終わりから考えます。残りが1〜4個なら、手番の人が全部取って勝ちます。残りが5個なら、どう取っても相手に1〜4個を残すことになるので、5個は負けの局面です。
      - >-
        同じように、10個、15個、20個も負けの局面です。そこからいくつ取っても、相手はボウルのあめを次の5の倍数まで減らせるからです。
      - >-
        ですから、ユキは3個取って20個を残します。レオが何個取っても、ユキは合わせて5個になるように取り、15個、10個、5個と残して、最後には何も残しません。
    answer: 3個です。
    note:
      title: なぜ4個ではないのか
      text: >-
        4個取ると19個が残り、レオが4個取って15個を残します。これはユキにとって負けの局面です。間違えない相手に勝てるのは、最初に5の倍数を残す手だけです。
    art:
      sweets: あめ23個、取れるのは1〜4個
      kim: ユキ −3
      answer: レオがx個なら、ユキは5 − x個
      leo: レオ −4
      lost: ユキの負けの局面
  - title: キングの散歩
    question: >-
      たて5マス、横5マスのマス目の左下のすみに、キングがいます。2人が順番に、キングを1マス上か、1マス右か、1マス右ななめ上に動かします。キングを右上のすみに動かした人の勝ちです。どちらもいちばんよい手を選ぶとき、勝つのはどちらですか。
    steps:
      - >-
        キングがあと何行、何列進まなければならないかを数えます。隅まであと1手のマスからなら、手番の人がすぐに勝ちます。
      - >-
        残りの行の数と列の数がどちらも偶数なら、そのマスは手番の人の負けです。どう動かしてもどちらかが奇数になり、相手はまた両方を偶数にできるからです。
      - >-
        キングは、隅から4行、4列離れたところから始まります。どちらも偶数なので、先手の負けです。後手は、いつもどちらの数も偶数になるマスへ動かして答え続け、隅にたどり着きます。
    answer: 後手です。
    badge: 後手
    note:
      title: 先手でも勝てるとはかぎらない
      text: >-
        この問題では、先手はどんな手を選んでも負けます。新しいゲームに出会ったら、先手の勝ちと決めつける前に、終わりから確かめてみるとよいでしょう。
    art:
      moves: 動かし方：上、右、右ななめ上
      green: 緑：1手で勝ち
      red: 赤い点：手番の人の負け
      start: キングは負けのマスから始まる
  - title: デイジー
    question: >-
      デイジーの花に、花びらが12枚、輪のようにならんでいます。2人が順番に、花びらを1枚か、すき間なくとなり合って生えている2枚をちぎります。最後の花びらをちぎった人の勝ちです。どちらもいちばんよい手を選ぶとき、勝つのはどちらですか。
    steps:
      - >-
        先手が1枚ちぎっても2枚ちぎっても、輪が切れて、11枚か10枚の花びらが一列に並びます。
      - >-
        後手は、その列のちょうど真ん中からちぎります。11枚の列なら1枚、10枚の列なら2枚です。すると、向かい合わせに同じ長さの列が2つ残ります。
      - >-
        そこからは、後手は先手の手をすべて、もう一方の列でまねします。先手に打てる手があるかぎり、後手にも打てる手があるので、最後の花びらをちぎるのは後手です。
    answer: 後手です。
    badge: 後手
    note:
      title: なぜ真ん中なのか
      text: >-
        列を同じ長さの2つに分けると、局面が対称になります。まねをすれば負けることはありません。もう一方の列がまったく同じ形なので、まねした手はいつでも打てるからです。
    art:
      eleven: 先手が1枚ちぎり、11枚の列が残った
      two-rows: 5枚ずつの列が2つ
      mirror: 先手は青い列でちぎり、後手はオレンジの列でまねした

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      ゲームのルールが抜け落ちてしまいます。4個までしか取れないのに5個取ったり、ルールで禁じられているのにキングを左に動かしたりします。許されない手をもとにした計画では、何も勝ち取れません。
    say: 「ルールで、していい手はどれ？」
    art:
      question: 取れるのは1〜4個
      five: 5個取る
      three: 3個取る
  first_move_assumed:
    shows: >-
      「ユキが先だから、ユキの勝ち」と、先手であるだけで勝てると思いこみます。でも、キングの散歩のように、先手がどんな手を選んでも負けるゲームはたくさんあります。
    say: 「でも、相手がまちがえなかったら？」
    art:
      question: キングの散歩
      first: 先手の勝ち
      second: 後手
  best_case_not_worst:
    shows: >-
      相手がミスをしたときにしかうまくいかない計画を立ててしまいます。ユキが4個取り、そのあとレオが少なすぎる数を取るのを期待するような計画です。必勝法は、相手のいちばんよい手にも答えられなければなりません。
    say: 「それに対して、相手のいちばんいい手は何？」
    art:
      question: 23個からのユキの最初の手
      leo: レオ −4

home:
  - title: マッチ棒ゲームで遊ぶ
    text: >-
      15本のマッチ棒から1本、2本、3本のどれかを取っていくゲームを、お子さまを先手にして遊んでみてください。何回か勝ったら、なぜ4の倍数が何度も出てくるのかを聞いてみましょう。
  - title: 相手の手をまねる
    text: >-
      対称な盤を使うゲームなら、どんなゲームでも、相手の手を反対側でまねしてみてください。まねがうまくいくのはどんなときか、うまくいかなくなるのはどんなときかを聞いてみましょう。
  - title: 立場を入れかえる
    text: >-
      お子さまが勝つ計画を見つけたら、立場を入れかえて、今度はお子さまが後手になります。その立場からだとなぜ計画が負けてしまうのかを説明することが、このテーマの、より深いほうの半分です。

# What a parent can write in the chat to get a task on this topic.
ask: 必勝法のあるゲームの問題を出してください
