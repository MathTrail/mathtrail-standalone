# The page of the topic of ordering, for a parent, in Japanese. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: 順番の推理
description: 論理パズルや推理算のひとつ、順番の推理の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words every drawing of the page writes its four children in: the
# initial of each, and the name.
art:
  ann: ユ
  ann-name: ユイ
  ben: リ
  ben-name: リク
  kate: エ
  kate-name: エマ
  dan-name: ゴウ
  taller: 背が高い

hero:
  lead: >-
    だれが背が高い？だれが年上？だれが先に着いた？こうした論理パズルでは、いくつかの比較をつなぎ合わせて、一列の順番にまとめなければなりません。背の順のことも、年の順のことも、列や競走での位置のこともあります。多くの子どもにとって、これは初めての推理の鎖です。手がかりの一つひとつが鎖の輪で、どれも抜かすことはできません。
  method: 線を引いて、全員をその上に並べる
  teaches: 手がかりを1本の線にまとめ、比べる文を両方から読む力
  # The words of its drawing: the clues and the rule over it, and the line's
  # two ends in it.
  art:
    line: 手がかり
    clue-1: 「ユイはリクより背が高い」
    clue-2: 「エマはリクより背が低い」
    clue-3: 「ゴウはエマより背が低い」
    rule: 一列に並べる
    top: いちばん高い
    bottom: いちばん低い

basis:
  title: 線のルール
  cards:
    - title: 手がかりはどれも矢印
      text: >-
        「ユイはリクより背が高い」なら、線の上でユイはリクより前に来ます。比べているのが背の高さでも、年齢でも、競走の順位でも、手がかりが言っているのは、だれが先に来るかです。
      art:
        clue: 「ユイはリクより背が高い」
    - title: 逆からも読む
      text: >-
        「リクはユイより背が低い」は、「ユイはリクより背が高い」と同じことを言っています。線に並べる前に、どの手がかりも言いかえて、全部が同じ向きを指すようにそろえます。
      art:
        clue: 「ユイはリクより背が高い」
        turned: 「リクはユイより背が低い」
    - title: 鎖はつながっていく
      text: >-
        ユイがリクより背が高く、リクがエマより背が高ければ、そう言う手がかりがなくても、ユイはエマよりも背が高いことになります。
      art:
        implied: ユイはエマより背が高い

idea:
  title: 手がかりの向きをそろえる
  lead: どの手がかりも「背が高い」を使って言いかえてから、一つひとつ線に加えていきます。手順ごとに、線に新しい人が1人加わります。
  table:
    head:
      - 手がかり
      - 「背が高い」で言うと
      - ここまでの線
    rows:
      - - 「ユイはリクより背が高い」
        - ユイはリクより**背が高い**
        - ユイ > リク
      - - 「エマはリクより背が低い」
        - リクはエマより**背が高い**
        - ユイ > リク > エマ
      - - 「ゴウはエマより背が低い」
        - エマはゴウより**背が高い**
        - ユイ > リク > エマ > ゴウ
  # The words of the drawings of the table: the note on a clue turned round.
  art:
    turned: 言いかえた
  note:
    title: なぜ大切か
    text: >-
      ここでの間違いのほとんどは、手がかりを逆の端から読むことから生まれます。「低い」を「高い」と、「後」を「前」と取りちがえるのです。線に置く前に言いかえておいた手がかりは、もう読みちがえようがありません。

method:
  title: 解き方：線を引く
  lead: >-
    いちばん背が高い人からいちばん低い人へ、あるいは最初から最後へと線を引き、手がかりを一つひとつ、確かなものから順に線の上に置いていきます。まだ置けない人は、次の手がかりを待ちます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 手がかりの向きをそろえる
    - 確かな手がかりから、線に並べる
    - 答えを読み取り、すべての手がかりと照らし合わせる
  # The key under the steps: what the drawings' rings and outlines mean.
  legend:
    added: 青い輪：この手順で加わるもの
    free: まだ空いている場所
    block: 組：いつも隣り合う2人

examples:
  - title: 3そうのボート
    question: >-
      赤、青、緑の3そうのボートが競走しました。赤のボートは、青のボートより後にゴールしました。緑のボートは、青のボートより先にゴールしました。勝ったのはどのボートですか。
    steps:
      - >-
        最初の手がかりを言いかえます。赤は青より後にゴールしたので、青は赤より先にゴールしました。
      - >-
        線の上では、左がいちばん先です。まず青、その次に赤。緑のボートは青より先にゴールしたので、両方より前に入ります。緑、青、赤の順です。
      - >-
        線の先頭は緑のボートです。確かめ：赤は青より後、そのとおり。緑は青より先、そのとおり。
    answer: 緑のボートが勝ちました。
    badge: "1"
    art:
      red: 赤
      blue: 青
      green: 緑
      before: 先に
      waits: 待ち
  - title: 食堂の列
    question: >-
      食堂の列に、レナ、ソウ、マオ、ジン、タクの5人が並んでいます。マオは3番目です。ジンはマオのすぐ後ろです。ソウはレナより前のどこかにいて、レナはいちばん後ろではありません。いちばん後ろに並んでいるのはだれですか。
    steps:
      - >-
        確かなことから書き入れます。マオは3番目で、そのすぐ後ろのジンは4番目です。残る1番目、2番目、5番目に、ソウ、レナ、タクが入ります。
      - >-
        レナはいちばん後ろではないので、1番目か2番目です。ソウはレナより前のどこかにいるので、レナは1番目にはなれません。レナが2番目、ソウが1番目です。
      - >-
        残った場所は5番目だけで、そこがタクの場所です。手がかりを全部確かめると、どれも成り立っています。
    answer: いちばん後ろはタクです。
    badge: タ
    note:
      title: どの手がかりも大切
      text: >-
        「レナはいちばん後ろではない」がなければ、レナがいちばん後ろでもかまわないことになります。列を決めるのは、「ない」のついた短い手がかりなのです。
    art:
      lena: レ
      lena-name: レナ
      max: ソ
      max-name: ソウ
      nina: マ
      nina-name: マオ
      oleg: ジ
      oleg-name: ジン
      pavel: タ
      pavel-name: タク
      wait: 待ち
      waits: 待ち
      other: その手がかりがなければ、この列でも合ってしまう
  - title: 6人のランナー
    question: >-
      アヤ、カイ、ヒロ、メイ、セナ、フウの6人が競走し、同着はありませんでした。カイはアヤのすぐ後にゴールしました。ヒロはメイより後、アヤより先にゴールしました。フウはセナのすぐ前にゴールし、セナは最後ではありませんでした。メイは1位ではありませんでした。勝ったのはだれですか。
    steps:
      - >-
        組を見つけます。「カイはアヤのすぐ後」からアヤ・カイの組が、「フウはセナのすぐ前」からフウ・セナの組ができます。メイ、ヒロ、アヤ・カイの組は、この順に並びます。
      - >-
        メイは1位ではないので、メイより先にゴールした人がいます。ヒロ、アヤ、カイはみなメイより後なので、メイより前に入れるのはフウとセナだけです。そしてこの組は、いっしょに入ります。
      - >-
        だから、レースの先頭はフウ・セナの組です。フウ、セナ、メイ、ヒロ、アヤ、カイの順になります。手がかりのとおり、セナは最後ではありません。どの手がかりも成り立っています。
    answer: 勝ったのはフウです。
    badge: フ
    note:
      title: 組はいっしょに動く
      text: >-
        手がかりが「すぐ後」と言っていたら、その2人はどこに入っても隣どうしです。2人をひと組として扱えば、6人のランナーが、並べる4つのものになります。
    art:
      ada: ア
      ada-name: アヤ
      bob: カ
      bob-name: カイ
      cid: ヒ
      cid-name: ヒロ
      dot: メ
      dot-name: メイ
      eli: セ
      eli-name: セナ
      fay: フ
      fay-name: フウ
      blocks: 組
      order: 順番
      only: 「?」に入れるのはこの組だけ
      six: 6人
      four: 4組

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      子どもは、ある手がかりは使っても、別の手がかりを見落とします。見落とすのは「ない」のついた短い手がかりであることが多く、線には間違った答えの入る余地が残ってしまいます。
    say: 「まだ使っていない手がかりはどれ？」
    art:
      question: 「レナはいちばん後ろではない」を見落とす
  reversed_relation:
    shows: >-
      「エマはリクより背が低い」を、エマのほうが高いかのように線に置いてしまいます。手がかりを逆の端から読んだので、答えも逆になります。
    say: 「じゃあ、背が高いのはだれ？反対から言ってみよう」
    art:
      clue: 「エマはリクより背が低い」
  stopped_early:
    shows: >-
      子どもは、だれかがだれかより背が低いとわかったところで、それを答えにしてしまいます。でも鎖はまだ続いています。リクはユイより背が低いけれど、エマはもっと低いのです。
    say: 「線のもっと先に、だれかいる？」
    art:
      clue-1: 「リクはユイより背が低い」
      clue-2: 「エマはリクより背が低い」
      who: いちばん背が低いのはだれ？

home:
  - title: 家族で一列に並ぶ
    text: >-
      家で家族みんなで、背の順に、次に年の順に並んでみましょう。手がかりは一つひとつ、「お父さんはお母さんより背が高いから、お父さんが先頭」のように声に出して言います。
  - title: 答えの前に線
    text: >-
      答えを聞く前に、紙に線をかいてもらいましょう。図があれば、抜けている手がかりや、逆向きに置いた手がかりがすぐにわかります。
  - title: 反対から言う
    text: >-
      すぐにできるゲームをしてみましょう。「ネコはイヌより小さい」と言ったら、お子さまは反対から「イヌはネコより大きい」と言います。

# What a parent can write in the chat to get a task on this topic.
ask: 順番の推理の問題を出してください
