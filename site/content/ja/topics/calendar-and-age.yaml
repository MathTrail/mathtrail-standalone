# The page of the topic of the calendar and age, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: カレンダーと年れい
description: 曜日・日付・年れいの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    今日は火曜日です。30日後は何曜日でしょう？お母さんは30歳で、ユイは6歳です。お母さんの年れいがユイの倍になるとき、ユイは何歳でしょう？こうした問題で、子どもは週・月・年を扱います。その多くは、2つの事実で解けます。曜日は7日ごとにくり返すこと、そして年れいの差は決して変わらないことです。
  method: まるごとの週は省き、年れいの差はそのまま使う
  teaches: 日数や年数を、一つひとつ数えずに求める力
  # The words of its drawing: a month whose Tuesdays stand in one column.
  art:
    line: 曜日は7日ごとにくり返す
    tuesdays: 火曜日はすべて同じたての列に、7日ごとに並ぶ

basis:
  title: カレンダーのルール
  cards:
    - title: 曜日はくり返す
      text: >-
        7日ごとに同じ曜日がもどってきます。ですから30日後なら、まるごとの4週間を除いて残る2日だけを考えればよいのです。
      art:
        week: 7日
        month: 30日 = 4週間と2日
    - title: 期間の両はし
      text: >-
        5月3日の7日後は5月10日ですが、3日から10日までの休みは8日間あります。最初の日も最後の日も数に入るからです。
      art:
        holidays: 3日から10日まで：休みは8日間
    - title: 差は変わらない
      text: >-
        お母さんは今ユイより24歳年上で、10年後も24歳年上です。どちらも毎年1歳ずつ年をとるからです。
      art:
        now: 今
        then: 10年後
        anya: ユイ
        mum: 母

idea:
  title: まるごとの週は省く
  lead: 何日か後は何曜日でしょう？大事なのは、まるごとの週を除いた残りの日数だけです。
  table:
    head:
      - 何日後
      - まるごとの週と残りの日数
      - 今日が月曜日なら
    rows:
      - - "10"
        - 1週間と3日
        - 木曜日
      - - "15"
        - 2週間と1日
        - 火曜日
      - - "30"
        - 4週間と2日
        - 水曜日
      - - "100"
        - 14週間と2日
        - 水曜日
  # The words of the drawings of whole weeks and the days left over.
  art:
    week: 7日
    weeks: 14 × 7日
  note:
    title: なぜ大切か
    text: >-
      100日を指で数えるのは時間がかかり、間違えやすいものです。まるごとの週を省けば、1日か2日進めるだけですみます。

method:
  title: 解き方：変わらないものを見つける
  lead: >-
    変わらないものを探します。曜日は7日ごとにくり返し、年れいの差は決して変わりません。これを使って関係のないものを省き、残りだけを数えます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - くり返すもの、変わらないものを見つける
    - まるごとの週を省くか、年れいの差で考える
    - 残りを数え、両はしを数に入れるかを確かめる
  # The key under the steps: what the drawings' blocks and colours mean.
  legend:
    week: 7日
    whole: まるごとの週
    day: 残りの日
    difference: 年れいの差

examples:
  - title: 花の水やり
    question: >-
      エマは3日ごとに花に水をやります。最初に水をやるのは月曜日です。4回目に水をやるのは何曜日ですか。
    steps:
      - >-
        1回目の水やりから4回目までに、3日の間が4つではなく3つあります。3 × 3 = 9日です。
      - 9日は、1週間と2日です。
      - 月曜日の1週間後はまた月曜日で、そのさらに2日後が水曜日です。
    answer: 水曜日です。
    badge: 水曜
    note:
      title: なぜ土曜日ではない？
      text: >-
        4 × 3 = 12日とすると、4回目の水やりのあとにも間をつけてしまいます。4回の水やりの間は3つで、4本の柱の間と同じです。
    art:
      monday: 月曜
      first: 最初の水やりは月曜日、そのあと3日ごと
      three-days: 3日
      gaps: 3つの間 × 3日 = 9日
      week: 7日
      numbers: 青い日の下の数字は、何回目の水やりか
      no-gap: 4回目の水やりのあとに間はない
  - title: リンとお父さん
    question: >-
      お父さんはリンより28さい年上です。4年後、お父さんの年れいはリンの年れいの3倍になります。リンは今何さいですか。
    steps:
      - "差は決して変わりません。4年後も、お父さんは28歳年上のままです。"
      - >-
        そのとき、図のように、お父さんの年れいはリンの年れいの3つ分です。お父さんの多い2つ分が28年にあたるので、1つ分は28 ÷ 2 = 14です。
      - >-
        4年後のリンは14歳なので、今は14 − 4 = 10歳です。確かめ：お父さんは今38歳で、4年後は42 = 3 × 14です。
    answer: 10歳です。
    art:
      now: 今
      then: 4年後
      vera: リン
      dad: 父
      difference: オレンジ色：差の28年
      parts: 4年後：2つ分 = 28、1つ分 = 14
      check: 確かめ：38 + 4 = 42 = 3 × 14
  - title: 偶数日の土曜日が3回
    question: >-
      ある月には、日付がぐう数になる土曜日が3回あります。その月の25日は何曜日ですか。
    steps:
      - >-
        土曜日は7日ごとに来て、7は奇数なので、その日付は偶数、奇数、偶数、奇数…と交互になります。
      - >-
        偶数の日付が3回あるには、土曜日が5回あって、第1土曜日が偶数の日付でなければなりません。第5土曜日は第1土曜日の28日後で、それでも同じ月の中に入らなければならないので、第1土曜日は3日までのどれかです。そのうち偶数の日付は2日だけなので、土曜日は2日、9日、16日、23日、30日です。
      - 23日が土曜日なので、その2日後の25日は月曜日です。
    answer: 月曜日です。
    badge: 月曜
    note:
      title: カレンダーの偶数と奇数
      text: >-
        この問題のカギは偶奇です。7は奇数なので、同じ曜日の日付は、週ごとに偶数と奇数が入れかわります。
    art:
      even: 青：偶数、オレンジ：奇数
      first: 第1土曜日
      fifth: 第5土曜日
      saturdays: 土曜日は青、25日は月曜日

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      日数が1つずれます。これから先の日を数えるのに今日を1日目にしたり、4回の水やりの間を4つと数えたり、月曜日から日曜日までの休みのように、期間の片方のはしを数え忘れたりします。
    say: 「1日目は今日？それとも明日？」
    art:
      gaps: 4回の水やりの間
  wrong_operation:
    shows: >-
      問題が求めていない計算をしてしまいます。何歳年上かを聞かれているのに年れいどうしをたしたり、月の違う日付どうしでひき算をしたりします。
    say: 「言葉で言ってみよう。数はふえる？へる？それとも変わらない？」
    art:
      older: お母さん（30）はユイ（6）より何歳年上？
  ignored_condition:
    shows: >-
      カレンダーや問題文にある事実を見落とします。その月が31日ではなく30日までだということや、365日がまるごとの週とあと1日だということです。
    say: 「この月は何日まである？」
    art:
      year: 月曜日の365日後
      weeks: 52 × 7日
      monday: 月曜
      tuesday: 火曜

home:
  - title: 壁のカレンダー
    text: >-
      お子さまの手が届くところに紙のカレンダーをかけ、それを見ながら聞いてみましょう。来月の1日は何曜日？今月、金曜日は何回ある？
  - title: 家族の年れい
    text: >-
      家族みんなの年れいと、おたがいの差を書き出しましょう。翌年にもう一度見ると、年れいは変わっていても、差は変わっていません。
  - title: カウントダウン
    text: >-
      誕生日や祝日までの日数を一緒に数えましょう。はじめは一つひとつ、次はまるごとの週で数え、どちらでも同じになることを確かめます。

# What a parent can write in the chat to get a task on this topic.
ask: カレンダーと年れいの問題を出してください
