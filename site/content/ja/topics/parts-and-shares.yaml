# The page of the topic of parts and shares, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 部分と全体
description: 相当算や分数の文章題など、部分と全体の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    リクがピザの3分の1を食べ、ユイが残りの半分を食べました。多く食べたのはどちらでしょうか。こうした分数の文章題では、分数はいつも何かの分数です。難しさの大部分は、それが何の分数なのか、つまり全体の分数なのか、残りの分数なのかを見きわめるところにあります。等分した紙の帯は、どんなルールよりもわかりやすく、それを見せてくれます。
  method: 全体を帯でかき、等分する
  teaches: 「何の部分？」と問いかけ、部分から全体を求める力
  # The words of its drawing: the share over it, and what it comes to.
  art:
    line: 12の3/4
    sum: 12の3/4 = 9
    one: "12 ÷ 4 = 3が1つ分、その3つ分で9"

basis:
  title: 部分のルール
  cards:
    - title: 何の部分？
      text: >-
        分数はいつも、何かの分数です。「残りの4分の1」と「全体の4分の1」は違う数なので、まず、何の分数なのかを確かめてください。
      art:
        whole: 全体の4分の1
        rest: 残りの4分の1
    - title: 1つ分から考える
      text: >-
        20の3/4を求めるには、4でわって3つ分をとります。答えは15です。3/4が15になる全体を求めるには、3でわって1つ分を出し、4つ分をとります。答えは20です。
    - title: 部分を合わせると全体になる
      text: >-
        あげた分と残った分を合わせると、1つの全体になります。1/3と1/4をあげたら、残りは1 − 1/3 − 1/4 = 5/12です。

idea:
  title: 1つ分の大きさ
  lead: 何を聞かれていても、まず1つ分の大きさを求め、それから必要な数だけ1つ分を集めてください。
  table:
    head:
      - わかっていること
      - 帯と1つ分
      - 求めるもの
    rows:
      - - 20の3/4
        - "20 ÷ 4 = 5"
        - 3つ分で15
      - - ある数の3/4が15
        - "15 ÷ 3 = 5"
        - ある数は4つ分で20
      - - ある数の2/5が14
        - "14 ÷ 2 = 7"
        - ある数は5つ分で35
  note:
    title: なぜ大切か
    text: >-
      分数の間違いの多くは、計算ではなく全体にあります。違う量をもとにして分数をとってしまうのです。手順のたびに、その前に全体を声に出して言えば、こうした間違いに気づけます。

method:
  title: 解き方：帯をかく
  lead: >-
    全体を長い帯でかき、分数の分母と同じ数に等分します。残りの何分のいくつかをとるときは、残りを新しい帯としてかきます。それから、1つ分の大きさを求めます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 全体を帯でかく
    - 等分し、必要なら残りもまた等分する
    - 1つ分を求め、それから問題が聞いている分を求める
  # The key under the steps: what the strips' colours mean.
  legend:
    given: もうあげた分
    sought: 求める分

examples:
  - title: パン屋さんのパン
    question: >-
      パン屋さんがパンを60個焼きました。正午までにその半分が売れ、夕方までに残りの3分の2が売れました。パンは何個残っていますか。
    steps:
      - 60個の半分は30個なので、正午のあとに残っているのは30個です。
      - >-
        残りの3分の2とは、60個ではなく30個の3分の2です。夕方に売れたのは30 ÷ 3 × 2 = 20個です。
      - 残りは30 − 20 = 10個です。
    answer: 10個です。
    note:
      title: 何の3分の2？
      text: >-
        60個全部の3分の2なら40個で、30 + 40 = 70個は、パン屋さんが焼いた数より多くなってしまいます。「残りの3分の2」は、そのときに残っている分に対する割合です。
    art:
      rest: 残りが新しい全体
      evening: 夕方に20個売れた
      all: 正午まで30 · 夕方20 · 残り10
      over: 30 + 40 = 70は60に入りきらない
  - title: 7等分した本
    question: >-
      トモは月曜日に本の2/7を読み、火曜日に3/7を読みました。すると、残りは40ページになりました。この本は全部で何ページありますか。
    steps:
      - 2日間でトモが読んだのは本の2/7 + 3/7 = 5/7なので、残りは2/7です。
      - その2/7が40ページにあたります。7分の1は40 ÷ 2 = 20ページです。
      - 本全体は7分の7なので、7 × 20 = 140ページです。
    answer: 140ページです。
    note:
      title: 40はどの部分？
      text: >-
        40ページは残りの分、つまり本の2/7で、トモが読んだ5/7ではありません。それを5/7だと考えると、本は56ページになり、残りはたった16ページになってしまいます。
    art:
      sevenths: 本を7等分
      monday: 月曜
      tuesday: 火曜
      read: 40は読んだ分ではない
  - title: 市場の卵売り
    question: >-
      おばあちゃんが市場で卵を売っています。1人目のお客さんは、卵の半分と、さらに半個を買いました。2人目のお客さんは、残った卵の半分と、さらに半個を買い、3人目のお客さんも同じように買いました。これで卵は全部売れました。卵をわった人はいません。おばあちゃんは卵を何個持っていましたか。
    steps:
      - >-
        後ろから考えます。3人目のお客さんは、卵の半分とさらに半個を買い、卵は残りませんでした。つまり卵の半分が半個だったので、おばあちゃんの卵は1個でした。
      - >-
        2人目のお客さんの前も同じです。卵の半分とさらに半個が売れて1個残ったので、卵の半分は1個半で、卵は3個ありました。
      - >-
        1人目のお客さんの前は、卵の半分が3個半だったので、卵は7個ありました。確かめ：7 → 3 → 1 → 0。
    answer: 7個です。
    note:
      title: 後ろから考える
      text: >-
        どの分け前も、そのときの残りの一部であるときは、終わりから始めるのがいちばん簡単です。終わりなら数がわかっているからです。さかのぼるたびに、分け前を1つずつ取り消します。半個をたして、それから2倍にするのです。
    art:
      basket: かごの卵は何個？
      third: 3人目のお客さん：1個あった
      third-took: 0.5 + ½ = 1個買って、残り0
      second: 2人目のお客さん：3個あった
      second-took: 1.5 + ½ = 2個買って、残り1
      first: 1人目のお客さん：7個あった
      first-took: 3.5 + ½ = 4個買って、残り3
      back: さかのぼる：+ ½、それから × 2

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  part_whole_swap:
    shows: >-
      違う量をもとにして分数を求めてしまいます。残っている30個ではなく60個全部の3分の2を求めたり、残りの40ページをトモが読んだ分だと思ったりします。
    say: 「何の3分の2？帯で指さしてみよう」
    art:
      question: 残りの3分の2
      of-all: 60の2/3 =
      of-rest: 30の2/3 =
  answered_other_question:
    shows: >-
      途中で出てきた数が答えになってしまいます。残っているパンではなく夕方に売れた20個を答えたり、本全体ではなくトモが読んだ100ページを答えたりします。
    say: 「問題がほんとうに聞いているのは何？」
    art:
      question: パンは何個残っている？
      evening: 夕方に売れた
      left: 残り
  stopped_early:
    shows: >-
      解き方が、あと1歩のところで止まってしまいます。本の7分の1にあたる20ページを求めたのに本全体まで進まなかったり、正午までに売れたパンを引いたのに夕方の分を忘れたりします。
    say: 「それが答え？それとも、答えまでのとちゅう？」
    art:
      question: 本は全部で何ページ？

home:
  - title: 一緒に切り分ける
    text: >-
      りんごやピザ、紙を等分に切って、それぞれを「半分」「3分の1」「4分の1」のように呼んでみてください。それからいくつか取りのぞいて、残っているのは何分のいくつかを聞いてみてください。
  - title: 何の部分？
    text: >-
      レシピやゲームで分数が出てきたら、「何の3分の1？」と聞いてみてください。その答えが、問題のすべてということもよくあります。
  - title: 帯
    text: >-
      家で何かを分けるときはいつでも、一緒に帯をかいてみてください。細長い長方形を、同じ大きさのマスに区切ったものです。このテーマのどの問題にも使えます。

# What a parent can write in the chat to get a task on this topic.
ask: 部分と全体の問題を出してください
