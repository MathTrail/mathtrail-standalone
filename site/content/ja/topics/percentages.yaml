# The page of the topic of percentages, for a parent, in Japanese. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: 百分率
description: 百分率の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    値段が20%下がり、そのあとさらに20%下がりました。40%下がったことになるでしょうか。こうした問題では、1%は何かの100分の1で、難しさはすべて、その「何か」にあります。元の値段か新しい値段か、鳥全部かニワトリだけか、ということです。手順ごとに、その前に「何のパーセント？」と問いかける子どもは、間違いのほとんどを避けられます。
  method: 手順ごとに、まず「何のパーセント？」と問いかける
  teaches: パーセントのもとにする量を見つけ、それが変わったときに気づく力
  # The words of its drawing: the whole it is drawn for.
  art:
    line: 100%は50

basis:
  title: パーセントのルール
  cards:
    - title: 100分の1
      text: >-
        1%は、ある量の100分の1です。100%はその量全体で、50%はその半分です。
      art:
        half: 50%は半分
    - title: 何のパーセント？
      text: >-
        パーセントはいつも何かのパーセントで、それは元の値段のことも新しい値段のことも、お客さん全員のことも女の子だけのこともあります。同じ10%でも、もとにする量が違えば違う数になります。
      art:
        tens: 200の10% = 20 · 50の10% = 5
    - title: まず10%から
      text: >-
        10%は、その量を10でわったものです。10%がわかれば、20%、30%、5%まではあと1歩です。80の30%は3 × 8 = 24です。
      art:
        eighty: 80は8の10個分

idea:
  title: もとにする量が変わる
  lead: どのパーセントも、そのときの量に対するものです。値段が2回変わるときは、2回目の変化は新しい値段に対して考えます。
  table:
    head:
      - 段階
      - もとにする量
      - そのあとの値段
    rows:
      - - 20%引き
        - 200、つまり40引き
        - "160"
      - - さらに20%引き
        - 160、つまり32引き
        - "128"
      - - 両方合わせて
        - 200、つまり72引き
        - 36%引き（40%ではない）
  note:
    title: なぜ大切か
    text: >-
      お店も銀行もニュースもパーセントで話しますが、気をつけたいのは、いつもそれが何のパーセントかということです。「何のパーセント？」と問いかける子どもは、算数オリンピックにも、お店での買い物にも、同じように準備ができています。

method:
  title: 解き方：100%が何かを言う
  lead: >-
    手順ごとに、その前に、どの量が100%かを言ってください。その1%か10%を求め、それから問題に必要なパーセントを求めます。量が変わったら、新しい100%からやり直します。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 何が100%かを言う
    - その1%か10%を求める
    - 聞かれているパーセントを求め、何のパーセントかを確かめる
  # The key under the steps: what a grid of the drawings stands for.
  legend:
    hundred: 100マスのマス目が100%

examples:
  - title: スポーツクラブ
    question: >-
      ある学校の児童は300人で、そのうち35%がスポーツクラブに通っています。スポーツクラブに通っていない児童は何人ですか。
    steps:
      - 100%は児童300人全員なので、1%は300 ÷ 100 = 3人です。
      - クラブに通っていない児童は、全体の100% − 35% = 65%です。
      - 65%は65 × 3 = 195人です。
    answer: 195人です。
    note:
      title: 別の解き方
      text: >-
        300人の35%は35 × 3 = 105人で、これがクラブに通っている児童です。300 − 105 = 195。どちらの解き方でも答えは同じですが、はじめから65%を求めれば、手順が1つ省けます。
    art:
      go: 100マス中35マスがクラブに通う
      grid: マス目全体で300人
      cell: 1マスが3人
      go-short: 通う
      do-not: 通わない
  - title: 自転車の値段
    question: >-
      自転車の値段は400コインです。春に値段が25%上がり、秋にはその新しい値段が20%下がりました。今、自転車の値段は何コインですか。
    steps:
      - >-
        春は、元の値段の400コインが100%です。その25%は100コインなので、自転車は500コインになります。
      - 秋は、新しい値段の500コインが100%です。その20%は100コインです。
      - 500 − 100 = 400。自転車の値段は、また400コインにもどりました。
    answer: 400コインです。
    note:
      title: なぜ420ではないのか
      text: >-
        420になるのは、秋の20%を元の値段からとって、80コインとした場合です。でも、秋には値段は500になっていて、500の20%は100です。
    art:
      coins: コイン：春より前の値段
      quarters: 100% = 400：25%が4つ
      five-hundred: 500コイン
      fifths: 100% = 500：20%が5つ
      of-old: 400の20% = 80 →
      of-new: 500の20% = 100 →
  - title: かわいていくスイカ
    question: >-
      農家の人が、水分が99%のスイカを200kg持っています。1週間後、スイカは少しかわいて、水分が98%になりました。今、スイカの重さは何kgですか。
    steps:
      - >-
        かわいてもへらないのは、水でない部分です。200kgの1%なので、2kgです。この部分は2kgのまま変わりません。
      - 1週間後には水分が98%なので、その2kgは新しい重さの2%にあたります。
      - 2%が2kgなので、1%は1kg、100%は100kgです。
    answer: 100kgです。
    note:
      title: 重さが半分に？
      text: >-
        そうです。水分は99%から98%に下がっただけですが、水でない部分は1%から2%へと2倍になりました。その2kgは変わらないので、全体の重さは半分になるしかありません。
    art:
      melons: 200kg、水分99%
      dry: 200kg：1マスが1kg。オレンジ色のマスは水でない部分で2kg
      same: 同じ2kgが、今は100マス中2マス
      was: 前：200kg
      became: 後：100kg
      water: 水分99%

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  percent_wrong_base:
    shows: >-
      違う量をもとにしてパーセントを求めてしまいます。秋の20%を新しい値段ではなく元の値段から求めたり、98%をスイカの元の重さから求めたりします。
    say: 「いま100%にあたるのは、どの量？」
    art:
      question: 秋の値段は500、20%引き
      of-old: 400の20% =
      of-new: 500の20% =
  part_whole_swap:
    shows: >-
      部分を全体と、あるいは全体を部分ととりちがえてしまいます。水でない2kgをスイカの重さとして答えたり、問題が学校の一部について聞いているのに、学校全体を数えたりします。
    say: 「この数は部分？それとも全体？」
    art:
      question: スイカの重さは？
      dry: 2kg
      only-dry: 水でない部分だけ
      all: 100kg
      weight: 全体の重さ
  answered_other_question:
    shows: >-
      途中で出てきた数が答えになってしまいます。問題はクラブに通っていない児童について聞いているのに、通っている105人を答えたり、値段ではなく、値段が変わった分の100コインを答えたりします。
    say: 「問題がほんとうに聞いているのは何？」
    art:
      question: クラブに通わない児童は何人？
      go: 通う
      do-not: 通わない

home:
  - title: お店でパーセント
    text: >-
      お店で割引の値段を見つけて、一緒に計算してみてください。150の20%引きはいくら？10%から始めましょう。
  - title: まず10%から
    text: >-
      80、350、1200など、いろいろな数の10%を求める練習をしてみてください。10%がわかれば、ほかのパーセントのほとんどは、あと1歩です。
  - title: 何のパーセント？
    text: >-
      ニュースや広告でパーセントを耳にしたら、「何のパーセント？」と一緒に問いかけてみてください。だれも言っていないことがよくあります。

# What a parent can write in the chat to get a task on this topic.
ask: 百分率の問題を出してください
