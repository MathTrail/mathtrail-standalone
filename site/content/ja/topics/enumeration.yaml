# The page of the topic of enumeration, for a parent, in Japanese. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: 場合の数
description: 場合の数の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words every drawing of the page writes its people in: the three
# children's letters, and Lea's and Tom's initials.
art:
  a: A
  b: B
  c: C
  lea: サ
  tom: ト

hero:
  lead: >-
    この数字を使うと、数はいくつ書けるでしょう？握手は何回、服の組み合わせや一列の並び方は何通りあるでしょう？こうした問題では、もれなく、重なりなく数えられる順番で、場合をすべて書き出します。ルールに沿った書き出しは、当てずっぽうでは答えられないほど大きな問いに向かうとき、子どもが最初に手にする道具です。
  method: ルールを決めて、場合を書き出す
  teaches: 順序よく取り組み、場合を書き出さずに数えられるときを見分ける力
  # The words of its drawing: the question and the rule over it, and the count
  # under it.
  art:
    line: 1、2、3のちがう数字でできる2けたの数はいくつ？
    rule: ルールに沿って書き出す：まず十の位を決める
    count: 十の位が3通り × 一の位が2通り = 6個の数

basis:
  title: 書き出しのルール
  cards:
    - title: 順序よく
      text: >-
        書き出す前に、場合を並べる順番を決めます。まず先頭の文字で並べ、先頭が同じものは次の文字で並べます。順序よく並んだ書き出しなら、もれた場合はすき間になって目に見えます。
      art:
        on: "{child}が先頭"
        # The case the listing lost: its two letters and a question mark, as the
        # language writes one.
        lost: "{first}{second}？"
    - title: どの場合も一度だけ
      text: >-
        数える前に、何がちがえば別の場合になるのかを決めます。サナとトモの握手は1回ですが、サナがトモの前に並ぶ列と、トモがサナの前に並ぶ列は、ちがう2つの列です。
      art:
        handshake: 握手は1回
        queues: 列は2通り
    - title: 選び方はかけ算
      text: >-
        カップを選び、次に受け皿を選ぶように、続けて選んでできる場合は、かけ算で数えます。カップ3個と受け皿2枚なら、セットは3 × 2 = 6組です。
      art:
        sets: 3 × 2 = 6組

idea:
  title: 順番は関係ある？
  lead: 同じ子どもA、B、Cでも、質問がちがえば、数える場合の数もちがいます。
  table:
    head:
      - 質問
      - 順番は関係ある？
      - 場合
    rows:
      - - 一列に並ぶ方法は何通り？
        - はい：ABとBAは別々の列
        - ABC、ACB、BAC、BCA、CAB、CBA：6通り
      - - おつかいに行くペアは何組？
        - いいえ：ABとBAは同じペア
        - AB、AC、BC：3組
      - - リーダーと手伝い係の選び方は何通り？
        - はい：リーダーが先（大きいほう）
        - AB、AC、BA、BC、CA、CB：6通り
  note:
    title: なぜ大切か
    text: >-
      このテーマの間違った答えの多くは、同じ場合を二重に数えたか、別々の場合を同じものとみなしたものです。順番が関係あるかどうかを先に決めておけば、どちらの間違いに気をつければよいかがわかります。

method:
  title: 解き方：ルールに沿った書き出し
  lead: >-
    まず、書き出しで何を最初にし、何を次にするかというルールを決めます。それから、そのルールに沿って場合を書き出すか、ルールからきまりが見えてきたら、それを使って数えます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 何がちがえば別の場合になるかを決める
    - ルールに沿って場合を書き出す
    - 数えるか、続けて選ぶときはかけ算をする
  # The key under the steps: what a frame on the drawings means.
  legend:
    frame: 青い枠：この手順で加わったもの

examples:
  - title: 2本のしまの旗
    question: >-
      旗に、上下に並んだ2本のしまがあります。しまの色は赤、黄色、緑のどれかで、2本のしまの色はちがいます。旗は何通りできますか。
    steps:
      - >-
        上のしまの色で、旗を順に並べます。上が赤なら、下は黄色か緑で、旗は2通りです。
      - >-
        上が黄色なら、下は赤か緑で、さらに2通り。上が緑なら、下は赤か黄色で、さらに2通りです。
      - >-
        上の色は3通りで、そのどれでも、下の色は残りの2通りです。3 × 2 = 6通りの旗ができます。
    answer: 6通りです。
    art:
      paints: 3色の絵の具、上下はちがう色
      red-top: 上が赤
      red: 赤
      yellow: 黄色
      green: 緑
      top: 上 ↓
      bottom: 下 →
      same: ×：上下が同じ色はだめ、9 − 3 = 6
  - title: 3ちがいの数字
    question: 14や30のように、十の位と一の位の数字の差が3である2けたの数は、何個ありますか。
    steps:
      - >-
        十の位の数字を1から9まで順に見ていき、それぞれの横に、差が3になる一の位の数字をすべて書きます。1 → 4、2 → 5、3 → 0と6、4 → 1と7、というように続けます。
      - >-
        十の位が3、4、5、6のときは、3小さい数字と3大きい数字の2個ずつです。十の位が1、2、7、8、9のときは1個だけです。もう一方は数字にならないからです。
      - >-
        4 × 2 + 5 × 1 = 13個で、14、25、30、36、41、47、52、58、63、69、74、85、96です。
    answer: 13個です。
    note:
      title: いちばんもれやすい場合
      text: >-
        子どもが忘れやすいのは30です。0は一の位には使えますが、十の位には使えません。ルールに沿った書き出しならこの数も見つかりますが、思いつくままの書き出しでは見つかりません。
    art:
      given: 十の位と一の位の差は3
      under: 上に十の位、その下に合う一の位
      two: 青：2個ずつ
      can: 使える
      not: 2けたの数ではない
  - title: 2がとなり合わない数
    question: >-
      1と2の数字だけを使って、2がとなり合わないように書ける4けたの数は、何個ありますか。
    steps:
      - >-
        多すぎて当てずっぽうでは数えられないので、けたをふやしながら組み立てます。1けたなら、1と2の2個。2けたなら、22はだめなので、11、12、21の3個です。
      - >-
        条件に合う数は、1か2で終わります。1で終わる数は、条件に合う1けた短い数の後ろに1をつけたものです。2で終わる数は、その前の数字が1でなければならないので、条件に合う2けた短い数の後ろに12をつけたものです。だから、それぞれの個数は直前の2つの個数の和になります。3けたなら3 + 2 = 5個、4けたなら5 + 3 = 8個です。
      - >-
        書き出して確かめます。1111、1112、1121、1211、2111、1212、2112、2121の8個です。
    answer: 8個です。
    note:
      title: ふえていく個数
      text: >-
        個数の2、3、5、8は、13、21、34と続き、どれも直前の2つの和です。算数オリンピックの問題は、小さい場合の個数から組み立てられる個数が大好きです。
    art:
      twos: 2がとなり合うのはだめ
      one: 1けた
      two: 2けた
      three: 3けた
      four: 4けた

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  missed_case:
    shows: >-
      子どもが、思いついた順に場合を書いていき、1つもらしてしまいます。もれるのは、0を使う場合や、同じ数字をくり返す場合が多いです。
    say: 「どんな順番で書いたの？ルールを決めて、もう一度書いてみよう」
    art:
      question: 3ちがいの数字
  wrong_operation:
    shows: >-
      選び方がかけ算になるところで、子どもがたし算をしてしまい、シャツ3枚とマフラー2枚で5通りとします。または、ペアを選ぶ場面でかけ算をしてしまい、だれも自分自身とはペアになれないことを見落とします。
    say: 「シャツを1枚選ぶと、組み合わせは何通り？シャツは全部で何枚ある？」
    art:
      question: シャツ3枚とマフラー2枚
  double_count:
    shows: >-
      サナがトモと握手するのと、トモがサナと握手するのを、2回の握手として数えてしまいます。本当は1回です。
    say: 「これは、もうある場合と同じじゃないかな？」

home:
  - title: ぬいぐるみの着せかえ
    text: >-
      ぬいぐるみ用のぼうし2つとマフラー3枚をお子さまに渡し、着せ方が何通りあるか聞いてみましょう。それから書き出してもらい、一緒に確かめます。
  - title: ルールをたずねる
    text: >-
      お子さまが場合を書き出しているときは、「どんな順番で書いているの？」と聞いてみてください。ルールのある書き出しは、確かめることのできる書き出しです。
  - title: 暗証番号のかぎ
    text: >-
      1、2、3の数字でできた2けたの暗証番号のかぎを考えて、どろぼうなら番号を何通り試さなければならないか、お子さまに見つけてもらいましょう。

# What a parent can write in the chat to get a task on this topic.
ask: 場合の数の問題を出してください
