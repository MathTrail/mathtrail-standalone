# The page of the topic of weighing and pouring, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: てんびんと水の移しかえ
description: てんびんと水の移しかえの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words the page's drawings write a jug's size, a step and a move in.
art:
  litres: "{count}L"
  step: 回数
  pour: 移す
  empty: すてる
  fill: 満たす
  top: つぎ足す

hero:
  lead: >-
    5リットルの入れ物と3リットルの入れ物で、ちょうど4リットルの水をはかるにはどうすればよいでしょうか。おもりのないてんびんで、たくさんのコインにまじった1枚の軽いコインを見つけるには、どうすればよいでしょうか。こうした問題では、子どもが短い手順を計画します。そして、入れ物に目盛りがない、てんびんにおもりがないといったルールの一つひとつが意味を持ちます。これは、何が起きてもうまくいく計画、つまりアルゴリズムとの最初の出会いです。
  method: 状態をすべて書き出し、いちばん短い道すじを探す
  teaches: 手順を先まで計画し、てんびんのどの結果も考えぬく力
  # The words of its drawing: what is measured over it, and what each pair of
  # jugs is.
  art:
    line: 5Lと3Lの入れ物で4Lをはかる
    pair: 1組が1つの状態：それぞれの入れ物に入っている量

basis:
  title: てんびんと水の移しかえのルール
  cards:
    - title: 状態は、すべての入れ物の量
      text: >-
        操作のたびに、5と0、次に2と3のように、それぞれの入れ物に入っている量を書いていきます。状態を書き並べておけば、どの状態にたどり着けるか、どの状態をもう通ったかがわかります。
    - title: 結果は3通り
      text: >-
        てんびんは、左に傾くか、右に傾くか、つり合うかのどれかなので、はかるたびに結果は3通りあります。コインは2つではなく、3つのグループに分けます。
      art:
        left: 左
        level: つり合う
        right: 右
    - title: ルールは一つひとつが大切
      text: >-
        入れ物に目盛りがない、水を捨ててはいけない、おもりは片方の皿にしかのせられない、といったルールは、どれも許される操作を変え、そのため答えも変えます。
      art:
        no-marks: 目もりなし
        pour-out: 水をすてる
        unless: 問題で許されていないかぎり
        weight: おもり
        one-pan: 片方の皿だけに

idea:
  title: てんびんの3通りの結果
  lead: はかるたびに結果は3通りあるので、コインを3つのグループに分けて調べられます。それによって、決まった回数で何枚のコインまで調べられるかが決まります。
  table:
    head:
      - はかる回数
      - 結果の数
      - 調べられるコイン
    rows:
      - - "1"
        - "3"
        - 3枚まで
      - - "2"
        - 3 × 3 = 9
        - 9枚まで
      - - "3"
        - 3 × 3 × 3 = 27
        - 27枚まで
  note:
    title: なぜ大切か
    text: >-
      コインを半分ずつに分けて比べる子どもは、必要以上に多くはかることになります。てんびんの答え方は2通りではなく3通りだと気づくこと、それがこの考え方のすべてです。そしてこの考え方は、のちにコンピューターサイエンスで探索として再び登場します。

method:
  title: 解き方：状態の表
  lead: >-
    水の移しかえでは、入れ物ごとに列を、操作ごとに行をとった表をつくり、目標が現れるまで、それぞれの行から許される操作をすべて試します。目標が最初に現れたところが、いちばん少ない回数です。てんびんでは、3通りの結果のそれぞれについて、次に何をするかを計画します。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 状態、つまりそれぞれの入れ物や皿の中身を書く
    - そこから、許される操作をすべて試す
    - 目標に着いたら止め、操作の回数を数える
  # The key under the steps: what a frame on the drawings means.
  legend:
    goal: 目標に到達

examples:
  - title: 1リットル
    question: >-
      コックさんのところには、空の3リットルの入れ物と、空の5リットルの入れ物と、じゃ口があります。入れ物に目もりはありません。コックさんは1回の操作で、じゃ口から水を入れて入れ物をいっぱいにするか、入れ物の水を全部すてるか、一方の入れ物からもう一方へ水を移すかの、どれかをします。水を移すときは、はじめの入れ物が空になるか、もう一方がいっぱいになるまで移します。どちらかの入れ物にちょうど1リットルの水を入れるには、少なくとも何回の操作が必要ですか。
    steps:
      - 3リットルの入れ物をいっぱいにして、5リットルの入れ物に移します。これで大きい入れ物には3リットル入っています。
      - >-
        もう一度3リットルの入れ物をいっぱいにして、大きい入れ物がいっぱいになるまで移します。大きい入れ物に入るのは、あと2リットルだけです。
      - 小さい入れ物に1リットルが残ります。ここまでの操作は、満たす、移す、満たす、移すの4回です。
    answer: 4回です。
    note:
      title: なぜもっと少なくできないのか
      text: >-
        3回までの操作でたどり着ける状態をすべて表にしても、1リットルはどこにもありません。入れ物に入っている量は、0、2、3、5リットルのどれかだけです。1リットルが初めて現れるのは、4回目の操作の後です。
    art:
      jugs: 3Lと5Lの入れ物、目もりなし
      rows: 4回の操作で、空の行の後に4行
      three: 3回までで：
      no-litre: 1Lはない
  - title: 8枚のコイン
    question: >-
      見た目が同じコインが8枚あります。そのうち1枚はにせのコインで、ほかのコインより軽く、ほかのコインの重さはどれも同じです。おもりを使わないてんびんで、にせのコインを確実に見つけるには、少なくとも何回はかる必要がありますか。
    steps:
      - 両方の皿に3枚ずつのせ、2枚はわきに置いておきます。
      - >-
        片方の皿が上がったら、にせのコインはその皿の3枚の中にあります。そのうちの1枚と1枚を比べると、軽いほうがにせのコインです。つり合えば、3枚目がにせのコインです。
      - >-
        皿がつり合ったら、わきに置いた2枚を比べます。にせのコインは、そのどちらかだからです。どちらの場合も2回はかれば十分で、1回では足りません。結果が3通りしかないのに、コインは8枚あるからです。
    answer: 2回です。
    note:
      title: なぜ4枚と4枚ではないのか
      text: >-
        4枚と4枚を比べると、1回目の後に4枚が残ります。その4枚を調べるにはあと2回かかるので、全部で3回です。3枚ずつのグループに分ければ、「つり合う」という結果にも役目ができます。
    art:
      one-lighter: 8枚のうち1枚が軽い
      three: 3枚対3枚
      aside: わきに置く
      lighter: 左が軽い
      one: 1枚対1枚
      found: 軽いほうがにせもの。つり合えば3枚目
      level: つり合う
      of-two: わきに置いた2枚で
      never-level: 必ずかたむく
      four-left: 残り4枚 → あと2回
  - title: 100枚のコイン
    question: >-
      見た目が同じ100枚のコインのうち、1枚がにせのコインで、ほかのコインより軽く、ほかのコインの重さはどれも同じです。おもりを使わないてんびんで、にせのコインを確実に見つけるには、少なくとも何回はかる必要がありますか。
    steps:
      - >-
        はかるたびに結果は3通りなので、4回はかっても、区別できるのは多くて3 × 3 × 3 × 3 = 81通りです。これはコインの100枚より少ないので、4回では足りません。
      - >-
        両方の皿に33枚ずつのせ、34枚はわきに置きます。どの結果になっても、残るのは多くて34枚です。同じようにして、34枚は多くて12枚になり、さらに4枚、2枚、1枚と減っていきます。
      - コインが100枚から34枚、12枚、4枚、2枚、1枚と減っていくので、はかる回数は5回です。
    answer: 5回です。
    note:
      title: 証明に必要な2つのこと
      text: >-
        答えには両方が必要です。5回でにせのコインを見つける計画と、4回ではけっして足りないことを示す、結果の数の数え上げです。算数オリンピックで「いちばん少ない」を問う問題の答えには、いつもこの2つがそろっています。
    art:
      aside: わきに置く
      numbers: 矢印の上の数は、何回目にはかったか
      plan: 計画
      always: 5回はかれば必ず見つかる
      bound: 限界
      at-most: 4回では多くて81通り

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      気づかないうちに、問題のルールを破ってしまいます。問題で許されていないのに水を捨てたり、入れ物にない目盛りまで水を入れたり、はかる物をのせた皿におもりをのせたりします。
    say: 「この問題で、していい操作はどれ？」
    art:
      question: 入れ物に目もりはない
      to-mark: 「1Lまで」入れる
      after-pouring: 移しかえて1L
  stopped_early:
    shows: >-
      確実になる前に、計画が止まってしまいます。1回はかってにせのコインのあるグループを見つけたところで探すのをやめたり、目標は1リットルなのに2リットルで移しかえをやめたりします。
    say: 「てんびんの結果がどれでも、もうはっきりわかる？」
    art:
      question: 1回目にはかった後
      here: 「ここにある」、でもどれ？
      one-more: もう1回はかる
  off_by_one:
    shows: >-
      操作の回数が1つずれます。最初に蛇口から水を入れた回を抜かしたり、最後に移した回を2回数えたりします。
    say: 「表でもう一度数えよう。1行で1回だよ」
    art:
      question: 表の1行が1回
      three: 3回
      four: 4回
      empty: 空 → 4つの状態

home:
  - title: 流しで水をはかる
    text: >-
      大きさの違うコップを2つ用意して、どちらのコップの容量とも違う量をはかってみてください。流しは最高の実験室で、水がこぼれても大丈夫です。
  - title: 軽いものさがし
    text: >-
      見た目が同じ物をいくつか用意して、その中に1つだけ軽い物をかくし、家にあるてんびんか、袋を2つつるしたハンガーで、それを見つけてみてください。はかった回数も数えましょう。
  - title: まず計画を立てる
    text: >-
      水を移したりはかったりする前に、計画を表に書き、一つひとつ確かめてみてください。大切なのは運ではなく、先に計画を立てる力です。

# What a parent can write in the chat to get a task on this topic.
ask: てんびんと水の移しかえの問題を出してください
