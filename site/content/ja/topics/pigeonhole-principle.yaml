# The page of the topic of the pigeonhole principle, for a parent, in Japanese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: ハトの巣原理
description: ハトの巣原理（鳩の巣原理）の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    5羽のハトが4つの巣箱に飛びこむと、どれかの巣箱には必ず2羽が入ります。こうした問題で子どもは、どんなに運が悪くても何かが必ず起こることを証明します。暗い引き出しから同じ色のくつ下が2枚出る、同じ月に誕生日が2つある、といったことです。運がいい場合ではなく、最悪の場合について筋道を立てて考えることに、はじめて出会うテーマです。
  method: いちばん運が悪い場合を最後までたどり、1つたす
  teaches: 起こりうるだけでなく、必ず起こることを証明する力
  # The words of its drawing: the pigeons and the cages over it, and what the
  # seating always comes to.
  art:
    line: 5羽のハト、4つの巣箱
    seat: 好きなように入れる
    two: 2羽
    always: どう入れても、どれかの巣箱に2羽

basis:
  title: 最悪の場合のルール
  cards:
    - title: 巣箱よりハトが多い
      text: >-
        ハトが巣箱より多ければ、どれかの巣箱には少なくとも2羽が入ります。どんなに均等に分けても、必ず1羽があまります。
    - title: 確実に
      text: >-
        「確実に」とは、袋から何が出てきても、という意味です。ですから、すべてができるかぎり悪いほうへ進むと考えて、運の悪さがどこまで続くかを見てください。
      art:
        luck: 運がいい
        not-counted: 数に入らない
        bad-luck: 運が悪い
    - title: あと1つで決まる
      text: >-
        運の悪さが出つくしたら、つまりどの色も1回ずつ出て、どの巣箱も1回ずつうまったら、次の1つは必ずほしいものになります。
      art:
        eighth: どの曜日にも1羽、8羽目でペアができる

idea:
  title: いちばん運が悪い場合と、あと1つ
  lead: どの問題も、確実に起こることを聞いています。答えは、運の悪さがどこまで続くかに、あと1つをたしたものです。
  table:
    head:
      - 確実にほしいもの
      - 運が悪いと先に出るもの
      - だから必要な数
    rows:
      - - 同じ曜日に生まれた2人
        - 7つの曜日に1人ずつ
        - 7 + 1 = 8人
      - - 青6個と赤4個から、赤い玉1個
        - 青い玉6個全部
        - 6 + 1 = 7個
      - - 青6個と赤4個から、赤い玉2個
        - 青い玉6個全部と赤1個
        - 6 + 1 + 1 = 8個
  note:
    title: なぜ大切か
    text: >-
      子どもはよく、「いきなり赤い玉を2個取れるかも」と運にたよります。「確実に」と書かれた問題は、いちばん運が悪いときに何が起こるかを聞いています。そう考える習慣は、どんな公式よりも価値があります。

method:
  title: 解き方：いちばん運が悪い場合と、あと1つ
  lead: >-
    色、月、曜日など、巣箱にあたるものを決め、いちばん運が悪い場合を最後までたどってください。問題が求めるものをまだくれないものを、全部取り出すのです。次の1つは、必ず求めるものになります。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 巣箱とハトを見つける
    - いちばん運が悪い場合を最後までたどる
    - 1つたして、それで決まることを確かめる
  # The key under the steps: what the drawings' bracket and ring mean.
  legend:
    bad-luck: 運が悪い
    decides: 決め手になるあと1つ

examples:
  - title: びんの中のあめ
    question: >-
      びんの中に、レモン味のあめが8個と、オレンジ味のあめが2個入っています。ヒカルは中を見ないで、あめを取り出します。オレンジ味のあめを確実に手に入れるには、少なくとも何個取り出せばよいですか。
    steps:
      - ヒカルがほしいのは、オレンジ味のあめです。いちばん運が悪いのは、レモン味が次々に出る場合です。
      - >-
        レモン味のあめは8個しかありません。8個取り出したあとは、びんの中にはオレンジ味のあめしか残っていません。
      - 9個目のあめは必ずオレンジ味です。8 + 1 = 9。
    answer: 9個です。
    art:
      lemon: レモン味、8個
      orange: オレンジ味、2個
      unlucky: 運が悪い
      all-lemons: レモン味8個全部
      lemons: レモン味8個
  - title: 黒いくつ下を2枚
    question: >-
      引き出しに、黒いくつ下が8枚、白いくつ下が6枚、しまもようのくつ下が2枚、まざって入っています。ゲンは暗い中で、くつ下を取り出します。黒いくつ下を確実に2枚手に入れるには、少なくとも何枚取り出せばよいですか。
    steps:
      - >-
        いちばん運が悪いのは、黒でないくつ下が先に出る場合です。白が6枚、しまもようが2枚で、黒がまじっていない8枚です。
      - >-
        運の悪さは、まだ続きます。次のくつ下は黒ですが、1枚だけです。これで9枚になり、そのうち黒は1枚だけです。
      - >-
        10枚目のくつ下も必ず黒です。残っているのは黒いくつ下だけだからです。だから10枚です。
    answer: 10枚です。
    note:
      title: なぜ9枚ではないのか
      text: >-
        白6枚としまもよう2枚が全部出たあとも、運の悪さにはもう1回出番があります。黒いくつ下が1枚だけ出る場合です。黒2枚が確実になるのは、10枚目を取り出したときです。
    art:
      black: 黒、8枚
      white: 白、6枚
      striped: しまもよう、2枚
      no-black: 黒なしの8枚
      not-black: 黒でない8枚
      one: 1枚
      only-one: 9枚で、黒は1枚だけ
  - title: マス目の和
    question: >-
      たて2マス、横2マスのマス目の、どのマスにも1、2、3のどれかが書いてあります。横の並び、たての並び、ななめの並びのそれぞれで、2つの数をたします。この6つの和のうち、どれか2つはいつも等しくなるといえますか。
    steps:
      - >-
        巣箱を数えます。1、2、3から選んだ2つの数の和は、2、3、4、5、6のどれかで、全部で5通りです。
      - ハトを数えます。横の並びが2つ、たての並びが2つ、ななめの並びが2つで、和は6つです。
      - >-
        和は6つ、値は5通りしかありません。だから、マス目にどんな数が入っていても、どれか2つの和は必ず等しくなります。
    answer: はい、いつもそうなります。
    badge: はい
    note:
      title: 巣箱は箱とはかぎらない
      text: >-
        ここでは、巣箱は和がとりうる値で、ハトはマス目の並びです。この種類の問題のコツは、何が巣箱の役をしているかを見ぬくことです。
    art:
      example: たとえば：どのマスにも1、2、3のどれか
      cages: 5つの巣箱：ありうる和
      row: 横
      column: たて
      diagonal: ななめ
      pigeons: 6つの和、6羽のハト
      two: 6羽のハトが5つの巣箱に：どれかに2羽
      cages-name: 巣箱
      pigeons-name: ハト

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  best_case_not_worst:
    shows: >-
      子どもは「最初の2枚が黒なら、2枚で足りる」と運にたよってしまいます。しかし問題には「確実に」とあり、この言葉がしめ出しているのが、まさに運なのです。
    say: 「もし、いちばん運が悪かったら？」
    art:
      question: 確実に黒を2枚
  ignored_condition:
    shows: >-
      問題の言葉が1つ抜け落ちてしまいます。「黒いくつ下2枚」を「同じ色のくつ下2枚」と読んだり、「どの色も1枚ずつ」を「1つの色」と読んだりします。
    say: 「もう一度問題を読んでみよう。確実に手に入れないといけないのは、何？」
    art:
      question: ほしいもの：**黒い**くつ下2枚
      black-pair: 黒どうしのペア
  off_by_one:
    shows: >-
      子どもは、いちばん運が悪い場合を最後までたどったところで止まって、決め手になるあと1つを忘れたり、反対に1つ多くたしたりします。
    say: 「運の悪いのが全部終わったら、次の1つは何になる？」
    art:
      question: レモン味8個とオレンジ味2個

home:
  - title: 暗やみの中のくつ下
    text: >-
      2〜3色のくつ下を袋に入れて、目をつぶって取り出してみてください。何枚取り出したら、確実にペアになる？何回か試してみてください。運は変わっても、答えは変わりません。
  - title: 「必ず」か「かもしれない」か
    text: >-
      お子さまが「そうなるかもしれない」と言ったら、「そうならないこともある？」と聞いてみてください。「かもしれない」と「必ず」の違いが、このテーマのすべてです。
  - title: 巣箱を見つける
    text: >-
      7つの曜日、12か月、4つの季節など、身近な数の中に、一緒に巣箱を探してみてください。「30人いたら、同じ月に生まれた2人が必ずいる？」

# What a parent can write in the chat to get a task on this topic.
ask: ハトの巣原理の問題を出してください
