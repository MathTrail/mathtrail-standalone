# The page of the topic of overlapping groups, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 集合算
description: 集合算とベン図の問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

hero:
  lead: >-
    チェスクラブに通う子もいれば、サッカーに通う子も、両方に通う子も、どちらにも通わない子もいます。こうした問題ではグループが重なっていて、コツは全員をちょうど1回ずつ数えることです。紙に2つの円のベン図をかけば、こんがらがった問題が4つの数に変わります。
  method: 円をかいて、真ん中から始める
  teaches: 同じものを2回数えずに数え、それぞれの数が何を表すかを言う力
  # The words of its drawing: what the two circles are, and what their middle
  # means.
  art:
    line: クラスのクラブ
    chess: チェス
    football: サッカー
    middle: 真ん中は、両方に通う子

basis:
  title: 2つの円のルール
  cards:
    - title: たすと2回数えてしまう
      text: >-
        2つのグループの人数をたすと、両方に入っている子は、それぞれのグループで1回ずつ、合わせて2回数えられます。その子たちを1回分ひけば、全員がちょうど1回ずつ数えられたことになります。
      art:
        choir: 合唱14人
        art: 美術11人
        twice: 14 + 11 = 25、ただし4人は2回数えている：25 − 4 = 21
    - title: どちらにも入らない子もいる
      text: >-
        どの子もグループに入らなければならないわけではありません。クラス全員は、少なくとも1つのグループに入っている子と、どのグループにも入っていない子を合わせた人数です。
      art:
        class: クラス全員
        none: どちらにも入らない9人
    - title: 真ん中がわからないとき
      text: >-
        両方のグループに入っている人数が書かれていなければ、その数は範囲をしぼることしかできません。グループの重なりが大きいほど、どちらかのグループに入っている子どもは少なくなります。
      art:
        little: 少し重なる
        much: 大きく重なる

idea:
  title: 図の4つの部分
  lead: >-
    児童30人のうち、14人が合唱クラブ、11人が美術クラブに入っていて、4人は両方に入っています。図を真ん中から外へとうめていきます。
  table:
    head:
      - 部分
      - 人数
      - 求め方
    rows:
      - - 両方
        - "4"
        - 問題文にある
      - - 合唱だけ
        - 14 − 4 = 10
        - 合唱クラブから両方の子をのぞく
      - - 美術だけ
        - 11 − 4 = 7
        - 美術クラブから両方の子をのぞく
      - - どちらでもない
        - 30 − 10 − 7 − 4 = 9
        - 残りの全員
  note:
    title: なぜ大切か
    text: >-
      間違った答えのほとんどは、両方のグループの人数をたして、真ん中を2回数えたことを忘れるか、問題が合唱クラブ全員を聞いているのに「合唱だけ」を答えることから生まれます。図を真ん中から外へうめていけば、どちらも防げます。

method:
  title: 解き方：真ん中から外へ
  lead: >-
    重なり合う2つの円（ベン図）をかきます。まず真ん中に両方に入っている人数を書き、次にそれぞれの円の真ん中以外の部分、最後に外側の人数を書きます。真ん中がわからないときは、とりうる値を試して、どれが合うかを確かめます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 円をかく
    - 真ん中をうめてから、残りをうめる
    - 部分を合わせると全員になるか確かめる
  # The key under the steps: what a ring on a number means.
  legend:
    filled: 青い輪：この手順でうめるところ

examples:
  - title: 姉妹と兄弟
    question: >-
      子ども24人のうち、姉か妹がいる子は15人、兄か弟がいる子は11人、その両方がいる子は6人です。どちらもいない子は何人ですか。
    steps:
      - >-
        「姉・妹」と「兄・弟」のベン図をかきます。真ん中に入るのは、両方がいる6人です。
      - 姉か妹だけ：15 − 6 = 9。兄か弟だけ：11 − 6 = 5。
      - 円の中：9 + 6 + 5 = 20人。円の外：24 − 20 = 4人。
    answer: 4人です。
    art:
      sister: 姉・妹
      brother: 兄・弟
      all: 全員：24
      only: 15 − 6 = 9 · 11 − 6 = 5
      out: 外側：24 − 20 = 4
  - title: リンゴとナシ
    question: >-
      子ども25人のうち、リンゴが好きな子は18人、ナシが好きな子は16人です。リンゴもナシも好きな子は、少なくとも何人いますか。
    steps:
      - >-
        真ん中をできるだけ小さくするには、リンゴが好きな子とナシが好きな子を、できるだけ別々にします。
      - >-
        別々にすると18 + 16 = 34人分の場所がいりますが、子どもは25人しかいません。だから34 − 25 = 9人は、どうしても両方の円に入ります。
      - >-
        9人はありえます。リンゴだけが好きな子が9人、ナシだけが7人、両方が9人で、合わせて25人、はみ出す子はいません。
    answer: 9人です。
    note:
      title: では、多くて何人？
      text: >-
        いちばん多いのは、ナシが好きな16人全員がリンゴも好きな場合です。真ん中は9人から16人までのどこかで、問題が聞いていたのは小さいほうの端です。
    art:
      apples: リンゴ
      kids: 子ども
      pears: ナシ
      ends: リンゴは左端から、ナシは右端から
      violet: 紫は両方好きな子：9人
      all: 全員：25
      inside: ナシ好きの16人全員がリンゴの中
  - title: 3つの教科
    question: >-
      20人の児童がいて、どの児童も、算数、国語、図工の3つの教科のうち少なくとも1つが好きです。算数が好きな児童は12人、国語は10人、図工は9人です。3つとも好きな児童はいません。ちょうど2つの教科が好きな児童は何人ですか。
    steps:
      - >-
        3つの人数をたします。12 + 10 + 9 = 31。1つの教科が好きな児童はこの合計に1回、2つが好きな児童は2回数えられています。
      - >-
        児童は20人なので、31 − 20 = 11回分が余分です。2回数えられた児童1人につき、1回分ずつです。
      - >-
        だから、ちょうど2つの教科が好きな児童は11人です。確かめ：1つが好きな児童が9人、2つが好きな児童が11人で、9 + 2 × 11 = 31。
    answer: 11人です。
    note:
      title: わざと2回数える
      text: >-
        ここでのカギは、円ではなく合計です。どの児童も、好きな教科1つにつき1ずつ合計を増やします。グループについての算数オリンピックの問題は、同じものを2通りに数えることで解けることがよくあります。
    art:
      maths: 算数12人
      reading: 国語10人
      drawing: 図工9人
      once: 1回
      twice: 2回
      each: 1人1回で20、余分は31 − 20 = 11

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      子どもは、両方のグループの15と11をたして、その合計を子どもの人数だと思ってしまいます。これでは、両方のグループに入っている子を2回数えています。
    say: 「両方の円で数えた人はいない？」
    art:
      question: 姉・妹15人、兄・弟11人、両方6人
  answered_other_question:
    shows: >-
      子どもは図のある部分を求めて、それを答えにしますが、問題が聞いていたのは別の部分です。「どちらでもない」のかわりに「両方」を、合唱クラブ全員のかわりに「合唱だけ」を答えてしまいます。
    say: 「問題が聞いているのは、図のどこ？指でさしてみよう」
    art:
      question: 問題：どちらもいない子は何人？
  missed_case:
    shows: >-
      図の一部が抜け落ちます。全員から片方のグループだけをひいてもう片方を忘れたり、3つのグループ全部に入っている子をたし戻さなかったりします。
    say: 「図の部分は、全部うまった？」
    art:
      question: 24人：姉・妹15人、兄・弟11人、両方6人

home:
  - title: 床に輪を2つ
    text: >-
      フラフープを2つ、またはひもで作った輪を2つ、重なるように床に置いて、おもちゃを「赤い」と「やわらかい」に分けます。赤くてやわらかいクマのぬいぐるみは、真ん中に入ります。
  - title: どんな6人？
    text: >-
      お子さまが「6人」と答えたら、「どんな6人？」と聞いてみましょう。両方のクラブに入っている6人と、どちらにも入っていない6人は、ちがう答えです。
  - title: 家族アンケート
    text: >-
      家族に、お茶が好きなのはだれか、ココアが好きなのはだれか、のように2つ質問して、一緒に円をかきましょう。数え間違いが起きやすいのは、たいてい真ん中です。

# What a parent can write in the chat to get a task on this topic.
ask: 集合算の問題を出してください
