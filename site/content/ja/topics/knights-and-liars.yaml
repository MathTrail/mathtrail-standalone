# The page of the topic of knights and liars, for a parent, in Japanese. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: 正直者とうそつき
description: 正直者とうそつきの問題とはどんなものか、どう解くのか、子どもがつまずきやすいところ、家庭でできることを紹介します。

# The words every drawing of the page writes its islanders in: the letters
# of a knight and of a liar, and the islanders' own.
art:
  knight: 正
  liar: う
  a: A
  b: B
  c: C

hero:
  lead: >-
    ある島には、いつも本当のことを言う正直者と、いつもうそを言ううそつきが住んでいます。住人たちの言葉から、だれが正直者で、だれがうそつきかを見分けなければなりません。多くの子どもにとって、これが本格的な論理的推論との最初の出会いになります。仮定を立て、そこから何が導かれるかをたどり、矛盾に気づくのです。
  method: 「この人が正直者だと仮定すると…」
  teaches: 順を追って考え、自分で確かめる力
  # The words of its drawing: the key of the letters over it, and in it the
  # first example's two suppositions and how each ends.
  art:
    knight: 正直者はいつも本当のことを言う
    liar: うそつきはいつもうそを言う
    says: 「わたしはうそつきで、Bは正直者です」
    rule: 仮定して、確かめる
    if-knight: Aが正直者なら、Aはうそつきになる
    contradiction: 矛盾
    if-liar: Aがうそつきなら、Bもうそつき
    fits: つじつまが合う

basis:
  title: 島のルール
  cards:
    - mark: 正
      title: 正直者
      text: いつも本当のことを言います。正直者の発言は、例外なくすべて本当です。
    - mark: う
      title: うそつき
      text: いつもうそを言います。うそつきの発言はすべてうそで、たまたま本当のことを言うことも決してありません。
    - mark: "?"
      title: ほかにはいない
      text: 島の住人は、だれもが正直者かうそつきのどちらかです。見た目では区別できず、言葉でしか見分けられません。

idea:
  title: だれが何を言えるか
  lead: まず、次の2つの発言から始めましょう。この種の問題のしくみが、すぐにわかります。
  table:
    head:
      - 発言
      - 正直者
      - うそつき
      - 意味
    rows:
      - - 「わたしは正直者です」
        - ✓ 言える：本当のことだから
        - ✓ 言える：うそになり、うそつきの言葉にふさわしいから
        - 何もわからない。だれでも言えるから。
      - - 「わたしはうそつきです」
        - ✕ 言えない：うそになってしまうから
        - ✕ 言えない：本当のことになってしまうから
        - ありえない発言。だれも言えない。
  note:
    title: なぜ大切か
    text: >-
      住人が「わたしは正直者です」と言ったら、その発言は消してかまいません。何も変わらないからです。そして、解いている途中で、だれかが事実上「わたしはうそつきです」と言ったことになるとわかったら、最初に立てた仮定が間違っています。

method:
  title: 解き方：「…と仮定すると」
  lead: >-
    この種の問題は、ほとんどが同じ方法で解けます。住人を1人選び、その人が正直者かうそつきかを仮定して、そこから何が導かれるかを調べます。下の例題は、いちばんやさしい問題から算数オリンピックの問題へと進みます。
  steps:
    - 仮定する
    - そこから導かれることを考える
    - 矛盾を見つけるか、答えを確かめる

examples:
  - title: 道で出会った2人
    question: >-
      島の住人AとBが、道で出会いました。Aは「わたしはうそつきで、Bは正直者です」と言いました。AとBは、それぞれ正直者ですか、うそつきですか。
    steps:
      - >-
        **Aが正直者だと仮定します**。すると発言は本当なので、Aはうそつきです。しかし、Aは正直者だと仮定したので、**矛盾**です。この場合はありえません。
      - >-
        **Aがうそつきだと仮定します**。すると発言はうそです。前半の「わたしはうそつきです」は本当なので、うそなのは後半です。つまり、Bは正直者ではなく、うそつきです。**すべてつじつまが合います**。
    answer: AもBもうそつきです。
    note:
      title: うそつきが「わたしはうそつきです」と言えるのはなぜ？
      text: >-
        「わたしはうそつきです」だけなら、ありえない発言です。でも、ほかの文と「そして」の意味でつなげば、うそつきにも言えます。文の一部がうそなら、それだけで文全体がうそになるからです。
    art:
      says: 「わたしはうそつきで、Bは正直者です」
      contradiction: 矛盾
      fits: すべてつじつまが合う
      alone: 「わたしはうそつきです」
      nobody: だれも言えない
      liar-can: うそつきも言える
  - title: 非難の連鎖
    question: >-
      島の住人A、B、Cがいます。Aは「Bはうそつきです」、Bは「Cは正直者です」、Cは「AもBもうそつきです」と言いました。だれが正直者で、だれがうそつきですか。
    steps:
      - >-
        **だれから考えるか**。いちばん多くのことを言っている人からです。その言葉から、より多くのことが導かれるからです。それはCです。
      - >-
        **Cが正直者だと仮定します**。するとAもBもうそつきです。しかし、Bは「Cは正直者です」と言っていて、これは本当のことになります。うそつきが本当のことを言うことはありません。**矛盾**です。
      - >-
        **したがって、Cはうそつきです**。するとBの「Cは正直者です」はうそなので、Bもうそつきです。
      - Aは「Bはうそつきです」と言っていて、これは本当です。したがって、Aは正直者です。
    answer: Aは正直者で、BとCはうそつきです。
    note:
      title: 確かめ：すべての発言をもう一度
      text: >-
        Aの「Bはうそつきです」は本当で、正直者が言っています。Bの「Cは正直者です」はうそで、うそつきが言っています。Cの「AもBもうそつきです」は、Aが正直者なのでうそで、うそつきが言っています。すべてつじつまが合います。
    art:
      a-says: 「Bはうそつきです」
      b-says: 「Cは正直者です」
      c-says: 「AもBもうそつきです」
      most: いちばん多くを言う
      contradiction: 矛盾
      true-knight: 本当で、言うのは正直者
      false-liar: うそで、言うのはうそつき
  - title: 丸いテーブル
    question: >-
      丸いテーブルに、島の住人が10人すわっています。どの住人も「わたしの右どなりの人はうそつきです」と言いました。テーブルには正直者が何人いますか。
    steps:
      - >-
        住人が正直者なら、発言は本当なので、右どなりはうそつきです。
      - >-
        住人がうそつきなら、発言はうそなので、右どなりは正直者です。
      - >-
        つまり、テーブルのまわりでは、正直者とうそつきが交互にすわっています：「正、う、正、う…」。10人のちょうど半分が正直者で、**正直者は5人**です。
    answer: 正直者は5人です。
    note:
      title: では、テーブルに9人がすわっていたら？
      text: >-
        席の数が奇数だと、交互に並べても輪がうまく閉じません。最後の人と最初の人が同じ種類になってしまうからです。そんなテーブルはありえません。ここで、正直者とうそつきは偶奇と出会います。
    art:
      right-liar: 右どなりはうそつき
      right-knight: 右どなりは正直者
      half: 5と5
      kinds: 正直者とうそつき
      turns: どの人も時計回りのとなりを見る
      clash: 最後と最初が同じ種類

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      子どもが「正」と「う」を書きこんだあと、すべての発言をもう一度確かめないため、発言の1つが合わないままになります。
    say: 「どの発言も、もう一度読んでみよう。本当？うそ？それを言ったのはだれ？」
  trusted_statement:
    shows: >-
      子どもが、だれが言ったのかを考えずに、住人の言葉を信じてしまいます。AがBをうそつきだと言ったから、Bはうそつきだ、と決めてしまうのです。
    say: 「もし、うそつきが言ったのだとしたら？そのとき本当なのは何？」
  stopped_early:
    shows: >-
      子どもが、最初の住人がどちらかを見つけたところで止まってしまい、ほかの住人については決めないままにします。
    say: 「いいね、Aはうそつきだね。そこから、Bについて何がわかる？」

home:
  - title: 島ごっこ
    text: >-
      うそつき役になって、お子さまに質問してもらいましょう。やがてお子さまは、「うそつきなの？」と聞くと、いつも「ちがうよ」と返ってくることに気づきます。
  - title: 教えずに、たずねる
    text: >-
      答えを教える代わりに、「もしこの人が正直者なら、どうなる？」と問いかけます。これが、このテーマの解き方のカギです。
  - title: 「正」と「う」をえんぴつで書く
    text: >-
      どの名前の上にも、仮定を書きます。矛盾が出たら、消して、もう一方を試しましょう。

# What a parent can write in the chat to get a task on this topic.
ask: 正直者とうそつきの問題を出してください
