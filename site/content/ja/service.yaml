      sub: 単一の Go バイナリ · Cloud Run · 独自ドメイン
      tag: 構成要素の間は、ただの関数呼び出し
    outside:
      title: Google と GitHub
      sub: バイナリの外にあるサービスはこれだけ
  groups:
