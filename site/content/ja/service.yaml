title: サービスの仕組み
description: MathTrail の内部の仕組みを紹介します。構成要素とそのつながり、呼び出しごとに追うレッスン、状態の置き場所、保護者のドライブにあるプロフィールのファイルです。
hero:
  badge: 技術者向け
  title: サービスの仕組み
  lead: MathTrail は、ご家庭ですでに使っているチャットと、保護者の Google ドライブとの間に立っています。問題はすべてチャットのモデルが書き、その問題を子どもに届けるかどうかはサービスが判断します。MathTrail は単一のプログラムです。自前のモデルは呼び出さず、リクエストとリクエストの間には何も保持しません。
  chips:
    - Cloud Run 上の単一の Go バイナリ
    - ステートレス
    - データベースなし
    - 自前の LLM 呼び出しなし
    - MCP 2026-07-28 · MCP Apps
  figure: 3層で見る MathTrail
  client:
    title: チャットクライアント
    tag: 1 · クライアント
    others: ほかの MCP Apps ホスト
    note: チャットのモデルが問題を書き、カードがそれを子どもに見せます。
  mcp: "{via} · HTTPS 経由のツール呼び出し"
  cloud:
    title: Google Cloud 上の MathTrail
    tag: 2 · ランタイム
    sub: Cloud Run · 単一の Go バイナリ · ステートレス
    core: コア：純粋な計算
    around: そのまわり：OAuth、MCP サーバー、カード、封印、制限。
  drive: "{via} · 保護者自身のトークンで"
  storage:
    title: Google ドライブ
    tag: 3 · ストレージ
    note: 子どもごとにファイルを1つ、保護者自身のドライブに置きます。長く保存されるのは、これだけです。
map:
  title: 構成図
  lead: だれがだれとやりとりするのか。子どもも大人も MathTrail に直接アクセスすることはなく、やりとりの相手はチャットホストです。中央のブロックにあるものはすべて単一のプロセスの一部で、別々のサービスではありません。好きな構成要素を選ぶと、その役割とつながり先が表示されます。
  legend: サービスの構成要素
  whole: 選択なし
  hint: 図の構成要素を選ぶと、つながっているものは明るいまま残り、ほかは薄くなります。
  linked: つながり先
  reset: 解除 ✕
  columns:
