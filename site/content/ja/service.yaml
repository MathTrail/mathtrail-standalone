      short: GitHub
  parts:
    adult:
      name: 大人
      sub: 保護者または先生 · ログインする人
      about: 保護者または先生。チャットのアカウントと Google アカウントの両方を持ち、MathTrail を接続し、一度だけログインし、プロフィールを作り、チャットでレッスンを進め、進み具合を見守ります。ログインするのも、文字を入力するのも、この人だけです。
    kid:
      name: 子ども
      sub: 小学1〜6年生 · 自分用のログインなし
      about: 小学1〜6年生。大人のチャットの中で、カードに出る問題を解きます。自分用のログインはありません。
    model:
      name: ホストのモデル
      sub: 問題、ソルバー、解説を書く
      about: Claude または ChatGPT。問題、Starlark のソルバー、間違った選択肢ごとの解説、セルフチェックを書きます。カードが表示されない場面では、言葉でレッスンを進めます。MathTrail 自体はモデルを呼び出しません。
    appsrt:
      name: MCP Apps ランタイム
      sub: カードが動く、サンドボックス化されたフレーム
      about: サンドボックス化されたフレームにカードを描画し、言語・プラットフォーム・サイズを渡し、カード自身の呼び出しをホストのトークンをつけて転送します。カード自体がトークンを目にすることはありません。
    cimd:
      name: クライアントメタデータ文書
      sub: ホストの client_id は HTTPS のアドレス
      about: ホストは HTTPS のアドレスで自分を名乗ります。MathTrail はクライアントの登録簿を持たず、SSRF 対策をしたうえで、そのアドレスにある文書を取得します。
    router:
      name: HTTP ルーター
      sub: /mcp · /oauth/* · /health
      about: 唯一の入口：/health、/mcp、OAuth のエンドポイント、.well-known。タイムアウト、ボディサイズの上限、Origin のチェックを備えます。発行者は自身のドメインで、それ以外の Host には404を返します。
    authsrv:
      name: 認可サーバー
      sub: OAuth 2.1 + PKCE、同意
      about: MathTrail は、PKCE を備えた自前の OAuth 2.1 サーバーです。メタデータ、独自の同意画面、Google でのログイン、トークン、更新と取り消しを扱います。状態を持つサーバーなら保持するはずのものは、すべてトークンと Cookie に封印されています。
    mcpsrv:
      name: MCP サーバー
      sub: Streamable HTTP、ステートレス
      about: プロトコル：Streamable HTTP 2026-07-28、ステートレス、公式の Go SDK を使用。ツールの一覧と呼び出しを扱い、カードを ui:// リソースとして提供し、モデル向けの指示をそのバージョンとともに渡します。
    limits:
      name: 制限
      sub: アドレスごと・アカウントごと・日ごと
      about: ログイン前はアドレスごと、ログイン後はアカウントごとのペースと、全体の上限。ここまではすべてメモリ上です。その先に、プロフィールが数える一日の上限があります。制限を超えると、モデルがそのまま伝えられる平易な一文を返します。
    tools:
      name: ツール
      about: 12個のツールは、どれも同じ形です。プロフィールを読み、計算し、書き戻す。ほとんどはモデルが呼び出し、カードは自分用のもの（問題、答え、記録、プロフィールのフォーム用）を呼び出します。結果に秘密の情報が入ることは決してありません。
    rule:
      name: ルール
      sub: テーマ、目標、難易度の目標帯
      about: 指示書を決定的に選びます。間違えたあとは、定着させるために同じテーマ。そうでなければ、いちばん長く出ていないテーマ。難易度は、正解する確率が70〜85%になる目標帯から選びます。子どもが遅れているテーマは2倍の頻度で出ます。今はまだ難しすぎるテーマは一時停止中になり、子どもの全体のレベルがそのテーマに届くと、6問に1回、テーマの確認として戻ってくることがあります。
    rating:
      name: レーティング
      sub: θ、δ、β · IRT（項目反応理論）の上に組んだ Elo
      about: P = 0.2 + 0.8·σ(θ + δ − β)。Elo は答えが正しいかどうかだけで動き、その幅はしだいに小さくなります。チェスと同じ尺度で、ランクは11段階。テーマのマスターは、慎重な推定で判定します。
    checks:
      name: チェック
      sub: 提出された問題の合格条件
      about: 提出された問題が通らなければならないもの：構造と5つの異なる選択肢、レッスンの言語の文字、互いに異なる解説、ソルバー、セルフチェック、読みやすさ、ほぼ重複、そして図（形式、問題文と照らし合わせた記号、図に答えが書かれていないこと）。不合格の点は、すべて一度に伝えます。
    solver:
      name: ソルバー
      sub: Starlark のサンドボックス、ステップ数の上限
      about: モデルが書いた Starlark のプログラムを実行し、選択肢を試します。正解になる選択肢は、ちょうど1つでなければなりません。ステップ数と時間に上限があり、ネットワークもファイルも使えません。
    content:
      name: コンテンツ
      sub: カタログ、お手本問題、指示
      about: バイナリに組みこまれた、コード以外のものすべて：テーマ・ひっかけ・スキルのカタログ、お手本問題、スキーマ、ソルバーのテンプレート、図の種類ごとの例、モデル向けの指示とそのバージョン。
    widget:
      name: ウィジェット
      sub: カード · 単一の HTML ファイル
      about: カード：Preact を単一の HTML ファイルにビルドしたもので、外部からは何も読みこまず、各言語の辞書も中に含みます。レイアウトは幅320pxから使え、ボタンは指で押しやすい大きさです。
    store:
      name: ストア
      sub: プロフィールと現在の問題
      about: 隠しマークでプロフィールを見つけ、書きこむ前に比較し、2つのタブの食い違いを調整し、保護者に頼まれればドライブで固定した版からファイルを復元します。そのうえで、ドライブの呼び出しを少ない予算内に収めます。
    seal:
      name: 封印
      sub: トークンと封印された答え
      about: 1つのしくみで2つの役目を果たします。ログインと Google のトークンを、ホストが持つトークンの中に封印し、問題の答え（現在の問題のものと、先に書かれた問題のもの）をプロフィールの中に封印します。鍵は Secret Manager から取得し、鍵 ID で区別してローテーションします。
    logs:
      name: ログ記録
      sub: 要約のみ、個人データなし
      about: 呼び出しごとに、構造化された要約を1件：ツール、結果、所要時間、指示のバージョン。試行と却下の理由は、問題のイベントとして記録します。個人データ、問題文、答えは記録しません。
    boot:
      name: コンテナと設定
      sub: 環境、バージョン、シャットダウン
      about: 構成要素をつなぎ合わせて逆の順序で閉じ、タイムアウトとグレースフルシャットダウンを備え、設定はすべて環境変数から読みこみます。開発用のスイッチが入ったままでは、Cloud Run 上で起動しません。
    goauth:
      name: Google OAuth
      sub: drive.file のみ
      about: drive.file スコープだけを使った保護者のログイン、その更新と取り消し。どのトークンを取り消しても、すべてのアクセスが終わります。
    gdrive:
      name: Drive API v3
      sub: 唯一の長期ストレージ
      about: 唯一の長期ストレージ：保護者のドライブで目に見える MathTrail フォルダにある、単一の JSON プロフィール。保護者自身のトークンで読み書きします。
    sm:
      name: Secret Manager
      sub: 封印の鍵、クライアントシークレット
      about: 封印の鍵と Google のクライアントシークレット。固定したバージョンを、インスタンスの起動時に一度だけ読みこみます。
    ar:
      name: Artifact Registry
      sub: イメージ（ダイジェスト指定）
      about: 各リビジョンのイメージを、ダイジェストで指定して保管します。古いイメージは削除されます。
    clog:
      name: Cloud Logging
      sub: stdout の行き先
      about: サービスの stdout の行き先です。子どもを数えるための行は、専用のバケットに62日間保存されます。
    bq:
      name: BigQuery → Data Studio
      sub: 何年も保存される集計
      about: 利用の集計は何年も保存され、毎晩数え直されます。子どもを数えるときに使う名前は、どのテーブルにもありません。非公開のレポートと公開のレポートがあり、公開のほうは子どもが10人未満のグループを表示しません。
    ga:
      name: Actions
      sub: ビルド、チェック、デプロイ
      about: ビルド、チェック、イメージの公開、そして Workload Identity 連携によるデプロイ。サービスアカウントキーは使いません。
    pages:
      name: Pages
      sub: このサイト、ポリシー、規約
      about: このサイト：テーマのページと、同意画面からリンクされるプライバシーポリシーと利用規約。
