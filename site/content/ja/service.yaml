flow:
  title: 呼び出しごとに見るレッスン
  lead: モデルとカードは同じツールを呼び出し、信頼できる唯一の情報源、つまり保護者のドライブにあるプロフィールのファイルを土台にしています。レッスンを続けるために、両者が互いに何かを伝え合う必要はありません。
  legend: シナリオ
  scenarios:
    task: 問題
    answer: 答え
    signin: ログイン
  kinds:
    call: 呼び出し
    reply: その応答
    host: ホスト内部
  actors:
    adult: 大人
    kid: 子ども
    card: カード
    model: ホストのモデル
    service: MathTrail
    drive: ドライブ
    browser: 保護者のブラウザ
    host: ホスト
    google: Google
  task:
    rows:
      - 「新しい問題をお願いします」
      - next_task
      - 呼び出しが始まるとすぐ、ホストがカードを表示：「次の問題を用意しています…」
      - 制限 · ルールがテーマ、レベル、難易度を選ぶ
      - 進行中のリクエストを書きこむ
      - リクエストは進行中：パッケージを取得する
      - get_package
      - 指示書 · お手本問題3問 · ひっかけ · テンプレート · 図の例
      - モデルが問題、Starlark のソルバー、セルフチェックを書く
      - submit_task（最大3回）
      - チェック · ソルバーが正解の選択肢をちょうど1つ見つけること
      - 問題が現在の問題になり、答えは封印される
      - read_task（カードが4秒ごとに問い合わせる）
      - 問題文 · 図 · 選択肢5つ · ヒント（答えはなし）
    caption: どの呼び出しもドライブからプロフィールを読みますが、その読みこみは省いています。待機中のカードがパッケージを見ることはありません。パッケージのお手本問題には答えがついているからです。子どもが解いている間に、モデルは prepare_task で次の問題を先に書いておきます。次の問題を求められると、next_task がそれをすぐ新しいカードに出すので、この待ち時間はありません。
  answer:
    rows:
      - Cを押す
      - submit_answer（チャットのターンは使わない）
      - 最初の答えだけ · ここで封印を開ける · θとδは正誤だけで動く
      - レーティングと履歴を書きこむ
      - 正誤 · Cの裏のひっかけ · 解き方の図 · 手順 · レーティングの前 → 後
      - カードが、問題のあった場所で「こたえのふりかえり」に変わる
      - ui/update-model-context（1行。大人の次のメッセージと一緒に読まれる）
      - 「どうして柱が1本多いのですか？」
      - まさにこの問題について答え、カードの内容を補う
    caption: ボタンを押すと、何かが説明される前に答えが記録され、カードはすぐに「こたえのふりかえり」に変わります。チャットのターンは使われず、モデルは何も描画しません。モデルはカードからの1行を大人の次のメッセージと一緒に読み、カードの内容をくり返さずに、問題についての質問に答えます。ホストがモデルに送るこの1行が失われても、モデルは次の呼び出しで追いつきます。
  signin:
    rows:
      - POST /mcp（トークンなし）
      - 401 · メタデータの場所
      - /oauth/authorize を開く · PKCE S256
      - authorize
      - 独自の同意画面：どのクライアントか、保護者をどこへ戻すか
      - Google でログイン · drive.file のみ
      - Google のコードを持って戻る
      - /oauth/callback
      - コードを交換
      - /about（だれのドライブか？）
      - ユーザー ID = ドライブのアカウントの HMAC · Google のトークンを自前の認可コードに封印
      - 302 · code = mt1.c.…
      - コードを返す
      - /oauth/token · コード + コード検証子
      - アクセストークン15分 · 更新トークン30日
    caption: 保護者のログインは一度だけです。サービスはこのやりとりを何も保持しません。リクエストは封印された state に、Google のトークンは封印されたコードに入って運ばれます。
  machine:
    title: ステートマシンとして見た現在の問題
    lead: 「一度だけ」のルールはどれもプロフィールのフィールドで、同じ読みこみ・計算・書きこみの中でチェックされます。ほかに何かを覚えているものはありません。
    forward:
      - 指示書の準備完了
      - 封印して出題
      - 一度だけ記録
    turns:
      - 却下、まだ試行できる（リクエストごとに3回まで）
      - 却下3回、またはリクエストの開始から15分。その日の問題数は減らず、却下3回はその日の失敗したリクエストとして数える
      - 答える前に「次の問題」：スキップとして記録し、レーティングはそのまま
      - その後の答え（別のタブやモデルからのもの）には最初の結果を返し、何も書きこまない
      - 次の問題は新しいカードに。答えた問題は、もう現在の問題ではない
      - 次の問題が先に書かれていた：next_task がそれをすぐ新しいカードに出し、requested を飛ばす
      - 封印をもう開けられない（鍵が2回ローテーションした）。何も記録しない
state:
  title: 状態の置き場所
  lead: 状態を持つサーバーならデータベースに入れておくものは、すべてほかのだれかが持っています。チャットが保持する封印されたトークン、保護者のブラウザの Cookie、そして保護者自身のドライブです。サービスを再起動しても、2つ目のコピーを起動しても、何も失われません。
  self:
    label: MathTrail 自体
    value: なし
    note: アカウントも、セッションも、登録も、Google のトークンもありません。リクエストはそれぞれ、必要なものをすべて自分で運びます。
  stores:
    tokens:
      title: チャットのトークンストア
      sub: 封印されたトークン。ホストには中身が見えない
      rows:
        access:
          name: アクセストークン
          life: 15分
        refresh:
          name: 更新トークン
          life: 30日、最長90日
      note: 中には、Google のトークン、制限に使う中身の見えないユーザー ID、保護者がログインした国が封印されています。
    browser:
      title: 保護者のブラウザ
      sub: 2つの Cookie、セッションなし
      rows:
        approvals:
          name: 承認済みのクライアント
          life: 180日
        csrf:
          name: ログインの保護（CSRF）
          life: 10分
      note: Cookie を失っても、同意画面がもう一度出るか、ログインし直すだけです。
    drive:
      title: 保護者のドライブ
      sub: 長く保存されるのはここだけ
      rows:
        profile:
          life: 削除されるまで
      note: プロフィール、レーティング、現在の問題（答えは封印済み）。保護者はファイルを開くことができ、ドライブには版の履歴が残ります。
    secrets:
      title: Secret Manager
      sub: インスタンスの起動時に一度だけ読みこむ
      rows:
        keys:
          name: 封印の鍵
          sub: ローテーション後も、前の鍵は引き続き受け付ける
          life: 90日
        client:
          name: Google のクライアントシークレット
          life: 固定
    memory:
      title: インスタンスのメモリ
      sub: キャッシュのみ：再起動で消えても、何も壊れない
      rows:
        rates:
          name: リクエスト頻度のカウンター
          life: 数分
        location:
          name: プロフィールのファイルの場所
          life: 10分
        clients:
          name: クライアントの文書
          life: 5分〜24時間
  absent:
    title: v1 であえて入れなかったもの
    items:
      - データベース
      - キュー
      - セッションストア
      - 共有キャッシュ
      - 作り置きの問題バンク
      - LLM API クライアント
      - REST と OpenAPI
profile:
  title: プロフィールのファイル
  lead: 子ども1人に JSON ファイル1つ。サーバー上にある何かの真実のキャッシュではなく、真実そのものです。どのブロックにも上限があり、書きこむたびに守られるので、ファイルが際限なく大きくなることはありません。ふつうのファイルは目標の範囲に収まり、上限に近いファイルは目標を超えます。過去の問題は、本文ではなくフィンガープリントとして残ります。
  size: ファイルのサイズ
  legend: 表示するサイズ
  typical: 通常
  cap: 上限近く
  total: 約{kb}KB
  kb: "{kb}KB"
  goal: 目標{kb}KB
  segment: "{name} · {typical} / {cap}KB"
  heads:
    block: ブロック
    holds: 中身
    writers: 書きこみ元
    size: サイズ
  blocks:
    fingerprints:
      name: フィンガープリント
      holds: 出題した問題のスケッチを最大200件。ほぼ重複のチェック用で、本文・テーマ・日付は含まない
    history:
      name: レーティングの履歴
      holds: 最近の答えそれぞれの直前のθとテーマのδ、そして答えのあった直近7日の各日の始まりのθと全テーマ
    ratings:
      name: レーティングとテーマ
      holds: θと子どもの出発点。テーマごと：δ、答え、かかったひっかけ、マスターとそのレベル
    recent:
      name: 最近の答え
      holds: 直近20件の答えとスキップ。ただし、ルールが読む5件の答えを下回ることはない
    sealed:
      name: 現在の問題（封印）
      holds: 答え、間違った選択肢それぞれの裏にあるひっかけ、解き方、ソルバー。これらをまとめた、中身の見えない単一の文字列
    open:
      name: 現在の問題（平文）
      holds: カードに表示されるもの：問題文、図、5つの選択肢、ヒント。答えたあとは、答えそのものも
    request:
      name: 進行中のリクエスト
      holds: 問題を書いている間：その ID、指示書、使った試行回数、テーマを選んだのはだれか
    service:
      name: サービスと子ども
      holds: スキーマのバージョン、ランダムな UUID、リビジョン。ニックネーム、学年、好きなこと、メモ。その日のカウンター
  every-write: 書きこみのたび
  note: 先に書かれた問題は現在の問題の隣に置かれ、ほぼ同じ大きさです。ファイルに含まれないもの：過去の問題の本文、子どもが答えるまでの平文の答え、保護者がだれかわかるもの、そしてランク（ランクは表示するときに計算します）。ドライブには条件付きの書きこみがないため、保存の前にファイルをもう一度読み、変わっていれば書きこみを拒否します。2つのタブが黙って互いを上書きすることはありません。
seal:
  title: 封印されるものと、その期間
  lead: 1つのしくみが2つの役目を果たします。ログインはチャットが持つトークンの中に、問題の答え（現在の問題のものと、先に書かれた問題のもの）はプロフィールの中に封印します。封印にはそれぞれ用途が書きこまれているので、アクセストークンが更新トークンになりすますことはできず、封印された答えがほかの何かになりすますこともできません。
  token:
    title: トークンの分解
    version: 形式のバージョン
    purpose: 用途
    purposes:
      c: コード
      a: アクセス
      r: 更新
      d: クライアント
      s: state
      k: 同意
      t: 問題の答え
    key: 鍵 ID
    key-note: 鍵そのものから導くため、ローテーションしても気づかれない
    cipher: 暗号文
    cipher-note: XChaCha20-Poly1305、192ビットのランダムなノンス
    note: JWT ではありません。サービス以外にこれを読むものはなく、中身の見えない文字列からクレームがログに漏れることもありません。
  life:
    title: 有効期間（対数目盛り）
    ticks:
      - 1分
      - 1時間
      - 1日
      - 1週間
      - 6か月
    items:
      code:
        name: 認可コード
        life: 60秒
      signin:
        name: ログイン処理中
        life: 10分
      access:
        name: アクセストークン
        life: 15分
      refresh:
        name: 更新トークン
        life: 30日（スライド式、最長90日）
      key:
        name: 封印の鍵
        life: 90日ごとにローテーション
      approvals:
        name: 承認済みのクライアント
        life: 180日
    note: 状態を持たないサーバーはコードを使用済みにできないため、コードの有効時間は短くしています。ローテーション後も前の鍵を受け付けるので、鍵が変わってもトークンや封印された答えが失われることはありません。
