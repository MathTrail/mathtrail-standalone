title: كيف تعمل الخدمة
description: "كيف يعمل MathTrail من الداخل: أجزاء الخدمة وكيف ترتبط، والدرس استدعاء تلو الآخر، وأين تقيم حالته، وملف الملف الشخصي على Drive الخاص بولي الأمر، وما يُختم فيه."
hero:
  badge: للجمهور التقني
  title: كيف تعمل الخدمة
  lead: "يقف MathTrail بين الدردشة التي تستخدمها الأسرة أصلًا وGoogle Drive الخاص بولي الأمر. يكتب نموذج الدردشة كل مسألة، وتقرر الخدمة ما إذا كانت ستصل إلى الطفل. إنه برنامج واحد: لا يستدعي أي نموذج خاص به، ولا يحتفظ بشيء بين الطلبات."
  chips:
    - ملف تنفيذي واحد بلغة Go على Cloud Run
    - بلا حالة
    - بلا قاعدة بيانات
    - بلا استدعاءات LLM خاصة به
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail في ثلاث طبقات
  client:
    title: عميل الدردشة
    tag: 1 · العميل
    others: مضيفو MCP Apps الآخرون
    note: يكتب نموذج الدردشة المسألة، وتعرضها البطاقة على الطفل.
  mcp: "{via} · استدعاءات الأدوات عبر HTTPS"
  cloud:
    title: MathTrail على Google Cloud
    tag: 2 · بيئة التشغيل
    sub: Cloud Run · ملف تنفيذي واحد بلغة Go · بلا حالة
    core: "النواة: حسابات بحتة"
    around: "من حولها: OAuth، وخادم MCP، والبطاقة، والختم، والحدود."
  drive: "{via} · بالرمز المميز لولي الأمر نفسه"
  storage:
    title: Google Drive
    tag: 3 · التخزين
    note: ملف واحد لكل طفل، في Drive الخاص بولي الأمر نفسه، وهو وحده ما يُحفظ طويلًا.
map:
  title: الخريطة
  lead: "من يتحدث إلى من. لا وصول مباشرًا إلى MathTrail، لا للطفل ولا للشخص البالغ: فالحديث يكون مع مضيف الدردشة. وكل ما في الإطار الأوسط جزء من عملية واحدة، لا خدمة منفصلة. اختاروا أي جزء لتروا ما يفعله وبماذا يرتبط."
  legend: أجزاء الخدمة
  whole: لم يُختر شيء
  hint: "اختاروا جزءًا من الخريطة: يبقى كل ما يرتبط به ساطعًا، ويخفت الباقي."
  linked: ما يرتبط به
  reset: مسح ✕
  columns:
    family:
      title: دردشة الأسرة
      sub: Claude في المتصفح، وعلى الحاسوب، وعلى الهاتف · ChatGPT
    service:
      title: MathTrail
      sub: ملف تنفيذي واحد بلغة Go · Cloud Run · نطاق خاص به
      tag: بين الأجزاء، استدعاءات دوال عادية
    outside:
      title: Google وGitHub
      sub: الخدمات الوحيدة خارج الملف التنفيذي
  groups:
    people:
      title: الأشخاص
      short: دردشة الأسرة
    host:
      title: مضيف الدردشة
      short: مضيف الدردشة
    entry:
      title: المدخل
      short: MathTrail · المدخل
    tools:
      title: "الأدوات: قراءة الملف الشخصي، والحساب، وإعادة كتابته"
      short: MathTrail · الأدوات
    core:
      title: حسابات بحتة، بلا شبكة
      short: MathTrail · حسابات بحتة
    around:
      title: حول النواة
      short: MathTrail · حول النواة
    account:
      title: حساب Google لولي الأمر
