flow:
  title: الدرس، استدعاء تلو الآخر
  lead: "يستدعي النموذج والبطاقة الأدوات نفسها، ويستندان إلى مصدر واحد للحقيقة: ملف الملف الشخصي على Drive الخاص بولي الأمر. ولا يحتاج أحدهما إلى إخبار الآخر بشيء كي يستمر الدرس."
  legend: السيناريو
  scenarios:
    task: المسألة
    answer: الإجابة
    signin: الدخول
  kinds:
    call: استدعاء
    reply: الرد عليه
    host: داخل المضيف
  actors:
    adult: الشخص البالغ
    kid: الطفل
    card: البطاقة
    model: نموذج المضيف
    service: MathTrail
    drive: Drive
    browser: متصفح ولي الأمر
    host: المضيف
    google: Google
  task:
    rows:
      - «مسألة جديدة، من فضلك»
      - next_task
      - "يرسم المضيف البطاقة فور بدء الاستدعاء: «جار إعداد المسألة التالية…»"
      - الحدود · تختار القاعدة الموضوع والمستوى والصعوبة
      - كتابة الطلب المفتوح
      - "الطلب مفتوح: اجلب الحزمة"
      - get_package
      - التكليف · 3 مسائل مرجعية · الفخاخ · القوالب · أمثلة الرسوم
      - يكتب النموذج المسألة، وبرنامج حل بلغة Starlark، وتحققًا ذاتيًا
      - submit_task — حتى 3 محاولات
      - الفحوص · يجب أن يجد برنامج الحل خيارًا صحيحًا واحدًا بالضبط
      - تصبح المسألة هي الحالية، وإجابتها مختومة
      - read_task — تسأل البطاقة كل 4 ث
      - النص · الرسم · خمسة خيارات · التلميح — دون الإجابة
    caption: "كل استدعاء يقرأ الملف الشخصي من Drive أيضًا، وقد حُذفت هذه القراءات من الرسم. والبطاقة المنتظرة لا ترى الحزمة أبدًا: فمسائلها المرجعية تحمل إجاباتها. وفي أثناء حلّ الطفل للمسألة، يكتب النموذج المسألة التالية مسبقًا باستخدام prepare_task، وعندما تُطلب مسألة أخرى، يضعها next_task على بطاقة جديدة فورًا، دون هذا الانتظار."
  answer:
    rows:
      - الضغط على C
      - submit_answer — لا يُستهلك أي دور في الدردشة
      - الإجابة الأولى وحدها · يُفتح الختم الآن · لا يتحرك θ و δ إلا بحسب صحتها
      - كتابة التصنيفات وسجلّها
      - صحيحة أم لا · الفخ وراء C · رسم الحل · الخطوات · التصنيف قبل ← بعد
      - تتحول البطاقة إلى مراجعة الإجابة، في مكان المسألة
      - ui/update-model-context — سطر واحد، يُقرأ مع الرسالة التالية من الشخص البالغ
      - «لماذا عمود إضافي؟»
      - يجيب عن هذه المسألة بعينها، مكمّلًا البطاقة
    caption: تُسجَّل الإجابة بالضغط قبل أن يُشرح أي شيء، وتتحول البطاقة فورًا إلى مراجعة الإجابة. لا يُستهلك أي دور في الدردشة، ولا يرسم النموذج شيئًا. ويقرأ النموذج سطر البطاقة مع الرسالة التالية من الشخص البالغ، ويجيب عن أي سؤال عن المسألة دون إعادة سرد البطاقة. وإذا ضاع السطر الذي يرسله المضيف إلى النموذج، يلحق النموذج بما فاته عند استدعائه التالي.
