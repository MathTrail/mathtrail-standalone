  parts:
    adult:
      name: الشخص البالغ
      sub: أحد الوالدين أو معلم · من يسجّل الدخول
      about: "أحد الوالدين أو معلم. يملك حساب الدردشة وحساب Google كليهما: يربط MathTrail، ويسجّل الدخول مرة واحدة، وينشئ الملف الشخصي، ويدير الدرس في الدردشة، ويتابع التقدّم. وهو وحده من يسجّل الدخول، ووحده من يكتب."
    kid:
      name: الطفل
      sub: الصفوف 1–6 · بلا تسجيل دخول خاص
      about: الصفوف 1–6. تُحلّ المسائل على البطاقة، في دردشة الشخص البالغ. وليس للطفل تسجيل دخول خاص.
    model:
      name: نموذج المضيف
      sub: يكتب المسألة، وبرنامجًا يحلها، والشروح
      about: Claude أو ChatGPT. يكتب المسألة، وبرنامج حل بلغة Starlark، وشرحًا لكل خيار خاطئ، وتحققًا ذاتيًا؛ ويدير الدرس بالكلمات حيثما لا تُرسم البطاقات. أما MathTrail نفسه فلا يستدعي أي نموذج.
    appsrt:
      name: بيئة تشغيل MCP Apps
      sub: الإطار المعزول الذي تعمل فيه البطاقة
      about: ترسم البطاقة في إطار معزول، وتمرر إليها اللغة والمنصة والحجم، وتحيل استدعاءات البطاقة الخاصة مع الرمز المميز للمضيف. أما البطاقة نفسها فلا ترى هذا الرمز أبدًا.
    cimd:
      name: مستند البيانات الوصفية للعميل
      sub: client_id للمضيف هو عنوان HTTPS
      about: يعرّف المضيف نفسه بعنوان HTTPS. ويجلب MathTrail المستند من ذلك العنوان، مع حماية من SSRF، بدلًا من الاحتفاظ بسجل للعملاء.
    router:
      name: موجّه HTTP
      sub: /mcp · /oauth/* · /health
      about: "المدخل الوحيد: /health، و/mcp، ونقاط نهاية OAuth، والمسار .well-known. مهلات، وحد لحجم جسم الطلب، وتحقق من Origin؛ والمُصدِر هو نطاقه الخاص، وأي Host آخر يتلقى 404."
    authsrv:
      name: خادم التفويض
      sub: OAuth 2.1 + PKCE، والموافقة
      about: "يؤدي MathTrail دور خادم OAuth 2.1 لنفسه، مع PKCE: البيانات الوصفية، وشاشة موافقة خاصة به، وتسجيل الدخول باستخدام حساب Google، والرموز المميزة، والتجديد، والإبطال. وكل ما كان خادم ذو حالة سيحتفظ به يُختم داخل الرموز المميزة وملفات تعريف الارتباط."
    mcpsrv:
      name: خادم MCP
      sub: Streamable HTTP، بلا حالة
      about: "البروتوكول: Streamable HTTP 2026-07-28، بلا حالة، مبني على SDK الرسمي للغة Go. يسرد الأدوات ويستدعيها، ويقدّم البطاقة كمورد ui://، ويسلّم النموذج تعليماته مع إصدارها."
    limits:
      name: الحدود
      sub: لكل عنوان، ولكل حساب، ولكل يوم
      about: وتيرة لكل عنوان قبل تسجيل الدخول ولكل حساب بعده، وسقف عام، وكل ذلك في الذاكرة، ثم الأسقف اليومية، التي تُحتسب في الملف الشخصي. وعند تجاوز أي حد، جملة بسيطة ينقلها النموذج.
    tools:
      name: الأدوات
      about: "اثنتا عشرة أداة على نمط واحد: قراءة الملف الشخصي، والحساب، وإعادة كتابته. يستدعي النموذج معظمها، وتستدعي البطاقة أدواتها الخاصة: للمسألة، والإجابة، والتقدّم، واستمارة الملف الشخصي. ولا تحمل أي نتيجة شيئًا سريًا أبدًا."
    rule:
      name: القاعدة
      sub: الموضوع، والهدف، وممر الصعوبة
      about: "تختار التكليف بطريقة حتمية: بعد الخطأ، الموضوع نفسه لتثبيته؛ وإلا فالموضوع الذي لم يظهر منذ أطول مدة؛ والصعوبة من الممر الذي يبلغ فيه احتمال النجاح 70–85%."
    rating:
      name: التصنيفات
      sub: θ و δ و β · نظام Elo فوق IRT
      about: P = 0.2 + 0.8·σ(θ + δ − β). لا يتحرك Elo إلا بحسب صحة الإجابة، بخطوة تتناقص؛ ومقياس الشطرنج وإحدى عشرة مرحلة؛ ويُعدّ الموضوع متقنًا وفق تقدير حذر.
    checks:
      name: الفحوص
      sub: ما يجب أن تجتازه المسألة عند تسليمها
      about: "ما يجب أن تجتازه المسألة عند تسليمها: بنيتها وخمسة خيارات مختلفة، وحروف لغة الدرس، وشروح متمايزة، وبرنامج الحل، والتحقق الذاتي، وسهولة القراءة، والمسائل شبه المكررة، والرسم: صيغته، وتسمياته مقارنة بالسؤال، وخلوّه من الإجابة. ويُبلَّغ عن كل إخفاق دفعة واحدة."
    solver:
      name: برنامج الحل
      sub: بيئة Starlark معزولة، وحد للخطوات
      about: يشغّل برنامج النموذج المكتوب بلغة Starlark، الذي يجرّب الخيارات؛ ويجب أن يكون خيار واحد بالضبط هو الصحيح. حدود للخطوات وللوقت، بلا شبكة وبلا ملفات.
    content:
      name: المحتوى
      sub: الفهارس، والمسائل المرجعية، والتعليمات
      about: "كل ما هو مدمج في الملف التنفيذي وليس شيفرة: فهارس المواضيع والفخاخ والمهارات، والمسائل المرجعية، والمخططات، وقوالب برامج الحل، ومثال لكل نوع من الرسوم، وتعليمات النموذج مع إصدارها."
    widget:
      name: الويدجت
      sub: البطاقة · ملف HTML واحد
      about: "البطاقة: شيفرة Preact مجمّعة في ملف HTML واحد لا يحمّل شيئًا من الخارج، وفيه قواميس اللغات. يعمل التخطيط بدءًا من 320 px، والأزرار بحجم يناسب الإصبع."
    store:
      name: المخزن
      sub: الملف الشخصي والمسألة الحالية
      about: يجد الملف الشخصي بعلامة مخفية، ويقارن قبل أن يكتب، ويوفّق بين علامتي تبويب، ويستعيد الملف من النُسخ المثبّتة في Drive عندما يطلب ولي الأمر ذلك، ويبقى ضمن ميزانية صغيرة من استدعاءات Drive.
    seal:
      name: الختم
      sub: الرموز المميزة والإجابة المختومة
      about: "آلية واحدة لمهمتين: تختم تسجيل الدخول ورموز Google المميزة داخل الرموز المميزة التي يحملها المضيف، وتختم داخل الملف الشخصي إجابة المسألة الحالية وإجابة المسألة المكتوبة مسبقًا. وتأتي المفاتيح من Secret Manager وتُدوَّر بحسب معرّف المفتاح."
    logs:
      name: التسجيل
      sub: ملخصات، بلا بيانات شخصية
      about: "ملخص منظّم واحد لكل استدعاء: الأداة، والنتيجة، والمدة، وإصدار التعليمات؛ والمحاولات وأسباب الرفض بوصفها أحداثًا للمسألة. بلا بيانات شخصية، ولا نصوص مسائل، ولا إجابات."
    boot:
      name: الحاوية والتهيئة
      sub: البيئة، والإصدار، والإيقاف
      about: تربط الأجزاء بعضها ببعض وتغلقها بترتيب عكسي، وتعمل بمهلات وبإيقاف منظّم، وتقرأ تهيئتها كلها من البيئة، وترفض البدء على Cloud Run إذا فُعّل أي خيار من خيارات التطوير.
    goauth:
      name: Google OAuth
      sub: نطاق drive.file وحده
      about: تسجيل دخول ولي الأمر بنطاق drive.file وحده، والتجديد، والإبطال. وإبطال أي رمز مميز ينهي كل وصول.
    gdrive:
      name: Drive API v3
      sub: التخزين الوحيد طويل الأمد
      about: "التخزين الوحيد طويل الأمد: ملف شخصي واحد بصيغة JSON في مجلد MathTrail ظاهر على Drive الخاص بولي الأمر، يُقرأ ويُكتب بالرمز المميز لولي الأمر نفسه."
    sm:
      name: Secret Manager
      sub: مفاتيح الختم، وسر العميل
      about: "مفاتيح الختم وسر العميل من Google: إصدارات مثبّتة، تُقرأ مرة واحدة عند بدء تشغيل المثيل."
    ar:
      name: Artifact Registry
      sub: صورة الحاوية، بحسب الملخص
      about: صورة الحاوية لكل نسخة، بحسب ملخصها؛ وتُحذف الصور القديمة.
    clog:
      name: Cloud Logging
      sub: وجهة stdout
      about: وجهة stdout الخاصة بالخدمة. والأسطر التي يُحتسب بها الأطفال تُحفظ 62 يومًا في حزمة (bucket) خاصة بها.
    bq:
      name: BigQuery → Data Studio
      sub: إحصاءات تُحفظ لسنوات
      about: تُحفظ إحصاءات الاستخدام لسنوات ويُعاد حسابها كل ليلة؛ ولا يحمل أي جدول الاسم الذي يُحتسب به الطفل. تقرير خاص وآخر عام، لا يُظهر أي مجموعة تضم أقل من عشرة أطفال.
    ga:
      name: Actions
      sub: البناء، والفحوص، والنشر
      about: البناء، والفحوص، ورفع صورة الحاوية، والنشر عبر Workload Identity Federation، بلا مفاتيح لحسابات الخدمة.
    pages:
      name: Pages
      sub: هذا الموقع، والسياسة، والشروط
      about: "هذا الموقع: صفحات المواضيع، وسياسة الخصوصية وشروط الاستخدام التي تحيل إليها شاشة الموافقة."
