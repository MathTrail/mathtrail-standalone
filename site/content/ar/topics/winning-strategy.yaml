title: ألعاب باستراتيجية رابحة
description: ما هي مسائل ألعاب باستراتيجية رابحة، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words the page's drawings say of a position.
art:
  loses: خسارة لمن عليه الدور
  wins: فوز

hero:
  lead: >-
    على الطاولة 20 عود ثقاب، ويأخذ اللاعبان بالتناوب 1 أو 2 أو 3 منها. ومن
    يأخذ العود الأخير يفوز. هل يمكن للاعب الأول أن يفوز دائمًا؟ في هذه المسائل
    يكون المطلوب إيجاد خطة تفوز مهما فعل اللاعب الآخر، والطريق إليها هو الرجوع
    من نهاية اللعبة لمعرفة الأوضاع الخاسرة لمن عليه أن يلعب منها.
  method: الرجوع من النهاية وإيجاد الأوضاع الخاسرة
  teaches: إيجاد خطة تفوز مهما فعل اللاعب الآخر
  # The words of its drawing: the game it is drawn for.
  art:
    line: نأخذ 1 أو 2 أو 3 أعواد؛ ومن يأخذ العود الأخير يفوز

basis:
  title: قواعد الألعاب
  cards:
    - title: من النهاية
      text: >-
        ابدؤوا من نهاية اللعبة، حيث الفائز واضح، وارجعوا إلى الوراء: يكون الوضع
        خاسرًا إذا كانت كل نقلة منه تؤدي إلى وضع رابح للاعب الآخر.
      art:
        back: من 0، نهاية اللعبة، صعودًا إلى الأعداد الأكبر
    - title: تسليم وضع خاسر
      text: >-
        النقلة الرابحة تترك للاعب الآخر وضعًا خاسرًا. فإن لم توجد نقلة كهذه،
        فالوضع خاسر مهما كانت براعة اللاعب.
      art:
        take: أخذ 2
        losing: وضع خاسر للآخر
    - title: التقليد والانعكاس
      text: >-
        في كثير من الألعاب يحافظ الفائز على التوازن: فيرد على كل نقلة بحيث يبقى
        مجموع النقلتين ثابتًا، أو يقوم بالنقلة نفسها في الجهة المقابلة كما في
        المرآة.
      art:
        they: الخصم
        answer: الرد

idea:
  title: الأوضاع الخاسرة
  lead: في لعبة أخذ 1 أو 2 أو 3 أعواد، التي يفوز فيها من يأخذ العود الأخير، تتكرر الأوضاع الخاسرة لمن عليه الدور كل 4.
  table:
    head:
      - الأعواد الباقية
      - أفضل نقلة
      - السبب
    rows:
      - - 1 أو 2 أو 3
        - أخذها كلها
        - من يأخذ العود الأخير يفوز
      - - "4"
        - لا نقلة رابحة
        - بعد أي نقلة، يأخذ اللاعب الآخر الباقي
      - - 5 أو 6 أو 7
        - أخذ 1 أو 2 أو 3 بحيث تبقى 4
        - يتسلّم اللاعب الآخر 4، وهو وضع خاسر
      - - "8"
        - لا نقلة رابحة
        - كل نقلة تترك 5 أو 6 أو 7
  note:
    title: لماذا هذا مهم
    text: >-
      كثيرًا ما يظن الأطفال أن اللاعب الأول لا بد أن يفوز، أو يلعبون على أمل أن
      يخطئ اللاعب الآخر. أما الاستراتيجية الرابحة فتنجح أمام أفضل لعب، وإيجادها
      يعني التفكير من النهاية، وهي عادة تتجاوز قيمتها الألعاب بكثير.

method:
  title: "طريقة الحل: البدء من نهاية اللعبة"
  lead: >-
    اكتبوا الأوضاع بدءًا من الأصغر. وضعوا علامة «خاسر» على الوضع إذا كانت كل
    نقلة منه تؤدي إلى وضع رابح، وعلامة «رابح» إذا كانت إحدى نقلاته تؤدي إلى وضع
    خاسر. والنقلة الرابحة من البداية هي التي تترك وضعًا خاسرًا. تتدرّج الأمثلة
    أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - البدء من أوضاع نهاية اللعبة
    - تصنيف كل وضع رابحًا أو خاسرًا، بدءًا من الأصغر
    - إيجاد النقلة التي تترك للاعب الآخر وضعًا خاسرًا

examples:
  - title: حلوى في وعاء
    question: >-
      في وعاء 23 قطعة حلوى. تتناوب رنا وليث على اللعب، وتبدأ رنا. ويأخذ كل
      منهما في دوره 1 أو 2 أو 3 أو 4 قطع. ومن يأخذ القطعة الأخيرة يفوز. كم قطعة
      يجب أن تأخذ رنا أولًا لتضمن الفوز؟
    steps:
      - >-
        من النهاية: إذا بقي من 1 إلى 4 قطع، يأخذها كلها من عليه الدور ويفوز. وإذا
        بقيت 5، فكل نقلة تترك للاعب الآخر من 1 إلى 4، إذن 5 وضع خاسر.
      - >-
        وبالطريقة نفسها تكون 10 و15 و20 أوضاعًا خاسرة: فمهما أُخذ منها، يستطيع
        اللاعب الآخر أن يترك في الوعاء المضاعف التالي للعدد 5.
      - >-
        إذن تأخذ رنا 3 وتترك 20. ومهما أخذ ليث، تأخذ رنا ما يجعل مجموع النقلتين
        5، فتترك 15، ثم 10، ثم 5، وفي النهاية لا شيء.
    answer: 3 قطع حلوى.
    note:
      title: لماذا لا نأخذ 4؟
      text: >-
        أخذ 4 يترك 19، فيأخذ ليث 4 ويترك 15، وهذا وضع خاسر لرنا. وأمام لاعب لا
        يخطئ، لا تفوز إلا النقلة الأولى التي تصل إلى مضاعف للعدد 5.
    art:
      sweets: 23 قطعة حلوى، من 1 إلى 4 في كل نقلة
      kim: رنا −3
      answer: يأخذ ليث س، فتأخذ رنا 5 − س
      leo: ليث −4
      lost: وضع خاسر لرنا
  - title: رحلة الملك
    question: >-
      يقف ملك في الزاوية السفلية اليسرى من رقعة 5 في 5. ويتناوب لاعبان على
      تحريكه مربعًا واحدًا إلى الأعلى، أو مربعًا واحدًا إلى اليمين، أو مربعًا
      واحدًا قطريًا إلى الأعلى واليمين. ومن ينقل الملك إلى الزاوية العلوية
      اليمنى يفوز. من يفوز إذا لعب كلاهما أفضل لعب ممكن؟
    steps:
      - >-
        نعدّ كم صفًا وكم عمودًا بقي على الملك أن يقطعها. ومن مربع يبعد نقلة
        واحدة عن الزاوية، يفوز من عليه الدور فورًا.
      - >-
        يكون المربع خاسرًا لمن عليه الدور إذا كان العددان زوجيين: فكل نقلة تجعل
        أحدهما فرديًا، ويستطيع اللاعب الآخر أن يعيدهما زوجيين.
      - >-
        يبدأ الملك على بعد 4 صفوف و4 أعمدة، وكلا العددين زوجي، إذن يخسر اللاعب
        الأول. ويظل الثاني يرد بنقلة إلى مربع عدداه زوجيان، حتى يصل إلى الزاوية.
    answer: اللاعب الثاني.
    badge: الثاني
    note:
      title: البدء أولًا لا يكفي
      text: >-
        هنا يخسر اللاعب الأول مهما فعل. وفي كل لعبة جديدة، من المفيد التحقق بدءًا
        من النهاية قبل افتراض أن النقلة الأولى تفوز.
    art:
      moves: "النقلات: لأعلى، لليمين، قطريًا لأعلى ولليمين"
      green: الأخضر، فوز بنقلة واحدة
      red: النقاط الحمراء، خسارة لمن عليه الدور
      start: يبدأ الملك على مربع خاسر
  - title: زهرة الأقحوان
    question: >-
      لزهرة أقحوان 12 بتلة في دائرة. ويتناوب لاعبان على نزع بتلة واحدة، أو
      بتلتين تنموان متجاورتين لا فراغ بينهما. ومن ينزع البتلة الأخيرة يفوز. من
      يفوز إذا لعب كلاهما أفضل لعب ممكن؟
    steps:
      - >-
        مهما نزع اللاعب الأول، بتلة أو بتلتين، تنفتح الدائرة وتصير صفًا من 11 أو
        10 بتلات.
      - >-
        ينزع اللاعب الثاني من منتصف هذا الصف تمامًا: بتلة واحدة من صف من 11، أو
        بتلتين من صف من 10. فيبقى صفان متساويان في جهتين متقابلتين.
      - >-
        ومن ذلك الحين يقلّد اللاعب الثاني كل نقلة في الصف الآخر. فكلما استطاع
        الأول أن يلعب، استطاع الثاني أيضًا، لذا ينزع الثاني البتلة الأخيرة.
    answer: اللاعب الثاني.
    badge: الثاني
    note:
      title: لماذا المنتصف؟
      text: >-
        تقسيم الصف إلى جزأين متساويين يجعل الوضع متماثلًا. والتقليد لا يمكن أن
        يخسر: فتقليد النقلة مسموح دائمًا، لأن الصف الآخر يبدو مطابقًا له تمامًا.
    art:
      eleven: نزع الأول بتلة، فبقي صف من 11
      two-rows: صفان من 5 بتلات
      mirror: نزع الأول من الصف الأزرق، وقلّده الثاني في البرتقالي

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      تضيع إحدى قواعد اللعبة: تُؤخذ في نقلة واحدة 5 قطع حلوى مع أن المسموح 4 على
      الأكثر، أو يتحرك الملك إلى اليسار، وهو ما تمنعه القواعد. والخطة المبنية
      على نقلة غير مسموحة لا تفوز بشيء.
    say: «ما النقلات التي تسمح بها القواعد؟»
    art:
      question: من 1 إلى 4 قطع في كل نقلة
      five: أخذ 5
      three: أخذ 3
  first_move_assumed:
    shows: >-
      يُعدّ البدء أولًا فوزًا في حد ذاته: «رنا تبدأ، إذن رنا تفوز». وفي كثير من
      الألعاب، مثل رحلة الملك، يخسر اللاعب الأول مهما فعل.
    say: «وماذا لو لم يخطئ اللاعب الآخر؟»
    art:
      question: رحلة الملك
      first: يفوز الأول
      second: الثاني
  best_case_not_worst:
    shows: >-
      لا تنجح الخطة إلا إذا أخطأ اللاعب الآخر: تأخذ رنا 4 وتأمل أن يأخذ ليث
      بعدها أقل مما ينبغي. أما الاستراتيجية الرابحة فيجب أن ترد على أفضل نقلة
      للاعب الآخر.
    say: «وما أفضل رد للاعب الآخر على ذلك؟»
    art:
      question: نقلة رنا الأولى من 23
      leo: ليث −4

home:
  - title: لعب لعبة أعواد الثقاب
    text: >-
      العبوا لعبة أخذ 1 أو 2 أو 3 أعواد من 15 عودًا، واتركوا النقلة الأولى
      لطفلكم. فوزوا بضع مرات، ثم اسألوا عن سبب عودة مضاعفات 4 مرة بعد مرة.
  - title: تقليد النقلة
    text: >-
      في أي لعبة على رقعة متماثلة، جرّبوا تقليد نقلة اللاعب الآخر في الجهة
      المقابلة. واسألوا متى ينجح التقليد، ومتى يفشل.
  - title: تبادل الأدوار
    text: >-
      بعد توصّل طفلكم إلى خطة رابحة، تبادلوا الأدوار: دور طفلكم الآن هو الثاني.
      وشرح سبب خسارة الخطة عندئذ هو النصف الأعمق من الموضوع.

