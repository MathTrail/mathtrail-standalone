# The page of the topic of weighing and pouring, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: الوزن وسكب السوائل
description: ما هي مسائل الوزن وسكب السوائل، من لغز القطعة النقدية المزيفة على الميزان إلى الأباريق، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words the page's drawings write a jug's size, a step and a move in.
art:
  litres: "{count} لتر"
  step: الخطوة
  pour: سكب
  empty: إفراغ
  fill: ملء
  top: إكمال

hero:
  lead: >-
    بإبريق سعة 5 لترات وآخر سعة 3 لترات، كيف تُقاس 4 لترات بالضبط؟ وبميزان ذي
    كفتين دون أثقال، كيف تُعرف القطعة النقدية الخفيفة الوحيدة بين قطع كثيرة؟ في
    هذه المسائل يكون المطلوب التخطيط لسلسلة قصيرة من الخطوات، وكل قاعدة مهمة: لا
    علامات على الأباريق، ولا أثقال للميزان. وهذا أول لقاء مع الخوارزميات، أي مع
    خطط تنجح مهما حدث.
  method: كتابة كل حالة والبحث عن أقصر طريق
  teaches: التخطيط للخطوات مسبقًا، والتفكير في كل نتيجة من نتائج الوزنة
  # The words of its drawing: what is measured over it, and what each pair of
  # jugs is.
  art:
    line: قياس 4 لترات بإبريقين سعتهما 5 و3 لترات
    pair: "كل زوج حالة واحدة: ما في كل إبريق"

basis:
  title: قواعد الوزن وسكب السوائل
  cards:
    - title: الحالة هي كل الأباريق
      text: >-
        اكتبوا ما في كل إبريق بعد كل خطوة: 5 و0، ثم 2 و3. وتبيّن قائمة الحالات
        إلى أين يمكن الوصول، وبأي الحالات مررتم من قبل.
    - title: ثلاث نتائج
      text: >-
        يمكن أن يميل الميزان إلى اليسار أو إلى اليمين أو أن يبقى متوازنًا، فلكل
        وزنة ثلاث نتائج. قسّموا القطع النقدية إلى ثلاث مجموعات، لا إلى مجموعتين.
      art:
        left: يسارًا
        level: توازن
        right: يمينًا
    - title: كل قاعدة مهمة
      text: >-
        لا علامات على الأباريق، ولا إراقة للماء، والأثقال في كفة واحدة فقط: كل
        قاعدة تغيّر الخطوات المسموح بها، ومن ثم الإجابة.
      art:
        no-marks: بلا علامات
        pour-out: إراقة الماء
        unless: إلا إذا سمحت المسألة بذلك
        weight: ثقل
        one-pan: في كفة واحدة فقط

idea:
  title: ثلاث نتائج للوزنة
  lead: لكل وزنة ثلاث نتائج، لذا يمكنها أن تقسم القطع النقدية إلى ثلاث مجموعات. وهذا ما يحدد عدد القطع النقدية التي يمكن فحصها بعدد معيّن من الوزنات.
  table:
    head:
      - الوزنات
      - النتائج
      - القطع التي يمكن فحصها
    rows:
      - - "1"
        - "3"
        - حتى 3
      - - "2"
        - 3 × 3 = 9
        - حتى 9
      - - "3"
        - 3 × 3 × 3 = 27
        - حتى 27
  note:
    title: لماذا هذا مهم
    text: >-
      وزن نصف القطع النقدية مقابل النصف الآخر يكلّف وزنات أكثر من اللازم.
      والفكرة كلها في إدراك أن الميزان يجيب بثلاث طرق لا بطريقتين، وهي فكرة
      تعود لاحقًا في علوم الحاسوب في صورة البحث.

method:
  title: "طريقة الحل: إنشاء جدول للحالات"
  lead: >-
    في مسائل السكب، أنشئوا جدولًا فيه عمود لكل إبريق وصف لكل خطوة، وجرّبوا من
    كل صف كل خطوة مسموح بها حتى يظهر الهدف؛ وأول مرة يظهر فيها تعطي أقل عدد من
    الخطوات. وفي مسائل الوزن، خطّطوا لما يجب فعله بعد كل نتيجة من النتائج
    الثلاث. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - كتابة الحالة، أي ما في كل إبريق أو كفة
    - تجربة كل خطوة مسموح بها منها
    - التوقف عند الهدف، وعدّ الخطوات
  # The key under the steps: what a frame on the drawings means.
  legend:
    goal: تم بلوغ الهدف

examples:
  - title: لتر واحد
    question: >-
      لدى طاهية إبريق فارغ سعة 3 لترات، وإبريق فارغ سعة 5 لترات، وصنبور. ولا
      علامات على الإبريقين. وفي الخطوة الواحدة تملأ إبريقًا من الصنبور، أو تفرغ
      إبريقًا، أو تسكب من إبريق في الآخر حتى يفرغ الأول أو يمتلئ الثاني. ما أقل
      عدد من الخطوات للحصول على 1 لتر بالضبط في أحد الإبريقين؟
    steps:
      - نملأ الإبريق سعة 3 لترات ونسكب ما فيه في الإبريق سعة 5 لترات، فيصير فيه 3 لترات.
      - >-
        نملأ الإبريق سعة 3 لترات مرة أخرى ونسكب منه حتى يمتلئ الإبريق الكبير: لا
        يدخله إلا 2 لتران آخران.
      - "يبقى 1 لتر في الإبريق الصغير بعد 4 خطوات: ملء، سكب، ملء، سكب."
    answer: 4 خطوات.
    note:
      title: لماذا ليس أقل؟
      text: >-
        لا يظهر 1 لتر في جدول كل الحالات التي يمكن بلوغها في ثلاث خطوات أو أقل:
        فلا يكون في أي من الإبريقين إلا 0 أو 2 أو 3 أو 5 لترات. ولا يظهر أول لتر
        إلا بعد الخطوة الرابعة.
    art:
      jugs: إبريقان سعة 3 و5 لترات، بلا علامات
      rows: 4 خطوات، 4 صفوف بعد الإبريقين الفارغين
      three: "في 3 خطوات:"
      no-litre: لا يوجد لتر
  - title: ثماني قطع نقدية
    question: >-
      هناك 8 قطع نقدية متشابهة في المظهر. إحداها مزيفة وأخف من غيرها، وكل القطع
      الأخرى متساوية في الوزن. ما أقل عدد من الوزنات على ميزان ذي كفتين بلا
      أثقال يضمن العثور على القطعة المزيفة؟
    steps:
      - نضع 3 قطع نقدية في كل كفة، ونترك 2 جانبًا.
      - >-
        إذا ارتفعت إحدى الكفتين، فالمزيفة بين 3 قطع عليها: نزن 1 مقابل 1،
        والأخف هي المزيفة، وإن توازنتا فالمزيفة هي الثالثة.
      - >-
        وإذا توازنت الكفتان، فالمزيفة بين القطع المتروكة جانبًا، وهي 2: نزن
        إحداهما مقابل الأخرى. وفي الحالتين تكفي 2 وزنتان، أما 1 وزنة فلا تكفي:
        فليس لها إلا 3 نتائج مقابل 8 قطع نقدية.
    answer: 2 وزنتان.
    note:
      title: لماذا ليس 4 و4؟
      text: >-
        وزن 4 مقابل 4 يترك بعد الوزنة الأولى 4 قطع نقدية، و4 قطع تحتاج إلى 2
        وزنتين إضافيتين، أي 3 وزنات في المجموع. أما المجموعات المكوّنة من ثلاث
        قطع فتجعل النتيجة «توازن» تؤدي هي أيضًا جزءًا من العمل.
    art:
      one-lighter: واحدة من 8 أخف
      three: 3 مقابل 3
      aside: جانبًا
      lighter: اليسرى أخف
      one: 1 مقابل 1
      found: هي الأخف؛ وإن توازنتا فالثالثة
      level: توازن
      of-two: بين 2 تُركتا جانبًا
      never-level: لا تتوازن أبدًا
      four-left: تبقى 4 ← 2 وزنتان أخريان
  - title: مئة قطعة نقدية
    question: >-
      بين 100 قطعة نقدية متشابهة في المظهر، قطعة واحدة مزيفة وأخف من غيرها، وكل
      القطع الأخرى متساوية في الوزن. ما أقل عدد من الوزنات على ميزان ذي كفتين
      بلا أثقال يضمن العثور على القطعة المزيفة؟
    steps:
      - >-
        لكل وزنة 3 نتائج، لذا تميّز 4 وزنات بين 3 × 3 × 3 × 3 = 81 حالة على
        الأكثر. وهذا أقل من 100 قطعة نقدية، فلا تكفي 4 وزنات.
      - >-
        نضع 33 قطعة نقدية في كل كفة، ونترك 34 جانبًا: ومهما حدث، تبقى 34 قطعة
        نقدية على الأكثر. وبالطريقة نفسها تتقلص 34 إلى 12 على الأكثر، ثم إلى 4،
        ثم إلى 2، ثم إلى 1.
      - فهذه 5 وزنات، يتناقص فيها عدد القطع النقدية من 100 إلى 34 ثم 12 ثم 4 ثم 2 ثم 1.
    answer: 5 وزنات.
    note:
      title: نصفا البرهان
      text: >-
        تحتاج الإجابة إلى الأمرين معًا: خطة تجد القطعة المزيفة في 5 وزنات، وعدّ
        للنتائج يبيّن أن 4 لا تكفي أبدًا. وإجابات الأولمبياد عن «أقل عدد» تتكون
        دائمًا من هذين النصفين.
    art:
      aside: جانبًا
      numbers: الأعداد فوق الأسهم تعدّ الوزنات
      plan: الخطة
      always: 5 وزنات تجدها دائمًا
      bound: الحد
      at-most: 4 تميّز 81 حالة على الأكثر

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      تُكسر إحدى قواعد المسألة دون انتباه: يُراق الماء مع أن المسألة لا تسمح
      بذلك، أو يُملأ إبريق حتى علامة ليست عليه، أو يُوضع ثقل في الكفة التي
      عليها ما يُوزن.
    say: «ما الخطوات التي تسمح بها المسألة؟»
    art:
      question: لا علامات على الأباريق
      to-mark: ملء «حتى 1 لتر»
      after-pouring: 1 لتر، بالسكب
  stopped_early:
    shows: >-
      تتوقف الخطة قبل الوصول إلى اليقين: تكشف وزنة واحدة المجموعة التي فيها
      القطعة المزيفة فينتهي البحث عندها، أو يتوقف السكب عند 2 لترين مع أن الهدف
      كان 1.
    say: «مهما أظهر الميزان، هل نعرف الآن بالتأكيد؟»
    art:
      question: بعد الوزنة الأولى
      here: «إنها هنا»، لكن أيها؟
      one-more: وزنة أخرى
  off_by_one:
    shows: >-
      يقع خطأ بواحد في عدّ الخطوات: يُغفل الملء الأول من الصنبور، أو تُحسب عملية
      السكب الأخيرة مرتين.
    say: "«لنعدّ من جديد على الجدول: صف واحد، خطوة واحدة»."
    art:
      question: صف واحد في الجدول، خطوة واحدة
      three: 3 خطوات
      four: 4 خطوات
      empty: فارغان ← 4 حالات

home:
  - title: أباريق في المغسلة
    text: >-
      خذوا كوبين مختلفين في الحجم، وحاولوا قياس كمية لا تساوي سعة أي منهما.
      والمغسلة أفضل مختبر، والماء المنسكب لا يضر.
  - title: إيجاد الأخف
    text: >-
      أخفوا شيئًا أخف بين بضعة أشياء متشابهة في المظهر، وابحثوا عنه بميزان
      منزلي، أو بعلّاقة ملابس يتدلى منها كيسان. وعدّوا الوزنات.
  - title: التخطيط أولًا
    text: >-
      قبل السكب أو الوزن، اكتبوا الخطة في جدول وتحققوا منها خطوة بخطوة. فالمهارة
      في التخطيط أولًا، لا في الحظ.

# What a parent can write in the chat to get a task on this topic.
