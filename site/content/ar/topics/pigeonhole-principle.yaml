# The page of the topic of the pigeonhole principle, for a parent, in Arabic.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: مبدأ برج الحمام
description: ما هي مسائل مبدأ برج الحمام، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    تطير خمس حمامات إلى أربعة أعشاش، وبحسب مبدأ برج الحمام لا بد أن يضمّ أحد
    الأعشاش اثنتين منها. وفي هذه المسائل على الطفل إثبات أن شيئًا ما لا بد أن
    يحدث مهما ساء الحظ: جوربان من لون واحد يُسحبان من درج مظلم، وعيدا ميلاد في
    شهر واحد. وهي أول لقاء مع التفكير في أسوأ حالة بدل الحالة المحظوظة.
  method: تتبّع أسوأ الحظ حتى النهاية، ثم إضافة واحد
  teaches: إثبات أن شيئًا ما لا بد أن يحدث، لا أنه قد يحدث فحسب
  # The words of its drawing: the pigeons and the cages over it, and what the
  # seating always comes to.
  art:
    line: خمس حمامات، أربعة أعشاش
    seat: نوزّعها كما نشاء
    two: اثنتان
    always: كيفما توزّعت، ففي أحد الأعشاش اثنتان

basis:
  title: قواعد أسوأ حالة
  cards:
    - title: الحمام أكثر من الأعشاش
      text: >-
        إذا كان الحمام أكثر من الأعشاش، ففي أحد الأعشاش حمامتان على الأقل.
        وزّعوها بالتساوي قدر ما تشاؤون: ستبقى دائمًا واحدة زائدة.
    - title: للتأكد
      text: >-
        عبارة «للتأكد» تعني: مهما خرج من الكيس. لذا تخيّلوا أن كل شيء يسير على
        أسوأ وجه ممكن، وانظروا إلى أي حد يمكن أن يصل الحظ السيئ.
      art:
        luck: الحظ الجيد
        not-counted: لا يُحتسب
        bad-luck: الحظ السيئ
    - title: واحد إضافي يحسم الأمر
      text: >-
        عندما ينفد الحظ السيئ، بعد أن يُسحب كل لون مرة ويُملأ كل عش مرة، فلا بد
        أن يعطي التالي المطلوب.
      art:
        eighth: واحدة لكل يوم؛ والثامنة تكمل زوجًا

idea:
  title: أسوأ الحظ، ثم واحد إضافي
  lead: كل سؤال هنا يسأل عمّا هو مؤكد. والإجابة هي أقصى ما يمكن أن يصل إليه الحظ السيئ، وواحد إضافي.
  table:
    head:
      - المطلوب بالتأكيد
      - ما قد يعطيه الحظ السيئ أولًا
      - إذن نأخذ
    rows:
      - - اثنان وُلدا في اليوم نفسه من الأسبوع
        - واحد وُلد في كل يوم من 7 أيام
        - 7 + 1 = 8 أشخاص
      - - كرة حمراء، من بين 6 زرقاء و4 حمراء
        - كل الكرات الزرقاء، أي 6
        - 6 + 1 = 7 كرات
      - - كرتان حمراوان، من بين 6 زرقاء و4 حمراء
        - كل الكرات الزرقاء، أي 6، وكرة حمراء واحدة
        - 6 + 1 + 1 = 8 كرات
  note:
    title: لماذا هذا مهم
    text: >-
      كثيرًا ما يعتمد الأطفال على الحظ: «ربما أسحب كرتين حمراوين على الفور».
      والمسألة التي تقول «للتأكد» تسأل عمّا يحدث مع أسوأ حظ، وهذه العادة أثمن من
      أي صيغة.

method:
  title: "طريقة الحل: أسوأ الحظ، ثم واحد إضافي"
  lead: >-
    حدّدوا الأعشاش، كالألوان أو الأشهر أو أيام الأسبوع، وتتبّعوا أسوأ الحظ حتى
    نهايته: خذوا كل ما لا يعطي حتى الآن ما يطلبه السؤال. فالتالي لا بد أن يعطيه.
    تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - تحديد الأعشاش والحمام
    - تتبّع أسوأ الحظ حتى النهاية
    - إضافة واحد، والتحقق من أنه يحسم الأمر
  # The key under the steps: what the drawings' bracket and ring mean.
  legend:
    bad-luck: الحظ السيئ
    decides: الواحد الإضافي الذي يحسم الأمر

examples:
  - title: حلوى في مرطبان
    question: >-
      في مرطبان 8 قطع حلوى بطعم الليمون و2 بطعم البرتقال. كم قطعة حلوى يجب أن
      تأخذ سارة دون أن تنظر، للتأكد من الحصول على قطعة بطعم البرتقال؟
    steps:
      - "تريد سارة قطعة بطعم البرتقال. وأسوأ الحظ: ليمون بعد ليمون."
      - >-
        قطع الليمون 8 فقط: فبعد 8 منها لا يبقى في المرطبان إلا قطع البرتقال.
      - "الحلوى رقم 9 لا بد أن تكون بطعم البرتقال: 8 + 1 = 9."
    answer: 9 قطع حلوى.
    art:
      lemon: ليمون، 8
      orange: برتقال، 2
      unlucky: حظ سيئ
      all-lemons: الليمون كله، 8
      lemons: 8 من الليمون
  - title: جوربان أسودان
    question: >-
      في درج 8 جوارب سوداء و6 بيضاء و2 مخططان، وكلها مختلطة. كم جوربًا يجب أن
      يأخذ خالد في الظلام للتأكد من الحصول على جوربين أسودين؟
    steps:
      - >-
        أسوأ الحظ: تخرج أولًا الجوارب غير السوداء. وهي 6 بيضاء و2 مخططان، أي 8
        جوارب ليس بينها جورب أسود.
      - >-
        ويمكن أن يستمر الحظ السيئ: فالجورب التالي أسود، لكنه واحد فقط. فهذه 9
        جوارب ليس بينها إلا جورب أسود واحد.
      - >-
        أما الجورب رقم 10 فلا بد أن يكون أسود أيضًا، لأنه لم يبق إلا الجوارب
        السوداء. إذن 10 جوارب.
    answer: 10 جوارب.
    note:
      title: لماذا ليس 9؟
      text: >-
        بعد خروج 6 جوارب بيضاء و2 مخططين، أي كل ما في الدرج منها، يبقى للحظ السيئ
        دور آخر: جورب أسود واحد. ولا يُضمن جوربان أسودان إلا مع الجورب رقم 10.
    art:
      black: أسود، 8
      white: أبيض، 6
      striped: مخطط، 2
      no-black: 8 بلا أسود
      not-black: 8 غير سوداء
      one: واحد
      only-one: 9 جوارب، وفيها أسود واحد فقط
  - title: مجاميع في جدول
    question: >-
      في كل خانة من جدول 2 في 2 يُكتب 1 أو 2 أو 3. يُجمع العددان في كل صف، وفي
      كل عمود، وفي كل قطر. هل صحيح أن مجموعين من هذه المجاميع الستة متساويان
      دائمًا؟
    steps:
      - >-
        نعدّ الأعشاش: مجموع عددين من 1 و2 و3 هو أحد الأعداد 2 و3 و4 و5 و6، أي خمس
        قيم إجمالًا.
      - "نعدّ الحمام: 2 صفان و2 عمودان و2 قطران، فهذه 6 مجاميع."
      - >-
        ستة مجاميع وخمس قيم فقط: لا بد أن يتساوى مجموعان منها، مهما كانت الأعداد
        في الجدول.
    answer: نعم، دائمًا.
    badge: نعم
    note:
      title: الأعشاش ليست صناديق دائمًا
      text: >-
        هنا الأعشاش هي القيم التي يمكن أن يأخذها المجموع، والحمام هو خطوط الجدول.
        وفن هذه المسائل في رؤية ما يؤدي دور الأعشاش.
    art:
      example: "مثلًا: 1 أو 2 أو 3 في كل خانة"
      cages: 5 أعشاش، هي المجاميع الممكنة
      row: صف
      column: عمود
      diagonal: قطر
      pigeons: 6 مجاميع، 6 حمامات
      two: "6 حمامات في 5 أعشاش: في أحدها اثنتان"
      cages-name: الأعشاش
      pigeons-name: الحمام

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  best_case_not_worst:
    shows: >-
      الاعتماد على الحظ: «إذا كان أول جوربين أسودين، فجوربان يكفيان». والسؤال
      يقول «للتأكد»، وهذه الكلمة تستبعد الحظ تحديدًا.
    say: «وماذا لو كان الحظ في أسوأ حالاته؟»
    art:
      question: جوربان أسودان بالتأكيد
  ignored_condition:
    shows: >-
      تضيع كلمة من السؤال: تُقرأ «جوربان أسودان» على أنها «جوربان من لون واحد»،
      أو «واحد من كل لون» على أنها «لون واحد».
    say: «لنقرأ السؤال مرة أخرى. ما الذي يجب التأكد منه بالضبط؟»
    art:
      question: "المطلوب: جوربان **أسودان**"
      black-pair: زوج لونه أسود
  off_by_one:
    shows: >-
      تتبّع أسوأ الحظ حتى نهايته ثم التوقف عنده، مع نسيان الواحد الإضافي الذي
      يحسم الأمر، أو إضافة واحد زائد عن اللازم.
    say: «بعد أسوأ الحظ، ماذا يعطي التالي؟»
    art:
      question: 8 من الليمون و2 من البرتقال

home:
  - title: جوارب في الظلام
    text: >-
      ضعوا في كيس جوارب من لونين أو ثلاثة، وأخرجوها بعيون مغمضة: كم جوربًا يلزم
      حتى يُضمن الزوج؟ جرّبوا ذلك عدة مرات. الحظ يتغير، والإجابة لا تتغير.
  - title: يجب أم يمكن؟
    text: >-
      عندما تسمعون من الطفل «قد يحدث هذا»، اسألوا: «وهل يمكن ألا يحدث؟». فالفرق
      بين «يمكن» و«يجب» هو الموضوع كله.
  - title: البحث عن الأعشاش
    text: >-
      ابحثوا معًا عن الأعشاش في الأعداد اليومية: سبعة أيام في الأسبوع، واثنا عشر
      شهرًا، وأربعة فصول. «نحن 30: هل من المؤكد أن بيننا اثنين وُلدا في الشهر
      نفسه؟».

