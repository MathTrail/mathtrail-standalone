# The page of the topic of parity and alternation, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: الزوجية والتناوب
description: ما هي مسائل الزوجية والتناوب عن الأعداد الزوجية والفردية وما يتناوب، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words the page's drawings say of a number and of a corner of the cube.
art:
  even: زوجي
  odd: فردي
  start: البداية

hero:
  lead: >-
    هل يمكن أن يقف 15 طفلًا في حلقة، ولد ثم بنت ثم ولد ثم بنت، على طول الدائرة
    كلها؟ في هذه المسائل يجيب الزوجي والفردي عن السؤال دون عدّ كل شيء أو تجربة
    كل الطرق: عند أي ضفة تكون العبّارة، وهل يمكن تحقيق مجموع ما من النقاط، ومن
    يلعب النقلة الأخيرة. والزوجية عند كثير من الأطفال أول شيء يصادفونه لا يتغير
    مهما جرت الحركات.
  method: مراقبة أثر كل حركة في الزوجية
  teaches: الإجابة عن سؤال «هل هذا ممكن؟» دون تجربة كل الطرق
  # The words of its drawing: who takes turns, the key of the colours, and
  # what the two circles show.
  art:
    line: يتناوب الأولاد والبنات حول دائرة
    boy: ولد
    girl: بنت
    six: "6 أطفال: ممكن"
    five: "5 أطفال: غير ممكن"
    even: حول دائرة، لا ينجح التناوب إلا مع عدد زوجي من الأطفال

basis:
  title: قواعد الزوجي والفردي
  cards:
    - title: الزوجي ينقسم إلى أزواج
      text: >-
        إذا كان عدد الأشياء زوجيًا، انقسمت إلى أزواج دون أن يبقى منها شيء. وإذا
        كان فرديًا، بقي دائمًا واحد بلا زوج.
    - title: العبرة بالأعداد الفردية وحدها
      text: >-
        زوجي زائد زوجي يعطي زوجيًا، وفردي زائد فردي يعطي زوجيًا، وزوجي زائد فردي
        يعطي فرديًا. لذلك لا تتوقف زوجية المجموع إلا على عدد الأعداد الفردية فيه.
    - title: التناوب
      text: >-
        عندما يتناوب شيئان، يقف أحدهما في الأماكن الفردية والآخر في الأماكن
        الزوجية. ولا يمكن التناوب على طول الحلقة كلها إلا إذا كان عدد أماكنها
        زوجيًا.
      art:
        places: الأولاد في الأماكن الفردية، والبنات في الزوجية

idea:
  title: عدّ الأعداد الفردية وحدها
  lead: لمعرفة ما إذا كان المجموع زوجيًا، لا حاجة إلى حسابه. عدّوا الأعداد الفردية فيه.
  table:
    head:
      - المجموع
      - الأعداد الفردية فيه
      - زوجية المجموع
    rows:
      - - 4 + 6 + 8
        - لا يوجد
        - زوجي
      - - 3 + 5
        - "2"
        - زوجي
      - - 3 + 5 + 7
        - "3"
        - فردي
      - - 1 + 2 + … + 10
        - "5"
        - فردي
  note:
    title: لماذا هذا مهم
    text: >-
      كثير من أسئلة الأولمبياد تسأل هل يمكن أن يحدث أمر ما أصلًا. والزوجية
      تستطيع أن تجيب «لا» دون تجربة الطرق: فإذا كانت كل حركة تبقي عددًا ما
      زوجيًا، وكان الهدف يحتاج إليه فرديًا، فلن تصل إليه أي حركة أبدًا.

method:
  title: "طريقة الحل: تتبّع الزوجي والفردي"
  lead: >-
    ابحثوا في المسألة عن عدد يكون زوجيًا أو فرديًا: عدد أشياء، أو مجموع، أو
    مكان في صف. وانظروا ماذا تفعل به كل حركة أو كل خطوة، هل يتغير أم يبقى على
    حاله، ثم قارنوا البداية بالهدف. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى
    الأولمبياد.
  steps:
    - إيجاد ما هو زوجي أو فردي
    - ملاحظة ما تفعله به كل خطوة
    - مقارنة البداية بالهدف

examples:
  - title: العبّارة
    question: >-
      تنقل عبّارة السيارات عبر نهر، ذهابًا وإيابًا، مرة بعد مرة. وهي تبدأ من
      الضفة اليسرى. عند أي ضفة تكون بعد أن تعبر النهر 7 مرات؟
    steps:
      - بعد 1 عبور تكون العبّارة عند الضفة اليمنى، وبعد 2 تعود إلى اليسرى.
      - >-
        كل عبورين يعيدانها إلى حيث بدأت. لذلك تكون بعد عدد زوجي من مرات العبور
        عند الضفة اليسرى، وبعد عدد فردي عند اليمنى.
      - 7 عدد فردي، إذن العبّارة عند الضفة اليمنى.
    answer: عند الضفة اليمنى.
    badge: →
    note:
      title: لماذا لا نعدّ فقط؟
      text: >-
        مع 7 مرات عبور يكون العدّ سريعًا. لكن القاعدة تجيب عن 100 مرة عبور
        بالسرعة نفسها، والقاعدة هي ما تحتاج إليه المسائل الأصعب.
    art:
      start: في البداية، عند الضفة اليسرى
      none: 0 عبور
      one: 1 عبور
      two: 2 عبوران
      left: الضفة اليسرى
      right: الضفة اليمنى
  - title: أربعة أسهم
    question: >-
      يرمي باسم 4 أسهم على لوحة سهام قيم حلقاتها 1 و3 و5 و7 نقاط، وكل سهم يصيب
      اللوحة. ويقول باسم إنه سجّل 15 نقطة. هل يمكن أن يكون هذا صحيحًا؟
    steps:
      - كل حلقة تساوي عددًا فرديًا من النقاط.
      - >-
        مجموع عددين فرديين عدد زوجي. و4 أسهم تشكّل زوجين، وكل زوج يسجّل عددًا
        زوجيًا، إذن مجموع نقاط 4 أسهم معًا عدد زوجي.
      - 15 عدد فردي، إذن لا يمكن أن يكون باسم قد سجّله.
    answer: لا.
    badge: ✕
    note:
      title: ومع 3 أسهم؟
      text: >-
        مجموع ثلاثة أعداد فردية عدد فردي، والمجموع 15 ممكن: 5 + 5 + 5، أو
        7 + 7 + 1.
    art:
      darts: 4 أسهم، كلها على اللوحة
      rings: كل الحلقات فردية
      only-even: و4 أسهم لا تعطي إلا مجموعًا زوجيًا
  - title: عنكبوت على مكعب
    question: >-
      يقف عنكبوت عند أحد رؤوس مكعب مصنوع من السلك. وفي كل دقيقة يزحف على حرف
      واحد إلى رأس مجاور. هل يمكن أن يكون بعد 7 دقائق بالضبط عند الرأس الذي بدأ
      منه؟
    steps:
      - >-
        نلوّن الرؤوس: رأس البداية بالأبيض، وجيرانه بالأسود، وجيران جيرانه
        بالأبيض، وهكذا. وكما يبيّن الرسم، كل حرف يصل بين رأس أسود ورأس أبيض.
      - >-
        إذن يتغير اللون كل دقيقة: بعد 1 دقيقة يكون العنكبوت على رأس أسود، وبعد
        2 على أبيض، وبعد أي عدد فردي من الدقائق على أسود.
      - 7 عدد فردي، ورأس البداية أبيض. فلا يمكن أن يعود العنكبوت إليه.
    answer: لا.
    badge: ✕
    note:
      title: وبعد 8 دقائق؟
      text: >-
        نعم: الزحف على حرف واحد ذهابًا وإيابًا أربع مرات يعيده إلى البداية.
        الألوان تقول متى يستحيل الرجوع؛ أما أن عددًا زوجيًا من الدقائق يكفي فما
        زال يحتاج إلى إثبات.
    art:
      edge: حرف واحد كل دقيقة
      minutes: "الدقائق: رأس أبيض في الزوجية، وأسود في الفردية"
      seven: بعد 7 دقائق
      back: ذهابًا وإيابًا × 4
      eight: 8 دقائق

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_parity:
    shows: >-
      يتبادل الزوجي والفردي مكانيهما: استنتاج أن العبّارة تعود بعد 7 مرات عبور
      إلى حيث بدأت، أو أن مجموع أربعة أعداد فردية عدد فردي.
    say: "«لنجرّب حالة صغيرة: أين العبّارة بعد 1 عبور، وبعد 2؟»"
    art:
      question: أين العبّارة بعد 7 مرات عبور؟
  ignored_condition:
    shows: >-
      يضيع أحد شروط المسألة: الوصول إلى 15 نقطة بثلاثة أسهم ونسيان أن باسم رمى
      أربعة، أو اختيار عدد يوافق معلومة دون الأخرى.
    say: «لنقرأ المسألة مرة أخرى. هل تتفق الإجابة مع كل كلمة فيها؟»
    art:
      question: "الأسهم: 4"
      three: 3 أسهم
      always: زوجي دائمًا
  off_by_one:
    shows: >-
      يُحسب المكان في الصف زائدًا أو ناقصًا بواحد: تُعدّ البداية أول عبور، أو
      يُعطى الصف الذي يبدأ بولد وينتهي بولد عددًا من الأولاد يساوي عدد البنات.
    say: «لنكتب أول بضعة منها. أيها رقم 1؟»
    art:
      equal: بالتساوي

home:
  - title: فردي أم زوجي؟
    text: >-
      أخفوا حفنة من الأزرار في قبضتكم، واتركوا التخمين لطفلكم: فردي أم زوجي؟ ثم
      تحققوا معًا بوضع الأزرار أزواجًا.
  - title: من يلعب النقلة العاشرة؟
    text: >-
      في أي لعبة يتناوب فيها لاعبان، اسألوا قبل نهايتها: من سيلعب النقلة
      العاشرة؟ والخامسة عشرة؟ فالإجابة تأتي من الزوجي والفردي، لا من مواصلة
      اللعب.
  - title: أرقام البيوت
    text: >-
      في أحد الشوارع، انظروا إلى أرقام البيوت: الزوجية على جانب، والفردية على
      الجانب الآخر. على أي جانب سيكون البيت رقم 37؟

