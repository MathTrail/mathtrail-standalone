# commonest, counted in its reference tasks.

title: النسب والتقسيم
description: ما هي مسائل النسب والتقسيم، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words the page's drawings name their people and boxes in.
art:
  ann: أمل
  ben: باسم
  a: أ
  b: ب

hero:
  lead: >-
    أمل وباسم يتقاسمان 35 قطعة حلوى بنسبة 3 إلى 4. كم قطعة يأخذ كل منهما؟ في
    هذه المسائل تبيّن النسبة عدد الأجزاء المتساوية التي يأخذها كل واحد، لا عدد
    الأشياء. وعدّ الأجزاء أولًا ثم إيجاد قيمة الجزء الواحد طريقة تحوّل كل مسألة
    نسب إلى عملية قسمة.
  method: عدّ الأجزاء، ثم إيجاد قيمة الجزء الواحد
  teaches: رؤية النسبة على أنها أجزاء متساوية، وتكبير وصفة الطعام أو تصغيرها
  # The words of its drawing: what is shared over it, and what the parts come
  # to under it.
  art:
    line: 35 قطعة حلوى بنسبة 3 إلى 4
    parts: 7 أجزاء = 35، الجزء الواحد = 5
    shares: أمل 3 × 5 = 15، باسم 4 × 5 = 20

basis:
  title: قواعد النسب
  cards:
    - title: النسبة أجزاء
      text: >-
        النسبة 3 إلى 4 تعني: مقابل كل 3 أجزاء متساوية لأحدهما، 4 أجزاء للآخر.
        فهي معًا 7 أجزاء متساوية، لا 3 ولا 4.
      art:
        seven: 3 إلى 4 هي 7 أجزاء متساوية
    - title: الجزء الواحد أولًا
      text: >-
        اقسموا المجموع على عدد الأجزاء لإيجاد الجزء الواحد، ثم اضربوا الناتج في
        عدد أجزاء كل واحد: 35 : 7 = 5، إذن 3 أجزاء تساوي 15، و4 أجزاء تساوي 20.
      art:
        one: "35 : 7 = 5 في الجزء الواحد"
    - title: ضرب الطرفين
      text: >-
        تبقى النسبة كما هي إذا ضُرب عدداها في العدد نفسه: 3 إلى 4 هي 6 إلى 8،
        وهي 30 إلى 40. وهكذا تكبر الوصفة.

idea:
  title: عدّ الأجزاء
  lead: مهما كانت النسبة، اجمعوا أعدادها أولًا. فالمجموع هو عدد الأجزاء المتساوية التي يُقسَّم إليها الكل.
  table:
    head:
      - ما يُقسَّم
      - الأجزاء
      - الجزء الواحد والحصص
    rows:
      - - 35 قطعة حلوى، 3 إلى 4
        - 3 + 4 = 7
        - "35 : 7 = 5، إذن 15 و20"
      - - 60 بطاقة، 1 إلى 2 إلى 3
        - 1 + 2 + 3 = 6
        - "60 : 6 = 10، إذن 10 و20 و30"
      - - 45 خرزة، 2 إلى 7
        - 2 + 7 = 9
        - "45 : 9 = 5، إذن 10 و35"
  note:
    title: لماذا هذا مهم
    text: >-
      أكثر الأخطاء شيوعًا القسمة على أحد أعداد النسبة بدل مجموعها: 35 : 3 أو
      35 : 4. ورسم صندوق لكل جزء يجعل إغفال المجموع مستحيلًا.

method:
  title: "طريقة الحل: رسم صندوق لكل جزء"
  lead: >-
    ارسموا صندوقًا لكل جزء من أجزاء النسبة، وصفًا من الصناديق لكل طرف في
    القسمة. عدّوا الصناديق كلها، وأوجدوا ما يحويه الصندوق الواحد، ثم املؤوا
    الحصص. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - رسم صندوق لكل جزء
    - إيجاد ما يحويه الصندوق الواحد
    - ملء الحصص، والتحقق من المجموع
  # The key under the steps: what a tile of the drawings means.
  legend:
    one: جزء واحد وما يحويه
    spoken: الأجزاء التي تتحدث عنها المسألة

examples:
  - title: الفطر
    question: >-
      يجمع مازن وليلى معًا 45 حبة فطر. ومقابل كل 4 حبات يجمعها مازن، تجمع ليلى
      5 حبات. كم حبة فطر تجمع ليلى؟
    steps:
      - 4 إلى 5 تعني 4 أجزاء لمازن و5 لليلى، أي 9 أجزاء متساوية في المجموع.
      - "الجزء الواحد هو 45 : 9 = 5 حبات فطر."
      - "لليلى 5 أجزاء: 5 × 5 = 25 حبة فطر. التحقق: لمازن 20، و20 + 25 = 45."
    answer: 25 حبة فطر.
    note:
      title: "لماذا ليس 45 : 5؟"
      text: >-
        45 : 5 = 9 هي قسمة على عدد ليلى وحده. أما 45 حبة فطر فهي كل الأجزاء،
        وعددها 9: أجزاء مازن وليلى معًا.
    art:
      max: م
      lena: ل
      together: 45 حبة فطر معًا
      max-name: مازن
      lena-name: ليلى
      nine: 9 صناديق، 45 حبة فطر
      each: "45 : 9 = 5 في كل صندوق"
      only-lena: ليلى وحدها
  - title: الجوقة
    question: >-
      في جوقة، مقابل كل 4 أولاد 7 بنات، وعدد البنات يزيد على عدد الأولاد بمقدار
      9. كم طفلًا يغني في الجوقة؟
    steps:
      - >-
        الأولاد 4 أجزاء والبنات 7 أجزاء، إذن تزيد البنات على الأولاد بمقدار 3
        أجزاء.
      - "وهذه الأجزاء، وهي 3، تقابل 9 بنات زائدات: إذن الجزء الواحد 9 : 3 = 3 أطفال."
      - >-
        الجوقة 4 + 7 = 11 جزءًا: 11 × 3 = 33 طفلًا. التحقق: 12 ولدًا و21 بنتًا،
        والبنات أكثر بمقدار 9.
    answer: 33 طفلًا.
    note:
      title: أي الأجزاء تساوي 9؟
      text: >-
        العدد 9 لا يقابل أجزاء البنات، وهي 7، بل يقابل 3 أجزاء تزيد بها البنات
        على الأولاد. وقسمة 9 على 7 أو على 11 لا تعطي عددًا صحيحًا من الأطفال.
    art:
      boys: الأولاد
      girls: البنات
      nine: 9 بنات
      choir: 11 صندوقًا × 3 = 33
      this-nine: هذه 9
  - title: صندوقان
    question: >-
      في صندوقين كرات زجاجية بنسبة 3 إلى 1. وبعد نقل 10 كرات من الصندوق الأول
      إلى الثاني، صار في كل صندوق العدد نفسه من الكرات. كم كرة في المجموع؟
    steps:
      - >-
        نقل الكرات من صندوق إلى آخر لا يغيّر المجموع: فهو نفسه قبل النقل وبعده.
      - >-
        قبل النقل، المجموع 4 أجزاء، وفي الصندوق الأول 3 منها. وبعد النقل يصير
        فيه نصف المجموع، أي 2 من 4 أجزاء بالحجم نفسه. إذن خرج منه 1 جزء.
      - >-
        وهذا الجزء هو 10 كرات نُقلت: إذن المجموع 4 × 10 = 40. التحقق: 30 و10
        قبل النقل، و20 و20 بعده.
    answer: 40 كرة.
    note:
      title: ما لا يتغير
      text: >-
        كثيرًا ما تخفي مسائل النسب شيئًا يبقى ثابتًا، وهو هنا المجموع. وقياس
        النسبتين بأجزاء من المجموع نفسه هو ما يجعل المقارنة بينهما ممكنة.
    art:
      box-a: صندوق أ
      box-b: صندوق ب
      four: 4 أجزاء في المجموع، قبل النقل وبعده
      before: قبل
      after: بعد
      part: 1 جزء

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ratio_total_confusion:
    shows: >-
      يُؤخذ عددا النسبة على أنهما حصتان من المجموع: فتُقرأ 4 إلى 5 على أنها 4
      من 5، أو تُقسم 45 حبة فطر على 5 بدل قسمتها على 4 + 5 = 9 أجزاء.
    say: «كم جزءًا متساويًا في المجموع؟»
    art:
      question: 45 حبة فطر، 4 إلى 5
      one: في الجزء الواحد
  wrong_operation:
    shows: >-
      الجمع حيث تتطلب النسبة الضرب: فإذا زاد عدد الأشخاص بمقدار 6، أُضيفت إلى
      الوصفة 6 بيضات، مع أن البيض يجب أن يزيد بالتناسب مع عدد الأشخاص.
    say: «إذا تضاعف عدد الأشخاص، فماذا يحدث للبيض؟»
    art:
      question: 3 بيضات مقابل 2 شخصين، وكم مقابل 8؟
  answered_other_question:
    shows: >-
      تُحسب حصة، لكن الإجابة تأتي بحصة غير المطلوبة: فطر مازن بدل فطر ليلى، أو
      جزء واحد، أي 3 أطفال، بدل الجوقة كلها.
    say: «حصة من يطلبها السؤال؟»
    art:
      question: كم حبة فطر تجمع ليلى؟
      max: م
      lena: ل

home:
  - title: الطبخ وفق نسبة
    text: >-
      حضّروا معًا مشروبًا أو عجينة وفق نسبة: كوب من العصير مقابل ثلاثة أكواب من
      الماء. ثم حضّروا ضعف الكمية، ولاحظوا ما الذي يتضاعف.
  - title: صناديق على الورق
    text: >-
      في أي تقسيم في البيت، للحلوى أو للأعمال المنزلية، ارسموا صندوقًا لكل جزء
      واملؤوا الصناديق. فالصناديق تتولى التفكير.
  - title: الخرائط والمجسمات
    text: >-
      انظروا إلى مقياس الرسم في خريطة أو في مجسم سيارة: 1 إلى 50 يعني أن كل
      سنتيمتر يمثل 50. قيسوا معًا شيئًا ما، ثم كبّروه وفق المقياس.

# What a parent can write in the chat to get a task on this topic.
ask: أعطني مسألة في موضوع «النسب والتقسيم»
