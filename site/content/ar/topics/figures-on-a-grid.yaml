# The page of the topic of figures on a square grid, for a parent, in Arabic.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: أشكال على ورق المربعات
description: ما هي مسائل المساحة والمحيط في أشكال على ورق المربعات، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    ارسموا شكلًا على ورق المربعات: كم مربعًا يغطي، وما طول حافته؟ في هذه
    المسائل تُقاس المساحة بالمربعات والمحيط بأضلاع المربعات، ومن السهل الخلط
    بينهما: فقد يفقد المستطيل مربع إحدى زواياه ويبقى محيطه كما هو. والمهارة
    كلها في العدّ دون إغفال شيء ودون حساب شيء مرتين.
  method: عدّ الأضلاع الخارجية لكل مربع
  teaches: التمييز بين المساحة والمحيط، وعدّ المربعات والأضلاع دون إغفال أي منها أو تكراره
  # The words of its drawing: the figure over it, what each of its two copies
  # counts, and what the numbers in the cells mean.
  art:
    line: شكل من ثلاثة مربعات
    area: المساحة 3 مربعات
    perimeter: المحيط 8 أضلاع
    out: "الأعداد في الشكل الأيمن: كم ضلعًا لكل مربع يطل على الخارج، 3 + 2 + 3 = 8"

basis:
  title: قواعد الشبكة
  cards:
    - title: المساحة مربعات
      text: >-
        مساحة الشكل على ورق المربعات هي عدد المربعات التي يغطيها. ونصفا مربع
        يكوّنان مربعًا كاملًا.
      art:
        cells: 3 مربعات
    - title: المحيط أضلاع
      text: >-
        المحيط هو عدد أضلاع المربعات على حافة الشكل. والضلع المشترك بين مربعين
        من الشكل يقع في الداخل، فلا يُحسب.
      art:
        shared: الضلع المشترك في الداخل لا يُحسب
    - title: شيئان مختلفان
      text: >-
        قد يكون لشكلين لهما المساحة نفسها محيطان مختلفان: أربعة مربعات في صف
        محيطها 10، وأربعة مربعات على هيئة مربع محيطها 8.
      art:
        perimeter: المحيط {count}

idea:
  title: عدّ الأضلاع الخارجية
  lead: لكل مربع 4 أضلاع. ولا يُحسب الضلع في المحيط إلا إذا لم يكن على جانبه الآخر مربع من الشكل.
  table:
    head:
      - الشكل
      - المساحة بالمربعات
      - المحيط بالأضلاع
    rows:
      - - 1 مربع
        - "1"
        - "4"
      - - 2 مربعان متجاوران
        - "2"
        - 4 + 4 − 2 = 6
      - - 4 مربعات في صف
        - "4"
        - "10"
      - - مربع 2 في 2
        - "4"
        - "8"
  note:
    title: لماذا هذا مهم
    text: >-
      كثيرًا ما يعدّ الأطفال المربعات عند حساب المحيط، أو كل أضلاع كل المربعات،
      فتُحسب الأضلاع المشتركة مرتين. وعدّ الأضلاع المطلة على الخارج وحدها يحل
      المشكلتين معًا.

method:
  title: "طريقة الحل: تتبّع الحافة"
  lead: >-
    ارسموا الشكل على ورق المربعات. للمساحة، عدّوا المربعات صفًا بعد صف.
    وللمحيط، تتبّعوا الحافة وعدّوا أضلاع المربعات التي تمرّون بها. وعندما يُقص
    الشكل، اكتبوا القطع بترتيب لا يُغفل أي قطعة ولا يحسب قطعة مرتين. تتدرّج
    الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - رسم الشكل على ورق المربعات
    - عدّ المربعات للمساحة، والأضلاع الخارجية للمحيط
    - التحقق بطريقة عدّ ثانية
  # The key under the steps: what the drawings' lines and numbers mean.
  legend:
    border: الحافة، أي المحيط
    cut: خط القص
    count: "عدد: كم ضلعًا يطل على الخارج"

examples:
  - title: علامة الجمع
    question: >-
      يتكوّن شكل على هيئة علامة الجمع من 5 مربعات: مربع في الوسط، ومربع على كل
      جانب من جوانبه الأربعة. ما محيط الشكل بأضلاع المربعات؟
    steps:
      - الأذرع 4، ولكل منها 3 أضلاع تطل على الخارج، إذن تعطي الأذرع 4 × 3 = 12 ضلعًا.
      - وليس للمربع الأوسط أي ضلع في الخارج، لأن كل ضلع من أضلاعه يلامس ذراعًا.
      - إذن المحيط 12 ضلعًا من أضلاع المربعات.
    answer: 12 ضلعًا من أضلاع المربعات.
    note:
      title: طريقة أخرى للعدّ
      text: >-
        في 5 مربعات 5 × 4 = 20 ضلعًا. وبين الوسط والأذرع 4 أضلاع، حُسب كل منها
        مرتين، مرة من كل مربع، وهي في الداخل: 20 − 2 × 4 = 12.
    art:
      ends: 4 أطراف، لكل منها 3 أضلاع
      middle: للوسط 0
      border: الحافة 12 ضلعًا
      inner: بالأحمر 4 أضلاع داخلية
  - title: شريط إلى نصفين
    question: >-
      يُقص شريط من 2 في 4 مربعات على خطوط الشبكة إلى قطعتين، في كل منهما 4
      مربعات، ويجب أن تبقى كل قطعة متصلة. بكم طريقة مختلفة يمكن قصه؟
    steps:
      - "القص المستقيم بالطول عبر المنتصف يعطي صفين من 4: 1 طريقة."
      - "القص المستقيم بالعرض عبر المنتصف يعطي مربعين 2 في 2: 1 طريقة."
      - >-
        القص الذي يسير بالعرض، ثم بالطول، ثم بالعرض يعطي قطعتين على شكل زاوية،
        ودرجته يمكن أن تتجه إلى جهة أو إلى الأخرى: 2 طريقتان. وفي المجموع 4 طرق.
    answer: 4 طرق.
    note:
      title: لماذا ليس 8؟
      text: >-
        عند كتابة القطع واحدة بعد أخرى، تظهر كل طريقة قص مرتين، مرة لكل قطعة من
        قطعتيها. أما الاتفاق على أن القطعة الأولى هي التي تضم المربع العلوي
        الأيسر فيجعل كل طريقة قص تُحسب مرة واحدة.
    art:
      along: بالطول
      across: بالعرض
      step: درجة سلم
      back: بالعكس
      same: طريقة القص نفسها
      dot: "النقطة في المربع العلوي الأيسر، وهو دائمًا في الجزء الأزرق"
  - title: قطر
    question: >-
      رُسم على ورق المربعات مستطيل من 3 في 5 مربعات، ورُسم خط من إحدى زواياه
      إلى الزاوية المقابلة. كم مربعًا يمر به الخط؟ يُحسب المربع إذا عبر الخط
      داخله، لا إذا لمس زاويته فقط.
    steps:
      - >-
        في طريقه من زاوية إلى زاوية، يدخل الخط مربعًا جديدًا كلما عبر خطًا من
        خطوط الشبكة داخل المستطيل.
      - >-
        يعبر 4 خطوط في اتجاه و2 في الاتجاه الآخر، ولا يعبر خطين معًا أبدًا:
        فليس للعددين 3 و5 قاسم مشترك غير 1، لذلك لا يمر الخط في طريقه بأي نقطة
        تقاطع من نقاط الشبكة.
      - يبدأ الخط في 1 مربع، ثم يدخل 4 + 2 = 6 مربعات أخرى، أي 7 مربعات في المجموع.
    answer: 7 مربعات.
    note:
      title: عبر نقطة تقاطع
      text: >-
        في مستطيل من 4 في 6 مربعات يمر الخط بنقطة تقاطع في الشبكة، حيث يعبر
        خطين معًا ويدخل مربعًا واحدًا لا مربعين. فيمر عبر 4 + 6 − 2 = 8 مربعات:
        فالعدد 2 هو أكبر عدد يقبل كل من 4 و6 القسمة عليه.
    art:
      points: "النقاط: حيث يعبر القطر خطوط الشبكة"
      down: 4 خطوط عمودية
      across: 2 خطان أفقيان
      green: 1 + 4 + 2 = 7 مربعات خضراء
      node: "النقطة الحمراء نقطة تقاطع: 8 مربعات"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      يُحسب الشيء نفسه مرتين: تُضاف الأضلاع المشتركة بين المربعات إلى المحيط،
      أو تُكتب كل طريقة لقص الشريط مرتين، مرة لكل قطعة من قطعتيها.
    say: «هل حُسب أي ضلع، أو أي قص، من الجهتين؟»
    art:
      question: محيط مربعين متجاورين
  missed_case:
    shows: >-
      تُغفل حالة: قص درجته في الاتجاه الآخر، أو جزء من الحافة في زاوية داخلية،
      أو قطع الدومينو العمودية إلى جانب الأفقية.
    say: «هل هناك طريقة لم نجربها بعد، بالعكس مثلًا؟»
    art:
      question: طرق قص شريط 2 في 4
  ignored_condition:
    shows: >-
      يضيع أحد الشروط: تُحسب قطعة متفككة قطعة واحدة، أو يُعدّ مربع لا يلامس
      غيره إلا بزاويته مربعًا مجاورًا، أو يُقال إن الخط يمر عبر مربع لا يفعل
      سوى لمسه.
    say: «هل هذه القطعة، أو هذا المربع، يطابق فعلًا ما يقوله نص المسألة؟»
    art:
      question: كل جزء قطعة واحدة
      broken: الجزء الأزرق تفكك
      whole: الجزءان متصلان

home:
  - title: ورق المربعات
    text: >-
      احتفظوا بورق المربعات في متناول اليد، وارسموا معًا أشكالًا من 4 أو 5
      مربعات. أيها حافته الأطول؟ وأيها حافته الأقصر؟
  - title: تتبّع الحافة
    text: >-
      عدّوا المحيط بتمرير الإصبع على الحافة، ضلعًا بعد ضلع. ثم عدّوا الأضلاع
      الخارجية لكل مربع، وتحققوا من تطابق العددين.
  - title: القص والعدّ
    text: >-
      قصّوا شريطًا من الورق إلى قطعتين متساويتين في الحجم بأكبر عدد ممكن من
      الطرق. ورتّبوها بحيث لا تُغفل أي طريقة ولا تتكرر.

# What a parent can write in the chat to get a task on this topic.
ask: أعطني مسألة في موضوع «أشكال على ورق المربعات»
