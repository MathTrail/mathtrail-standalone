title: قابلية القسمة والبواقي
description: ما هي مسائل قابلية القسمة والبواقي، من قواعد قابلية القسمة إلى باقي القسمة، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    يذهب 29 تلميذًا في رحلة، وتقلّ كل سيارة 4 منهم. كم سيارة تلزم؟ في هذه
    المسائل تُجرى القسمة مع الباقي، ثم يُحدَّد معنى هذا الباقي: سيارة إضافية،
    أو قطعة حلوى متبقية، أو مكان في الصف التالي. وقواعد قابلية القسمة تجيب عن
    السؤال «هل يقبل القسمة؟» من دون أي قسمة.
  method: كتابة العدد في صورة مجموعات كاملة وما يتبقى
  teaches: فهم الباقي بكلمات المسألة نفسها، واختبار قابلية القسمة دون قسمة
  # The words of its drawing: what it divides over it, and what the division
  # comes to under it.
  art:
    line: 14 شيئًا في مجموعات من 3
    groups: 4 مجموعات كاملة ويتبقى 2

basis:
  title: قواعد القسمة
  cards:
    - title: الباقي أصغر من المقسوم عليه
      text: >-
        عند القسمة على 7، يكون الباقي 0 أو 1 أو 2، وهكذا حتى 6. وإذا خرج 7 أو
        أكثر، فهناك متسع لمجموعة أخرى.
      art:
        remainders: "البواقي عند القسمة على 7: من 0 إلى 6"
    - title: معنى الباقي
      text: >-
        إذا ركب 29 تلميذًا سيارات في كل منها 4 مقاعد، امتلأت 7 سيارات وبقي 1
        تلميذ، لذلك يلزم 8 سيارات. ويمكن أن يُسأل عن 7 أو 8 أو 1 من القسمة
        نفسها: فالسؤال هو الذي يحدد.
      art:
        cars: 29 = 7 × 4 + 1، إذن يلزم 8 سيارات
    - title: قواعد سريعة
      text: >-
        يقبل العدد القسمة على 2 إذا كان رقمه الأخير زوجيًا، وعلى 5 إذا كان رقمه
        الأخير 0 أو 5، وعلى 3 أو على 9 إذا قبل مجموع أرقامه القسمة على العدد
        نفسه.
      # The rules on its drawing, the digits each looks at in bold.
      art:
        by-two: على 2
        even: "الرقم الأخير زوجي: 13**6**"
        by-five: على 5
        five: "الرقم الأخير 0 أو 5: 24**5**"
        by-three: على 3 و9
        digits: "مجموع أرقامه: 3 + 8 + 1 + 6 = **18**"

idea:
  title: المجموعات وما يتبقى
  lead: يمكن كتابة كل عدد صحيح في صورة مجموعات كاملة وما يتبقى. والسؤال هو الذي يحدد أيهما المطلوب.
  table:
    head:
      - السؤال
      - القسمة · المطلوب بالأزرق
      - الإجابة
    rows:
      - - كم سيارة ذات 4 مقاعد تلزم 29 تلميذًا؟
        - 29 = 7 × 4 + 1
        - 8 سيارات
      - - "تُقسم 29 قطعة حلوى على 4 أطفال: كم قطعة لكل واحد؟"
        - 29 = 7 × 4 + 1
        - 7 قطع لكل واحد
      - - كم قطعة تتبقى من 29 قطعة حلوى؟
        - 29 = 7 × 4 + 1
        - 1 قطعة حلوى
  note:
    title: لماذا هذا مهم
    text: >-
      القسمة واحدة في كل صفوف الجدول؛ ولا يتغير إلا المعنى. فحتى مع قسمة صحيحة،
      قد يُذكر عدد المجموعات الكاملة بينما يسأل السؤال عن الباقي، أو تُنسى
      السيارة التي يحتاجها التلميذ الأخير.

method:
  title: "طريقة الحل: إيجاد المجموعات الكاملة والباقي"
  lead: >-
    اكتبوا العدد في صورة مجموعات كاملة وما يتبقى. ثم اقرؤوا السؤال مرة أخرى
    وحدّدوا ما يطلبه: المجموعات، أم الباقي، أم مجموعة إضافية. وإذا كان المطلوب
    أصغر عدد أو الرقم الذي له خاصية ما، فجرّبوا الاحتمالات بالترتيب. تتدرّج
    الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - التقسيم إلى مجموعات كاملة وما يتبقى
    - تحديد ما يطلبه السؤال
    - مطابقة الإجابة لنص المسألة
  # The key under the steps: what the drawings' groups mean.
  legend:
    group: مجموعة كاملة
    rest: الباقي

examples:
  - title: حافلات لرحلة
    question: >-
      يذهب 150 تلميذًا في رحلة مدرسية، وفي كل حافلة 40 مقعدًا. كم حافلة تلزم؟
    steps:
      - "نعدّ التلاميذ 40 في كل مرة: 150 = 3 × 40 + 30. ثلاث حافلات ممتلئة، ويتبقى 30 تلميذًا."
      - والتلاميذ المتبقون، وعددهم 30، يحتاجون أيضًا إلى حافلة، حتى لو لم تمتلئ.
      - 3 + 1 = 4 حافلات.
    answer: 4 حافلات.
    note:
      title: لماذا ليس 3 أو 30؟
      text: >-
        3 هو عدد الحافلات الممتلئة، و30 هو عدد التلاميذ في الحافلة الأخيرة.
        والسؤال عن كل الحافلات اللازمة.
    art:
      seats: 40 مقعدًا
      pupils: 150 تلميذًا
      left: الباقون
      part: 30 من 40 مقعدًا
      full: ممتلئة
      last: في الأخيرة
      all: كل الحافلات
  - title: النجمة في 38*6
    question: >-
      أي رقم يجب أن يوضع مكان النجمة في 38*6 لكي يقبل العدد القسمة على 9 دون أن
      يتبقى شيء؟
    steps:
      - يقبل العدد القسمة على 9 إذا وفقط إذا قبل مجموع أرقامه القسمة عليه.
      - >-
        مجموع الأرقام المعروفة 3 + 8 + 6 = 17، والنجمة رقم من 0 إلى 9، إذن
        المجموع بين 17 و26.
      - "العدد الوحيد من 17 إلى 26 الذي يقبل القسمة على 9 هو 18، إذن النجمة هي 1: 3816 = 9 × 424."
    answer: الرقم 1.
    note:
      title: وماذا عن 3؟
      text: >-
        في حالة القسمة على 3، يجب أن يقبل المجموع القسمة على 3: والأعداد 18 و21
        و24 كلها كذلك، إذن قد تكون النجمة 1 أو 4 أو 7. أما قاعدة 9 فأشد صرامة،
        وهنا لا تترك إلا رقمًا واحدًا.
    art:
      sum: هل يقبل مجموع الأرقام القسمة على 9؟
  - title: مئة عامل كلها اثنان
    question: >-
      ضُربت مئة عامل، كلها اثنان، بعضها في بعض: 2 × 2 × 2 × … × 2. ما آخر رقم
      في الناتج؟
    steps:
      - >-
        نراقب الرقم الأخير ونحن نضرب العوامل واحدًا بعد آخر: 2، 4، 8، 16، 32،
        64، 128، 256. فالأرقام الأخيرة هي 2، 4، 8، 6، ثم تتكرر.
      - >-
        طول النمط 4، و100 = 25 × 4: فالعامل المئة يختم الدورة رقم 25 من النمط،
        في المكان رقم 4 منها.
      - المكان رقم 4 في النمط يشغله الرقم 6، إذن ينتهي الناتج بالرقم 6.
    answer: "6."
    note:
      title: البواقي المتخفية
      text: >-
        لم يكن مهمًا إلا باقي قسمة 100 على 4: فهو الذي حدد أين يقع العامل المئة
        في النمط. والبواقي تجيب عن أسئلة كثيرة عن الأشياء التي تتكرر: الأرقام
        الأخيرة، وأيام الأسبوع، والأماكن في دائرة.
    art:
      first: بالأزرق، الدورة الأولى من النمط
      rounds: 25 دورة من 4 عوامل = 100 عامل
      place: "الباقي 0: المكان الأخير في الدورة، رقم 4"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  remainder_vs_quotient:
    shows: >-
      تتبادل المجموعات الكاملة والباقي مكانيهما: يُذكر عدد التلاميذ المتبقين، 30،
      بينما يسأل السؤال عن الحافلات، أو يُؤخذ 25، عدد الدورات الكاملة للنمط، على
      أنه المكان فيه.
    say: «هل السؤال عن المجموعات الكاملة أم عن الباقي؟»
    art:
      question: كم حافلة تلزم؟
      left: التلاميذ المتبقون
      buses: حافلات
  off_by_one:
    shows: >-
      تخطئ الإجابة بمجموعة واحدة: تُنسى حافلة آخر 30 تلميذًا، فتصبح الإجابة 3
      بدلًا من 4، أو تُعدّ الأماكن في النمط بدءًا من 0 بدلًا من 1.
    say: «هل يحتاج الباقي إلى مجموعة إضافية؟»
    art:
      question: 150 تلميذًا، 40 مقعدًا في كل حافلة
  missed_case:
    shows: >-
      يُعثر على حالة واحدة فيتوقف البحث: النجمة هي 1، ولا يُتحقق مما إذا كان 4
      و7 يصلحان أيضًا حين يكون السؤال عن القسمة على 3.
    say: «هل جرّبنا كل الأرقام من 0 إلى 9؟»
    art:
      question: 38*6 يقبل القسمة على 3
      more: وهل هذا كل شيء؟

home:
  - title: التقسيم مع الباقي
    text: >-
      قسّموا قطع الحلوى أو البطاقات على أفراد العائلة، وقولوا النتيجة في جزأين:
      كم يأخذ كل فرد، وكم يتبقى.
  - title: اختبار الأرقام
    text: >-
      اخترعوا أعدادًا كبيرة واختبروا قابليتها للقسمة على 3 وعلى 9 بجمع أرقامها،
      ثم اقسموها بالآلة الحاسبة لتروا القاعدة وهي تعمل.
  - title: أشياء تتكرر
    text: >-
      ابحثوا عن أنماط تدور وتعود: أيام الأسبوع، وألوان حبات القلادة، والأرقام
      الأخيرة للأعداد 3، 9، 27، 81. واسألوا عما يأتي بعد 50 خطوة.

