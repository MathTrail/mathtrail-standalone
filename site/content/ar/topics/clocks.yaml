# The page of the topic of clocks, for a parent, in Arabic. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: الساعات
description: ما هي مسائل الساعات والزمن المنقضي، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words the page's drawings write a length of time in.
art:
  minutes: "{count} د"
  hours: "{count} س"
  both: "{hours} س {minutes} د"

hero:
  lead: >-
    تبدأ نزهة في الساعة 4:50 وتستمر 25 دقيقة: فمتى تنتهي؟ في مسائل الزمن المنقضي
    هذه يُضاف الوقت ويُطرح، والصعوبة أن الساعة 60 دقيقة لا 100. ومعظم الأخطاء
    تقع عند تجاوز الساعة التامة، أو منتصف النهار، أو منتصف الليل.
  method: الوصول إلى الساعة التامة، ثم المتابعة
  teaches: حساب الوقت عبر الساعة التامة وعبر منتصف الليل، والتمييز بين الوقت الذي تشير إليه الساعة والمدة الزمنية
  # The words of its drawing: the walk over it, and what its line of time
  # shows under it.
  art:
    line: نزهة من الساعة 4:50، مدتها 25 دقيقة
    whole: إلى الساعة التامة أولًا، ثم المتابعة

basis:
  title: قواعد الساعة
  cards:
    - title: الساعة 60 دقيقة
      text: >-
        لا 100. لذلك 8:50 مع 20 دقيقة أخرى هي 9:10، لا 8:70، و110 دقائق هي 1
        ساعة و50 دقيقة، لا 1 ساعة و10.
    - title: عبر الساعة التامة
      text: >-
        لإضافة وقت يعبر حدود الساعة، تقدّموا أولًا حتى الساعة التامة، ثم أضيفوا
        الباقي بعدها: من 8:50 تمر 10 دقائق حتى 9:00، ثم 10 أخرى.
    - title: اليوم 24 ساعة
      text: >-
        بعد 23:59 تأتي 0:00 من اليوم التالي. ومن 22:00 إلى 6:00 تمر 2 ساعتان حتى
        منتصف الليل، ثم 6 ساعات بعده.
      art:
        midnight: "0:00 هي منتصف الليل، بداية اليوم التالي"

idea:
  title: عبر الساعة التامة
  lead: كم يمر من الوقت من لحظة إلى أخرى؟ توقفوا في الطريق عند الساعة التامة، فهذا يحوّل عملية طرح صعبة واحدة إلى خطوتين سهلتين.
  table:
    head:
      - من وإلى
      - عبر الساعة التامة
      - المدة
    rows:
      - - من 8:40 إلى 9:15
        - 20 د + 15 د
        - 35 د
      - - من 10:50 إلى 12:30
        - 10 د + 1 س 30 د
        - 1 س 40 د
      - - من 22:30 إلى 6:00
        - 1 س 30 د + 6 س
        - 7 س 30 د
  note:
    title: لماذا هذا مهم
    text: >-
      طرح وقت من آخر عموديًا، 9:15 − 8:40، يغري بمعاملة الساعة كأنها 100 دقيقة
      بدلًا من 60. أما العدّ إلى الأمام عبر الساعة التامة فلا يقود إلى ذلك
      أبدًا.

method:
  title: "طريقة الحل: رسم خط الزمن"
  lead: >-
    ارسموا خطًا وضعوا عليه الأوقات بالترتيب، الأبكر على اليسار. تقدّموا حتى
    الساعة التامة، ثم بساعات تامة، ثم أضيفوا الدقائق الباقية. تتدرّج الأمثلة
    أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - وضع الأوقات على خط، الأبكر أولًا
    - الوصول إلى الساعة التامة، ثم المتابعة
    - جمع الخطوات، والتحقق من أن الإجابة قبل البداية أو بعدها كما ينبغي
  # The key under the steps: what the drawings' boxes and arrows mean.
  legend:
    whole: ساعة تامة
    lasts: المدة

examples:
  - title: درس السباحة
    question: >-
      يبدأ درس سباحة تامر في الساعة 3:45 ويستمر 40 دقيقة. في أي ساعة ينتهي؟
    steps:
      - "من 3:45 إلى الساعة التامة، 4:00، تمر 15 دقيقة."
      - "بعد 4:00 تبقى 40 − 15 = 25 دقيقة."
      - "4:00 مع 25 دقيقة أخرى هي 4:25."
    answer: في الساعة 4:25.
    note:
      title: لماذا ليس 3:85؟
      text: >-
        45 + 40 = 85، لكن لا توجد على وجه الساعة 85 دقيقة: فعند 60 تبدأ ساعة
        جديدة. والتقدم أولًا حتى الساعة التامة لا يعطي وقتًا كهذا أبدًا.
    art:
      start: بداية الدرس، ومدته 40 دقيقة
      split: 40 دقيقة = 15 حتى 4:00 + 25 بعدها
      never: لا وقت كهذا
      right: صحيح
  - title: بطولة الشطرنج
    question: >-
      في بطولة شطرنج 5 جولات. تستمر كل جولة 50 دقيقة، وبين كل جولتين استراحة
      مدتها 15 دقيقة. تبدأ الجولة الأولى في الساعة 10:00. في أي ساعة تنتهي
      الجولة الأخيرة؟
    steps:
      - "5 جولات، كل منها 50 دقيقة: 5 × 50 = 250 دقيقة من اللعب."
      - >-
        الاستراحات بين الجولات فقط، لذلك عددها 4 لا 5:
        4 × 15 = 60 دقيقة.
      - >-
        250 + 60 = 310 دقائق، أي 5 ساعات و10 دقائق. والساعة 10:00 مع 5 ساعات
        و10 دقائق أخرى هي 15:10.
    answer: في الساعة 15:10.
    note:
      title: لماذا ليس 13:10؟
      text: >-
        310 دقائق ليست 3 ساعات و10 دقائق: فالساعة 60 دقيقة، لا 100.
        310 = 5 × 60 + 10.
    art:
      round: جولة، 50 د
      break: استراحة، 15 د
      rounds: 5 × 50 = 250 دقيقة
      breaks: "الاستراحات أقل من الجولات بواحدة: 4 × 15 = 60"
      total: 310 د = 5 × 60 + 10
      hours: 5 ساعات من 60 دقيقة، و10 دقائق أخرى
  - title: مدينتان
    question: >-
      تسافر الجدة بالطائرة لزيارة أمل التي تعيش في مدينة أخرى. تقلع الطائرة في
      الساعة 8:00 حسب ساعات مدينة الجدة، وتهبط في الساعة 8:30 حسب ساعات مدينة
      أمل. والساعات في مدينة أمل تتأخر 4 ساعات عن الساعات في مدينة الجدة. كم
      تستغرق الرحلة؟
    steps:
      - >-
        الوقتان 8:00 و8:30 يُقرآن على ساعتين مختلفتين، لذلك ننقل الوقتين أولًا
        إلى ساعة واحدة: ساعة الجدة.
      - "حين تشير الساعات في مدينة أمل إلى 8:30، تكون ساعات الجدة متقدمة عليها 4 ساعات: 12:30."
      - "من 8:00 إلى 12:30 على ساعة واحدة تمر 4 ساعات و30 دقيقة."
    answer: 4 ساعات و30 دقيقة.
    badge: "4:30"
    note:
      title: نصف ساعة؟
      text: >-
        8:30 − 8:00 تساوي نصف ساعة فقط حين يكون الوقتان على ساعة واحدة. أما
        أوقات مدينتين فتُقارن بعد نقل أحد الوقتين إلى ساعة المدينة الأخرى.
    art:
      take-off: الإقلاع، بتوقيت الجدة
      landing: الهبوط، بتوقيت أمل
      grandma-clock: ساعة الجدة
      ann-clock: ساعة أمل
      at-ann: بتوقيت أمل
      at-grandma: بتوقيت الجدة
      grandma: الجدة
      ann: أمل
      other: ساعتان مختلفتان

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_operation:
    shows: >-
      تُجرى عملية لا يطلبها السؤال: يُجمع وقتان على الساعة كأنهما كميتان، فتصبح
      الساعة 3 والساعة 5 معًا 8، أو يُلجأ إلى الضرب حيث يكفي العدّ إلى الأمام.
      الوقت على الساعة نقطة على خط، لا كمية.
    say: «هل هذا وقت على الساعة أم مدة من الزمن؟»
    art:
      question: "من 3:00 إلى 5:00: كم المدة؟"
  time_unit_mixup:
    shows: >-
      تُحسب الدقائق كأن الساعة فيها 100 دقيقة: فتصبح 3:45 مع 40 دقيقة أخرى
      3:85، أو تصبح 310 دقائق 3 ساعات و10 دقائق.
    say: «كم دقيقة في الساعة؟»
    art:
      question: "3:45 مع 40 دقيقة أخرى"
  reversed_relation:
    shows: >-
      يتبادل «قبل» و«بعد» مكانيهما: يُعدّ إلى الوراء بينما يتجه السؤال إلى
      الأمام، أو يُضاف فرق في التوقيت كان يجب طرحه، فتهبط الطائرة قبل أن تقلع.
    say: «هل يجب أن تكون الإجابة قبل البداية أم بعدها؟»
    art:
      question: الإقلاع في الساعة 8:00 على ساعة الجدة
      before: الهبوط قبل الإقلاع؟

home:
  - title: ساعة ذات عقربين
    text: >-
      ضعوا ساعة ذات عقربين على مرأى من الطفل، واسألوا بين حين وآخر: كم ستكون
      الساعة بعد ربع ساعة؟ وكم كانت قبل عشرين دقيقة؟
  - title: كم بقي من الوقت؟
    text: >-
      قبل مشاهدة رسوم متحركة أو الخروج في نزهة، خمّنوا معًا كم بقي من وقت
      الانتظار، ثم تحققوا على الساعة. فالانتظار الحقيقي يعطي للدقائق وزنًا.
  - title: خطة اليوم
    text: >-
      اكتبوا خطة يوم عطلة مع أوقاتها: نزهة من 11:30 إلى 12:15، والغداء في
      12:30. كم تستغرق كل فقرة، وكم من الوقت بين الفقرتين؟

# What a parent can write in the chat to get a task on this topic.
ask: أعطني مسألة في موضوع «الساعات»
