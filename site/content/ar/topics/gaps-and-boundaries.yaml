# The page of the topic of gaps and boundaries, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: الفواصل والحدود
description: ما هي مسائل الفواصل والحدود، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    ست أشجار في صف: كم فاصلًا بينها؟ جذع من خمس قطع: كم نشرة؟ في هذه المسائل
    يكون العدّ إما للأشياء وإما للفواصل بينها، والعددان يختلفان بواحد. ومن هذا
    الواحد تأتي معظم الإجابات الخاطئة، وما يصححه هو رسم سريع لحالة صغيرة.
  method: رسم حالة صغيرة والعدّ عليها
  teaches: التمييز بين الأشياء والفواصل بينها، والتحقق من القاعدة على رسم
  # The words of its drawing: the fence and the rule over it, and the two
  # counts under it.
  art:
    line: أربعة أعمدة سياج
    rule: نعدّ الأعمدة، ثم الفواصل بينها
    posts: "**4** أعمدة"
    spans: "**3** فواصل"

basis:
  title: قواعد الفواصل
  cards:
    - title: في الصف، أقل بواحد
      text: >-
        الفواصل تقع بين الأشياء، لذلك يكون عدد الفواصل في الصف دائمًا أقل بواحد
        من عدد الأشياء: ست أشجار، خمسة فواصل؛ خمس قطع من جذع، أربع نشرات.
      art:
        trees: 6 أشجار، 5 فواصل
    - title: في الدائرة، العدد نفسه
      text: >-
        عندما ينغلق الصف ليصبح دائرة، كالشجيرات حول حوض الزهور، يصبح بين الأخير
        والأول فاصل: فيكون عدد الفواصل مساويًا لعدد الأشياء.
      art:
        bushes: 8 شجيرات، 8 فواصل
    - title: الطرفان يُحسبان
      text: >-
        من الصفحة 3 إلى الصفحة 7 هناك 7 − 3 = 4 خطوات، لكن 5 صفحات، لأن الصفحة
        الأولى تُقرأ أيضًا. والعدّ «من … إلى …» مع الطرفين يضيف واحدًا.
      art:
        steps: 4 خطوات
        pages: 4 خطوات، لكن 5 صفحات

idea:
  title: أشياء أم فواصل؟
  lead: كل سؤال يعدّ واحدًا من الاثنين. ويختلف العدّ في الصف والدائرة والمدى «من … إلى …»، ورسم صغير يبيّن كيف.
  table:
    head:
      - الرسم
      - ما يُعدّ
      - كم
    rows:
      - - 6 أشجار في صف
        - الفواصل بينها
        - 6 − 1 = 5
      - - جذع من 5 قطع
        - النشرات
        - 5 − 1 = 4
      - - 8 شجيرات حول حوض زهور
        - الفواصل بينها
        - "8"
      - - الصفحات من 3 إلى 7
        - الصفحات المقروءة
        - 7 − 3 + 1 = 5
  note:
    title: لماذا هذا مهم
    text: >-
      الإجابة التي تخطئ بواحد تبدو صحيحة تقريبًا، لذلك قلّما تلفت انتباه الطفل.
      وعمودان أو ثلاثة أعمدة مرسومة على الورق تبيّن فورًا هل يجب إضافة واحد، أو
      طرح واحد، أو لا هذا ولا ذاك.

method:
  title: "طريقة الحل: رسم حالة صغيرة"
  lead: >-
    ارسموا الأشياء نقاطًا أو أعمدة، أولًا لعدد صغير، اثنين أو ثلاثة. عدّوا
    الفواصل على الرسم، واستخرجوا القاعدة، ولا تطبّقوها على أعداد المسألة إلا
    بعد ذلك. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - رسم الأشياء والفواصل
    - معرفة أيهما يعدّه السؤال
    - الحساب، والتحقق من القاعدة على حالة صغيرة
  # The key under the steps: what the drawings' blue and red mean.
  legend:
    counted: "بالأزرق: ما يُعدّ"
    cut: خط النشر

examples:
  - title: خط الحافلة
    question: >-
      على خط الحافلة 6 محطات. تستغرق الحافلة 3 دقائق من كل محطة إلى التي تليها.
      كم دقيقة تستغرق من المحطة الأولى إلى الأخيرة؟
    steps:
      - نرسم 6 محطات على شكل نقاط. تسير الحافلة على الفواصل بينها.
      - بين 6 محطات 5 فواصل، أي أقل بواحد من عدد المحطات.
      - "كل فاصل يستغرق 3 دقائق: 5 × 3 = 15."
    answer: 15 دقيقة.
    note:
      title: لماذا ليس 18؟
      text: >-
        الحساب 6 × 3 = 18 يعطي كل محطة فاصلًا خاصًا بها، لكن الحافلة لا تذهب إلى
        أي مكان بعد المحطة الأخيرة: فالدقائق تُقضى بين المحطات.
    art:
      stops: 6 محطات، 3 دقائق بين كل محطتين
      minutes: "{count} د"
      total: 5 × 3 = 15 دقيقة
      end: لا طريق بعد المحطة 6
  - title: الطابق 9 والطابق 3
    question: >-
      تسكن ليلى في الطابق 9، ومريم في الطابق 3 من المبنى نفسه، وكلتاهما تصعد
      على الدرج من الطابق 1. والسلالم بين الطوابق كلها متماثلة. كم ضعفًا يبلغ
      عدد الدرجات التي تصعدها ليلى مقارنة بمريم؟
    steps:
      - >-
        تصعد مريم من الطابق 1 إلى الطابق 3: 2 من السلالم، من 1 إلى 2 ومن 2
        إلى 3.
      - >-
        وتصعد ليلى من الطابق 1 إلى الطابق 9، أي 8 سلالم، وهذا أقل بواحد من رقم
        طابقها.
      - "السلالم كلها متماثلة، إذن 8 : 2 = 4. فتصعد ليلى 4 أضعاف درجات مريم."
    answer: 4 أضعاف.
    note:
      title: لماذا ليست 3 أضعاف؟
      text: >-
        القسمة 9 : 3 = 3 تقسم الطوابق، لكن الدرجات على السلالم بين الطوابق، ولا
        أحد يصعد إلى الطابق 1.
    art:
      masha: م
      lena: ل
      third: الطابق 3
      ninth: الطابق 9
      from: كلتاهما تصعد من الطابق 1
      masha-name: مريم
      lena-name: ليلى
      two: سلّمان
      eight: سلالم
      times: 8 سلالم لليلى، أي 4 أضعاف 2 لمريم
      floors: الطوابق
      flights: السلالم
  - title: كم جذعًا؟
    question: >-
      نشر حطّابون عددًا من الجذوع، ونُشر كل جذع مرة واحدة على الأقل. ونشروا 9
      نشرات في المجموع، فحصلوا على 14 قطعة. كم جذعًا نشروا؟
    steps:
      - >-
        ننشر جذعًا واحدًا: 1 نشرة تعطي 2 قطعتين، و2 نشرتان تعطيان 3 قطع. وفي
        النهاية يكون عدد قطع كل جذع أكثر بواحد من عدد نشراته.
      - نجمع ذلك على كل الجذوع. فالقطع هي النشرات، وقطعة زائدة لكل جذع.
      - 14 − 9 = 5. إذن كانت هناك 5 جذوع.
    answer: 5 جذوع.
    note:
      title: هل يهم كيف وُزّعت النشرات؟
      text: >-
        لا. خمسة جذوع مع 9 نشرات تعطي 14 قطعة، سواء أخذ جذع واحد معظم النشرات أم
        وُزّعت بالتساوي تقريبًا: فكل نشرة تحوّل قطعة واحدة إلى قطعتين.
    art:
      cuts: 9 نشرات
      pieces: 14 قطعة
      logs: "الجذوع: ؟"
      one: 1 نشرة، 2 قطعتان
      two: 2 نشرتان، 3 قطع
      sum: "القطع = النشرات + الجذوع: 9 = 6 + 3"
      all: 9 نشرات · 14 قطعة · 5 جذوع

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      تُعدّ المحطات بدل الفواصل بينها، أو الفواصل بدل الأعمدة: فتصبح 6 محطات
      6 × 3 = 18 دقيقة. والإجابة فيها خطأ بواحد، لذلك تبدو صحيحة تقريبًا.
    say: «لنرسم ثلاث محطات. كم فاصلًا بينها؟»
  wrong_operation:
    shows: >-
      إجراء عملية على أعداد المسألة لا يطلبها الرسم: جمعها، 6 + 3، أو مضاعفة
      أحدها، بدل عدّ الفواصل وإعطاء كل فاصل دقائقه.
    say: «كم يستغرق فاصل واحد، وكم فاصلًا هناك؟»
  number_from_text:
    shows: >-
      يصبح عدد من نص المسألة هو الإجابة: 6 محطات حين يسأل السؤال عن الدقائق، أو
      الطابق 9 حين يسأل عن السلالم.
    say: "«ماذا يعدّ هذا العدد: المحطات أم الفواصل؟»"
    art:
      question: "السؤال: كم دقيقة؟"
      stops: محطات
      minutes: دقيقة

home:
  - title: الأصابع والفواصل
    text: >-
      افردوا أصابع اليد: خمسة أصابع، وأربعة فواصل بينها. وهذه أسرع صورة للموضوع
      كله، وهي دائمًا في متناول اليد.
  - title: الدرج في طريق العودة إلى البيت
    text: >-
      على الدرج، عدّوا معًا الطوابق والسلالم: من الطابق 1 إلى الطابق 4، كم
      سلّمًا؟ ومن الطابق 2 إلى الطابق 4؟
  - title: أعمدة ومقاعد
    text: >-
      في أثناء النزهة، عدّوا أعمدة سياج والفواصل بينها، أو المقاعد حول بركة. في
      الصف يكون عدد الفواصل أقل بواحد؛ وفي الدائرة يكون مساويًا.

