title: "عدّ الأشكال"
description: "ما هي مسائل عدّ الأشكال وألغاز أعواد الثقاب، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت."
hero:
  lead: "في رسم من خطوط قليلة مثلثات ومربعات أكثر مما يظهر أول الأمر: صغيرة، وكبيرة مكوّنة من عدة قطع. تطلب هذه المسائل عدّها كلها، أو معرفة أعواد الثقاب التي تُزال ليتغيّر الشكل. والمهارة كلها في العدّ حسب الحجم، بدءًا بالأصغر."
  method: "العدّ حسب الحجم، من الأصغر إلى الأكبر"
  teaches: "أن يُعدّ كل شكل مرة واحدة، دون إغفال أو تكرار"
  art:
    count: "4 مربعات صغيرة و1 كبير: 5"
basis:
  title: "ما الذي يُعدّ شكلًا"
  cards:
    - title: "الكبيرة تُعدّ أيضًا"
      text: "في مربع من 2 في 2 مربعات صغيرة 4 مربعات صغيرة ومربع كبير واحد حولها. والشكل المكوّن من عدة قطع يُعدّ أيضًا."
      art:
        count: "4 + 1 = 5 مربعات"
    - title: "الأضلاع على الخطوط"
      text: "لا يُعدّ المثلث إلا إذا كان كل ضلع من أضلاعه على خط من خطوط الرسم. خطان من زاوية إلى زاوية يصنعان في المربع 8 مثلثات."
      art:
        count: "4 صغيرة و4 من قطعتين: 8"
    - title: "عود الثقاب ضلع واحد"
      text: "حين يتلامس مربعان من أعواد الثقاب يشتركان في عود واحد. صف من 3 مربعات يحتاج إلى 10 أعواد لا 12."
      art:
        count: "3 + 3 + 4 = 10 أعواد"
idea:
  title: "العدّ حجمًا بعد حجم"
  lead: "رتّبوا الأشكال حسب حجمها: الأصغر أولًا، ثم المكوّنة من قطعتين، ثم الأكبر، واجمعوا الأعداد."
  table:
    head:
      - "الرسم"
      - "الأصغر"
      - "الأكبر"
      - "المجموع"
    rows:
      - - "مربع من 2 في 2 مربعات"
        - "4"
        - "1"
        - "5"
      - - "مربع من 3 في 3 مربعات"
        - "9"
        - "4 + 1"
        - "14"
      - - "مستطيل من 2 في 3 مربعات"
        - "6"
        - "2"
        - "8"
  note:
    title: "لماذا يهم هذا"
    text: "كثيرًا ما يعدّ الأطفال الأشكال الصغيرة وحدها، أو يعدّون الكبير مرتين من قطعتين من قطعه. والعدّ حجمًا بعد حجم، مع كتابة كل حجم، يحلّ الأمرين."
method:
  title: "طريقة الحل: من الأصغر إلى الأكبر"
  lead: "سمّوا كل حجم من الأشكال يمكن أن يحويه الرسم، وعدّوا كل حجم وحده، ثم اجمعوا. وفي أعواد الثقاب، اسألوا: كل عود ضلعٌ لأي المربعات؟ تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد."
  steps:
    - "إيجاد الأشكال الأصغر وعدّها"
    - "عدّ الأشكال من كل حجم أكبر بالترتيب"
    - "الجمع والتأكد من عدم إغفال أي حجم"
examples:
  - title: "خطان من الرأس"
    question: "من الزاوية العليا لمثلث ينزل خطان إلى قاعدته. كم مثلثًا في الرسم؟"
    steps:
      - "يقسم الخطان المثلث إلى 3 مثلثات صغيرة."
      - "كل مثلثين صغيرين متجاورين يصنعان مثلثًا: وهناك زوجان من هذا النوع."
      - "المثلث كله واحد آخر. المجموع 3 + 2 + 1 = 6."
    answer: "6 مثلثات."
    note:
      title: "تحقق سريع"
      text: "لكل مثلث هنا رأس في الزاوية وقاعدة على الخط السفلي. على هذا الخط 4 نقاط، وكل نقطتين منها تصنعان قاعدة: 6 أزواج."
    art:
      count: "3 + 2 + 1 = 6"
  - title: "مربع من 3 في 3"
    question: "رُسم مربع من 3 في 3 مربعات بكل خطوطه. كم مربعًا من أي حجم فيه؟"
    steps:
      - "مربعات من مربع واحد: 3 صفوف في كل منها 3، أي 9."
      - "المربعات من 2 في 2 تتسع في صفين من مكانين، أي 4."
      - "المربع كله من 3 في 3 واحد آخر. المجموع 9 + 4 + 1 = 14."
    answer: "14 مربعًا."
    note:
      title: "ليست 9"
      text: "العدد 9 يعدّ المربعات الصغيرة وحدها. والمربع المكوّن من عدة مربعات صغيرة مربع أيضًا."
    art:
      sizes: "9 من مربع واحد، 4 من 2 في 2، 1 من 3 في 3"
  - title: "أعواد تُزال"
    question: "12 عود ثقاب تصنع مربعًا من 2 في 2 مربعات. ما أقل عدد من الأعواد يجب إزالته حتى لا يبقى أي مربع من أي حجم؟"
    steps:
      - "هناك 5 مربعات: 4 صغيرة والكبير."
      - "العود ضلع لمربعين على الأكثر، فعودان يكسران 4 مربعات على الأكثر، ويبقى مربع."
      - "العودان الداخليان القائمان يكسران المربعات الصغيرة الأربعة، وعود واحد من الأعلى يكسر الكبير: 3 أعواد."
    answer: "3 أعواد."
    note:
      title: "لماذا ليس 2"
      text: "كل عود يكسر مربعًا أو مربعين، والمطلوب كسر 5، فعودان لا يكفيان."
    art:
      taken: "الأعواد المتقطعة تُزال"
traps:
  missed_case:
    shows: "يُغفل حجم من الأشكال: المربع الكبير حول الصغيرة، أو المثلثات المكوّنة من قطعتين."
    say: "«هل هناك شكل أكبر مكوّن من عدة قطع؟»"
  double_count:
    shows: "يُعدّ شكل مرتين، من قطعتين من قطعه، أو يُعدّ عود مشترك لمربعيه كليهما."
    say: "«هل عُدّ هذا الشكل من قبل؟»"
  stopped_early:
    shows: "يتوقف العدّ عند الأشكال الأصغر، أو عند أول جواب يبدو صحيحًا."
    say: "«هل هناك أشكال من حجم آخر؟»"
home:
  - title: "ورق المربعات"
    text: "ارسموا معًا مربعًا من 2 في 2 مربعات وعدّوا مربعاته. ثم جرّبوا 3 في 3."
  - title: "أعواد الثقاب"
    text: "صفّوا صفًا من المربعات بأعواد الثقاب أو العيدان. كم عودًا يلزم لـ4 مربعات؟ ولـ5؟"
  - title: "حجمًا بعد حجم"
    text: "عند العدّ، سمّوا كل حجم بصوت عالٍ: الصغيرة، ثم المكوّنة من قطعتين، ثم الأكبر. اكتبوا الأعداد واجمعوها."
ask: "أعطني مسألة في موضوع «عدّ الأشكال»"
