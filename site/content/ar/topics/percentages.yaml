title: النسب المئوية
description: ما هي مسائل النسب المئوية، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    ينخفض سعر بنسبة 20%، ثم بنسبة 20% مرة أخرى. فهل انخفض بنسبة 40%؟ في هذه
    المسائل يكون الواحد بالمئة جزءًا من مئة من شيء ما، والصعوبة كلها في هذا
    الشيء: السعر القديم أم الجديد، الطيور كلها أم الدجاجات وحدها. وطرح السؤال
    «نسبة مئوية من ماذا؟» قبل كل خطوة يجنّب معظم الأخطاء.
  method: طرح السؤال «نسبة مئوية من ماذا؟» قبل كل خطوة
  teaches: تحديد ما تُحسب منه النسبة المئوية، وملاحظة متى يتغير
  # The words of its drawing: the whole it is drawn for.
  art:
    line: 50 هي 100%

basis:
  title: قواعد النسب المئوية
  cards:
    - title: جزء من مئة
      text: >-
        الواحد بالمئة جزء من مئة من الكمية. و100% هي الكمية كلها، و50% نصفها.
      art:
        half: النصف هو 50%
    - title: نسبة مئوية من ماذا؟
      text: >-
        النسبة المئوية دائمًا من شيء ما: من السعر القديم أو الجديد، من الضيوف كلهم
        أو من البنات وحدهن. ونسبة 10% نفسها من كميات مختلفة تعطي أعدادًا مختلفة.
      art:
        tens: نسبة 10% من 200 = 20 · نسبة 10% من 50 = 5
    - title: العشرة بالمئة أولًا
      text: >-
        نسبة 10% هي الكمية مقسومة على 10. ومنها تُحسب نسبة 20% أو 30% أو 5% بخطوة
        واحدة: مثلًا، 30% من 80 هي 3 × 8 = 24.
      art:
        eighty: 80 هي عشرة أجزاء، كل منها 8

idea:
  title: الأساس يتغير
  lead: كل نسبة مئوية تُحسب من الكمية في تلك اللحظة. وعندما يتغير السعر مرتين، يُحسب التغيير الثاني من السعر الجديد.
  table:
    head:
      - الخطوة
      - تُحسب من
      - السعر بعدها
    rows:
      - - خصم 20%
        - 200، فالخصم 40
        - "160"
      - - خصم 20% مرة أخرى
        - 160، فالخصم 32
        - "128"
      - - الخصمان معًا
        - 200، فالخصم 72
        - خصم 36%، لا 40%
  note:
    title: لماذا هذا مهم
    text: >-
      المتاجر والمصارف والأخبار تتحدث بالنسب المئوية، والصعوبة دائمًا في معرفة
      ممّ تُحسب. وعادة السؤال «نسبة مئوية من ماذا؟» تهيّئ للأولمبياد وللمتجر على
      حد سواء.

method:
  title: "طريقة الحل: تحديد المئة بالمئة"
  lead: >-
    قبل كل خطوة، حدّدوا أي كمية هي 100%. أوجدوا منها 1% أو 10%، ثم النسبة التي
    تحتاج إليها المسألة. وعندما تتغير الكمية، ابدؤوا من جديد، والكمية الجديدة
    هي 100%. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - تحديد ما يمثّل 100%
    - إيجاد 1% أو 10% منه
    - أخذ النسبة المطلوبة، والتحقق من الكمية التي تُحسب منها
  # The key under the steps: what a grid of the drawings stands for.
  legend:
    hundred: شبكة من 100 مربع هي 100%

examples:
  - title: الأندية الرياضية
    question: >-
      في مدرسة 300 تلميذ، و35% منهم يرتادون الأندية الرياضية. كم تلميذًا لا يرتاد
      الأندية الرياضية؟
    steps:
      - "التلاميذ كلهم، أي 300 تلميذ، هم 100%، إذن 1% هي 300 : 100 = 3 تلاميذ."
      - ومن لا يرتادون الأندية هم 100% − 35% = 65% من التلاميذ.
      - و65% هي 65 × 3 = 195 تلميذًا.
    answer: 195 تلميذًا.
    note:
      title: الطريقة الأخرى
      text: >-
        نسبة 35% من 300 هي 35 × 3 = 105 تلاميذ يرتادون الأندية، و300 − 105 = 195.
        الطريقتان تعطيان الإجابة نفسها؛ وأخذ 65% مباشرة يوفّر خطوة.
    art:
      go: 35 مربعًا من 100 لمن يرتادون الأندية
      grid: الشبكة كلها 300 تلميذ
      cell: المربع الواحد 3 تلاميذ
      go-short: يرتادون
      do-not: لا يرتادون
  - title: سعر الدراجة
    question: >-
      سعر دراجة 400 قطعة نقدية. في الربيع يرتفع سعرها بنسبة 25%، وفي الخريف ينخفض
      السعر الجديد بنسبة 20%. كم سعر الدراجة الآن؟
    steps:
      - >-
        في الربيع تكون 100% هي السعر القديم، أي 400 قطعة نقدية: و25% منه 100 قطعة
        نقدية، إذن يصبح سعر الدراجة 500.
      - "وفي الخريف تكون 100% هي السعر الجديد، أي 500 قطعة نقدية: و20% منه 100 قطعة نقدية."
      - 500 − 100 = 400. سعر الدراجة 400 قطعة نقدية من جديد.
    answer: 400 قطعة نقدية.
    note:
      title: لماذا ليس 420؟
      text: >-
        الإجابة 420 تأتي من حساب نسبة الخريف، 20%، من السعر القديم، أي 80 قطعة
        نقدية. لكن السعر عند حلول الخريف كان 500، و20% من 500 هي 100.
    art:
      coins: قطعة نقدية، السعر قبل الربيع
      quarters: "400 هي 100%: أربعة أجزاء، كل منها 25%"
      five-hundred: 500 قطعة نقدية
      fifths: "500 هي 100%: خمسة أجزاء، كل منها 20%"
      of-old: نسبة 20% من 400 = 80 →
      of-new: نسبة 20% من 500 = 100 →
  - title: بطيخ يجفّ
    question: >-
      لدى مزارع 200 كيلوغرام من البطيخ، نسبة الماء فيه 99%. وبعد أسبوع جفّ
      قليلًا، فصارت نسبة الماء فيه 98%. كم يزن الآن؟
    steps:
      - >-
        ما لا يجفّ هو الجزء الذي ليس ماءً: 1% من 200 كيلوغرام، أي 2 كيلوغرامان.
        ويبقى هذا الجزء 2 كيلوغرامين.
      - >-
        وبعد أسبوع تصبح نسبة الماء 98%، إذن الجزء غير المائي، 2 كيلوغرامان، هو 2%
        من الوزن الجديد.
      - "النسبة 2% تساوي 2 كيلوغرامين، إذن 1% تساوي 1 كيلوغرام، و100% تساوي 100 كيلوغرام."
    answer: 100 كيلوغرام.
    note:
      title: نصف الوزن؟
      text: >-
        نعم. انخفضت نسبة الماء من 99% إلى 98% فقط، لكن نسبة الجزء غير المائي
        تضاعفت، من 1% إلى 2%. وبقي هذا الجزء 2 كيلوغرامين كما هو، فكان لا بد أن
        ينخفض الوزن كله إلى النصف.
    art:
      melons: 200 كغم، الماء فيه 99%
      dry: "200 كغم: المربع الواحد 1 كغم؛ والبرتقالية ليست ماءً، 2 كغم"
      same: الوزن نفسه، 2 كغم، صار الآن 2 من 100 مربع
      was: كان 200 كغم
      became: صار 100 كغم
      water: الماء 99%

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  percent_wrong_base:
    shows: >-
      تُحسب النسبة المئوية من الكمية الخطأ: نسبة الخريف، 20%، من السعر القديم بدل
      الجديد، أو نسبة 98% من الوزن القديم للبطيخ.
    say: «أي كمية هي 100% الآن؟»
    art:
      question: في الخريف السعر 500، والخصم 20%
      of-old: نسبة 20% من 400 =
      of-new: نسبة 20% من 500 =
  part_whole_swap:
    shows: >-
      يُؤخذ الجزء على أنه الكل، أو الكل على أنه جزء: يُقدَّم الجزء غير المائي، 2
      كيلوغرامان، على أنه وزن البطيخ، أو تُحسب المدرسة كلها حين يكون السؤال عن
      جزء منها.
    say: «هل هذا العدد جزء أم الكل؟»
    art:
      question: كم يزن البطيخ؟
      dry: 2 كغم
      only-dry: ما ليس ماءً فقط
      all: 100 كغم
      weight: الوزن كله
  answered_other_question:
    shows: >-
      يصبح عدد حُسب في أثناء الحل هو الإجابة: 105 تلاميذ يرتادون الأندية حين يكون
      السؤال عمّن لا يرتادونها، أو 100 قطعة نقدية تغيّر بها السعر بدل السعر نفسه.
    say: «ماذا يطلب السؤال بالضبط؟»
    art:
      question: كم تلميذًا لا يرتاد الأندية؟
      go: يرتادون
      do-not: لا يرتادون

home:
  - title: النسبة المئوية في المتجر
    text: >-
      في المتجر، ابحثوا عن سعر عليه خصم، واحسبوه معًا: كم يصبح 150 بعد خصم 20%؟
      ابدؤوا من 10%.
  - title: العشرة بالمئة أولًا
    text: >-
      تدرّبوا على إيجاد 10% من أي شيء: من 80، ومن 350، ومن 1200. فمن 10% تُحسب
      معظم النسب الأخرى بخطوة واحدة.
  - title: نسبة مئوية من ماذا؟
    text: >-
      عندما تسمعون نسبة مئوية في الأخبار أو في إعلان، اسألوا معًا: نسبة مئوية من
      ماذا؟ وكثيرًا ما لا يذكر ذلك أحد.

