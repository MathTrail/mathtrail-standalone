# The page of the topic of ordering, for a parent, in Arabic. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: الترتيب
description: ما هي مسائل الترتيب، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words every drawing of the page writes its four children in: the
# initial of each, and the name.
art:
  ann: أ
  ann-name: أمل
  ben: ب
  ben-name: باسم
  kate: ك
  kate-name: كوثر
  dan-name: داود
  taller: أطول

hero:
  lead: >-
    من الأطول، ومن الأكبر سنًا، ومن وصل أولًا؟ في هذه المسائل يجب جمع بضع
    مقارنات في ترتيب واحد: حسب الطول، أو العمر، أو المكان في طابور أو في
    سباق. وهذه عند كثير من الأطفال أول سلسلة استدلال، كل معلومة فيها حلقة، ولا
    يجوز إسقاط أي منها.
  method: رسم خط ووضع الجميع عليه
  teaches: ربط المعلومات في صورة واحدة، وقراءة المقارنة في الاتجاهين
  # The words of its drawing: the clues and the rule over it, and the line's
  # two ends in it.
  art:
    line: المعلومات
    clue-1: «أمل أطول من باسم»
    clue-2: «كوثر أقصر من باسم»
    clue-3: «داود أقصر من كوثر»
    rule: نضعهم على خط واحد
    top: الأطول
    bottom: الأقصر

basis:
  title: قواعد الخط
  cards:
    - title: كل معلومة سهم
      text: >-
        المعلومة «أمل أطول من باسم» تضع أمل قبل باسم على الخط. وأيًا كان ما
        تقارنه المعلومة، طولًا أو عمرًا أو مكانًا في سباق، فهي تقول من يأتي
        أولًا.
      art:
        clue: «أمل أطول من باسم»
    - title: القراءة في الاتجاهين
      text: >-
        المعلومة «باسم أقصر من أمل» تقول ما تقوله «أمل أطول من باسم». اقلبوا
        المعلومات بحيث تتجه كلها في اتجاه واحد قبل وضعها على الخط.
      art:
        clue: «أمل أطول من باسم»
        turned: «باسم أقصر من أمل»
    - title: السلسلة تمتد
      text: >-
        إذا كانت أمل أطول من باسم، وباسم أطول من كوثر، فأمل أطول من كوثر أيضًا،
        وإن لم تذكر ذلك أي معلومة.
      art:
        implied: أمل أطول من كوثر

idea:
  title: كل المعلومات في اتجاه واحد
  lead: ابنوا الخط معلومة تلو معلومة، بعد تحويل كل منها إلى صيغة «أطول من». وكل خطوة تضيف إلى الخط شخصًا جديدًا.
  table:
    head:
      - المعلومة
      - بصيغة «أطول من»
      - الخط حتى الآن
    rows:
      - - «أمل أطول من باسم»
        - أمل **أطول** من باسم
        - أمل > باسم
      - - «كوثر أقصر من باسم»
        - باسم **أطول** من كوثر
        - أمل > باسم > كوثر
      - - «داود أقصر من كوثر»
        - كوثر **أطول** من داود
        - أمل > باسم > كوثر > داود
  # The words of the drawings of the table: the note on a clue turned round.
  art:
    turned: مقلوبة
  note:
    title: لماذا هذا مهم
    text: >-
      معظم الأخطاء هنا سببها معلومة قُرئت من الطرف الخطأ: فُهمت «أقصر» على أنها
      «أطول»، و«بعد» على أنها «قبل». أما المعلومة التي قُلبت قبل وضعها على الخط
      فلا مجال للخطأ في قراءتها.

method:
  title: "طريقة الحل: رسم الخط"
  lead: >-
    ارسموا خطًا من الأطول إلى الأقصر، أو من الأول إلى الأخير، وضعوا عليه
    المعلومات واحدة تلو الأخرى، المؤكدة منها أولًا. ومن لا يمكن وضعه بعد ينتظر
    المعلومة التالية. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - جعل كل المعلومات في اتجاه واحد
    - وضع المعلومات على الخط، المؤكدة منها أولًا
    - قراءة الإجابة، ومطابقة كل معلومة معها
  # The key under the steps: what the drawings' rings and outlines mean.
  legend:
    added: "حلقة زرقاء: ما تضيفه هذه الخطوة"
    free: مكان ما زال شاغرًا
    block: "كتلة: اثنان متجاوران دائمًا"

examples:
  - title: ثلاثة قوارب
    question: >-
      تسابقت ثلاثة قوارب: أحمر وأزرق وأخضر. وصل القارب الأحمر بعد الأزرق. ووصل
      القارب الأخضر قبل الأزرق. أي القوارب فاز؟
    steps:
      - >-
        نقلب المعلومة الأولى: وصل القارب الأحمر بعد الأزرق، إذن وصل الأزرق قبل
        الأحمر.
      - >-
        على الخط، والأول على اليسار: الأزرق، ثم الأحمر. ووصل القارب الأخضر قبل
        الأزرق، إذن مكانه أمامهما كليهما: الأخضر، الأزرق، الأحمر.
      - >-
        الأول على الخط هو القارب الأخضر. التحقق: الأحمر بعد الأزرق، نعم؛ الأخضر
        قبل الأزرق، نعم.
    answer: فاز القارب الأخضر.
    badge: "1"
    art:
      red: أحمر
      blue: أزرق
      green: أخضر
      before: قبل
      waits: ينتظر
  - title: طابور المقصف
    question: >-
      يقف خمسة أطفال في طابور المقصف: ليلى ومازن وندى وعمر وطارق. تقف ندى في
      المكان الثالث. ويقف عمر خلف ندى مباشرة. ويقف مازن في مكان ما أمام ليلى،
      وليلى ليست الأخيرة. من يقف في آخر الطابور؟
    steps:
      - >-
        نكتب ما هو مؤكد: ندى في المكان الثالث، وعمر الذي يقف خلفها مباشرة في
        المكان الرابع. وتبقى الأماكن 1 و2 و5 لمازن وليلى وطارق.
      - >-
        ليلى ليست الأخيرة، إذن هي الأولى أو الثانية. ومازن يقف في مكان ما أمامها،
        فلا يمكن أن تكون الأولى: ليلى الثانية، ومازن الأول.
      - >-
        المكان الوحيد الباقي، الخامس، هو مكان طارق. نتحقق من كل معلومة: كلها
        صحيحة.
    answer: يقف طارق في آخر الطابور.
    badge: ط
    note:
      title: كل معلومة مهمة
      text: >-
        من دون «ليلى ليست الأخيرة» كان يمكن أن تقف ليلى في آخر الطابور أيضًا:
        فالمعلومة القصيرة التي فيها «ليست» هي التي تحسم الطابور.
    art:
      lena: ل
      lena-name: ليلى
      max: م
      max-name: مازن
      nina: ن
      nina-name: ندى
      oleg: ع
      oleg-name: عمر
      pavel: ط
      pavel-name: طارق
      wait: ينتظرون
      waits: ينتظر
      other: من دون تلك المعلومة، يصلح هذا الطابور أيضًا
  - title: ستة عدّائين
    question: >-
      أنهى ستة عدّائين سباقًا دون أي تعادل: أروى وبدر وجاد ودانة وسامي وفرح. وصل
      بدر بعد أروى مباشرة. ووصل جاد بعد دانة، لكن قبل أروى. ووصلت فرح قبل سامي
      مباشرة، ولم يكن سامي الأخير. ولم تكن دانة الأولى. من فاز؟
    steps:
      - >-
        نبحث عن الكتل: «بدر بعد أروى مباشرة» تعطي الكتلة أروى-بدر، و«فرح قبل
        سامي مباشرة» تعطي الكتلة فرح-سامي. وتأتي دانة، ثم جاد، ثم الكتلة
        أروى-بدر بهذا الترتيب.
      - >-
        لم تكن دانة الأولى، إذن وصل أحد قبلها. وجاد وأروى وبدر وصلوا كلهم بعد
        دانة: فلا يمكن أن يسبقها إلا فرح وسامي، وهما يأتيان معًا.
      - >-
        إذن تفتتح الكتلة فرح-سامي السباق: فرح، سامي، دانة، جاد، أروى، بدر.
        وسامي ليس الأخير، كما تقول المعلومة. وكل المعلومات صحيحة.
    answer: فازت فرح.
    badge: ف
    note:
      title: الكتل تتحرك معًا
      text: >-
        عندما تقول المعلومة «مباشرة بعد»، يبقى العدّاءان متجاورين أينما كانا.
        اعتبروهما كتلة واحدة، فبدل ستة عدّائين تبقى أربعة أشياء نرتّبها.
    art:
      ada: أ
      ada-name: أروى
      bob: ب
      bob-name: بدر
      cid: ج
      cid-name: جاد
      dot: د
      dot-name: دانة
      eli: س
      eli-name: سامي
      fay: ف
      fay-name: فرح
      blocks: الكتل
      order: الترتيب
      only: لا يشغل «؟» إلا هذان
      six: 6 عدّائين
      four: 4 كتل

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      استعمال معلومة وإغفال أخرى، وغالبًا ما تكون قصيرة فيها نفي، فيبقى على الخط
      مكان لإجابة خاطئة.
    say: «أي معلومة لم نستعملها بعد؟»
    art:
      question: أُغفلت المعلومة «ليلى ليست الأخيرة»
  reversed_relation:
    shows: >-
      تُوضع المعلومة «كوثر أقصر من باسم» على الخط كأن كوثر هي الأطول: تُقرأ
      المعلومة من الطرف الخطأ، فتخرج الإجابة معكوسة.
    say: «من الأطول إذن؟ لنقلب الجملة».
    art:
      clue: «كوثر أقصر من باسم»
  stopped_early:
    shows: >-
      الوصول إلى أن أحدهم أقصر من آخر والإجابة بذلك، مع أن السلسلة تمتد: باسم
      أقصر من أمل، لكن كوثر أقصر منه أيضًا.
    say: «هل يوجد أحد أبعد على الخط؟»
    art:
      clue-1: «باسم أقصر من أمل»
      clue-2: «كوثر أقصر من باسم»
      who: من الأقصر؟

home:
  - title: ترتيب العائلة في صف
    text: >-
      رتّبوا أفراد العائلة في البيت حسب الطول، ثم حسب العمر، وقولوا كل معلومة
      بصوت عالٍ: «الأب أطول من الأم، إذن يقف الأب أولًا».
  - title: الخط قبل الإجابة
    text: >-
      اطلبوا رسم الخط على الورق قبل الإجابة. فالرسم يكشف فورًا إن كانت هناك
      معلومة ناقصة أو مقلوبة في الاتجاه الخطأ.
  - title: قلب الجملة
    text: >-
      العبوا لعبة سريعة: تقولون «القط أصغر من الكلب»، وعلى الطفل قلبها: «الكلب
      أكبر من القط».

# What a parent can write in the chat to get a task on this topic.
ask: أعطني مسألة في موضوع «الترتيب»
