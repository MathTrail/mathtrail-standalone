title: الأجزاء والحصص
description: ما هي مسائل الأجزاء والحصص، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    أكل باسم ثلث بيتزا، وأكلت أمل نصف ما تبقّى منها. فمن أكل أكثر؟ في هذه
    المسائل يكون الكسر دائمًا كسرًا من شيء ما، ومعظم الصعوبة في معرفة ممّ
    يُؤخذ: من الكل أم مما تبقّى. وشريط من الورق مقسّم إلى أجزاء متساوية يبيّن
    ذلك أفضل من أي قاعدة.
  method: رسم الكل شريطًا وتقسيمه إلى أجزاء متساوية
  teaches: طرح السؤال «جزء من ماذا؟»، وإيجاد الكل من جزئه
  # The words of its drawing: the share over it, and what it comes to.
  art:
    line: 3/4 من 12
    sum: 3/4 من 12 = 9
    one: "12 : 4 = 3 في الجزء الواحد، و3 أجزاء تساوي 9"

basis:
  title: قواعد الأجزاء
  cards:
    - title: جزء من ماذا؟
      text: >-
        الكسر دائمًا كسر من شيء ما. فعبارتا «ربع الباقي» و«ربع الكل» تعنيان
        عددين مختلفين، لذا حدّدوا أولًا ما يُؤخذ منه الكسر.
      art:
        whole: ربع الكل
        rest: ربع الباقي
    - title: عن طريق الجزء الواحد
      text: >-
        لإيجاد 3/4 من 20، نقسم على 4 ونأخذ 3 أجزاء: 15. ولإيجاد الكل إذا كانت
        3/4 منه تساوي 15، نقسم على 3 لنحصل على الجزء الواحد، ثم نأخذ 4 أجزاء: 20.
    - title: الأجزاء تكوّن الكل
      text: >-
        ما أُعطي وما بقي يكوّنان معًا كلًّا واحدًا. فإذا أُعطي 1/3 و1/4، يبقى
        1 − 1/3 − 1/4 = 5/12.

idea:
  title: قيمة الجزء الواحد
  lead: مهما كان السؤال، أوجدوا أولًا قيمة الجزء الواحد، ثم خذوا من الأجزاء العدد الذي يحتاج إليه السؤال.
  table:
    head:
      - المعطيات
      - الشريط والجزء الواحد
      - المطلوب
    rows:
      - - 3/4 من 20
        - "20 : 4 = 5"
        - 3 أجزاء، 15
      - - 3/4 من عدد ما تساوي 15
        - "15 : 3 = 5"
        - العدد، 4 أجزاء، 20
      - - 2/5 من عدد ما تساوي 14
        - "14 : 2 = 7"
        - العدد، 5 أجزاء، 35
  note:
    title: لماذا هذا مهم
    text: >-
      معظم الأخطاء في الكسور ليست في الحساب بل في الكل: تُؤخذ الحصة من الكمية
      الخطأ. وتسمية الكل بصوت عالٍ قبل كل خطوة تكشف هذه الأخطاء.

method:
  title: "طريقة الحل: رسم شريط"
  lead: >-
    ارسموا الكل شريطًا طويلًا، وقسّموه إلى أجزاء متساوية بعدد مقام الكسر.
    وعندما تُؤخذ حصة مما تبقّى، ارسموا ما تبقّى شريطًا جديدًا. ثم أوجدوا قيمة
    الجزء الواحد. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - رسم الكل شريطًا
    - تقسيمه إلى أجزاء متساوية، وتقسيم الباقي أيضًا عند الحاجة
    - إيجاد الجزء الواحد، ثم الأجزاء التي يطلبها السؤال
  # The key under the steps: what the strips' colours mean.
  legend:
    given: ما أُعطي بالفعل
    sought: المطلوب

examples:
  - title: أرغفة في المخبز
    question: >-
      يخبز خبّاز 60 رغيفًا. يبيع نصفها حتى الظهر، وثلثي الباقي حتى المساء. كم
      رغيفًا يبقى؟
    steps:
      - نصف 60 رغيفًا هو 30، إذن يبقى بعد الظهر 30 رغيفًا.
      - >-
        ثلثا الباقي هما ثلثا 30، لا ثلثا 60: في المساء يُباع
        30 : 3 × 2 = 20 رغيفًا.
      - يبقى 30 − 20 = 10 أرغفة.
    answer: 10 أرغفة.
    note:
      title: ثلثا ماذا؟
      text: >-
        لو كان المقصود ثلثي الأرغفة كلها، وهي 60، لكان ذلك 40، و30 + 40 = 70
        رغيفًا، وهذا أكثر مما خبزه الخبّاز. أما «ثلثا الباقي» فحصة مما تبقّى في
        تلك اللحظة.
    art:
      rest: الباقي يصبح كلًّا جديدًا
      evening: في المساء يُباع 20
      all: حتى الظهر 30 · في المساء 20 · بقي 10
      over: 30 + 40 = 70، والأرغفة 60 فقط
  - title: أسباع الكتاب
    question: >-
      يقرأ تامر يوم الاثنين 2/7 من كتاب، ويوم الثلاثاء 3/7 منه. وبعد ذلك تبقى منه
      40 صفحة. كم صفحة في الكتاب؟
    steps:
      - في يومين يقرأ تامر 2/7 + 3/7 = 5/7 من الكتاب، إذن يبقى منه 2/7.
      - "هذا الجزء، 2/7، هو 40 صفحة: إذن سبع الكتاب 40 : 2 = 20 صفحة."
      - "والكتاب كله سبعة أسباع: 7 × 20 = 140 صفحة."
    answer: 140 صفحة.
    note:
      title: أي جزء هو 40؟
      text: >-
        الصفحات الباقية، وعددها 40، هي 2/7 من الكتاب، لا 5/7 التي قرأها تامر. ولو
        عُدّت هذه الصفحات 5/7، لكان في الكتاب 56 صفحة، ولكان الباقي منه 16 صفحة
        فقط.
    art:
      sevenths: الكتاب، 7 أجزاء متساوية
      monday: الاثنين
      tuesday: الثلاثاء
      read: 40 ليست ما قُرئ
  - title: بيض في السوق
    question: >-
      تبيع الجدة البيض في السوق. يأخذ المشتري الأول نصف بيضها ونصف بيضة أخرى.
      ويأخذ الثاني نصف البيض الباقي ونصف بيضة أخرى، وكذلك يفعل الثالث. وبهذا
      يُباع البيض كله، ولم يكسر أحد أي بيضة. كم بيضة كانت لدى الجدة؟
    steps:
      - >-
        نبدأ من النهاية. أخذ المشتري الثالث نصف البيض ونصف بيضة أخرى، فلم يبق
        شيء: إذن نصف البيض كان نصف بيضة، وكانت لدى الجدة 1 بيضة.
      - >-
        وقبل المشتري الثاني بالطريقة نفسها: أخذ نصف البيض ونصف بيضة أخرى فبقيت 1
        بيضة، إذن نصف البيض كان بيضة ونصفًا، وكان هناك 3 بيضات.
      - >-
        وقبل المشتري الأول كان نصف البيض ثلاث بيضات ونصفًا، إذن كان هناك 7.
        التحقق: 7 ← 3 ← 1 ← 0.
    answer: 7 بيضات.
    note:
      title: الحل عكسيًّا
      text: >-
        عندما تكون كل حصة جزءًا مما تبقّى، فأسهل نقطة للبدء هي النهاية: فهناك
        تكون الكمية معروفة. وكل خطوة إلى الوراء تلغي حصة واحدة: إضافة نصف
        البيضة، ثم المضاعفة.
    art:
      basket: كم بيضة في السلة؟
      third: "المشتري الثالث: كان هناك 1"
      third-took: أخذ 0.5 + ½ = 1، وبقي 0
      second: "المشتري الثاني: كان هناك 3"
      second-took: أخذ 1.5 + ½ = 2، وبقي 1
      first: "المشتري الأول: كان هناك 7"
      first-took: أخذ 3.5 + ½ = 4، وبقي 3
      back: "خطوة إلى الوراء: + ½، ثم × 2"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  part_whole_swap:
    shows: >-
      تُؤخذ الحصة من الكمية الخطأ: ثلثا الأرغفة كلها، وهي 60، بدل الباقية منها،
      وهي 30، أو يُظن أن الصفحات الباقية، وعددها 40، هي الجزء الذي قرأه تامر.
    say: «ثلثا ماذا؟ لنُشِر إليه على الشريط».
    art:
      question: ثلثا الباقي
      of-all: 2/3 من 60 =
      of-rest: 2/3 من 30 =
  answered_other_question:
    shows: >-
      يصبح عدد حُسب في أثناء الحل هو الإجابة: 20 رغيفًا بيعت في المساء بدل
      الأرغفة الباقية، أو 100 صفحة قرأها تامر بدل الكتاب كله.
    say: «ماذا يطلب السؤال بالضبط؟»
    art:
      question: كم رغيفًا يبقى؟
      evening: بيعت في المساء
      left: بقيت
  stopped_early:
    shows: >-
      يتوقف الحل قبل نهايته بخطوة: يُحسب سبع الكتاب، أي 20 صفحة، ولا يُستخدم
      أبدًا لإيجاد الكتاب كله؛ أو تُطرح الأرغفة المبيعة حتى الظهر وتُنسى أرغفة
      المساء.
    say: «هل هذه هي الإجابة، أم خطوة في الطريق إليها؟»
    art:
      question: كم صفحة في الكتاب؟

home:
  - title: التقطيع معًا
    text: >-
      قطّعوا تفاحة أو بيتزا أو ورقة إلى أجزاء متساوية، وسمّوا الأجزاء: أنصاف،
      أثلاث، أرباع. ثم أزيلوا بعضها، واسألوا عن الجزء الذي بقي.
  - title: جزء من ماذا؟
    text: >-
      عندما يظهر كسر في وصفة طبخ أو في لعبة، اسألوا: «ثلث ماذا؟». فالإجابة عن هذا
      السؤال كثيرًا ما تكون المسألة كلها.
  - title: الشريط
    text: >-
      ارسموا الشريط معًا عند أي تقسيم في البيت: مستطيل طويل مقسّم إلى خانات
      متساوية. وهو يصلح لكل مسائل هذا الموضوع.

