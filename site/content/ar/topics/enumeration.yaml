# The page of the topic of enumeration, for a parent, in Arabic. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: حصر الحالات
description: ما هي مسائل حصر الحالات ومبدأ العدّ، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words every drawing of the page writes its people in: the three
# children's letters, and Lea's and Tom's initials.
art:
  a: أ
  b: ب
  c: ج
  lea: ل
  tom: ت

hero:
  lead: >-
    كم عددًا يمكن كتابته بهذه الأرقام؟ وكم مصافحة، وكم طقمًا من الملابس، وكم
    طريقة للوقوف في صف؟ في مسائل العدّ هذه تُكتب الحالات كلها بترتيب يضمن ألا
    تضيع أي حالة ولا تُحسب حالة مرتين. والقائمة المكتوبة وفق قاعدة هي أول أداة
    في يد الطفل أمام أسئلة أكبر من أن تُخمَّن إجابتها.
  method: كتابة الحالات وفق قاعدة
  teaches: العمل بترتيب، ومعرفة متى يمكن عدّ الحالات دون كتابتها
  # The words of its drawing: the question and the rule over it, and the count
  # under it.
  art:
    line: كم عددًا من رقمين مختلفين يمكن تكوينه من 1 و2 و3؟
    rule: "نكتبها وفق قاعدة: الرقم الأول أولًا"
    count: 3 خيارات للرقم الأول × 2 للثاني = 6 أعداد

basis:
  title: قواعد القائمة
  cards:
    - title: بالترتيب
      text: >-
        رتّبوا الحالات قبل كتابتها: حسب الحرف الأول، ثم حسب الحرف الثاني. وفي
        القائمة المرتبة تترك الحالة الناقصة فراغًا واضحًا للعين.
      art:
        on: "{child} أولًا"
        # The case the listing lost: its two letters and a question mark, as the
        # language writes one.
        lost: "{first} {second}؟"
    - title: كل حالة مرة واحدة
      text: >-
        قبل العدّ، حدّدوا ما الذي يجعل حالتين مختلفتين. مصافحة لينا وتامر مصافحة
        واحدة، أما وقوف لينا قبل تامر ووقوف تامر قبل لينا فطابوران مختلفان.
      art:
        handshake: 1 مصافحة
        queues: 2 طابوران
    - title: الخيارات تُضرب
      text: >-
        عندما تتكوّن الحالة من خيارات يأتي أحدها بعد الآخر، فنجان ثم صحن، فالعدّ
        يكون بالضرب: من 3 فناجين و2 صحنين نحصل على 3 × 2 = 6 أطقم.
      art:
        sets: 3 × 2 = 6 أطقم

idea:
  title: هل الترتيب مهم؟
  lead: مع الأطفال الثلاثة أنفسهم، أ و ب و ج، تعطي الأسئلة المختلفة أعدادًا مختلفة.
  table:
    head:
      - السؤال
      - هل الترتيب مهم؟
      - الحالات
    rows:
      - - بكم طريقة يمكنهم الوقوف في صف؟
        - "نعم: «أ ب» و«ب أ» صفّان مختلفان"
        - "أ ب ج، أ ج ب، ب أ ج، ب ج أ، ج أ ب، ج ب أ: 6"
      - - كم ثنائيًا يمكن إرساله في مهمة؟
        - "لا: «أ ب» و«ب أ» ثنائي واحد"
        - "أ ب، أ ج، ب ج: 3"
      - - بكم طريقة يمكن اختيار قائد ومساعد؟
        - "نعم: القائد أولًا (أكبر حجمًا)"
        - "أ ب، أ ج، ب أ، ب ج، ج أ، ج ب: 6"
  note:
    title: لماذا هذا مهم
    text: >-
      معظم الإجابات الخاطئة هنا تحسب حالة واحدة مرتين، أو تعدّ حالتين مختلفتين
      حالة واحدة. وتحديد ما إذا كان الترتيب مهمًا، قبل كل شيء، يبيّن أي خطأ يجب
      الحذر منه.

method:
  title: "طريقة الحل: إنشاء قائمة وفق قاعدة"
  lead: >-
    ضعوا قاعدة أولًا: ما الذي يأتي أولًا في القائمة وما الذي يليه، ثم اكتبوا
    الحالات وفقها، أو عدّوها حين تكشف القاعدة عن نمط. تتدرّج الأمثلة أدناه من
    الأبسط إلى مستوى الأولمبياد.
  steps:
    - تحديد ما يجعل حالتين مختلفتين
    - كتابة الحالات وفق قاعدة
    - عدّها، أو الضرب عندما تأتي الخيارات واحدًا بعد الآخر
  # The key under the steps: what a frame on the drawings means.
  legend:
    frame: "إطار أزرق: ما تضيفه هذه الخطوة"

examples:
  - title: أعلام من شريطين
    question: >-
      للعلم شريطان، أحدهما فوق الآخر. كل شريط أحمر أو أصفر أو أخضر، ولونا
      الشريطين مختلفان. كم علمًا مختلفًا هناك؟
    steps:
      - >-
        نرتّب الأعلام حسب الشريط العلوي. إذا كان الأحمر في الأعلى، فالشريط
        السفلي أصفر أو أخضر: علمان.
      - >-
        وإذا كان الأصفر في الأعلى، فالسفلي أحمر أو أخضر: علمان آخران. وإذا كان
        الأخضر في الأعلى، فالسفلي أحمر أو أصفر: علمان آخران.
      - >-
        3 ألوان للشريط العلوي، وفي كل مرة يبقى 2 للسفلي:
        3 × 2 = 6 أعلام.
    answer: 6 أعلام.
    art:
      paints: ثلاثة ألوان، والشريطان بلونين مختلفين
      red-top: الأحمر في الأعلى
      red: أحمر
      yellow: أصفر
      green: أخضر
      top: العلوي ↓
      bottom: السفلي →
      same: "×: لا يجوز اللون نفسه مرتين، 9 − 3 = 6"
  - title: رقمان بينهما فرق ثلاثة
    question: كم عددًا من رقمين يختلف رقماه بمقدار 3، مثل 14 أو 30؟
    steps:
      - >-
        نمرّ على رقم العشرات من 1 إلى 9، ونكتب بجانبه كل رقم آحاد يبعد عنه 3:
        1 ← 4؛ 2 ← 5؛ 3 ← 0 و6؛ 4 ← 1 و7؛ وهكذا.
      - >-
        إذا كان رقم العشرات 3 أو 4 أو 5 أو 6، فلكل منها عددان: رقم آحاد أصغر
        بمقدار 3 وآخر أكبر بمقدار 3. وإذا كان 1 أو 2 أو 7 أو 8 أو 9، فعدد واحد
        فقط: لأن الآخر لن يكون رقمًا.
      - >-
        4 × 2 + 5 × 1 = 13 عددًا: 14، 25، 30، 36، 41، 47، 52، 58، 63، 69،
        74، 85، 96.
    answer: 13 عددًا.
    note:
      title: الحالة التي تضيع أكثر من غيرها
      text: >-
        العدد 30 هو الذي ينساه الأطفال: فالرقم 0 قد يأتي في آخر العدد، لكنه لا
        يأتي في أوله. والقائمة المكتوبة وفق قاعدة تجده، أما القائمة المكتوبة من
        الذاكرة فلا.
    art:
      given: الفرق بين العشرات والآحاد 3
      under: العشرات في الأعلى، وتحتها الآحاد المناسبة
      two: "بالأزرق: عددان لكل منها"
      can: مسموح
      not: ليس من رقمين
  - title: رقمان 2 لا يتجاوران
    question: >-
      كم عددًا من أربعة أرقام يمكن كتابته بالرقمين 1 و2 وحدهما، بحيث لا يتجاور
      رقمان 2؟
    steps:
      - >-
        عددها أكبر من أن يُخمَّن، لذلك نبنيها رقمًا بعد رقم. برقم واحد: 1 و2،
        عددان. برقمين: 11 و12 و21، ثلاثة أعداد، لأن 22 غير مسموح.
      - >-
        العدد المسموح ينتهي بالرقم 1 أو بالرقم 2. فإذا انتهى بالرقم 1، فهو أي
        عدد مسموح أقصر منه برقم واحد، مع إضافة 1 في آخره. وإذا انتهى بالرقم 2،
        فالرقم الذي قبله يجب أن يكون 1: فهو أي عدد مسموح أقصر منه برقمين، مع
        إضافة 12 في آخره. إذن كل نتيجة هي مجموع النتيجتين اللتين قبلها: للأعداد
        من ثلاثة أرقام 3 + 2 = 5، وللأعداد من أربعة أرقام 5 + 3 = 8.
      - >-
        نتحقق بكتابتها: 1111، 1112، 1121، 1211، 2111، 1212، 2112، 2121،
        ثمانية أعداد.
    answer: 8 أعداد.
    note:
      title: نتيجة تنمو
      text: >-
        تستمر النتائج 2، 3، 5، 8 هكذا: 13، 21، 34، وكل منها مجموع النتيجتين
        اللتين قبلها. ومسائل الأولمبياد تحب النتائج التي تُبنى من نتائج أصغر.
    art:
      twos: لا يجوز رقمان 2 متجاوران
      one: 1 رقم
      two: 2 رقمان
      three: 3 أرقام
      four: 4 أرقام

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  missed_case:
    shows: >-
      كتابة الحالات كما تخطر في البال، فتضيع إحداها، وغالبًا ما تكون حالة فيها
      0 أو حالة فيها رقم مكرر.
    say: «بأي ترتيب كُتبت؟ لنكتبها من جديد وفق قاعدة».
    art:
      question: فرق 3 بين الرقمين
  wrong_operation:
    shows: >-
      الجمع حيث يجب ضرب الخيارات، فمن 3 قمصان و2 وشاحين يخرج الناتج 5، أو
      الضرب حيث يُختار ثنائي، مع أن أحدًا لا يشكّل ثنائيًا مع نفسه.
    say: "«لنأخذ قميصًا واحدًا: كم طقمًا يكوّن؟ وكم قميصًا هناك؟»"
    art:
      question: 3 قمصان و2 وشاحان
  double_count:
    shows: >-
      مصافحة لينا لتامر ومصافحة تامر للينا تُحسبان مصافحتين، مع أنهما مصافحة
      واحدة.
    say: «هل هذه الحالة موجودة عندنا من قبل؟»

home:
  - title: إلباس دمية
    text: >-
      أعطوا طفلكم قبعتين وثلاثة أوشحة لدمية، واسألوا عن عدد الطرق لإلباسها. ثم
      اطلبوا قائمة بها، وتحققوا منها معًا.
  - title: السؤال عن القاعدة
    text: >-
      في أثناء كتابة طفلكم للحالات، اسألوا: «بأي ترتيب تُكتب الحالات؟». فالقائمة
      ذات القاعدة قائمة يمكن التحقق منها.
  - title: قفل برمز سري
    text: >-
      تخيّلوا قفلًا رمزه رقمان من بين 1 و2 و3، وعلى طفلكم إيجاد عدد الرموز التي
      سيضطر اللص إلى تجربتها.

# What a parent can write in the chat to get a task on this topic.
ask: أعطني مسألة في موضوع «حصر الحالات»
