title: "المكعبات والورق"
description: "ما هي مسائل شبكة المكعب وطيّ الورق، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت."
hero:
  lead: "شبكة مسطحة من ستة مربعات تُطوى فتصير مكعبًا؛ وورقة مطوية تُثقب مرة واحدة تنفتح بعدة ثقوب؛ وحجر نرد يتدحرج على صف يمكن معرفة العدد الذي في أعلاه. تُحلّ هذه المسائل بتخيّل الطيّ أو الدحرجة أو الفتح، خطوة بعد خطوة."
  method: "الطيّ أو الدحرجة أو الفتح، خطوة بعد خطوة"
  teaches: "أن يُرى كيف يصير الشكل المسطح مجسّمًا، وبالعكس"
  art:
    opposite: "1 و5 متقابلان"
basis:
  title: "قواعد الطيّ"
  cards:
    - title: "الوجهان المتقابلان لا يتلامسان"
      text: "في الشبكة، مربعان في صف واحد بينهما مربع واحد يصيران وجهين متقابلين في المكعب."
      art:
        opposite: "3 و6 متقابلان"
    - title: "الطيّة تضاعف الطبقات"
      text: "الورقة المطوية مرة واحدة فيها طبقتان حيث تضعها الطيّة، وإذا طُويت مرة أخرى فأربع. والثقب يخرق كل طبقة."
      art:
        holes: "طيّتان، 4 طبقات، 4 ثقوب"
    - title: "حجر النرد يعطي 7"
      text: "في حجر النرد مجموع العددين على وجهين متقابلين 7: 1 و6، 2 و5، 3 و4."
      art:
        bottom: "في الأعلى 2، في الأسفل 5"
idea:
  title: "خطوة بعد خطوة"
  lead: "اطووا أو دحرجوا أو افتحوا في الذهن خطوة بعد خطوة، ولاحظوا ما تفعله كل خطوة."
  table:
    head:
      - "ما يُفعل"
      - "ما يتغيّر"
    rows:
      - - "يُطوى مربع من الشبكة إلى أعلى"
        - "يصير الوجه التالي من المكعب"
      - - "تُطوى ورقة مرة واحدة"
        - "تتضاعف طبقاتها حيث تستقر"
      - - "يتدحرج حجر النرد على حرف واحد"
        - "يصعد وجه جانبي إلى الأعلى"
      - - "يتدحرج حجر النرد مرتين إلى الأمام"
        - "يصعد الوجه السفلي إلى الأعلى"
  note:
    title: "لماذا يهم هذا"
    text: "كثيرًا ما يخمّن الأطفال النتيجة كلها دفعة واحدة. كل خطوة سهلة، واتباعها واحدة واحدة لا يترك شيئًا للتخمين."
method:
  title: "طريقة الحل: طيّة بعد طيّة"
  lead: "سمّوا المربع أو الطيّة أو الدحرجة التي تأتي أولًا، وقولوا ما تفعله، ثم انتقلوا إلى التالية. وحيث أمكن، قصّوا شبكة من الورق أو استعملوا حجر نرد حقيقيًا للتحقق. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى الأولمبياد."
  steps:
    - "اختيار المربع أو الطيّة أو الدحرجة الأولى"
    - "قول ما تفعله بالأوجه أو الطبقات"
    - "المتابعة خطوة خطوة، ثم التحقق بالورق أو بحجر النرد"
examples:
  - title: "الوجه المقابل"
    question: "شبكة مكعب على شكل صليب: عمود من 4 مربعات مرقّمة 1 و2 و3 و4 من الأعلى، والمربعان 5 و6 على جانبي المربع 2. أي عدد يقابل 2 بعد الطيّ؟"
    steps:
      - "المربعان 1 و3 بجوار 2 في العمود، فهما يلامسانه."
      - "المربعان 5 و6 على جانبي 2، فهما يلامسانه أيضًا."
      - "المربع 4 تحت 2 بمربعين، وبينهما 3: فهو يقابل 2."
    answer: "العدد 4."
    note:
      title: "التحقق بالورق"
      text: "ارسموا الصليب على ورق المربعات، وقصّوه واطووه: يتقابل 2 و4."
    art:
      opposite: "2 و4 متقابلان"
  - title: "طيّتان وثقب"
    question: "طُويت ورقة مربعة من المنتصف، ثم من المنتصف مرة أخرى. ثُقبت الورقة المطوية ثقبًا واحدًا. كم ثقبًا فيها عند فتحها؟"
    steps:
      - "الطيّة الأولى تعطي طبقتين."
      - "الطيّة الثانية تضاعفهما: 4 طبقات."
      - "الثقب يخرق الطبقات الأربع، فالورقة المفتوحة فيها 4 ثقوب."
    answer: "4 ثقوب."
    note:
      title: "أين الثقوب"
      text: "تقع الثقوب في أرباع الورقة الأربعة، وكل ثقب صورة الثقب المجاور في المرآة عبر خط الطيّ."
    art:
      holes: "ثقب في كل ربع"
  - title: "حجر نرد يتدحرج"
    question: "حجر نرد في أعلاه 2. يتدحرج على حرفه مرتين إلى الأمام مباشرة. مجموع الوجهين المتقابلين في حجر النرد 7. أي عدد في الأعلى الآن؟"
    steps:
      - "الدحرجة الأولى ترفع الوجه الخلفي إلى الأعلى."
      - "الدحرجة الثانية ترفع الوجه الذي كان في الأسفل في البداية."
      - "كان في الأسفل العدد المقابل لـ2، أي 7 − 2 = 5."
    answer: "العدد 5."
    note:
      title: "بعد أربع دحرجات"
      text: "دحرجتان أخريان تعيدان 2 إلى الأعلى: في الدحرجة المستقيمة يعود الوجه العلوي كل 4 دحرجات."
    art:
      top: "في الأعلى 5"
traps:
  missed_case:
    shows: "يُغفل وجه أو طبقة أو حالة: مربع يلامس آخر عند الطيّ، أو طبقة يخرقها الثقب أيضًا."
    say: "«هل هناك وجه أو طبقة لم يُعدّ بعد؟»"
  ignored_condition:
    shows: "تضيع قاعدة من قواعد المسألة: يُحسب المربعان المتجاوران وجهين متقابلين، أو يُنسى أن مجموع الوجهين المتقابلين في حجر النرد 7."
    say: "«هل يوافق هذا قاعدة المسألة؟»"
  stopped_early:
    shows: "يتوقف الحل قبل خطوة: بعد الطيّة الأولى، أو بعد دحرجة واحدة لحجر النرد."
    say: "«هل بقيت خطوة أخرى؟»"
home:
  - title: "شبكات من الورق"
    text: "ارسموا صليبًا من ستة مربعات، وقصّوه واطووه مكعبًا. أي المربعات صارت متقابلة؟"
  - title: "اطووا واثقبوا"
    text: "اطووا ورقة مرتين، واثقبوها مرة بقلم، وخمّنوا معًا عدد الثقوب قبل فتحها."
  - title: "حجر نرد حقيقي"
    text: "انظروا معًا إلى حجر نرد: أي الأعداد متقابلة؟ دحرجوه على الطاولة وقولوا العدد العلوي قبل النظر."
ask: "أعطني مسألة في موضوع «المكعبات والورق»"
