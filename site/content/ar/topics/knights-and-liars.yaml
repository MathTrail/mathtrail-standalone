# The page of the topic of knights and liars, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: الفرسان والكذابون
description: ما هي مسائل «الفرسان والكذابون»، المعروفة أيضًا بلغز الصادق والكاذب، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

# The words every drawing of the page writes its islanders in: the letters
# of a knight and of a liar, and the islanders' own.
art:
  knight: ف
  liar: ك
  a: أ
  b: ب
  c: ج

hero:
  lead: >-
    على جزيرة يعيش فرسان يقولون الصدق دائمًا، وكذابون يكذبون دائمًا، وهذا ما
    يُعرف أيضًا بلغز الصادق والكاذب. ومن أقوالهم يجب معرفة من هو من. وهذه لكثير
    من الأطفال أول تجربة مع التفكير المنطقي الحقيقي: وضع افتراض، وتتبّع ما يؤدي
    إليه، وملاحظة التناقض.
  method: «لنفترض أن هذا فارس…»
  teaches: التفكير خطوة بخطوة، والتحقق من صحة الاستنتاج
  # The words of its drawing: the key of the letters over it, and in it the
  # first example's two suppositions and how each ends.
  art:
    knight: الفارس يقول الصدق دائمًا
    liar: الكذاب يكذب دائمًا
    says: «أنا كذاب، و ب فارس»
    rule: نفترض ثم نتحقق
    if-knight: "لنفترض أن أ فارس: إذن أ كذاب"
    contradiction: تناقض
    if-liar: "لنفترض أن أ كذاب: إذن ب كذاب أيضًا"
    fits: ينسجم

basis:
  title: قواعد الجزيرة
  cards:
    - mark: ف
      title: فارس
      text: يقول الصدق دائمًا. كل قول للفارس صادق، بلا استثناء.
    - mark: ك
      title: كذاب
      text: يكذب دائمًا. كل قول للكذاب كاذب، ولا يقول الكذاب الصدق أبدًا، ولا حتى مصادفة.
    - mark: "؟"
      title: لا أحد غيرهما
      text: كل ساكن من سكان الجزيرة إما فارس وإما كذاب. ولا يمكن التمييز بينهم بالمظهر، بل بالكلام فقط.

idea:
  title: ماذا يمكن لكل منهما أن يقول
  lead: ابدؤوا بجملتين. فهما تبيّنان فورًا كيف تعمل هذه المسائل.
  table:
    head:
      - الجملة
      - الفارس
      - الكذاب
      - ماذا يعني ذلك
    rows:
      - - «أنا فارس»
        - "✓ يمكنه قولها: إنها صدق"
        - "✓ يمكنه قولها: إنها كذب، كما ينبغي لكلام الكذاب"
        - "لا تفيد بشيء: أي أحد يمكن أن يقولها."
      - - «أنا كذاب»
        - "✕ لا يمكنه: ستكون كذبًا"
        - "✕ لا يمكنه: ستكون صدقًا"
        - "جملة مستحيلة: لا أحد يستطيع قولها."
  note:
    title: لماذا هذا مهم
    text: >-
      عندما يقول أحد سكان الجزيرة «أنا فارس»، يمكن شطب الجملة: فهي لا تغيّر
      شيئًا. وعندما يتبيّن في منتصف الحل أن أحدهم قال في الواقع «أنا كذاب»،
      فالافتراض الذي بدأ منه الحل خاطئ.

method:
  title: "طريقة الحل: «لنفترض أن…»"
  lead: >-
    تُحل كل هذه المسائل تقريبًا بالطريقة نفسها: يُختار أحد سكان الجزيرة،
    ويُفترض نوعه، ثم يُنظر فيما يترتب على ذلك. تتدرّج الأمثلة أدناه من الأبسط
    إلى مستوى الأولمبياد.
  steps:
    - الافتراض
    - استنتاج ما يترتب عليه
    - إيجاد تناقض، أو التحقق من الإجابة

examples:
  - title: اثنان على الطريق
    question: >-
      يلتقي اثنان من سكان الجزيرة، أ و ب، على طريق. يقول أ: «أنا كذاب، و ب
      فارس». من هو من؟
    steps:
      - >-
        **لنفترض أن أ فارس.** إذن كلامه صادق، أي إن أ كذاب. لكننا افترضنا أن أ
        فارس: **تناقض**، إذن هذه الحالة مستحيلة.
      - >-
        **لنفترض أن أ كذاب.** إذن كلامه كاذب. ونصفه الأول، «أنا كذاب»، صادق،
        إذن النصف الثاني كاذب: ب ليس فارسًا بل كذاب. **كل شيء ينسجم.**
    answer: أ و ب كلاهما كذاب.
    note:
      title: كيف يمكن لكذاب أن يقول «أنا كذاب»؟
      text: >-
        جملة «أنا كذاب» وحدها مستحيلة. لكن إذا رُبطت بجملة أخرى بحرف «و»، أمكن
        للكذاب أن يقولها: فالجملة كلها كاذبة متى كان أحد أجزائها كاذبًا.
    art:
      says: «أنا كذاب، و ب فارس»
      contradiction: تناقض
      fits: كل شيء ينسجم
      alone: «أنا كذاب»
      nobody: لا أحد يستطيع قولها
      liar-can: يستطيع الكذاب قولها
  - title: سلسلة اتهامات
    question: >-
      يقول ثلاثة من سكان الجزيرة، أ و ب و ج، ما يلي. أ: «ب كذاب». ب: «ج فارس».
      ج: «أ و ب كلاهما كذاب». من منهم فارس، ومن منهم كذاب؟
    steps:
      - >-
        **من أين نبدأ؟** بمن يقول أكثر من غيره، لأن ما يترتب على كلامه أكثر.
        وهو ج.
      - >-
        **لنفترض أن ج فارس.** إذن أ و ب كلاهما كذاب. لكن ب قال «ج فارس»، وهذا
        سيكون صدقًا، والكذاب لا يقول الصدق أبدًا. **تناقض.**
      - >-
        **إذن ج كذاب.** وعليه فقول ب «ج فارس» كاذب، فيكون ب كذابًا أيضًا.
      - قال أ «ب كذاب»، وهذا صدق. إذن أ فارس.
    answer: أ فارس؛ أما ب و ج فكذابان.
    note:
      title: "التحقق: كل جملة مرة أخرى"
      text: >-
        أ: «ب كذاب» صادق، ويقوله فارس. ب: «ج فارس» كاذب، ويقوله كذاب. ج: «أ و
        ب كلاهما كذاب» كاذب، لأن أ فارس، ويقوله كذاب. كل شيء ينسجم.
    art:
      a-says: «ب كذاب»
      b-says: «ج فارس»
      c-says: «أ و ب كلاهما كذاب»
      most: يقول أكثر من غيره
      contradiction: تناقض
      true-knight: صادق، ويقوله فارس
      false-liar: كاذب، ويقوله كذاب
  - title: المائدة المستديرة
    question: >-
      يجلس عشرة من سكان الجزيرة حول مائدة مستديرة. ويقول كل منهم: «جاري على
      اليمين كذاب». كم فارسًا حول المائدة؟
    steps:
      - >-
        إذا كان الساكن فارسًا، فكلامه صادق: جاره على اليمين كذاب.
      - >-
        وإذا كان كذابًا، فكلامه كاذب: جاره على اليمين فارس.
      - >-
        إذن يتناوب الفرسان والكذابون حول المائدة: ف، ك، ف، ك… ونصف العشرة
        بالضبط فرسان: **5 فرسان**.
    answer: 5 فرسان.
    note:
      title: وماذا لو جلس 9 من سكان الجزيرة حول المائدة؟
      text: >-
        التناوب حول عدد فردي من المقاعد لا ينغلق أبدًا: فالأخير والأول سيكونان
        من النوع نفسه. ولا يمكن أن توجد مائدة كهذه. وهنا تلتقي مسائل «الفرسان
        والكذابون» بالزوجية.
    art:
      right-liar: الجار على اليمين كذاب
      right-knight: الجار على اليمين فارس
      half: 5 و5
      kinds: فرسان وكذابون
      turns: كل واحد ينظر إلى جاره في اتجاه عقارب الساعة
      clash: الأخير والأول من النوع نفسه

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      كتابة ف و ك دون المرور على كل الجمل مرة أخرى، وإحدى الجمل لا تنسجم مع
      ما كُتب.
    say: «لنقرأ كل جملة من جديد. هل هي صادقة أم كاذبة، ومن قالها؟»
  trusted_statement:
    shows: >-
      تصديق كلام ساكن الجزيرة دون السؤال عمّن قاله: قال أ إن ب كذاب، إذن ب
      كذاب حتمًا.
    say: «وماذا لو قاله كذاب؟ ما الصحيح عندئذ؟»
  stopped_early:
    shows: >-
      معرفة نوع الساكن الأول والتوقف عند ذلك، وترك الباقين دون حسم.
    say: «جيد، أ كذاب. فماذا يخبرنا ذلك عن ب؟»

home:
  - title: لعب الجزيرة
    text: >-
      تؤدّون دور الكذاب، والأسئلة على الطفل. وسرعان ما يتضح للطفل أن جوابكم عن
      «هل هذا الكلام كذب؟» هو دائمًا «لا».
  - title: السؤال بدل الإخبار
    text: >-
      بدل الإجابة، سؤال: «وإذا كان فارسًا، فماذا بعد؟». وهذه هي الفكرة الأساسية
      في هذا الموضوع.
  - title: كتابة ف و ك بقلم الرصاص
    text: >-
      فوق كل اسم افتراض. ظهر تناقض؟ امحوه وجرّبوا الافتراض الآخر.

# What a parent can write in the chat to get a task on this topic.
