# The page of the topic of overlapping groups, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: المجموعات المتداخلة
description: ما هي مسائل المجموعات المتداخلة ومخطط فن، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    بعض الأطفال يذهبون إلى نادي الشطرنج، وبعضهم إلى كرة القدم، وبعضهم إلى
    كليهما، وبعضهم لا يذهب إلى أي منهما. في هذه المسائل تتداخل المجموعات،
    والحيلة كلها في عدّ كل واحد مرة واحدة بالضبط. ومخطط فن، أي دائرتان مرسومتان
    على الورق، يحوّل سؤالًا محيّرًا إلى أربعة أعداد.
  method: رسم الدائرتين والبدء من الوسط
  teaches: العدّ دون تكرار، وبيان ما يعنيه كل عدد
  # The words of its drawing: what the two circles are, and what their middle
  # means.
  art:
    line: أندية الفصل
    chess: الشطرنج
    football: كرة القدم
    middle: في الوسط، من يذهبون إلى كليهما

basis:
  title: قواعد الدائرتين
  cards:
    - title: بالجمع يُعدّ بعضهم مرتين
      text: >-
        عند جمع المجموعتين يُعدّ الأطفال الموجودون في كلتيهما مرتين، مرة في كل
        مجموعة. اطرحوهم مرة واحدة، فيُعدّ كل واحد مرة واحدة.
      art:
        choir: الجوقة 14
        art: الفنون 11
        twice: "14 + 11 = 25، لكن 4 منهم عُدّوا مرتين: 25 − 4 = 21"
    - title: بعضهم خارج المجموعتين
      text: >-
        ليس على أحد أن يكون في مجموعة. والفصل كله هو من في مجموعة واحدة على
        الأقل، ومن ليس في أي مجموعة.
      art:
        class: الفصل كله
        none: 9 خارج المجموعتين
    - title: حين لا يُعطى الوسط
      text: >-
        إذا لم يُذكر عدد من هم في المجموعتين معًا، فلا يمكن إلا حصر هذا العدد بين
        حدّين: كلما زاد المشترك بين المجموعتين، قلّ عدد الأطفال الموجودين في
        واحدة منهما على الأقل.
      art:
        little: مشترك قليل
        much: مشترك كثير

idea:
  title: أجزاء الرسم الأربعة
  lead: >-
    30 تلميذًا: 14 يغنّون في الجوقة، و11 في نادي الفنون، و4 في كليهما. املؤوا
    الرسم من الوسط إلى الخارج.
  table:
    head:
      - الجزء
      - العدد
      - طريقة إيجاده
    rows:
      - - في كليهما
        - "4"
        - معطى
      - - الجوقة فقط
        - 14 − 4 = 10
        - الجوقة دون من في كليهما
      - - الفنون فقط
        - 11 − 4 = 7
        - نادي الفنون دون من في كليهما
      - - ليس في أي منهما
        - 30 − 10 − 7 − 4 = 9
        - كل الباقين
  note:
    title: لماذا هذا مهم
    text: >-
      معظم الإجابات الخاطئة تأتي من جمع المجموعتين ونسيان أن الوسط عُدّ مرتين،
      أو من إعطاء «الجوقة فقط» حين يسأل السؤال عن الجوقة كلها. وملء الرسم من
      الوسط إلى الخارج يمنع الخطأين كليهما.

method:
  title: "طريقة الحل: الملء من الوسط إلى الخارج"
  lead: >-
    ارسموا دائرتين متداخلتين. اكتبوا الوسط أولًا، أي من في كليهما، ثم كل دائرة
    دون الوسط، وفي النهاية من هم خارجهما. وحين لا يُعطى الوسط، جرّبوا القيم التي
    يمكن أن يأخذها وانظروا أيها يناسب. تتدرّج الأمثلة أدناه من الأبسط إلى مستوى
    الأولمبياد.
  steps:
    - رسم الدائرتين
    - ملء الوسط، ثم الباقي
    - التحقق من أن مجموع الأجزاء يساوي العدد كله
  # The key under the steps: what a ring on a number means.
  legend:
    filled: "حلقة زرقاء: ما تملؤه هذه الخطوة"

examples:
  - title: أخوات وإخوة
    question: >-
      في مجموعة من 24 طفلًا، لدى 15 منهم أخت، ولدى 11 أخ، ولدى 6 أخت وأخ معًا.
      كم طفلًا ليس لديه أخت ولا أخ؟
    steps:
      - >-
        نرسم دائرتين متداخلتين، «أخت» و«أخ». في الوسط: 6 أطفال لديهم أخت وأخ.
      - "أخت فقط: 15 − 6 = 9. أخ فقط: 11 − 6 = 5."
      - "داخل الدائرتين: 9 + 6 + 5 = 20 طفلًا. خارجهما: 24 − 20 = 4."
    answer: 4 أطفال.
    art:
      sister: أخت
      brother: أخ
      all: "الكل: 24"
      only: 15 − 6 = 9 · 11 − 6 = 5
      out: 24 − 20 = 4 في الخارج
  - title: تفاح وكمثرى
    question: >-
      في مجموعة من 25 طفلًا، يحب 18 منهم التفاح، ويحب 16 الكمثرى. ما أصغر عدد
      ممكن من الأطفال الذين يحبون الاثنين معًا؟
    steps:
      - >-
        ليكون الوسط أصغر ما يمكن، نفصل محبي التفاح عن محبي الكمثرى قدر الإمكان.
      - >-
        لو انفصلوا تمامًا لاحتاجوا إلى 18 + 16 = 34 مكانًا، وليس هناك إلا 25
        طفلًا: إذن لا بد أن يكون 34 − 25 = 9 منهم في الدائرتين كلتيهما.
      - >-
        العدد 9 ممكن فعلًا: 9 يحبون التفاح فقط، و7 الكمثرى فقط، و9 الاثنين،
        والمجموع 25، ولا أحد خارج الدائرتين.
    answer: 9 أطفال.
    note:
      title: وأكبر عدد ممكن؟
      text: >-
        في أقصى حد، يمكن أن يكون كل محبي الكمثرى، وعددهم 16، من محبي التفاح
        أيضًا. فالوسط يقع بين 9 و16، والسؤال طلب الطرف الأصغر.
    art:
      apples: التفاح
      kids: الأطفال
      pears: الكمثرى
      ends: التفاح من الطرف الأيسر، والكمثرى من الأيمن
      violet: "بالبنفسجي، من يحبون الاثنين: 9"
      all: "الكل: 25"
      inside: 16 يحبون الكمثرى، وكلهم داخل التفاح
  - title: ثلاث مواد
    question: >-
      كل واحد من 20 تلميذًا يحب مادة واحدة على الأقل من ثلاث مواد: الرياضيات
      والقراءة والفنون. يحب الرياضيات 12 تلميذًا، والقراءة 10، والفنون 9. ولا
      أحد يحب المواد الثلاث كلها. كم تلميذًا يحب مادتين بالضبط؟
    steps:
      - >-
        نجمع الأعداد الثلاثة: 12 + 10 + 9 = 31. التلميذ الذي يحب مادة واحدة
        يُعدّ في هذا المجموع مرة واحدة، والذي يحب مادتين يُعدّ مرتين.
      - >-
        عدد التلاميذ 20، إذن في المجموع زيادة قدرها 31 − 20 = 11، واحد عن كل
        تلميذ عُدّ مرتين.
      - >-
        إذن 11 تلميذًا يحبون مادتين بالضبط. التحقق: 9 يحبون مادة واحدة و11
        يحبون مادتين، و9 + 2 × 11 = 31.
    answer: 11 تلميذًا.
    note:
      title: العدّ مرتين عن قصد
      text: >-
        هنا الحيلة ليست في الدوائر بل في المجموع: كل تلميذ يضيف إليه واحدًا عن
        كل مادة يحبها. ومسائل الأولمبياد عن المجموعات كثيرًا ما تقوم على عدّ
        الشيء نفسه بطريقتين.
    art:
      maths: الرياضيات 12
      reading: القراءة 10
      drawing: الفنون 9
      once: مرة
      twice: مرتان
      each: واحد لكل تلميذ، 20؛ والزائد 31 − 20 = 11

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      جمع المجموعتين، 15 و11، واعتبار المجموع عدد الأطفال: فمن في المجموعتين
      كلتيهما يُعدّون مرتين.
    say: «هل عُدّ أحد في الدائرتين كلتيهما؟»
    art:
      question: أخت 15، أخ 11، كلاهما 6
  answered_other_question:
    shows: >-
      إيجاد جزء من الرسم وتقديمه على أنه الإجابة، مع أن السؤال عن جزء آخر: «في
      كليهما» بدل «ليس في أي منهما»، أو «الجوقة فقط» بدل الجوقة كلها.
    say: «لنُشِر في الرسم إلى الجزء الذي يسأل عنه السؤال».
    art:
      question: "السؤال: كم طفلًا بلا أخت ولا أخ؟"
  missed_case:
    shows: >-
      يسقط جزء من الرسم: تُطرح مجموعة من الكل وتُنسى الأخرى، أو لا يُضاف من جديد
      من هم في المجموعات الثلاث كلها.
    say: «هل مُلئت كل أجزاء الرسم؟»
    art:
      question: "24 طفلًا: أخت 15، أخ 11، كلاهما 6"

home:
  - title: طوقان على الأرض
    text: >-
      ضعوا على الأرض طوقين، أو حلقتين من الخيط، بحيث تتداخلان، وصنّفوا الألعاب
      فيهما: «حمراء» و«ناعمة». فالدب الأحمر الناعم مكانه في الوسط.
  - title: أي ستة؟
    text: >-
      عندما تكون إجابة طفلكم «ستة»، اسألوا: «أي ستة؟». فستة في الناديين كليهما،
      وستة ليسوا في أي منهما، إجابتان مختلفتان.
  - title: استطلاع عائلي
    text: >-
      اطرحوا على أفراد العائلة سؤالين، مثل: من يحب الشاي ومن يحب الكاكاو،
      وارسموا الدائرتين معًا. فالوسط هو حيث يقع الخطأ في العدّ عادةً.

