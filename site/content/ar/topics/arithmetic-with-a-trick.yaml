# The page of the topic of arithmetic with a trick, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: حساب فيه خدعة
description: ما هي مسائل حساب فيه خدعة، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    كم يساوي 19 + 23 + 81 + 77؟ إذا جُمعت الأعداد بالترتيب، فتلك ثلاث عمليات
    جمع فيها حمل؛ وإذا جُمعت أزواجًا، 19 + 81 و23 + 77، صارت 100 + 100. في
    هذه المسائل يسهل الحساب متى وُجد الترتيب المناسب، وألغاز «فكّرتُ في عدد»
    تُحلّ بعكس الخطوات بدءًا من النهاية. والمهارة هنا هي النظر قبل الحساب.
  method: البحث عن الترتيب السهل قبل الحساب
  teaches: تجميع حدود المجموع أو حاصل الضرب بطريقة أخرى، وعكس سلسلة من الخطوات بدءًا من النهاية
  # The words of its drawing: the sum's numbers paired colour by colour into
  # two easy hundreds.
  art:
    pairs: جمع أزواج اللون الواحد
    look: النظر أولًا، ثم الحساب

basis:
  title: قواعد الحساب الذكي
  cards:
    - title: بأي ترتيب
      text: >-
        يمكن جمع الأعداد أو ضربها بأي ترتيب، وتجميعها بأي طريقة: 25 × 9 × 4 هو
        25 × 4 × 9، أي 100 × 9.
    - title: الأعداد المدوَّرة
      text: >-
        ابحثوا عن أزواج تعطي 10 أو 100 أو 1000: 36 + 64، 25 × 4، 125 × 8.
        ومن السهل متابعة الحساب بعدد مدوَّر.
    - title: عكس الخطوات من النهاية
      text: >-
        في مسائل «فكّرتُ في عدد»، ارجعوا من النتيجة إلى الوراء واعكسوا كل خطوة:
        ما أُضيف يُطرح، وما ضُوعف يُنصَّف.
      art:
        undoes: عكس
        back: الرجوع من النتيجة

idea:
  title: النظر قبل الحساب
  lead: قد يطول حساب المجموع نفسه أو يقصر. فقبل الحساب، ابحثوا عن الأزواج والمجموعات التي تعطي أعدادًا مدوَّرة.
  table:
    head:
      - المسألة
      - الطريقة السهلة
      - الإجابة
    rows:
      - - 19 + 23 + 81 + 77
        - (19 + 81) + (23 + 77)
        - "200"
      - - 4 × 19 × 25
        - (4 × 25) × 19
        - "1900"
      - - 1 + 2 + 3 + … + 10
        - خمسة أزواج مجموع كل منها 11، مثل 1 + 10 و2 + 9
        - "55"
  # The words of the drawings of the easy way, all rows' in one place.
  art:
    pairs: خمسة أزواج، كل منها يعطي 11
  note:
    title: لماذا هذا مهم
    text: >-
      تتعمد مسائل الأولمبياد إعطاء مجاميع يطول حسابها بالطريقة المعتادة: فالمطلوب
      هو ملاحظة الطريق المختصر. والبحث عن الأزواج أولًا يعلّم رؤية بنية المسألة،
      وهذا مهم في ما هو أبعد بكثير من الحساب.

method:
  title: "طريقة الحل: البحث عن الأعداد المدوَّرة"
  lead: >-
    قبل الحساب، انظروا إلى المسألة كلها. كوّنوا أزواجًا من الأعداد التي تعطي
    أعدادًا مدوَّرة، وضعوا العوامل التي تعطي 10 أو 100 جنبًا إلى جنب، وفي سلسلة
    من الخطوات ابدؤوا من النهاية واعكسوها واحدة تلو الأخرى. تتدرّج الأمثلة
    أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - النظر إلى المسألة كلها أولًا
    - التجميع في أعداد مدوَّرة، أو عكس الخطوات من النهاية
    - التحقق من الإجابة بطريقة أخرى
  # The key under the steps: what the drawings' colours mean.
  legend:
    pair: لون واحد، زوج واحد
    undo: خطوة عكسية

examples:
  - title: أزواج تعطي عشرة
    question: >-
      كم يساوي 6 + 7 + 8 + 2 + 3 + 4؟
    steps:
      - "نبحث عن أزواج تعطي 10. وهي هنا ثلاثة: 6 + 4 و7 + 3 و8 + 2."
      - ثلاث عشرات تساوي 30.
      - "إذن 6 + 7 + 8 + 2 + 3 + 4 = 30، من غير أي حمل."
    answer: "30."
    note:
      title: الطريق الطويل
      text: >-
        6 + 7 = 13، ثم 21، ثم 23، ثم 26، ثم 30. الإجابة نفسها، لكنها تحتاج إلى
        خمس خطوات بدلًا من خطوة واحدة، وكل خطوة فرصة للخطأ.
    art:
      tens: لون واحد، زوج يعطي عشرة
  - title: عدد مجهول
    question: >-
      فكّرت مريم في عدد. ضاعفته، وأضافت إليه 7، وقسمت الناتج على 3. فحصلت على
      9. ما العدد الذي فكّرت فيه مريم؟
    steps:
      - نبدأ من النهاية ونعكس كل خطوة، الأخيرة أولًا.
      - >-
        قسمت على 3 فحصلت على 9، إذن كان لديها قبل ذلك 9 × 3 = 27. وأضافت 7،
        إذن كان لديها قبل ذلك 27 − 7 = 20.
      - "ضاعفت العدد، إذن كان 20 : 2 = 10. التحقق: 10 × 2 + 7 = 27، و27 : 3 = 9."
    answer: "10."
    note:
      title: عكس الخطوات بترتيب معكوس
      text: >-
        آخر خطوة نُفّذت هي أول خطوة تُعكس، كما يُخلع الحذاء قبل الجوارب. أما عكس
        الخطوات بالترتيب الذي نُفّذت به فيعطي عددًا خاطئًا.
    art:
      masha: مريم
      back: من النهاية
      check: التحقق
      "on": ارتداء
      "off": خلع
      socks: الجوارب
      shoes: الحذاء
  - title: حاصلا ضرب كبيران
    question: >-
      كم يساوي 2026 × 2026 − 2027 × 2025؟ والمطلوب إيجاده دون ضرب الأعداد
      الكبيرة.
    steps:
      - >-
        يختبئ 2026 × 2025 في حاصلي الضرب كليهما: إذ إن 2026 × 2026 هو
        2026 × 2025 مضافًا إليه 2026.
      - أما 2027 × 2025 فهو 2026 × 2025 مضافًا إليه 2025.
      - "إذن الفرق هو 2026 − 2025 = 1، دون ضرب أي عدد كبير."
    answer: "1."
    note:
      title: جرّبوا على أعداد صغيرة
      text: >-
        الأمر نفسه يصح مع أي أعداد: 5 × 5 − 6 × 4 = 25 − 24 = 1. وتجربة الحيلة
        على أعداد صغيرة أولًا هي أضمن طريقة للوثوق بها.
    art:
      cancel: الأجزاء المتساوية تُحذف، ويبقى الشريطان

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  stopped_early:
    shows: >-
      يتوقف الحل قبل نهايته: يُجمع زوجان من الأزواج الثلاثة ويُنسى الثالث، أو
      تُعكس خطوة واحدة من السلسلة وتُقدَّم نتيجتها على أنها الإجابة.
    say: «هل استعملنا كل الأعداد، وعكسنا كل الخطوات؟»
  wrong_operation:
    shows: >-
      تُعكس الخطوة بالعملية نفسها بدلًا من العملية المعاكسة: يُضاف 7 مرة أخرى
      بدلًا من طرحه، أو يُقسم 9 على 3 بدلًا من ضربه فيه.
    say: «ما الذي يعكس الجمع؟ وما الذي يعكس القسمة؟»
    art:
      undo: عكس «+ 7» بدءًا من 27
  number_from_text:
    shows: >-
      يصبح عدد من نص المسألة هو الإجابة: العدد 9 الذي حصلت عليه مريم، أو العدد 7
      الذي أضافته، بدلًا من العدد الذي فكّرت فيه.
    say: «هل هذا هو العدد الذي حصلت عليه، أم الذي فكّرت فيه؟»
    art:
      question: ما العدد الذي فكّرت فيه مريم؟
      got: ما حصلت عليه مريم
      thought: ما فكّرت فيه

home:
  - title: أزواج تعطي عشرة
    text: >-
      اكتبوا ستة أو ثمانية أعداد صغيرة على بطاقات، واطلبوا من الطفل إيجاد
      الأزواج التي تعطي 10 قبل جمعها كلها.
  - title: تخمين العدد
    text: >-
      العبوا «فكّرتُ في عدد» في الاتجاهين: تذكرون أنتم الخطوات والنتيجة، وعلى
      الطفل إيجاد العدد، ثم يأتي دور الطفل في ابتكار الخطوات.
  - title: التسوّق بذكاء
    text: >-
      في المتجر، اجمعوا الأسعار بترتيب ذكي: 99 هو 100 ناقص 1، و49 و51 معًا
      100. التدوير أولًا، ثم التصحيح.

