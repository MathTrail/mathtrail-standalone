# The page of the topic of the calendar and age, for a parent, in Arabic. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: التقويم والأعمار
description: ما هي مسائل التقويم والأعمار، وكيف تُحلّ، وأين يخطئ الأطفال عادةً، وكيف يمكن المساعدة في البيت.

hero:
  lead: >-
    اليوم هو الثلاثاء: فأي يوم سيكون بعد 30 يومًا؟ عمر الأم 30 سنة، وعمر أمل 6
    سنوات: فكم سيكون عمر أمل حين يصبح عمر الأم ضعف عمرها؟ في هذه المسائل
    يتعامل الأطفال مع الأسابيع والأشهر والسنوات، ومعظمها يقوم على حقيقتين:
    الأسبوع يتكرر كل 7 أيام، والفرق بين عمرين لا يتغير أبدًا.
  method: حذف الأسابيع الكاملة، والإبقاء على فرق الأعمار
  teaches: حساب الأيام والسنوات دون عدّها واحدًا تلو الآخر
  # The words of its drawing: a month whose Tuesdays stand in one column.
  art:
    line: الأسبوع يتكرر كل 7 أيام
    tuesdays: كل أيام الثلاثاء في عمود واحد، بفارق 7 أيام

basis:
  title: قواعد التقويم
  cards:
    - title: الأسبوع يتكرر
      text: >-
        كل 7 أيام يعود يوم الأسبوع نفسه. لذلك عند العدّ 30 يومًا إلى الأمام، لا
        يهم إلا الأيام المتبقية بعد 4 أسابيع كاملة، وعددها 2.
      art:
        week: 7 أيام
        month: 30 يومًا = 4 أسابيع و2 يومان
    - title: طرفا المدة
      text: >-
        يأتي 10 مايو بعد 3 مايو بمقدار 7 أيام، لكن العطلة من اليوم 3 إلى اليوم
        10 تستمر 8 أيام، لأن اليومين الأول والأخير يُحسبان كلاهما.
      art:
        holidays: "من اليوم 3 إلى اليوم 10: 8 أيام عطلة"
    - title: الفرق ثابت
      text: >-
        الأم الآن أكبر من أمل بمقدار 24 سنة، وبعد 10 سنوات ستبقى أكبر منها
        بمقدار 24 سنة: فعمر كل منهما يزيد سنة كل عام.
      art:
        now: الآن
        then: بعد 10 سنوات
        anya: أمل
        mum: الأم

idea:
  title: حذف الأسابيع الكاملة
  lead: أي يوم من أيام الأسبوع سيكون بعد عدد ما من الأيام؟ لا يهم إلا ما يتبقى بعد الأسابيع الكاملة.
  table:
    head:
      - بعد كم يومًا
      - أسابيع كاملة وأيام متبقية
      - إذا كان اليوم يوم الاثنين
    rows:
      - - "10"
        - 1 أسبوع و3 أيام
        - الخميس
      - - "15"
        - 2 أسبوعان و1 يوم
        - الثلاثاء
      - - "30"
        - 4 أسابيع و2 يومان
        - الأربعاء
      - - "100"
        - 14 أسبوعًا و2 يومان
        - الأربعاء
  # The words of the drawings of whole weeks and the days left over.
  art:
    week: 7 أيام
    weeks: 14 × 7 أيام
  note:
    title: لماذا هذا مهم
    text: >-
      عدّ مئة يوم على الأصابع بطيء، والخطأ فيه سهل. أما حذف الأسابيع الكاملة
      فيحوّله إلى خطوة من يوم أو يومين.

method:
  title: "طريقة الحل: إيجاد ما لا يتغير"
  lead: >-
    ابحثوا عما يبقى ثابتًا: الأسبوع يتكرر كل 7 أيام، والفرق بين عمرين لا يتغير
    أبدًا. واستعينوا بذلك لحذف ما لا يهم، ثم احسبوا ما تبقى فقط. تتدرّج الأمثلة
    أدناه من الأبسط إلى مستوى الأولمبياد.
  steps:
    - إيجاد ما يتكرر أو يبقى ثابتًا
    - حذف الأسابيع الكاملة، أو العمل بفرق الأعمار
    - حساب ما تبقى، والتحقق مما إذا كان الطرفان يُحسبان
  # The key under the steps: what the drawings' blocks and colours mean.
  legend:
    week: 7 أيام
    whole: أسبوع كامل
    day: يوم من الباقي
    difference: فرق العمر

examples:
  - title: سقي الأزهار
    question: >-
      تسقي كوثر الأزهار كل 3 أيام. وتسقيها أول مرة يوم الاثنين. في أي يوم من
      أيام الأسبوع تسقيها للمرة رقم 4؟
    steps:
      - >-
        من المرة رقم 1 إلى المرة رقم 4 توجد 3 فواصل مدة كل منها 3 أيام، لا 4:
        3 × 3 = 9 أيام.
      - 9 أيام هي أسبوع و2 يومان آخران.
      - بعد أسبوع من الاثنين يعود الاثنين، وبعد 2 يومين آخرين يأتي الأربعاء.
    answer: يوم الأربعاء.
    badge: الأربعاء
    note:
      title: لماذا ليس السبت؟
      text: >-
        حساب 4 × 3 = 12 يومًا يضع فاصلًا بعد المرة رقم 4 أيضًا. فبين 4 مرات سقي
        توجد 3 فواصل، كما بين 4 أعمدة.
    art:
      monday: الاثنين
      first: السقي أول مرة يوم الاثنين، ثم كل 3 أيام
      three-days: 3 أيام
      gaps: 3 فواصل × 3 أيام = 9 أيام
      week: 7 أيام
      numbers: تحت كل يوم أزرق، رقم مرة السقي
      no-gap: لا فاصل بعد المرة رقم 4
  - title: ريم وأبوها
    question: >-
      أبو ريم أكبر منها بمقدار 28 سنة. وبعد 4 سنوات سيصبح عمره 3 أضعاف عمرها.
      كم عمر ريم الآن؟
    steps:
      - "الفرق لا يتغير أبدًا: بعد 4 سنوات يبقى الأب أكبر من ريم بمقدار 28 سنة."
      - >-
        عندئذ يكون عمر الأب ثلاثة أمثال عمر ريم، كما في الرسم. والجزءان
        الزائدان يساويان 28 سنة، إذن الجزء الواحد 28 : 2 = 14.
      - >-
        بعد 4 سنوات يكون عمر ريم 14 سنة، إذن عمرها الآن 14 − 4 = 10. التحقق:
        عمر الأب الآن 38، وبعد 4 سنوات 42 = 3 × 14.
    answer: 10 سنوات.
    art:
      now: الآن
      then: بعد 4 سنوات
      vera: ريم
      dad: الأب
      difference: "البرتقالي: الفرق، 28 سنة"
      parts: "بعد 4 سنوات: 2 جزءان = 28، والجزء الواحد = 14"
      check: "التحقق: 38 + 4 = 42 = 3 × 14"
  - title: ثلاثة أيام سبت بتواريخ زوجية
    question: >-
      في أحد الأشهر، وقعت ثلاثة أيام سبت في تواريخ زوجية. في أي يوم من أيام
      الأسبوع يقع اليوم 25 من ذلك الشهر؟
    steps:
      - >-
        تأتي أيام السبت كل 7 أيام، و7 عدد فردي، لذلك تتناوب تواريخها: زوجي،
        فردي، زوجي، فردي…
      - >-
        لكي تقع ثلاثة منها في تواريخ زوجية، يلزم خمسة أيام سبت، أولها في تاريخ
        زوجي. والسبت الخامس يأتي بعد 28 يومًا من الأول، ولا بد أن يبقى داخل
        الشهر، لذلك لا يتأخر الأول عن اليوم 3. والتاريخ الزوجي الوحيد بين الأيام
        الثلاثة الأولى هو اليوم 2: إذن أيام السبت هي أيام 2 و9 و16 و23 و30.
      - اليوم 23 يوم سبت، إذن اليوم 25، بعده بيومين، هو الاثنين.
    answer: الاثنين.
    badge: الاثنين
    note:
      title: الزوجي والفردي في التقويم
      text: >-
        مفتاح هذه المسألة هو الزوجية: 7 عدد فردي، لذلك تتبدل تواريخ اليوم نفسه
        من أيام الأسبوع بين زوجي وفردي كل أسبوع.
    art:
      even: "الأزرق: زوجي، البرتقالي: فردي"
      first: السبت الأول
      fifth: السبت الخامس
      saturdays: أيام السبت بالأزرق، واليوم 25 هو الاثنين

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      يخطئ عدّ الأيام بواحد: يُعدّ اليوم الحالي أول الأيام القادمة، أو تُعدّ 4
      فواصل بين 4 مرات سقي، أو يُهمل أحد طرفي المدة، كما في عطلة من الاثنين إلى
      الأحد.
    say: "«أيهما اليوم رقم 1: اليوم أم الغد؟»"
    art:
      gaps: الفواصل بين 4 مرات سقي
  wrong_operation:
    shows: >-
      تُجرى عملية لا يطلبها السؤال: يُجمع العمران حين يكون السؤال عن مقدار ما
      يكبر به أحدهما الآخر، أو يُطرح تاريخ من آخر وهما في شهرين مختلفين.
    say: "«لنقل ذلك بالكلمات: هل يزيد العدد، أم ينقص، أم يبقى كما هو؟»"
    art:
      older: بكم سنة الأم (30) أكبر من أمل (6)؟
  ignored_condition:
    shows: >-
      تضيع معلومة من التقويم أو من نص المسألة: أن هذا الشهر فيه 30 يومًا لا 31،
      أو أن 365 يومًا هي أسابيع كاملة ويوم واحد زائد.
    say: «كم يومًا في هذا الشهر؟»
    art:
      year: بعد 365 يومًا من يوم اثنين
      weeks: 52 × 7 أيام
      monday: الاثنين
      tuesday: الثلاثاء

home:
  - title: تقويم على الحائط
    text: >-
      علّقوا تقويمًا ورقيًا في متناول الطفل، واطرحوا أسئلة عنه: في أي يوم من
      أيام الأسبوع يقع اليوم 1 من الشهر القادم؟ وكم يوم جمعة في هذا الشهر؟
  - title: أعمار العائلة
    text: >-
      اكتبوا عمر كل فرد في العائلة والفروق بين الأعمار. وبعد عام انظروا مرة
      أخرى: الأعمار تغيرت، أما الفروق فلم تتغير.
  - title: العدّ التنازلي
    text: >-
      عدّوا معًا الأيام الباقية حتى عيد ميلاد أو عطلة، أولًا يومًا يومًا، ثم
      بالأسابيع الكاملة، وتأكدوا من أن الطريقتين تتفقان.

