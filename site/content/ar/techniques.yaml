# The page of the techniques of olympiad problem solving, for a parent, in
# Arabic. Which techniques there are, their groups and order, the topics each
# one leads to, and each example's level and the answer its solver proves are
# the site's data; the words here follow them, technique by technique. The
# pictures of a technique's steps are laid out by the page, and only their
# words are here.

title: استراتيجيات حل المسائل في رياضيات الأولمبياد
description: "استراتيجيات حل المسائل في رياضيات الأولمبياد للأطفال: أساليب يحلّ كل منها كثيرًا من المسائل، ولكل منها مسألة ورسم، مع الحل مفصّلًا."

hero:
  title: أساليب حل مسائل رياضيات الأولمبياد
  lead: >-
    لا تأتي مسألة الأولمبياد ومعها طريقة حل جاهزة. وبدلًا من ذلك هناك أساليب
    تنفع في كثير من المسائل في آن واحد. وإليكم {count} هي الأكثر تكرارًا،
    ولكل منها مسألة ورسم وحل.
  advice: >-
    جرّبوا حل المسألة مع طفلكم قبل فتح الحل. فالأهم هو ملاحظة الأسلوب الذي
    نجح، لتمييزه في المرة القادمة.

start:
  title: من أين نبدأ حل أي مسألة
  lead: >-
    قبل اختيار أسلوب، يفيد المرور بأربع خطوات. وقد عرضها عالم الرياضيات جورج
    بوليا في كتابه *«البحث عن الحل»* (1945).
  steps:
    - title: فهم المسألة
      text: لنُعِد صياغة المسألة بكلماتنا. ما المعطيات؟ وما المطلوب؟
    - title: ابتكار خطة
      text: بماذا تذكّرنا المسألة؟ وأي أسلوب من هذه الصفحة يمكن أن نجرّبه؟
    - title: تنفيذ الخطة
      text: خطوة بخطوة، مع كتابة ما تعطيه كل خطوة.
    - title: مراجعة الحل
      text: لنعوّض بالإجابة في المسألة. هل يتفق كل شيء؟ وهل يمكن أن توجد إجابة أخرى؟

groups:
  see:
    title: رؤية المسألة
    lead: >-
      أولًا يجب فهم المسألة. وهذه الأساليب تحوّل الكلمات إلى رسم أو جدول أو
      مثال صغير.
  find:
    title: إيجاد الإجابة
    lead: >-
      حين يتضح ما يجري، تقود هذه الأساليب إلى الإجابة دون أن يضيع شيء في
      الطريق.
  prove:
    title: الإثبات
    lead: >-
      في الأولمبياد كثيرًا ما لا يكون السؤال «كم» بل «هل يمكن ذلك». وعندها لا
      يكفي العدّ: لا بد من شرح لماذا لا يمكن أن يكون الأمر على غير ذلك.

techniques:
  draw:
    name: رسم صورة
    what: >-
      الرسم أو المخطط يحوّل الكلمات إلى شيء يمكن النظر إليه. وتكفي الخطوط
      والنقاط والأسهم؛ فلا داعي لأن يكون جميلًا.
    when: «أكثر بكذا»، الأعمار، الرحلات، أجزاء الكل.
    task: >-
      أخ يكبر أخته بمقدار 4 سنوات. ومجموع عمريهما 16 سنة. كم عمر الأخ؟
    steps:
      - نرسم عمر الأخت شريطًا، وعمر الأخ الشريط نفسه وزيادة 4 سنوات.
      - "نطرح الزيادة، 4 سنوات: 16 − 4 = 12. فيبقى شريطان متساويان."
      - "الشريط الواحد 12 ÷ 2 = 6 سنوات: وهذا عمر الأخت. وعمر الأخ 6 + 4 = 10."
    answer: عمر الأخ 10 سنوات.
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: في الأعلى الأخت، وفي الأسفل الأخ؛ معًا 16 سنة
      less: 16 − 4 = 12، شريطان متساويان
      found: عمر الأخ 6 + 4 = 10
    caption: >-
      يظهر المخطط ما يصعب الاحتفاظ به في الذهن: من دون السنوات الأربع
      الزائدة، يتساوى عمرا الأخ والأخت.
  table:
    name: إنشاء جدول
    what: >-
      حين تكثر المعلومات، يصعب الاحتفاظ بها في الذهن. والجدول يحفظها بدلًا
      منكم: كل معلومة علامة ✕، وحيث تبقى في سطر خانة واحدة فارغة، فتلك هي
      الإجابة.
    when: عدة أشخاص، وعدة أشياء، ومعلومات فيها كلمة «لا».
    task: >-
      لدى أسماء وبلال وريم قطة وكلب وببغاء، لكل منهم حيوان واحد. أسماء لا تربي
      القطة. وبلال يخاف من الكلاب. والقطة لا تعيش مع بلال. لمن كل حيوان؟
    steps:
      - "نضع علامة ✕ لكل معلومة: لا قطة لأسماء، ولا كلب لبلال، ولا قطة عند بلال."
      - "لم يبق لبلال إلا خانة واحدة: الببغاء. إذن ليس الببغاء لأسماء ولا لريم."
      - فيبقى الكلب لأسماء، والقطة لريم.
    answer: لأسماء الكلب، ولبلال الببغاء، ولريم القطة.
    pictures:
      children:
        anya: أسماء
        borya: بلال
        vera: ريم
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: أ
        borya: ب
        vera: ر
      pets:
        cat: قطة
        dog: كلب
        parrot: ببغاء
    caption: العدد الصغير في الخانة هو رقم خطوة الحل التي وُضعت فيها العلامة.
  small-numbers:
    name: البدء بأعداد صغيرة
    aka: حالة خاصة
    what: >-
      حين تكون الأعداد كبيرة ولا يتضح من أين البداية، حلّوا المسألة نفسها
      بأعداد صغيرة. لاحظوا القاعدة، ثم طبّقوها على الأعداد الكبيرة.
    when: أعداد كبيرة، «مئة»، «ألف»، سلاسل طويلة.
    task: >-
      تُنصب أعمدة على طول طريق طوله 100 متر، عمود كل 5 أمتار، وعند طرفيه
      أيضًا. كم عمودًا يلزم؟
    steps:
      - "لا يمكن رسم مئة متر، فلنأخذ طريقًا طوله 10 أمتار. الأعمدة عند 0 و5 و10 أمتار: 3 أعمدة، والفواصل بينها 2."
      - "ومع 15 و20 مترًا الأمر نفسه: عدد الأعمدة دائمًا يزيد على عدد الفواصل بواحد."
      - وفي 100 متر يوجد 100 ÷ 5 = 20 فاصلًا، إذن هناك 21 عمودًا.
    answer: 21 عمودًا.
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: "10 م: 2 فاصلان، 3 أعمدة"
      fifteen: "15 م: 3 فواصل، 4 أعمدة"
      twenty: "20 م: 4 فواصل، 5 أعمدة"
      table: الطريق بالأمتار، وفواصله، وأعمدته
    caption: >-
      تظهر القاعدة بالفعل على طريق قصير؛ وبعدها يكفي تطبيقها على مئة متر.
  systematic:
    name: إنشاء قائمة منظمة
    what: >-
      الحصر العشوائي لا بد أن يغفل شيئًا أو يعدّه مرتين. أما القائمة المنظمة
      فتسير بالترتيب: أولًا حسب صفة واحدة، ثم حسب الصفة التالية. والمخطط
      الشجري مفيد لذلك.
    when: «بكم طريقة»، «كم عددًا»، «كتابة كل الاحتمالات».
    task: >-
      كم عددًا مختلفًا مكوّنًا من رقمين يمكن تكوينه من الأرقام 2 و4 و6 و8، إذا
      لم يتكرر أي رقم في العدد نفسه؟
    steps:
      - "نختار ترتيبًا: أولًا رقم العشرات، ثم رقم الآحاد."
      - رقم العشرات 2 أو 4 أو 6 أو 8. وكل منها يترك ثلاثة أرقام أخرى للآحاد.
      - "نكتبها فرعًا فرعًا: 24، 26، 28، 42، 46، 48، 62، 64، 68، 82، 84، 86. لم يُغفَل أي عدد، ولم يتكرر أي عدد."
    answer: 12 عددًا.
    pictures:
      first: الرقم الأول واحد من أربعة
      total: 4 فروع × 3 أعداد = 12
    caption: "المخطط الشجري لا يترك شيئًا يفلت: لكل رقم أول فروعه الخاصة."
  backwards:
    name: البدء من النهاية
    aka: الحل عكسيًّا
    what: >-
      حين تكون نهاية القصة معروفة والسؤال عن بدايتها، ارجعوا من النهاية إلى
      البداية. واقلبوا كل عملية إلى عكسها: «أكل» إلى «أعاد»، و«ضرب» إلى
      «قسم».
    when: النتيجة في النهاية معروفة، والمطلوب ما كان في البداية.
    task: >-
      كان في وعاء بعض التفاح. أكلت سلمى نصفه. ثم أكل يوسف نصف ما بقي، وتفاحة
      أخرى. فبقيت 2 تفاحتان. كم تفاحة كانت في البداية؟
    steps:
      - "نبدأ مما نعرفه: في النهاية بقيت 2 تفاحتان."
      - "قبل يوسف: نعيد التفاحة الواحدة، 2 + 1 = 3. وهذا كان النصف، إذن كان هناك 6."
      - "قبل سلمى: كان 6 هو النصف، إذن كان هناك 12. التحقق: 12 ← 6 ← 6 − 3 − 1 = 2."
    answer: 12 تفاحة.
    pictures:
      end: في النهاية
      undo-petya: +1، ×2
      undo-tanya: ×2
      check: "التحقق:"
    caption: >-
      نسير من اليمين إلى اليسار ونفعل كل شيء بالعكس: «أكل النصف» يصبح «الضرب
      في 2»، و«أكل واحدة أخرى» يصبح «زائد 1».
  all-the-same:
    name: افتراض أن الجميع من نوع واحد
    aka: طريقة الافتراض
    what: >-
      حين يكون في المسألة أشياء من نوعين، تخيّلوا أنها كلها من نوع واحد.
      احسبوا مقدار ابتعاد النتيجة عن المطلوب، فيتضح عدد ما يجب استبداله.
    when: "نوعان من الأشياء ومجموع معروف: رؤوس وأرجل، قطع نقدية من فئتين."
    task: >-
      تتجول في فناء دجاجات وأرانب. عدد رؤوسها معًا 10، وعدد أرجلها 28. كم
      أرنبًا في الفناء؟
    steps:
      - لنفترض أن الحيوانات كلها، وعددها 10، دجاجات. عندها يكون عدد الأرجل 10 × 2 = 20.
      - "لكن عدد الأرجل في الحقيقة 28: أي بزيادة 8."
      - "كل أرنب يحلّ محل دجاجة يزيد الأرجل بمقدار 2: 8 ÷ 2 = 4 أرانب. التحقق: 4 × 4 + 6 × 2 = 28."
    answer: 4 أرانب.
    # What each counter under the problem stands for.
    legend:
      hen: دجاجة، أرجلها 2
      rabbit: أرنب، أرجله 4
    pictures:
      guess: "= 20 من الأرجل"
      short: أرجل ناقصة
      fits: "4 أرانب و6 دجاجات: 16 + 12 = 28 من الأرجل"
    caption: >-
      نعدّ أولًا كأن الجميع من نوع واحد، ثم نغيّر بالضبط العدد الذي يلزم
      ليتطابق المجموع.
  pattern:
    name: البحث عن نمط
    what: >-
      انظروا إلى الخطوات الأولى وابحثوا عما يتكرر. فالجزء المتكرر يتيح القفز
      بعيدًا إلى الأمام دون رسم كل ما في الوسط.
    when: "الأنماط، والسلاسل، والتقويم: «أيها سيكون العشرين»، «أيها سيكون المئة»."
    task: >-
      أعلام معلّقة بهذا الترتيب: أحمر، أصفر، أخضر، أزرق، ثم أحمر، أصفر، أخضر،
      أزرق من جديد، وهكذا. ما لون العلم رقم 23؟
    steps:
      - "نجد الجزء المتكرر: أحمر، أصفر، أخضر، أزرق، أي أربعة أعلام."
      - في 23 علمًا 5 مجموعات كاملة من أربعة، أي 20 علمًا، و3 أعلام أخرى.
      - العلم رقم 23 هو الثالث في مجموعته الرباعية، والثالث دائمًا أخضر.
    answer: أخضر.
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21، 22، 23
    caption: >-
      لا حاجة إلى رسم ثلاثة وعشرين علمًا: يكفي أن نرى أي موضع يأخذه العلم في
      مجموعته الرباعية.
  opposite:
    name: افتراض العكس
    aka: برهان الخُلف
    what: >-
      لإثبات أن أمرًا ما لا يمكن أن يكون، افترضوا أنه ممكن، وتابعوا الاستدلال
      حتى تصلوا إلى تناقض. وبهذه الطريقة تُحلّ كل مسائل «الفرسان والكذابون»
      تقريبًا.
    when: «هل يمكن ذلك»، «إثبات أن ذلك مستحيل»، من يقول الصدق.
    task: >-
      في جزيرة يعيش فرسان يقولون الصدق دائمًا، وكذابون يكذبون دائمًا. قالت
      أسماء: «بلال كذاب». وقال بلال: «أنا وأسماء كلانا من الفرسان». من يكون كل
      منهما؟
    steps:
      - >-
        **لنفترض أن بلالًا فارس.** عندها يكون كلامه صادقًا، وتكون أسماء فارسة
        أيضًا. لكن أسماء، وهي فارسة، قالت إن بلالًا كذاب. **تناقض.**
      - "إذن بلال كذاب، وكلامه غير صحيح: فهو وأسماء ليسا فارسين معًا. وهذا لا تناقض فيه."
      - "قالت أسماء: «بلال كذاب»، وهذا صحيح. ولا يقول الصدق إلا الفارس، إذن أسماء فارسة."
    answer: أسماء فارسة، وبلال كذاب.
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: أ
      borya: ب
      anya-said: «بلال كذاب»
      borya-said: «أنا وأسماء كلانا من الفرسان»
    pictures:
      said: «بلال كذاب»
      false: «كلانا من الفرسان» غير صحيح
      true: «بلال كذاب» صحيح
    caption: أحد الطريقين يؤدي إلى طريق مسدود، إذن الآخر هو الصحيح.
  parity:
    name: مراقبة الزوجية
    what: >-
      أحيانًا لا حاجة إلى معرفة كل شيء: تكفي معرفة هل العدد زوجي أم فردي. فإذا
      كان شيء ما يتبدّل بين الزوجي والفردي في كل خطوة، فإن عدد الخطوات يبيّن
      فورًا أين يمكن الوصول وأين لا يمكن.
    when: قفزات، ونقلات، وتبديلات، «بالتناوب»، «هل يمكن أن يحصل ذلك».
    task: >-
      يقف جندب عند الصفر على خط الأعداد. وكل قفزة تنقله مسافة 1 بالضبط إلى
      اليسار أو إلى اليمين. هل يمكن أن يعود إلى الصفر بعد 5 قفزات؟
    steps:
      - "نلوّن الخانات بالتناوب: زوجية وفردية."
      - "كل قفزة تغيّر اللون: من خانة زوجية إلى خانة فردية، وبالعكس."
      - بعد 5 قفزات، وهو عدد فردي، يكون الجندب حتمًا على خانة فردية، والصفر زوجي.
    answer: لا، لا يمكن.
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: الزرقاء زوجية، والبرتقالية فردية، والمؤشر نقطة البداية
      jumps: كل قفزة، ولون الخانة بعدها
      after: بعد القفزة رقم 5، خانات فردية فقط
    caption: >-
      لا حاجة إلى تتبّع المكان الذي ذهب إليه الجندب بالضبط: يكفي تتبّع لون
      خانته.
  pigeonhole:
    name: الحمام والأعشاش
    aka: مبدأ برج الحمام
    what: >-
      إذا كان عدد الحمام أكبر من عدد الأعشاش، ففي عش ما حمامتان على الأقل.
      يبدو ذلك بديهيًا، لكنه يثبت أمورًا يبدو التحقق منها مستحيلًا.
    when: «إثبات أنه لا بد من وجود»، «اثنان على الأقل»، «بالتأكيد».
    task: >-
      كم مرة يجب رمي حجر النرد للتأكد من أن عددًا ما يظهر مرتين على الأقل؟
    steps:
      - "لحجر النرد 6 أعداد: هي 6 «أعشاش». والرميات هي «الحمام»."
      - "بعد 6 رميات قد تبقى الأعداد كلها مختلفة: 1، 2، 3، 4، 5، 6."
      - "الرمية السابعة لا يبقى لها عش فارغ: لا بد أن يظهر عدد ما للمرة الثانية. إذن 7 رميات."
    answer: 7 رميات.
    pictures:
      throw: النقطة الزرقاء رمية
      seventh: الرمية رقم 7 تقع في خانة مشغولة
    caption: حتى لو اختلفت الرميات الست الأولى كلها، فلا بد أن تكرر الرمية السابعة نتيجة إحداها.
  mirror:
    name: محاكاة نقلات الخصم كالمرآة
    aka: استراتيجية التماثل
    what: >-
      في الألعاب الثنائية كثيرًا ما يفوز من يستطيع محاكاة نقلات الآخر كالمرآة.
      فعندها يكون له رد دائمًا، ما دام لخصمه نقلة.
    when: "الألعاب الثنائية: «من يفوز باللعب الصحيح»."
    task: >-
      شريط من 9 مربعات. يتناوب لاعبان على وضع قطعة في مربع فارغ لا يجاور مربعًا
      مشغولًا. ومن لا يستطيع وضع قطعة يخسر. أين يجب أن يضع اللاعب الأول القطعة
      الأولى ليفوز، مهما كان لعب الآخر؟
    steps:
      - في النقلة الأولى نضع قطعة في المنتصف، في المربع الخامس.
      - "نرد على كل نقلة للخصم بمثلها كالمرآة: في المربع المقابل عبر المنتصف."
      - إذا كان مربع الخصم فارغًا ولا يجاور قطعة، فكذلك المربع المقابل له. إذن تنفد نقلات الخصم أولًا.
    answer: في المنتصف، المربع رقم 5، ثم الرد على كل نقلة بمثلها كالمرآة.
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: اللاعب الأول
      second: اللاعب الآخر
      moves: العدد هو رقم النقلة
    pictures:
      answer: الآخر يأخذ المربع 1، والرد في المربع 9
      stuck: "كل مربع فارغ يجاور مربعًا مشغولًا: خسر اللاعب الآخر"
    caption: >-
      للشريط منتصف واحد، ولكل مربع آخر مربع مقابل كالمرآة. ولهذا لا تنفد نقلات
      اللاعب الأول أبدًا.

labels:
  when: "متى يفيد:"
  task: مسألة · {grades}
  show: عرض الحل
  hide: إخفاء الحل
  topics: "في المواضيع:"

cues:
  title: أي أسلوب نجرّب
  lead: >-
    إشارة من كلمات المسألة، وليست قاعدة: فكثير من المسائل يُحلّ بأسلوبين في
    آن واحد.
  if: إذا كان في المسألة…
  try: …فجرّبوا
  rows:
    - «أكثر بكذا»، الأعمار، أجزاء الكل
    - أشخاص وأشياء كثيرة، ومعلومات فيها كلمة «لا»
    - أعداد كبيرة، ولا يتضح من أين البداية
    - «بكم طريقة»، «كم عددًا»
    - النهاية معروفة، والسؤال عن البداية
    - نوعان من الأشياء ومجموع
    - "شيء يتكرر: «أيها سيكون العشرين»"
    - «هل يمكن ذلك»، «إثبات أن ذلك مستحيل»
    - «بالتأكيد»، «اثنان على الأقل»
    - "لعبة ثنائية: «من يفوز»"
