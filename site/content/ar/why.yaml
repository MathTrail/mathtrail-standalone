# The page "Why", for a parent, in Arabic: why olympiad maths is worth a
# child's time, how long people have learned it, what research has found about
# it, how it differs from a school lesson, what a parent can do, how MathTrail
# goes about it, and why it is no ordinary app. The grades, the topics' names
# and the card's own words are not here: they are the catalog's numbers and the
# widget's words. The card's options, its drawing, the history's pictures and
# the works the page cites are the site's data; a finding here says what its
# work found, no more.

title: لماذا رياضيات الأولمبياد
description: لماذا تستحق مسائل الأولمبياد وقت الطفل، وما الذي توصلت إليه الأبحاث بشأنها، وكيف يمكن لأحد الوالدين المساعدة باستخدام MathTrail.

# The label of the note that says plainly what the page does not promise.
honest: بصراحة

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: سياج طوله 12 مترًا. تقف الأعمدة كل 3 أمتار، بما في ذلك عند الطرفين. كم عمودًا هناك؟
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: عُدّت الفواصل بدل الأعمدة.
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4 فواصل. في السياج المستقيم الذي تقف أعمدته عند طرفيه، يزيد عدد الأعمدة على عدد الفواصل بواحد. 4 + 1 = 5 أعمدة.

hero:
  title: لماذا رياضيات الأولمبياد لطفلكم
  lead: تعلّم المدرسة حل المسألة على غرار مثال محلول في الفصل. أما مسائل الأولمبياد فتعلّم إيجاد الطريق حين لا يوجد مثال يُحتذى به. وحتى الصف {last} يمكن لأحد الوالدين إعداد الطفل لها، وقد صُمّم MathTrail لهذا الغرض.
  free: مجاني
  open: مفتوح المصدر
  school:
    label: تمرين مدرسي
    text: يلزم معرفة القسمة.
    sum: 12 ÷ 3 = 4
  olympiad:
    label: مسألة أولمبياد
    answer: "الإجابة: {answer}"
    trap: "الفخ: 4 هو عدد الفواصل لا الأعمدة"
    text: يلزم فهم ما يجري.
  caption: الأعداد نفسها، لكن طريقة التفكير مختلفة.

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: يُعلَّم التفكير من دون مثال يُحتذى منذ أكثر من ألفي عام
  lead: المسائل غير النمطية ليست أمرًا جديدًا. ففي بلدان كثيرة وعلى مدى قرون عديدة، تعلّم الناس إيجاد حل لم يعرضه عليهم أحد، وتفسير سبب صحته، ونقل كل جيل هذه المهارة إلى الجيل التالي.
  quote: «لا يوجد طريق ملكي إلى الهندسة».
  quoted: إقليدس للملك بطليموس، الذي سأله هل يمكن تعلّم الهندسة بطريقة أسهل من «الأصول». هكذا يروي برقلس القصة في القرن الخامس.
  # What a screen reader calls the choice of a picture.
  choice: صور من التاريخ
  eras:
    - label: العالم القديم · حتى القرن السادس
      title: البراهين وكتب المسائل
      text: بدأ الإغريق يبرهنون لماذا تصح القاعدة. وفي الصين جمع كتاب «الدروس التسع لفن الرياضيات» 246 مسألة مع حلولها. وفي الهند صارت الأعداد تُكتب بالصفر، كما نكتبها حتى اليوم.
    - label: العصور الوسطى وما بعدها · من القرن التاسع إلى التاسع عشر
      title: المسألة بوصفها تحديًا
      text: في بغداد ألّف الخوارزمي الكتاب الذي أخذت لغات العالم من عنوانه كلمة «الجبر». وفي إيطاليا تبارز علماء الرياضيات بالمسائل، وفي اليابان عُلّقت المسائل في المعابد على ألواح خشبية.
    - label: أواخر القرن التاسع عشر والقرن العشرون
      title: مسائل لكل طفل
      text: "صار الأطفال جميعًا يذهبون إلى المدرسة، وحظي الأكثر فضولًا بينهم بنوادي الرياضيات والأولمبيادات: في المجر منذ 1894، وفي لينينغراد منذ 1934."
    - label: اليوم
      title: مرشد لكل طفل
      text: "كان المرشد الشخصي في الماضي حكرًا على القلة: علّم أرسطو الإسكندر الأكبر. أما اليوم فبالإمكان أن يكون لكل طفل مرشد. والرفيق في مدرب MathTrail لا يعطي الإجابة أبدًا: فهو، مثل كبار المعلمين في الماضي، يطرح الأسئلة التي تقود الطفل إلى الحل."
      link: التعرّف على المدرب ←
  pictures:
    athens:
      place: اليونان
      alt: "جزء من لوحة جدارية: عالم أشيب ينحني على لوح ويرسم بالفرجار، وحوله أربعة تلاميذ."
      caption: إقليدس يرسم بالفرجار على لوح بينما يراقبه تلاميذه؛ ويقول البعض إنه أرخميدس. جزء من جدارية رفائيل «مدرسة أثينا»، 1509–1511.
    confucius:
      place: الصين
      alt: "لوحة: معلّم يجلس بين تلاميذه في الهواء الطلق، وهم يصغون ويتجادلون."
      caption: كونفوشيوس مع تلاميذه. كان الحساب أحد «الفنون الست» التي كان على الشخص المتعلّم أن يعرفها. لوحة من القرن التاسع عشر لفنان مجهول.
    aryabhata:
      place: الهند
      alt: "تمثال أبيض: عالم ملتف بعباءة يمد يده."
      caption: "أريابهاتا، عالم رياضيات وفلك هندي من القرن الخامس. لا أحد يعرف كيف كان يبدو: هذا تمثال حديث في بونه."
    istanbul:
      place: العالم الإسلامي
      alt: "منمنمة: علماء بعمائم يعملون بكرة أرضية وأدوات وكتب."
      caption: فلكيون وعلماء رياضيات يعملون في مرصد تقي الدين في إسطنبول. منمنمة عثمانية من أواخر القرن السادس عشر.
    pacioli:
      place: إيطاليا
      alt: "لوحة شخصية: راهب من علماء الرياضيات يشير إلى لوح كُتب عليه Euclides، وبجانبه تلميذ، وفوق الطاولة يتدلى متعدد سطوح زجاجي."
      caption: عالم الرياضيات لوكا بتشولي مع تلميذ. على حافة اللوح الذي عليه الرسم كُتب «Euclides». لوحة شخصية من عام 1495، تُنسب إلى ياكوبو دي بارباري.
    sangaku:
      place: اليابان
      alt: لوح خشبي عليه رسوم ملوّنة لدوائر، وأعمدة من الحروف.
      caption: "سانغاكو، لوح عليه مسائل هندسية، في ضريح كونّو هاتشيمان-غو في طوكيو، 1859. تصوير: Momotarou2012، بترخيص CC BY-SA 3.0."
    rachinsky:
      place: روسيا
      alt: "لوحة: صبية بقمصان الفلاحين يقفون أمام سبورة عليها مسألة ويفكرون، وأحدهم في المقدمة يسند ذقنه إلى يده."
      caption: "تلاميذ مدرسة قروية يحلّون ذهنيًا مسألة من السبورة: (10² + 11² + 12² + 13² + 14²) ÷ 365. نيكولاي بوغدانوف-بيلسكي، «الحساب الذهني. في مدرسة س. أ. راتشينسكي الشعبية»، 1895."
    st-louis:
      place: الولايات المتحدة
      alt: "صورة لفصل دراسي: أطفال يكتبون أعمدة من الأعداد على السبورة، والمعلمة تساعد فتاة، والبقية يجلسون إلى مقاعدهم ومعهم كتب."
      caption: تلاميذ الصف الثاني يحلّون تمارين على السبورة. مدرسة بيتس، سانت لويس، أوائل القرن العشرين.
    moscow:
      place: الاتحاد السوفيتي
      alt: "صورة: تلميذ عند سبورة عليها رسوم في الهندسة الفراغية يلتفت إلى الخلف ويبتسم."
      caption: "امتحان مدرسي: تلميذ عند السبورة أمام مسألة في الهندسة الفراغية. موسكو، خمسينيات القرن العشرين. تصوير: Yu. D. Korolev، الأرشيف الرئيسي لموسكو، بترخيص CC BY 4.0."
    coach-canvas:
      place: MathTrail
      chip: حل على لوحة الرسم
      alt: "شاشة جهاز لوحي: مسألة عن أعمدة على طول طريق، ورسم تقريبي منقّط على لوحة الرسم، وبجانبه تلميح الرفيق الثعلب والخطوات: الفهم والتخطيط والحل والتحقق."
      caption: "النموذج الأولي لمدرب MathTrail: يُرسم الحل بيد الطفل على لوحة الرسم، ويقترح الرفيق البدء بأعداد صغيرة."
    coach-sheet:
      place: MathTrail
      chip: مسائل من ورقة
      alt: "شاشة جهاز لوحي: الكاميرا تلتقط ورقة عليها مسائل أولمبياد، وقد وجد المدرب فيها ست مسائل."
      caption: "النموذج الأولي لمدرب MathTrail: بعد تصوير الطفل لورقة مسائل، يجد المدرب فيها ست مسائل."
    coach-map:
      place: MathTrail
      chip: خريطة المواضيع
      alt: "شاشة جهاز لوحي: خريطة لمواضيع الأولمبياد في ثلاث خطوات، من الأسس إلى المسائل الصعبة، وبجانبها موضوع حصر الحالات ومرحلة الطفل فيه."
      caption: "النموذج الأولي لمدرب MathTrail: خريطة للمواضيع من الأبسط إلى الأصعب، ومرحلة الطفل في كل منها."

research:
  title: ما توصلت إليه الأبحاث
  lead: تُطرح مسائل الأولمبياد على الأطفال منذ أكثر من قرن، لكن الدراسات الدقيقة لأثرها قليلة. وهذه أربع منها.
  # Each finding under a tag of where and whom, a short line in large letters
  # with a line under it, and the words of the small drawing under its text.
  findings:
    rebholz2022:
      tag: ألمانيا · الصفوف 3–4
      big: دورة مسائل
      small: ونتائج أفضل على صعيدين
      title: أثر الإعداد يظهر في المدرسة أيضًا
      text: في ألمانيا، التحق تلاميذ من الصفين الثالث والرابع بدورة في مسائل بأسلوب الأولمبياد. وفي أولمبياد الرياضيات حققوا نتائج أفضل بوضوح من الأطفال الذين شاركوا دون الدورة، كما حقق تلاميذ الصف الرابع نتائج أفضل في اختبار مدرسي للرياضيات. وكان معلموهم قد اختاروهم للدورة.
      mark:
        - في الأولمبياد
        - في اختبار مدرسي
    biondi2012:
      tag: البرازيل · 2009
      big: 19 مليونًا
      small: من التلاميذ شاركوا في عام واحد
      title: مدارس الأولمبياد تحقق درجات أعلى في الرياضيات
      text: أولمبياد الرياضيات للمدارس الحكومية في البرازيل مفتوح لكل تلميذ، وقد شارك فيه 19 مليونًا في عام 2009. وكانت نتائج الرياضيات لدى تلاميذ الصف التاسع في الاختبار الوطني أفضل في المدارس المشاركة، وكانت أفضل كلما زادت سنوات مشاركتها.
      mark: كلما زادت سنوات المشاركة ارتفعت الدرجات
    agarwal2020:
      tag: الأولمبياد الدولي
      big: IMO
      small: كلما ارتفعت الدرجة، كان المسار العلمي أبعد
      title: التفوق في الأولمبياد يقود بعيدًا في العلم
      text: كلما ارتفعت درجات المراهقين في الأولمبياد الدولي للرياضيات، زاد احتمال أن يحصلوا لاحقًا على الدكتوراه، وأن ينشروا أبحاثًا، وأن يُستشهد بأعمالهم، وأن ينالوا أرفع الجوائز في الرياضيات.
      mark:
        - الدكتوراه
        - الأبحاث
        - الاستشهادات
        - أرفع الجوائز
    nunes2007:
      tag: المملكة المتحدة · 6 سنوات
      big: 16 شهرًا
      small: منطق أطفال السادسة تنبّأ بمستواهم في الرياضيات
      title: التفكير المنطقي يُتعلَّم منذ السادسة
      text: تنبّأت جودة التفكير المنطقي لدى أطفال السادسة بمستواهم في الرياضيات بعد 16 شهرًا. والأطفال الذين دُرّبوا على هذا النوع من التفكير تقدّموا في الرياضيات أكثر من الذين لم يُدرَّبوا عليه.
      mark:
        from: 6 سنوات
        to: +16 شهرًا

school:
  title: المدرسة والأولمبياد يعلّمان أشياء مختلفة
  lead: ليس في هذا لوم للمدرسة، فلها مهمة أخرى. لكن مهارة إيجاد الحل حين لا تُعطى طريقة لا تظهر من تلقاء نفسها. إنها تُكتسب بالتدريب.
  lesson: درس عادي
  olympiad: مسألة أولمبياد
  # Above the rows, an example of each: a school sum with its answer left
  # blank, and the fence in short, with its posts.
  example: مثال
  sum: 12 ÷ 3 =
  done: "عُرضت الطريقة في الفصل: لم يبق إلا تكرارها."
  fence: سياج طوله 12 م، والأعمدة كل 3 م، بما في ذلك عند الطرفين. كم عمودًا؟
  found: "لا تُعطى طريقة، ويجب إيجادها: 4 فواصل، وعدد الأعمدة يزيد على عدد الفواصل بواحد، إذن 5."
  rows:
    shape:
      label: بنية المسألة
      lesson: تُعرض طريقة، ثم تُكرَّر على أمثلة مشابهة
      olympiad: لا تُعطى طريقة، ويجب إيجادها
    valued:
      label: ما يُقدَّر
      lesson: العمل بسرعة ومن دون هفوات
      olympiad: فهم ما يجري، وتفسير السبب
    mistake:
      label: ماذا يعني الخطأ
      lesson: خسارة درجة
      olympiad: إشارة إلى الموضع الذي انحرف فيه التفكير عن الطريق الصحيح
    teaches:
      label: ماذا يعلّم
      lesson: استعمال أداة مألوفة
      olympiad: ابتكار أداة حين لا توجد أداة

time:
  title: لماذا لا تجد المدرسة وقتًا لذلك
  # Each card with the words of the small drawing at its foot.
  cards:
    syllabus:
      title: منهج للفصل كله
      text: على المعلم أن يوصل كل تلميذ إلى المستوى المطلوب. ومن الصعب إيجاد ساعات لمسائل خارج المنهج.
      lesson: حصة
      length: 45 دقيقة
      all: المنهج للجميع
      extra: مسائل خارجه
    answer:
      title: الاختبار يرى الإجابة لا التفكير
      text: يتحقق الاختبار من النتيجة. ونادرًا ما يتسع الوقت لمراجعة طريقة تفكير الطفل، والموضع الذي أخطأ فيه التفكير بالضبط.
      steps: "خطوات الحل: لا تُراجَع"
      answer: "الإجابة: {answer}"
    circle:
      title: نادي الرياضيات ليس متاحًا في كل مكان
      text: لا تضم كل مدرسة ناديًا للأولمبياد، وقد يكون النادي الأقرب بعيدًا أو لا يقبل إلا الأطفال الأكبر سنًا.
      none: لا يوجد
      circle: النادي

parent:
  title: يمكن لأحد الوالدين إعداد الطفل
  note: لا يحل MathTrail محل معلم رياضيات الأولمبياد، والنادي القوي بإشراف مدرب يقدّم أكثر. لكن حتى الصف {last} يمكنكم بأنفسكم إعداد الطفل للأولمبياد.
  unneeded:
    title: لا تحتاجون إلى
    items:
      - شهادة في الرياضيات
      - معرفة الحلول مسبقًا
      - البحث عن المسائل والتحقق منها
  taken:
    title: يتولى MathTrail
    items:
      - المسائل
      - الإجابات
      - شرح الأخطاء
      - اختيار المستوى
  needed:
    title: ما المطلوب منكم
    items:
      - title: فضول طفلكم
        text: مسألة الأولمبياد لغز، لا اختبار. والمطلوب من الطفل الفضول، لا الخوف من الخطأ.
      - title: شرح الغاية من ذلك
        text: لا «للحصول على أعلى الدرجات»، بل لتعلّم ابتكار طريق حين لا يدلّ عليه أحد.
      - title: وقتكم واهتمامكم
        text: قليل من الوقت بجانب طفلكم، ومن الأفضل أن يتكرر كثيرًا بدل أن يطول دفعة واحدة. واهتمامكم بالمسألة سريع العدوى.
  # Three moments of a lesson, each with what the child says and what the
  # parent might answer; the letters stand for who speaks.
  explain:
    title: كيف تشرحون للطفل الغاية من ذلك
    lead: "ثلاث لحظات شائعة، وما يمكنكم قوله فيها. ط: طفلكم."
    child: ط
    you: أنتم
    talks:
      why:
        moment: سؤال «ما الفائدة؟»
        child: لماذا أحتاج إلى هذه المسائل؟ لم يطلبها مني أحد.
        you: "هي مثل اللغز: الإجابة مخبأة، ويمكن العثور عليها."
      wrong:
        moment: إجابة خاطئة
        child: أخطأتُ مرة أخرى…
        you: "هنا يُسمح بالخطأ: فالخطأ يدلّ على الموضع الذي يحتاج إلى تفكير جديد."
      right:
        moment: إجابة صحيحة
        child: انتهيت! الإجابة خمسة.
        you: الأجمل ليس الإجابة، بل طريق الوصول إليها.

thinking:
  title: كيف يعلّم MathTrail التفكير
  lead: لا بعدد المسائل، بل بما يحدث حول كل مسألة.
  points:
    - title: مسألة واحدة، فكرة واحدة
      text: تنتمي كل مسألة إلى موضوع، مثل «{enumeration}» أو «{parity}» أو «{knights}». وتشكّل المواضيع خريطة من الأبسط إلى الأصعب.
    - title: مسألة في المتناول
      text: "لكل موضوع تصنيفه الخاص، وبه يختار MathTrail ما يأتي بعد ذلك: الموضوع ومستوى الصعوبة؛ أما الصف فلا يحدد إلا نقطة البداية."
    - title: الخطأ تشخيص
      text: وراء كل خيار خاطئ فخ له اسم. ويبدأ الشرح من طريقة تفكير الطفل، لا من الإجابة الصحيحة.
    - title: تلميح بدل الإجابة
      text: "يمكن للطفل فتح تلميح على البطاقة، ويمكن للشخص البالغ السؤال في الدردشة بكلمات الطفل نفسها: «لماذا ليس 6؟». ويجيب النموذج عن هذه المسألة بالذات."
