title: الأبحاث
description: الأرقام التي يقوم عليها MathTrail. كيف تحجب فحوصه المسألة عن الطفل إلى أن تخلو من أي خطأ، وكيف يقف نموذج المتعلّم فيه أمام أهدافه، ومن أين جاءت أفكار مسائله.

hero:
  badge: للجمهور التقني
  title: النموذج يكتب،
  title_end: والخدمة تتحقق.
  lead: كيف لا يسمح MathTrail للمسألة بالوصول إلى الطفل إلا بعد أن تجتاز {count} {noun}، وما لا تراه الفحوص.
  paper: الورقة البحثية كاملة · PDF في {count} {noun}
  code: الشيفرة والبيانات
  flow:
    task: المسألة
    example: سياج طوله {length} م، فيه عمود كل {gap} م، بما في ذلك الطرفان. كم عمودًا فيه؟
    solver: برنامج الحل
    sum: "{length} ÷ {gap} + {one} = {posts} → {letter}"
    hands_in: المسألة وبرنامج حلها
    back: تُرفض وتُعاد
    twice: برنامج الحل يعمل مرتين
    asks: خيار صحيح واحد · كلمات تناسب الصف · لا تكرار لمسائل سابقة
    passed: اجتازت كل الفحوص
    sealed: الإجابة مختومة حتى إجابة الطفل
  grades: الصفوف {first}–{last}
  licence: شيفرة مفتوحة المصدر، رخصة MIT

theses:
  title: أربعة أمور تبيّنها الورقة البحثية
  writes:
    title: نموذج الدردشة يكتب
    text: كل مسألة يكتبها نموذج الدردشة التي تستخدمها الأسرة أصلًا، بلغة الطفل وحول قصة قريبة من عالم الطفل. ولا يستدعي MathTrail أي نموذج خاص به. فهو خدمة صغيرة حتمية لا تحتفظ بأي شيء عن الطفل بين طلب وآخر.
    model: نموذج الدردشة
    model_does: الكتابة
    service: MathTrail
    service_does: التحقق
    child: الطفل
    child_does: الحل
  twice:
    title: برنامج الحل يعمل مرتين
    text: يكتب النموذج مع المسألة برنامجًا قصيرًا يحسب الإجابة ويذكر حرف الخيار الصحيح. تشغّل الخدمة البرنامج، ثم تزيح الحروف بمقدار {count} {noun}، فما كان {from} يصبح {to}، ثم تشغّله مرة أخرى. فالبرنامج الذي يحسب الإجابة يجدها في موضعها الجديد، أما الذي كتب الحرف يدويًا فلا يجدها. ويأتي التشغيل الثاني حين يختار الأول خيارًا واحدًا لا غير.
    first: التشغيل الأول
    second: التشغيل الثاني، بعد إزاحة الحروف
    picks: → {letter}
    caption: البرنامج الذي كتب «{letter}» يدويًا يشير في التشغيل الثاني إلى {value}، فتُرفض المسألة.
  sealed:
    title: الإجابة مختومة
    text: الإجابة والحل والشروح وبرنامج الحل مشفّرة ومحفوظة في الملف الشخصي للطفل على Google Drive الخاص بولي الأمر. وإلى أن تأتي إجابة الطفل، لا وجود لها في أي مما تسلّمه الخدمة إلى البطاقة أو إلى نموذج الدردشة، ولا في أي من سجلاتها.
    sees: ما يظهر للطفل
    seen: نص المسألة · الرسم · الخيارات · التلميح
    hidden: مختوم حتى الإجابة
    kept: الإجابة · الحل · الشروح
    cipher: XChaCha20-Poly1305 · مرتبط بالطفل وبالمسألة
    outside: ما لا يصل إليه الختم هو الدردشة نفسها. فالنموذج الذي كتب المسألة يعرف إجابتها، وسجلّ الأدوات التي استدعاها، الذي تحفظه الدردشة نفسها، يكشف الإجابة لأي شخص بالغ يفتحه.
  reach:
    title: أصعب قليلًا، لكن في المتناول
    text: يتنبأ نموذج المتعلّم باحتمال حلّ الطفل للمسألة، وتطلب الخدمة المسألة التي يكون احتمال حلها الأقرب إلى {middle}، أي منتصف الممر من {low} إلى {high}. ويبدأ العمل مع كل طفل بسلسلة تجريبية من {trial}، تُحدَّد بها نقطة البداية.
    guess: c = {guess}، تخمين خيار واحد من {options}
    corridor: الممر المستهدف

model:
  title: نموذج المتعلّم أمام أهدافه
  lead: مدى دقة متابعة الخدمة لمستوى الطفل، ومدى نجاحها في إبقاء المسائل في المتناول، ومدى ثقتها حين تعلن إتقان موضوع، وما يُعرض على الطفل في أواخر السلسلة. والأرقام من منصة المحاكاة، على أطفال افتراضيين، وهي محسوبة من الشيفرة التي بُني منها هذا الموقع.
  run:
    commit: commit {commit}، بتاريخ {date}
    size: "{children} × {answers}"
    seed: البذرة {seed}
  paper: تصف الورقة البحثية القاعدة كما كانت عند commit {commit}، وهو الذي حُسبت عليه أرقامها. أما هذه الصفحة فتتبع الخدمة كما تعمل الآن، ولذلك يختلف الاثنان.
  key:
    service: الخدمة الآن
    interval: فترة {interval}
    goal: الهدف
    ceiling: السقف، أي تقدير يعرف مستوى الطفل
  groups:
    step: كيف يتابع التقدير مستوى الطفل
    mastery: كيف يُعلَن الإتقان
    screen: ما يُعرض على الطفل في أواخر السلسلة
    screen_note: الإجابات {first}–{last} · الهدف ألا تزيد القيمة على قيمتها في الإجابات {earlyfirst}–{earlylast}
    context: للمقارنة، دون هدف
  rows:
    lag:
      name: التأخر عن مستوى الطفل مع التعلّم
      unit: لوجيت، الأقل أفضل · أفضل قيمة ممكنة {best}
    corridor_learning:
      name: المسائل في الممر {low}–{high}
      unit: مع التعلّم · نسبة من المسائل، الأكثر أفضل
    jump_unsettled:
      name: عدم اللحاق بعد قفزة
      unit: نسبة من الأطفال، الأقل أفضل
    false_mastery_static:
      name: حالات إتقان أُعلنت خطأً
      unit: نسبة من حالات الإتقان المعلنة، الأقل أفضل
    false_mastery_wide:
      name: حالات إتقان أُعلنت خطأً، مواضيع متباعدة
      unit: نسبة من حالات الإتقان المعلنة، الأقل أفضل
    late_mastery_static:
      name: الإجابات حتى إعلان الإتقان
      unit: إجابات، الأقل أفضل
    late_mastery_wide:
      name: الإجابات حتى إعلان الإتقان، مواضيع متباعدة
      unit: إجابات، الأقل أفضل
    card_move_static:
      name: مقدار تحرّك التصنيف
      unit: نقاط في معظم الإجابات، الأقل أفضل
    rank_changes_static:
      name: كم مرة تتغير المرحلة
      unit: تغيّرات لكل مئة إجابة، الأقل أفضل
    card_move_learning:
      name: التصنيف، مع التعلّم
      unit: نقاط في معظم الإجابات، الأقل أفضل
    rank_changes_learning:
      name: المرحلة، مع التعلّم
      unit: تغيّرات لكل مئة إجابة، الأقل أفضل
    error_static:
      name: خطأ التقدير بعد {after}
      unit: بلا تقدّم · لوجيت، الأقل أفضل
    corridor_static:
      name: المسائل في الممر {low}–{high}
      unit: بلا تقدّم · نسبة من المسائل، الأكثر أفضل
  interval: "{low}–{high}"
  goal_at_most: الهدف ≤ {bound}
  goal_at_least: الهدف ≥ {bound}
  ceiling: السقف {value}
  marks:
    reached:
      name: تحقّق
      means: الفترة كلها في الجانب الأفضل من الهدف.
    on_the_edge:
      name: على الحد
      means: الفترة تضم الهدف.
    not_reached:
      name: لم يتحقق
      means: الفترة كلها في الجانب الأسوأ من الهدف.
    baseline:
      name: خط الأساس
      means: الهدف مأخوذ من رقم الخدمة نفسها، فهو معيار للقاعدة التالية لا اختبار لهذه القاعدة.

live:
  title: البيانات الفعلية
  lead: هل تتحقق وعود النموذج مع أطفال حقيقيين، شهرًا بعد شهر. والأرقام مأخوذة من سجل الإجابات، دون أسماء ودون نص أي مسألة.
  rule: لا تُعرض الشريحة إلا إذا ضمّت {children} أو أكثر، و{answers} أو أكثر، ويُقرَّب كل عدد فيها إلى مضاعف للعدد {rounded}. أما الشريحة الأصغر من ذلك فتُستبعد بدل أن تُدمَج في شريحة أخرى.
  measures:
    chances: الموعود ← المتحقق
    kept_up: المتحقق − الموعود، حسب عدد الإجابات
    share: نسبة الإجابات الصحيحة في مسائل القاعدة
  frame:
    coming:
      badge: قريبًا
      when: تظهر الأرقام بعد احتساب شهر كامل، في أوائل الشهر الذي يليه.
    too_few:
      badge: البيانات لا تكفي بعد
      when: في {month}، كان عدد الأطفال الذين أجابوا عن مسائل القاعدة أقل من أن يُعرض أي رقم.
  ready:
    month: "{month}: شمل العدّ {children} و{answers} عن المسائل التي اختارتها القاعدة."
    weighed: لا تُحتسب إلا الإجابات عن المسائل التي اختارتها القاعدة، بعد السلسلة التجريبية من {trial} ومن دون تلميح، ومن كل الدردشات معًا.
    corridor: لا يمكن قياس نسبة المسائل في الممر على الإجابات الفعلية، لأن كل مسألة يُجاب عنها مرة واحدة.
    columns:
      promised: الموعود
      came_true: المتحقق
      answers: الإجابات
      children: الأطفال
    chances:
      none: في هذا الشهر لا تضم أي شريحة من الاحتمال الموعود عددًا كافيًا من الأطفال لعرضها.
      shown:
        caption: كل شريحة من الاحتمال الموعود نقطة، تكبر كلما زادت الإجابات فيها. وعلى القطر المتقطع يكون الوعد قد تحقق، والشريط هو الممر الذي تختار القاعدة المسائل فيه.
        up: ↑ نسبة الإجابات الصحيحة
        across: الاحتمال الموعود →
        ideal: الوعد متحقق
        band: الممر
        range: "{from}–{to}"
        heading: الاحتمال الموعود
    kept_up:
      none: في هذا الشهر لا تضم أي شريحة من أرقام إجابات الطفل عددًا كافيًا من الأطفال لعرضها.
      shown:
        caption: تُحتسب الإجابة الصحيحة واحدًا والخاطئة صفرًا، ويُطرح من ذلك الاحتمال الموعود، ثم يُحسب متوسط الفرق على الإجابات. وعلى يمين الخط المتقطع كان أداء الأطفال أفضل من الموعود، ويمتد خط الخطأ مسافة خطأ معياري واحد في كل اتجاه، محسوبًا على مستوى الأطفال.
        range: "{first}–{last}"
        open: "{first} فما بعد"
        heading: رقم الإجابة
        margin: المتحقق ناقص الموعود
        error: الخطأ المعياري
    share:
      expected: المتوقع ≈ {middle}، منتصف الممر
      caption: تطلب القاعدة المسألة التي يكون احتمالها الأقرب إلى {middle}، أي منتصف الممر من {low} إلى {high}. والنقطة هي نسبة الإجابات الصحيحة، والخط المتقطع هو منتصف الممر.

sources:
  title: من أين جاءت أفكار المسائل
  lead: حقوق المؤلف لا تحمي الأفكار، بل تحمي النصوص. لذلك لا يُؤخذ من الكتاب إلا فكرة المسألة وإجابتها، أما الصياغة والقصة والخيارات والفخاخ فتُكتب من جديد.
  authors:
    perelman:
      name: ياكوف بيرلمان
      books:
        firsthundred: For Young Mathematicians. The First Hundred Puzzles
        secondhundred: The Second Hundred Puzzles
        living: «الرياضيات المسلية»
        arithmetic: Entertaining Arithmetic
        quick: Quick Reckoning
    ignatyev:
      name: يميليان إغناتيف
      books:
        wit: In the Realm of Ingenuity, or Arithmetic for Everyone
    dudeney:
      name: هنري إ. دوديني
      books:
        amusements: Amusements in Mathematics
        canterbury: The Canterbury Puzzles
    loyd:
      name: سام لويد
      books:
        cyclopedia: Cyclopedia of Puzzles
    carroll:
      name: لويس كارول
      books:
        tangled: A Tangled Tale
        pillow: Pillow Problems
  died: ت {year}
  public: في الملك العام
  public_note: انتهت مدة حقوق المؤلف لهذه الكتب. فهي ملك للجميع، ويحق لأي أحد استخدامها مجانًا.
  collections:
    mathnet:
      name: MathNet
      note: مجموعة مفتوحة من مسائل الأولمبياد من دول كثيرة. لكل موضوع قائمة أفكار تُبنى عليها مسائله، وبعض هذه الأفكار للصفوف {first}–{last} مأخوذ من هذه المجموعة. وبعض الدول تحتفظ بحقوق مسائلها، لذلك لا يُؤخذ من هنا أيضًا إلا الفكرة، ولا يُؤخذ النص أبدًا.
  total: في المجموع، {count} {noun}
  each: لكل منها برنامج حل، وخلف كل خيار خاطئ فخ
  level: "{count} · الصفوف {first}–{last}"
  note: يتبع الأسلوب مجموعات المسائل السوفيتية. وليس في المسألة المرجعية حقل لمصدرها، لذا لا يمكن تسمية صاحب فكرة أي مسألة بعينها.

