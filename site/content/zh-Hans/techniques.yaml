# The page of the techniques of olympiad problem solving, for a parent, in
# Simplified Chinese. Which techniques there are, their groups and order, the
# topics each one leads to, and each example's level and the answer its solver
# proves are the site's data; the words here follow them, technique by
# technique. The pictures of a technique's steps are laid out by the page, and
# only their words are here.

title: 奥数题的解题方法与技巧
description: 能一下子解开许多奥数题的解题技巧和解题思路，每种技巧都配有一道例题、一幅图和详细解答，另有一份该试哪种技巧的提示。

hero:
  title: 奥数解题技巧
  lead: >-
    奥数题没有现成的解法，但有一些技巧能同时用在许多题上。这里收集了最常用到的{count}，每种都配有一道例题、一幅图和解答。
  advice: >-
    打开解答之前，请先和孩子一起试着做一做。最重要的是看出是哪种技巧起了作用，下次就能认出它来。

start:
  title: 任何一道题，从哪里开始
  lead: >-
    选择技巧之前，先走一遍下面四个步骤会很有帮助。数学家乔治·波利亚在他的著作《*怎样解题*》（1945年）中提出了这四步。
  steps:
    - title: 理解题目
      text: 用自己的话说一说。你知道什么？要找的是什么？
    - title: 拟订方案
      text: 它让你想起了什么？这一页上的哪种技巧可以试一试？
    - title: 执行方案
      text: 一步一步来，把每一步得到的结果写下来。
    - title: 回顾
      text: 把答案代回题目里。全都对得上吗？会不会还有别的答案？

groups:
  see:
    title: 看清题目
    lead: >-
      首先要读懂题目。这些技巧能把文字变成一幅图、一张表或一个小例子。
  find:
    title: 找到答案
    lead: >-
      弄清题目在说什么之后，这些技巧能一路引向答案，途中什么都不会漏掉。
  prove:
    title: 证明
    lead: >-
      奥赛中的问题常常不是“有多少”，而是“有没有可能”。这时光会数还不够，还要讲清楚为什么不可能是别的样子。

techniques:
  draw:
    name: 把题画出来
    what: >-
      一幅画或一张示意图，能把文字变成看得见的东西。线段、点和箭头就够了，不必画得好看。
    when: “比……多……”、年龄、行程、整体的部分。
    task: >-
      哥哥比妹妹大4岁。两人的年龄加起来是16岁。哥哥几岁？
    steps:
      - 把妹妹的年龄画成一条线段，哥哥的年龄画成同样长的线段再加上4岁。
      - 去掉多出的4岁：16 − 4 = 12。这是两条一样长的线段。
      - 一条线段是12 ÷ 2 = 6岁，这就是妹妹。哥哥是6 + 4 = 10岁。
    answer: 哥哥10岁。
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: 上：妹妹，下：哥哥；合起来16岁
      less: 16 − 4 = 12，两条一样长的线段
      found: 哥哥是6 + 4 = 10岁
    caption: >-
      示意图把脑子里难以理清的关系摆在眼前：去掉多出的四岁，哥哥和妹妹一样大。
  table:
    name: 列个表格
    what: >-
      线索一多，就很难全记在脑子里。表格会替您记着：每条线索就是一个叉，哪一行只剩下一个空格，那就是答案。
    when: 好几个人、好几样东西，还有带“不”字的线索。
    task: >-
      小雅、小斌和小薇养了一只猫、一只狗和一只鹦鹉，每人养一只。小雅养的不是猫。小斌怕狗。猫不住在小斌家。谁养的是哪种宠物？
    steps:
      - 按每条线索画叉：小雅，不是猫；小斌，不是狗；猫，不在小斌家。
      - 小斌那一行只剩一个格子：鹦鹉。所以小雅和小薇都没有养鹦鹉。
      - 小雅只剩下狗，小薇只剩下猫。
    answer: 小雅养狗，小斌养鹦鹉，小薇养猫。
    pictures:
      children:
        anya: 小雅
        borya: 小斌
        vera: 小薇
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: 雅
        borya: 斌
        vera: 薇
      pets:
        cat: 猫
        dog: 狗
        parrot: 鹦鹉
    caption: 格子里的小数字，表示这一格是在解答的第几步标上的。
  small-numbers:
    name: 先试小数字
    aka: 特例
    what: >-
      数很大、看不出从哪里下手时，就用小数字来解同一道题。找出规律，再把它用到大数上。
    when: 很大的数、“一百”“一千”、很长的一排。
    task: >-
      沿着一条长100米的路立柱子，每隔5米立一根，两端也要立。一共需要多少根柱子？
    steps:
      - 一百米没法画出来，那就先取一条10米长的路。柱子立在0米、5米和10米处：3根柱子，2个间隔。
      - 15米和20米的路也一样：柱子总比间隔多一根。
      - 100米长的路上有100 ÷ 5 = 20个间隔，所以有21根柱子。
    answer: 21根柱子。
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: 10米：2个间隔，3根柱子
      fifteen: 15米：3个间隔，4根柱子
      twenty: 20米：4个间隔，5根柱子
      table: 路长（米）、间隔数和柱子数
    caption: >-
      在短短的路上就能看出规律，再把它用到一百米上就行了。
  systematic:
    name: 有序列举
    what: >-
      随意列举，难免会漏掉一些或者重复计数。有序列举是按顺序来的：先按一个特征分，再按下一个特征分。画树状图很方便。
    when: “有几种方法”“能组成几个数”“写出所有可能”。
    task: >-
      用数字2、4、6和8可以组成多少个不同的两位数？每个数里的数字不能重复使用。
    steps:
      - 先定好顺序：先选十位上的数字，再选个位上的数字。
      - 十位上的数字可以是2、4、6或8。每选定一个，个位上还剩另外三个数字可选。
      - 按分支逐一写出来：24、26、28、42、46、48、62、64、68、82、84、86。一个都没漏，也一个都没重复。
    answer: 12个数。
    pictures:
      first: 首位数字是四个中的一个
      total: 4个分支 × 3个数 = 12
    caption: 树状图让什么都漏不掉：每个首位数字都有自己的分支。
  backwards:
    name: 从结尾往回推
    aka: 倒推法
    what: >-
      知道故事的结局、要问开头是什么时，就倒着推。把每个动作都换成相反的动作：“吃掉”换成“还回去”，“乘”换成“除”。
    when: 知道最后的结果，要求出最开始有多少。
    task: >-
      碗里有一些苹果。小彤吃了其中的一半。接着小鹏吃了剩下的一半，又多吃了一个。最后还剩2个苹果。碗里原来有多少个苹果？
    steps:
      - 从已知的开始：最后剩下2个苹果。
      - 小鹏吃之前：把多吃的那一个还回去，2 + 1 = 3。这是一半，所以原来有6个。
      - 小彤吃之前：6个是一半，所以原来有12个。检验：12 → 6 → 6 − 3 − 1 = 2。
    answer: 12个苹果。
    pictures:
      end: 最后
      undo-petya: +1，×2
      undo-tanya: ×2
      check: 检验：
    caption: >-
      从右往左，每一步都反过来做：“吃了一半”变成“乘2”，“又多吃了一个”变成“加1”。
  all-the-same:
    name: 假设全都一样
    aka: 假设法
    what: >-
      题目里有两种东西时，先假设它们全都是同一种。算一算结果差了多少，就能看出要换掉几个。
    when: 两种东西，总数已知：头和脚，两种面值的硬币。
    task: >-
      院子里有一些鸡和兔子在散步。它们一共有10个头、28只脚。院子里有几只兔子？
    steps:
      - 假设10只全是鸡，那么就有10 × 2 = 20只脚。
      - 实际上有28只脚，多了8只。
      - 每把一只鸡换成一只兔子，就多出2只脚：8 ÷ 2 = 4只兔子。检验：4 × 4 + 6 × 2 = 28。
    answer: 4只兔子。
    # What each counter under the problem stands for.
    legend:
      hen: 鸡，2只脚
      rabbit: 兔子，4只脚
    pictures:
      guess: "= 20只脚"
      short: 缺少的脚
      fits: 4只兔子和6只鸡：16 + 12 = 28只脚
    caption: >-
      先当作全都一样来算，再换掉刚好需要的数量，让结果对上。
  pattern:
    name: 找规律
    what: >-
      看看前几步，找出重复的部分。有了这个重复的片段，就能一下子跳到很远的地方，不必把中间的都画出来。
    when: 图案、排列、日历：“第二十个是什么”“第一百个是什么”。
    task: >-
      一排旗子按顺序挂着：红、黄、绿、蓝，然后又是红、黄、绿、蓝，依此类推。第23面旗子是什么颜色？
    steps:
      - 找出重复的片段：红、黄、绿、蓝，共四面旗子。
      - 23面旗子是完整的5组，每组四面，共20面，还多出3面。
      - 第23面是它那一组里的第三面，而每组的第三面总是绿色。
    answer: 绿色。
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 第21、22、23面
    caption: >-
      不必画出二十三面旗子，只要看出这面旗子在它那组四面里排第几就行了。
  opposite:
    name: 假设相反的情况
    aka: 反证法
    what: >-
      要证明某件事不可能，就先假设它可能，然后一路推理下去，直到出现矛盾。几乎所有的真假话问题都是这样解的。
    when: “有没有可能”“证明这不可能”、谁说的是真话。
    task: >-
      岛上住着总说真话的骑士和总说假话的骗子。小雅说：“小斌是骗子。”小斌说：“我和小雅都是骑士。”谁是骑士，谁是骗子？
    steps:
      - >-
        **假设小斌是骑士**。那么小斌的话是真的，小雅也是骑士。可是身为骑士的小雅却说小斌是骗子。**矛盾**。
      - 所以小斌是骗子，小斌的话是假的：小雅和小斌并不都是骑士。这说得通。
      - 小雅说“小斌是骗子”，这句话是真的。只有骑士才说真话，所以小雅是骑士。
    answer: 小雅是骑士，小斌是骗子。
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: 雅
      borya: 斌
      anya-said: “小斌是骗子”
      borya-said: “我和小雅都是骑士”
    pictures:
      said: “小斌是骗子”
      false: “都是骑士”是假话
      true: “小斌是骗子”是真话
    caption: 一条路走进了死胡同，所以另一条路是对的。
  parity:
    name: 看奇偶
    what: >-
      有时候不必知道全部，只要知道一个数是偶数还是奇数就够了。如果某样东西每走一步都在偶数和奇数之间切换，那么根据步数，马上就能知道最后可能停在哪里、不可能停在哪里。
    when: 跳跃、移动、交换、“每隔一个”“能不能得到”。
    task: >-
      一只蚱蜢停在数轴的零点上。它每跳一次，都正好向左或向右移动1。跳了5次之后，它能回到零点吗？
    steps:
      - 把格子轮流涂上颜色：偶数格和奇数格。
      - 每跳一次，颜色就变一次：从偶数格跳到奇数格，或者反过来。
      - 跳了5次，次数是奇数，所以蚱蜢一定落在奇数格上，而零是偶数。
    answer: 不能。
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: 蓝色是偶数，橙色是奇数，箭头是起点
      jumps: 每一跳，以及跳完后所在格子的颜色
      after: 跳完第5次后，只可能在奇数格
    caption: >-
      不必追踪蚱蜢究竟跳到了哪里，只要盯住它所在格子的颜色就够了。
  pigeonhole:
    name: 鸽子和鸽巢
    aka: 抽屉原理
    what: >-
      如果鸽子比鸽巢多，那么总有一个鸽巢里至少有两只鸽子。这听起来理所当然，却能证明一些看似无法验证的事。
    when: “证明一定有”“至少两个”“保证”。
    task: >-
      一颗骰子至少要掷几次，才能保证某个点数至少出现两次？
    steps:
      - 骰子有6个点数，就是6个“鸽巢”。每掷一次就是一只“鸽子”。
      - 掷6次之后，点数仍有可能各不相同：1、2、3、4、5、6。
      - 第七次掷的时候已经没有空着的鸽巢了：一定有某个点数出现第二次。所以要掷7次。
    answer: 掷7次。
    pictures:
      throw: 一个蓝点代表掷一次
      seventh: 第7次落进了已被占的格子
    caption: 即使前六次掷出的点数都不一样，第七次也一定会和其中某一次重复。
  mirror:
    name: 对称地走
    aka: 对称策略
    what: >-
      在两人对弈的游戏中，赢家往往是能对称地模仿对方走法的人。这样只要对手还有棋可走，自己就总有一步可以应对。
    when: 两人游戏：“双方都走对时，谁会赢”。
    task: >-
      一个长条上有9个格子。两人轮流往空格里放一枚棋子，但不能放在已有棋子的格子旁边。谁放不下棋子谁就输。先手的第一枚棋子应该放在哪里，才能无论对方怎么走都赢？
    steps:
      - 第一步，把棋子放在正中间，也就是第五格。
      - 对手每走一步，就走它的对称步：隔着正中间、在正对面的那一格。
      - 如果对手放的那一格是空的、旁边也没有棋子，那么它的对称格也一样。所以先无棋可走的一定是对手。
    answer: 放在正中间，也就是第5格，然后每一步都对称地走。
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: 先手
      second: 后手
      moves: 数字表示第几步
    pictures:
      answer: 后手放第1格，应对放第9格
      stuck: 每个空格都挨着有棋子的格子：后手输了
    caption: >-
      长条只有一个正中间的格子，其余每一格都有对称的格子。所以先手永远不会无棋可走。

labels:
  when: 适用于：
  task: 例题 · {grades}
  show: 查看解答
  hide: 收起解答
  topics: 相关专题：

cues:
  title: 试试哪种技巧
  lead: >-
    这是根据题目里的字眼给出的提示，而不是规则：很多题同时可以用两种技巧解开。
  if: 如果题目里有……
  try: ……就试试
  rows:
    - “比……多……”、年龄、整体的部分
    - 很多人、很多东西，还有带“不”字的线索
    - 很大的数，又不知道从哪里下手
    - “有几种方法”“能组成几个数”
    - 已知结局，问的是开头
    - 两种东西和一个总数
    - 有东西重复出现：“第二十个是什么”
    - “有没有可能”“证明这不可能”
    - “保证”“至少两个”
    - 两人游戏：“谁会赢”
