# The page of the topic of games with a winning strategy, for a parent, in
# Simplified Chinese. The topic's name, its group, its grades and its traps'
# names are not here: they are the card's words and the catalog's numbers. The
# page's drawings, each example's level, and the answer its solver proves, are
# the site's data; an example here is worked through to that answer. The traps
# are the topic's commonest, counted in its reference tasks.

title: 必胜策略
description: 什么是关于必胜策略的题，怎样解，孩子常在哪里出错，以及在家可以怎样帮忙。

# The words the page's drawings say of a position.
art:
  loses: 轮到走的人必输
  wins: 必胜

hero:
  lead: >-
    桌上有20根火柴，两人轮流拿，每次拿1根、2根或3根。谁拿到最后一根火柴，谁就赢。先手能不能总是赢？这类题里，孩子要找一个无论对方怎么走都能赢的计划，办法是从游戏的结尾往回推：找出哪些局面对轮到走的人来说是必败的。
  method: 从结尾往回推，找出必败局面
  teaches: 找到一个无论对方怎么走都能赢的计划
  # The words of its drawing: the game it is drawn for.
  art:
    line: 每次拿1、2或3根火柴，拿到最后一根的人赢

basis:
  title: 游戏的规则
  cards:
    - title: 从结尾开始
      text: >-
        从游戏的结尾开始，那时谁赢一清二楚，然后往回推：如果从某个局面走出的每一步，都会走到对方的必胜局面，这个局面就是必败的。
      art:
        back: 从游戏结尾的0，往更大的数推
    - title: 把必败局面留给对方
      text: >-
        制胜的一步，会给对方留下一个必败局面。如果找不到这样的一步，那么不管轮到走的人多聪明，这个局面都是必败的。
      art:
        take: 拿2根
        losing: 对方必败
    - title: 模仿与对称
      text: >-
        在很多游戏里，赢家会保持一种平衡：要么让自己的每一步和对方的那一步加起来总是同一个数，要么在对称的另一侧走同样的一步。
      art:
        they: 对方
        answer: 应对

idea:
  title: 必败局面
  lead: 在每次拿1、2或3根火柴、拿到最后一根者赢的游戏里，对轮到走的人来说必败的局面，每隔4根就出现一次。
  table:
    head:
      - 剩下的火柴
      - 最好的走法
      - 原因
    rows:
      - - 1、2或3根
        - 全部拿走
        - 拿到最后一根就赢
      - - "4"
        - 怎么走都赢不了
        - 不管怎么拿，对方都能拿走剩下的
      - - 5、6或7根
        - 拿1、2或3根，留下4根
        - 对方拿到必败的4根
      - - "8"
        - 怎么走都赢不了
        - 每一步都会留下5、6或7根
  note:
    title: 为什么重要
    text: >-
      孩子们常常以为先手一定会赢，或者一边玩一边指望对方失误。必胜策略要能对付对方最好的走法；而要找到它，就得从结尾往回想，这个习惯的价值远远超出游戏本身。

method:
  title: 解法：从游戏的结尾往回推
  lead: >-
    从最小的局面开始，往上依次写出各个局面。如果从一个局面出发的每一步都走到必胜局面，就把它标为必败；如果有某一步能走到必败局面，就把它标为必胜。开局时制胜的一步，就是留下必败局面的那一步。下面的例题由浅入深，从最简单的一直到奥数竞赛题。
  steps:
    - 从结尾的局面开始
    - 从小到大，把每个局面标为必胜或必败
    - 找出给对方留下必败局面的那一步

examples:
  - title: 碗里的糖
    question: >-
      碗里有23颗糖。小可和小乐轮流拿，小可先拿。每人每次拿1、2、3或4颗。谁拿到最后一颗糖，谁就赢。小可第一次要拿几颗，才能保证赢？
    steps:
      - >-
        从结尾想起：如果剩下1～4颗，轮到走的人全部拿走就赢了。如果剩下5颗，不管怎么拿，都会给对方留下1～4颗，所以5是必败的。
      - >-
        同样，10、15和20也是必败的：不管从中拿走几颗，对方都能让碗里的糖减到下一个5的倍数。
      - >-
        所以小可先拿3颗，留下20颗。之后不管小乐拿几颗，小可都把这一轮补足到5颗，依次留下15、10、5颗，最后一颗也不剩。
    answer: 3颗糖。
    note:
      title: 为什么不拿4颗？
      text: >-
        拿4颗会留下19颗，小乐再拿4颗，留下15颗，这对小可来说就是必败的局面。对手如果从不失误，只有第一步就把糖留成5的倍数，才能赢。
    art:
      sweets: 23颗糖，每次拿1～4颗
      kim: 小可 −3
      answer: 小乐拿x颗，小可拿5 − x颗
      leo: 小乐 −4
      lost: 小可必败
  - title: 国王走格子
    question: >-
      国王站在一个5 × 5棋盘的左下角。两人轮流移动它，每次可以向上走一格、向右走一格，或者向右上方斜走一格。谁把国王走进右上角，谁就赢。如果双方都采取最佳走法，谁会赢？
    steps:
      - >-
        数一数国王还要走多少行、多少列。从离右上角只差一步的格子出发，轮到走的人马上就能赢。
      - >-
        如果这两个数都是偶数，这一格对轮到走的人来说就是必败的：任何一步都会让其中至少一个数变成奇数，而对方又能让两个数重新都变成偶数。
      - >-
        国王一开始离右上角4行4列，两个数都是偶数，所以先手输。后手每次都应对一步，把国王走回两个数都是偶数的格子，最后走进右上角。
    answer: 后手赢。
    badge: 后手
    note:
      title: 光先走还不够
      text: >-
        在这个游戏里，先手无论怎么走都会输。每遇到一个新游戏，都值得先从结尾验证一下，而不要想当然地认为先走就能赢。
    art:
      moves: 走法：上、右、斜向右上
      green: 绿色：一步就赢
      red: 红点：轮到走的人必输
      start: 国王从必败的格子出发
  - title: 雏菊
    question: >-
      一朵雏菊有12片花瓣，围成一圈。两人轮流摘花瓣，每次可以摘一片，也可以摘紧挨在一起、中间没有空隙的两片。谁摘下最后一片花瓣，谁就赢。如果双方都采取最佳走法，谁会赢？
    steps:
      - >-
        不管先手摘下一片还是两片，这一圈花瓣都会断开，变成一排11片或10片花瓣。
      - >-
        后手从这一排的正中间摘：一排11片就摘一片，一排10片就摘两片。剩下两排一样多的花瓣，分别在相对的两侧。
      - >-
        从此以后，先手在一排里怎么摘，后手就在另一排里照着摘。只要先手还能摘，后手也一定能摘，所以最后一片花瓣是后手摘下的。
    answer: 后手赢。
    badge: 后手
    note:
      title: 为什么从正中间摘？
      text: >-
        把一排分成一样长的两段，局面就变得对称了。照着模仿不会输：模仿的那一步总是允许的，因为另一排看起来完全一样。
    art:
      eleven: 先手摘了一片，剩下一排11片
      two-rows: 两排，每排5片
      mirror: 先手在蓝色那排摘，后手在橙色那排照着摘

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      忘了游戏的一条规则：每次最多只能拿4颗，却拿了5颗；或者让国王向左走，可规则不允许这样走。建立在不允许的走法上的计划，什么也赢不了。
    say: “规则允许怎么走？”
    art:
      question: 每次拿1～4颗糖
      five: 拿5颗
      three: 拿3颗
  first_move_assumed:
    shows: >-
      以为先走本身就能赢：“小可先走，所以小可赢。”在很多游戏里，比如“国王走格子”，先手无论怎么走都会输。
    say: “如果对方一步也不走错呢？”
    art:
      question: 国王走格子
      first: 先手赢
      second: 后手赢
  best_case_not_worst:
    shows: >-
      只有对方失误，这个计划才管用：小可拿了4颗，指望小乐接下来拿得太少。必胜策略必须能应对对方最好的一步。
    say: “对这一步，对方最好的应对是什么？”
    art:
      question: 小可从23颗起的第一步
      leo: 小乐 −4

home:
  - title: 玩火柴游戏
    text: >-
      和孩子玩从15根火柴里每次拿1、2或3根的游戏，让孩子先拿。赢上几局，再问问孩子：为什么4的倍数总是反复出现？
  - title: 模仿对方的走法
    text: >-
      在任何棋盘对称的游戏里，试着在对面一侧模仿对方的走法。问问孩子：模仿什么时候管用，什么时候会失灵？
  - title: 交换先后手
    text: >-
      孩子找到必胜的计划以后，交换一下：这次让孩子后走。解释为什么从这里开始这个计划会输，是这个专题更深的那一半。

# What a parent can write in the chat to get a task on this topic.
ask: 来一道“必胜策略”的题
