# The page of the topic of counting figures, for a parent, in Chinese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "数图形"
description: "什么是数图形的题（如火柴棒问题），怎样解，孩子常在哪里出错，以及在家可以怎样帮忙。"
hero:
  lead: "几条线画成的图里，藏着的三角形和正方形比第一眼看到的多：有小的，也有由几块拼成的大的。这类题要求把它们全部数出来，或者说出拿走哪些火柴能让图形改变。整个本领就在于按大小来数，从最小的开始。"
  method: "按大小来数，从最小的开始"
  teaches: "每个图形只数一次，不漏也不重"
  art:
    count: "4个小正方形和1个大的：5"
basis:
  title: "什么算一个图形"
  cards:
    - title: "大的也要数"
      text: "一个2乘2格的正方形里有4个小正方形，还有围住它们的1个大正方形。由几块拼成的图形也要数。"
      art:
        count: "4 + 1 = 5个正方形"
    - title: "边在线上"
      text: "只有每条边都在图中的线上，三角形才算数。在正方形里从角到角画两条线，就有8个三角形。"
      art:
        count: "4个小的和4个两块的：8"
    - title: "一根火柴是一条边"
      text: "两个火柴正方形挨着的地方，共用一根火柴。一排3个正方形要用10根火柴，不是12根。"
      art:
        count: "3 + 3 + 4 = 10根火柴"
idea:
  title: "一种大小一种大小地数"
  lead: "按大小列出图形：先数最小的，再数两块拼成的，再数更大的，最后加起来。"
  table:
    head:
      - "图"
      - "最小的"
      - "更大的"
      - "一共"
    rows:
      - - "2乘2格的正方形"
        - "4"
        - "1"
        - "5"
      - - "3乘3格的正方形"
        - "9"
        - "4 + 1"
        - "14"
      - - "2乘3格的长方形"
        - "6"
        - "2"
        - "8"
  note:
    title: "为什么重要"
    text: "孩子常常只数小的图形，或者把一个大图形从它的两块各数一次。一种大小一种大小地数，并把每种大小记下来，两种错误都能避免。"
method:
  title: "怎样解：从最小的开始"
  lead: "说出图中可能有的每种大小的图形，每种大小单独数，再加起来。数火柴时，想一想每根火柴是哪些正方形的边。下面的例题由浅入深，从最简单的一直到奥数竞赛题。"
  steps:
    - "找出最小的图形并数一数"
    - "按顺序数每种更大的图形"
    - "加起来，检查有没有漏掉哪种大小"
examples:
  - title: "从顶点出发的两条线"
    question: "从一个三角形的上面的角，向底边画两条线。图里一共有多少个三角形？"
    steps:
      - "两条线把三角形分成3个小三角形。"
      - "相邻的两个小三角形合起来也是一个三角形，这样的有2对。"
      - "整个三角形再算1个。一共 3 + 2 + 1 = 6。"
    answer: "6个。"
    note:
      title: "快速检查"
      text: "这里每个三角形的顶点都在上面的角上，底边都在下面的线上。下面的线上有4个点，任选2个就是一条底边，一共6种选法。"
    art:
      count: "3 + 2 + 1 = 6"
  - title: "3乘3的正方形"
    question: "画一个3乘3格的正方形，画出所有的线。里面一共有多少个大小不同的正方形？"
    steps:
      - "一个格子的正方形：3行，每行3个，一共9个。"
      - "2乘2的正方形能放在2行、每行2个位置，一共4个。"
      - "整个3乘3的正方形再算1个。一共 9 + 4 + 1 = 14。"
    answer: "14个。"
    note:
      title: "不是9个"
      text: "9只数了小正方形。由几个格子组成的正方形也是正方形。"
    art:
      sizes: "一个格子的9个，2乘2的4个，3乘3的1个"
  - title: "要拿走的火柴"
    question: "用12根火柴摆成一个2乘2格的正方形。至少要拿走几根火柴，才能让任何大小的正方形都不剩下？"
    steps:
      - "一共有5个正方形：4个小的和1个大的。"
      - "一根火柴最多是2个正方形的边，所以2根火柴最多拆掉4个正方形，还会剩下1个。"
      - "里面竖着的2根火柴拆掉4个小正方形，上面的1根拆掉大正方形：一共3根。"
    answer: "3根。"
    note:
      title: "为什么不是2根"
      text: "每根火柴拆掉1个或2个正方形，而要拆掉的有5个，所以2根不够。"
    art:
      taken: "虚线的火柴要拿走"
traps:
  missed_case:
    shows: "漏掉了某种大小的图形：围住小正方形的大正方形，或者两块拼成的三角形。"
    say: "“有没有由几块拼成的更大的图形？”"
  double_count:
    shows: "同一个图形从它的两块各数了一次，或者共用的火柴给两个正方形都算了一次。"
    say: "“这个图形是不是已经数过了？”"
  stopped_early:
    shows: "数到最小的图形就停了，或者停在第一个看起来对的答案上。"
    say: "“还有别的大小的图形吗？”"
home:
  - title: "方格纸"
    text: "和孩子一起画一个2乘2格的正方形，数一数里面的正方形。再试试3乘3的。"
  - title: "火柴"
    text: "用火柴或小棒摆一排正方形。摆4个正方形要几根？摆5个呢？"
  - title: "一种大小一种大小"
    text: "数的时候把每种大小说出来：小的、两块的、更大的。把数写下来再加起来。"
ask: "来一道“数图形”的题"
