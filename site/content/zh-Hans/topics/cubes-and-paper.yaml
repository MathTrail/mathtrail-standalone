# The page of the topic of cubes and paper, for a parent, in Chinese.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "立方体与折纸"
description: "什么是立方体与折纸的题（如正方体展开图），怎样解，孩子常在哪里出错，以及在家可以怎样帮忙。"
hero:
  lead: "由六个正方形组成的平面展开图能折成一个正方体；折起来的纸打一个孔，展开后会有好几个孔；骰子沿着一排格子滚动，可以先算出朝上的点数。这类题要一步一步地想象折、滚或展开的过程来解。"
  method: "一步一步地折、滚或展开"
  teaches: "看出平面图形怎样变成立体，再变回来"
  art:
    opposite: "1和5相对"
basis:
  title: "折叠的规则"
  cards:
    - title: "相对的面不相邻"
      text: "在展开图里，同一排中间隔着一个正方形的两个正方形，会成为正方体相对的两个面。"
      art:
        opposite: "3和6相对"
    - title: "对折一次层数加倍"
      text: "纸对折一次，折过去叠着的地方是2层，再折一次是4层。打孔会穿过每一层。"
      art:
        holes: "折2次，4层，4个孔"
    - title: "骰子凑成7"
      text: "骰子上相对两个面的点数加起来是7：1和6，2和5，3和4。"
      art:
        bottom: "上面2，下面5"
idea:
  title: "一步一步来"
  lead: "在脑子里一步一步地折、滚或展开，记下每一步带来什么变化。"
  table:
    head:
      - "做什么"
      - "有什么变化"
    rows:
      - - "展开图的一个正方形向上折"
        - "它成为正方体的下一个面"
      - - "纸对折一次"
        - "叠着的地方层数加倍"
      - - "骰子沿一条棱翻倒一次"
        - "一个侧面翻到上面"
      - - "骰子笔直地翻倒两次"
        - "原来下面的面翻到上面"
  note:
    title: "为什么重要"
    text: "孩子常常想一下子猜出整个结果。每一步都不难，一步一步跟着走，就不用猜了。"
method:
  title: "怎样解：一次折一下"
  lead: "先说出最先折的正方形、最先的折痕或第一次翻倒，说说它带来什么变化，再接着下一步。能做的话，剪一个纸展开图或拿真的骰子来验证。下面的例题由浅入深，从最简单的一直到奥数竞赛题。"
  steps:
    - "选出第一个正方形、第一条折痕或第一次翻倒"
    - "说出它让面或层数怎样变化"
    - "一步一步往下走，再用纸或骰子验证"
examples:
  - title: "相对的面"
    question: "一个正方体的展开图是十字形：竖着一列4个正方形，从上到下编号1、2、3、4，正方形5和6在正方形2的两边。折起来以后，和2相对的是几号？"
    steps:
      - "正方形1和3在这一列里挨着2，所以和2相邻。"
      - "正方形5和6在2的两边，所以也和2相邻。"
      - "正方形4在2下面隔一个，中间是3：它和2相对。"
    answer: "4号。"
    note:
      title: "用纸验证"
      text: "在方格纸上画出十字形，剪下来折一折：2和4正好相对。"
    art:
      opposite: "2和4相对"
  - title: "对折两次打一个孔"
    question: "把一张正方形的纸对折，再对折一次。在折好的纸上打一个孔。展开以后有几个孔？"
    steps:
      - "第一次对折得到2层。"
      - "第二次对折让层数加倍：4层。"
      - "孔穿过4层，所以展开的纸上有4个孔。"
    answer: "4个。"
    note:
      title: "孔在哪里"
      text: "孔分别在纸的4个四分之一里，每个孔和隔着折痕的相邻孔像镜子里的像一样对称。"
    art:
      holes: "每个四分之一里一个孔"
  - title: "滚动的骰子"
    question: "一个骰子朝上的是2点。它沿着棱向正前方翻倒两次。骰子相对两个面的点数加起来是7。现在朝上的是几点？"
    steps:
      - "第一次翻倒，把后面的面翻到上面。"
      - "第二次翻倒，把一开始在下面的面翻到上面。"
      - "下面原来是和2相对的点数，也就是 7 − 2 = 5。"
    answer: "5点。"
    note:
      title: "翻倒四次以后"
      text: "再翻倒两次，2又回到上面：笔直地滚，朝上的面每翻倒4次回来一次。"
    art:
      top: "上面5"
traps:
  missed_case:
    shows: "漏掉了一个面、一层或一种情况：折起来会碰到别的正方形的那个正方形，或者孔也穿过的那一层。"
    say: "“还有没有没数到的面或层？”"
  ignored_condition:
    shows: "丢了题目里的规则：把相邻的正方形当成相对的面，或者忘了骰子相对的面加起来是7。"
    say: "“这符合题目给的规则吗？”"
  stopped_early:
    shows: "解题早停了一步：只折了第一次，或者骰子只翻倒了一次。"
    say: "“是不是还差一步？”"
home:
  - title: "纸做的展开图"
    text: "画一个由六个正方形组成的十字形，剪下来折成正方体。哪些正方形相对？"
  - title: "折一折打个孔"
    text: "把纸折两次，用铅笔戳一个孔，打开之前和孩子一起猜猜有几个孔。"
  - title: "真的骰子"
    text: "和孩子一起看一个骰子：哪些点数相对？在桌上滚一滚，看之前先说出朝上的点数。"
ask: "来一道“立方体与折纸”的题"
