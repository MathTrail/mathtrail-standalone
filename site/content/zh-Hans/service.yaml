  lead: 谁和谁通信。孩子和成年人都不直接访问 MathTrail，而是与聊天宿主交互。中间区块里的所有部分都属于同一个进程，而不是独立的服务。请选择任意一个部分，查看它的作用以及与之相连的部分。
  legend: 服务的组成部分
