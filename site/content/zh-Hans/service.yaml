  parts:
    adult:
      name: 成年人
      sub: 家长或老师 · 负责登录的人
      about: "家长或老师。同时拥有聊天账号和 Google 账号：连接 MathTrail、登录一次、创建档案、在聊天中主持课程并关注进度。是唯一登录的人，也是唯一打字的人。"
    kid:
      name: 孩子
      sub: 1～6年级 · 自己不登录
      about: 1～6年级。在成年人的聊天里，在卡片上解题。自己不登录。
    model:
      name: 宿主的模型
      sub: 编写题目、求解程序和讲解
      about: Claude 或 ChatGPT。编写题目、一个 Starlark 求解程序、每个错误选项背后的讲解，以及一份自检；在不显示卡片的地方，用文字主持课程。MathTrail 本身不调用任何模型。
    appsrt:
      name: MCP Apps 运行时
      sub: 卡片所在的沙箱内嵌框架
      about: 在运行于沙箱中的内嵌框架里绘制卡片，把语言、平台和尺寸传给它，并带上宿主的令牌转发卡片自己的调用；卡片本身永远看不到这个令牌。
    cimd:
      name: 客户端元数据文档
      sub: 宿主的 client_id 是一个 HTTPS 地址
      about: 宿主用一个 HTTPS 地址来表明自己的身份。MathTrail 会获取该地址上的文档（有防范 SSRF 的保护），而不是维护一份客户端注册表。
    router:
      name: HTTP 路由器
      sub: /mcp · /oauth/* · /health
      about: "唯一的入口：/health、/mcp、OAuth 端点和 .well-known。超时、请求体大小上限、Origin 检查；签发方就是它自己的域名，其他任何 Host 都会收到404。"
    authsrv:
      name: 授权服务器
      sub: OAuth 2.1 + PKCE，用户同意
      about: "MathTrail 自己就是一个带 PKCE 的 OAuth 2.1 服务器：元数据、自己的同意屏幕、用 Google 账号登录、令牌、续期和撤销。有状态的服务器需要保存的一切，都密封在令牌和 Cookie 里。"
    mcpsrv:
      name: MCP 服务器
      sub: Streamable HTTP，无状态
      about: "协议：Streamable HTTP 2026-07-28，无状态，基于官方 Go SDK。它列出并调用工具，以 ui:// 资源的形式提供卡片，并把指令连同其版本号交给模型。"
    limits:
      name: 限制
      sub: 按地址、按账号、按天
      about: 登录前按地址、登录后按账号限制速率，另有一个总上限，都在内存中计数；此外还有每天的上限，由档案计数。超出限制时，返回一句简单的话，由模型转达。
    tools:
      name: 工具
      about: "十二个工具，形式都一样：读取档案、计算、写回。大多数由模型调用；卡片调用属于自己的那几个：用于题目、答案、进度和档案表单。结果中从不包含任何机密。"
    rule:
      name: 规则
      sub: 专题、目标、难度目标区间
      about: "以确定性的方式选定出题要求：答错之后，还是同一个专题，用来巩固；否则选最久没出现的专题；难度取自答对概率在70%～85%之间的目标区间。孩子落后的专题出现的次数翻倍。暂时太难的专题会暂停；当孩子的整体水平够得着其中一个时，每六道题目里可以有一道把它作为专题检测带回来。"
    rating:
      name: 评分
      sub: θ、δ、β · 基于 IRT 的 Elo
      about: P = 0.2 + 0.8·σ(θ + δ − β)。Elo 只根据答案对不对来变动，步长逐渐缩小；采用国际象棋式的分值尺度，共十一个等级；一个专题是否算作已掌握，看的是一个保守的估计。
    checks:
      name: 检查
      sub: 提交的题目必须通过的检查
      about: "提交的题目必须通过以下检查：结构和五个互不相同的选项、课程语言的文字、互不相同的讲解、求解程序、自检、可读性、近似重复，以及图：图的格式、图中标注与题目是否对得上、图上没有写出答案。所有未通过的项目会一次性全部报告。"
    solver:
      name: 求解程序
      sub: Starlark 沙箱，步数上限
      about: 运行模型写的 Starlark 程序，由它逐一尝试各个选项；必须恰好有一个选项被算出是正确的。限制步数和时间，不能联网，也不能访问文件。
    content:
      name: 内容
      sub: 目录、参考题、指令
      about: "内置在二进制文件中、但不是代码的一切：专题、陷阱和技能的目录，参考题，模式（schema），求解程序模板，每种图各一个示例，以及带版本号的模型指令。"
    widget:
      name: 小组件
      sub: 卡片 · 一个 HTML 文件
      about: "卡片：用 Preact 构建成一个 HTML 文件，不从别处加载任何东西，各语言的词典都在其中。布局从320像素宽起就能正常使用，按钮大小适合手指点按。"
    store:
      name: 存储
      sub: 档案和当前题目
      about: 通过一个隐藏标记找到档案，写入前先比较，协调两个标签页，在家长要求时从云端硬盘中永久保留的版本恢复文件，并把云端硬盘调用控制在很小的预算之内。
    seal:
      name: 密封
      sub: 令牌和已密封的答案
      about: "一个机制，两项工作：把登录信息和 Google 的令牌密封进宿主持有的令牌里，把题目的答案（当前题目的，以及提前写好的那道题的）密封进档案里。密钥来自 Secret Manager，并按密钥 ID 轮换。"
    logs:
      name: 日志记录
      sub: 汇总，不含个人数据
      about: "每次调用记录一条结构化汇总：工具、结果、耗时、指令版本；尝试次数和被拒原因则作为题目的事件记录。不含个人数据，不含题目文本，不含答案。"
    boot:
      name: 容器与配置
      sub: 环境、版本、关闭
      about: 把各部分连接起来，并按相反的顺序关闭它们；使用超时和优雅关闭；从环境变量读取全部配置；如果在 Cloud Run 上带着开发开关，就拒绝启动。
    goauth:
      name: Google OAuth
      sub: 仅 drive.file
      about: 家长登录（只申请 drive.file 权限）、续期和撤销。撤销任何一个令牌，都会终止全部访问。
    gdrive:
      name: Drive API v3
      sub: 唯一的长期存储
      about: "唯一的长期存储：家长云端硬盘中一个可见的 MathTrail 文件夹里的一个 JSON 档案，用家长自己的令牌读写。"
    sm:
      name: Secret Manager
      sub: 密封密钥、客户端密钥
      about: "密封密钥和 Google 的客户端密钥：固定的版本，在实例启动时读取一次。"
    ar:
      name: Artifact Registry
      sub: 镜像，按摘要（digest）引用
      about: 每个修订版本的镜像，按摘要引用；旧镜像会被删除。
    clog:
      name: Cloud Logging
      sub: stdout 的去处
      about: 服务的 stdout 写到这里。用来统计孩子的日志行单独存放在一个存储桶中，保留62天。
    bq:
      name: BigQuery → Data Studio
      sub: 保存多年的计数
      about: 使用情况的计数保存多年，每晚重新统计一次；没有任何一张表包含孩子在统计中所用的名称。一份私有报告和一份公开报告，公开报告不显示少于十名孩子的分组。
    ga:
      name: Actions
      sub: 构建、检查、部署
      about: 构建、检查、发布镜像，以及通过工作负载身份联合进行部署，不使用服务账号密钥。
    pages:
      name: Pages
      sub: 本网站、隐私政策和使用条款
      about: "本网站：各专题的页面，以及同意屏幕所链接的隐私政策和使用条款。"
