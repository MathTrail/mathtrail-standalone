title: 服务的工作原理
description: "MathTrail 的内部工作原理：服务的各个部分及其连接方式、一节课的逐次调用、状态存放在哪里、家长云端硬盘中的档案文件，以及其中密封了什么。"
hero:
  badge: 写给技术读者
  title: 服务的工作原理
  lead: "MathTrail 位于一家人已经在用的聊天应用和家长的 Google 云端硬盘之间。每道题都由聊天模型来写，能不能送到孩子面前，则由服务决定。它是单一的程序：不调用任何自有模型，两次请求之间也不保留任何东西。"
  chips:
    - Cloud Run 上的一个 Go 二进制文件
    - 无状态
    - 无数据库
    - 不自行调用 LLM
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail 的三层结构
  client:
    title: 聊天客户端
    tag: 1 · 客户端
    others: 其他 MCP Apps 宿主
    note: 聊天模型出题，卡片把题目展示给孩子。
  mcp: "{via} · 通过 HTTPS 的工具调用"
  cloud:
    title: Google Cloud 上的 MathTrail
    tag: 2 · 运行时
    sub: Cloud Run · 一个 Go 二进制文件 · 无状态
    core: 核心：纯计算
    around: "核心周边：OAuth、MCP 服务器、卡片、密封、限制。"
  drive: "{via} · 使用家长自己的令牌"
  storage:
    title: Google 云端硬盘
    tag: 3 · 存储
    note: 每个孩子一个文件，存放在家长自己的云端硬盘里：这是唯一长期保存的东西。
