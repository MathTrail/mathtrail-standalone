profile:
  title: 档案文件
  lead: "一个孩子，一个 JSON 文件：它不是服务器上某个事实的缓存，而是事实本身。每个区块都有上限，每次写入都会守住，所以文件永远不会无限增长：通常的文件保持在目标之内，接近各项上限的文件则会超出目标。做过的题以指纹形式保存，而不是保存文本。"
  size: 文件大小
  legend: 显示哪种大小
  typical: 通常
  cap: 接近上限
  total: "≈ {kb} KB"
  kb: "{kb} KB"
  goal: "目标{kb} KB"
  segment: "{name} · {typical} / {cap} KB"
  heads:
    block: 区块
    holds: 内容
    writers: 写入者
    size: 大小
  blocks:
    fingerprints:
      name: 指纹
      holds: 最多200个已发出题目的草图，用于近似重复检查；不含文本、专题和日期
    history:
      name: 评分历史
      holds: θ 和该专题的 δ 在最近每次作答之前的值，以及在最近7个有作答的日子里，每天开始时 θ 和每个专题的值
    ratings:
      name: 评分和专题
      holds: "θ 和孩子的起点；每个专题的 δ、作答、掉进过的陷阱、掌握情况及其水平"
    recent:
      name: 最近作答
      holds: 最近20次作答和跳过，并且永远不少于规则要读取的5次作答
    sealed:
      name: 当前题目（已密封）
      holds: 答案、每个错误选项背后的陷阱、解答和求解程序，合成一个不透明的字符串
    open:
      name: 当前题目（明文）
      holds: "卡片显示的内容：文字、图、五个选项、提示，以及作答之后的答案本身"
    request:
      name: 未完成的请求
      holds: "题目编写期间：它的 ID、出题要求、已用的尝试次数，以及是谁选的专题"
    service:
      name: 服务与孩子
      holds: 模式（schema）版本、一个随机 UUID、修订号；化名、年级、兴趣爱好、备注；当天的计数器
  every-write: 每次写入
  note: "提前写好的题目和当前题目放在一起，大小也差不多。文件中没有的内容：做过的题目的文本、孩子作答之前的明文答案、任何能识别家长身份的信息，以及等级（等级在显示时才计算）。云端硬盘不支持条件写入，因此保存前会重新读取一次文件，如果文件已经改变，写入就会被拒绝：两个标签页永远不会悄无声息地互相覆盖。"
seal:
  title: 密封了什么，有效期多长
  lead: "一个机制承担两项工作：把登录信息密封进聊天持有的令牌里，把题目的答案（当前题目的，以及提前写好的那道题的）密封进档案里。每个密封都带有它的用途，所以访问令牌无法冒充刷新令牌，已密封的答案也无法冒充其他任何东西。"
  token:
    title: 拆开一个令牌
    version: 格式版本
    purpose: 用途
    purposes:
      c: 授权代码
      a: 访问
      r: 刷新
      d: 客户端
      s: state
      k: 同意
      t: 题目答案
    key: 密钥 ID
    key-note: 取自密钥本身，因此轮换时不会被察觉
    cipher: 密文
    cipher-note: XChaCha20-Poly1305，随机的192位 nonce
    note: "不是 JWT：除了服务本身，没有人会读取它；从一个不透明的字符串里，也不会有任何声明（claim）泄漏到日志中。"
  life:
    title: 有效期，对数刻度
    ticks:
      - 1分钟
      - 1小时
      - 1天
      - 1周
      - 6个月
    items:
      code:
        name: 授权代码
        life: 60秒
      signin:
        name: 进行中的登录
        life: 10分钟
      access:
        name: 访问令牌
        life: 15分钟
      refresh:
        name: 刷新令牌
        life: 30天，滑动延长，最长90天
      key:
        name: 密封密钥
        life: 每90天轮换一次
      approvals:
        name: 已批准的客户端
        life: 180天
    note: 无状态的服务器无法把授权代码标记为已使用，所以授权代码的有效时间窗口很短。轮换之后，之前的密钥仍会被接受，所以更换密钥时，令牌和已密封的答案都不会失效。
