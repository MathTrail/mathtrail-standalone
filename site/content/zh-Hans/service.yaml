flow:
  title: 一节课的逐次调用
  lead: 模型和卡片调用同一组工具，依赖同一个事实来源：家长云端硬盘中的档案文件。要让课程继续下去，它们彼此之间无须传递任何信息。
  legend: 场景
  scenarios:
    task: 出题
    answer: 作答
    signin: 登录
  kinds:
    call: 调用
    reply: 返回
    host: 宿主内部
  actors:
    adult: 成年人
    kid: 孩子
    card: 卡片
    model: 宿主的模型
    service: MathTrail
    drive: 云端硬盘
    browser: 家长的浏览器
    host: 宿主
    google: Google
  task:
    rows:
      - “来一道新题”
      - next_task
      - "调用一开始，宿主就显示卡片：“正在准备下一道题…”"
      - 限制 · 规则选定专题、水平和难度
      - 写入未完成的请求
      - 请求已开启：请获取出题材料包
      - get_package
      - 出题要求 · 3道参考题 · 陷阱 · 模板 · 图的示例
      - 模型写出题目、一个 Starlark 求解程序和一份自检
      - submit_task：最多尝试3次
      - 检查 · 求解程序必须恰好找到一个正确选项
      - 这道题成为当前题目，答案已密封
      - read_task：卡片每4秒询问一次
      - 文字 · 图 · 五个选项 · 提示，不含答案
    caption: "每次调用还会从云端硬盘读取档案，图中省略了这些读取。等待中的卡片永远看不到出题材料包：其中的参考题带着答案。在孩子解题时，模型会用 prepare_task 提前写好下一道题；当要求再来一道时，next_task 会立即把它放到一张新卡片上，不必经历这段等待。"
  answer:
    rows:
      - 点击选项C
      - submit_answer：不消耗聊天的回合
      - 只记第一次作答 · 此时才打开密封 · θ 和 δ 只根据对错变动
      - 写入评分和历史记录
      - 是否答对 · C背后的陷阱 · 解答图 · 步骤 · 评分（之前 → 之后）
      - 卡片在原题的位置变成答案讲解
      - ui/update-model-context：一行字，随成年人的下一条消息一起读取
      - “为什么多了一根柱子？”
      - 就这道题本身回答，补充卡片的内容
    caption: 按下选项就会记录答案，早于任何讲解，卡片也会立刻变成答案讲解。聊天不消耗回合，模型也不画任何东西。模型会随成年人的下一条消息读到卡片发来的那一行，回答关于这道题的问题时，不复述卡片上的内容。如果宿主发给模型的那一行丢失了，模型会在下一次调用时补上。
  signin:
    rows:
      - POST /mcp，不带令牌
      - 401 · 元数据在哪里
      - 打开 /oauth/authorize · PKCE S256
      - authorize
      - "自己的同意屏幕：哪个客户端，以及它会把家长送回哪里"
      - 用 Google 账号登录 · 仅 drive.file
      - 带着 Google 的授权代码返回
      - /oauth/callback
      - 交换授权代码
      - /about：这是谁的云端硬盘？
      - 用户 ID = 云端硬盘账号的 HMAC · Google 的令牌密封进我们的授权代码
      - 302 · code = mt1.c.…
      - 交回授权代码
      - /oauth/token · 授权代码 + 代码验证器
      - 访问令牌15分钟 · 刷新令牌30天
    caption: "家长只需登录一次。服务不保存这次交换的任何内容：请求放在一个已密封的 state 参数里传递，Google 的令牌则放在一个已密封的授权代码里。"
  machine:
    title: 当前题目的状态机
    lead: 每一条“只能一次”的规则都是档案中的一个字段，在同一次读取、计算和写入之内检查。除此之外，没有任何东西会记住任何事。
    forward:
      - 出题要求已备好
      - 已密封，已发出
      - 只记录一次
    turns:
      - 被拒，仍有尝试机会：每个请求最多三次
      - 被拒三次，或从请求开启起满15分钟；不消耗当天的题目数，三次被拒算作当天一次失败的请求
      - 作答前按了“再来一题”：记为跳过，评分不变
      - 之后的任何作答（来自第二个标签页或来自模型）都只会拿回第一次的结果，不写入任何内容
      - 下一道题，出现在新卡片上；已作答的那道题不再是当前题目
      - 下一道题已提前写好：next_task 立即把它放到新卡片上，跳过 requested
      - 密封已无法打开：密钥已轮换两次；不记录任何内容
state:
  title: 状态存放在哪里
  lead: "有状态的服务器存进数据库的一切，在这里都由别人保管：聊天持有的已密封令牌、家长浏览器里的 Cookie，或家长自己的云端硬盘。无论重启服务，还是再启动一个副本，都不会丢失任何东西。"
  self:
    label: MathTrail 本身
    value: 无
    note: 没有账号，没有会话，没有注册信息，也没有 Google 令牌。每个请求都携带它所需要的一切。
  stores:
    tokens:
      title: 聊天的令牌存储
      sub: 已密封的令牌，对宿主不透明
      rows:
        access:
          name: 访问令牌
          life: 15分钟
        refresh:
          name: 刷新令牌
          life: 30天，≤ 90天
      note: 里面密封着 Google 的令牌、一个用于限制的不透明用户 ID，以及家长登录时所在的国家。
    browser:
      title: 家长的浏览器
      sub: 两个 Cookie，没有会话
      rows:
        approvals:
          name: 已批准的客户端
          life: 180天
        csrf:
          name: 登录防护（CSRF）
          life: 10分钟
      note: 丢失它们的代价是多看一次同意屏幕，或者重新登录一次。
    drive:
      title: 家长的云端硬盘
      sub: 唯一长期保存的东西
      rows:
        profile:
          life: 直到被删除
      note: 档案、评分和当前题目，其答案已密封。家长可以打开这个文件，云端硬盘也会保留它的版本记录。
    secrets:
      title: Secret Manager
      sub: 在实例启动时读取一次
