  lesson: 普通的课
  olympiad: 奥数题
  # Above the rows, an example of each: a school sum with its answer left
  # blank, and the fence in short, with its posts.
  example: 例子
  sum: 12 ÷ 3 =
  done: 方法课上已经讲过：剩下的只是照着做一遍。
  fence: 篱笆长12米，每隔3米一根柱子，两端都有。共有几根柱子？
  found: 没有给出方法，得自己找：4个间隔，柱子比间隔多一根，所以是5根。
