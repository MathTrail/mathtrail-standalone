# The page "Why", for a parent, in Simplified Chinese: why olympiad maths is
# worth a child's time, how long people have learned it, what research has
# found about it, how it differs from a school lesson, what a parent can do,
# how MathTrail goes about it, and why it is no ordinary app. The grades, the
# topics' names and the card's own words are not here: they are the catalog's
# numbers and the widget's words. The card's options, its drawing, the
# history's pictures and the works the page cites are the site's data; a
# finding here says what its work found, no more.

title: 为什么学奥数
description: 为什么奥数题值得孩子花时间，研究对它们有哪些发现，以及家长可以怎样借助 MathTrail 帮助孩子。

# The label of the note that says plainly what the page does not promise.
honest: 坦白说

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: 篱笆长12米。每隔3米立一根柱子，两端都有柱子。一共有几根柱子？
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: 数的是间隔，不是柱子。
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4（个间隔）。两端都有柱子的直篱笆，柱子比间隔多一根。4 + 1 = 5（根柱子）。

hero:
  title: 为什么让您的孩子学奥数
  lead: 学校教孩子照着课上讲过的例题解题。奥数题教孩子在没有例子可循时自己找到办法。直到{last}年级，家长都可以亲自帮孩子准备奥数题，MathTrail 正是为此而做的。
  free: 免费
  open: 开源
  school:
    label: 课本计算题
    text: 需要会做除法。
    sum: 12 ÷ 3 = 4
  olympiad:
    label: 奥数题
    answer: 答案：{answer}
    trap: 陷阱：4是间隔数，不是柱子数
    text: 需要弄懂是怎么回事。
  caption: 同样的数，不同的思考方式。

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: 没有例子可循时怎样思考，人们已经教了两千多年
  lead: 非常规的题目并不新鲜。在许多国家、许多个世纪里，人们学着找到没人教过的解法，并说明它为什么正确；每一代人都把这种本领传给了下一代。
  quote: “几何学中没有王者之路。”
  quoted: 这是欧几里得对托勒密国王说的话，国王问他，学几何有没有比读《几何原本》更容易的办法。5世纪的普罗克洛是这样记述的。
  # What a screen reader calls the choice of a picture.
  choice: 历史图片
  eras:
    - label: 古代 · 至6世纪
      title: 证明与题集
      text: 希腊人开始证明一条规则为什么成立。在中国，《九章算术》收录了246道题及其解法。在印度，人们开始用带零的方式写数，我们今天仍然这样写。
    - label: 中世纪及以后 · 9～19世纪
      title: 题目即挑战
      text: 在巴格达，花拉子米写了一本书，书名给了世界“algebra”（代数）这个词。在意大利，数学家们用题目进行决斗；在日本，人们把题目写在木板上，挂在寺庙里。
    - label: 19世纪末至20世纪
      title: 给每个孩子的题
      text: 所有孩子都开始上学，最好奇的孩子还有了数学兴趣小组和奥林匹克竞赛：匈牙利从1894年开始，列宁格勒从1934年开始。
    - label: 今天
      title: 每个孩子的导师
      text: 从前，私人导师只属于少数人：亚里士多德教过亚历山大大帝。如今，每个孩子都可以有一位导师。MathTrail 教练里的伙伴从不直接给出答案：像过去伟大的老师一样，它会提出问题，引导孩子找到解法。
      link: 看看教练 →
  pictures:
    athens:
      place: 希腊
      alt: 壁画局部：一位白发学者俯身在石板上，用圆规作图，四个学生围在他身边。
      caption: 欧几里得在石板上用圆规作图，学生们在一旁看着；也有人说画中人是阿基米德。拉斐尔壁画《雅典学院》局部，1509～1511年。
    confucius:
      place: 中国
      alt: 一幅画：一位老师坐在户外的学生们中间，学生们在听讲，也在争论。
      caption: 孔子和他的弟子。计算是受过教育的人必须掌握的“六艺”之一。19世纪的画作，作者不详。
    aryabhata:
      place: 印度
      alt: 一座白色雕像：一位披着长袍的学者伸出手。
      caption: 阿耶波多，5世纪的印度数学家和天文学家。没有人知道他的模样：这是浦那的一座现代雕像。
    istanbul:
      place: 伊斯兰世界
      alt: 一幅细密画：戴头巾的学者们在用地球仪、仪器和书籍工作。
      caption: 在伊斯坦布尔塔基丁的天文台里工作的天文学家和数学家。16世纪末的奥斯曼细密画。
    pacioli:
      place: 意大利
      alt: 一幅肖像：一位修士兼数学家指着一块写有 Euclides 字样的石板，身旁有一名学生，桌子上方挂着一个玻璃多面体。
      caption: 数学家卢卡·帕乔利和一名学生。画有图形的石板边缘写着“Euclides”。1495年的肖像画，一般认为出自雅各布·德巴尔巴里之手。
    sangaku:
      place: 日本
      alt: 一块木板，上面有彩色的圆形图案和一列列文字。
      caption: 算额，即写着几何题的木板，位于东京金王八幡宫，1859年。摄影：Momotarou2012，CC BY-SA 3.0。
    rachinsky:
      place: 俄国
      alt: 一幅画：穿着农家衬衫的男孩们站在写着题目的黑板前思考，站在前面的一个男孩用手托着下巴。
      caption: 乡村学校的学生们在心算黑板上的题：(10² + 11² + 12² + 13² + 14²) ÷ 365。尼古拉·波格丹诺夫-别尔斯基，《心算，在 S. A. 拉钦斯基的乡村学校》，1895年。
    st-louis:
      place: 美国
      alt: 一张课堂照片：孩子们在黑板上写一列列数字，老师在帮一个女孩，其他孩子坐在课桌前，拿着书。
      caption: 2年级学生在黑板前做算术题。圣路易斯贝茨学校，20世纪初。
    moscow:
      place: 苏联
      alt: 一张照片：一名男生站在画着立体几何图形的黑板前，回头微笑。
      caption: 学校考试：一名学生站在黑板前，面对一道立体几何题。莫斯科，20世纪50年代。摄影：Yu. D. Korolev，莫斯科总档案馆，CC BY 4.0。
    coach-canvas:
      place: MathTrail
      chip: 在画布上解题
      alt: 平板电脑屏幕：一道关于路边柱子的题，画布上有一幅虚线草图，旁边是狐狸伙伴的提示和步骤：理解、计划、解题、检查。
      caption: MathTrail 教练的原型：孩子在画布上画出解法，伙伴建议先从小一点的数开始。
    coach-sheet:
      place: MathTrail
      chip: 纸上的题
      alt: 平板电脑屏幕：摄像头拍下一张奥数题纸，教练在上面找到了六道题。
      caption: MathTrail 教练的原型：孩子拍下一张题目纸，教练从中找出六道题。
    coach-map:
      place: MathTrail
      chip: 专题地图
      alt: 平板电脑屏幕：一张分三步的奥数专题地图，从基础到难题，旁边是“枚举法”专题和孩子在这个专题上的等级。
      caption: MathTrail 教练的原型：一张从易到难的专题地图，以及孩子在每个专题上的等级。

research:
  title: 研究发现了什么
  lead: 给孩子出奥数题已经有一百多年了，但认真研究其效果的工作并不多。下面是其中的四项。
  # Each finding under a tag of where and whom, a short line in large letters
  # with a line under it, and the words of the small drawing under its text.
  findings:
    rebholz2022:
      tag: 德国 · 3～4年级
      big: 一门解题课程
      small: 两个方面的成绩都更好
      title: 备赛的效果在学校里也看得到
      text: 在德国，一批3年级和4年级的学生上了一门奥数风格的解题课程。在数学奥林匹克竞赛中，这些孩子的成绩明显好于没上这门课就参赛的孩子，其中4年级的学生在学校的数学测验中也考得更好。这些学生是由老师挑选来上这门课的。
      mark:
        - 在奥赛中
        - 在学校测验中
    biondi2012:
      tag: 巴西 · 2009年
      big: 1900万
      small: 名学生在一年内参赛
      title: 参加奥赛的学校数学成绩更高
      text: 巴西面向公立学校的数学奥林匹克向每一名学生开放，2009年有1900万名学生参加。参加这项竞赛的学校，其9年级学生在全国统考中的数学成绩更好，而且参加的年数越多，成绩越好。
      mark: 参加年数越多，分数越高
    agarwal2020:
      tag: 国际数学奥林匹克
      big: IMO
      small: 分数越高，在科学上走得越远
      title: 奥赛高手在科学道路上走得远
      text: 青少年在国际数学奥林匹克上的得分越高，日后就越常拿到博士学位、发表研究成果、被他人引用，并赢得数学界的最高奖项。
      mark:
        - 博士学位
        - 论文
        - 引用
        - 最高奖项
    nunes2007:
      tag: 英国 · 6岁
      big: 16个月
      small: 六岁时的逻辑预示了日后的数学成绩
      title: 推理从六岁就能学
      text: 六岁孩子的逻辑推理能力，预示了这些孩子16个月后的数学成绩。学过这种推理的孩子，数学进步比没学过的孩子更大。
      mark:
        from: 6岁
        to: +16个月

