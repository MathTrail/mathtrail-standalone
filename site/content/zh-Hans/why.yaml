time:
  title: 为什么学校没有时间做这些
  # Each card with the words of the small drawing at its foot.
  cards:
    syllabus:
      title: 面向全班的教学大纲
      text: 老师得让每个学生都达到标准。大纲以外的题，很难找到课时。
      lesson: 一节课
      length: 45分钟
      all: 全班的大纲
      extra: 大纲外的题
    answer:
      title: 考试看答案，不看思路
      text: 考试检查的是结果。很少有时间去细看孩子是怎样推理的，又是在哪一步出的错。
      steps: 解题过程：没人看
      answer: 答案：{answer}
    circle:
      title: 不是哪里都有数学兴趣小组
      text: 不是每所学校都开设奥数兴趣小组，而最近的那个可能很远，或者只收年龄大一些的孩子。
      none: 没有
      circle: 兴趣小组

parent:
  title: 家长自己就能帮孩子准备
  note: MathTrail 不能取代奥数老师，有教练带的好兴趣小组能给孩子更多。但直到{last}年级，您都可以自己帮孩子准备奥赛。
  unneeded:
    title: 您不需要
    items:
      - 数学学位
      - 事先知道解法
      - 自己找题、检查题
  taken:
    title: MathTrail 负责
    items:
      - 题目
      - 答案
      - 讲解错误
      - 选择水平
  needed:
    title: 需要您做的
    items:
      - title: 孩子的好奇心
        text: 奥数题是谜题，不是考试。孩子应该感到好奇，而不是害怕出错。
      - title: 讲清楚为了什么
        text: 不是“为了拿高分”，而是为了学会在没人教过的时候自己想出办法。
      - title: 您的时间和兴趣
        text: 在孩子身边陪一会儿，经常陪比一次陪很久更好。您对一道题的兴趣是会传染的。
  # Three moments of a lesson, each with what the child says and what the
  # parent might answer; the letters stand for who speaks.
  explain:
    title: 怎样向孩子解释这是为了什么
    lead: 三个常见的时刻，以及您可以怎么说。“孩”代表您的孩子。
    child: 孩
    you: 您
    talks:
      why:
        moment: 问“有什么用？”
        child: 我为什么要做这些题？又没人布置。
        you: 这就像猜谜语：答案藏起来了，你能把它找出来。
      wrong:
        moment: 答错了
        child: 我又做错了……
        you: 在这里可以做错：错误会告诉你哪里需要再想一想。
      right:
        moment: 答对了
        child: 做完了！答案是五。
        you: 最棒的不是答案，而是你是怎样得出它的。

thinking:
  title: MathTrail 怎样教孩子思考
  lead: 不靠题目的数量，而靠围绕每道题发生的事。
  points:
    - title: 一道题，一个思路
      text: 每道题都属于一个专题，比如“{enumeration}”“{parity}”或“{knights}”。这些专题组成一张地图，从简单到困难。
    - title: 够得着的题
      text: 每个专题都有自己的评分。MathTrail 根据它来选择接下来的专题和难度；年级只决定起点。
    - title: 错误就是诊断
      text: 每个错误选项背后都有一个有名字的陷阱。讲解从孩子是怎么想的出发，而不是从正确答案出发。
    - title: 用提示代替答案
      text: 孩子可以在卡片上打开提示，成年人也可以在聊天里用孩子自己的话问：“为什么不是6？”模型会就这道题作答。
  topics: 查看全部专题 →
  # The name of the child the card on this page shows, an invented one.
  child: 彗星
  caption: 聊天在答错后显示的卡片。孩子和数字只是举例。
  # Two messages of the chat beneath the card: the adult's question and the
  # model's reply, about the step and to nobody, for the adult to read out to
  # the child. They are the site's words, never the card's.
  chat:
    label: 聊天示意
    adult: 成年人
    model: 模型
    question: 为什么不是6？
    reply: 六根的话，就把一根柱子数了两次。从左边沿着篱笆看，每个间隔的末端都有一根柱子，所以4个间隔带来4根柱子，而第一根柱子立在所有间隔的前面。4 + 1 = 5。

app:
  title: 为什么这不是一个普通的应用
  lead: 一项研究调查了三到五岁孩子玩的应用，发现约有三分之二用了让孩子玩得更久的设计（{source}）。MathTrail 的做法不同，这一点可以查证。
  # A make-believe app of the kind that keeps a child at the screen, every
  # trick of it, and what MathTrail has of them.
  bait:
    coins: 12,450
    gems: "87"
    timer: 03:59后领奖励
    cheer: 你是冠军！！！
    praise: 1道算术题，你做对了1道。太厉害了！
    chest: 打开宝箱！
    hat: 龙帽 · ¥68
    premium: 开通会员，金币×2！
    caption: 眼熟吗？这些 MathTrail 一样也没有。
  # Each card with the short things at its foot that show what it says.
  cards:
    checked:
      title: 每道题都由程序检查
      text: 模型写出一道题，再写一个解这道题的程序。服务器在封闭的沙箱里运行这个程序，检查是否恰好只有一个选项正确、答案是否一致、文字是否适合该年级，以及是否与之前题目的文字重复。没通过检查的题，永远到不了孩子面前。
      checks:
        - 唯一答案
        - 对得上
        - 够得着
        - 不重复
      fails: 未通过 → 孩子看不到
    free:
      title: 免费，原因很明白
      text: MathTrail 没有自己的 AI。题目由您聊天里的模型来写，用的是您现有的额度，Claude 的免费计划也够用。服务器几乎没什么要花钱的地方，所以没有订阅、没有广告，也没有锁定的专题。
      price: ¥0
      none:
        - 订阅
        - 广告
        - 锁定专题
    data:
      title: 数据留在您手里
      text: 孩子的档案是您 Google 云端硬盘里的一个文件。只有正在解的那道题的答案和解答是密封的，这样孩子就没法偷看。服务器在两次请求之间不保留任何东西，也不出售任何东西。
      # After the name of the profile's file.
      where: 您的 Google 云端硬盘
      server: 服务器上：无
    screen:
      title: 没有让孩子黏在屏幕前的东西
      text: 没有金币，没有宝箱，没有倒计时，也没有广告。题目解出来后，就可以关掉聊天，晚饭时再聊聊这道题。
      none:
        - 金币
        - 宝箱
        - 倒计时
        - 广告
      after: 题解完了 → 吃晚饭
