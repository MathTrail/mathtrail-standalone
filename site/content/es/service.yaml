flow:
  title: Una clase, llamada a llamada
  lead: "El modelo y la tarjeta llaman a las mismas herramientas y se apoyan en una única fuente de verdad: el archivo del perfil en el Drive de la familia. Para que la clase siga, no necesitan decirse nada."
  legend: Escenario
  scenarios:
    task: Problema
    answer: Respuesta
    signin: Acceso
  kinds:
    call: una llamada
    reply: su respuesta
    host: dentro del host
  actors:
    adult: Persona adulta
    kid: Niño o niña
    card: Tarjeta
    model: Modelo del host
    service: MathTrail
    drive: Drive
    browser: Navegador de la familia
    host: Host
    google: Google
  task:
    rows:
      - «un problema nuevo, por favor»
      - next_task
      - "El host dibuja la tarjeta en cuanto empieza la llamada: «Preparando el siguiente problema…»"
      - límites · la regla elige el tema, el nivel y la dificultad
      - escribir la petición abierta
      - "la petición está abierta: obtén el paquete"
      - get_package
      - encargo · 3 problemas de referencia · trampas · plantillas · ejemplos de dibujos
      - El modelo escribe el problema, un solucionador en Starlark y una autocomprobación
      - "submit_task: hasta 3 intentos"
      - comprobaciones · el solucionador debe encontrar exactamente una opción correcta
      - el problema pasa a ser el actual, con su respuesta sellada
      - "read_task: la tarjeta pregunta cada 4 s"
      - texto · dibujo · cinco opciones · pista, sin la respuesta
    caption: "Cada llamada lee además el perfil desde Drive; esas lecturas se omiten. La tarjeta que espera nunca ve el paquete: sus problemas de referencia llevan sus respuestas. Mientras el niño o la niña resuelve, el modelo escribe por adelantado el siguiente problema con prepare_task, y cuando se pide otro, next_task lo pone enseguida en una tarjeta nueva, sin esta espera."
  answer:
    rows:
      - pulsa C
      - "submit_answer: el chat no gasta ningún turno"
      - solo la primera respuesta · ahora se abre el sello · θ y δ solo se mueven según si es correcta
      - escribir las puntuaciones y el historial
      - correcta o no · la trampa detrás de C · el dibujo de la solución · los pasos · la puntuación antes → después
      - La tarjeta se convierte en el repaso de la respuesta, en el lugar del problema
      - "ui/update-model-context: una línea, que se lee con el siguiente mensaje de la persona adulta"
      - «¿por qué hay un poste más?»
      - responde sobre este mismo problema, completando la tarjeta
    caption: La pulsación registra la respuesta antes de que se explique nada, y la tarjeta se convierte enseguida en el repaso de la respuesta. El chat no gasta ningún turno y el modelo no dibuja nada. El modelo lee la línea de la tarjeta con el siguiente mensaje de la persona adulta y responde a una pregunta sobre el problema sin volver a contar lo que muestra la tarjeta. Si la línea que el host envía al modelo se pierde, el modelo se pone al día en su siguiente llamada.
  signin:
    rows:
      - POST /mcp, sin token
      - 401 · dónde están los metadatos
      - abre /oauth/authorize · PKCE S256
      - authorize
      - "Una pantalla de consentimiento propia: qué cliente, y adónde devolverá a la persona adulta"
      - inicio de sesión con Google · solo drive.file
      - de vuelta, con el código de Google
      - /oauth/callback
      - intercambiar el código
      - "/about: ¿de quién es este Drive?"
      - id de usuario = HMAC de la cuenta de Drive · los tokens de Google, sellados en nuestro código
      - 302 · code = mt1.c.…
      - devuelve el código
      - /oauth/token · código + verificador
      - acceso 15 min · actualización 30 días
    caption: "La persona adulta inicia sesión una sola vez. El servicio no guarda nada de este intercambio: la petición viaja sellada en el parámetro state, y los tokens de Google, en un código sellado."
  machine:
    title: El problema actual como máquina de estados
    lead: Cada regla de «solo una vez» es un campo del perfil, que se comprueba dentro de la misma lectura, cálculo y escritura. Ninguna otra cosa recuerda nada.
    forward:
      - encargo listo
      - sellado, entregado
      - registrada una vez
    turns:
      - "rechazado, quedan intentos: no más de tres por petición"
      - tres rechazos, o 15 minutos desde que se abrió la petición; no se gastan problemas del día, y tres rechazos cuentan como una petición fallida del día
      - "«Otro problema» antes de una respuesta: se registra como en blanco y la puntuación no cambia"
      - cualquier respuesta posterior —desde una segunda pestaña o desde el modelo— recibe el primer resultado y no escribe nada
      - el siguiente problema, en una tarjeta nueva; el ya respondido deja de ser el actual
      - "el siguiente problema ya estaba escrito: next_task lo pone enseguida en una tarjeta nueva, saltándose requested"
      - el sello ya no se puede abrir porque la clave ha rotado dos veces; no se registra nada
state:
  title: Dónde vive el estado
  lead: "Todo lo que un servidor con estado guardaría en una base de datos lo guarda otro: en un token sellado que conserva el chat, en una cookie del navegador de la familia o en el propio Drive de la familia. Reinicie el servicio o arranque una segunda copia: no se pierde nada."
  self:
    label: El propio MathTrail
    value: Nada
    note: Ni cuentas, ni sesiones, ni registros de clientes, ni tokens de Google. Cada petición lleva todo lo que necesita.
  stores:
    tokens:
      title: El almacén de tokens del chat
      sub: Tokens sellados, opacos para el host
      rows:
        access:
          name: Token de acceso
          life: 15 min
        refresh:
          name: Token de actualización
          life: 30 días, ≤ 90
      note: Dentro van sellados los tokens de Google, un id de usuario opaco para los límites y el país desde el que la persona adulta inició sesión.
    browser:
      title: El navegador de la familia
      sub: Dos cookies, sin sesión
      rows:
        approvals:
          name: Clientes aprobados
          life: 180 días
        csrf:
          name: Protección del inicio de sesión (CSRF)
          life: 10 min
      note: Perderlas cuesta una pantalla de consentimiento más, o volver a iniciar sesión.
    drive:
      title: El Drive de la familia
      sub: Lo único que se guarda a largo plazo
      rows:
        profile:
          life: hasta que se elimine
      note: El perfil, las puntuaciones y el problema actual, con su respuesta sellada. La persona adulta puede abrir el archivo, y Drive guarda su historial.
    secrets:
      title: Secret Manager
      sub: Se leen una vez, al arrancar una instancia
      rows:
        keys:
          name: Claves de sellado
          sub: tras una rotación, la clave anterior se sigue aceptando
          life: 90 días
        client:
          name: Secreto de cliente de Google
          life: fijado
    memory:
      title: La memoria de la instancia
      sub: "Solo cachés: se pierden al reiniciar, y nada se rompe"
      rows:
        rates:
          name: Contadores de ritmo de peticiones
          life: minutos
        location:
          name: Dónde está el archivo del perfil
          life: 10 min
        clients:
          name: Documentos de los clientes
          life: de 5 min a 24 h
  absent:
    title: Lo que la v1 deja fuera a propósito
    items:
      - Una base de datos
      - Colas
      - Un almacén de sesiones
      - Una caché compartida
      - Un banco de problemas ya escritos
      - Un cliente de API de LLM
      - REST y OpenAPI
profile:
  title: El archivo del perfil
  lead: "Un niño o niña, un archivo JSON: no una caché de alguna verdad guardada en un servidor, sino la verdad misma. Cada bloque tiene un tope que se respeta en cada escritura, así que el archivo nunca crece sin límite: uno normal no pasa de la meta, y uno cerca de sus topes la supera. Los problemas pasados se guardan como huellas, no como texto."
  size: Tamaño del archivo
  legend: Qué tamaño mostrar
  typical: Normalmente
  cap: Cerca de los topes
  total: "≈ {kb} KB"
  kb: "{kb} KB"
  goal: "meta {kb} KB"
  segment: "{name} · {typical} / {cap} KB"
  heads:
    block: Bloque
    holds: Qué contiene
    writers: Quién lo escribe
    size: Tamaño
  blocks:
    fingerprints:
      name: Huellas
      holds: Hasta 200 esbozos de los problemas entregados, para comprobar los casi duplicados; sin texto, sin tema, sin fecha
    history:
      name: Historial de puntuaciones
      holds: Dónde estaban θ y el δ del tema antes de cada respuesta reciente, y θ y cada tema al comienzo de cada uno de los últimos 7 días con respuestas
    ratings:
      name: Puntuaciones y temas
      holds: "θ y el punto de partida del niño o la niña; para cada tema: δ, las respuestas, las trampas en las que cayó, el dominio y su nivel"
    recent:
      name: Respuestas recientes
      holds: Las últimas 20 respuestas y problemas en blanco, y nunca menos de las 5 respuestas que lee la regla
    sealed:
      name: Problema actual, sellado
      holds: La respuesta, la trampa detrás de cada opción incorrecta, la solución y el solucionador, en una sola cadena opaca
    open:
      name: Problema actual, abierto
      holds: "Lo que muestra la tarjeta: el texto, el dibujo, cinco opciones, la pista y, después de responder, la propia respuesta"
    request:
      name: Petición abierta
      holds: "Mientras se escribe el problema: su id, el encargo, los intentos usados y quién eligió el tema"
    service:
      name: Servicio y niño o niña
      holds: La versión del esquema, un UUID aleatorio, la revisión; el seudónimo, el grado, los intereses, las anotaciones; los contadores del día
  every-write: cada escritura
  note: "Un problema escrito por adelantado está junto al actual y pesa más o menos lo mismo. El archivo no contiene los textos de los problemas pasados, ni la respuesta en claro hasta que el niño o la niña haya respondido, ni nada que nombre a la persona adulta, ni una etapa: las etapas se calculan cuando se muestran. Drive no tiene escritura condicional, así que el archivo se vuelve a leer antes de guardar y, si ha cambiado, la escritura se rechaza: dos pestañas nunca se sobrescriben entre sí en silencio."
seal:
  title: Qué se sella y por cuánto tiempo
  lead: "Un mismo mecanismo cumple dos funciones: sella el inicio de sesión dentro de los tokens que guarda el chat, y la respuesta de un problema —la del actual y la del escrito por adelantado— dentro del perfil. Cada sello lleva su propósito, así que un token de acceso no puede hacerse pasar por un token de actualización, ni una respuesta sellada por ninguna otra cosa."
  token:
    title: Un token, desglosado
    version: versión del formato
    purpose: propósito
    purposes:
      c: código
      a: acceso
      r: actualización
      d: cliente
      s: state
      k: consentimiento
      t: respuesta de un problema
    key: id de la clave
    key-note: se toma de la propia clave, así que una rotación pasa inadvertida
    cipher: texto cifrado
    cipher-note: XChaCha20-Poly1305, un nonce aleatorio de 192 bits
    note: "No es un JWT: nadie más que el servicio lo lee, y de una cadena opaca no puede filtrarse ningún claim a un registro."
  life:
    title: Vigencias, en escala logarítmica
    ticks:
      - 1 min
      - 1 h
      - 1 día
      - 1 semana
      - 6 meses
    items:
      code:
        name: Código de autorización
        life: 60 s
      signin:
        name: Inicio de sesión en curso
        life: 10 min
      access:
        name: Token de acceso
        life: 15 min
      refresh:
        name: Token de actualización
        life: 30 días deslizantes, 90 como máximo
      key:
        name: Clave de sellado
        life: se rota cada 90 días
      approvals:
        name: Clientes aprobados
        life: 180 días
    note: Un servidor sin estado no puede marcar un código como usado, así que la ventana del código se mantiene pequeña. Tras una rotación, la clave anterior se sigue aceptando, de modo que ni un token ni una respuesta sellada se pierden cuando cambia la clave.
