title: Cómo funciona el servicio
description: "Cómo funciona MathTrail por dentro: sus partes y cómo se conectan, una clase llamada a llamada, dónde vive su estado y el perfil en el Drive de la familia."
hero:
  badge: Para público técnico
  title: Cómo funciona el servicio
  lead: "MathTrail se sitúa entre el chat que una familia ya usa y su Google Drive. El modelo del chat escribe cada problema, y el servicio decide si llega hasta el niño o la niña. Es un solo programa: no llama a ningún modelo propio y no guarda nada entre peticiones."
  chips:
    - Un binario de Go en Cloud Run
    - Sin estado
    - Sin base de datos
    - Sin llamadas propias a LLM
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail en tres niveles
  client:
    title: Cliente de chat
    tag: 1 · cliente
    others: otros hosts de MCP Apps
    note: El modelo del chat escribe el problema, y la tarjeta se lo muestra al niño o la niña.
  mcp: "{via} · llamadas a herramientas por HTTPS"
  cloud:
    title: MathTrail en Google Cloud
    tag: 2 · ejecución
    sub: Cloud Run · un binario de Go · sin estado
    core: "El núcleo: cálculo puro"
    around: "A su alrededor: OAuth, el servidor MCP, la tarjeta, el sellado, los límites."
  drive: "{via} · con el propio token de la familia"
  storage:
    title: Google Drive
    tag: 3 · almacenamiento
    note: "Un archivo por cada niño o niña, en el propio Drive de la familia: lo único que se guarda a largo plazo."
map:
  title: El mapa
  lead: "Quién habla con quién. Ni el niño o la niña ni la persona adulta llegan directamente a MathTrail: hablan con el host del chat. Todo lo que hay en el bloque central es parte de un mismo proceso, no un servicio aparte. Elija cualquier parte para ver qué hace y con qué se conecta."
  legend: Partes del servicio
  whole: Ninguna parte elegida
  hint: "Elija una parte del mapa: todo lo que se conecta con ella sigue resaltado, y lo demás se atenúa."
  linked: Se conecta con
  reset: Borrar ✕
  columns:
    family:
      title: El chat de la familia
      sub: Claude en el navegador, en el ordenador y en el teléfono · ChatGPT
    service:
      title: MathTrail
      sub: Un binario de Go · Cloud Run · un dominio propio
      tag: entre las partes, simples llamadas a funciones
    outside:
      title: Google y GitHub
      sub: Los únicos servicios fuera del binario
  groups:
    people:
      title: Personas
      short: El chat de la familia
    host:
      title: Host del chat
      short: Host del chat
    entry:
      title: La entrada
      short: MathTrail · la entrada
    tools:
      title: "Herramientas: leer el perfil, calcular, volver a escribirlo"
      short: MathTrail · herramientas
    core:
      title: Cálculo puro, sin red
      short: MathTrail · cálculo puro
    around:
      title: Alrededor del núcleo
      short: MathTrail · alrededor del núcleo
    account:
      title: La cuenta de Google de la familia
      short: La cuenta de Google de la familia
    cloud:
      title: Google Cloud
      short: Google Cloud
    github:
      title: GitHub
      short: GitHub
  parts:
    adult:
      name: Persona adulta
      sub: Madre, padre o docente · quien inicia sesión
      about: "Madre, padre o docente. Es titular tanto de la cuenta del chat como de la cuenta de Google: conecta MathTrail, inicia sesión una vez, crea el perfil, lleva la clase en el chat y sigue el progreso. Es la única persona que inicia sesión y la única que escribe."
    kid:
      name: Niño o niña
      sub: 1.º–6.º de primaria · sin inicio de sesión propio
      about: De 1.º a 6.º de primaria. Resuelve los problemas en la tarjeta, dentro del chat de la persona adulta. No tiene inicio de sesión propio.
    model:
      name: El modelo del host
      sub: Escribe el problema, el solucionador, las explicaciones
      about: Claude o ChatGPT. Escribe el problema, un solucionador en Starlark, una explicación para cada opción incorrecta y una autocomprobación; lleva la clase con palabras allí donde no se dibujan tarjetas. MathTrail en sí no llama a ningún modelo.
    appsrt:
      name: Entorno de ejecución de MCP Apps
      sub: El marco aislado en el que vive la tarjeta
      about: Dibuja la tarjeta en un marco aislado, le pasa el idioma, la plataforma y el tamaño, y reenvía las llamadas propias de la tarjeta con el token del host; la propia tarjeta nunca ve el token.
    cimd:
      name: Documento de metadatos del cliente
      sub: El client_id del host es una dirección HTTPS
      about: El host se identifica con una dirección HTTPS. MathTrail obtiene el documento de esa dirección, con protección contra SSRF, en lugar de mantener un registro de clientes.
    router:
      name: Enrutador HTTP
      sub: /mcp · /oauth/* · /health
      about: "La única entrada: /health, /mcp, los endpoints de OAuth y .well-known. Tiempos de espera, un límite al tamaño del cuerpo, una comprobación de Origin; el emisor es su propio dominio, y cualquier otro Host recibe un 404."
    authsrv:
      name: Servidor de autorización
      sub: OAuth 2.1 + PKCE, consentimiento
      about: "MathTrail es su propio servidor OAuth 2.1 con PKCE: metadatos, una pantalla de consentimiento propia, inicio de sesión con Google, tokens, renovación y revocación. Todo lo que guardaría un servidor con estado va sellado en tokens y cookies."
    mcpsrv:
      name: Servidor MCP
      sub: Streamable HTTP, sin estado
      about: "El protocolo: Streamable HTTP 2026-07-28, sin estado, sobre el SDK oficial de Go. Enumera y llama a las herramientas, sirve la tarjeta como recurso ui:// y entrega al modelo sus instrucciones con su versión."
    limits:
      name: Límites
      sub: Por dirección, por cuenta, por día
      about: Un ritmo por dirección antes de iniciar sesión y por cuenta después, y un tope general, todo en memoria; luego, los topes diarios, que cuenta el perfil. Pasado un límite, una frase sencilla que el modelo transmite.
    tools:
      name: Herramientas
      about: "Doce herramientas con la misma forma: leer el perfil, calcular, volver a escribirlo. El modelo llama a la mayoría; la tarjeta llama a las suyas: para el problema, la respuesta, el progreso y el formulario del perfil. Nada secreto entra nunca en un resultado."
    rule:
      name: La regla
      sub: Tema, objetivo, corredor de dificultad
      about: "Elige el encargo de forma determinista: tras un error, el mismo tema, para afianzarlo; si no, el tema que lleva más tiempo sin aparecer; la dificultad, del corredor donde la probabilidad de acertar es del 70–85 %."
    rating:
      name: Puntuaciones
      sub: θ, δ, β · Elo sobre TRI
      about: P = 0,2 + 0,8·σ(θ + δ − β). Elo solo se mueve según si una respuesta es correcta, con un paso que se va reduciendo; una escala de ajedrez y once etapas; un tema cuenta como dominado según una estimación prudente.
    checks:
      name: Comprobaciones
      sub: Lo que debe superar un problema enviado
      about: "Lo que debe superar un problema enviado: su estructura y cinco opciones diferentes, las letras del idioma de la clase, explicaciones distintas, el solucionador, la autocomprobación, la legibilidad, los casi duplicados y el dibujo: su formato, sus etiquetas cotejadas con el enunciado y que no lleve escrita la respuesta. Todos los fallos se comunican de una sola vez."
    solver:
      name: Solucionador
      sub: Entorno aislado de Starlark, límite de pasos
      about: Ejecuta el programa en Starlark del modelo, que prueba las opciones; exactamente una debe resultar correcta. Límites de pasos y de tiempo, sin red y sin archivos.
    content:
      name: Contenido
      sub: Catálogos, problemas de referencia, instrucciones
      about: "Todo lo que va incorporado en el binario y no es código: los catálogos de temas, trampas y habilidades, los problemas de referencia, los esquemas, las plantillas de solucionadores, un ejemplo de cada tipo de dibujo y las instrucciones del modelo con su versión."
    widget:
      name: Widget
      sub: La tarjeta · un archivo HTML
      about: "La tarjeta: Preact compilado en un solo archivo HTML que no carga nada de fuera, con los diccionarios de los idiomas dentro. El diseño funciona desde 320 px, y los botones se pulsan bien con el dedo."
    store:
      name: Almacén
      sub: El perfil y el problema actual
      about: Encuentra el perfil por una marca oculta, compara antes de escribir, concilia dos pestañas, restaura el archivo desde las revisiones fijadas de Drive cuando la persona adulta lo pide, y no se sale de un pequeño presupuesto de llamadas a Drive.
    seal:
      name: Sellado
      sub: Tokens y la respuesta sellada
      about: "Un mecanismo, dos funciones: sella el inicio de sesión y los tokens de Google dentro de los tokens que guarda el host, y la respuesta de un problema —la del problema actual y la del escrito por adelantado— dentro del perfil. Las claves vienen de Secret Manager y rotan según el id de la clave."
    logs:
      name: Registro
      sub: Resúmenes, sin datos personales
      about: "Un resumen estructurado por llamada: la herramienta, el resultado, la duración, la versión de las instrucciones; los intentos y los motivos de un rechazo, como eventos del problema. Sin datos personales, sin texto de problemas, sin respuestas."
    boot:
      name: Contenedor y configuración
      sub: Entorno, versión, apagado
      about: Conecta las partes entre sí y las cierra en orden inverso, trabaja con tiempos de espera y un apagado ordenado, lee toda su configuración del entorno y se niega a arrancar en Cloud Run con opciones de desarrollo activadas.
    goauth:
      name: Google OAuth
      sub: Solo drive.file
      about: El inicio de sesión de la persona adulta, solo con el permiso drive.file, la renovación y la revocación. Revocar cualquier token pone fin a todo el acceso.
    gdrive:
      name: Drive API v3
      sub: El único almacenamiento a largo plazo
      about: "El único almacenamiento a largo plazo: un perfil JSON en una carpeta visible llamada MathTrail, en el Drive de la familia, que se lee y se escribe con el propio token de la familia."
    sm:
      name: Secret Manager
      sub: Claves de sellado, el secreto de cliente
      about: "Las claves de sellado y el secreto de cliente de Google: versiones fijadas, que se leen una vez al arrancar una instancia."
    ar:
      name: Artifact Registry
      sub: La imagen, por su resumen
      about: La imagen de cada revisión, por su resumen; las imágenes antiguas se eliminan.
    clog:
      name: Cloud Logging
      sub: El destino de stdout
      about: El destino del stdout del servicio. Las líneas con las que se cuenta a los niños y las niñas se guardan 62 días en un bucket propio.
    bq:
      name: BigQuery → Data Studio
      sub: Recuentos guardados durante años
      about: Los recuentos de uso se guardan durante años y se vuelven a calcular cada noche; ninguna tabla contiene el nombre con el que se cuenta a un niño o una niña. Un informe privado y otro público, que no muestra ningún grupo de menos de diez niños y niñas.
    ga:
      name: Actions
      sub: Compilación, comprobaciones, despliegue
      about: La compilación, las comprobaciones, la publicación de la imagen y el despliegue mediante la Federación de identidades para cargas de trabajo, sin claves de cuentas de servicio.
    pages:
      name: Pages
      sub: Este sitio, la política y las condiciones
      about: "Este sitio: las páginas de los temas, y la política de privacidad y las condiciones de uso a las que enlaza la pantalla de consentimiento."
