# The page "About", for a parent, in Russian: who makes MathTrail — one family,
# each of us under a role — and where to write. The children go by their place
# in the family, never by name, and each of us by the key our photograph goes
# by. The address and the link to the code are the footer's, which the page
# fills in.

title: О нас
description: "MathTrail делает одна семья: кто чем занят и как с нами связаться."

# The first screen, beside the photograph of the four of us; photo says what
# it shows, for whoever cannot see it.
hero:
  title: MathTrail делает одна семья
  lead: >-
    MathTrail — это проект, выросший из родительской заботы. Нас четверо: папа
    собирает платформу, мама — за уют и порядок в проекте, наш старший непоседа
    с горящими глазами щёлкает новые задачи, а младший — просто сладко сопит
    рядом и напоминает, ради чего мы стараемся.
  photo: Мы вчетвером за столом с шоколадным тортом, папа держит младшего на руках.

# A card for each of us: a role, who we are in the family, what we do, and
# what our portrait shows, under a heading a screen reader alone says.
team:
  title: Кто мы
  members:
    mum:
      role: Главная по всему
      name: Мама
      text: Автор идеи и главный дизайнер проекта. Формулирует продуктовые требования, а также отвечает за всё остальное — то есть вообще за всё!
      photo: Мама в бежевом жакете улыбается.
    dad:
      role: Фулстек-укачиватель
      name: Папа
      text: Пишет код одной рукой, второй укачивает. Деплоит строго после дневного сна — иначе прод проснётся и заплачет.
      photo: Папа с младшим в переноске на груди, на младшем детские наушники.
    older-son:
      role: Главный по щёлканью задач
      name: Старший
      text: Первым решает новые задачи и честно говорит, где непонятно.
      photo: Старший держит игрушку из кубиков Lego, а вокруг него нарисованы белые звёзды и корона.
    younger-son:
      role: Стажёр-тестировщик на зуб
      name: Младший
      text: Пока тестирует игрушки на прочность. До первой задачи — пара лет.
      photo: Младший лежит на животе на пушистом коврике, рядом плюшевый мишка.

contact:
  title: Нашли ошибку или есть идея?
  # The address is written out in the sentence, as a link that writes to it;
  # the issue is a link to the issues of the code.
  lead: Напишите нам на {address} или {issue} — мы читаем всё.
  issue: откройте задачу на GitHub
  write: Написать нам
  github: GitHub
