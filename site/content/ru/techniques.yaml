# The page of the techniques of olympiad problem solving, for a parent, in
# Russian: the same keys, slots and order as the English file.

title: Приёмы решения олимпиадных задач
description: Приёмы, которые работают сразу во многих олимпиадных задачах. К каждому есть задача, рисунок и решение, а в конце — подсказка, какой приём попробовать.

hero:
  title: Приёмы решения олимпиадных задач
  lead: >-
    У олимпиадной задачи нет готового способа решения. Зато есть приёмы,
    которые работают сразу во многих задачах. Здесь собраны {count} самых частых, и к каждому есть задача, рисунок и решение.
  advice: >-
    Попробуйте решить задачу вместе с ребёнком, прежде чем открыть решение.
    Самое ценное — заметить, какой приём сработал, чтобы узнать его в
    следующий раз.

start:
  title: С чего начать любую задачу
  lead: >-
    Прежде чем выбирать приём, полезно пройти четыре шага. Их предложил
    математик Дьёрдь Пойа в книге *«Как решать задачу»* (1945).
  steps:
    - title: Пойми задачу
      text: Перескажи её своими словами. Что известно? Что нужно найти?
    - title: Придумай план
      text: На какую задачу она похожа? Какой приём с этой страницы можно попробовать?
    - title: Реши
      text: Решай шаг за шагом и записывай, что получилось на каждом шаге.
    - title: Проверь
      text: Подставь ответ в условие. Всё сходится? Нет ли другого ответа?

groups:
  see:
    title: Увидеть задачу
    lead: >-
      Сначала задачу нужно понять. Эти приёмы превращают текст в картинку,
      таблицу или маленький пример.
  find:
    title: Найти ответ
    lead: >-
      Когда понятно, что происходит, эти приёмы помогают дойти до ответа и
      ничего не потерять по дороге.
  prove:
    title: Доказать
    lead: >-
      На олимпиаде часто спрашивают не «сколько», а «может ли быть». Тут нужно
      не посчитать, а объяснить, почему иначе нельзя.

techniques:
  draw:
    name: Нарисуй задачу
    what: >-
      Рисунок или схема превращает слова в то, на что можно посмотреть.
      Хватит отрезков, точек и стрелок — рисовать красиво не нужно.
    when: «на столько больше», возраст, движение, части целого.
    task: Брат на 4 года старше сестры. Вместе им 16 лет. Сколько лет брату?
    steps:
      - Нарисуем возраст сестры отрезком, а возраст брата — таким же отрезком и ещё 4 года.
      - "Уберём лишние 4 года: 16 − 4 = 12. Это два одинаковых отрезка."
      - "Один отрезок — 12 : 2 = 6 лет, это сестра. Брату 6 + 4 = 10."
    answer: Брату 10 лет.
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: сверху сестра, снизу брат, вместе — 16 лет
      less: 16 − 4 = 12 — два одинаковых отрезка
      found: брату 6 + 4 = 10
    caption: >-
      Схема показывает то, что трудно удержать в голове: без «лишних» четырёх
      лет у брата и сестры поровну.
  table:
    name: Составь таблицу
    what: >-
      Когда условий много, удержать их в голове трудно. Таблица держит их за
      вас: каждое условие — крестик, а где в строке осталась одна свободная
      клетка, там ответ.
    when: несколько людей, предметов и условий со словом «не».
    task: >-
      У Ани, Бори и Веры живут кот, собака и попугай — у каждого кто-то один.
      Аня не держит кота. Боря боится собак. Кот живёт не у Бори. У кого кто?
    steps:
      - "Ставим крестики по условиям: Аня — не кот, Боря — не собака, кот — не у Бори."
      - У Бори осталась одна клетка — попугай. Значит, у Ани и Веры попугая нет.
      - У Ани осталась собака, у Веры — кот.
    answer: Аня — собака, Боря — попугай, Вера — кот.
    pictures:
      children:
        anya: Аня
        borya: Боря
        vera: Вера
      pets:
        cat: кот
        dog: собака
        parrot: попугай
    caption: Маленькая цифра в клетке — шаг решения, на котором её отметили.
  small-numbers:
    name: Начни с маленьких чисел
    aka: Частный случай
    what: >-
      Если числа большие и непонятно, с чего начать, решите ту же задачу с
      маленькими числами. Заметьте правило и примените его к большим.
    when: большие числа, «сто», «тысяча», длинные ряды.
    task: >-
      Вдоль дороги длиной 100 метров ставят столбы через каждые 5 метров,
      включая оба конца. Сколько понадобится столбов?
    steps:
      - "Сто метров не нарисуешь — возьмём дорогу в 10 м. Столбы на 0, 5 и 10 м: 3 столба на 2 промежутка."
      - "Для 15 и 20 м то же самое: столбов всегда на один больше, чем промежутков."
      - "В 100 м промежутков 100 : 5 = 20, значит, столбов 21."
    answer: 21 столб.
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: "10 м: 2 промежутка, 3 столба"
      fifteen: "15 м: 3 промежутка, 4 столба"
      twenty: "20 м: 4 промежутка, 5 столбов"
      table: дорога в метрах, промежутки и столбы
    caption: >-
      Правило видно уже на маленькой дороге — дальше его достаточно применить
      к ста метрам.
  systematic:
    name: Перебирай по системе
    what: >-
      Перебор наугад обязательно что-то пропустит или посчитает дважды.
      Перебор по системе идёт по порядку: сначала по первому признаку, потом
      по второму. Удобно рисовать дерево.
    when: «сколько способов», «сколько чисел», «выпиши все варианты».
    task: >-
      Сколько разных двузначных чисел можно составить из цифр 2, 4, 6 и 8, если
      цифры в числе не повторяются?
    steps:
      - "Выберем порядок: сначала первая цифра, потом вторая."
      - Первая цифра — 2, 4, 6 или 8. Для каждой остаются три другие.
      - "Выписываем по веткам: 24, 26, 28, 42, 46, 48, 62, 64, 68, 82, 84, 86 — ни одно не пропущено и не повторено."
    answer: 12 чисел.
    pictures:
      first: первая цифра — одна из четырёх
      total: 4 ветки × 3 числа = 12
    caption: "Дерево не даёт ничего пропустить: у каждой первой цифры — свои ветки."
  backwards:
    name: Решай с конца
    aka: Обратный ход
    what: >-
      Если известен конец истории, а спрашивают про начало, идите назад.
      Каждое действие меняем на обратное: «съел» — на «вернул», «умножил» — на
      «разделил».
    when: известно, что получилось в конце, а найти нужно, что было сначала.
    task: >-
      В вазе лежали яблоки. Таня съела половину. Потом Петя съел половину
      оставшихся и ещё одно яблоко. Осталось 2 яблока. Сколько яблок было
      сначала?
    steps:
      - "Начнём с того, что известно: в конце осталось 2 яблока."
      - "До Пети: вернём одно яблоко — 2 + 1 = 3. Это половина, значит, было 6."
      - "До Тани: 6 — половина, значит, было 12. Проверка: 12 → 6 → 6 − 3 − 1 = 2."
    answer: 12 яблок.
    pictures:
      end: в конце
      undo-petya: +1, ×2
      undo-tanya: ×2
      check: "проверка:"
    caption: >-
      Идём справа налево и делаем всё наоборот: «съел половину» — умножаем на
      2, «съел ещё одно» — прибавляем 1.
  all-the-same:
    name: Предположи, что все одинаковые
    aka: Метод предположения
    what: >-
      Когда в задаче предметы двух видов, представьте, что все они одинаковые.
      Посчитайте, насколько ответ не сходится, и станет ясно, сколько нужно заменить.
    when: два вида предметов и известно общее количество — головы и ноги, монеты двух видов.
    task: >-
      Во дворе гуляют куры и кролики. У них вместе 10 голов и 28 ног. Сколько
      во дворе кроликов?
    steps:
      - Предположим, что все 10 — куры. Тогда ног 10 × 2 = 20.
      - На самом деле ног 28, то есть на 8 больше.
      - "Каждый кролик вместо курицы добавляет 2 ноги: 8 : 2 = 4 кролика. Проверка: 4 × 4 + 6 × 2 = 28."
    answer: 4 кролика.
    # What each counter under the problem stands for.
    legend:
      hen: курица — 2 ноги
      rabbit: кролик — 4 ноги
    pictures:
      guess: "= 20 ног"
      short: ног не хватает
      fits: "4 кролика и 6 кур: 16 + 12 = 28 ног"
    caption: >-
      Сначала считаем так, будто все одинаковые, а потом меняем ровно столько,
      сколько нужно, чтобы сошлось.
  pattern:
    name: Ищи закономерность
    what: >-
      Посмотрите на первые несколько шагов и найдите, что повторяется.
      Повторяющийся кусочек позволяет «перепрыгнуть» далеко вперёд, не рисуя
      всё подряд.
    when: узоры, ряды, календарь — «какой будет двадцатый», «какой будет сотый».
    task: >-
      Флажки висят по порядку: красный, жёлтый, зелёный, синий, потом снова
      красный, жёлтый, зелёный, синий, и так дальше. Какого цвета 23-й флажок?
    steps:
      - "Найдём кусочек, который повторяется: красный, жёлтый, зелёный, синий — четыре флажка."
      - 23 флажка — это 5 полных четвёрок (20 флажков) и ещё 3.
      - 23-й — третий в своей четвёрке, а третий всегда зелёный.
    answer: Зелёный.
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21-й, 22-й, 23-й
    caption: >-
      Не нужно рисовать двадцать три флажка: достаточно понять, каким по счёту
      в четвёрке окажется нужное место.
  opposite:
    name: Предположи обратное
    aka: Доказательство от противного
    what: >-
      Чтобы доказать, что так не бывает, предположите, что бывает, и рассуждайте, пока не наткнётесь на противоречие. Так решаются почти все
      задачи про рыцарей и лжецов.
    when: «может ли быть», «докажи, что нельзя», кто говорит правду.
    task: >-
      На острове живут рыцари, которые всегда говорят правду, и лжецы, которые
      всегда лгут. Аня сказала: «Боря — лжец». Боря сказал: «Мы с Аней оба
      рыцари». Кто из них кто?
    steps:
      - >-
        **Предположим, что Боря — рыцарь.** Тогда его слова правда, и Аня тоже
        рыцарь. Но рыцарь Аня сказала, что Боря — лжец. **Противоречие.**
      - "Значит, Боря — лжец, и его слова ложь: они с Аней не оба рыцари. Так и есть."
      - Аня сказала «Боря — лжец», и это правда. Правду говорит только рыцарь, значит, Аня — рыцарь.
    answer: Аня — рыцарь, Боря — лжец.
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: А
      borya: Б
      anya-said: «Боря — лжец»
      borya-said: «Мы с Аней оба рыцари»
    pictures:
      said: «Боря — лжец»
      false: «оба рыцари» — ложь
      true: «Боря — лжец» — правда
    caption: Один путь ведёт в тупик — значит, верен другой.
  parity:
    name: Следи за чётностью
    what: >-
      Иногда не нужно знать всё — достаточно знать, чётное число или
      нечётное. Если что-то каждый раз меняется с «чёт» на «нечет», по числу
      шагов сразу видно, где можно оказаться, а где нельзя.
    when: прыжки, ходы, обмены, «через одного», «может ли получиться».
    task: >-
      Кузнечик сидит на числовой прямой в нуле. Каждый прыжок — ровно на 1
      влево или вправо. Может ли он через 5 прыжков снова оказаться в нуле?
    steps:
      - "Раскрасим клетки через одну: чётные и нечётные."
      - "Каждый прыжок меняет цвет: с чётной клетки на нечётную и обратно."
      - Число 5 нечётное, поэтому после 5 прыжков кузнечик точно на нечётной клетке, а ноль чётный.
    answer: Нет, не может.
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: синие — чётные, оранжевые — нечётные, стрелка — старт
      jumps: номер прыжка и цвет клетки после него
      after: после 5-го прыжка — только нечётные клетки
    caption: >-
      Не нужно следить, куда именно прыгал кузнечик, достаточно следить за цветом клетки.
  pigeonhole:
    name: Кролики и клетки
    aka: Принцип Дирихле
    what: >-
      Если кроликов больше, чем клеток, то в какой-то клетке сидят хотя бы два
      кролика. Звучит очевидно, но помогает доказать то, что, кажется,
      невозможно проверить.
    when: «докажи, что обязательно найдутся», «хотя бы двое», «наверняка».
    task: >-
      Сколько раз нужно бросить игральный кубик, чтобы какое-то число очков
      наверняка выпало хотя бы дважды?
    steps:
      - "На кубике 6 чисел, это 6 «клеток», а броски — «кролики»."
      - "За 6 бросков все числа ещё могут оказаться разными: 1, 2, 3, 4, 5, 6."
      - "А седьмому броску свободной клетки уже нет: какое-то число выпадет второй раз. Значит, 7 бросков."
    answer: 7 бросков.
    pictures:
      throw: синяя точка — бросок
      seventh: 7-й бросок попадает в занятую клетку
    caption: Даже если первые шесть бросков все разные, седьмому придётся повторить какое-то число.
  mirror:
    name: Повторяй симметрично
    aka: Симметричная стратегия
    what: >-
      В играх на двоих часто выигрывает тот, кто умеет зеркально повторять
      ходы соперника. Тогда ответный ход у вас есть всегда, пока он есть у соперника.
    when: игры на двоих, «кто выиграет при правильной игре».
    task: >-
      Полоска из 9 клеток. Двое по очереди ставят фишку в пустую клетку, но не
      рядом с уже занятой. Кто не может поставить фишку — проиграл. Куда
      первому поставить первую фишку, чтобы выиграть при любой игре соперника?
    steps:
      - Первым ходом поставить фишку в среднюю, пятую клетку.
      - На каждый ход соперника отвечать зеркально — в клетку напротив, через середину.
      - Если клетка соперника свободна и не рядом с занятыми, то и зеркальная тоже. Значит, без хода первым останется соперник.
    answer: В среднюю, пятую клетку, а дальше отвечать зеркально.
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: первый игрок
      second: соперник
      moves: цифра — номер хода
    pictures:
      answer: соперник — в 1-ю, ответ — в 9-ю
      stuck: "свободные клетки — рядом с занятыми: соперник проиграл"
    caption: >-
      Середина у полоски одна, а для любой другой клетки есть зеркальная.
      Поэтому первый игрок никогда не останется без хода.

labels:
  when: "Когда помогает:"
  task: Задача · {grades}
  show: Показать решение
  hide: Скрыть решение
  topics: "В темах:"

cues:
  title: Какой приём попробовать
  lead: >-
    Это подсказка по словам в условии, а не правило: многие задачи решаются двумя приёмами сразу.
  if: Если в задаче…
  try: …попробуйте
  rows:
    - «на столько больше», возраст, части целого
    - много людей, предметов и условий со словом «не»
    - большие числа, и непонятно, с чего начать
    - «сколько способов», «сколько чисел»
    - известен конец, а спрашивают про начало
    - два вида предметов и общее количество
    - "что-то повторяется: «какой будет двадцатый»"
    - «может ли быть», «докажи, что нельзя»
    - «наверняка», «хотя бы двое»
    - "игра на двоих: «кто выиграет»"
