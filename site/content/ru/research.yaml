title: Исследование
description: Цифры, на которых стоит MathTrail. Как проверки не пускают задачу к ребёнку, пока в ней что-то не так, как модель ученика выглядит рядом со своими целями и откуда взялись эталонные задачи.

hero:
  badge: Для технических специалистов
  title: Модель пишет,
  title_end: сервис проверяет.
  lead: Как MathTrail допускает до ребёнка только задачи, прошедшие {count} {noun}, и чего проверки не видят.
  paper: Статья целиком · PDF, {count} {noun}
  code: Код и данные
  flow:
    task: задача
    example: Забор длиной {length} м, столбы через каждые {gap} м, включая концы. Сколько столбов?
    solver: решатель
    sum: "{length} : {gap} + {one} = {posts} → {letter}"
    hands_in: задача и решатель
    back: отказ — обратно
    twice: решатель — дважды
    asks: один верный вариант · текст по силам классу · нет повтора прошлых задач
    passed: прошла все проверки
    sealed: ответ запечатан до ответа ребёнка
  grades: "{first}–{last} класс"
  licence: открытый код, MIT

theses:
  title: Четыре вывода статьи
  writes:
    title: Пишет модель чата
    text: Каждую задачу пишет модель того чата, которым семья уже пользуется, на языке ребёнка и в близком ему сюжете. Сам MathTrail моделей не вызывает. Это небольшой детерминированный сервис, который ничего не хранит о ребёнке между запросами.
    model: Модель чата
    model_does: пишет
    service: MathTrail
    service_does: проверяет
    child: Ребёнок
    child_does: решает
  twice:
    title: Решатель запускается дважды
    text: Вместе с задачей модель пишет короткую программу, которая вычисляет ответ и называет букву верного варианта. Сервис запускает её, сдвигает буквы на {count} {noun}, так что {from} становится {to}, и запускает снова. Программа, которая честно считает, найдёт ответ на новом месте, а та, что вписала букву вручную, не найдёт. Второй запуск бывает, когда первый выбрал ровно один вариант.
    first: Первый запуск
    second: Второй запуск, буквы сдвинуты
    picks: → {letter}
    caption: Программа, вписавшая «{letter}» вручную, во втором запуске укажет на {value}, и задачу отвергнут.
  sealed:
    title: Ответ запечатан
    text: Ответ, решение, объяснения и сам решатель зашифрованы и лежат в профиле ребёнка на Google Диске родителя. Пока ребёнок не ответил, их нет ни в том, что сервис отдаёт карточке и модели чата, ни в его журналах.
    sees: Видит ребёнок
    seen: вопрос · рисунок · варианты · подсказка
    hidden: Запечатано до ответа
    kept: ответ · решение · объяснения
    cipher: XChaCha20-Poly1305 · привязано к ребёнку и задаче
    outside: Печать не закрывает сам чат. Модель, которая написала задачу, знает ответ, а журнал вызовов в чате показывает его взрослому, если тот его откроет.
  reach:
    title: Чуть сложнее, но посильно
    text: Модель ученика предсказывает, с какой вероятностью ребёнок решит задачу, и сервис заказывает ту, у которой шанс ближе всего к {middle}, середине коридора от {low} до {high}. Новый ребёнок сначала проходит пробную серию из {trial}, и так находится его стартовый уровень.
    guess: c = {guess} — угадать один из {options}
    corridor: целевой коридор

model:
  title: "Модель ученика: цифры и цели"
  lead: Как точно сервис следует за ребёнком, насколько он держит задачи посильными, как уверенно объявляет тему освоенной и что ребёнок видит в конце серии. Числа получены на стенде с симулированными детьми из того же кода, из которого собран этот сайт.
  run:
    commit: коммит {commit} · {date}
    size: "{children} × {answers}"
    seed: зерно {seed}
  paper: Статья описывает правило на коммите {commit}, на котором посчитаны её числа. Эта страница следует за сервисом, каким он работает сейчас, поэтому числа расходятся.
  key:
    service: сервис сейчас
    interval: "{interval} интервал"
    goal: цель
    ceiling: потолок — оценка, которая знает уровень ребёнка
  groups:
    step: Как оценка следует за ребёнком
    mastery: Как объявляется освоение
    screen: Что видит ребёнок в конце серии
    screen_note: ответы {first}–{last} · цель — не больше, чем на ответах {earlyfirst}–{earlylast}
    context: Для сравнения, без цели
  rows:
    lag:
      name: Отставание от ребёнка, который учится
      unit: логит, меньше — лучше · лучшее возможное — {best}
    corridor_learning:
      name: Задачи в коридоре {low}–{high}
      unit: ребёнок учится · доля задач, больше — лучше
    jump_unsettled:
      name: Не догнаны после рывка
      unit: доля детей, меньше — лучше
    false_mastery_static:
      name: Ложные «тема освоена»
      unit: доля объявлений, меньше — лучше
    false_mastery_wide:
      name: Ложные «тема освоена», далёкие темы
      unit: доля объявлений, меньше — лучше
    late_mastery_static:
      name: Ответов до «тема освоена»
      unit: ответов, меньше — лучше
    late_mastery_wide:
      name: Ответов до «тема освоена», далёкие темы
      unit: ответов, меньше — лучше
    card_move_static:
      name: Насколько сдвигается рейтинг
      unit: очков на большинстве ответов, меньше — лучше
    rank_changes_static:
      name: Как часто меняется ранг
      unit: смен на сотню ответов, меньше — лучше
    card_move_learning:
      name: Рейтинг, ребёнок учится
      unit: очков на большинстве ответов, меньше — лучше
    rank_changes_learning:
      name: Ранг, ребёнок учится
      unit: смен на сотню ответов, меньше — лучше
    error_static:
      name: Ошибка оценки после {after}
      unit: ребёнок не меняется · логит, меньше — лучше
    corridor_static:
      name: Задачи в коридоре {low}–{high}
      unit: ребёнок не меняется · доля задач, больше — лучше
  interval: "{low}–{high}"
  goal_at_most: цель ≤ {bound}
  goal_at_least: цель ≥ {bound}
  ceiling: потолок {value}
  marks:
    reached:
      name: Достигнута
      means: Весь интервал — по лучшую сторону цели.
    on_the_edge:
      name: На границе
      means: Цель попадает внутрь интервала.
    not_reached:
      name: Не достигнута
      means: Весь интервал — по худшую сторону цели.
    baseline:
      name: Планка
      means: "Цель выведена из числа самого сервиса: это ориентир для следующего правила, а не проверка нынешнего."

live:
  title: Живые данные
  lead: Здесь видно, сбываются ли обещания модели у настоящих детей, месяц за месяцем. Числа берутся из журнала ответов без имён и без текстов задач.
  rule: Диапазон показывается, только если в нём {children} или больше и {answers} или больше, а каждое число в нём округлено до кратного {rounded}. Меньший диапазон не показывается и не сливается с другими.
  measures:
    chances: Обещано → сбылось
    kept_up: Сбылось − обещано, по числу ответов
    share: Доля верных на задачах правила
  frame:
    coming:
      badge: Скоро
      when: Числа появятся, когда будет посчитан целый месяц, в начале следующего месяца.
    too_few:
      badge: Пока мало
      when: За {month} на задачи правила ответило слишком мало детей, чтобы показать хоть одно число.
  ready:
    month: "За {month}: {children} и {answers} на задачи, которые выбрало правило."
    weighed: Взвешиваются только ответы на задачи, которые выбрало правило, после пробной серии из {trial} и без подсказки, во всех чатах вместе.
    corridor: Долю задач в коридоре на живых ответах измерить нельзя, потому что каждую задачу решают один раз.
    columns:
      promised: Обещано
      came_true: Сбылось
      answers: Ответов
      children: Детей
    chances:
      none: В этом месяце ни в одном диапазоне обещанного шанса не набралось достаточно детей.
      shown:
        caption: Каждый диапазон обещанного шанса показан точкой, и чем больше в нём ответов, тем крупнее точка. На пунктирной диагонали обещанное сбылось, а полоса показывает коридор, в котором правило выбирает задачи.
        up: ↑ доля верных
        across: обещанный шанс →
        ideal: идеально
        band: коридор
        range: "{from}–{to}"
        heading: Обещанный шанс
    kept_up:
      none: В этом месяце ни в одном диапазоне ответов не набралось достаточно детей.
      shown:
        caption: Верный ответ считается за единицу, а неверный за ноль. Из этого вычитается обещанный шанс, и разница усредняется по ответам. Правее пунктирной линии дети справились лучше обещанного, а усы показывают одну стандартную ошибку в каждую сторону, посчитанную по детям.
        range: "{first}–{last}"
        open: "{first} и дальше"
        heading: Номер ответа
        margin: Сбылось минус обещано
        error: Стандартная ошибка
    share:
      expected: ожидаем ≈ {middle} — середину коридора
      caption: Правило просит задачу, шанс которой ближе всего к {middle}, середине коридора от {low} до {high}. Точка показывает долю верных ответов, а пунктир показывает середину коридора.

sources:
  title: Откуда взялись эталонные задачи
  lead: Идеи не охраняются авторским правом, а текст охраняется. Поэтому из книги берутся только идея задачи и ответ, а формулировку, сюжет, варианты и ловушки мы пишем заново.
  authors:
    perelman:
      name: Я. И. Перельман
      books:
        firsthundred: «Для юных математиков. Первая сотня головоломок»
        secondhundred: «Вторая сотня головоломок»
        living: «Живая математика»
        arithmetic: «Занимательная арифметика»
        quick: «Быстрый счёт»
    ignatyev:
      name: Е. И. Игнатьев
      books:
        wit: «В царстве смекалки, или Арифметика для всех»
    dudeney:
      name: Генри Э. Дьюдени
      books:
        amusements: Amusements in Mathematics
        canterbury: The Canterbury Puzzles
    loyd:
      name: Сэм Лойд
      books:
        cyclopedia: Cyclopedia of Puzzles
    carroll:
      name: Льюис Кэрролл
      books:
        tangled: A Tangled Tale
        pillow: Pillow Problems
  died: † {year}
  public: Общественное достояние
  public_note: Срок охраны авторских прав на эти книги истёк. Они принадлежат всем, и пользоваться ими можно бесплатно.
  total: Итог — {count} {noun}
  each: у каждой — решатель и ловушка за каждым неверным вариантом
  level: "{count} · {first}–{last} класс"
  note: Стиль задач следует советским сборникам. У эталонных задач нет поля «источник», поэтому автора идеи конкретной задачи указать нельзя.

