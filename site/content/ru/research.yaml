title: Исследование
description: Цифры, на которых стоит MathTrail. Как проверки не пускают задачу к ребёнку, пока в ней что-то не так, как модель ученика выглядит рядом со своими целями и откуда взялись эталонные задачи.

hero:
  title: "Модель пишет, сервис проверяет:"
  subtitle: олимпиадные задачи по математике для младших школьников внутри чат-ассистентов
  lead: Как MathTrail допускает до ребёнка только задачи, прошедшие {count} {noun}, и чего проверки не видят.
  paper: Статья целиком · PDF, {count} {noun}
  code: Код и данные
  grades: "{first}–{last} класс"
  licence: Открытый код, MIT

theses:
  title: Четыре вывода статьи
  writes:
    title: Пишет модель чата
    text: Каждую задачу пишет модель того чата, которым семья уже пользуется, на языке ребёнка и в близком ему сюжете. Сам MathTrail моделей не вызывает. Это небольшой детерминированный сервис, который ничего не хранит о ребёнке между запросами.
    model: Модель чата
    model_does: пишет задачу
    service: MathTrail
    service_does: проверяет её
    child: Ребёнок
    child_does: решает её
  twice:
    title: Решатель запускается дважды
    text: Вместе с задачей модель пишет короткую программу, которая вычисляет ответ и называет букву верного варианта. Сервис запускает её, сдвигает буквы на {count} {noun}, так что {from} становится {to}, и запускает снова. Программа, которая честно считает, найдёт ответ на новом месте, а та, что вписала букву вручную, не найдёт. Второй запуск бывает, когда первый выбрал ровно один вариант.
    picks: Выбор
    first: Первый запуск
    second: Второй запуск, буквы сдвинуты
    caption: Программа, вписавшая «{letter}» вручную, во втором запуске укажет на {value}, и задачу отвергнут.
  sealed:
    title: Ответ запечатан
    text: Ответ, решение, объяснения и сам решатель зашифрованы и лежат в профиле ребёнка на Google Диске родителя. Пока ребёнок не ответил, их нет ни в том, что сервис отдаёт карточке и модели чата, ни в его журналах.
    sees: Видит ребёнок
    seen: вопрос · рисунок · варианты · подсказка
    hidden: Запечатано до ответа
    kept: ответ · решение · объяснения
    cipher: XChaCha20-Poly1305, привязано к ребёнку и к задаче.
    outside: Печать не закрывает сам чат. Модель, которая написала задачу, знает ответ, а журнал вызовов в чате показывает его взрослому, если тот его откроет.
  reach:
    title: Чуть сложнее, но посильно
    text: Модель ученика предсказывает, с какой вероятностью ребёнок решит задачу, и сервис заказывает ту, у которой шанс ближе всего к {middle}, середине коридора от {low} до {high}. Новый ребёнок сначала проходит пробную серию из {trial}, и так находится его стартовый уровень.
    guess: c = {guess}, угадать один вариант из {options}.
    corridor: Полоса показывает коридор, в котором выбирается следующая задача.

model:
  title: "Модель ученика: цифры и цели"
  lead: Как точно сервис следует за ребёнком, насколько он держит задачи посильными, как уверенно объявляет тему освоенной и что ребёнок видит в конце серии. Числа получены на стенде с симулированными детьми из того же кода, из которого собран этот сайт.
  columns:
    measure: Мерка
    earlier: Прежнее правило
    service: Сервис сейчас
    goal: Цель
    ceiling: Потолок
  groups:
    step: Как оценка следует за ребёнком
    mastery: Как объявляется освоение
    screen: Что ребёнок видит в конце серии
    context: Для сравнения, без цели
  rows:
    lag:
      name: Отставание от ребёнка, который учится
      unit: логиты, меньше лучше
      goal: "{lag} отставания сервиса"
    corridor_learning:
      name: Задачи в коридоре, ребёнок учится
      unit: доля задач, больше лучше
      goal: доля сервиса и ещё {corridor} пути до потолка
    jump_unsettled:
      name: Не догнаны после рывка
      unit: доля детей, меньше лучше
      goal: задана заранее
    false_mastery_static:
      name: Ложные «тема освоена»
      unit: доля объявлений, меньше лучше
      goal: задана заранее
    false_mastery_wide:
      name: Ложные «тема освоена», темы далеко друг от друга
      unit: доля объявлений, меньше лучше
      goal: задана заранее
    late_mastery_static:
      name: Ответов до объявления освоения
      unit: ответы, меньше лучше
      goal: в {times} больше, чем у сервиса
    late_mastery_wide:
      name: Ответов до объявления освоения, темы далеко друг от друга
      unit: ответы, меньше лучше
      goal: в {times} больше, чем у сервиса
    card_move_static:
      name: Насколько сдвигается рейтинг на карточке, ответы {first}–{last}
      unit: очки на большинстве ответов, меньше лучше
      goal: как у сервиса на ответах {earlyfirst}–{earlylast}
    rank_changes_static:
      name: Как часто меняется ранг, ответы {first}–{last}
      unit: смены на сотню ответов, меньше лучше
      goal: как у сервиса на ответах {earlyfirst}–{earlylast}
    card_move_learning:
      name: Насколько сдвигается рейтинг на карточке у ребёнка, который учится, ответы {first}–{last}
      unit: очки на большинстве ответов, меньше лучше
      goal: как у сервиса на ответах {earlyfirst}–{earlylast}
    rank_changes_learning:
      name: Как часто меняется ранг у ребёнка, который учится, ответы {first}–{last}
      unit: смены на сотню ответов, меньше лучше
      goal: как у сервиса на ответах {earlyfirst}–{earlylast}
    error_static:
      name: Ошибка оценки после {after}
      unit: логиты, меньше лучше
    corridor_static:
      name: Задачи в коридоре, ребёнок не меняется
      unit: доля задач, больше лучше
  interval: "{low}–{high}"
  marks:
    reached:
      name: Достигнута
      means: весь интервал лежит по лучшую сторону от цели.
    on_the_edge:
      name: На границе
      means: цель попадает внутрь интервала.
    not_reached:
      name: Не достигнута
      means: весь интервал лежит по худшую сторону от цели.
    baseline:
      name: База
      means: цель посчитана от числа самого сервиса, поэтому это планка для следующего правила, а не проверка нынешнего.
  ceilings:
    oracle:
      name: Оракул
      means: оценка, которая знает, где на самом деле ребёнок. Ни одно правило по ответам так не умеет, поэтому это предел для любого правила.
    perfect:
      name: Совершенство
      means: ни одного ложного освоения и никакого ожидания. Оракул пользуется правилом освоения сервиса, поэтому здесь он не потолок.
  none: Нет
  at_most: не больше {bound}
  at_least: не меньше {bound}
  own: посчитана от числа самого сервиса
  earlier: Прежнее правило показывает сервис таким, каким он был, пока его шаг не получил нижний предел, а освоение не стало осторожным.
  provenance:
    title: Откуда эти числа
    commit: Посчитаны из коммита {commit} от {date} на стенде симулированных детей из этого репозитория.
    run: "{children} на каждое правило и каждый вид ребёнка, по {answers} от каждого, с зерном {seed}."
    intervals: Каждый интервал вмещает {interval} из {resamples} повторных выборок бутстрепа.
    nobody: Ни один ребёнок и ни одна языковая модель в этом не участвовали.
    paper: Статья описывает правило на своём коммите {commit}. Эта страница следует за сервисом, каким он работает сейчас, поэтому числа расходятся.

live:
  title: Живые данные
  badge: Скоро
  lead: Здесь будет видно, сбываются ли обещания модели у настоящих детей. Числа берутся из журнала ответов без имён и без текстов задач.
  measures:
    - Обещано и сбылось, по обещанному шансу
    - Сбылось минус обещано, по числу ответов ребёнка
    - Доля верных ответов на задачах, которые выбрало правило
  when: Числа появятся, когда за месяц наберётся столько детей, что ни одного из них нельзя будет различить.

sources:
  title: Откуда взялись эталонные задачи
  lead: Идеи не охраняются авторским правом, а текст охраняется. Поэтому из книги берутся только идея задачи и ответ, а формулировку, сюжет, варианты и ловушки мы пишем заново.
  flow:
    - Задачник в общественном достоянии
    - Идея и ответ
    - Claude пишет задачу своими словами
    - Добавляются решатель и ловушки
    - Мы проверяем
  authors:
    perelman:
      name: Я. И. Перельман
      books:
        firsthundred: «Для юных математиков. Первая сотня головоломок»
        secondhundred: «Вторая сотня головоломок»
        living: «Живая математика»
        arithmetic: «Занимательная арифметика»
        quick: «Быстрый счёт»
    ignatyev:
      name: Е. И. Игнатьев
      books:
        wit: «В царстве смекалки, или Арифметика для всех»
    dudeney:
      name: Генри Э. Дьюдени
      books:
        amusements: Amusements in Mathematics
        canterbury: The Canterbury Puzzles
    loyd:
      name: Сэм Лойд
      books:
        cyclopedia: Cyclopedia of Puzzles
    carroll:
      name: Льюис Кэрролл
      books:
        tangled: A Tangled Tale
        pillow: Pillow Problems
  died: умер в {year} году
  public: Общественное достояние
  public_note: Срок охраны авторских прав на эти книги истёк. Они принадлежат всем, и пользоваться ими можно бесплатно.
  total: Всего {count} {noun}
  each: У каждой есть решатель и ловушка за каждым неверным вариантом.
  level: "{count} · {first}–{last} класс"
  note: Стиль задач следует советским сборникам. У эталонных задач нет поля «источник», поэтому автора идеи конкретной задачи указать нельзя.

