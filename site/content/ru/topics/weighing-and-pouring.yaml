title: Взвешивания и переливания
description: Что такое задачи на взвешивания и переливания, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Как отмерить ровно 4 литра, если есть только сосуды на 5 и на 3 литра? Как
    на весах без гирь найти одну лёгкую монету среди многих? В этих задачах
    ребёнок составляет короткий план действий, и важно каждое правило: на
    сосудах нет делений, у весов нет гирь. Это первая встреча с алгоритмами —
    планами, которые работают, что бы ни случилось.
  method: Записывать каждое состояние и искать самый короткий путь
  teaches: Планировать шаги наперёд и продумывать каждый исход взвешивания
  # Measuring 4 litres with a 5-litre jug and a 3-litre jug, step by step.
  drawing: |2
    5 л  3 л
     5    0
     2    3
     2    0
     0    2
     5    2
     4    3

basis:
  title: Правила взвешиваний и переливаний
  cards:
    - mark: "→"
      title: Состояние — это все сосуды
      text: >-
        Записывайте, сколько в каждом сосуде после каждого шага: 5 и 0, потом 2
        и 3. Список состояний показывает, куда можно попасть и где вы уже были.
    - mark: "3"
      title: Три исхода
      text: >-
        Весы могут перевеситься влево, вправо или остаться в равновесии, так что
        у каждого взвешивания три исхода. Делите монеты на три кучки, а не на
        две.
    - mark: "!"
      title: Важно каждое правило
      text: >-
        Нет делений на сосудах, нельзя выливать воду, гири только на одной
        чашке — каждое правило меняет, какие шаги разрешены, а значит, и ответ.

idea:
  title: Три исхода взвешивания
  lead: У каждого взвешивания три исхода, поэтому оно может разделить монеты на три кучки. От этого зависит, со сколькими монетами справится данное число взвешиваний.
  table:
    head:
      - Взвешиваний
      - Исходов
      - Сколько монет
    rows:
      - - "1"
        - "3"
        - до 3
      - - "2"
        - 3 × 3 = 9
        - до 9
      - - "3"
        - 3 × 3 × 3 = 27
        - до 27
  note:
    title: Почему это важно
    text: >-
      Ребёнок, который кладёт половину монет против другой половины, тратит
      лишние взвешивания. Увидеть, что весы отвечают тремя способами, а не
      двумя, — в этом вся идея, и она ещё вернётся в информатике как поиск.

method:
  title: "Как решают: таблица состояний"
  lead: >-
    Для переливаний составьте таблицу: столбец на каждый сосуд, строка на
    каждый шаг — и пробуйте все разрешённые шаги из каждой строки, пока не
    появится цель; первое её появление и есть наименьшее число шагов. Для
    взвешиваний продумайте, что делать после каждого из трёх исходов. Примеры
    ниже идут от простого к олимпиадному.
  steps:
    - Записать состояние — что в каждом сосуде или на каждой чашке
    - Перепробовать все разрешённые шаги из него
    - Остановиться на цели и посчитать шаги

examples:
  - title: Один литр
    question: >-
      У повара есть пустой сосуд на 3 литра, пустой сосуд на 5 литров и кран.
      Делений на сосудах нет. За один шаг можно наполнить сосуд из крана,
      вылить его или переливать из одного сосуда в другой, пока первый не
      опустеет или второй не наполнится. За какое наименьшее число шагов можно
      получить ровно 1 литр в одном из сосудов?
    # What the two jugs hold after each step.
    drawing: |2
      3 л  5 л
       3    0
       0    3
       3    3
       1    5
    steps:
      - Наполним сосуд на 3 литра и перельём в сосуд на 5 литров — в нём 3 литра.
      - >-
        Снова наполним сосуд на 3 литра и будем переливать, пока большой не
        наполнится: войдёт только 2 литра.
      - "В маленьком сосуде остался 1 литр — после 4 шагов: наполнить, перелить, наполнить, перелить."
    answer: 4 шага.
    note:
      title: Почему не меньше?
      text: >-
        В таблице всех состояний, достижимых за три шага или меньше, нет 1
        литра: в сосудах бывает только 0, 2, 3 или 5 литров. Первый литр
        появляется после четвёртого шага.
  - title: Восемь монет
    question: >-
      Есть 8 одинаковых на вид монет. Одна из них фальшивая и легче остальных,
      а настоящие весят одинаково. За какое наименьшее число взвешиваний на
      весах без гирь можно наверняка найти фальшивую?
    # The first weighing: three coins on each pan and two aside.
    drawing: |2
      [●●●] [●●●]  ●●
    steps:
      - Положим по 3 монеты на каждую чашку, а 2 отложим.
      - >-
        Если одна чашка поднялась, фальшивая среди её 3 монет: сравним 1 с 1 —
        легче окажется фальшивая, а при равновесии фальшивая — третья.
      - >-
        Если равновесие, фальшивая среди 2 отложенных: сравним их между собой.
        В любом случае хватает 2 взвешиваний, а 1 не хватит: у него лишь 3
        исхода на 8 монет.
    answer: 2 взвешивания.
    note:
      title: Почему не 4 на 4?
      text: >-
        Если сравнить 4 монеты с 4, после первого взвешивания останется 4
        монеты, а для них нужно ещё 2 взвешивания — всего 3. Кучки по три
        заставляют работать и исход «равновесие».
  - title: Сто монет
    question: >-
      Среди 100 одинаковых на вид монет одна фальшивая и легче остальных, а
      настоящие весят одинаково. За какое наименьшее число взвешиваний на весах
      без гирь можно наверняка найти фальшивую?
    steps:
      - >-
        У каждого взвешивания 3 исхода, поэтому 4 взвешивания различают не
        больше 3 × 3 × 3 × 3 = 81 случая. Это меньше 100 монет, так что 4
        взвешиваний не хватит.
      - >-
        Положим по 33 монеты на чашки и 34 отложим: что бы ни случилось,
        останется не больше 34 монет. Так же 34 сводятся не больше чем к 12,
        потом к 4, к 2 и к 1.
      - "Получается 5 взвешиваний: монет остаётся 100, 34, 12, 4, 2 и 1."
    answer: 5 взвешиваний.
    note:
      title: Две половины доказательства
      text: >-
        Ответу нужны обе: план, который находит монету за 5 взвешиваний, и
        подсчёт исходов, который показывает, что 4 не хватит никогда. Ответ
        олимпиадной задачи про «наименьшее число» всегда состоит из этих двух
        половин.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      Правило задачи нарушается незаметно: воду выливают, хотя задача этого не
      разрешает, сосуд наполняют до деления, которого на нём нет, или кладут
      гирю на чашку с грузом.
    say: «Какие шаги разрешает задача?»
  stopped_early:
    shows: >-
      План обрывается раньше, чем появилась уверенность: одно взвешивание
      нашло кучку с фальшивой монетой, и поиск на этом закончен, или
      переливание остановлено на 2 литрах, когда нужен был 1.
    say: «Что бы ни показали весы — теперь точно известно?»
  off_by_one:
    shows: >-
      Шаги подсчитаны со сдвигом на единицу: первое наполнение из крана
      пропущено или последнее переливание посчитано дважды.
    say: "«Посчитай ещё раз по таблице: одна строка — один шаг.»"

home:
  - title: Сосуды в раковине
    text: >-
      Возьмите две чашки разного размера и попробуйте отмерить количество,
      которого нет ни в одной. Раковина — лучшая лаборатория: пролитая вода не
      беда.
  - title: Найдите лёгкий
    text: >-
      Спрячьте один лёгкий предмет среди нескольких одинаковых на вид и найдите
      его на домашних весах или на вешалке с двумя пакетами. Считайте
      взвешивания.
  - title: Сначала план
    text: >-
      Прежде чем переливать или взвешивать, запишите план таблицей и проверьте
      его шаг за шагом. Умение — в плане, а не в везении.

