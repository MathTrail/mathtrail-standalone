# The page of the topic of the calendar and age, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Календарь и возраст
description: Что такое задачи на дни недели, даты и возраст, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Сегодня вторник — какой день недели будет через 30 дней? Маме 30 лет, а
    Ане 6 — сколько будет Ане, когда мама станет вдвое старше её? В этих
    задачах ребёнок работает с неделями, месяцами и годами, и большинство из
    них держится на двух фактах: неделя повторяется каждые 7 дней, а разница
    в возрасте не меняется никогда.
  method: Отбросить целые недели, сохранить разницу в возрасте
  teaches: Считать дни и годы, не пересчитывая их по одному
  # The words of its drawing: a month whose Tuesdays stand in one column.
  art:
    line: Неделя повторяется каждые 7 дней
    tuesdays: все вторники — в одном столбце, через 7 дней

basis:
  title: Правила календаря
  cards:
    - title: Неделя повторяется
      text: >-
        Каждые 7 дней возвращается тот же день недели. Поэтому для 30 дней
        вперёд важны только 2 дня, оставшиеся после 4 целых недель.
      art:
        week: 7 дн
        month: 30 дней = 4 недели и ещё 2 дня
    - title: Оба конца срока
      text: >-
        С 3 мая до 10 мая — 7 дней вперёд, но каникулы с 3-го по 10-е длятся 8
        дней: считаются и первый, и последний день.
      art:
        holidays: с 3-го по 10-е — 8 дней каникул
    - title: Разница остаётся
      text: >-
        Мама сейчас на 24 года старше Ани и через 10 лет будет старше на те же
        24 года: каждый год обе становятся старше на год.
      art:
        now: сейчас
        then: через 10 лет
        anya: Аня
        mum: мама

idea:
  title: Отбросить целые недели
  lead: Какой день недели будет через сколько-то дней? Важно только то, что остаётся после целых недель.
  table:
    head:
      - Через сколько дней
      - Целые недели и остаток
      - Если сегодня понедельник
    rows:
      - - "10"
        - 1 неделя и 3 дня
        - четверг
      - - "15"
        - 2 недели и 1 день
        - вторник
      - - "30"
        - 4 недели и 2 дня
        - среда
      - - "100"
        - 14 недель и 2 дня
        - среда
  # The words of the drawings of whole weeks and the days left over.
  art:
    week: 7 дн
    weeks: 14 × 7 дн
  note:
    title: Почему это важно
    text: >-
      Отсчитывать сто дней на пальцах долго, и сбиться легко. Если отбросить
      целые недели, остаётся шаг в день-два.

method:
  title: "Как решают: найти то, что не меняется"
  lead: >-
    Ищите то, что остаётся прежним: неделя повторяется каждые 7 дней, а
    разница между двумя возрастами не меняется. Опираясь на это, отбросьте то,
    что не важно, и посчитайте только остаток. Примеры ниже идут от простого к
    олимпиадному.
  steps:
    - Найти, что повторяется или не меняется
    - Отбросить целые недели или работать с разницей в возрасте
    - Посчитать остаток и проверить, считаются ли оба конца
  # The key under the steps: what the drawings' blocks and colours mean.
  legend:
    week: 7 дн
    whole: целая неделя
    day: день остатка
    difference: разница в возрасте

examples:
  - title: Полив цветов
    question: >-
      Катя поливает цветы каждые 3 дня. В первый раз она поливает их в
      понедельник. В какой день недели она польёт их в 4-й раз?
    steps:
      - >-
        От первого полива до четвёртого не 4 промежутка, а 3, и каждый длится
        3 дня: 3 × 3 = 9 дней.
      - 9 дней — это неделя и ещё 2 дня.
      - Через неделю после понедельника снова понедельник, а ещё через 2 дня — среда.
    answer: В среду.
    badge: Ср
    note:
      title: Почему не в субботу?
      text: >-
        4 × 3 = 12 дней даёт промежуток и после четвёртого полива. Между 4
        поливами 3 промежутка, как и между 4 столбами.
    art:
      monday: Пн
      first: первый полив — понедельник, дальше каждые 3 дня
      three-days: 3 дня
      gaps: 3 промежутка × 3 дня = 9 дней
      week: 7 дн
      numbers: под синими днями — номер полива
      no-gap: после 4-го полива промежутка нет
  - title: Вера и папа
    question: >-
      Папа на 28 лет старше Веры. Через 4 года он будет втрое старше её.
      Сколько лет Вере сейчас?
    steps:
      - "Разница не меняется: через 4 года папа по-прежнему на 28 лет старше."
      - >-
        Тогда возраст папы — три Вериных, как на рисунке. Две лишние части —
        это 28 лет, значит, одна часть — 28 : 2 = 14.
      - >-
        Через 4 года Вере 14, значит, сейчас ей 14 − 4 = 10. Проверка: папе
        сейчас 38, а через 4 года 42 = 3 × 14.
    answer: 10 лет.
    art:
      now: сейчас
      then: через 4 года
      vera: Вера
      dad: папа
      difference: оранжевое — разница, 28 лет
      parts: "через 4 года: 2 части = 28, одна часть = 14"
      check: "проверка: 38 + 4 = 42 = 3 × 14"
  - title: Три чётные субботы
    question: >-
      В некотором месяце три субботы пришлись на чётные числа. Каким днём
      недели было 25-е число этого месяца?
    steps:
      - >-
        Субботы идут через 7 дней, а 7 — нечётное число, поэтому их даты
        чередуются: чётная, нечётная, чётная, нечётная…
      - >-
        Чтобы три субботы пришлись на чётные числа, суббот в месяце должно быть
        пять, и первая — с чётной датой. Пятая суббота на 28 дней позже первой
        и должна поместиться в месяц, поэтому первая — не позже 3-го. Из первых
        трёх чисел чётное только 2-е: субботы — 2, 9, 16, 23 и 30-е.
      - 23-е — суббота, а 25-е на два дня позже, то есть понедельник.
    answer: Понедельник.
    badge: Пн
    note:
      title: Чётность в календаре
      text: >-
        Ключ к задаче — чётность: 7 — нечётное число, поэтому даты одного дня
        недели каждую неделю меняются с чётных на нечётные.
    art:
      even: синие — чётные, оранжевые — нечётные
      first: первая суббота
      fifth: пятая суббота
      saturdays: субботы — синие, 25-е — понедельник

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      Счёт дней сбивается на единицу: ребёнок считает сегодняшний день первым
      из дней вперёд, насчитывает 4 промежутка между 4 поливами или теряет
      один конец срока, как у каникул с понедельника по воскресенье.
    say: «Какой день первый — сегодня или завтра?»
    art:
      gaps: Промежутки между 4 поливами
  wrong_operation:
    shows: >-
      Ребёнок делает действие, которого вопрос не просит: складывает два
      возраста, когда спрашивают, на сколько один старше, или вычитает одну
      дату из другой, когда они в разных месяцах.
    say: "«Скажи словами: число растёт, уменьшается или остаётся?»"
    art:
      older: На сколько мама (30) старше Ани (6)?
  ignored_condition:
    shows: >-
      Теряется факт календаря или условия: что в этом месяце 30 дней, а не 31,
      или что 365 дней — это целые недели и ещё один день.
    say: «Сколько дней в этом месяце?»
    art:
      year: Через 365 дней после понедельника
      weeks: 52 × 7 дн
      monday: Пн
      tuesday: Вт

home:
  - title: Календарь на стене
    text: >-
      Повесьте бумажный календарь там, где ребёнок до него дотянется, и
      спрашивайте по нему: каким днём недели будет 1-е число следующего
      месяца? Сколько пятниц в этом месяце?
  - title: Возрасты в семье
    text: >-
      Запишите возраст каждого в семье и разницы между ними. Через год
      посмотрите снова: возрасты изменились, а разницы нет.
  - title: Обратный отсчёт
    text: >-
      Посчитайте вместе дни до дня рождения или праздника: сначала по одному,
      потом целыми неделями. Убедитесь, что ответы совпали.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на календарь и возраст
