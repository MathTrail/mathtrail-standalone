# The page of the topic of percentages, for a parent, in Russian. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: Проценты
description: Что такое задачи на проценты, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Цену снизили на 20%, а потом ещё на 20%. Она снизилась на 40%? В этих
    задачах процент — это сотая часть чего-то, и вся трудность в том, чтобы
    понять, от чего он: от старой цены или новой, от всех птиц или только от
    кур. Ребёнок, который перед каждым шагом спрашивает «процент от чего?»,
    избегает большинства ошибок.
  method: Перед каждым шагом спрашивать «процент от чего?»
  teaches: Находить, от чего берётся процент, и замечать, когда это меняется
  # The words of its drawing: the whole it is drawn for.
  art:
    line: 100% — это 50

basis:
  title: Правила процентов
  cards:
    - title: Сотая часть
      text: >-
        Один процент — это сотая часть величины. 100% — вся величина, 50% — её
        половина.
      art:
        half: 50% — половина
    - title: Процент от чего?
      text: >-
        Процент всегда берётся от чего-то: от старой цены или новой, от всех
        гостей или только от девочек. Одни и те же 10% от разных величин — это
        разные числа.
      art:
        tens: 10% от 200 = 20 · 10% от 50 = 5
    - title: Сначала десять процентов
      text: >-
        10% — это величина, делённая на 10. От них до 20%, 30% или 5% — один
        шаг: 30% от 80 — это 3 × 8 = 24.
      art:
        eighty: 80 — десять частей по 8

idea:
  title: Основа меняется
  lead: Каждый процент берётся от величины в этот момент. Если цена меняется дважды, второе изменение считают от новой цены.
  table:
    head:
      - Шаг
      - От чего
      - Цена после него
    rows:
      - - скидка 20%
        - от 200, минус 40
        - "160"
      - - ещё скидка 20%
        - от 160, минус 32
        - "128"
      - - обе вместе
        - от 200, минус 72
        - скидка 36%, а не 40%
  note:
    title: Почему это важно
    text: >-
      Магазины, банки и новости говорят процентами, и подвох всегда в том, от
      чего они. Ребёнок, который спрашивает «процент от чего?», готов и к
      олимпиаде, и к магазину.

method:
  title: "Как решают: назвать сто процентов"
  lead: >-
    Перед каждым шагом скажите, какая величина — 100%. Найдите от неё 1% или
    10%, а потом нужный процент. Если величина изменилась, начинайте снова с
    новых 100%. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Назвать, что составляет 100%
    - Найти от этого 1% или 10%
    - Взять нужный процент и проверить, от чего он
  # The key under the steps: what a grid of the drawings stands for.
  legend:
    hundred: сетка из 100 клеток — это 100%

examples:
  - title: Спортивные секции
    question: >-
      В школе 300 учеников, и 35% из них ходят в спортивные секции. Сколько
      учеников не ходят в секции?
    steps:
      - "100% — это все 300 учеников, значит, 1% — это 300 : 100 = 3 ученика."
      - Не ходят в секции 100% − 35% = 65% учеников.
      - 65% — это 65 × 3 = 195 учеников.
    answer: 195 учеников.
    note:
      title: Другим путём
      text: >-
        35% от 300 — это 35 × 3 = 105 учеников, которые ходят, и 300 − 105 =
        195. Оба пути дают один ответ, но 65% сразу экономят шаг.
    art:
      go: 35 клеток из 100 — ходят в секции
      grid: вся сетка — 300 учеников
      cell: одна клетка — 3 ученика
      go-short: ходят
      do-not: не ходят
  - title: Цена велосипеда
    question: >-
      Велосипед стоит 400 монет. Весной его цена выросла на 25%, а осенью новая
      цена снизилась на 20%. Сколько стоит велосипед теперь?
    steps:
      - >-
        Весной 100% — это старая цена, 400 монет: 25% от неё — 100 монет, и
        велосипед стоит 500.
      - "Осенью 100% — это новая цена, 500 монет: 20% от неё — 100 монет."
      - 500 − 100 = 400. Велосипед снова стоит 400 монет.
    answer: 400 монет.
    note:
      title: Почему не 420?
      text: >-
        420 получается, если взять осенние 20% от старой цены, то есть 80 монет.
        Но к осени цена была 500, а 20% от 500 — это 100.
    art:
      coins: монет — цена до весны
      quarters: 100% = 400 — четыре части по 25%
      five-hundred: 500 монет
      fifths: 100% = 500 — пять частей по 20%
      of-old: 20% от 400 = 80 →
      of-new: 20% от 500 = 100 →
  - title: Арбузы сохнут
    question: >-
      У фермера 200 кг арбузов, в которых 99% воды. Через неделю они немного
      подсохли, и воды в них стало 98%. Сколько они теперь весят?
    steps:
      - >-
        Не высыхает то, что не вода: 1% от 200 кг, то есть 2 кг. Эти 2 кг
        остаются.
      - Через неделю воды 98%, значит, эти 2 кг — это 2% нового веса.
      - "2% — это 2 кг, значит, 1% — 1 кг, а 100% — 100 кг."
    answer: 100 кг.
    note:
      title: Вдвое легче?
      text: >-
        Да. Воды стало меньше всего на один процент, с 99% до 98%, зато доля
        того, что не вода, выросла вдвое, с 1% до 2%. Эти 2 кг не изменились,
        значит, весь вес уменьшился вдвое.
    art:
      melons: 200 кг, воды 99%
      dry: "200 кг: одна клетка — 1 кг; оранжевые — не вода, 2 кг"
      same: те же 2 кг — теперь 2 клетки из 100
      was: было 200 кг
      became: стало 100 кг
      water: вода 99%

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  percent_wrong_base:
    shows: >-
      Процент берётся не от той величины: осенние 20% — от старой цены вместо
      новой или 98% — от прежнего веса арбузов.
    say: «Какая величина сейчас составляет 100%?»
    art:
      question: Осенью цена 500, скидка 20%
      of-old: 20% от 400 =
      of-new: 20% от 500 =
  part_whole_swap:
    shows: >-
      Часть принимают за целое или целое за часть: 2 кг, которые не вода,
      выдают за вес арбузов или считают всю школу, когда вопрос о её части.
    say: «Это число — часть или целое?»
    art:
      question: Сколько весят арбузы?
      dry: 2 кг
      only-dry: это только не вода
      all: 100 кг
      weight: весь вес
  answered_other_question:
    shows: >-
      Ответом становится число, найденное по дороге. Спрашивают о тех, кто не
      ходит в секции, а в ответе 105 учеников, которые ходят. Спрашивают,
      сколько стоит велосипед, а в ответе 100 монет, на которые изменилась его
      цена.
    say: «Что именно спрашивается в задаче?»
    art:
      question: Сколько учеников не ходят в секции?
      go: ходят
      do-not: не ходят

home:
  - title: Проценты в магазине
    text: >-
      В магазине найдите цену со скидкой и посчитайте вместе: сколько будет
      стоить вещь за 150 со скидкой 20%? Начните с 10%.
  - title: Сначала десять процентов
    text: >-
      Потренируйтесь находить 10% от чего угодно: от 80, от 350, от 1200. От
      10% до большинства других процентов — один шаг.
  - title: Процент от чего?
    text: >-
      Когда в новостях или рекламе звучат проценты, спросите вместе: процент
      от чего? Часто об этом не говорят.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на проценты
