# The page of the topic of parity and alternation, for a parent, in Russian.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. Each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: Чётность и чередование
description: Что такое задачи на чётность и чередование, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Могут ли 15 детей встать в хоровод так, чтобы мальчики и девочки
    чередовались по всему кругу? В этих задачах чётность отвечает на вопрос,
    не пересчитывая всего и не перебирая все способы: у какого берега паром,
    возможен ли такой счёт, кто сделает последний ход. Для многих детей
    чётность — первое, что не меняется, как бы ни шли ходы.
  method: Следить, что каждый ход делает с чётностью
  teaches: Отвечать на вопрос «а так может быть?», не перебирая все способы
  # Two colours taking turns: black in the odd places, white in the even ones.
  drawing: |2
    ●  ○  ●  ○  ●  ○
    1  2  3  4  5  6

basis:
  title: Правила чётности
  cards:
    - mark: "2"
      title: Чётное делится на пары
      text: >-
        Чётное число предметов разбивается на пары без остатка. Нечётное всегда
        оставляет один предмет без пары.
    - mark: "±"
      title: Важны только нечётные
      text: >-
        Чётное плюс чётное — чётное, нечётное плюс нечётное — тоже чётное, а
        чётное плюс нечётное — нечётное. Поэтому чётность суммы зависит только
        от того, сколько в ней нечётных чисел.
    - mark: "●○"
      title: Чередование
      text: >-
        Когда двое чередуются, один стоит на нечётных местах, а другой на
        чётных. По кругу чередование возможно, только если мест чётное число.

idea:
  title: Считать только нечётные
  lead: Чтобы узнать, чётна ли сумма, складывать не нужно. Достаточно посчитать, сколько в ней нечётных чисел.
  table:
    head:
      - Сумма
      - Сколько в ней нечётных
      - Сумма будет
    rows:
      - - 4 + 6 + 8
        - ни одного
        - чётной
      - - 3 + 5
        - "2"
        - чётной
      - - 3 + 5 + 7
        - "3"
        - нечётной
      - - 1 + 2 + … + 10
        - "5"
        - нечётной
  note:
    title: Почему это важно
    text: >-
      Многие олимпиадные вопросы спрашивают, может ли что-то случиться вообще.
      Чётность отвечает «нет», не перебирая способов: если каждый ход
      сохраняет число чётным, а цели нужно нечётное, ни один ход к ней не
      приведёт.

method:
  title: "Как решают: следить за чётностью"
  lead: >-
    Найдите в задаче число, которое бывает чётным или нечётным: количество,
    сумму, место в ряду. Посмотрите, что делает с ним каждый ход — меняет
    чётность или сохраняет, — и сравните начало с целью. Примеры ниже идут от
    простого к олимпиадному.
  steps:
    - Найти, что бывает чётным или нечётным
    - Понять, что с этим делает каждый шаг
    - Сравнить начало с целью

examples:
  - title: Паром
    question: >-
      Паром перевозит машины через реку туда и обратно, снова и снова. Сначала
      он стоит у левого берега. У какого берега он окажется, переплыв реку 7
      раз?
    # The crossings after which the ferry is at each bank, 0 being the start.
    drawing: |2
      левый    |  правый
      0 2 4 6  |  1 3 5
    steps:
      - После одной переправы паром у правого берега, после двух — снова у левого.
      - >-
        Каждые две переправы возвращают его туда, откуда он начал. Поэтому
        после чётного числа переправ паром у левого берега, а после нечётного —
        у правого.
      - 7 — нечётное число, значит, паром у правого берега.
    answer: У правого берега.
    note:
      title: Почему бы просто не посчитать?
      text: >-
        Для 7 переправ посчитать быстро. Но правило так же быстро отвечает и
        для 100 переправ, и именно оно нужно в задачах потруднее.
  - title: Четыре дротика
    question: >-
      Боря бросает 4 дротика в мишень, кольца которой приносят 1, 3, 5 и 7
      очков, и каждый дротик попадает в мишень. Боря говорит, что набрал 15
      очков. Может ли так быть?
    steps:
      - Каждое кольцо приносит нечётное число очков.
      - >-
        Два нечётных числа в сумме дают чётное. 4 дротика — это две пары, и
        каждая пара приносит чётное число очков, поэтому 4 дротика вместе
        набирают чётное число.
      - 15 — нечётное число, поэтому Боря не мог его набрать.
    answer: Нет.
    note:
      title: А если дротиков 3?
      text: >-
        Три нечётных числа в сумме дают нечётное, и 15 очков возможно: 5 + 5 + 5
        или 7 + 7 + 1.
  - title: Паук на кубе
    question: >-
      Паук сидит в вершине проволочного куба. Каждую минуту он проползает по
      одному ребру до соседней вершины. Может ли он ровно через 7 минут
      оказаться в той вершине, с которой начал?
    # A cube whose corners take turns in colour: every edge joins a black
    # corner and a white one.
    drawing: |2
        ○-------●
       /|      /|
      ●-------○ |
      | ●-----|-○
      |/      |/
      ○-------●
    steps:
      - >-
        Раскрасим вершины: начальную — в белый цвет, её соседей — в чёрный,
        их соседей — в белый и так далее. Как видно на рисунке, каждое ребро
        соединяет чёрную вершину с белой.
      - >-
        Значит, каждую минуту цвет меняется: через 1 минуту паук на чёрной
        вершине, через 2 — на белой, а через любое нечётное число минут — на
        чёрной.
      - 7 — нечётное число, а начальная вершина белая. Вернуться паук не может.
    answer: Нет.
    note:
      title: А через 8 минут?
      text: >-
        Да: четыре раза проползти по ребру туда и обратно. Цвета говорят, когда
        вернуться нельзя, а то, что чётного числа минут хватает, ещё нужно
        показать.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_parity:
    shows: >-
      Чётное и нечётное меняются местами: ребёнок решает, что после 7 переправ
      паром вернулся к началу или что четыре нечётных числа дают нечётную
      сумму.
    say: "«Проверь на маленьком: где паром после одной переправы, после двух?»"
  ignored_condition:
    shows: >-
      Одно из условий теряется: ребёнок набирает 15 очков тремя дротиками и
      забывает, что Боря бросил четыре, или подбирает число, которое подходит
      к одной подсказке и не подходит к другой.
    say: «Прочитай условие ещё раз. Подходит ли ответ к каждому его слову?»
  off_by_one:
    shows: >-
      Место в ряду считается со сдвигом на единицу: начало принимают за первую
      переправу, или в ряду, который начинается и кончается мальчиком,
      мальчиков и девочек получается поровну.
    say: «Выпиши первые несколько. Какой из них первый?»

home:
  - title: Чёт или нечет?
    text: >-
      Спрячьте в кулаке горсть пуговиц и дайте ребёнку угадать: чётное их
      число или нечётное? Потом проверьте вместе, разложив пуговицы парами.
  - title: Кто сделает десятый ход?
    text: >-
      В любой игре, где ходят по очереди, спросите до конца партии: кто
      сделает десятый ход? А пятнадцатый? Ответ даёт чётность, а не
      доигрывание.
  - title: Номера домов
    text: >-
      На улице посмотрите на номера домов: по одной стороне чётные, по другой
      нечётные. На какой стороне будет дом номер 37?

