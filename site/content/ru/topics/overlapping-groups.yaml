# The page of the topic of overlapping groups, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Пересекающиеся группы
description: Что такое задачи про пересекающиеся группы, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Одни дети ходят в шахматный кружок, другие на футбол, кто-то — и туда, и
    туда, а кто-то никуда. В этих задачах группы пересекаются, и весь фокус в
    том, чтобы посчитать каждого ровно один раз. Два круга на бумаге
    превращают запутанный вопрос в четыре числа.
  method: Нарисовать круги и начать с середины
  teaches: Считать, не считая дважды, и понимать, что значит каждое число
  # The words of its drawing: what the two circles are, and what their middle
  # means.
  art:
    line: Кружки класса
    chess: шахматы
    football: футбол
    middle: в середине — те, кто ходит и туда, и туда

basis:
  title: Правила двух кругов
  cards:
    - title: Сложили — посчитали дважды
      text: >-
        Если сложить две группы, то тех, кто в обеих, посчитают дважды, по разу
        в каждой. Отнимите их один раз, и каждый будет посчитан однажды.
      art:
        choir: хор 14
        art: изо 11
        twice: "14 + 11 = 25, но 4 из них посчитаны дважды: 25 − 4 = 21"
    - title: Кто-то ни в одной
      text: >-
        Быть в группе не обязательно. Весь класс — это те, кто хотя бы в одной
        группе, и те, кто ни в одной.
      art:
        class: весь класс
        none: 9 — ни в одной группе
    - title: Когда середина не дана
      text: >-
        Если не сказано, сколько детей в обеих группах, это число можно только
        оценить: чем больше у групп общего, тем меньше детей хотя бы в одной из
        них.
      art:
        little: общего мало
        much: общего много

idea:
  title: Четыре части картинки
  lead: >-
    30 учеников: 14 поют в хоре, 11 ходят в изостудию, 4 — и туда, и туда.
    Заполним картинку от середины к краям.
  table:
    head:
      - Часть
      - Сколько
      - Как найти
    rows:
      - - В обеих
        - "4"
        - дано
      - - Только хор
        - 14 − 4 = 10
        - хор без тех, кто в обеих
      - - Только изостудия
        - 11 − 4 = 7
        - изостудия без тех, кто в обеих
      - - Ни в одной
        - 30 − 10 − 7 − 4 = 9
        - все остальные
  note:
    title: Почему это важно
    text: >-
      Чаще всего ошибаются двумя способами: складывают две группы и забывают,
      что середина посчитана дважды, или называют «только хор», когда
      спрашивали про весь хор. Заполнение картинки от середины защищает от
      обеих ошибок.

method:
  title: "Как решают: от середины к краям"
  lead: >-
    Нарисуйте два пересекающихся круга. Сначала впишите в середину тех, кто в
    обеих группах, потом остальных в каждом круге и в конце тех, кто снаружи.
    Если середина не дана, переберите значения, которые она может принимать,
    и посмотрите, какие подходят. Примеры ниже идут от простого к
    олимпиадному.
  steps:
    - Нарисовать круги
    - Заполнить середину, потом остальное
    - Проверить, что части дают всех
  # The key under the steps: what a ring on a number means.
  legend:
    filled: синее кольцо — что заполняем на этом шаге

examples:
  - title: Сёстры и братья
    question: >-
      В группе 24 ребёнка. У 15 есть сестра, у 11 — брат, а у 6 есть и
      сестра, и брат. У скольких детей нет ни сестры, ни брата?
    steps:
      - >-
        Нарисуем два пересекающихся круга, «сестра» и «брат». В середине — 6
        детей, у которых есть и то, и другое.
      - "Только сестра: 15 − 6 = 9. Только брат: 11 − 6 = 5."
      - "В кругах 9 + 6 + 5 = 20 детей. Снаружи 24 − 20 = 4."
    answer: 4 ребёнка.
    art:
      sister: сестра
      brother: брат
      all: "все: 24"
      only: 15 − 6 = 9 · 11 − 6 = 5
      out: 24 − 20 = 4 снаружи
  - title: Яблоки и груши
    question: >-
      В группе 25 детей. 18 любят яблоки, 16 — груши. Какое наименьшее число
      детей может любить и яблоки, и груши?
    steps:
      - >-
        Чтобы середина была как можно меньше, разведём любителей яблок и
        любителей груш как можно дальше.
      - >-
        Порознь им нужно 18 + 16 = 34 места, а детей всего 25: 34 − 25 = 9 из
        них обязательно окажутся в обоих кругах.
      - >-
        9 возможно: 9 любят только яблоки, 7 — только груши и 9 — и то, и
        другое. Всего 25, и никто не остался в стороне.
    answer: 9 детей.
    note:
      title: А самое большее?
      text: >-
        Самое большее — когда все 16 любителей груш любят и яблоки. Середина
        лежит между 9 и 16, а вопрос спрашивал о меньшем конце.
    art:
      apples: яблоки
      kids: дети
      pears: груши
      ends: яблоки — с левого края, груши — с правого
      violet: "фиолетовые — любят и то, и другое: 9"
      all: "все: 25"
      inside: все 16 любителей груш — внутри яблок
  - title: Три предмета
    question: >-
      Каждый из 20 учеников любит хотя бы один из трёх предметов: математику,
      чтение и рисование. Математику любят 12, чтение — 10, рисование — 9. Все
      три не любит никто. Сколько учеников любят ровно два предмета?
    steps:
      - >-
        Сложим три числа: 12 + 10 + 9 = 31. Ученик, который любит один предмет,
        вошёл в эту сумму один раз, а тот, кто любит два, — дважды.
      - >-
        Учеников всего 20, поэтому в сумме 31 − 20 = 11 лишних единиц, по
        одной на каждого, кого посчитали дважды.
      - >-
        Значит, ровно два предмета любят 11 учеников. Проверка: один предмет
        любят 9 и два — 11, а 9 + 2 × 11 = 31.
    answer: 11 учеников.
    note:
      title: Посчитать дважды — нарочно
      text: >-
        Здесь фокус не в кругах, а в сумме: каждый ученик добавляет в неё по
        единице за каждый любимый предмет. Олимпиадные задачи про группы часто
        держатся на том, чтобы посчитать одно и то же двумя способами.
    art:
      maths: математика 12
      reading: чтение 10
      drawing: рисование 9
      once: 1 раз
      twice: 2 раза
      each: по единице на каждого — 20, лишних 31 − 20 = 11

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      Ребёнок складывает две группы, 15 и 11, и принимает сумму за число
      детей: тех, кто в обеих группах, посчитали дважды.
    say: «Кто-нибудь посчитан в обоих кругах?»
    art:
      question: Сестра — 15, брат — 11, оба — 6
  answered_other_question:
    shows: >-
      Ребёнок находит какую-то часть картинки и называет её, хотя вопрос был о
      другой: «в обеих» вместо «ни в одной» или «только хор» вместо всего хора.
    say: «Покажи на картинке часть, о которой спрашивают.»
    art:
      question: "Вопрос: сколько без сестры и брата?"
  missed_case:
    shows: >-
      Какая-то часть картинки пропадает: одну группу вычитают из всех, а про
      другую забывают, или не добавляют обратно тех, кто во всех трёх группах.
    say: «Все ли части картинки заполнены?»
    art:
      question: "24 ребёнка: сестра — 15, брат — 11, оба — 6"

home:
  - title: Два обруча на полу
    text: >-
      Положите на пол два обруча или две петли из верёвки так, чтобы они
      пересекались, и раскладывайте в них игрушки: «красные» и «мягкие».
      Мягкий красный медведь — в середину.
  - title: Шесть — кого?
    text: >-
      Когда ребёнок отвечает «шесть», спросите: «Шесть — кого?» Шесть в обоих
      кружках и шесть ни в одном — разные ответы.
  - title: Опрос в семье
    text: >-
      Спросите домашних, кто любит чай и кто любит какао, и нарисуйте круги
      вместе. Ошибаются обычно именно в середине.

# What a parent can write in the chat to get a task on this topic.
