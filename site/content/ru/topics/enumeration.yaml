# The page of the topic of enumeration, for a parent, in Russian. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. Each example's level, and the answer
# its solver proves, are the site's data; an example here is worked through to
# that answer. The traps are the topic's commonest, counted in its reference
# tasks.

title: Перебор
description: Что такое задачи на перебор, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Сколько чисел можно записать этими цифрами? Сколько рукопожатий, нарядов,
    способов встать в ряд? В этих задачах варианты выписывают в таком
    порядке, чтобы ни один не потерялся и ни один не посчитался дважды.
    Список по правилу — первый инструмент ребёнка для вопросов, где угадать
    не получится.
  method: Выписывать варианты по правилу
  teaches: Работать по системе и видеть, когда варианты можно сосчитать, не выписывая
  # The two-digit numbers with different digits from 1, 2 and 3, grown from
  # their first digit.
  drawing: |2
          1         2         3
         / \       / \       / \
        2   3     1   3     1   2
       12  13    21  23    31  32

basis:
  title: Правила списка
  cards:
    - mark: "→"
      title: По порядку
      text: >-
        Прежде чем выписывать варианты, упорядочьте их: по первой букве, потом
        по второй. В упорядоченном списке пропущенный вариант оставляет
        заметную дыру.
    - mark: "="
      title: Каждый вариант — один раз
      text: >-
        Прежде чем считать, решите, чем два варианта отличаются. Рукопожатие
        Лены и Тимы — одно, а Лена перед Тимой и Тима перед Леной — две разные
        очереди.
    - mark: "×"
      title: Выборы перемножаются
      text: >-
        Когда вариант складывается из выборов подряд, варианты считают
        умножением. Например, сначала выбирают чашку, потом блюдце: 3 чашки и
        2 блюдца дают 3 × 2 = 6 пар.

idea:
  title: Важен ли порядок?
  lead: "Возьмём троих детей: А, Б и В. На разные вопросы о них получаются разные ответы."
  table:
    head:
      - Вопрос
      - Важен ли порядок?
      - Варианты
    rows:
      - - Сколькими способами они могут встать в ряд?
        - "Да: АБ и БА — два разных ряда"
        - АБВ, АВБ, БАВ, БВА, ВАБ, ВБА — 6
      - - Сколько пар можно отправить с поручением?
        - "Нет: АБ и БА — одна пара"
        - АБ, АВ, БВ — 3
      - - Сколькими способами можно выбрать командира и помощника?
        - "Да: командир идёт первым"
        - АБ, АВ, БА, БВ, ВА, ВБ — 6
  note:
    title: Почему это важно
    text: >-
      Чаще всего здесь ошибаются, считая один вариант дважды или принимая два
      разных за один. Если сначала решить, важен ли порядок, становится ясно,
      какой ошибки остерегаться.

method:
  title: "Как решают: список по правилу"
  lead: >-
    Сначала придумайте правило: что в списке идёт первым, что следом. Потом
    выписывайте варианты по нему или считайте, когда правило подскажет
    закономерность. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Решить, чем отличаются два варианта
    - Выписать варианты по правилу
    - Сосчитать или перемножить, если выборы идут один за другим

examples:
  - title: Флаги из двух полос
    question: >-
      Флаг состоит из двух полос, одна над другой. Каждая полоса красная,
      жёлтая или зелёная, и цвета полос разные. Сколько всего разных флагов?
    # Every flag, the top stripe above the bottom one: К red, Ж yellow, З green.
    drawing: |2
         К  К  Ж  Ж  З  З
         Ж  З  К  З  К  Ж
    steps:
      - >-
        Упорядочим флаги по верхней полосе. Если сверху красная, снизу жёлтая
        или зелёная: два флага.
      - >-
        Сверху жёлтая — снизу красная или зелёная: ещё два. Сверху зелёная —
        снизу красная или жёлтая: ещё два.
      - >-
        3 цвета для верха и каждый раз 2 оставшихся для низа: 3 × 2 = 6
        флагов.
    answer: 6 флагов.
  - title: Цифры через три
    question: Сколько двузначных чисел, у которых цифры отличаются на 3, как у 14 или 30?
    steps:
      - >-
        Переберём цифру десятков от 1 до 9 и выпишем рядом все цифры единиц,
        которые отличаются от неё на 3: 1 → 4; 2 → 5; 3 → 0 и 6; 4 → 1 и 7 и
        так далее.
      - >-
        Если в десятках 3, 4, 5 или 6, чисел по два — на 3 меньше и на 3
        больше. Если 1, 2, 7, 8 или 9 — по одному: второе было бы не цифрой.
      - >-
        4 × 2 + 5 × 1 = 13 чисел: 14, 25, 30, 36, 41, 47, 52, 58, 63, 69, 74,
        85, 96.
    answer: 13 чисел.
    note:
      title: Вариант, который теряют чаще всего
      text: >-
        Число 30 забывают чаще других: на 0 число может оканчиваться, хотя
        начинаться с него не может. Список по правилу его находит, а список по
        памяти — нет.
  - title: Без двух двоек подряд
    question: >-
      Сколько четырёхзначных чисел можно записать одними цифрами 1 и 2 так,
      чтобы никакие две двойки не стояли рядом?
    steps:
      - >-
        Угадать трудно, поэтому будем строить числа по одной цифре. Одна
        цифра: 1 и 2 — два числа. Две цифры: 11, 12 и 21 — три, ведь 22
        нельзя.
      - >-
        Подходящее число оканчивается на 1 или на 2. Если на 1, то это любое
        подходящее число на цифру короче с приписанной единицей. Если на 2, то
        перед двойкой должна стоять единица: это любое подходящее число на две
        цифры короче с приписанным 12. Значит, каждое количество — сумма двух
        предыдущих: трёхзначных 3 + 2 = 5, четырёхзначных 5 + 3 = 8.
      - >-
        Проверим списком: 1111, 1112, 1121, 1211, 2111, 1212, 2112, 2121 —
        восемь.
    answer: 8 чисел.
    note:
      title: Количество, которое растёт
      text: >-
        Числа 2, 3, 5, 8 продолжаются дальше: 13, 21, 34 — каждое равно сумме
        двух предыдущих. Олимпиадные задачи любят количества, которые строятся
        из меньших.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  missed_case:
    shows: >-
      Ребёнок выписывает варианты как вспомнятся и теряет один — часто с нулём
      или с повторяющейся цифрой.
    say: «В каком порядке они выписаны? Давай выпишем заново по правилу.»
  wrong_operation:
    shows: >-
      Ребёнок складывает там, где выборы перемножаются: 3 рубашки и 2 шарфа
      дают 5. А иногда перемножает там, где выбирают пару, и забывает, что с
      самим собой в паре никто не стоит.
    say: "«Возьмём одну рубашку: сколько с ней комплектов? А сколько всего рубашек?»"
  double_count:
    shows: >-
      Рукопожатие Лены с Тимой и Тимы с Леной считают за два, хотя это одно
      рукопожатие.
    say: «Этот вариант уже был в списке?»

home:
  - title: Нарядите игрушку
    text: >-
      Дайте ребёнку для игрушки две шапки и три шарфа и спросите, сколькими
      способами её можно нарядить. Потом попросите список и проверьте его
      вместе.
  - title: Спрашивайте про правило
    text: >-
      Когда ребёнок выписывает варианты, спросите: «В каком порядке ты их
      пишешь?» Список с правилом можно проверить.
  - title: Замок с кодом
    text: >-
      Придумайте замок с кодом из двух цифр, где каждая цифра — 1, 2 или 3.
      Пусть ребёнок найдёт, сколько кодов пришлось бы перебрать вору.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на перебор
