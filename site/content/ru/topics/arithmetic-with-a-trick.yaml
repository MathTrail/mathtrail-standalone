# The page of the topic of arithmetic with a trick, for a parent, in Russian.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Арифметика с подвохом
description: Что такое задачи на быстрый счёт и «задумал число», как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Сколько будет 19 + 23 + 81 + 77? Если считать по порядку, это три
    сложения с переходом через разряд, а если сложить пары 19 + 81 и 23 + 77,
    получится просто 100 + 100. В этих задачах счёт становится лёгким, когда
    найден удобный порядок, а задачи «задумал число» решаются с конца. Главное
    умение — сначала посмотреть, а потом считать.
  method: Найти удобный порядок, прежде чем считать
  teaches: Перегруппировывать сумму или произведение и распутывать цепочку действий с конца
  # The words of its drawing: the sum's numbers paired colour by colour into
  # two easy hundreds.
  art:
    pairs: складываем пары одного цвета
    look: сначала посмотреть, потом считать

basis:
  title: Правила быстрого счёта
  cards:
    - title: В любом порядке
      text: >-
        Числа можно складывать и умножать в любом порядке и группировать как
        угодно: 25 × 9 × 4 — это 25 × 4 × 9, то есть 100 × 9.
    - title: Круглые числа
      text: >-
        Ищите пары, которые дают 10, 100 или 1000: 36 + 64, 25 × 4, 125 × 8. С
        круглым числом дальше считать легко.
    - title: С конца
      text: >-
        В задачах «задумал число» идите от результата назад и отменяйте каждый
        шаг: что прибавили — вычтите, что удвоили — разделите пополам.
      art:
        undoes: отменяет
        back: идём от результата назад

idea:
  title: Сначала посмотреть
  lead: Одну и ту же сумму можно считать долго, а можно быстро. Прежде чем считать, найдите пары и группы, которые дают круглые числа.
  table:
    head:
      - Задача
      - Удобный путь
      - Ответ
    rows:
      - - 19 + 23 + 81 + 77
        - (19 + 81) + (23 + 77)
        - "200"
      - - 4 × 19 × 25
        - (4 × 25) × 19
        - "1900"
      - - 1 + 2 + 3 + … + 10
        - пять пар по 11, например 1 + 10 и 2 + 9
        - "55"
  # The words of the drawings of the easy way, all rows' in one place.
  art:
    pairs: пять пар по 11
  note:
    title: Почему это важно
    text: >-
      Олимпиады нарочно дают суммы, которые долго считать в лоб: задача в том,
      чтобы заметить короткий путь. Ребёнок, который сначала ищет пары, учится
      видеть, как устроена задача, а это нужно далеко за пределами арифметики.

method:
  title: "Как решают: искать круглые числа"
  lead: >-
    Прежде чем считать, посмотрите на всю задачу. Объедините в пары числа,
    сумма которых круглая, и поставьте рядом множители, которые дают 10 или
    100. Цепочку действий распутайте с конца, отменяя шаги по одному. Примеры
    ниже идут от простого к олимпиадному.
  steps:
    - Сначала посмотреть на всю задачу
    - Перегруппировать в круглые числа или идти с конца
    - Проверить ответ другим способом
  # The key under the steps: what the drawings' colours mean.
  legend:
    pair: один цвет — одна пара
    undo: отменяющий шаг

examples:
  - title: Пары до десяти
    question: >-
      Сколько будет 6 + 7 + 8 + 2 + 3 + 4?
    steps:
      - Ищем пары, которые дают 10. Их здесь три — 6 + 4, 7 + 3 и 8 + 2.
      - Три десятка — это 30.
      - "Значит, 6 + 7 + 8 + 2 + 3 + 4 = 30, и без всяких переходов через десяток."
    answer: "30."
    note:
      title: Долгий путь
      text: >-
        6 + 7 = 13, потом 21, 23, 26 и 30. Ответ тот же, но шагов пять вместо
        одного, и на каждом можно ошибиться.
    art:
      tens: одинаковый цвет — пара до десяти
  - title: Задуманное число
    question: >-
      Маша задумала число. Она удвоила его, прибавила 7 и разделила результат на
      3. Получилось 9. Какое число задумала Маша?
    steps:
      - Идём с конца и отменяем шаги, начиная с последнего.
      - >-
        Она разделила на 3 и получила 9, значит, до этого было 9 × 3 = 27. Она
        прибавила 7, значит, до этого было 27 − 7 = 20.
      - "Она удвоила число, значит, оно равно 20 : 2 = 10. Проверка: 10 × 2 + 7 = 27, и 27 : 3 = 9."
    answer: "10."
    note:
      title: В обратном порядке
      text: >-
        Последнее действие отменяется первым, так же как ботинки снимают
        раньше носков. Если отменять шаги в том порядке, в каком их делали,
        получится неверное число.
    art:
      masha: Маша
      back: с конца
      check: проверка
      "on": надеть
      "off": снять
      socks: носки
      shoes: ботинки
  - title: Два больших произведения
    question: >-
      Сколько будет 2026 × 2026 − 2027 × 2025? Найдите ответ, не перемножая
      большие числа.
    steps:
      - >-
        В обоих произведениях прячется 2026 × 2025: 2026 × 2026 — это
        2026 × 2025 и ещё одно 2026.
      - А 2027 × 2025 — это 2026 × 2025 и ещё одно 2025.
      - "Значит, разность — 2026 − 2025 = 1, и ничего большого перемножать не пришлось."
    answer: "1."
    note:
      title: Проверьте на маленьких
      text: >-
        То же верно для любых чисел: 5 × 5 − 6 × 4 = 25 − 24 = 1. Проверка на
        маленьких числах — самый надёжный способ поверить в приём.
    art:
      cancel: одинаковые части сокращаются, остаются полоски

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  stopped_early:
    shows: >-
      Решение останавливается раньше конца: две пары из трёх сложены, а третья
      забыта, или отменён один шаг цепочки и его результат выдан за ответ.
    say: «Все ли числа учтены и все ли шаги отменены?»
  wrong_operation:
    shows: >-
      Шаг отменяют тем же действием, а не обратным: 7 снова прибавляют вместо
      того, чтобы вычесть, или 9 делят на 3 вместо того, чтобы умножить.
    say: «Что отменяет сложение? А деление?»
    art:
      undo: Отменить «+ 7» у числа 27
  number_from_text:
    shows: >-
      Ответом вместо задуманного числа становится число из условия: 9, которое
      получилось у Маши, или 7, которое она прибавила.
    say: «Это число получилось или было задумано?»
    art:
      question: Какое число задумала Маша?
      got: получилось у Маши
      thought: было задумано

home:
  - title: Пары до десяти
    text: >-
      Напишите на карточках шесть-восемь небольших чисел и попросите ребёнка
      найти пары, дающие 10, прежде чем складывать всё.
  - title: Угадай число
    text: >-
      Играйте в «задумал число» в обе стороны: вы называете действия и
      результат, а ребёнок находит число; потом ребёнок сам придумывает
      действия.
  - title: Счёт в магазине
    text: >-
      В магазине складывайте цены в удобном порядке: 99 — это 100 без 1, а 49
      и 51 вместе дают 100. Сначала округлить, потом поправить.

