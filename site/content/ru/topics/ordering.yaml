# The page of the topic of ordering, for a parent, in Russian. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. Each example's level, and the answer
# its solver proves, are the site's data; an example here is worked through to
# that answer. The traps are the topic's commonest, counted in its reference
# tasks.

title: Упорядочивание
description: Что такое задачи на упорядочивание, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Кто выше, кто старше, кто прибежал первым? В этих задачах несколько
    сравнений нужно сложить в один порядок: по росту, по возрасту, по месту в
    очереди или в забеге. Для многих детей это первая цепочка рассуждений, в
    которой каждая подсказка — звено и пропустить нельзя ни одну.
  method: Нарисовать линию и расставить всех на ней
  teaches: Складывать подсказки в одну картину и читать сравнение в обе стороны
  # A line from the tallest to the shortest, as the solutions draw it.
  drawing: |2
       выше всех ...... ниже всех
       Аня > Боря > Вика > Дима

basis:
  title: Правила линии
  cards:
    - mark: ">"
      title: Подсказка — это стрелка
      text: >-
        «Аня выше Бори» ставит Аню перед Борей на линии. Что бы ни
        сравнивалось — рост, возраст или место в забеге, — подсказка говорит,
        кто идёт первым.
    - mark: "<"
      title: Читаем в обе стороны
      text: >-
        «Боря ниже Ани» значит то же самое, что «Аня выше Бори». Прежде чем
        ставить подсказки на линию, поверните их все в одну сторону.
    - mark: "…"
      title: Цепочка продолжается
      text: >-
        Если Аня выше Бори, а Боря выше Вики, то Аня выше и Вики, хотя ни одна
        подсказка этого не говорит.

idea:
  title: Все подсказки — в одну сторону
  lead: Стройте линию по одной подсказке, сначала переделав каждую в сравнение со словом «выше».
  table:
    head:
      - Подсказка
      - Через слово «выше»
      - Линия
    rows:
      - - «Аня выше Бори»
        - Аня выше Бори
        - Аня > Боря
      - - «Вика ниже Бори»
        - Боря выше Вики
        - Аня > Боря > Вика
      - - «Дима ниже Вики»
        - Вика выше Димы
        - Аня > Боря > Вика > Дима
  note:
    title: Почему это важно
    text: >-
      Чаще всего здесь ошибаются, прочитав подсказку не с того конца: «ниже»
      принимают за «выше», «после» — за «до». Подсказку, повёрнутую заранее,
      прочитать неверно уже нельзя.

method:
  title: "Как решают: рисуем линию"
  lead: >-
    Нарисуйте линию от самого высокого к самому низкому или от первого к
    последнему и ставьте на неё подсказки по одной, сначала самые точные.
    Кого пока нельзя поставить, тот ждёт следующей подсказки. Примеры ниже
    идут от простого к олимпиадному.
  steps:
    - Повернуть все подсказки в одну сторону
    - Ставить подсказки на линию, сначала точные
    - Прочитать ответ и сверить с ним каждую подсказку

examples:
  - title: Три лодки
    question: >-
      Три лодки — красная, синяя и зелёная — плыли наперегонки. Красная
      пришла после синей. Зелёная пришла раньше синей. Какая лодка победила?
    steps:
      - >-
        Повернём первую подсказку: красная пришла после синей — значит,
        синяя пришла раньше красной.
      - >-
        На линии первая слева: синяя, потом красная. Зелёная пришла раньше
        синей, значит, она впереди обеих: зелёная, синяя, красная.
      - >-
        Первая на линии — зелёная. Проверка: красная после синей — да;
        зелёная раньше синей — да.
    answer: Победила зелёная лодка.
  - title: Очередь в столовую
    question: >-
      В очереди в столовую стоят пятеро: Лена, Макс, Нина, Олег и Паша. Нина
      стоит третьей. Олег стоит сразу за Ниной. Макс стоит где-то впереди
      Лены, и Лена не последняя. Кто стоит последним?
    steps:
      - >-
        Запишем точное: Нина третья, а Олег сразу за ней — четвёртый. Места 1,
        2 и 5 остаются Максу, Лене и Паше.
      - >-
        Лена не последняя — значит, она первая или вторая. Макс стоит где-то
        впереди неё, поэтому первой она быть не может: Лена вторая, Макс
        первый.
      - >-
        Осталось только пятое место — оно Пашино. Проверим каждую подсказку:
        все выполняются.
    answer: Последним стоит Паша.
    note:
      title: Важна каждая подсказка
      text: >-
        Без подсказки «Лена не последняя» Лена могла бы стоять и последней:
        очередь решает именно короткая подсказка с «не».
  - title: Шестеро бегунов
    question: >-
      Шестеро бегунов финишировали без ничьих: Ася, Боря, Вова, Галя, Дима и
      Ева. Боря прибежал сразу после Аси. Вова прибежал после Гали, но раньше
      Аси. Ева прибежала сразу перед Димой, и Дима был не последним. Галя была
      не первой. Кто победил?
    steps:
      - >-
        Найдём блоки: «Боря сразу после Аси» даёт блок Ася-Боря, а «Ева сразу
        перед Димой» — блок Ева-Дима. Галя, потом Вова, потом блок Ася-Боря
        идут именно в таком порядке.
      - >-
        Галя не первая — значит, перед ней кто-то прибежал. Вова, Ася и Боря
        прибежали после Гали: впереди неё могут быть только Ева и Дима, а они
        идут вместе.
      - >-
        Значит, забег открывает блок Ева-Дима: Ева, Дима, Галя, Вова, Ася,
        Боря. Дима не последний, как и сказано. Все подсказки выполняются.
    answer: Победила Ева.
    note:
      title: Блоки двигаются вместе
      text: >-
        Если подсказка говорит «сразу после», двое стоят рядом, куда бы их ни
        поставили. Считайте их одним блоком — и вместо шестерых бегунов
        придётся расставить четыре.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      Ребёнок берёт одну подсказку и пропускает другую, часто короткую, с
      «не», — и на линии остаётся место для неверного ответа.
    say: «Какая подсказка ещё не использована?»
  reversed_relation:
    shows: >-
      Подсказку «Вика ниже Бори» ставят на линию так, будто Вика выше: её
      читают не с того конца, и ответ выходит наоборот.
    say: «Кто же тогда выше? Скажи наоборот.»
  stopped_early:
    shows: >-
      Ребёнок находит, что один ниже другого, и сразу отвечает, хотя цепочка
      идёт дальше: Боря ниже Ани, но Вика ещё ниже.
    say: «А дальше по линии кто-нибудь есть?»

home:
  - title: Выстройтесь всей семьёй
    text: >-
      Выстройтесь дома по росту, потом по возрасту и проговаривайте каждую
      подсказку: «Папа выше мамы — значит, папа первый».
  - title: Сначала линия, потом ответ
    text: >-
      Просите нарисовать линию на бумаге раньше, чем назвать ответ. По рисунку
      сразу видно, пропущена ли подсказка или повёрнута не туда.
  - title: Скажи наоборот
    text: >-
      Сыграйте в быструю игру: вы говорите «кошка меньше собаки», а ребёнок —
      то же наоборот: «собака больше кошки».

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на упорядочивание
