# The page of the topic of parts and shares, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Части и доли
description: Что такое задачи на части и доли, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Боря съел треть пиццы, а Аня — половину того, что осталось. Кто съел
    больше? В этих задачах дробь — это всегда доля чего-то, и главная трудность
    в том, чтобы понять, чего именно: целого или того, что осталось. Полоска
    бумаги, разрезанная на равные части, объясняет это лучше любого правила.
  method: Нарисовать целое полоской и разрезать на равные части
  teaches: Спрашивать «часть чего?» и находить целое по его части
  # Its drawing is the site's data: twelve as a strip of four equal parts, three
  # of which, three quarters, are 9.

basis:
  title: Правила долей
  cards:
    - mark: "?"
      title: Часть чего?
      text: >-
        Дробь — всегда доля чего-то. «Четверть остатка» и «четверть целого» —
        разные числа, поэтому сначала найдите, от чего берётся доля.
    - mark: "1/n"
      title: Через одну часть
      text: >-
        Чтобы найти 3/4 от 20, делим на 4 и берём 3 части: 15. Чтобы найти
        целое, 3/4 которого равны 15, делим на 3, получаем одну часть и берём
        4 части: 20.
    - mark: "1"
      title: Части составляют целое
      text: >-
        Отданное и оставшееся вместе составляют одно целое. Если отдали 1/3 и
        1/4, осталось 1 − 1/3 − 1/4 = 5/12.

idea:
  title: Сколько приходится на одну часть
  lead: Каким бы ни был вопрос, сначала найдите, сколько приходится на одну часть, а потом возьмите столько частей, сколько нужно.
  table:
    head:
      - Дано
      - Одна часть
      - Что спрашивают
    rows:
      - - 3/4 от 20
        - "20 : 4 = 5"
        - 3 части, 15
      - - 3/4 числа равны 15
        - "15 : 3 = 5"
        - число, 4 части, 20
      - - 2/5 числа равны 14
        - "14 : 2 = 7"
        - число, 5 частей, 35
  note:
    title: Почему это важно
    text: >-
      Большинство ошибок с дробями — не в вычислениях, а в целом: долю берут
      не от той величины. Если перед каждым шагом назвать целое вслух, такие
      ошибки ловятся сами.

method:
  title: "Как решают: нарисовать полоску"
  lead: >-
    Нарисуйте целое длинной полоской и разрежьте её на столько равных частей,
    сколько в знаменателе дроби. Если доля берётся от остатка, нарисуйте
    остаток новой полоской. Потом найдите, сколько приходится на одну часть.
    Примеры ниже идут от простого к олимпиадному.
  steps:
    - Нарисовать целое полоской
    - Разрезать на равные части, а если нужно, и остаток
    - Найти одну часть, а потом нужные части

examples:
  - title: Булочки в пекарне
    question: >-
      Пекарь испёк 60 булочек. До обеда он продал половину, а к вечеру — две
      трети остатка. Сколько булочек осталось?
    steps:
      - Половина от 60 булочек — 30, значит, после обеда осталось 30 булочек.
      - >-
        Две трети остатка — это две трети от 30, а не от 60: вечером продали
        30 : 3 × 2 = 20 булочек.
      - Осталось 30 − 20 = 10 булочек.
    answer: 10 булочек.
    note:
      title: Две трети от чего?
      text: >-
        Две трети от всех 60 булочек — это 40, а 30 + 40 = 70 булочек — больше,
        чем пекарь испёк. «Две трети остатка» — это доля того, что осталось к
        этому моменту.
  - title: Книга по седьмым частям
    question: >-
      В понедельник Тёма прочитал 2/7 книги, во вторник — 3/7. Осталось 40
      страниц. Сколько страниц в книге?
    # Its drawing is the site's data: the book in sevenths, five read, and the
    # two left the 40 pages.
    steps:
      - За два дня Тёма прочитал 2/7 + 3/7 = 5/7 книги, значит, осталось 2/7.
      - "Эти 2/7 — 40 страниц: одна седьмая — это 40 : 2 = 20 страниц."
      - "Вся книга — семь седьмых: 7 × 20 = 140 страниц."
    answer: 140 страниц.
    note:
      title: Какая часть равна 40?
      text: >-
        40 страниц — это остаток, 2/7 книги, а не прочитанные 5/7. Если принять
        их за 5/7, получится книга в 56 страниц, и в ней осталось бы всего 16.
  - title: Яйца на рынке
    question: >-
      Бабушка продаёт яйца на рынке. Первый покупатель берёт половину всех яиц
      и ещё пол-яйца. Второй — половину оставшихся и ещё пол-яйца, третий — так
      же. После этого все яйца проданы, и ни одно не разбили. Сколько яиц было
      у бабушки?
    # Its drawing is the site's data: the eggs Granny has before each buyer, and
    # after the last.
    steps:
      - >-
        Пойдём с конца. Третий покупатель взял половину яиц и ещё пол-яйца, и
        ничего не осталось: значит, половина яиц — это пол-яйца, и у бабушки
        было 1 яйцо.
      - >-
        До второго покупателя так же: половина яиц и ещё пол-яйца оставили 1
        яйцо, значит, половина — это полтора яйца, и яиц было 3.
      - >-
        До первого покупателя половина яиц — три с половиной, значит, яиц было
        7. Проверка: 7 → 3 → 1 → 0.
    answer: 7 яиц.
    note:
      title: С конца
      text: >-
        Когда каждая доля берётся от остатка, проще всего начинать с конца: там
        количество известно. Каждый шаг назад отменяет одну долю: прибавить
        пол-яйца и удвоить.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  part_whole_swap:
    shows: >-
      Доля берётся не от той величины: две трети от всех 60 булочек вместо
      оставшихся 30, или 40 оставшихся страниц принимают за прочитанную часть.
    say: «Две трети от чего? Покажи на полоске.»
  answered_other_question:
    shows: >-
      Ответом становится число, найденное по дороге: 20 булочек, проданных
      вечером, вместо оставшихся или 100 прочитанных страниц вместо всей
      книги.
    say: «Что именно спрашивается в задаче?»
  stopped_early:
    shows: >-
      Решение останавливается на шаг раньше: найдена одна седьмая книги, 20
      страниц, а вся книга так и не собрана; или вычтены булочки, проданные до
      обеда, а вечерние забыты.
    say: «Это ответ или шаг к нему?»

home:
  - title: Разрежьте вместе
    text: >-
      Разрежьте яблоко, пиццу или лист бумаги на равные части и назовите их:
      половины, трети, четверти. Потом уберите несколько и спросите, какая
      часть осталась.
  - title: Часть чего?
    text: >-
      Когда в рецепте или игре встречается дробь, спросите: «Треть чего?»
      Ответ на этот вопрос часто и есть вся задача.
  - title: Полоска
    text: >-
      Когда дома что-нибудь делите, рисуйте вместе полоску: длинный
      прямоугольник, разрезанный на равные клетки. Она годится для каждой
      задачи этой темы.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на части и доли
