# The page of the topic of games with a winning strategy, for a parent, in
# Russian. The topic's name, its group, its grades and its traps' names are not
# here: they are the card's words and the catalog's numbers. Each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest,
