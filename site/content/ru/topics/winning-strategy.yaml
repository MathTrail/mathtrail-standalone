title: Игры с выигрышной стратегией
description: Что такое задачи на игры и выигрышные стратегии, как их решают, где ошибаются дети и как помочь дома.

# The words the page's drawings say of a position.
art:
  loses: проигрыш для того, кто ходит
  wins: выигрыш

hero:
  lead: >-
    На столе 20 спичек, игроки по очереди берут 1, 2 или 3. Кто взял последнюю
    спичку, тот выиграл. Может ли первый игрок всегда выиграть? В этих задачах
    ребёнок ищет план, который выигрывает при любых ходах соперника. Искать его
    нужно с конца игры, отмечая позиции, проигрышные для того, кто из них ходит.
  method: Идти от конца и найти проигрышные позиции
  teaches: Находить план, который выигрывает при любых ходах соперника
  # The words of its drawing: the game it is drawn for.
  art:
    line: Берём 1, 2 или 3 спички — кто взял последнюю, выиграл

basis:
  title: Правила игр
  cards:
    - title: С конца
      text: >-
        Начните с конца игры, где победитель ясен, и идите назад: позиция
        проигрышная, если любой ход из неё ведёт в выигрышную для соперника.
      art:
        back: идём от 0 — конца игры — к большим числам
    - title: Отдать проигрышную позицию
      text: >-
        Выигрышный ход оставляет сопернику проигрышную позицию. Если такого
        хода нет, позиция проигрышная, как бы хорошо ни играл тот, кто ходит.
      art:
        take: взять 2
        losing: сопернику — проигрышная
    - title: Повторять и отражать
      text: >-
        Во многих играх победитель сохраняет равновесие: либо отвечает на каждый
        ход так, чтобы два хода вместе давали одно и то же, либо делает тот же
        ход с другой, симметричной стороны.
      art:
        they: соперник
        answer: ответ

idea:
  title: Проигрышные позиции
  lead: Пусть за ход берут 1, 2 или 3 спички, а выигрывает тот, кто взял последнюю. Тогда позиции, проигрышные для ходящего, повторяются через 4.
  table:
    head:
      - Осталось спичек
      - Лучший ход
      - Почему
    rows:
      - - 1, 2 или 3
        - взять все
        - последняя спичка выигрывает
      - - "4"
        - выигрышного нет
        - после любого хода соперник забирает остаток
      - - 5, 6 или 7
        - взять 1, 2 или 3, оставив 4
        - сопернику достаются проигрышные 4
      - - "8"
        - выигрышного нет
        - любой ход оставляет 5, 6 или 7
  note:
    title: Почему это важно
    text: >-
      Дети часто думают, что первый игрок обязательно выигрывает, или играют в
      надежде на ошибку соперника. Выигрышная стратегия работает против лучшей
      игры, и чтобы найти её, нужно думать с конца. Эта привычка пригодится
      далеко за пределами игр.

method:
  title: "Как решают: от конца игры"
  lead: >-
    Выпишите позиции от самой маленькой. Отмечайте позицию проигрышной, если
    любой ход из неё ведёт в выигрышную, и выигрышной, если какой-то ход ведёт
    в проигрышную. Выигрышный ход из начала — тот, что оставляет проигрышную
    позицию. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Начать с позиций в конце игры
    - Отметить каждую выигрышной или проигрышной, от меньших к большим
    - Найти ход, который оставляет сопернику проигрышную

examples:
  - title: Конфеты в вазе
    question: >-
      В вазе 23 конфеты. Катя и Лёва ходят по очереди, первой — Катя. За ход
      можно взять 1, 2, 3 или 4 конфеты. Кто возьмёт последнюю конфету, тот
      выиграл. Сколько конфет должна взять Катя первым ходом, чтобы наверняка
      выиграть?
    steps:
      - >-
        С конца: если осталось от 1 до 4 конфет, ходящий забирает все и
        выигрывает. Если осталось 5, любой ход оставляет сопернику от 1 до 4,
        значит, 5 — проигрышная позиция.
      - >-
        Так же проигрышны 10, 15 и 20: что бы из них ни взяли, соперник может
        оставить следующее число, кратное 5.
      - >-
        Значит, Катя берёт 3 и оставляет 20. Что бы ни взял Лёва, Катя
        добирает до 5, оставляя 15, 10, 5 и наконец ничего.
    answer: 3 конфеты.
    note:
      title: Почему не взять 4?
      text: >-
        Если взять 4, останется 19, и Лёва возьмёт 4, оставив Кате проигрышные
        15. Против соперника, который не ошибается, выигрывает только первый ход
        к числу, кратному 5.
    art:
      sweets: 23 конфеты, за ход — от 1 до 4
      kim: Катя −3
      answer: Лёва берёт x, Катя — 5 − x
      leo: Лёва −4
      lost: у Кати проигрыш
  - title: Прогулка короля
    question: >-
      Король стоит в левом нижнем углу доски 5 на 5. Два игрока по очереди
      передвигают его на одну клетку вверх, вправо или по диагонали вверх и
      вправо. Кто поставит короля в правый верхний угол, тот выиграл. Кто
      выиграет при правильной игре?
    steps:
      - >-
        Посчитаем, сколько рядов и столбцов королю ещё осталось пройти. С
        клетки, от которой до угла один ход, ходящий выигрывает сразу.
      - >-
        Клетка проигрышна для ходящего, если оба числа чётные: любой ход делает
        одно из них нечётным, а соперник может снова сделать оба чётными.
      - >-
        Король начинает в 4 рядах и 4 столбцах от угла: оба числа чётные,
        значит, первый проигрывает. Второй каждый раз отвечает ходом на чётную
        клетку и доходит до угла.
    answer: Второй игрок.
    badge: 2-й
    note:
      title: Ходить первым мало
      text: >-
        Здесь первый игрок проигрывает, как бы ни ходил. В каждой новой игре
        стоит проверить с конца, прежде чем считать, что первый ход выигрывает.
    art:
      moves: "ходы: вверх, вправо, по диагонали вверх-вправо"
      green: зелёные — выигрыш в один ход
      red: красные точки — проигрыш для того, кто ходит
      start: король начинает на проигрышной клетке
  - title: Ромашка
    question: >-
      У ромашки 12 лепестков, растущих по кругу. Два игрока по очереди
      обрывают либо один лепесток, либо два соседних, между которыми нет
      промежутка. Кто оборвёт последний лепесток, тот выиграл. Кто выиграет
      при правильной игре?
    steps:
      - >-
        Что бы ни оборвал первый игрок, один лепесток или два, круг
        размыкается в ряд из 11 или 10 лепестков.
      - >-
        Второй обрывает лепестки из самой середины этого ряда: один из ряда в
        11, два — из ряда в 10. Остаются два одинаковых ряда друг напротив
        друга.
      - >-
        Дальше второй повторяет каждый ход первого в другом ряду. Пока может
        ходить первый, может и второй, поэтому последний лепесток обрывает
        второй.
    answer: Второй игрок.
    badge: 2-й
    note:
      title: Почему из середины?
      text: >-
        Деление ряда на две равные части делает позицию симметричной.
        Повторение не может проиграть: повторный ход всегда возможен, потому
        что другой ряд выглядит точно так же.
    art:
      eleven: первый оборвал один — остался ряд из 11
      two-rows: два ряда по 5 лепестков
      mirror: первый оборвал в синем ряду — второй повторил в оранжевом

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      Теряется правило игры: то за ход берут 5 конфет, хотя можно не больше 4,
      то король шагает влево, что правила запрещают. План, построенный на
      запрещённом ходе, ничего не выигрывает.
    say: «Какие ходы разрешают правила?»
    art:
      question: За ход — от 1 до 4 конфет
      five: взять 5
      three: взять 3
  first_move_assumed:
    shows: >-
      Считается, что ходить первым — уже победа: «Катя начинает, значит, Катя
      выиграет». Во многих играх, как в прогулке короля, первый проигрывает,
      как бы ни ходил.
    say: «А если соперник не ошибётся?»
    art:
      question: Прогулка короля
      first: выиграет первый
      second: второй
  best_case_not_worst:
    shows: >-
      План работает, только если соперник ошибётся: Катя берёт 4 и надеется,
      что Лёва потом возьмёт слишком мало. Выигрышная стратегия должна
      отвечать на лучший ход соперника.
    say: «А какой у соперника лучший ответ на это?»
    art:
      question: Катя первым ходом из 23
      leo: Лёва −4

home:
  - title: Сыграйте в спички
    text: >-
      Сыграйте в игру «берём 1, 2 или 3 спички из 15» и дайте ребёнку ходить
      первым. Выиграйте несколько раз, а потом спросите, почему числа, кратные
      4, всё время возвращаются.
  - title: Повторите ход
    text: >-
      В любой игре на симметричной доске попробуйте повторять ход соперника с
      противоположной стороны. Обсудите, когда повторение работает, а когда
      ломается.
  - title: Поменяйтесь местами
    text: >-
      Когда ребёнок найдёт выигрышный план, поменяйтесь: теперь ребёнок ходит
      вторым. Вторая, более глубокая половина темы — объяснить, почему теперь
      план проигрывает.

