# The page of the topic of the pigeonhole principle, for a parent, in Russian.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Принцип Дирихле
description: Что такое задачи на принцип Дирихле, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Пять голубей садятся в четыре клетки: в какой-то клетке их обязательно
    окажется двое. В этих задачах ребёнок доказывает, что при любом невезении
    что-то непременно случится: два носка одного цвета из тёмного ящика, два дня
    рождения в одном месяце. Это первая встреча с рассуждением о худшем случае,
    а не о счастливом.
  method: Довести невезение до конца и добавить ещё один
  teaches: Доказывать, что что-то обязательно случится, а не просто может
  # The words of its drawing: the pigeons and the cages over it, and what the
  # seating always comes to.
  art:
    line: Пять голубей, четыре клетки
    seat: рассаживаем как угодно
    two: двое
    always: как ни рассаживай, в какой-то клетке окажутся двое

basis:
  title: Правила худшего случая
  cards:
    - title: Голубей больше, чем клеток
      text: >-
        Если голубей больше, чем клеток, в какой-то клетке их хотя бы двое. Как
        ровно их ни рассаживайте, один всё равно окажется лишним.
    - title: Наверняка
      text: >-
        Слово «наверняка» значит: что бы ни попалось. Представьте, что всё
        идёт так плохо, как только может, и посмотрите, как далеко заходит
        невезение.
      art:
        luck: удача
        not-counted: не в счёт
        bad-luck: невезение
    - title: Ещё один решает
      text: >-
        Невезение кончается, когда каждый цвет уже вытащен по разу или каждая
        клетка занята. Тогда следующий непременно даст то, что нужно.
      art:
        eighth: по одному на каждый день — восьмой даст пару

idea:
  title: Худший случай — и ещё один
  lead: Каждый вопрос спрашивает, что будет наверняка. Чтобы ответить, посчитайте, как далеко может зайти невезение, и добавьте ещё один.
  table:
    head:
      - Чтобы наверняка получить
      - Невезение может дать сначала
      - Значит, взять
    rows:
      - - двоих, родившихся в один день недели
        - по одному на каждый из 7 дней
        - 7 + 1 = 8 человек
      - - красный шар из 6 синих и 4 красных
        - все 6 синих шаров
        - 6 + 1 = 7 шаров
      - - два красных шара из 6 синих и 4 красных
        - все 6 синих шаров и один красный
        - 6 + 1 + 1 = 8 шаров
  note:
    title: Почему это важно
    text: >-
      Дети часто рассчитывают на удачу: «А вдруг сразу вытащу два красных».
      Задача со словом «наверняка» спрашивает о худшем невезении, и привычка
      думать о нём стоит больше любой формулы.

method:
  title: "Как решают: худший случай и ещё один"
  lead: >-
    Назовите клетки, например цвета, месяцы или дни недели. Потом доведите
    невезение до конца: возьмите всё, что ещё не даёт нужного. Тогда следующий
    непременно даст нужное. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Найти клетки и голубей
    - Довести невезение до конца
    - Добавить один и убедиться, что он решает дело
  # The key under the steps: what the drawings' bracket and ring mean.
  legend:
    bad-luck: невезение
    decides: ещё один, который решает дело

examples:
  - title: Конфеты в банке
    question: >-
      В банке 8 лимонных конфет и 2 апельсиновые. Сколько конфет нужно не
      глядя взять Саше, чтобы наверняка достать апельсиновую?
    steps:
      - Саше нужна апельсиновая конфета. Худшее невезение — лимонная за лимонной.
      - >-
        Лимонных всего 8: после них в банке остаются только апельсиновые.
      - "Девятая конфета непременно апельсиновая: 8 + 1 = 9."
    answer: 9 конфет.
    art:
      lemon: лимонные — 8
      orange: апельсиновые — 2
      unlucky: не везёт
      all-lemons: все 8 лимонных
      lemons: 8 лимонных
  - title: Два чёрных носка
    question: >-
      В ящике вперемешку лежат 8 чёрных носков, 6 белых и 2 полосатых.
      Сколько носков нужно взять в темноте Глебу, чтобы наверняка были два
      чёрных?
    steps:
      - >-
        Худшее невезение: сначала попадаются не чёрные. Белых 6 и полосатых 2,
        то есть всего 8 носков без единого чёрного.
      - >-
        Невезение на этом не кончается: следующий носок чёрный, но только
        один. Это 9 носков и лишь один чёрный среди них.
      - >-
        Десятый носок непременно тоже чёрный: остались только чёрные. Значит,
        10 носков.
    answer: 10 носков.
    note:
      title: Почему не 9?
      text: >-
        После всех 6 белых и 2 полосатых у невезения есть ещё один ход: один
        чёрный носок. Два чёрных наверняка будут только с десятым.
    art:
      black: чёрные — 8
      white: белые — 6
      striped: полосатые — 2
      no-black: 8 — ни одного чёрного
      not-black: 8 не чёрных
      one: один
      only-one: 9 носков — а чёрный только один
  - title: Суммы в таблице
    question: >-
      В каждой ячейке таблицы 2 × 2 стоит 1, 2 или 3. Сложим два числа каждой
      строки, каждого столбца и каждой диагонали. Верно ли, что среди этих
      шести сумм всегда найдутся две равные?
    steps:
      - >-
        Посчитаем клетки: сумма двух чисел из 1, 2 и 3 — одно из чисел 2, 3,
        4, 5, 6, всего пять значений.
      - "Посчитаем голубей: 2 строки, 2 столбца и 2 диагонали дают 6 сумм."
      - >-
        Шесть сумм и только пять значений: две суммы обязательно равны, какие
        бы числа ни стояли в таблице.
    answer: Да, всегда.
    badge: Да
    note:
      title: Клетки — не всегда ящики
      text: >-
        Здесь клетки — это значения, которые может принимать сумма, а голуби —
        линии таблицы. Весь фокус этих задач в том, чтобы увидеть, что играет
        роль клеток.
    art:
      example: "например, так: в каждой ячейке 1, 2 или 3"
      cages: 5 клеток — возможные суммы
      row: стр.
      column: стлб.
      diagonal: диаг.
      pigeons: 6 сумм — 6 голубей
      two: "6 голубей в 5 клетках: где-то обязательно двое"
      cages-name: клетки
      pigeons-name: голуби

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  best_case_not_worst:
    shows: >-
      Ребёнок рассчитывает на удачу: «Если первые два носка чёрные, двух
      хватит». Но в вопросе сказано «наверняка», а это слово как раз
      исключает удачу.
    say: «А если не повезёт совсем?»
    art:
      question: Наверняка два чёрных
  ignored_condition:
    shows: >-
      Из вопроса теряется одно слово: «два чёрных носка» читают как «два
      носка одного цвета», а «по одному каждого цвета» — как «одного цвета».
    say: "«Прочитай вопрос ещё раз: что именно нужно получить наверняка?»"
    art:
      question: "Нужно: два **чёрных** носка"
      black-pair: пара именно чёрных
  off_by_one:
    shows: >-
      Ребёнок доводит невезение до конца и либо на этом останавливается, забыв
      про ещё один, который решает дело, либо прибавляет лишний.
    say: «Что даст следующий после худшего невезения?»
    art:
      question: 8 лимонных и 2 апельсиновые

home:
  - title: Носки в темноте
    text: >-
      Сложите в мешок носки двух-трёх цветов и доставайте их с закрытыми
      глазами: сколько нужно, чтобы пара была наверняка? Попробуйте несколько
      раз и увидите, что удача меняется, а ответ нет.
  - title: Обязательно или может быть?
    text: >-
      Когда ребёнок говорит «так может случиться», спросите: «А может и не
      случиться?» Разница между «может» и «обязательно» — это и есть вся
      тема.
  - title: Найдите клетки
    text: >-
      Ищите клетки в обычных подсчётах вместе: семь дней недели, двенадцать
      месяцев, четыре времени года. «Нас 30 — найдутся ли двое, родившиеся в
      одном месяце?»

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на принцип Дирихле
