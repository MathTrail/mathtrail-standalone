title: "Кубики и бумага"
description: "Что такое задачи на развёртку куба и складывание бумаги, как их решают, где ошибаются дети и как помочь дома."
hero:
  lead: "Плоская развёртка из шести квадратов складывается в кубик. Сложенный лист после одного прокола раскрывается с несколькими дырками. У игрального кубика, который катится по ряду клеток, можно заранее узнать число сверху. Такие задачи решают, представляя складывание, перекатывание или разворачивание по одному шагу."
  method: "Складывать, катить или разворачивать по одному шагу"
  teaches: "Видеть, как плоская фигура становится объёмной и обратно"
  art:
    opposite: "1 и 5 окажутся напротив"
basis:
  title: "Правила складывания"
  cards:
    - title: "Противоположные грани не соприкасаются"
      text: "В развёртке два квадрата в одном ряду, между которыми один квадрат, становятся противоположными гранями кубика."
      art:
        opposite: "3 и 6 напротив друг друга"
    - title: "Сгиб удваивает слои"
      text: "Лист, сложенный один раз, лежит в 2 слоя, а сложенный ещё раз — в 4. Прокол делает дырку в каждом слое."
      art:
        holes: "2 сгиба, 4 слоя, 4 дырки"
    - title: "На кубике выходит 7"
      text: "На игральном кубике числа на противоположных гранях дают в сумме 7: 1 и 6, 2 и 5, 3 и 4."
      art:
        bottom: "сверху 2, снизу 5"
idea:
  title: "Идти по одному шагу"
  lead: "Складывайте, катите или разворачивайте в уме по одному шагу и замечайте, что меняет каждый шаг."
  table:
    head:
      - "Что делаем"
      - "Что меняется"
    rows:
      - - "квадрат развёртки сгибается вверх"
        - "он становится следующей гранью кубика"
      - - "лист складывают один раз"
        - "слоёв там, где он лёг, становится вдвое больше"
      - - "кубик перекатывается через ребро"
        - "наверх выходит боковая грань"
      - - "кубик дважды катится прямо"
        - "наверх выходит нижняя грань"
  note:
    title: "Почему это важно"
    text: "Дети часто пытаются угадать весь результат сразу. Каждый шаг простой, и если пройти их по одному, угадывать не придётся."
method:
  title: "Как решать: по одному сгибу"
  lead: "Назовите квадрат, сгиб или перекат, который идёт первым, скажите, что он делает, и переходите к следующему. Где можно, вырежьте развёртку из бумаги или возьмите настоящий кубик и проверьте. Примеры ниже идут от простого к олимпиадному."
  steps:
    - "Выбрать первый квадрат, сгиб или перекат"
    - "Сказать, что он делает с гранями или слоями"
    - "Идти по шагам, а потом проверить бумагой или кубиком"
examples:
  - title: "Противоположная грань"
    question: "Развёртка кубика — крест: столбик из 4 квадратов с номерами 1, 2, 3 и 4 сверху вниз и квадраты 5 и 6 по бокам от квадрата 2. Какое число окажется напротив 2, если развёртку сложить?"
    steps:
      - "Квадраты 1 и 3 стоят рядом с 2 в столбике, поэтому они его касаются."
      - "Квадраты 5 и 6 стоят по бокам от 2, поэтому тоже его касаются."
      - "Квадрат 4 стоит на два квадрата ниже 2, и между ними квадрат 3, поэтому он окажется напротив 2."
    answer: "Число 4."
    note:
      title: "Проверка бумагой"
      text: "Нарисуйте крест на клетчатой бумаге, вырежьте и сложите: 2 и 4 окажутся друг напротив друга."
    art:
      opposite: "2 и 4 напротив друг друга"
  - title: "Два сгиба и прокол"
    question: "Квадратный лист сложили пополам, потом ещё раз пополам. Сложенный лист проткнули один раз. Сколько дырок будет, когда его развернут?"
    steps:
      - "Первый сгиб даёт 2 слоя."
      - "Второй сгиб удваивает их, получается 4 слоя."
      - "Прокол проходит через все 4 слоя, поэтому на развёрнутом листе 4 дырки."
    answer: "4 дырки."
    note:
      title: "Где дырки"
      text: "Дырки лежат в 4 четвертях листа, и каждая зеркальна соседней относительно линии сгиба."
    art:
      holes: "по одной дырке в каждой четверти"
  - title: "Кубик катится"
    question: "Игральный кубик стоит так, что сверху 2. Он дважды перекатывается через ребро прямо вперёд. Числа на противоположных гранях дают в сумме 7. Какое число теперь сверху?"
    steps:
      - "Первый перекат поднимает наверх заднюю грань."
      - "Второй перекат поднимает наверх грань, которая вначале была снизу."
      - "Снизу было число напротив 2, то есть 7 − 2 = 5."
    answer: "Число 5."
    note:
      title: "После четырёх перекатов"
      text: "Ещё два переката вернут наверх 2: если катить прямо, верхняя грань возвращается каждые 4 переката."
    art:
      top: "сверху 5"
traps:
  missed_case:
    shows: "Пропущена грань, слой или случай: квадрат, который при складывании дотягивается до другого, или слой, который тоже пробивает прокол."
    say: "«Нет ли грани или слоя, которые ещё не посчитаны?»"
  ignored_condition:
    shows: "Потеряно правило задачи: соседние квадраты принимают за противоположные грани или забывают, что противоположные грани кубика дают 7."
    say: "«Подходит ли это под правило задачи?»"
  stopped_early:
    shows: "Решение обрывается на шаг раньше: после первого сгиба или после одного переката кубика."
    say: "«Нет ли ещё одного шага?»"
home:
  - title: "Развёртки из бумаги"
    text: "Нарисуйте крест из шести квадратов, вырежьте его и сложите кубик. Какие квадраты оказались напротив?"
  - title: "Сложить и проколоть"
    text: "Сложите лист два раза, проткните его один раз карандашом и угадайте, сколько будет дырок, прежде чем развернуть."
  - title: "Настоящий кубик"
    text: "Посмотрите на игральный кубик: какие числа стоят напротив? Покатите его по столу и называйте число сверху, прежде чем посмотреть."
ask: "Дай задачу на тему «Кубики и бумага»"
