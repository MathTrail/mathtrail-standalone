# The page of the topic of divisibility and remainders, for a parent, in
# Russian. The topic's name, its group, its grades and its traps' names are not
# here: they are the card's words and the catalog's numbers. The page's
# drawings, each example's level, and the answer its solver proves, are the
# site's data; an example here is worked through to that answer. The traps are
# the topic's commonest, counted in its reference tasks.

title: Делимость и остатки
description: Что такое задачи на делимость и остатки, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    29 учеников едут на экскурсию, в каждую машину садятся четверо. Сколько
    нужно машин? В этих задачах ребёнок делит с остатком, а потом решает, что
    этот остаток значит: ещё одну машину, лишнюю конфету или место в следующем
    ряду. Признаки делимости отвечают на вопрос «делится ли?» вовсе без
    деления.
  method: Записать число как полные группы и остаток
  teaches: Понимать остаток в словах задачи и проверять делимость, не деля
  # Its drawing is the site's data: fourteen counted out in threes: four full
  # groups and two left over.

basis:
  title: Правила деления
  cards:
    - mark: "<"
      title: Остаток меньше делителя
      text: >-
        При делении на 7 остаток бывает 0, 1, 2 и так далее до 6. Если вышло 7
        или больше, поместится ещё одна группа.
    - mark: "+1"
      title: Что значит остаток
      text: >-
        29 учеников по 4 в машине — это 7 полных машин и 1 ученик в остатке,
        значит, машин нужно 8. При том же делении ответом может быть 7, 8 или
        1: всё решает вопрос.
    - mark: "9"
      title: Признаки делимости
      text: >-
        Число делится на 2, если его последняя цифра чётная, на 5 — если оно
        оканчивается на 0 или 5, а на 3 и на 9 — если на них делится сумма его
        цифр.

idea:
  title: Полные группы и остаток
  lead: Любое целое число можно записать как полные группы и остаток. Вопрос решает, что из двух ему нужно.
  table:
    head:
      - Вопрос
      - Деление
      - Ответ
    rows:
      - - Сколько машин на 4 места нужно 29 ученикам?
        - 29 = 7 × 4 + 1
        - 8 машин
      - - "29 конфет делят на 4 детей: сколько получит каждый?"
        - 29 = 7 × 4 + 1
        - по 7 конфет
      - - Сколько из 29 конфет останется?
        - 29 = 7 × 4 + 1
        - 1 конфета
  note:
    title: Почему это важно
    text: >-
      Деление во всех строках одно и то же, меняется только смысл. Ребёнок,
      который делит без ошибок, всё равно может назвать число полных групп,
      когда спрашивают остаток, или забыть машину для последнего ученика.

method:
  title: "Как решают: полные группы и остаток"
  lead: >-
    Запишите число как полные группы и остаток. Потом прочитайте вопрос ещё
    раз и решите, что он спрашивает: группы, остаток или на одну группу
    больше. Если нужно наименьшее число или цифра с каким-то свойством,
    перебирайте их по порядку. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Разделить на полные группы и остаток
    - Понять, что спрашивает вопрос
    - Проверить ответ по словам задачи

examples:
  - title: Автобусы на экскурсию
    question: >-
      На экскурсию едут 150 учеников, в каждом автобусе 40 мест. Сколько нужно
      автобусов?
    # Its drawing is the site's data: four buses, three full, and one with the
    # 30 pupils left over.
    steps:
      - "Отсчитаем учеников по 40: 150 = 3 × 40 + 30. Три автобуса полные, и остаются 30 учеников."
      - Этим 30 ученикам тоже нужен автобус, хоть он и не будет полным.
      - 3 + 1 = 4 автобуса.
    answer: 4 автобуса.
    note:
      title: Почему не 3 и не 30?
      text: >-
        3 — это число полных автобусов, а 30 — сколько учеников едет в
        последнем. Вопрос — обо всех нужных автобусах.
  - title: Звёздочка в 38*6
    question: >-
      Какую цифру нужно поставить вместо звёздочки в числе 38*6, чтобы оно
      делилось на 9 без остатка?
    steps:
      - Число делится на 9 тогда и только тогда, когда на 9 делится сумма его цифр.
      - >-
        Известные цифры дают 3 + 8 + 6 = 17, а звёздочка — цифра от 0 до 9,
        поэтому сумма — от 17 до 26.
      - "Из чисел от 17 до 26 на 9 делится только 18, значит, звёздочка — 1: 3816 = 9 × 424."
    answer: Цифру 1.
    note:
      title: А на 3?
      text: >-
        Для 3 сумма должна делиться на 3: подходят 18, 21 и 24, значит,
        звёздочка может быть 1, 4 или 7. Признак делимости на 9 строже и здесь
        оставляет одну цифру.
  - title: Сто двоек
    question: >-
      Перемножили сто двоек: 2 × 2 × 2 × … × 2. Какой цифрой оканчивается
      результат?
    # Its drawing is the site's data: how many twos are multiplied, above, and
    # the last digit of the product, below.
    steps:
      - >-
        Посмотрим на последнюю цифру, умножая двойки одну за другой: 2, 4, 8,
        16, 32, 64, 128, 256. Последние цифры идут 2, 4, 8, 6 и повторяются.
      - >-
        Длина повтора — 4, а 100 = 25 × 4: сотая двойка завершает 25-й круг
        повтора и стоит на его 4-м месте.
      - На 4-м месте повтора стоит 6, значит, результат оканчивается на 6.
    answer: Цифрой 6.
    note:
      title: Остатки под маской
      text: >-
        Важен был только остаток от деления 100 на 4: он сказал, на какое место
        повтора попадает сотая двойка. Остатки отвечают на многие вопросы о
        том, что повторяется: последние цифры, дни недели, места в хороводе.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  remainder_vs_quotient:
    shows: >-
      Полные группы и остаток меняются местами: ребёнок называет 30 учеников в
      остатке, когда спрашивают число автобусов, или принимает 25 полных кругов
      повтора за место в нём.
    say: «Вопрос о полных группах или об остатке?»
  off_by_one:
    shows: >-
      Ответ отличается на одну группу: места в повторе считают с 0, а не с 1,
      или забывают автобус для последних 30 учеников и называют 3 автобуса
      вместо 4.
    say: «Нужна ли для остатка ещё одна группа?»
  missed_case:
    shows: >-
      Найден один случай, и поиск остановлен: в задаче о делимости на 3
      звёздочка — 1, и ребёнок не проверяет, подходят ли 4 и 7.
    say: «Все ли цифры от 0 до 9 проверены?»

home:
  - title: Делим с остатком
    text: >-
      Делите конфеты или карточки на всю семью и называйте результат из двух
      частей: сколько получает каждый и сколько осталось.
  - title: Проверка по цифрам
    text: >-
      Придумывайте большие числа и проверяйте их делимость на 3 и на 9 по
      сумме цифр, а потом делите на калькуляторе и смотрите, как работает
      правило.
  - title: То, что повторяется
    text: >-
      Ищите то, что идёт по кругу: дни недели, цвета бус, последние цифры чисел
      3, 9, 27, 81. Спросите, что будет через 50 шагов.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на делимость и остатки
