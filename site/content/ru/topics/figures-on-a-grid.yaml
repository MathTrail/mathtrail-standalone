title: Фигуры на клетчатой бумаге
description: Что такое задачи на площадь и периметр по клеткам, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Нарисуйте фигуру на клетчатой бумаге: сколько клеток она занимает и какой
    длины её граница? В этих задачах площадь считают в клетках, а периметр — в
    сторонах клеток, и их легко перепутать: прямоугольник может потерять
    угловую клетку и сохранить периметр. Всё умение — считать, ничего не
    пропуская и ничего не считая дважды.
  method: Считать внешние стороны каждой клетки
  teaches: Отличать площадь от периметра и считать клетки и стороны, ничего не пропуская и не повторяя
  # Its drawing is the site's data: an L of three cells, an area of 3 cells and
  # a perimeter of 8 sides.

basis:
  title: Правила клетчатой бумаги
  cards:
    - mark: "□"
      title: Площадь — это клетки
      text: >-
        Площадь фигуры на клетчатой бумаге — это число клеток, которые она
        занимает. Две половинки клетки дают одну целую.
    - mark: "|"
      title: Периметр — это стороны
      text: >-
        Периметр — это число сторон клеток на границе фигуры. Сторона, общая
        для двух клеток фигуры, лежит внутри и не считается.
    - mark: "≠"
      title: Это разные вещи
      text: >-
        У двух фигур одной площади периметры бывают разными: у четырёх клеток в
        ряд периметр 10, а у четырёх клеток квадратом — 8.

idea:
  title: Считать внешние стороны
  lead: У каждой клетки 4 стороны. Сторона идёт в периметр, только если по другую её сторону нет клетки фигуры.
  table:
    head:
      - Фигура
      - Площадь, в клетках
      - Периметр, в сторонах
    rows:
      - - 1 клетка
        - "1"
        - "4"
      - - 2 клетки рядом
        - "2"
        - 4 + 4 − 2 = 6
      - - 4 клетки в ряд
        - "4"
        - "10"
      - - квадрат 2 на 2
        - "4"
        - "8"
  note:
    title: Почему это важно
    text: >-
      Для периметра дети часто считают клетки или все стороны всех клеток, а
      общие — дважды. Если считать только стороны, которые смотрят наружу, обе
      ошибки исчезают.

method:
  title: "Как решают: обойти границу"
  lead: >-
    Нарисуйте фигуру на клетчатой бумаге. Для площади посчитайте клетки по
    рядам. Для периметра обойдите границу и посчитайте стороны клеток, мимо
    которых проходите. Если фигуру разрезают, перебирайте части в таком
    порядке, чтобы ни одну не пропустить и ни одну не посчитать дважды.
    Примеры ниже идут от простого к олимпиадному.
  steps:
    - Нарисовать фигуру на клетчатой бумаге
    - Посчитать клетки для площади, внешние стороны для периметра
    - Проверить вторым способом

examples:
  - title: Крест
    question: >-
      Крест сложен из 5 клеток: одна в середине и по одной с каждой из четырёх
      её сторон. Каков периметр креста в сторонах клеток?
    # Its drawing is the site's data: the cross of five cells.
    steps:
      - У каждого из 4 концов креста наружу смотрят 3 стороны, всего 4 × 3 = 12 сторон.
      - "У средней клетки наружу не смотрит ни одна сторона: каждая касается конца креста."
      - Значит, периметр — 12 сторон клеток.
    answer: 12 сторон клеток.
    note:
      title: Другой способ подсчёта
      text: >-
        У 5 клеток 5 × 4 = 20 сторон. 4 стороны между серединой и концами
        лежат внутри, и каждая из них посчитана дважды, по разу от каждой
        клетки. Поэтому периметр — 20 − 2 × 4 = 12.
  - title: Полоска пополам
    question: >-
      Полоску 2 на 4 клетки разрезают по линиям сетки на две части по 4 клетки,
      и каждая часть должна быть цельной, не распадаться. Сколькими способами
      это можно сделать?
    # Its drawing is the site's data: the four cuts, with the two pieces of each
    # in two shades.
    steps:
      - "Разрез прямо вдоль середины даёт два ряда по 4 клетки: 1 способ."
      - "Разрез прямо поперёк середины даёт два квадрата 2 на 2: 1 способ."
      - >-
        Разрез, который идёт поперёк, потом вдоль и снова поперёк, даёт два
        уголка, и ступенька может идти в одну или в другую сторону: 2 способа.
        Всего 4 способа.
    answer: 4 способа.
    note:
      title: Почему не 8?
      text: >-
        Если перебирать части по одной, каждый разрез найдётся дважды — по разу
        для каждой его части. Если условиться, что первая часть содержит левую
        верхнюю клетку, каждый разрез посчитается один раз.
  - title: Диагональ
    question: >-
      На клетчатой бумаге нарисован прямоугольник 3 на 5 клеток, и из одного
      его угла в противоположный проведён отрезок. Через сколько клеток он
      проходит? Клетка считается, если отрезок проходит через её внутреннюю
      часть, а не только касается угла.
    # Its drawing is the site's data: the rectangle, and the cells the line
    # passes through.
    steps:
      - >-
        Идя из угла в угол, отрезок попадает в новую клетку каждый раз, когда
        пересекает линию сетки внутри прямоугольника.
      - >-
        Он пересекает 4 линии одного направления и 2 другого и никогда две
        сразу: у 3 и 5 нет общих делителей, кроме 1, поэтому по пути отрезок не
        проходит через узлы сетки.
      - Он начинается в 1 клетке и заходит ещё в 4 + 2 = 6, всего 7 клеток.
    answer: 7 клеток.
    note:
      title: Через узел
      text: >-
        В прямоугольнике 4 на 6 клеток отрезок проходит через узел сетки, где
        пересекает сразу две линии и попадает в одну клетку, а не в две. Он
        проходит через 4 + 6 − 2 = 8 клеток: 2 — наибольшее число, на которое
        делятся и 4, и 6.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      Одно и то же считают дважды: общие стороны клеток добавляют к периметру
      или каждый разрез полоски перечисляют по разу для каждой из двух частей.
    say: «Не посчитаны ли сторона или разрез с двух сторон?»
  missed_case:
    shows: >-
      Пропущен случай: разрез со ступенькой в другую сторону, кусок границы во
      внутреннем углу или доминошки, стоящие вертикально, а не только лежащие.
    say: «Есть ли способ, который ещё не пробовали, например наоборот?»
  ignored_condition:
    shows: >-
      Теряется условие: распавшуюся часть считают частью, соседней называют
      клетку, которая касается только углом, или думают, что отрезок проходит
      через клетку, которой только касается.
    say: «Эта часть или клетка точно подходит под условие?»

home:
  - title: Клетчатая бумага
    text: >-
      Держите под рукой клетчатую бумагу и рисуйте вместе фигуры из 4 или 5
      клеток. У какой граница самая длинная? У какой самая короткая?
  - title: Обойти границу
    text: >-
      Посчитайте периметр, проводя пальцем по границе сторона за стороной.
      Потом посчитайте внешние стороны каждой клетки и проверьте, что ответы
      совпали.
  - title: Разрежь и посчитай
    text: >-
      Разрежьте бумажную полоску на две одинаковые по размеру части как можно
      большим числом способов. Разложите их так, чтобы ни один способ не
      пропустить и не повторить.

