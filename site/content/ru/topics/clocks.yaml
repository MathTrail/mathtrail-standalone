# The page of the topic of clocks, for a parent, in Russian. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: Часы
description: Что такое задачи на часы и время, как их решают, где ошибаются дети и как помочь дома.

# The words the page's drawings write a length of time in.
art:
  minutes: "{count} мин"
  hours: "{count} ч"
  both: "{hours} ч {minutes} мин"

hero:
  lead: >-
    Прогулка начинается в 4:50 и длится 25 минут — когда она закончится? В
    этих задачах ребёнок прибавляет и отнимает время, и подвох в том, что в
    часе 60 минут, а не 100. Больше всего ошибок там, где время переходит
    через целый час, через полдень или через полночь.
  method: Дойти до целого часа, а потом дальше
  teaches: Считать время через час и через полночь и отличать время на часах от того, сколько времени прошло
  # The words of its drawing: the walk over it, and what its line of time
  # shows under it.
  art:
    line: Прогулка с 4:50, длится 25 минут
    whole: сначала до целого часа, потом дальше

basis:
  title: Правила часов
  cards:
    - title: В часе 60 минут
      text: >-
        Минуты считают до 60, а не до 100, как обычные числа. Поэтому 8:50 и
        ещё 20 минут — это 9:10, а не 8:70, и 110 минут — это 1 час 50 минут,
        а не 1 час 10.
    - title: Через целый час
      text: >-
        Чтобы прибавить время через час, сначала дойдите до целого часа, а
        остаток прибавьте потом: от 8:50 до 9:00 — 10 минут, а после 9:00 —
        ещё 10.
    - title: В сутках 24 часа
      text: >-
        После 23:59 наступает 0:00 следующего дня. С 22:00 до 6:00 — 2 часа до
        полуночи и 6 часов после неё.
      art:
        midnight: "0:00 — полночь, начало следующего дня"

idea:
  title: Через целый час
  lead: Сколько прошло от одного момента до другого? Остановитесь по пути на целом часе, и одно трудное вычитание превратится в два лёгких шага.
  table:
    head:
      - С какого и до какого
      - Через целый час
      - Сколько прошло
    rows:
      - - с 8:40 до 9:15
        - 20 мин + 15 мин
        - 35 мин
      - - с 10:50 до 12:30
        - 10 мин + 1 ч 30 мин
        - 1 ч 40 мин
      - - с 22:30 до 6:00
        - 1 ч 30 мин + 6 ч
        - 7 ч 30 мин
  note:
    title: Почему это важно
    text: >-
      Когда ребёнок вычитает 9:15 − 8:40 столбиком, он легко занимает 100
      минут вместо 60. Счёт через целый час такой ошибки не допускает.

method:
  title: "Как решают: линия времени"
  lead: >-
    Нарисуйте линию и расставьте на ней моменты по порядку: чем раньше, тем
    левее. Дойдите до целого часа, потом шагайте целыми часами, потом
    прибавьте оставшиеся минуты. Примеры ниже идут от простого к
    олимпиадному.
  steps:
    - Расставить моменты на линии по порядку
    - Дойти до целого часа и шагать дальше
    - Сложить шаги и проверить, раньше или позже должен быть ответ
  # The key under the steps: what the drawings' boxes and arrows mean.
  legend:
    whole: целый час
    lasts: сколько прошло

examples:
  - title: Урок плавания
    question: >-
      Урок плавания у Тёмы начинается в 3:45 и длится 40 минут. Во сколько он
      заканчивается?
    steps:
      - "Сначала дойдём до целого часа: от 3:45 до 4:00 — 15 минут."
      - "После 4:00 остаётся 40 − 15 = 25 минут."
      - "4:00 и ещё 25 минут — это 4:25."
    answer: В 4:25.
    note:
      title: Почему не 3:85?
      text: >-
        45 + 40 = 85, но 85 минут на часах не бывает: на 60 час сменяется. Если
        сначала дойти до целого часа, такое время не получится.
    art:
      start: начало урока, длится 40 минут
      split: 40 минут = 15 до 4:00 + 25 после
      never: так не бывает
      right: верно
  - title: Шахматный турнир
    question: >-
      В шахматном турнире 5 туров. Каждый тур длится 50 минут, а между
      соседними турами — перерыв 15 минут. Первый тур начинается в 10:00. Во
      сколько заканчивается последний тур?
    steps:
      - "5 туров по 50 минут: 5 × 50 = 250 минут игры."
      - >-
        Перерывы бывают только между турами, поэтому их 4, а не 5:
        4 × 15 = 60 минут.
      - >-
        250 + 60 = 310 минут — это 5 часов 10 минут. 10:00 и ещё 5 часов 10
        минут — это 15:10.
    answer: В 15:10.
    note:
      title: Почему не 13:10?
      text: >-
        310 минут — это не 3 часа 10 минут: в часе 60 минут, а не 100.
        310 = 5 × 60 + 10.
    art:
      round: тур — 50 мин
      break: перерыв — 15 мин
      rounds: 5 × 50 = 250 минут
      breaks: "перерывов на один меньше, чем туров: 4 × 15 = 60"
      total: 310 мин = 5 × 60 + 10
      hours: 5 часов по 60 минут и ещё 10
  - title: Два города
    question: >-
      Бабушка летит к Ане в другой город. Самолёт взлетает в 8:00 по часам
      бабушкиного города и садится в 8:30 по часам Аниного. Часы в Анином
      городе показывают на 4 часа меньше, чем в бабушкином. Сколько длится
      полёт?
    steps:
      - >-
        8:00 и 8:30 показывают разные часы, поэтому сначала переведём оба
        времени на одни часы — бабушкины.
      - "Когда в Анином городе 8:30, у бабушки на 4 часа больше: 12:30."
      - "С 8:00 до 12:30 по одним часам — 4 часа 30 минут."
    answer: 4 часа 30 минут.
    badge: "4:30"
    note:
      title: Полчаса?
      text: >-
        8:30 − 8:00 — это полчаса, только если оба времени на одних часах.
        Время двух городов сравнивают, переведя одно из них на часы другого.
    art:
      take-off: взлёт, у бабушки
      landing: посадка, у Ани
      grandma-clock: бабушкины часы
      ann-clock: Анины часы
      at-ann: у Ани
      at-grandma: у бабушки
      grandma: бабушка
      ann: Аня
      other: разные часы

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_operation:
    shows: >-
      Ребёнок делает действие, которого вопрос не просит: умножает там, где
      нужно просто отсчитать, или складывает два времени на часах как
      количества, будто 3 часа и 5 часов дают 8. Время на часах — это точка на
      линии, а не количество.
    say: «Это время на часах или сколько прошло времени?»
    art:
      question: С 3:00 до 5:00 — сколько прошло?
  time_unit_mixup:
    shows: >-
      Минуты считаются так, будто в часе их 100: 3:45 и ещё 40 минут
      превращаются в 3:85, а 310 минут — в 3 часа 10 минут.
    say: «Сколько минут в одном часе?»
    art:
      question: "3:45 и ещё 40 минут"
  reversed_relation:
    shows: >-
      Раньше и позже меняются местами: ребёнок отсчитывает назад, когда вопрос
      идёт вперёд, или прибавляет разницу во времени, которую нужно отнять.
      Тогда самолёт садится раньше, чем взлетел.
    say: «Ответ должен быть раньше начала или позже?»
    art:
      question: Взлёт в 8:00 по бабушкиным часам
      before: посадка раньше взлёта?

home:
  - title: Часы со стрелками
    text: >-
      Повесьте часы со стрелками там, где ребёнок их видит, и спрашивайте
      между делом: который будет час через четверть часа? А который был
      двадцать минут назад?
  - title: Сколько осталось?
    text: >-
      Перед мультфильмом или прогулкой прикиньте вместе, сколько осталось
      ждать, а потом проверьте по часам. Настоящее ожидание делает минуты
      ощутимыми.
  - title: План дня
    text: >-
      Напишите план свободного дня со временем: прогулка с 11:30 до 12:15,
      обед в 12:30. Сколько длится каждое дело и сколько времени между ними?

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу про часы
