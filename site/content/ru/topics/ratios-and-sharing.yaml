# The page of the topic of ratios and sharing, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Отношения и деление на части
description: Что такое задачи на отношения и деление на части, как их решают, где ошибаются дети и как помочь дома.

# The words the page's drawings name their people and boxes in.
art:
  ann: Аня
  ben: Боря
  a: А
  b: Б

hero:
  lead: >-
    Аня и Боря делят 35 конфет в отношении 3 к 4. Сколько достанется каждому?
    В этих задачах отношение говорит, сколько равных частей получает каждый, а
    не сколько предметов. Если сначала посчитать части и найти, сколько
    приходится на одну, любая задача на отношения сводится к делению.
  method: Посчитать части, потом найти одну часть
  teaches: Видеть в отношении равные части и пересчитывать рецепт на другое число порций
  # The words of its drawing: what is shared over it, and what the parts come
  # to under it.
  art:
    line: 35 конфет в отношении 3 к 4
    parts: 7 частей = 35, одна часть = 5
    shares: Ане 3 × 5 = 15, Боре 4 × 5 = 20

basis:
  title: Правила отношений
  cards:
    - title: Отношение — это части
      text: >-
        3 к 4 значит: на каждые 3 равные части одного приходится 4 части
        другого. Вместе это 7 равных частей, а не 3 и не 4.
      art:
        seven: 3 к 4 — это 7 равных частей
    - title: Сначала одна часть
      text: >-
        Разделите всё на число частей, чтобы найти одну часть, а потом умножьте
        её на число частей каждого: 35 : 7 = 5, значит, 3 части — это 15, а 4
        части — 20.
      art:
        one: "35 : 7 = 5 в одной части"
    - title: Умножаем обе стороны
      text: >-
        Отношение не меняется, если оба его числа умножить на одно и то же: 3 к
        4 — это 6 к 8 и 30 к 40. Так рецепт пересчитывают на большее число
        порций.

idea:
  title: Посчитать части
  lead: Каким бы ни было отношение, сначала сложите его числа. Столько равных частей и получается в целом.
  table:
    head:
      - Что делим
      - Частей
      - Одна часть и доли
    rows:
      - - 35 конфет, 3 к 4
        - 3 + 4 = 7
        - "35 : 7 = 5, значит, 15 и 20"
      - - 60 карточек, 1 к 2 к 3
        - 1 + 2 + 3 = 6
        - "60 : 6 = 10, значит, 10, 20 и 30"
      - - 45 бусин, 2 к 7
        - 2 + 7 = 9
        - "45 : 9 = 5, значит, 10 и 35"
  note:
    title: Почему это важно
    text: >-
      Самая частая ошибка — делить на одно из чисел отношения вместо их суммы:
      35 : 3 или 35 : 4. Если нарисовать по клетке на каждую часть, сумму
      невозможно пропустить.

method:
  title: "Как решают: клетка на каждую часть"
  lead: >-
    Нарисуйте по клетке на каждую часть отношения: у каждого, кто делит, свой
    ряд клеток. Посчитайте все клетки, найдите, сколько приходится на одну, и
    заполните доли. Примеры ниже идут от простого к олимпиадному.
  steps:
    - Нарисовать клетку на каждую часть
    - Найти, сколько приходится на одну клетку
    - Заполнить доли и проверить сумму
  # The key under the steps: what a tile of the drawings means.
  legend:
    one: одна часть и сколько в ней
    spoken: части, о которых говорит условие

examples:
  - title: Грибы
    question: >-
      Макс и Лена собрали вместе 45 грибов. На каждые 4 гриба Макса приходится
      5 грибов Лены. Сколько грибов собрала Лена?
    steps:
      - 4 к 5 значит 4 части у Макса и 5 у Лены, всего 9 равных частей.
      - "Одна часть — это 45 : 9 = 5 грибов."
      - "У Лены 5 частей: 5 × 5 = 25 грибов. Проверка: у Макса 20, и 20 + 25 = 45."
    answer: 25 грибов.
    note:
      title: "Почему не 45 : 5?"
      text: >-
        45 : 5 = 9 делит только на число Лены. А 45 грибов — это все 9 частей,
        Макса и Лены вместе.
    art:
      max: М
      lena: Л
      together: вместе 45 грибов
      max-name: Макс
      lena-name: Лена
      nine: 9 клеток — 45 грибов
      each: "45 : 9 = 5 в каждой клетке"
      only-lena: только Лена
  - title: Хор
    question: >-
      В хоре на каждые 4 мальчика приходится 7 девочек, и девочек на 9 больше,
      чем мальчиков. Сколько детей поёт в хоре?
    steps:
      - >-
        Мальчики — это 4 части, девочки — 7 частей, значит, у девочек на 3
        части больше.
      - "Эти 3 части — 9 лишних девочек: одна часть — это 9 : 3 = 3 ребёнка."
      - >-
        Хор — это 4 + 7 = 11 частей: 11 × 3 = 33 ребёнка. Проверка: 12
        мальчиков и 21 девочка, девочек на 9 больше.
    answer: 33 ребёнка.
    note:
      title: Какие части равны 9?
      text: >-
        9 — это не 7 частей девочек, а 3 части, на которые девочек больше. Если
        делить 9 на 7 или на 11, целого числа детей не получится.
    art:
      boys: мальчики
      girls: девочки
      nine: 9 девочек
      choir: 11 клеток × 3 = 33
      this-nine: это 9
  - title: Две коробки
    question: >-
      В двух коробках шарики в отношении 3 к 1. Когда из первой коробки во
      вторую переложили 10 шариков, в коробках стало поровну. Сколько всего
      шариков?
    steps:
      - >-
        Когда шарики перекладывают из коробки в коробку, их общее число не
        меняется: оно одно и то же до и после.
      - >-
        До этого всё — это 4 части, и в первой коробке 3 из них. После в ней
        половина всего, 2 из тех же 4 частей. Значит, она отдала 1 часть.
      - >-
        Эта часть — 10 переложенных шариков: всего 4 × 10 = 40. Проверка: до —
        30 и 10, после — 20 и 20.
    answer: 40 шариков.
    note:
      title: Что не меняется
      text: >-
        В задачах на отношения часто прячется то, что не меняется: здесь это
        общее число. Если измерить оба отношения частями одного и того же
        целого, их можно сравнить.
    art:
      box-a: коробка А
      box-b: коробка Б
      four: всего 4 части — и до, и после
      before: до
      after: после
      part: 1 часть

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ratio_total_confusion:
    shows: >-
      Числа отношения принимают за доли целого: 4 к 5 читают как 4 из 5 или
      делят 45 грибов на 5, а не на 4 + 5 = 9 частей.
    say: «Сколько всего равных частей?»
    art:
      question: 45 грибов, 4 к 5
      one: в одной части
  wrong_operation:
    shows: >-
      Ребёнок складывает там, где отношение требует умножать: если людей на 6
      больше, рецепт получает на 6 яиц больше, хотя яйца должны расти вместе с
      числом людей.
    say: «Если людей станет вдвое больше, что будет с яйцами?»
    art:
      question: 3 яйца на 2 человек — а на 8?
  answered_other_question:
    shows: >-
      Доля найдена, но в ответе не та: грибы Макса вместо грибов Лены или одна
      часть, 3 ребёнка, вместо всего хора.
    say: «Чью долю спрашивают в задаче?»
    art:
      question: Сколько грибов собрала Лена?
      max: М
      lena: Л

home:
  - title: Готовим по отношению
    text: >-
      Сделайте вместе напиток или тесто по отношению: одна чашка сока на три
      чашки воды. Потом сделайте вдвое больше и посмотрите, что удвоилось.
  - title: Клетки на бумаге
    text: >-
      Когда дома делите конфеты или домашние дела, рисуйте по клетке на каждую
      часть и заполняйте их. Клетки думают за вас.
  - title: Карты и модели
    text: >-
      Посмотрите на масштаб карты или модели машины: 1 к 50 значит, что каждый
      сантиметр означает 50. Измерьте что-нибудь вместе и пересчитайте в
      настоящий размер.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу на отношения и деление на части
