# The page of the topic of knights and liars, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. Each example's level, and the
# answer its solver proves, are the site's data; an example here is worked
# through to that answer. The traps are the topic's commonest, counted in its
# reference tasks.

title: Рыцари и лжецы
description: Что такое задачи про рыцарей и лжецов, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    На острове живут рыцари, которые всегда говорят правду, и лжецы, которые
    всегда лгут. По их словам нужно понять, кто есть кто. Для многих детей это
    первая встреча с настоящим логическим рассуждением: предположить, вывести
    следствие и заметить противоречие.
  method: «Предположим, что он рыцарь…»
  teaches: Рассуждать по цепочке и проверять себя
  # Two islanders who call each other liars: one is a knight, the other a liar.
  drawing: |2
          А               Б
      «Б — лжец»      «А — лжец»
     ~~~~~~~~~~~~~~~~~~~~~~~~~~~~

basis:
  title: Правила острова
  cards:
    - mark: Р
      title: Рыцарь
      text: Всегда говорит правду. Каждое его утверждение верно — без исключений.
    - mark: Л
      title: Лжец
      text: Всегда лжёт. Каждое его утверждение ложно — даже случайно он правду не скажет.
    - mark: "?"
      title: Третьих нет
      text: Каждый житель — либо рыцарь, либо лжец. С виду их не отличить, только по словам.

idea:
  title: Кто что может сказать
  lead: Начните с двух фраз — они сразу показывают, как устроены эти задачи.
  table:
    head:
      - Фраза
      - Рыцарь
      - Лжец
      - Что это значит
    rows:
      - - «Я рыцарь»
        - "✓ Может: это правда"
        - "✓ Может: это ложь, как ему и положено"
        - Ничего не сообщает — так скажет любой.
      - - «Я лжец»
        - "✕ Не может: это была бы ложь"
        - "✕ Не может: это была бы правда"
        - Невозможная фраза — её не скажет никто.
  note:
    title: Почему это важно
    text: >-
      Если житель называет себя рыцарем, эту фразу можно вычеркнуть — она
      ничего не меняет. А если по ходу решения выходит, что кто-то фактически
      сказал «я лжец», значит, предположение неверно.

method:
  title: "Как решают: «предположим, что…»"
  lead: >-
    Почти любую такую задачу решают одинаково: выбирают одного жителя,
    предполагают, кто он, и смотрят, что из этого следует. Примеры ниже идут
    от простого к олимпиадному.
  steps:
    - Предположить
    - Вывести, что из этого следует
    - Найти противоречие или проверить ответ

examples:
  - title: Двое на дороге
    question: >-
      На острове встретились двое: А и Б. А сказал: «Я лжец, а Б — рыцарь».
      Кто из них кто?
    steps:
      - >-
        **Пусть А — рыцарь.** Тогда его слова — правда, и он лжец. Но мы
        предположили, что он рыцарь: **противоречие**, этот случай невозможен.
      - >-
        **Пусть А — лжец.** Тогда его слова ложны. Первая их половина,
        «я лжец», верна — значит, неверна вторая: Б не рыцарь, а лжец.
        **Всё сходится.**
    answer: А и Б — оба лжецы.
    note:
      title: Как лжец смог сказать «я лжец»?
      text: >-
        Сама по себе фраза «я лжец» невозможна. Но в паре с другой, через «и»,
        её может сказать лжец: вся фраза ложна, если ложна хотя бы одна её
        часть.
  - title: Цепочка обвинений
    question: >-
      Трое жителей — А, Б и В — сказали так. А: «Б — лжец». Б: «В — рыцарь».
      В: «А и Б — лжецы». Кто из них рыцарь, а кто лжец?
    steps:
      - >-
        **С кого начать?** С того, кто говорит больше всех: из его слов следует
        больше всего. Это В.
      - >-
        **Пусть В — рыцарь.** Тогда А и Б — лжецы. Но Б сказал «В — рыцарь», и
        это была бы правда, а лжец правды не говорит. **Противоречие.**
      - >-
        **Значит, В — лжец.** Тогда фраза Б «В — рыцарь» ложна, и Б — тоже
        лжец.
      - А сказал «Б — лжец» — и это правда. Значит, А — рыцарь.
    answer: А — рыцарь, Б и В — лжецы.
    note:
      title: "Проверка: каждую фразу ещё раз"
      text: >-
        А: «Б — лжец» — правда, и говорит рыцарь. Б: «В — рыцарь» — неправда, и
        говорит лжец. В: «А и Б — лжецы» — неправда, ведь А — рыцарь, и говорит
        лжец. Всё сходится.
  - title: Круглый стол
    question: >-
      За круглым столом сидят 10 жителей. Каждый сказал: «Мой сосед справа —
      лжец». Сколько за столом рыцарей?
    # The table drawn with its answer, knights and liars taking turns.
    drawing: |2
           Р   Л
        Л         Р
       Р           Л
        Л         Р
           Р   Л
    steps:
      - >-
        Если житель — рыцарь, он сказал правду: справа от него лжец.
      - >-
        Если житель — лжец, он солгал: справа от него рыцарь.
      - >-
        Выходит, они чередуются по кругу: Р, Л, Р, Л… Из десяти ровно
        половина — **5 рыцарей**.
    answer: 5 рыцарей.
    note:
      title: А если за столом 9 человек?
      text: >-
        Чередование по кругу из нечётного числа не замыкается: последний и
        первый окажутся одного типа. Такой стол невозможен. Здесь рыцари
        встречаются с чётностью.

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      Ребёнок расставляет Р и Л и не проходит по всем фразам ещё раз — а одна
      из них с расстановкой не сходится.
    say: "«Прочитай каждую фразу: правда это или ложь — и кто её сказал?»"
  trusted_statement:
    shows: >-
      Ребёнок верит словам жителя и не спрашивает, кто их сказал: А назвал Б
      лжецом — значит, Б лжец.
    say: «А если это сказал лжец? Что тогда правда?»
  stopped_early:
    shows: >-
      Ребёнок выясняет, кто первый житель, и на этом останавливается, а про
      остальных так и не решает.
    say: «Хорошо, А — лжец. А что из этого следует для Б?»

home:
  - title: Сыграйте в остров
    text: >-
      Вы — лжец, ребёнок задаёт вопросы. Скоро ребёнок сам замечает, что на
      «ты лжец?» вы всегда отвечаете «нет».
  - title: Спрашивайте, а не подсказывайте
    text: >-
      Вместо ответа — вопрос: «А если он рыцарь, что тогда?» Это и есть главный
      приём темы.
  - title: Пишите Р и Л карандашом
    text: >-
      Над каждым именем — предположение. Получилось противоречие — стираем и
      пробуем другое.

# What a parent can write in the chat to get a task on this topic.
ask: Дай задачу про рыцарей и лжецов
