# The page of the topic of gaps and boundaries, for a parent, in Russian. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: Промежутки и границы
description: Что такое задачи на промежутки и границы, как их решают, где ошибаются дети и как помочь дома.

hero:
  lead: >-
    Шесть деревьев в ряд — сколько между ними промежутков? Бревно распилили на
    пять кусков — сколько было распилов? В этих задачах ребёнок считает то
    предметы, то промежутки между ними, а эти два числа отличаются на единицу.
    Из-за этой единицы и случается большинство неверных ответов, а исправляет
    их быстрый рисунок маленького случая.
  method: Нарисовать маленький случай и посчитать на нём
  teaches: Отличать предметы от промежутков между ними и проверять правило на рисунке
  # The words of its drawing: the fence and the rule over it, and the two
  # counts under it.
  art:
    line: Четыре столба забора
    rule: считаем то столбы, то пролёты между ними
    posts: "**4** столба"
    spans: "**3** пролёта"

basis:
  title: Правила промежутков
  cards:
    - title: В ряду на один меньше
      text: >-
        Промежутки лежат между предметами, поэтому в ряду их всегда на один
        меньше: шесть деревьев — пять промежутков, пять кусков бревна — четыре
        распила.
      art:
        trees: 6 деревьев — 5 промежутков
    - title: По кругу столько же
      text: >-
        Если ряд замкнуть в круг, как кусты вокруг клумбы, у последнего
        появляется промежуток до первого: промежутков столько же, сколько
        предметов.
      art:
        bushes: 8 кустов — 8 промежутков
    - title: Оба конца считаются
      text: >-
        Со страницы 3 по страницу 7 — это 7 − 3 = 4 шага, но 5 страниц: первую
        тоже читают. Счёт «с … по …» с обоими концами добавляет единицу.
      art:
        steps: 4 шага
        pages: 4 шага, но 5 страниц

idea:
  title: Предметы или промежутки?
  lead: Каждый вопрос считает что-то одно из двух. Ряд, круг и отрезок «с … по …» считаются по-разному, и маленький рисунок показывает как.
  table:
    head:
      - Картинка
      - Что считаем
      - Сколько
    rows:
      - - 6 деревьев в ряд
        - промежутки между ними
        - 6 − 1 = 5
      - - бревно на 5 кусков
        - распилы
        - 5 − 1 = 4
      - - 8 кустов вокруг клумбы
        - промежутки между ними
        - "8"
      - - страницы с 3 по 7
        - прочитанные страницы
        - 7 − 3 + 1 = 5
  note:
    title: Почему это важно
    text: >-
      Ответ, отличающийся на единицу, выглядит почти верным, и ребёнок редко
      замечает ошибку. Два-три столбика на бумаге сразу показывают, нужно ли
      прибавить единицу, отнять её или ничего не трогать.

method:
  title: "Как решают: нарисовать маленький случай"
  lead: >-
    Сначала нарисуйте точками или столбиками маленький случай: два или три
    предмета. Посчитайте промежутки на рисунке, найдите правило и только потом
    примените его к числам задачи. Примеры ниже идут от простого к
    олимпиадному.
  steps:
    - Нарисовать предметы и промежутки
    - Понять, что из них считает вопрос
    - Посчитать и проверить правило на маленьком случае
  # The key under the steps: what the drawings' blue and red mean.
  legend:
    counted: синим — то, что считаем
    cut: распил

examples:
  - title: Автобусный маршрут
    question: >-
      На автобусном маршруте 6 остановок. От каждой остановки до следующей
      автобус едет 3 минуты. Сколько минут он едет от первой остановки до
      последней?
    steps:
      - Нарисуем 6 остановок точками. Автобус едет по промежуткам между ними.
      - Между 6 остановками 5 промежутков, на один меньше, чем остановок.
      - "Каждый промежуток — 3 минуты: 5 × 3 = 15."
    answer: 15 минут.
    note:
      title: Почему не 18?
      text: >-
        6 × 3 = 18 даёт свой промежуток каждой остановке, но после последней
        автобус уже никуда не едет: минуты уходят на дорогу между остановками.
    art:
      stops: 6 остановок, по 3 минуты между соседними
      minutes: "{count} мин"
      total: 5 × 3 = 15 минут
      end: после 6-й остановки дороги нет
  - title: Девятый и третий этаж
    question: >-
      Лена живёт на девятом этаже, а Маша — на третьем этаже того же дома. Обе
      поднимаются пешком с первого этажа. Все лестничные пролёты одинаковые. Во
      сколько раз больше ступенек проходит Лена, чем Маша?
    steps:
      - >-
        Маша поднимается с первого этажа на третий: это 2 пролёта, с первого на
        второй и со второго на третий.
      - >-
        Лена поднимается с первого этажа на девятый — это 8 пролётов, на один
        меньше номера её этажа.
      - "Пролёты одинаковые, поэтому 8 : 2 = 4. Лена проходит в 4 раза больше ступенек."
    answer: В 4 раза.
    note:
      title: Почему не в 3 раза?
      text: >-
        9 : 3 = 3 делит этажи, а ступеньки — на пролётах между этажами, и на
        первый этаж никто не поднимается.
    art:
      masha: М
      lena: Л
      third: 3-й этаж
      ninth: 9-й этаж
      from: поднимаются с 1-го этажа
      masha-name: Маша
      lena-name: Лена
      two: пролёта
      eight: пролётов
      times: 8 пролётов Лены — это 4 раза по 2 пролёта Маши
      floors: этажи
      flights: пролёты
  - title: Сколько было брёвен?
    question: >-
      Лесорубы распилили несколько брёвен, каждое хотя бы один раз. Всего они
      сделали 9 распилов и получили 14 кусков. Сколько брёвен они распилили?
    steps:
      - >-
        Распилим одно бревно: 1 распил даёт 2 куска, 2 распила — 3. У каждого
        бревна кусков на один больше, чем распилов.
      - >-
        Сложим по всем брёвнам: кусков столько, сколько распилов, и ещё по
        одному на каждое бревно.
      - 14 − 9 = 5. Брёвен было 5.
    answer: 5 брёвен.
    note:
      title: Важно ли, как делили распилы?
      text: >-
        Нет. Каждый распил превращает один кусок в два, поэтому пять брёвен
        с 9 распилами всегда дают 14 кусков: и когда почти все распилы
        достались одному бревну, и когда их поделили почти поровну.
    art:
      cuts: 9 распилов
      pieces: 14 кусков
      logs: брёвен — ?
      one: 1 распил — 2 куска
      two: 2 распила — 3 куска
      sum: "куски = распилы + брёвна: 9 = 6 + 3"
      all: 9 распилов · 14 кусков · 5 брёвен

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      Ребёнок считает остановки вместо промежутков между ними или промежутки
      вместо столбов: 6 остановок превращаются в 6 × 3 = 18 минут. Ответ
      отличается на единицу и поэтому выглядит почти верным.
    say: «Нарисуй три остановки. Сколько между ними промежутков?»
  wrong_operation:
    shows: >-
      Ребёнок делает с числами задачи то, чего рисунок не просит: складывает
      их, 6 + 3, или удваивает одно из них, вместо того чтобы посчитать
      промежутки и дать каждому его минуты.
    say: «Сколько длится один промежуток и сколько их?»
  number_from_text:
    shows: >-
      Ответом становится число из условия: 6 остановок, когда вопрос о
      минутах, или девятый этаж, когда вопрос о пролётах.
    say: «Что считает это число — остановки или промежутки?»
    art:
      question: "Вопрос: сколько минут?"
      stops: остановок
      minutes: минут

home:
  - title: Пальцы и промежутки
    text: >-
      Растопырьте пальцы: пять пальцев, четыре промежутка между ними. Это
      самая быстрая картинка всей темы, и она всегда под рукой.
  - title: Лестница по дороге домой
    text: >-
      На лестнице считайте вместе этажи и пролёты: с первого этажа на
      четвёртый — сколько пролётов? А со второго на четвёртый?
  - title: Столбы и скамейки
    text: >-
      На прогулке считайте столбы забора и пролёты между ними или скамейки
      вокруг пруда. В ряду промежутков на один меньше, по кругу — столько же.

