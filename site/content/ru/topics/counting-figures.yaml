title: "Сколько фигур"
description: "Что такое задачи на подсчёт фигур и задачи со спичками, как их решают, где ошибаются дети и как помочь дома."
hero:
  lead: "В рисунке из нескольких линий больше треугольников и квадратов, чем видно сразу: есть маленькие, а есть большие, сложенные из нескольких частей. В этих задачах нужно найти их все или сказать, какие спички убрать, чтобы фигура изменилась. Весь секрет в том, чтобы считать по размерам, начиная с самых маленьких."
  method: "Считать по размерам, от самых маленьких"
  teaches: "Считать каждую фигуру один раз, ничего не пропуская и не повторяя"
  art:
    count: "4 маленьких квадрата и 1 большой: 5"
basis:
  title: "Что считается фигурой"
  cards:
    - title: "Большие тоже считаются"
      text: "В квадрате 2 на 2 клетки есть 4 маленьких квадрата и 1 большой вокруг них. Фигура из нескольких частей тоже считается."
      art:
        count: "4 + 1 = 5 квадратов"
    - title: "Стороны на линиях"
      text: "Треугольник считается, только если каждая его сторона лежит на линии рисунка. Две линии из угла в угол дают в квадрате 8 треугольников."
      art:
        count: "4 маленьких и 4 из двух частей: 8"
    - title: "Спичка — одна сторона"
      text: "Где два квадрата из спичек соприкасаются, у них одна общая спичка. На ряд из 3 квадратов уходит 10 спичек, а не 12."
      art:
        count: "3 + 3 + 4 = 10 спичек"
idea:
  title: "Считать по размерам"
  lead: "Перечислите фигуры по размеру: сначала самые маленькие, потом из двух частей, потом ещё больше, и сложите."
  table:
    head:
      - "Рисунок"
      - "Самые маленькие"
      - "Побольше"
      - "Всего"
    rows:
      - - "квадрат 2 на 2 клетки"
        - "4"
        - "1"
        - "5"
      - - "квадрат 3 на 3 клетки"
        - "9"
        - "4 + 1"
        - "14"
      - - "прямоугольник 2 на 3 клетки"
        - "6"
        - "2"
        - "8"
  note:
    title: "Почему это важно"
    text: "Дети часто считают только маленькие фигуры или считают большую дважды, по двум её частям. Если идти по размерам и записывать каждый размер, обе ошибки уходят."
method:
  title: "Как решать: от самых маленьких"
  lead: "Назовите все размеры фигур, которые есть на рисунке, посчитайте каждый размер отдельно и сложите. Для спичек спросите, стороной каких квадратов служит каждая спичка. Примеры ниже идут от простого к олимпиадному."
  steps:
    - "Найти самые маленькие фигуры и посчитать их"
    - "Посчитать фигуры каждого следующего размера"
    - "Сложить и проверить, что ни один размер не пропущен"
examples:
  - title: "Две линии из вершины"
    question: "Из верхнего угла треугольника к его основанию идут две линии. Сколько треугольников на рисунке?"
    steps:
      - "Две линии делят треугольник на 3 маленьких треугольника."
      - "Два маленьких треугольника рядом тоже составляют треугольник, и таких пар 2."
      - "Весь треугольник даёт ещё 1. Всего 3 + 2 + 1 = 6."
    answer: "6 треугольников."
    note:
      title: "Быстрая проверка"
      text: "Вершина каждого треугольника здесь в верхнем углу, а основание на нижней линии. На нижней линии 4 точки, и любые 2 из них дают основание, а таких пар 6."
    art:
      count: "3 + 2 + 1 = 6"
  - title: "Квадрат 3 на 3"
    question: "Нарисован квадрат 3 на 3 клетки со всеми линиями. Сколько в нём квадратов любого размера?"
    steps:
      - "Квадратов из одной клетки 3 ряда по 3, то есть 9."
      - "Квадраты 2 на 2 помещаются в 2 ряда по 2 места, то есть их 4."
      - "Весь квадрат 3 на 3 даёт ещё 1. Всего 9 + 4 + 1 = 14."
    answer: "14 квадратов."
    note:
      title: "Не 9"
      text: "9 — это только маленькие квадраты. Квадрат из нескольких клеток тоже квадрат."
    art:
      sizes: "9 из одной клетки, 4 из 2 на 2, 1 из 3 на 3"
  - title: "Какие спички убрать"
    question: "Из 12 спичек сложен квадрат 2 на 2 клетки. Какое наименьшее число спичек нужно убрать, чтобы не осталось ни одного квадрата любого размера?"
    steps:
      - "Квадратов 5: 4 маленьких и 1 большой."
      - "Спичка служит стороной не больше чем 2 квадратов, поэтому 2 спички ломают не больше 4 квадратов, и один квадрат остаётся."
      - "Две внутренние спички, которые стоят вертикально, ломают все 4 маленьких квадрата, а 1 спичка сверху ломает большой. Значит, нужно 3 спички."
    answer: "3 спички."
    note:
      title: "Почему не 2"
      text: "Каждая спичка ломает 1 или 2 квадрата, а сломать нужно 5, поэтому 2 спичек мало."
    art:
      taken: "пунктиром показаны убранные спички"
traps:
  missed_case:
    shows: "Пропущен какой-то размер фигур: большой квадрат вокруг маленьких или треугольники из двух частей."
    say: "«Нет ли фигуры побольше, сложенной из нескольких частей?»"
  double_count:
    shows: "Одна фигура посчитана дважды, по двум её частям, или общая спичка посчитана для обоих квадратов."
    say: "«Эта фигура уже посчитана?»"
  stopped_early:
    shows: "Счёт остановлен на самых маленьких фигурах или на первом ответе, который показался верным."
    say: "«А фигуры другого размера здесь есть?»"
home:
  - title: "Клетчатая бумага"
    text: "Нарисуйте квадрат 2 на 2 клетки и вместе посчитайте все квадраты. Потом попробуйте 3 на 3."
  - title: "Спички"
    text: "Выложите ряд квадратов из спичек или палочек. Сколько их нужно на 4 квадрата? А на 5?"
  - title: "По размерам"
    text: "Когда считаете, называйте каждый размер вслух: маленькие, из двух частей, побольше. Записывайте числа и складывайте."
ask: "Дай задачу на тему «Сколько фигур»"
