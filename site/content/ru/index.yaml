# The home page, for a parent: what MathTrail is, why not just ask the chat,
# how a lesson goes — the card of the widget at every step — and how to
# connect. The grades, the names of the traps, the card's picture, options and
# rating, the connector's address and the card's own words are not here: they
# are the catalog's numbers, the site's data, the widget's words and the
# site's own.

title: MathTrail — олимпиадная математика в вашем чате
description: "Олимпиадная математика для детей в чате, которым вы и так пользуетесь: проверенные задачи, которые не кончаются, разбор каждой ошибки и память о том, как растёт ребёнок."

hero:
  free: Бесплатно
  open: Открытый код
  title: Олимпиадная математика — прямо в вашем чате.
  # The promise, word for word as the README gives it.
  lead: Бесконечный поток проверенных олимпиадных задач по математике для {range} классов, на любом языке, с разбором ошибки ребёнка и памятью о том, как он растёт.
  # How the task on the card was picked for the lesson's child: the child's
  # topics, then the chance of a right answer and the reasons. The topics and
  # the numbers are the site's data.
  pick:
    label: Как подобрана следующая задача
    title: Подобрано для Галта
    skills: Навыки Галта
    why: Почему эта задача
    auto: Автоподбор
    chance: "{chance} шанс решить — в зоне"
    reasons:
      - самая слабая тема
      - повторяет недавнюю ошибку на единицу
      - не тренировал 5 дней
  see: Посмотреть занятие
  note: Налейте себе чаю, пока ребёнок решает.

# The frame a card stands in: the chat a parent already uses, with the
# parent's message above the card.
chat:
  title: Ваш чат
  ask: Дай новую задачу
  progress: Как успехи у ребёнка?

pillars:
  title: Почему не спросить чат напрямую?
  lead: "Чат напишет задачу за секунду и так же быстро ошибётся: даст два верных варианта, решение, которое не сходится, или вчерашнюю задачу с новыми числами. А если ребёнок настаивает, охотно с ним согласится. MathTrail оставляет модели то, что она делает хорошо, то есть писать, а всё остальное проверяет программа."
  # A chat asked alone for a task. Its options, and which of them are right,
  # are the site's data.
  alone:
    name: Просто чат
    ask: Олимпиадную задачу для 3 класса
    task: Число делится и на 2, и на 3. Какое это может быть число?
    flag: Верных ответов два — никто не проверил
  # The chat alone against the chat with MathTrail, both asked what the chat
  # alone was asked, point against point.
  versus:
    asked: "«{ask}»"
    alone:
      - Верными могут оказаться два варианта или ни одного.
      - Соглашается с неверным ответом, если ребёнок настаивает.
      - Не помнит, где ребёнок ошибался.
      - "Нужно знать, что просить: темы, уровни, что дальше."
      - Каждая задача сама по себе, без модели того, как учатся дети.
      - Нет карты того, что ребёнок уже умеет.
    ours:
      name: Чат + MathTrail
      points:
        - "Верный вариант ровно один: решатель перебирает все случаи."
        - Ответ записывается нажатием, и переспорить его нельзя.
        - Помнит навыки и ошибки и подбирает следующую задачу.
        - "Достаточно сказать «дай задачу»: тему и уровень MathTrail выберет сам."
        - "Модель навыков на основе исследований: Эло поверх IRT, 11 рангов."
        - Рейтинг по каждой теме и карта того, какие темы на какие опираются.
  tiles:
    # The languages are named each in itself; this follows them.
    endless:
      title: Задачи не кончаются.
      text: Каждая задача пишется заново под тему, уровень и последнюю ошибку ребёнка и на языке вашего чата, а не берётся из готового банка. Каждая третья задача построена на интересах ребёнка.
      more: + любой
    checked:
      title: Программа проверяет модель.
      text: "Задача доходит до ребёнка, только если прошла все проверки: верный вариант один, решатель подтвердил ответ, текст по силам классу, это не повтор, а на картинке, если она есть, те же подписи, что в условии, и нет ответа."
      checks:
        - один ответ
        - решатель
        - по силам
        - не повтор
    diagnosis:
      title: Ошибка — это диагноз.
      # The traps are the catalog's, under the names the card gives them.
      text: За каждым неверным вариантом стоит названная ловушка, например «{first}», «{second}» или «{third}». Разбор начинается с того, как рассуждал ребёнок, а не с верного ответа.
      trap: "Ловушка: посчитаны промежутки, а не столбы"
  behind:
    title: Что стоит за каждой задачей
    # Under the words, what the parent says, and what MathTrail picks.
    coach:
      title: Не нужно быть учителем.
      text: Не обязательно знать олимпиадные темы и подбирать уровень. Скажите «дай новую задачу», и тренер сам решит, что тренировать дальше и насколько сложно.
      picked: тема и уровень — сами
    research:
      title: Модель на основе исследований.
      text: Шанс решить считает модель навыков из психометрии, то есть Эло поверх теории ответа на задание (IRT). Задачи держатся там, где ребёнок справляется в 70–85 % случаев.
      formula: P = 0,2 + 0,8·σ(θ + δ − β)
    # Under the words, a topic between two it builds on, as the catalog has
    # them.
    map:
      title: Карта навыков и тем.
      text: "MathTrail знает, какие темы на какие опираются: например, упорядочивание и перебор идут раньше рыцарей и лжецов. Рейтинг ребёнка он хранит по каждой теме."

lesson:
  eyebrow: Как проходит занятие
  title: По одной задаче, прямо в вашем чате.
  lead: Вы рядом, а кнопки нажимает ребёнок. У каждого шага показана карточка такой, какой её в этот момент рисует чат.
  # The steps in the order a lesson takes them, each beside its card.
  steps:
    generating:
      title: Попросите задачу
      text: Напишите «дай новую задачу». MathTrail выбирает тему и сложность, чат пишет задачу, а программа проверяет каждый ответ ещё до того, как задачу увидит ребёнок.
    selected:
      title: Ответ — одной кнопкой
      text: Пять вариантов, от A до E. Нажатие сразу записывает ответ, ещё до всяких объяснений, так что уговорить чат засчитать другой не получится.
    hint:
      title: Застряли? Подсказка, а не ответ
      text: Подсказка показывает, с чего начать, например нарисовать забор поменьше. Ответ остаётся скрытым, пока ребёнок не выберет свой.
    wrong:
      title: Ошибка превращается в урок
      text: За каждым неверным вариантом стоит известная ловушка. После ответа карточка превращается в разбор. Он называет ловушку так, как ошибся ребёнок, например «посчитаны промежутки, а не столбы», и затем разбирает решение по шагам.
    question:
      title: Спросить «почему» своими словами
      text: Когда ответ записан, можно спросить в чате, например «а почему столбов на один больше?», и модель ответит именно про эту задачу.
    progress:
      title: Прогресс, который можно прочитать
      text: "Общий ранг и ранг по каждой теме, повторяющиеся ошибки и что будет дальше, а для вас ещё и разбор: что получается и что стоит развивать."
  # The name of the child the cards show, an invented one, which the first
  # screen picks a task for.
  child: Галт
  # Two messages of the chat beneath a card answered wrong: the adult's
  # question and the model's reply, about the step and to nobody, for the adult
  # to read out to the child. They are the site's words, never the card's.
  chat:
    label: Иллюстрация чата
    adult: Взрослый
    model: Модель
    question: А почему столбов на один больше?
    reply: Если идти вдоль забора слева, каждый промежуток заканчивается столбом, так что 4 промежутка дают 4 столба, а первый столб стоит перед ними всеми. 4 + 1 = 5.

# The task of the lesson: a variant of a reference task, never one word for
# word.
task:
  question: Забор длиной 12 метров. Столбы стоят через каждые 3 метра, включая оба конца. Сколько всего столбов?
  hint: "Начни с забора поменьше: 6 метров, столб через каждые 3 метра. Нарисуй его и посчитай столбы."
  # The trap behind each wrong option, as the card says it once that option
  # is picked: the steps pick one, and the card on the first screen any.
  traps:
    a: Назван шаг между столбами, а не число столбов.
    b: Посчитаны промежутки, а не столбы.
    d: Длина умножена на шаг, а не поделена на него.
    e: Взята длина забора из условия, а столбы не посчитаны.
  # The solution, a sentence for each step the card numbers.
  solution: "12 : 3 = 4 промежутка. У прямого забора со столбами на обоих концах столбов на один больше, чем промежутков. 4 + 1 = 5 столбов."

connect:
  eyebrow: Подключение
  title: Несколько шагов до первой задачи.
  claude:
    pill: Работает сейчас · и на бесплатном тарифе
    # The steps of Claude's own help on custom connectors; the address follows
    # the third.
    steps:
      open: В Claude откройте {connectors}.
      add: Нажмите **+** и выберите **Add custom connector**.
      paste: "Вставьте адрес:"
      sign: "Нажмите **Add**, затем **Connect** и войдите через Google. MathTrail попросит разрешения хранить один файл в вашем Google Диске — профиль ребёнка. Разрешите это на экране Google: без этого файла прогрессу негде храниться."
      chat: "В чате нажмите **+** → **Connectors**, включите MathTrail и напишите: «Давай задачу MathTrail»."
    # Claude's own names for the page, the same in every language.
    connectors: Customize → Connectors
    note: На бесплатном тарифе можно подключить один свой коннектор.
  chatgpt:
    pill: Пока нет в каталоге
    text: Бесплатные аккаунты ChatGPT добавляют приложения только из каталога ChatGPT. Как только MathTrail там появится, найдите его по названию, подключите и войдите через Google. Пока его там нет.
    dev: "А пока приложение можно добавить по адресу в режиме разработчика ChatGPT. Он есть в веб-версии на тарифах Plus, Pro, Business, Enterprise и Education: включите его и добавьте приложение с адресом выше, как {openai}. MathTrail в ChatGPT ещё проверяется."
    openai: описывает OpenAI
  need: Нужен аккаунт Claude или ChatGPT и аккаунт Google; ребёнку — ни того, ни другого.

ask:
  title: Начните с одной задачи.
  lead: Чтобы добавить MathTrail в Claude, хватит пары минут.
  code: Код на GitHub
