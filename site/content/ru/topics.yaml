# The page of the topics, in Russian: the same keys as the English file, in
# the same order.

title: Темы MathTrail
description: Все темы, в которых MathTrail даёт задачи, как они опираются друг на друга и о чём каждая.

hero:
  title: Какие задачи решает ваш ребёнок
  lead: Каждая задача MathTrail относится к одной теме. Здесь все темы, какие в них задачи и как одни темы опираются на другие.
  child: Комета
  caption: Прогресс с рангом по каждой теме, как его показывает чат. Ребёнок и числа — для примера.

map:
  title: Как темы связаны
  lead: "Одни темы опираются на другие: перебор нужен и для принципа Дирихле, и для рыцарей с лжецами. Если ребёнок застрял на трудной теме, полезно вернуться на шаг назад, к той, на которой она держится."
  layers:
    - step: Шаг 1
      name: Основа
      lead: Почти без предварительных знаний.
    - step: Шаг 2
      name: Правила
      lead: Ручное рассуждение становится правилом.
    - step: Шаг 3
      name: Сложные задачи
      lead: Несколько идей нужно держать в голове сразу.
  hint: Наведите на тему или перейдите к ней клавишей Tab — подсветится, на что она опирается и что открывает.
  say: "**{topic}** · сначала: {before} · открывает: {after}"
  foundation: ничего — это основа
  summit: ничего — это вершина
  legend:
    first: Сначала
    topic: Тема
    then: Потом

groups:
  label: Группы тем
  logic: "Рассуждения: предположить, вывести следствие, найти противоречие."
  counting: Посчитать все варианты и не пропустить ни одного.
  time: Часы, дни недели и годы — и что меняется вместе с ними.
  numbers: Числа, в которых важна не скорость счёта, а идея.
  parts: "Целое, разделённое на части: доли, проценты и отношения."
  games: Найти план, который сработает при любом ходе соперника и любом исходе взвешивания.

topics:
  ordering:
    phrase: "Кто выше, старше, быстрее: выстроить всех по порядку по нескольким подсказкам."
    drawing: Аня > Боря > Вика
  knights-and-liars:
    phrase: Одни всегда говорят правду, другие всегда лгут, и по их словам нужно понять, кто есть кто.
    drawing: |
      А: «Я рыцарь»
      Б: «А лжёт»
  enumeration:
    phrase: Выписать все варианты по системе, чтобы ни один не потерялся и не повторился.
    drawing: 12 13 21 23 31 32
  gaps-and-boundaries:
    phrase: "Столбы и пролёты, этажи и лестницы: где прибавить единицу, а где нет."
    drawing: "|--3--|--3--|--3--|"
  clocks:
    phrase: "Сколько прошло времени и который будет час: стрелки, циферблат, переход через полдень."
    drawing: 11:50 + 20 мин = 12:10
  calendar-and-age:
    phrase: Дни недели, месяцы и возраст. Разница в возрасте не меняется, а неделя повторяется.
    drawing: |
      мама 30  Аня 6
      +5 лет   +5 лет
  pigeonhole-principle:
    phrase: Если кроликов больше, чем клеток, в какой-то клетке их окажется хотя бы двое.
    drawing: "[● ●] [●] [●]"
  parity-and-alternation:
    phrase: "Чётное и нечётное, «через одного»: что можно понять, не считая всего."
    drawing: ● ○ ● ○ ● ○
  arithmetic-with-a-trick:
    phrase: "Считать с умом: переставить, сгруппировать и заметить удобное, прежде чем считать."
    drawing: 25 × 7 × 4 = 7 × 100
  weighing-and-pouring:
    phrase: Найти фальшивую монету за наименьшее число взвешиваний или отмерить воду сосудами без делений.
    drawing: |
      [● ● ●] = [● ● ●]
      5 л · 3 л → 4 л
  parts-and-shares:
    phrase: "Половина, треть, четверть: часть от целого и целое по его части."
    drawing: ■ ■ ■ □ = 3/4
  percentages:
    phrase: "Процент — это сотая часть: сколько это в процентах и от чего их считать."
    drawing: 10% от 50 = 5
  ratios-and-sharing:
    phrase: Разделить в отношении 2 к 3 и узнать, сколько приходится на одну часть.
    drawing: "□ □ : □ □ □"
  figures-on-a-grid:
    phrase: "Площадь и периметр по клеткам: разрезать, сложить и посчитать, не пропустив ни одной клетки."
    drawing: |
      +---+---+---+
      |   |   |   |
      +---+---+---+
  divisibility-and-remainders:
    phrase: Делится ли число без остатка, а если нет, то какой остаток.
    drawing: 17 = 5 · 3 + 2
  overlapping-groups:
    phrase: "Некоторые дети ходят сразу в два кружка: как не посчитать их дважды?"
    drawing: ( А ( 3 ) Б )
  winning-strategy:
    phrase: Кто возьмёт последнюю спичку? Ищем позиции, из которых выигрыш гарантирован.
    drawing: |
      ||||| ||||| |||||
      берём от 1 до 3
