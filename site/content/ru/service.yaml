profile:
  title: Файл профиля
  lead: "Один ребёнок — один JSON-файл: не кэш какой-то правды на сервере, а сама правда. У каждого блока есть потолок, который соблюдается при каждой записи, поэтому файл не растёт без предела: обычный укладывается в цель, а у потолков выходит за неё. Прошлые задачи хранятся как отпечатки, а не как текст."
  size: Размер файла
  legend: Какой размер показать
  typical: Обычно
  cap: У потолков
  total: "≈ {kb} КБ"
  kb: "{kb} КБ"
  goal: "цель {kb} КБ"
  segment: "{name} · {typical} / {cap} КБ"
  heads:
    block: Блок
    holds: Что в нём
    writers: Кто пишет
    size: Размер
  blocks:
    fingerprints:
      name: Отпечатки
      holds: До 200 набросков выданных задач для проверки на почти-дубликаты — без текста, темы и даты
    history:
      name: История рейтинга
      holds: Где были θ и δ темы перед каждым недавним ответом, а θ и все темы — в начале каждого из последних 7 дней с ответами
    ratings:
      name: Рейтинги и темы
      holds: "θ и откуда ребёнок начал; по каждой теме: δ, ответы, ловушки, в которые он попадал, освоение и его уровень"
    recent:
      name: Недавние ответы
      holds: Последние 20 ответов и пропусков — и никогда не меньше 5 ответов, которые читает правило
    sealed:
      name: Текущая задача, запечатанная
      holds: Ответ, ловушка за каждым неверным вариантом, решение и решатель — одна непрозрачная строка
    open:
      name: Текущая задача, открытая
      holds: "Что показывает карточка: текст, картинку, пять вариантов, подсказку — и, после ответа, сам ответ"
    request:
      name: Открытый запрос
      holds: "Пока задача пишется: её id, ТЗ, использованные попытки и кто выбрал тему"
    service:
      name: Сервис и ребёнок
      holds: Версия схемы, случайный UUID, ревизия; псевдоним, класс, интересы, заметки; дневные счётчики
  every-write: каждая запись
  note: "Задача, написанная заранее, лежит рядом с текущей и весит примерно столько же. Чего в файле нет: текстов прошлых задач, ответа в открытом виде, пока ребёнок не ответил, ничего, что называет родителя, и ранга — ранги вычисляются при показе. Условной записи у Диска нет, поэтому перед сохранением файл читается ещё раз, и запись отклоняется, если он изменился: две вкладки никогда молча не перезапишут друг друга."
seal:
  title: Запечатано — и на сколько
  lead: "Один механизм делает две работы: запечатывает вход в токены, которые держит чат, и ответ задачи — текущей и написанной заранее — в профиль. В каждую печать вшито её назначение, поэтому access-токен не выдать за refresh-токен, а запечатанный ответ — ни за что другое."
  token:
    title: Устройство токена
    version: версия формата
    purpose: назначение
    purposes:
      c: код
      a: access
      r: refresh
      d: клиент
      s: state
      k: согласие
      t: ответ задачи
    key: id ключа
    key-note: из самого ключа, поэтому смена ключа незаметна
    cipher: шифртекст
    cipher-note: XChaCha20-Poly1305, случайный 192-битный nonce
    note: "Не JWT: никто, кроме сервиса, его не читает, а из непрозрачной строки в лог не утечёт ни одно утверждение."
  life:
    title: Сроки жизни, в логарифмической шкале
    ticks:
      - 1 мин
      - 1 ч
      - 1 день
      - 1 нед
      - 6 мес
    items:
      code:
        name: Код авторизации
        life: 60 с
      signin:
        name: Вход в процессе
        life: 10 мин
      access:
        name: Access-токен
        life: 15 мин
      refresh:
        name: Refresh-токен
        life: 30 дней со сдвигом, не больше 90
      key:
        name: Ключ запечатывания
        life: меняется каждые 90 дней
      approvals:
        name: Одобренные клиенты
        life: 180 дней
    note: Сервер без состояния не может пометить код использованным, поэтому окно для кода сделано маленьким. Прежний ключ после смены ещё принимается, поэтому ни токен, ни запечатанный ответ при смене ключа не пропадают.
