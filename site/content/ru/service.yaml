      title: GitHub
      short: GitHub
  parts:
    adult:
      name: Взрослый
      sub: Родитель или репетитор · тот, кто входит в аккаунт
      about: "Родитель или репетитор. Владеет и аккаунтом чата, и Google-аккаунтом: подключает MathTrail, один раз входит, создаёт профиль, ведёт урок в чате и следит за прогрессом. Единственный, кто входит в аккаунт, и единственный, кто пишет в чат."
    kid:
      name: Ребёнок
      sub: 1–6 класс · без своего входа
      about: 1–6 класс. Решает задачи на карточке, в чате взрослого. Своего входа у него нет.
    model:
      name: Модель хоста
      sub: Пишет задачу, решатель, объяснения
      about: Claude или ChatGPT. Пишет задачу, решатель на Starlark, объяснение за каждым неверным вариантом и самопроверку; ведёт занятие словами там, где карточки не рисуются. Сам MathTrail моделей не вызывает.
    appsrt:
      name: Среда MCP Apps
      sub: Изолированная рамка, в которой живёт карточка
      about: Рисует карточку в изолированной рамке, передаёт ей язык, платформу и размер и пересылает собственные вызовы карточки с токеном хоста — сама карточка токена никогда не видит.
    cimd:
      name: Документ метаданных клиента
      sub: client_id хоста — это HTTPS-адрес
      about: Хост называет себя HTTPS-адресом. MathTrail загружает документ по этому адресу под защитой от SSRF, вместо того чтобы вести реестр клиентов.
    router:
      name: HTTP-маршрутизатор
      sub: /mcp · /oauth/* · /health
      about: "Единственный вход: /health, /mcp, точки OAuth и .well-known. Тайм-ауты, ограничение размера тела, проверка Origin; издатель — собственный домен, на любой другой Host ответ 404."
    authsrv:
      name: Сервер авторизации
      sub: OAuth 2.1 + PKCE, согласие
      about: "MathTrail — сам себе сервер OAuth 2.1 с PKCE: метаданные, свой экран согласия, вход через Google, токены, обновление и отзыв. Всё, что хранил бы сервер с состоянием, запечатано в токены и cookie."
    mcpsrv:
      name: MCP-сервер
      sub: Streamable HTTP, без состояния
      about: "Протокол: Streamable HTTP 2026-07-28, без состояния, на официальном Go SDK. Перечисляет и вызывает инструменты, отдаёт карточку как ресурс ui:// и передаёт модели инструкции с их версией."
    limits:
      name: Лимиты
      sub: По адресу, по аккаунту, за день
      about: Темп по адресу до входа, по аккаунту после него, общий потолок — всё в памяти, — и дневные потолки, которые считаются в профиле. Сверх лимита — простая фраза, которую модель передаст.
    tools:
      name: Инструменты
      about: "Одиннадцать инструментов одного вида: прочитать профиль, посчитать, записать обратно. Большинство вызывает модель; карточка вызывает свои — задачу, ответ, прогресс, форму профиля. В результат никогда не попадает ничего секретного."
    rule:
      name: Правило
      sub: Тема, цель, коридор сложности
      about: "Детерминированно выбирает ТЗ: после ошибки — закрепить ту же тему, иначе — тему, которой не было дольше всех; сложность — из коридора, где шанс успеха 70–85 %."
    rating:
      name: Рейтинги
      sub: θ, δ, β · Эло поверх IRT
      about: P = 0,2 + 0,8·σ(θ + δ − β). Эло обновляется только по верности ответа, с затухающим шагом; шахматная шкала и одиннадцать рангов; тема считается освоенной по осторожной оценке.
    checks:
      name: Проверки
      sub: Что проходит присланная задача
      about: "Что должна пройти присланная задача: структура и пять разных вариантов, буквы языка занятия, разные объяснения, решатель, самопроверка, читаемость, почти-дубликаты и картинка: её формат, подписи по условию и нет ли на ней ответа. О каждой неудаче сообщается сразу."
    solver:
      name: Решатель
      sub: Песочница Starlark, лимит шагов
      about: Запускает программу модели на Starlark, которая перебирает варианты; верным должен выйти ровно один. Лимиты шагов и времени, без сети и файлов.
    content:
      name: Контент
      sub: Каталоги, эталонные задачи, инструкции
      about: "Всё, что встроено в бинарник и не является кодом: каталоги тем, ловушек и навыков, эталонные задачи, схемы, шаблоны решателей, образцы картинок каждого вида и инструкции модели с их версией."
    widget:
      name: Виджет
      sub: Карточка · один HTML-файл
      about: "Карточка: Preact, собранный в один HTML-файл без внешних загрузок, словари языков встроены. Вёрстка работает от 320 px, кнопки — под палец."
    store:
      name: Хранилище
      sub: Профиль и текущая задача
      about: Находит профиль по скрытой метке, сравнивает перед записью, мирит две вкладки, по просьбе родителя восстанавливает файл из закреплённых ревизий Диска — и укладывается в небольшой бюджет вызовов Диска.
    seal:
      name: Запечатывание
      sub: Токены и запечатанный ответ
      about: "Один механизм, две работы: запечатывает вход и токены Google в токены, которые держит хост, а ответ задачи — текущей и написанной заранее — в профиль. Ключи берутся из Secret Manager и сменяются по id ключа."
    logs:
      name: Журналирование
      sub: Сводки, без личных данных
      about: "Одна структурированная сводка на вызов: инструмент, исход, длительность, версия инструкций; попытки и причины отказа — отдельными событиями задачи. Без личных данных, без текста задач, без ответов."
    boot:
      name: Контейнер и конфигурация
      sub: Окружение, версия, остановка
      about: Связывает части и закрывает их в обратном порядке, работает с тайм-аутами и мягкой остановкой, всю конфигурацию читает из окружения — и не запускается в Cloud Run с флагами разработки.
    goauth:
      name: Google OAuth
      sub: Только drive.file
      about: Вход родителя только с областью drive.file, обновление и отзыв. Отзыв любого токена прекращает весь доступ.
    gdrive:
      name: Drive API v3
      sub: Единственное долговременное хранилище
      about: "Единственное долговременное хранилище: один JSON-профиль в видимой папке MathTrail на Диске родителя, читается и пишется собственным токеном родителя."
    sm:
      name: Secret Manager
      sub: Ключи запечатывания, секрет клиента
      about: "Ключи запечатывания и секрет клиента Google: закреплённые версии, читаются один раз при старте экземпляра."
    ar:
      name: Artifact Registry
      sub: Образ, по дайджесту
      about: Образ каждой ревизии, по дайджесту; старые образы удаляются.
    clog:
      name: Cloud Logging
      sub: Куда попадает stdout
      about: Куда попадает stdout сервиса. Строки, по которым считаются дети, хранятся 62 дня в отдельном бакете.
    bq:
      name: BigQuery → Data Studio
      sub: Счётчики хранятся годами
      about: Счётчики использования хранятся годами и пересчитываются каждую ночь; ни в одной таблице нет имени, под которым считается ребёнок. Закрытый отчёт и публичный — без групп меньше десяти детей.
    ga:
      name: Actions
      sub: Сборка, проверки, деплой
      about: Сборка, проверки, публикация образа и деплой через Workload Identity Federation — без ключей сервисных аккаунтов.
    pages:
      name: Pages
      sub: Этот сайт, политика и условия
      about: "Этот сайт: страницы тем, политика конфиденциальности и условия, на которые ссылается экран согласия."
