      short: MathTrail · инструменты
    core:
      title: Чистые вычисления — без сети
      short: MathTrail · чистые вычисления
    around:
      title: Вокруг ядра
      short: MathTrail · вокруг ядра
    account:
      title: Google-аккаунт родителя
      short: Google-аккаунт родителя
    cloud:
      title: Google Cloud
      short: Google Cloud
