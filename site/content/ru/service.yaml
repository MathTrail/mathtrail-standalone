flow:
  title: Занятие, вызов за вызовом
  lead: Модель и карточка обращаются к одним и тем же инструментам и опираются на один источник правды — файл профиля на Диске родителя. Чтобы занятие шло, им не нужно ничего сообщать друг другу.
  legend: Сценарий
  scenarios:
    task: Задача
    answer: Ответ
    signin: Вход
  kinds:
    call: вызов
    reply: его ответ
    host: внутри хоста
  actors:
    adult: Взрослый
    kid: Ребёнок
    card: Карточка
    model: Модель хоста
    service: MathTrail
    drive: Диск
    browser: Браузер родителя
    host: Хост
    google: Google
  task:
    rows:
      - «новую задачу, пожалуйста»
      - next_task
      - "Хост рисует карточку, как только начинается вызов: «Готовим следующую задачу…»"
      - лимиты · правило выбирает тему, уровень и сложность
      - записать открытый запрос
      - запрос открыт — забери пакет
      - get_package
      - ТЗ · 3 эталонные задачи · ловушки · шаблоны · образцы картинок
      - Модель пишет задачу, решатель на Starlark и самопроверку
      - submit_task — до 3 попыток
      - проверки · решатель должен найти ровно один верный вариант
      - задача становится текущей, ответ запечатан
      - read_task — карточка спрашивает каждые 4 с
      - текст · картинка · пять вариантов · подсказка — без ответа
    caption: "Каждый вызов ещё и читает профиль с Диска — эти чтения опущены. Карточка, которая ждёт, пакета не видит: у эталонных задач в нём есть ответы. Пока ребёнок решает, модель пишет следующую задачу заранее (prepare_task), и когда попросят другую, next_task сразу кладёт её на новую карточку — без этого ожидания."
  answer:
    rows:
      - нажимает C
      - submit_answer — ход чата не тратится
      - только первый ответ · печать вскрывается сейчас · θ и δ меняются только по верности
      - записать рейтинги и историю
      - верно или нет · ловушка за C · решение · рейтинг до → после
      - ui/update-model-context — одна строка о том, что произошло
      - «почему не 6?» — вопрос в чате
      - объясняет, начиная с ловушки
    caption: Нажатие записывает ответ раньше, чем что-либо объясняется. Если сообщение хоста модели потеряется, ребёнок всё равно увидит результат, а модель наверстает при следующем вызове.
  signin:
    rows:
      - POST /mcp, без токена
      - 401 · где лежат метаданные
      - открывает /oauth/authorize · PKCE S256
      - authorize
      - "Свой экран согласия: какой клиент и куда он вернёт родителя"
      - вход в Google · только drive.file
      - обратно, с кодом Google
      - /oauth/callback
      - обменять код
      - /about — чей это Диск?
      - id пользователя = HMAC аккаунта Диска · токены Google запечатаны в наш код
      - 302 · code = mt1.c.…
      - передаёт код обратно
      - /oauth/token · код + verifier
      - access 15 мин · refresh 30 дней
    caption: "Родитель входит один раз. Сервис ничего из этого обмена не хранит: запрос едет в запечатанном state, токены Google — в запечатанном коде."
  machine:
    title: Текущая задача как конечный автомат
    lead: Каждое правило «только один раз» — это поле в профиле, которое проверяется внутри того же чтения, расчёта и записи. Больше ничто ничего не помнит.
    forward:
      - ТЗ собрано
      - запечатана, выдана
      - записан один раз
    turns:
      - отказ, попытки ещё есть — не больше трёх на запрос
      - три отказа или 15 минут с открытия запроса; лимит задач не тратится, а три отказа считаются неудачным запросом дня
      - «Другая задача» до ответа — пропуск записан, рейтинг не тронут
      - любой следующий ответ — из второй вкладки или от модели — возвращает первый результат и ничего не пишет
      - следующая задача, на новой карточке; отвеченная больше не текущая
      - следующая задача написана заранее — next_task сразу кладёт её на новую карточку, минуя requested
      - печать уже не вскрыть — прошло две смены ключа; ничего не записано
state:
  title: Где живёт состояние
  lead: "Всё, что сервер с состоянием держал бы в базе данных, хранит кто-то другой: в запечатанном токене, который держит чат, в cookie в браузере родителя или на Диске самого родителя. Перезапустите сервис или запустите вторую копию — ничего не потеряется."
  self:
    label: Сам MathTrail
    value: Ничего
    note: Ни аккаунтов, ни сессий, ни регистраций, ни токенов Google. Каждый запрос несёт всё, что ему нужно.
  stores:
    tokens:
      title: Хранилище токенов чата
      sub: Запечатанные токены, непрозрачные для хоста
      rows:
        access:
          name: Access-токен
          life: 15 мин
        refresh:
          name: Refresh-токен
          life: 30 дней, ≤ 90
      note: Внутри запечатаны токены Google, непрозрачный id пользователя для лимитов и страна входа.
    browser:
      title: Браузер родителя
      sub: Две cookie, без сессии
      rows:
        approvals:
          name: Одобренные клиенты
          life: 180 дней
        csrf:
          name: Защита входа (CSRF)
          life: 10 мин
      note: Если их потерять — лишний экран согласия или вход заново.
    drive:
      title: Диск родителя
      sub: Единственное, что хранится долго
      rows:
        profile:
          life: пока не удалят
      note: Профиль, рейтинги и текущая задача — с запечатанным ответом. Родитель может открыть файл, Диск хранит его историю.
    secrets:
      title: Secret Manager
      sub: Читается один раз, при старте экземпляра
      rows:
        keys:
          name: Ключи запечатывания
          sub: при смене ключа прежний ещё принимается
          life: 90 дней
        client:
          name: Секрет клиента Google
