title: Как устроен сервис
description: "Как устроен MathTrail изнутри: части сервиса и их связи, занятие вызов за вызовом, где живёт состояние, файл профиля на Диске родителя и что в нём запечатано."
hero:
  badge: Для технических специалистов
  title: Как устроен сервис
  lead: "MathTrail стоит между чатом, которым семья уже пользуется, и Google Диском родителя. Каждую задачу пишет модель чата, а сервис решает, дойдёт ли она до ребёнка. Это одна программа: своих моделей она не вызывает и между запросами ничего не хранит."
  chips:
    - Один бинарник на Go в Cloud Run
    - Без состояния
    - Без базы данных
    - Без своих вызовов LLM
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail в трёх уровнях
  client:
    title: Чат-клиент
    tag: 1 · клиент
    others: другие хосты MCP Apps
    note: Модель чата пишет задачу, карточка показывает её ребёнку.
  mcp: "{via} · вызовы инструментов по HTTPS"
  cloud:
    title: MathTrail в Google Cloud
    tag: 2 · среда выполнения
    sub: Cloud Run · один бинарник на Go · без состояния
    core: Ядро — чистые вычисления
    around: "Вокруг него: OAuth, MCP-сервер, карточка, запечатывание, лимиты."
  drive: "{via} · с собственным токеном родителя"
  storage:
    title: Google Диск
    tag: 3 · хранилище
    note: Один файл на ребёнка, на Диске самого родителя, — единственное, что хранится долго.
map:
  title: Карта
  lead: Кто с кем говорит. Ни ребёнок, ни взрослый не обращаются к MathTrail напрямую — они говорят с чат-хостом. Всё в среднем блоке — части одного процесса, а не отдельные сервисы. Выберите любую часть, чтобы увидеть, что она делает и с чем связана.
  legend: Части сервиса
  whole: Ничего не выбрано
  hint: "Выберите часть карты: всё, с чем она связана, останется ярким, остальное потускнеет."
  linked: Связана с
  reset: Сбросить ✕
