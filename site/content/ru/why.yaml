# The page "Why", for a parent, in Russian: why olympiad maths is worth a
# child's time, how long people have learned it, what research has found about
# it, how it differs from a school lesson, what a parent can do, how MathTrail
# goes about it, and why it is no ordinary app. The grades, the topics' names
# and the card's own words are not here: they are the catalog's numbers and the
# widget's words. The card's options, its drawing, the history's pictures and
# the works the page cites are the site's data; a finding here says what its
# work found, no more.

title: Зачем олимпиадная математика
description: Зачем ребёнку олимпиадные задачи, что о них говорят исследования и как родителю помочь с MathTrail.

# The label of the note that says plainly what the page does not promise.
honest: Честно

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: Забор длиной 12 метров. Столбы стоят через каждые 3 метра, включая оба конца. Сколько всего столбов?
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: Посчитаны промежутки, а не столбы.
  # The solution, a sentence for each step the card numbers.
  solution: "12 : 3 = 4 промежутка. У прямого забора со столбами на обоих концах столбов на один больше, чем промежутков. 4 + 1 = 5 столбов."

hero:
  title: Зачем ребёнку олимпиадная математика
  lead: Школа учит решать задачи по образцу. Олимпиадные задачи учат думать там, где образца нет. До {last}-го класса подготовить к ним ребёнка может сам родитель — MathTrail сделан именно для этого.
  free: Бесплатно
  open: Открытый код
  school:
    label: Школьный пример
    text: Нужно знать, как делить.
    sum: "12 : 3 = 4"
  olympiad:
    label: Олимпиадная задача
    answer: "Ответ: {answer}"
    trap: "Ловушка: 4 — это промежутки, а не столбы"
    text: Нужно понять, что происходит.
  caption: Числа те же, а думать нужно по-другому.

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: Думать без образца учатся больше двух тысяч лет
  lead: Олимпиадные задачи появились не вчера. Найти решение, которого никто не показал, и объяснить, почему оно верно, учились в разных странах и в разные века, и каждое поколение передавало это умение следующему.
  quote: «В геометрии нет царской дороги».
  quoted: Евклид — царю Птолемею, который спросил, нельзя ли выучить геометрию попроще, чем по «Началам». Так об этом рассказывает Прокл, V век.
  # What a screen reader calls the choice of a picture.
  choice: Картинки истории
  eras:
    - label: Древний мир · до VI века
      title: Доказательства и задачники
      text: "Греки стали доказывать, почему правило верно. В Китае собрали «Математику в девяти книгах»: 246 задач с решениями. В Индии придумали запись чисел с нулём, которой мы пользуемся до сих пор."
    - label: Средние века и Новое время · IX–XIX вв.
      title: Задача как вызов
      text: В Багдаде аль-Хорезми написал книгу, от названия которой пошло слово «алгебра». В Италии математики устраивали поединки задачами, а в Японии вешали задачи на дощечках в храмах.
    - label: Конец XIX — XX век
      title: Задачи для всех детей
      text: "Учиться стали все дети, а для самых любопытных появились кружки и олимпиады: в Венгрии — с 1894 года, в Ленинграде — с 1934-го."
    - label: Сегодня
      title: Наставник — у каждого ребёнка
      text: "Раньше личный наставник был у единиц: Александра Македонского учил Аристотель. Теперь такой репетитор может быть у каждого. Компаньон в тренере MathTrail не даёт готового ответа, а наводящими вопросами помогает дойти до решения самому, как это делали великие учителя прошлого."
      link: Посмотреть тренера →
  pictures:
    athens:
      place: Греция
      alt: "Фрагмент фрески: седой учёный склонился над доской и чертит циркулем, вокруг него четверо учеников."
      caption: Евклид чертит на доске циркулем, а ученики следят. По другой версии, это Архимед. Фрагмент фрески Рафаэля «Афинская школа», 1509–1511.
    confucius:
      place: Китай
      alt: "Картина: учитель сидит среди учеников под открытым небом, они слушают и спорят."
      caption: Конфуций с учениками. Счёт был одним из «шести искусств», которые должен знать образованный человек. Живопись XIX века, автор неизвестен.
    aryabhata:
      place: Индия
      alt: "Белая статуя: учёный в накидке протягивает руку вперёд."
      caption: "Ариабхата, индийский математик и астроном V века. Каким он был, неизвестно: это современный памятник в Пуне."
    istanbul:
      place: Исламский мир
      alt: "Миниатюра: учёные в тюрбанах работают с глобусом, угломерами и книгами."
      caption: Астрономы и математики за работой в Стамбульской обсерватории Такиюддина. Османская миниатюра конца XVI века.
    pacioli:
      place: Италия
      alt: "Портрет: монах-математик чертит указкой на доске с надписью Euclides, рядом стоит ученик, а над столом висит стеклянный многогранник."
      caption: Математик Лука Пачоли с учеником. На краю доски с чертежом написано «Euclides». Портрет 1495 года, приписывается Якопо де Барбари.
    sangaku:
      place: Япония
      alt: Деревянная дощечка с цветными чертежами кругов и столбцами иероглифов.
      caption: "Сангаку — дощечка с задачами по геометрии в святилище Конно Хатиман-гу, Токио, 1859 год. Фото: Momotarou2012, CC BY-SA 3.0."
