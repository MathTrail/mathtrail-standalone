# The page "Why", for a parent, in Russian: why olympiad maths is worth a
# child's time, what research has found about it, how it differs from a school
# lesson, what a parent can do, how MathTrail goes about it, and why it is no
# ordinary app. The grades, the topics' names and the card's own words are not
# here: they are the catalog's numbers and the widget's words. The card's
# options, its drawing and the works the page cites are the site's data; a
# finding here says what its work found, no more.

title: Зачем олимпиадная математика
description: Зачем ребёнку олимпиадные задачи, что о них говорят исследования и как родителю помочь с MathTrail.

# The label of the two notes that say plainly what the page does not promise.
honest: Честно

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: Забор длиной 12 метров. Столбы стоят через каждые 3 метра, включая оба конца. Сколько всего столбов?
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: Посчитаны промежутки, а не столбы.
  # The solution, a sentence for each step the card numbers.
  solution: "12 : 3 = 4 промежутка. У прямого забора со столбами на обоих концах столбов на один больше, чем промежутков. 4 + 1 = 5 столбов."

