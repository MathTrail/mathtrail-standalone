research:
  title: Что говорят исследования
  lead: Олимпиадные задачи решают больше ста лет, но аккуратных исследований того, что они дают детям, немного. Вот четыре из них.
  # Each finding under a tag of where and whom, a short line in large letters
  # with a line under it, and the words of the small drawing under its text.
  findings:
    rebholz2022:
      tag: Германия · 3–4 класс
      big: Курс задач
      small: и результат выше в двух местах
      title: Подготовка видна и в школе
      text: В Германии третье- и четвероклассники прошли курс олимпиадных задач. На математической олимпиаде они выступили заметно лучше детей, которые пришли на неё без курса, а четвероклассники к тому же лучше написали школьную контрольную по математике. На курс их отбирали учителя.
      mark:
        - на олимпиаде
        - в школьной контрольной
    biondi2012:
      tag: Бразилия · 2009
      big: 19 млн
      small: школьников участвовали за один год
      title: У олимпиадных школ выше баллы по математике
      text: Математическая олимпиада государственных школ Бразилии открыта каждому ученику, в 2009 году в ней участвовали 19 миллионов. У школ-участниц результаты девятиклассников в национальном тесте по математике выше, и тем выше, чем больше лет школа участвует.
      mark: больше лет участия — выше баллы
    agarwal2020:
      tag: Международная олимпиада
      big: IMO
      small: чем выше результат, тем дальше в науке
      title: Сильные олимпиадники далеко идут в науке
      text: Чем выше школьник выступил на Международной математической олимпиаде, тем чаще он потом защищал диссертацию, публиковал исследования, получал цитирования и высшие премии в математике.
      mark:
        - диссертация
        - публикации
        - цитирования
        - высшие премии
    nunes2007:
      tag: Великобритания · 6 лет
      big: 16 месяцев
      small: логика шестилеток предсказала успехи в математике
      title: Рассуждать учатся с шести лет
      text: То, как шестилетки рассуждают логически, предсказывало их успехи в математике через 16 месяцев. Дети, с которыми занимались такими рассуждениями, продвинулись в математике дальше тех, с кем не занимались.
      mark:
        from: 6 лет
        to: +16 месяцев

school:
  title: Школа и олимпиада учат разному
  lead: "Это не упрёк школе: у неё другая задача. Но умение искать решение без готового способа само не появляется, его нужно тренировать."
  lesson: Обычный урок
  olympiad: Олимпиадная задача
  # Above the rows, an example of each: a school sum with its answer left
  # blank, and the fence in short, with its posts.
  example: Пример
  sum: "12 : 3 ="
  done: Способ показали на уроке, осталось его повторить.
  fence: Забор длиной 12 м, столбы через каждые 3 м, включая оба конца. Сколько столбов?
  found: "Готового способа нет, его нужно найти: 4 промежутка, а столбов на один больше, то есть 5."
  rows:
    shape:
      label: Как устроена задача
      lesson: Показан способ — повтори его на похожих примерах
      olympiad: Готового способа нет — его нужно найти
    valued:
      label: Что ценится
      lesson: Посчитать быстро и без ошибок
      olympiad: Понять, что происходит, и объяснить почему
    mistake:
      label: Что значит ошибка
      lesson: Минус балл
      olympiad: Подсказка, где рассуждение свернуло не туда
    teaches:
      label: Чему учит
      lesson: Пользоваться известным инструментом
      olympiad: Придумывать, когда инструмента нет

time:
  title: Почему в школе на это нет времени
  # Each card with the words of the small drawing at its foot.
  cards:
    syllabus:
      title: Программа на весь класс
      text: Учитель должен довести до стандарта весь класс, и на задачи сверх программы часов почти не остаётся.
      lesson: Урок
      length: 45 минут
      all: программа для всех
      extra: задачи сверх неё
    answer:
      title: Проверяют ответ, а не мысль
      text: Контрольная видит только итог, а разбирать, как ребёнок рассуждал и где именно ошибся, обычно некогда.
      steps: ход решения — не смотрят
      answer: "Ответ: {answer}"
    circle:
      title: Кружок есть не везде
      text: Олимпиадный кружок есть не в каждой школе, а ближайший может оказаться далеко или брать только старших.
      none: нет
      circle: кружок

parent:
  title: Подготовить ребёнка может родитель
  note: MathTrail не заменяет учителя олимпиадной математики — сильный кружок и тренер дадут больше. Но до {last}-го класса подготовить ребёнка к олимпиаде можно и самому.
  unneeded:
    title: Вам не нужно
    items:
      - Диплом математика
      - Знать решения заранее
      - Искать и проверять задачи
  taken:
    title: MathTrail берёт на себя
    items:
      - задачи
      - ответы
      - разборы ошибок
      - подбор уровня
  needed:
    title: Что нужно от вас
    items:
      - title: Интерес ребёнка
        text: Олимпиадная задача — головоломка, а не контрольная. Ребёнку должно быть любопытно, а не страшно ошибиться.
      - title: Объяснить, зачем это
        text: Не «чтобы получить пятёрку», а чтобы научиться придумывать, когда никто не показал как.
      - title: Ваше время и интерес
        text: "Посидите рядом с ребёнком: лучше понемногу и регулярно, чем много за раз. Ваш интерес к задаче заразителен."
  # Three moments of a lesson, each with what the child says and what the
  # parent might answer; the letters stand for who speaks.
  explain:
    title: Как объяснить ребёнку, зачем это
    lead: Три частые ситуации и что можно ответить. Р — ребёнок.
    child: Р
    you: Вы
    talks:
      why:
        moment: Спрашивает «зачем?»
        child: Зачем мне эти задачи? Их же не задавали.
        you: "Это как загадка: ответ спрятан, и его можно найти."
      wrong:
        moment: Ошибается
        child: Я опять неправильно…
        you: Здесь можно ошибаться — ошибка показывает, где подумать ещё.
      right:
        moment: Ответ верный
        child: Готово! Ответ — пять.
        you: Самое интересное — не ответ, а то, как к нему прийти.

thinking:
  title: Как MathTrail учит думать
  lead: Не количеством задач, а тем, что происходит вокруг каждой из них.
  points:
    - title: Одна задача — одна идея
      text: Каждая задача относится к одной теме, например «{enumeration}», «{parity}» или «{knights}», а темы складываются в карту от простых к сложным.
    - title: Задача по силам
      text: У каждой темы свой рейтинг, и по нему MathTrail выбирает тему и сложность следующей задачи. Класс задаёт только старт.
    - title: Ошибка — это диагноз
      text: За каждым неверным вариантом стоит названная ловушка. Разбор начинается с того, как рассуждал ребёнок, а не с правильного ответа.
    - title: Подсказка вместо ответа
      text: Ребёнок может открыть подсказку на карточке, а взрослый может спросить в чате словами ребёнка, например «а почему не 6?». Модель ответит именно про эту задачу.
  topics: Посмотреть темы →
  # The name of the child the card on this page shows, an invented one.
  child: Комета
  caption: Карточка, как её показывает чат после неверного ответа. Ребёнок и числа — для примера.
  # Two messages of the chat beneath the card: the adult's question and the
  # model's reply, about the step and to nobody, for the adult to read out to
  # the child. They are the site's words, never the card's.
  chat:
    label: Иллюстрация разговора в чате
    adult: Взрослый
    model: Модель
    question: А почему не 6?
    reply: Шесть получится, если один столб посчитать дважды. Если идти вдоль забора слева направо, каждый промежуток заканчивается столбом, значит, 4 промежутка — это 4 столба, а самый первый столб стоит перед ними. 4 + 1 = 5.

app:
  title: Почему это не очередное приложение
  lead: Исследователи разобрали приложения, в которые играют дети 3–5 лет, и примерно в двух третях нашли приёмы, удерживающие ребёнка в игре подольше ({source}). MathTrail устроен иначе, и это можно проверить.
  # A make-believe app of the kind that keeps a child at the screen, every
  # trick of it, and what MathTrail has of them.
  bait:
    coins: 12 450
    gems: "87"
    timer: 03:59 до бонуса
    cheer: Ты чемпион!!!
    praise: Ты решил 1 пример из 1. Невероятно!
    chest: Открой сундук!
    hat: Шапка дракона · 990 ₽
    premium: Купи премиум — ×2 монеты!
    caption: Узнали? В MathTrail ничего этого нет.
  # Each card with the short things at its foot that show what it says.
  cards:
    checked:
      title: Каждую задачу проверяет программа
      text: Модель пишет задачу и программу-решатель. Сервер запускает решатель в изолированной песочнице и проверяет, что верный вариант ровно один, ответ сходится, текст по силам классу и задача не повторяет прошлые. Задача, которая не прошла проверку, до ребёнка не дойдёт.
      checks:
        - один ответ
        - сходится
        - по силам
        - не повтор
      fails: не прошла → не дойдёт
    free:
      title: Бесплатно — и понятно почему
      text: У MathTrail нет своей нейросети. Задачу пишет модель вашего чата в рамках вашей подписки, и бесплатный план Claude тоже подходит. Серверу почти не за что платить, поэтому нет подписок, рекламы и закрытых тем.
      price: 0 ₽
      none:
        - подписки
        - реклама
        - закрытые темы
    data:
      title: Данные остаются у вас
      text: Профиль ребёнка — файл в вашем Google Диске. Запечатаны только ответ и решение текущей задачи, чтобы их нельзя было подсмотреть. Сервер между запросами ничего не хранит и ничего не продаёт.
      # After the name of the profile's file.
      where: ваш Google Диск
      server: "на сервере: ничего"
    screen:
      title: Ничего, что держит у экрана
      text: Ни монет, ни сундуков, ни таймеров, ни рекламы. Задача решена — чат можно закрыть и обсудить её за ужином.
      none:
