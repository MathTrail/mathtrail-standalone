  parts:
    adult:
      name: Pessoa adulta
      sub: Mãe, pai ou docente · quem faz login
      about: "Mãe, pai ou docente. É titular tanto da conta do chat quanto da Conta do Google: conecta o MathTrail, faz login uma vez, cria o perfil, conduz a aula no chat e acompanha o progresso. É a única pessoa que faz login e a única que digita."
    kid:
      name: Criança
      sub: 1º–6º ano · sem login próprio
      about: Do 1º ao 6º ano. Resolve os problemas no cartão, no chat da pessoa adulta. Não tem login próprio.
    model:
      name: O modelo do host
      sub: Escreve o problema, o resolvedor, as explicações
      about: O Claude ou o ChatGPT. Escreve o problema, um resolvedor em Starlark, uma explicação para cada alternativa errada e uma autoverificação; conduz a aula em palavras onde não se desenham cartões. O próprio MathTrail não chama nenhum modelo.
    appsrt:
      name: Ambiente de execução de MCP Apps
      sub: O frame isolado em que o cartão vive
      about: Desenha o cartão em um frame isolado, passa a ele o idioma, a plataforma e o tamanho, e repassa as chamadas do próprio cartão com o token do host — o cartão em si nunca vê o token.
    cimd:
      name: Documento de metadados do cliente
      sub: O client_id do host é um endereço HTTPS
      about: O host se identifica por um endereço HTTPS. O MathTrail busca o documento nesse endereço, com proteção contra SSRF, em vez de manter um cadastro de clientes.
    router:
      name: Roteador HTTP
      sub: /mcp · /oauth/* · /health
      about: "A única entrada: /health, /mcp, os endpoints do OAuth e .well-known. Tempos limite, um tamanho máximo para o corpo da requisição, uma verificação de Origin; o emissor é o próprio domínio do serviço, e qualquer outro Host recebe um 404."
    authsrv:
      name: Servidor de autorização
      sub: OAuth 2.1 + PKCE, consentimento
      about: "O MathTrail é, ele mesmo, um servidor OAuth 2.1 com PKCE: metadados, uma tela de permissão própria, login com o Google, tokens, renovação e revogação. Tudo o que um servidor com estado guardaria vai selado em tokens e cookies."
    mcpsrv:
      name: Servidor MCP
      sub: Streamable HTTP, sem estado
      about: "O protocolo: Streamable HTTP 2026-07-28, sem estado, sobre o SDK oficial de Go. Lista e chama as ferramentas, serve o cartão como recurso ui:// e entrega ao modelo as instruções, com a versão delas."
    limits:
      name: Limites
      sub: Por endereço, por conta, por dia
      about: Um ritmo por endereço antes do login e por conta depois dele, e um teto geral, tudo em memória — depois, os tetos diários, que o perfil conta. Passado um limite, uma frase simples que o modelo repassa.
    tools:
      name: Ferramentas
      about: "Doze ferramentas com o mesmo formato: ler o perfil, calcular, gravar de volta. O modelo chama a maioria; o cartão chama as suas — para o problema, a resposta, o progresso e o formulário do perfil. Nada secreto jamais entra em um resultado."
    rule:
      name: A regra
      sub: Tema, meta, corredor de dificuldade
      about: "Escolhe o briefing de forma determinística: depois de um erro, o mesmo tema, para consolidá-lo; senão, o tema que está há mais tempo sem aparecer; a dificuldade, do corredor em que a chance de acerto é de 70–85%."
    rating:
      name: Pontuações
      sub: θ, δ, β · Elo sobre TRI
      about: P = 0,2 + 0,8·σ(θ + δ − β). O Elo se move só pelo acerto ou erro da resposta, com um passo que diminui; uma escala de xadrez e onze etapas; um tema conta como dominado por uma estimativa cautelosa.
    checks:
      name: Verificações
      sub: Em que um problema enviado precisa passar
      about: "Um problema enviado precisa passar em tudo isto: a estrutura e cinco alternativas diferentes, as letras do idioma da aula, explicações distintas, o resolvedor, a autoverificação, a legibilidade, as quase repetições e o desenho: o formato, os rótulos confrontados com o enunciado e nenhuma resposta escrita nele. Todas as falhas são informadas de uma só vez."
    solver:
      name: Resolvedor
      sub: Sandbox Starlark, limite de passos
      about: Executa o programa em Starlark do modelo, que testa as alternativas; exatamente uma deve sair correta. Limites de passos e de tempo, sem rede e sem arquivos.
    content:
      name: Conteúdo
      sub: Catálogos, problemas de referência, instruções
      about: "Tudo o que vem embutido no binário e não é código: os catálogos de temas, armadilhas e habilidades, os problemas de referência, os esquemas, os modelos de resolvedor, um exemplo de cada tipo de desenho e as instruções do modelo, com a versão delas."
    widget:
      name: Widget
      sub: O cartão · um arquivo HTML
      about: "O cartão: Preact compilado em um único arquivo HTML que não carrega nada de fora, com os dicionários dos idiomas dentro. O layout funciona a partir de 320 px, e os botões são fáceis de tocar com o dedo."
    store:
      name: Armazenamento
      sub: O perfil e o problema atual
      about: Encontra o perfil por uma marca oculta, compara antes de gravar, concilia duas abas, restaura o arquivo a partir das revisões fixadas do Drive quando a pessoa adulta pede — e se mantém dentro de um pequeno orçamento de chamadas ao Drive.
    seal:
      name: Selagem
      sub: Tokens e a resposta selada
      about: "Um mecanismo, duas funções: sela o login e os tokens do Google dentro dos tokens que o host guarda, e a resposta de um problema — a do problema atual e a do que foi escrito com antecedência — dentro do perfil. As chaves vêm do Secret Manager e são rotacionadas pelo id da chave."
    logs:
      name: Registro
      sub: Resumos, sem dados pessoais
      about: "Um resumo estruturado por chamada: a ferramenta, o resultado, a duração, a versão das instruções; as tentativas e os motivos de uma recusa, como eventos do problema. Sem dados pessoais, sem texto dos problemas, sem respostas."
    boot:
      name: Contêiner e configuração
      sub: Ambiente, versão, encerramento
      about: Liga as partes entre si e as fecha em ordem inversa, trabalha com tempos limite e um encerramento controlado, lê toda a configuração do ambiente — e se recusa a iniciar no Cloud Run com opções de desenvolvimento ligadas.
    goauth:
      name: Google OAuth
      sub: Só drive.file
      about: O login da pessoa adulta, só com o escopo drive.file, a renovação e a revogação. Revogar qualquer token encerra todo o acesso.
    gdrive:
      name: Drive API v3
      sub: O único armazenamento de longo prazo
      about: "O único armazenamento de longo prazo: um perfil JSON em uma pasta MathTrail visível no Drive da família, lido e gravado com o próprio token da família."
    sm:
      name: Secret Manager
      sub: Chaves de selagem, a chave secreta do cliente
      about: "As chaves de selagem e a chave secreta do cliente do Google: versões fixadas, lidas uma vez quando uma instância inicia."
    ar:
      name: Artifact Registry
      sub: A imagem, por digest
      about: A imagem de cada revisão, por digest; as imagens antigas são excluídas.
    clog:
      name: Cloud Logging
      sub: Para onde vai o stdout
      about: Para onde vai o stdout do serviço. As linhas pelas quais as crianças são contadas ficam guardadas por 62 dias em um bucket próprio.
    bq:
      name: BigQuery → Data Studio
      sub: Contagens guardadas por anos
      about: As contagens de uso ficam guardadas por anos e são recontadas toda noite; nenhuma tabela guarda o nome sob o qual uma criança é contada. Um relatório privado e um público, que não mostra nenhum grupo de menos de dez crianças.
    ga:
      name: Actions
      sub: Build, verificações, implantação
      about: O build, as verificações, a publicação da imagem e a implantação pela Federação de identidade da carga de trabalho — sem chaves de contas de serviço.
    pages:
      name: Pages
      sub: Este site, a política e os termos
      about: "Este site: as páginas dos temas, e a política de privacidade e os termos de uso, para onde a tela de permissão aponta."
