flow:
  title: Uma aula, chamada por chamada
  lead: O modelo e o cartão chamam as mesmas ferramentas e se apoiam em uma única fonte da verdade — o arquivo do perfil no Drive da família. Para a aula seguir, eles não têm nada a dizer um ao outro.
  legend: Cenário
  scenarios:
    task: Problema
    answer: Resposta
    signin: Login
  kinds:
    call: uma chamada
    reply: a resposta dela
    host: dentro do host
  actors:
    adult: Pessoa adulta
    kid: Criança
    card: Cartão
    model: Modelo do host
    service: MathTrail
    drive: Drive
    browser: Navegador da família
    host: Host
    google: Google
  task:
    rows:
      - “um problema novo, por favor”
      - next_task
      - "O host desenha o cartão assim que a chamada começa: “Preparando o próximo problema…”"
      - limites · a regra escolhe o tema, o nível e a dificuldade
      - gravar o pedido aberto
      - o pedido está aberto — busque o pacote
      - get_package
      - briefing · 3 problemas de referência · armadilhas · modelos de resolvedor · exemplos de desenhos
      - O modelo escreve o problema, um resolvedor em Starlark e uma autoverificação
      - submit_task — até 3 tentativas
      - verificações · o resolvedor deve encontrar exatamente uma alternativa correta
      - o problema passa a ser o atual, com a resposta selada
      - read_task — o cartão pergunta a cada 4 s
      - texto · desenho · cinco alternativas · dica — sem a resposta
    caption: "Toda chamada também lê o perfil do Drive — essas leituras foram omitidas. O cartão que espera nunca vê o pacote: os problemas de referência do pacote trazem as respostas. Enquanto a criança resolve, o modelo escreve o próximo problema com antecedência, com prepare_task, e quando outro é pedido, next_task o coloca em um cartão novo na hora — sem esta espera."
  answer:
    rows:
      - aperta C
      - submit_answer — o chat não gasta nenhum turno
      - só a primeira resposta · o selo é aberto agora · θ e δ se movem só pelo acerto ou erro
      - gravar as pontuações e o histórico
      - certa ou não · a armadilha por trás de C · o desenho da solução · os passos · a pontuação antes → depois
      - O cartão vira a análise da resposta, no lugar do problema
      - ui/update-model-context — uma linha, lida com a próxima mensagem da pessoa adulta
      - “por que um poste a mais?”
      - responde sobre este mesmo problema, completando o cartão
    caption: Apertar a alternativa registra a resposta antes de qualquer explicação, e o cartão vira na hora a análise da resposta. O chat não gasta nenhum turno, e o modelo não desenha nada. Ele lê a linha do cartão com a próxima mensagem da pessoa adulta e responde a uma pergunta sobre o problema sem recontar o que o cartão mostra. Se a linha que o host envia ao modelo se perder, o modelo se atualiza na sua próxima chamada.
  signin:
    rows:
      - POST /mcp, sem token
      - 401 · onde estão os metadados
      - abre /oauth/authorize · PKCE S256
      - authorize
      - "Uma tela de permissão própria: qual cliente, e para onde ele vai devolver a pessoa adulta"
      - login com o Google · só drive.file
      - de volta, com o código do Google
      - /oauth/callback
      - trocar o código
      - /about — de quem é este Drive?
      - id de usuário = HMAC da conta do Drive · os tokens do Google selados no nosso código
      - 302 · code = mt1.c.…
      - devolve o código
      - /oauth/token · código + verificador
      - acesso 15 min · atualização 30 dias
    caption: "A pessoa adulta faz login uma vez. O serviço não guarda nada dessa troca: a requisição viaja em um parâmetro state selado, e os tokens do Google, em um código selado."
  machine:
    title: O problema atual como máquina de estados
    lead: Cada regra de “só uma vez” é um campo do perfil, verificado dentro da mesma leitura, cálculo e gravação. Nada mais se lembra de nada.
    forward:
      - briefing pronto
      - selado, entregue
      - registrada uma vez
    turns:
      - recusado, ainda há tentativas — no máximo três por pedido
      - três recusas, ou 15 minutos desde a abertura do pedido; os problemas do dia não são gastos, e três recusas contam como um pedido malsucedido do dia
      - “Outro problema” antes de uma resposta — fica registrado como em branco, e a pontuação não muda
      - qualquer resposta posterior — de uma segunda aba ou do modelo — recebe de volta o primeiro resultado e não grava nada
      - o próximo problema, em um cartão novo; o respondido deixa de ser o atual
      - o próximo problema foi escrito com antecedência — next_task o coloca em um cartão novo na hora, pulando requested
      - o selo não pode mais ser aberto — a chave passou por duas rotações; nada é registrado
state:
  title: Onde fica o estado
  lead: "Tudo o que um servidor com estado guardaria em um banco de dados fica em outras mãos: em um token selado que o chat guarda, em um cookie no navegador da família ou no próprio Drive da família. Reinicie o serviço ou inicie uma segunda cópia — nada se perde."
  self:
    label: O próprio MathTrail
    value: Nada
    note: Nenhuma conta, nenhuma sessão, nenhum cadastro, nenhum token do Google. Cada requisição traz tudo de que precisa.
  stores:
    tokens:
      title: O armazenamento de tokens do chat
      sub: Tokens selados, opacos para o host
      rows:
        access:
          name: Token de acesso
          life: 15 min
        refresh:
          name: Token de atualização
          life: 30 dias, ≤ 90
      note: Dentro deles vão selados os tokens do Google, um id de usuário opaco para os limites e o país de onde a pessoa adulta fez login.
    browser:
      title: O navegador da família
      sub: Dois cookies, sem sessão
      rows:
        approvals:
          name: Clientes aprovados
          life: 180 dias
        csrf:
          name: Proteção do login (CSRF)
          life: 10 min
      note: Perdê-los custa uma tela de permissão a mais, ou um novo login.
    drive:
      title: O Drive da família
      sub: A única coisa guardada a longo prazo
      rows:
        profile:
          life: até ser excluído
      note: O perfil, as pontuações e o problema atual, com a resposta selada. A pessoa adulta pode abrir o arquivo, e o Drive guarda o histórico dele.
    secrets:
      title: Secret Manager
      sub: Leitura única, quando uma instância inicia
      rows:
        keys:
          name: Chaves de selagem
          sub: depois de uma rotação, a chave anterior ainda é aceita
          life: 90 dias
        client:
          name: Chave secreta do cliente do Google
          life: fixada
    memory:
      title: A memória da instância
      sub: "Só caches: perdidos em um reinício, e nada quebra"
      rows:
        rates:
          name: Contadores do ritmo de requisições
          life: minutos
        location:
          name: Onde está o arquivo do perfil
          life: 10 min
        clients:
          name: Documentos dos clientes
          life: de 5 min a 24 h
  absent:
    title: O que a v1 deixa de fora de propósito
    items:
      - Um banco de dados
      - Filas
      - Um armazenamento de sessões
      - Um cache compartilhado
      - Um banco de problemas prontos
      - Um cliente de API de LLM
      - REST e OpenAPI
profile:
  title: O arquivo do perfil
  lead: "Uma criança, um arquivo JSON: não um cache de alguma verdade guardada em um servidor, mas a própria verdade. Cada bloco tem um teto, respeitado a cada gravação, então o arquivo nunca cresce sem limite: um arquivo comum fica dentro da meta, e um que esteja perto dos tetos passa dela. Os problemas passados ficam guardados como impressões digitais, não como texto."
  size: O tamanho do arquivo
  legend: Qual tamanho mostrar
  typical: Normalmente
  cap: Perto dos tetos
  total: "≈ {kb} KB"
  kb: "{kb} KB"
  goal: "meta {kb} KB"
  segment: "{name} · {typical} / {cap} KB"
  heads:
    block: Bloco
    holds: O que guarda
    writers: Quem grava
    size: Tamanho
  blocks:
    fingerprints:
      name: Impressões digitais
      holds: Até 200 esboços dos problemas entregues, para a verificação de quase repetições — sem texto, sem tema, sem data
    history:
      name: Histórico da pontuação
      holds: Onde estavam θ e o δ do tema antes de cada resposta recente, e θ e cada tema no início de cada um dos últimos 7 dias com respostas
    ratings:
      name: Pontuações e temas
      holds: "θ e o ponto de partida da criança; para cada tema: δ, as respostas, as armadilhas em que caiu, o domínio e o seu nível"
    recent:
      name: Respostas recentes
      holds: As últimas 20 respostas e problemas em branco — e nunca menos que as 5 respostas que a regra lê
    sealed:
      name: Problema atual, selado
      holds: A resposta, a armadilha por trás de cada alternativa errada, a solução e o resolvedor — uma única string opaca
    open:
      name: Problema atual, aberto
      holds: "O que o cartão mostra: o texto, o desenho, cinco alternativas, a dica — e, depois da resposta, a própria resposta"
    request:
      name: Pedido aberto
      holds: "Enquanto o problema está sendo escrito: o id dele, o briefing, as tentativas usadas e quem escolheu o tema"
    service:
      name: Serviço e criança
      holds: A versão do esquema, um UUID aleatório, a revisão; o pseudônimo, o ano escolar, os interesses, as anotações; os contadores do dia
  every-write: toda gravação
  note: "Um problema escrito com antecedência fica ao lado do atual e pesa mais ou menos o mesmo. O que o arquivo não guarda: os textos dos problemas passados, a resposta às claras até a criança responder, qualquer coisa que nomeie a pessoa adulta e uma etapa — as etapas são calculadas quando são mostradas. O Drive não tem gravação condicional, então o arquivo é lido de novo antes de salvar, e a gravação é recusada se ele tiver mudado: duas abas nunca sobrescrevem uma à outra em silêncio."
seal:
  title: O que é selado — e por quanto tempo
  lead: "Um só mecanismo cumpre duas funções: sela o login dentro dos tokens que o chat guarda, e a resposta de um problema — a do problema atual e a do que foi escrito com antecedência — dentro do perfil. Cada selo leva a sua finalidade, então um token de acesso não pode se passar por um token de atualização, e uma resposta selada não pode se passar por mais nada."
  token:
    title: Um token, desmontado
    version: a versão do formato
    purpose: finalidade
    purposes:
      c: código
      a: acesso
      r: atualização
      d: cliente
      s: state
      k: consentimento
      t: resposta de um problema
    key: id da chave
    key-note: tirado da própria chave, então uma rotação passa despercebida
    cipher: texto cifrado
    cipher-note: XChaCha20-Poly1305, um nonce aleatório de 192 bits
    note: "Não é um JWT: só o serviço o lê, e nenhum claim pode vazar de uma string opaca para um log."
  life:
    title: Validades, em escala logarítmica
    ticks:
      - 1 min
      - 1 h
      - 1 dia
      - 1 semana
      - 6 meses
    items:
      code:
        name: Código de autorização
        life: 60 s
      signin:
        name: Login em andamento
        life: 10 min
      access:
        name: Token de acesso
        life: 15 min
      refresh:
        name: Token de atualização
        life: 30 dias deslizantes, no máximo 90
      key:
        name: Chave de selagem
        life: rotação a cada 90 dias
      approvals:
        name: Clientes aprovados
        life: 180 dias
    note: Um servidor sem estado não consegue marcar um código como usado, por isso a janela do código é mantida curta. Depois de uma rotação, a chave anterior ainda é aceita, então nem um token nem uma resposta selada se perdem quando a chave muda.
