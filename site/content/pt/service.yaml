title: Como o serviço funciona
description: "Como o MathTrail funciona por dentro: as partes e como se ligam, uma aula chamada por chamada, o arquivo do perfil no Drive da família e onde fica o estado."
hero:
  badge: Para o público técnico
  title: Como o serviço funciona
  lead: "O MathTrail fica entre o chat que a família já usa e o Google Drive dela. O modelo do chat escreve cada problema, e o serviço decide se ele chega à criança. É um programa só: não chama nenhum modelo próprio e não guarda nada de uma requisição para outra."
  chips:
    - Um binário Go no Cloud Run
    - Sem estado
    - Sem banco de dados
    - Sem chamadas próprias a LLM
    - MCP 2026-07-28 · MCP Apps
  figure: O MathTrail em três camadas
  client:
    title: Cliente de chat
    tag: 1 · cliente
    others: outros hosts de MCP Apps
    note: O modelo do chat escreve o problema, e o cartão o mostra à criança.
  mcp: "{via} · chamadas de ferramentas por HTTPS"
  cloud:
    title: MathTrail no Google Cloud
    tag: 2 · execução
    sub: Cloud Run · um binário Go · sem estado
    core: O núcleo — computação pura
    around: "Ao redor: OAuth, o servidor MCP, o cartão, a selagem, os limites."
  drive: "{via} · com o próprio token da família"
  storage:
    title: Google Drive
    tag: 3 · armazenamento
    note: Um arquivo por criança, no próprio Drive da família — a única coisa guardada a longo prazo.
map:
  title: O mapa
  lead: Quem fala com quem. Nem a criança nem a pessoa adulta acessam o MathTrail diretamente — falam com o host do chat. Tudo o que está no bloco do meio é parte de um só processo, não um serviço separado. Escolha qualquer parte para ver o que ela faz e com o que se liga.
  legend: Partes do serviço
  whole: Nenhuma parte escolhida
  hint: "Escolha uma parte do mapa: tudo o que se liga a ela continua em destaque, e o resto esmaece."
  linked: Liga-se a
  reset: Limpar ✕
  columns:
    family:
      title: O chat da família
      sub: Claude no navegador, no computador e no celular · ChatGPT
    service:
      title: MathTrail
      sub: Um binário Go · Cloud Run · um domínio próprio
      tag: entre as partes, simples chamadas de função
    outside:
      title: Google e GitHub
      sub: Os únicos serviços fora do binário
  groups:
    people:
      title: Pessoas
