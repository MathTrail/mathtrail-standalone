# The page "Why", for a parent, in German: why olympiad maths is worth a
# child's time, how long people have learned it, what research has found about
# it, how it differs from a school lesson, what a parent can do, how MathTrail
# goes about it, and why it is no ordinary app. The grades, the topics' names
# and the card's own words are not here: they are the catalog's numbers and the
# widget's words. The card's options, its drawing, the history's pictures and
# the works the page cites are the site's data; a finding here says what its
# work found, no more.

title: Warum Olympiade-Mathematik
description: Warum Olympiade-Aufgaben die Zeit eines Kindes wert sind, was die Forschung über sie herausgefunden hat und wie Eltern mit MathTrail helfen können.

# The label of the note that says plainly what the page does not promise.
honest: Ehrlich gesagt

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: Ein Zaun ist 12 Meter lang. Alle 3 Meter steht ein Pfosten, auch an beiden Enden. Wie viele Pfosten gibt es?
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: Die Zwischenräume statt der Pfosten gezählt.
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4 Zwischenräume. Ein gerader Zaun mit Pfosten an beiden Enden hat einen Pfosten mehr als Zwischenräume. 4 + 1 = 5 Pfosten.

hero:
  title: Warum Olympiade-Mathematik für Ihr Kind
  lead: Die Schule lehrt, eine Aufgabe nach einem im Unterricht vorgerechneten Beispiel zu lösen. Olympiade-Aufgaben lehren, einen Weg zu finden, wenn es kein Beispiel zum Nachmachen gibt. Bis Klasse {last} können Eltern ihr Kind darauf vorbereiten, und dafür ist MathTrail gemacht.
  free: Kostenlos
  open: Open Source
  school:
    label: Eine Aufgabe aus der Schule
    text: Man muss teilen können.
    sum: 12 ÷ 3 = 4
  olympiad:
    label: Eine Olympiade-Aufgabe
    answer: "Antwort: {answer}"
    trap: "Falle: 4 sind die Zwischenräume, nicht die Pfosten"
    text: Man muss verstehen, was vor sich geht.
  caption: Dieselben Zahlen. Eine andere Art zu denken.

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: Denken ohne Vorlage wird seit über zweitausend Jahren gelehrt
  lead: Aufgaben, die sich nicht nach Schema lösen lassen, sind nichts Neues. In vielen Ländern und über viele Jahrhunderte lernten Menschen, eine Lösung zu finden, die ihnen niemand gezeigt hatte, und zu erklären, warum sie stimmt. Jede Generation gab diese Fähigkeit an die nächste weiter.
  quote: „Es gibt keinen Königsweg zur Geometrie.“
  quoted: Euklid zu König Ptolemaios, der fragte, ob man Geometrie nicht leichter lernen könne als mit den „Elementen“. So erzählt es Proklos im 5. Jahrhundert.
  # What a screen reader calls the choice of a picture.
  choice: Bilder aus der Geschichte
  eras:
    - label: Die Antike · bis ins 6. Jahrhundert
      title: Beweise und Aufgabensammlungen
      text: Die Griechen begannen zu beweisen, warum eine Regel gilt. In China trugen die „Neun Kapitel der Rechenkunst“ 246 Aufgaben mit ihren Lösungen zusammen. In Indien begann man, Zahlen mit einer Null zu schreiben, so wie wir sie heute noch schreiben.
    - label: Das Mittelalter und danach · 9.–19. Jahrhundert
      title: Die Aufgabe als Herausforderung
      text: In Bagdad schrieb al-Chwarizmi das Buch, dessen Titel uns das Wort „Algebra“ gab. In Italien lieferten sich Mathematiker Duelle mit Aufgaben, und in Japan hingen Aufgaben auf Holztafeln in Tempeln.
    - label: Spätes 19. und 20. Jahrhundert
      title: Aufgaben für jedes Kind
      text: "Alle Kinder gingen zur Schule, und für die Neugierigsten gab es Mathezirkel und Olympiaden: in Ungarn ab 1894, in Leningrad ab 1934."
    - label: Heute
      title: Ein Mentor für jedes Kind
      text: "Einen persönlichen Mentor hatten früher nur wenige: Aristoteles unterrichtete Alexander den Großen. Heute kann jedes Kind einen haben. Die Begleitfigur im MathTrail-Trainer verrät nie die Antwort: Wie die großen Lehrer der Vergangenheit stellt sie die Fragen, die ein Kind zur Lösung führen."
      link: Zum Trainer →
  pictures:
    athens:
      place: Griechenland
      alt: "Ausschnitt aus einem Fresko: Ein grauhaariger Gelehrter beugt sich über eine Tafel und zeichnet mit einem Zirkel, um ihn herum vier Schüler."
      caption: Euklid zeichnet mit dem Zirkel auf einer Tafel, während seine Schüler zusehen; manche halten ihn für Archimedes. Ausschnitt aus Raffaels Fresko „Die Schule von Athen“, 1509–1511.
    confucius:
      place: China
      alt: "Ein Gemälde: Ein Lehrer sitzt im Freien inmitten seiner Schüler, und sie hören zu und diskutieren."
      caption: Konfuzius mit seinen Schülern. Das Rechnen gehörte zu den „sechs Künsten“, die ein gebildeter Mensch beherrschen musste. Ein Gemälde eines unbekannten Künstlers aus dem 19. Jahrhundert.
    aryabhata:
      place: Indien
      alt: "Eine weiße Statue: Ein Gelehrter in einem Umhang streckt die Hand aus."
      caption: "Aryabhata, ein indischer Mathematiker und Astronom des 5. Jahrhunderts. Niemand weiß, wie er aussah: Dies ist eine moderne Statue in Pune."
    istanbul:
      place: Die islamische Welt
      alt: "Eine Miniatur: Gelehrte mit Turbanen bei der Arbeit mit einem Globus, Instrumenten und Büchern."
      caption: Astronomen und Mathematiker bei der Arbeit in der Sternwarte von Taqi ad-Din in Istanbul. Eine osmanische Miniatur vom Ende des 16. Jahrhunderts.
    pacioli:
      place: Italien
      alt: "Ein Porträt: Ein Mönch und Mathematiker zeigt auf eine Tafel mit der Aufschrift Euclides; neben ihm steht ein Schüler, und über dem Tisch hängt ein Polyeder aus Glas."
      caption: Der Mathematiker Luca Pacioli mit einem Schüler. Am Rand der Tafel mit der Zeichnung steht „Euclides“. Ein Porträt von 1495, das Jacopo de' Barbari zugeschrieben wird.
    sangaku:
      place: Japan
      alt: Eine Holztafel mit farbigen Zeichnungen von Kreisen und Spalten von Schriftzeichen.
      caption: "Ein Sangaku, eine Tafel mit Geometrieaufgaben, im Konnō-Hachimangū-Schrein in Tokio, 1859. Foto: Momotarou2012, CC BY-SA 3.0."
    rachinsky:
      place: Russland
      alt: "Ein Gemälde: Jungen in Bauernhemden stehen an einer Tafel mit einer Aufgabe und denken nach, und einer vorn stützt das Kinn auf die Hand."
      caption: "Schüler einer Dorfschule rechnen eine Aufgabe von der Tafel im Kopf aus: (10² + 11² + 12² + 13² + 14²) ÷ 365. Nikolai Bogdanow-Belski, „Kopfrechnen. In der Volksschule von S. A. Ratschinski“, 1895."
    st-louis:
      place: USA
      alt: "Ein Foto einer Klasse: Kinder schreiben Zahlenkolonnen an die Tafel, die Lehrerin hilft einem Mädchen, und die anderen sitzen mit Büchern an ihren Pulten."
      caption: Kinder einer zweiten Klasse lösen Rechenaufgaben an der Tafel. Bates School, St. Louis, Anfang des 20. Jahrhunderts.
    moscow:
      place: UdSSR
      alt: "Ein Foto: Ein Schüler an einer Tafel mit Zeichnungen zur Raumgeometrie dreht sich um und lächelt."
      caption: "Eine Schulprüfung: ein Schüler an der Tafel mit einer Aufgabe zur Raumgeometrie. Moskau, in den 1950er-Jahren. Foto: Yu. D. Korolev, Hauptarchiv Moskau, CC BY 4.0."
    coach-canvas:
