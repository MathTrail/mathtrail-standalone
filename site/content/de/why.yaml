      chip: Lösung auf der Zeichenfläche
      alt: "Der Bildschirm eines Tablets: eine Aufgabe über Pfosten entlang einer Straße, eine gepunktete Skizze auf der Zeichenfläche und daneben der Tipp der Begleitfigur, eines Fuchses, und die Schritte: Verstehen, Planen, Lösen, Prüfen."
      caption: "Der Prototyp des MathTrail-Trainers: Das Kind zeichnet eine Lösung auf die Zeichenfläche, und die Begleitfigur schlägt vor, mit kleinen Zahlen zu beginnen."
