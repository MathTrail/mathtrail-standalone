# The page "Coach", for a parent, in German: a product of its own, still in
# the making, that leads a child through a problem on a tablet, and its
# prototype to try in a frame. The prototype speaks English alone in every
# language of the page and is never translated. The number of techniques on
# the first screen's second button is the site's data.

title: Trainer
description: Wir entwickeln einen Trainer für Kinder von 7 bis 12 Jahren, die Olympiade-Aufgaben am Tablet lösen und selbst durchdenken. Probieren Sie den Prototyp aus.

hero:
  badge: In Entwicklung
  title: Olympiade-Mathematik, bei der das Kind selbst denkt
  lead: "Wir entwickeln einen Trainer für Kinder von 7 bis 12 Jahren. Das Kind löst eine Aufgabe auf einem Tablet und zeichnet und schreibt dabei auf einer Zeichenfläche wie in einem Heft. Eine Begleitfigur, die das Kind gewählt hat, führt durch vier Schritte und stellt Leitfragen. Die Begleitfigur verrät die Antwort nie: Das Kind schreibt sie selbst."
  try: Prototyp ausprobieren
  # A screen of the prototype beside the words: what it shows, for whoever
  # cannot see it, and the line under it.
  screen: "Der Prototyp von MathTrail: Das Kind wählt eine Begleitfigur"
  caption: "Eine Ansicht des Prototyps: Das Kind wählt, mit wem es die Aufgabe löst. Probieren Sie ihn unten aus."

# What the coach is about, a card for each idea, under a heading a screen
# reader alone says.
ideas:
  title: Wie der Trainer sein wird
  items:
    - title: Pólyas vier Schritte
      text: Verstehen → Planen → Lösen → Prüfen. Die Schritte sind immer zu sehen.
    - title: Eine Zeichenfläche wie ein Heft
      text: Die Zeichnung ist Teil der Lösung. Tipps kommen einzeln, ohne Antwortmöglichkeiten zum Auswählen.
    - title: Eine eigene Begleitfigur
      text: Ein Fuchs, ein Roboter, eine Eule, eine Katze, ein Dinosaurier oder eine Figur, die das Kind zeichnet.

# The prototype in its frame: the frame's name for a screen reader, the line
# under it, and the link that opens it alone.
prototype:
  frame: MathTrail – ein interaktiver Prototyp
  caption: "Ein interaktiver Prototyp: Versuchen Sie, eine Lösung zu zeichnen"
  open: Im Vollbild öffnen ↗

# What the prototype is, and what it only pretends to do yet.
notes:
  title: Das ist ein Prototyp
  text: Alles lässt sich anklicken, und auf der Zeichenfläche kann man mit der Maus oder dem Finger zeichnen. Die Oberfläche ist vorerst auf Englisch.
  imitated:
    title: Vorerst nur simuliert
    items:
      - Erkennung von Handschrift und Zeichnungen
      - Stimme der Begleitfigur
      - Aufgaben aus einem Foto
