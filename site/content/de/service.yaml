title: So funktioniert der Dienst
description: "Wie MathTrail im Inneren arbeitet: die Teile des Dienstes und ihre Verbindungen, eine Lektion Aufruf für Aufruf, wo der Zustand liegt, die Profildatei im Google Drive der Familie und was darin versiegelt ist."
hero:
  badge: Für Fachleute
  title: So funktioniert der Dienst
  lead: "MathTrail steht zwischen dem Chat, den eine Familie bereits nutzt, und dem Google Drive der Familie. Das Modell des Chats schreibt jede Aufgabe, und der Dienst entscheidet, ob sie das Kind erreicht. Der Dienst ist ein einziges Programm: Er ruft kein eigenes Modell auf und behält zwischen den Anfragen nichts."
  chips:
    - Ein Go-Binary auf Cloud Run
    - Zustandslos
    - Keine Datenbank
    - Keine eigenen LLM-Aufrufe
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail in drei Ebenen
  client:
    title: Chat-Client
    tag: 1 · Client
    others: andere MCP-Apps-Hosts
    note: Das Modell des Chats schreibt die Aufgabe, und die Karte zeigt sie dem Kind.
  mcp: "{via} · Tool-Aufrufe über HTTPS"
  cloud:
    title: MathTrail auf Google Cloud
    tag: 2 · Laufzeitumgebung
    sub: Cloud Run · ein Go-Binary · zustandslos
    core: "Der Kern: reine Berechnung"
    around: "Um den Kern herum: OAuth, der MCP-Server, die Karte, die Versiegelung, die Limits."
  drive: "{via} · mit dem eigenen Token der Familie"
  storage:
    title: Google Drive
    tag: 3 · Speicher
    note: "Eine Datei pro Kind, im eigenen Google Drive der Familie: das Einzige, was lange aufbewahrt wird."
map:
  title: Die Übersicht
  lead: "Wer mit wem spricht. Weder das Kind noch die erwachsene Person erreicht MathTrail direkt: Beide sprechen mit dem Chat-Host. Alles im mittleren Block ist Teil eines einzigen Prozesses, kein eigener Dienst. Wählen Sie einen beliebigen Teil, um zu sehen, was er tut und womit er verbunden ist."
  legend: Teile des Dienstes
  whole: Nichts ausgewählt
  hint: "Wählen Sie einen Teil der Übersicht: Alles, womit er verbunden ist, bleibt hell, und der Rest verblasst."
  linked: Verbunden mit
  reset: Zurücksetzen ✕
