flow:
  title: Eine Lektion, Aufruf für Aufruf
  lead: "Das Modell und die Karte rufen dieselben Tools auf und stützen sich auf eine einzige Quelle der Wahrheit: die Profildatei im Google Drive der Familie. Damit eine Lektion weitergeht, müssen sie einander nichts mitteilen."
  legend: Szenario
  scenarios:
    task: Aufgabe
    answer: Antwort
    signin: Anmeldung
  kinds:
    call: ein Aufruf
    reply: seine Antwort
    host: im Host
  actors:
    adult: Erwachsene Person
    kid: Kind
    card: Karte
    model: Modell des Hosts
    service: MathTrail
    drive: Drive
    browser: Browser der Familie
    host: Host
    google: Google
  task:
    rows:
      - „Eine neue Aufgabe, bitte“
      - next_task
      - "Der Host zeigt die Karte an, sobald der Aufruf beginnt: „Die nächste Aufgabe wird vorbereitet…“"
      - Limits · die Regel wählt das Thema, das Niveau und die Schwierigkeit
      - die offene Anfrage schreiben
      - die Anfrage ist offen – Paket abholen
      - get_package
      - Auftrag · 3 Referenzaufgaben · Fallen · Vorlagen · Beispielbilder
      - Das Modell schreibt die Aufgabe, ein Lösungsprogramm in Starlark und eine Selbstprüfung
      - submit_task – bis zu 3 Versuche
      - Prüfungen · das Lösungsprogramm muss genau eine richtige Antwortmöglichkeit finden
      - die Aufgabe wird zur aktuellen, ihre Antwort versiegelt
      - read_task – die Karte fragt alle 4 s nach
      - Text · Bild · fünf Antwortmöglichkeiten · Tipp – ohne die Antwort
    caption: "Jeder Aufruf liest außerdem das Profil aus Google Drive – diese Lesezugriffe sind nicht eingezeichnet. Die wartende Karte sieht das Paket nie: Seine Referenzaufgaben enthalten ihre Antworten. Während das Kind löst, schreibt das Modell mit prepare_task schon die nächste Aufgabe, und wenn eine weitere gewünscht wird, legt next_task sie sofort auf eine neue Karte – ohne diese Wartezeit."
  answer:
    rows:
      - klickt auf C
      - submit_answer – kostet den Chat keine Runde
      - nur die erste Antwort · erst jetzt wird das Siegel geöffnet · θ und δ ändern sich nur danach, ob sie richtig ist
      - Wertungen und Verlauf schreiben
      - richtig oder nicht · die Falle hinter C · das Bild der Lösung · die Schritte · die Wertung vorher → nachher
      - Die Karte wird an der Stelle der Aufgabe zur Besprechung der Antwort
      - ui/update-model-context – eine Zeile, gelesen mit der nächsten Nachricht der erwachsenen Person
      - „Warum ein Pfosten mehr?“
      - antwortet zu genau dieser Aufgabe und ergänzt die Karte
    caption: Der Klick speichert die Antwort, bevor irgendetwas erklärt wird, und die Karte wird sofort zur Besprechung der Antwort. Den Chat kostet das keine Runde, und das Modell zeichnet nichts. Es liest die Zeile der Karte mit der nächsten Nachricht der erwachsenen Person und beantwortet eine Frage zur Aufgabe, ohne die Karte nachzuerzählen. Geht die Zeile des Hosts an das Modell verloren, holt das Modell das beim nächsten Aufruf nach.
  signin:
    rows:
      - POST /mcp, ohne Token
      - 401 · wo die Metadaten liegen
      - öffnet /oauth/authorize · PKCE S256
      - authorize
      - "Ein eigener Zustimmungsbildschirm: welcher Client und wohin er die erwachsene Person zurückschickt"
      - Anmeldung mit Google · nur drive.file
      - zurück, mit dem Code von Google
      - /oauth/callback
      - Code eintauschen
      - /about – wessen Drive ist das?
      - Nutzer-ID = HMAC des Drive-Kontos · Tokens von Google in unseren Code versiegelt
      - 302 · code = mt1.c.…
      - gibt den Code zurück
      - /oauth/token · Code + Verifier
      - Zugriff 15 min · Aktualisierung 30 Tage
    caption: "Die erwachsene Person meldet sich einmal an. Der Dienst behält nichts von diesem Austausch: Die Anfrage reist versiegelt im Parameter state, die Tokens von Google in einem versiegelten Code."
  machine:
    title: Die aktuelle Aufgabe als Zustandsautomat
    lead: Jede Regel, die „nur einmal“ verlangt, ist ein Feld des Profils und wird im selben Durchgang aus Lesen, Rechnen und Schreiben geprüft. Nichts anderes merkt sich irgendetwas.
    forward:
      - Auftrag bereit
      - versiegelt, gestellt
      - einmal gespeichert
    turns:
      - abgelehnt, Versuche übrig – höchstens drei pro Anfrage
      - drei Ablehnungen oder 15 Minuten seit dem Öffnen der Anfrage; die Aufgaben des Tages werden nicht verbraucht, und drei Ablehnungen zählen als gescheiterte Anfrage des Tages
      - „Neue Aufgabe“ vor einer Antwort – als übersprungen gespeichert, die Wertung bleibt unberührt
      - jede spätere Antwort – aus einem zweiten Tab oder vom Modell – bekommt das erste Ergebnis zurück und schreibt nichts
      - die nächste Aufgabe, auf einer neuen Karte; die beantwortete ist nicht mehr aktuell
      - die nächste Aufgabe wurde vorab geschrieben – next_task legt sie sofort auf eine neue Karte und überspringt requested
      - das Siegel lässt sich nicht mehr öffnen – der Schlüssel wurde zweimal rotiert; nichts wird gespeichert
state:
  title: Wo der Zustand liegt
  lead: "Alles, was ein Server mit Zustand in einer Datenbank hielte, bewahrt jemand anderes auf: in einem versiegelten Token, das der Chat hält, in einem Cookie im Browser der Familie oder im eigenen Google Drive der Familie. Starten Sie den Dienst neu oder starten Sie eine zweite Kopie: Nichts geht verloren."
  self:
    label: MathTrail selbst
    value: Nichts
    note: Keine Konten, keine Sitzungen, keine Registrierungen, keine Tokens von Google. Jede Anfrage bringt alles mit, was sie braucht.
  stores:
    tokens:
      title: Der Token-Speicher des Chats
      sub: Versiegelte Tokens, für den Host undurchsichtig
      rows:
        access:
          name: Zugriffstoken
          life: 15 min
        refresh:
          name: Token zum Aktualisieren
          life: 30 Tage, ≤ 90
      note: Darin versiegelt sind die Tokens von Google, eine undurchsichtige Nutzer-ID für die Limits und das Land, aus dem sich die erwachsene Person angemeldet hat.
    browser:
      title: Der Browser der Familie
      sub: Zwei Cookies, keine Sitzung
      rows:
        approvals:
          name: Genehmigte Clients
          life: 180 Tage
        csrf:
          name: Schutz der Anmeldung (CSRF)
          life: 10 min
      note: Gehen sie verloren, kostet das einen Zustimmungsbildschirm mehr oder eine neue Anmeldung.
    drive:
      title: Das Google Drive der Familie
      sub: Das Einzige, was lange aufbewahrt wird
      rows:
        profile:
          life: bis zur Löschung
      note: Das Profil, die Wertungen und die aktuelle Aufgabe mit versiegelter Antwort. Die erwachsene Person kann die Datei öffnen, und Google Drive bewahrt ihren Versionsverlauf auf.
    secrets:
      title: Secret Manager
      sub: Einmal gelesen, beim Start einer Instanz
      rows:
        keys:
          name: Siegelschlüssel
          sub: nach einer Rotation gilt der vorige Schlüssel weiter
          life: 90 Tage
        client:
          name: Client-Secret von Google
          life: festgelegt
    memory:
      title: Der Arbeitsspeicher der Instanz
      sub: "Nur Caches: bei einem Neustart verloren, und nichts geht kaputt"
      rows:
        rates:
          name: Zähler der Anfragerate
          life: Minuten
        location:
          name: Wo die Profildatei liegt
          life: 10 min
        clients:
          name: Dokumente der Clients
          life: 5 min bis 24 h
  absent:
