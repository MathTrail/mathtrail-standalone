  parts:
    adult:
      name: Erwachsene Person
      sub: Elternteil oder Lehrkraft · wer sich anmeldet
      about: "Ein Elternteil oder eine Lehrkraft. Besitzt sowohl das Chat-Konto als auch das Google-Konto: verbindet MathTrail, meldet sich einmal an, legt das Profil an, leitet die Lektion im Chat und verfolgt den Fortschritt. Die einzige Person, die sich anmeldet, und die einzige, die schreibt."
    kid:
      name: Kind
      sub: Klassen 1–6 · keine eigene Anmeldung
      about: Klassen 1–6. Löst Aufgaben auf der Karte, im Chat der erwachsenen Person. Hat keine eigene Anmeldung.
    model:
      name: Das Modell des Hosts
      sub: Schreibt die Aufgabe, das Lösungsprogramm, die Erklärungen
      about: Claude oder ChatGPT. Schreibt die Aufgabe, ein Lösungsprogramm in Starlark, eine Erklärung zu jeder falschen Antwortmöglichkeit und eine Selbstprüfung; führt die Lektion in Worten, wo keine Karten angezeigt werden. MathTrail selbst ruft kein Modell auf.
    appsrt:
      name: MCP-Apps-Laufzeitumgebung
      sub: Der Rahmen in einer Sandbox, in dem die Karte läuft
      about: Zeigt die Karte in einem Rahmen in einer Sandbox an, übergibt ihr die Sprache, die Plattform und die Größe und leitet die eigenen Aufrufe der Karte mit dem Token des Hosts weiter – die Karte selbst sieht das Token nie.
    cimd:
      name: Client-Metadatendokument
      sub: Die client_id des Hosts ist eine HTTPS-Adresse
      about: Der Host weist sich mit einer HTTPS-Adresse aus. MathTrail ruft das Dokument unter dieser Adresse ab, gegen SSRF geschützt, statt ein Register der Clients zu führen.
    router:
      name: HTTP-Router
      sub: /mcp · /oauth/* · /health
      about: "Der einzige Eingang: /health, /mcp, die OAuth-Endpunkte und .well-known. Zeitlimits, eine Obergrenze für die Größe des Bodys, eine Origin-Prüfung; der Aussteller ist die eigene Domain, und jeder andere Host erhält die Antwort 404."
    authsrv:
      name: Autorisierungsserver
      sub: OAuth 2.1 + PKCE, Zustimmung
      about: "MathTrail ist selbst ein OAuth-2.1-Server mit PKCE: Metadaten, ein eigener Zustimmungsbildschirm, Anmeldung mit Google, Tokens, Erneuerung und Widerruf. Alles, was ein Server mit Zustand speichern würde, ist in Tokens und Cookies versiegelt."
    mcpsrv:
      name: MCP-Server
      sub: Streamable HTTP, zustandslos
      about: "Das Protokoll: Streamable HTTP 2026-07-28, zustandslos, auf Basis des offiziellen Go-SDK. Der Server listet die Tools auf und ruft sie auf, liefert die Karte als ui://-Ressource aus und übergibt dem Modell seine Anweisungen samt ihrer Version."
    limits:
      name: Limits
      sub: Pro Adresse, pro Konto, pro Tag
      about: Ein Tempo pro Adresse vor der Anmeldung und pro Konto danach sowie eine Gesamtobergrenze, alles im Arbeitsspeicher – dann die täglichen Obergrenzen, die das Profil zählt. Ist ein Limit überschritten, kommt ein schlichter Satz, den das Modell weitergibt.
    tools:
      name: Tools
      about: "Zwölf Tools nach einem Muster: Profil lesen, rechnen, zurückschreiben. Die meisten ruft das Modell auf; die Karte ruft ihre eigenen auf – für die Aufgabe, die Antwort, den Fortschritt und das Formular des Profils. Nichts Geheimes gelangt je in ein Ergebnis."
    rule:
      name: Die Regel
      sub: Thema, Ziel, Schwierigkeitskorridor
      about: "Wählt den Auftrag deterministisch: nach einem Fehler dasselbe Thema, um es zu festigen; sonst das Thema, das am längsten nicht vorkam; die Schwierigkeit aus dem Korridor, in dem die Lösungswahrscheinlichkeit bei 70–85 % liegt."
    rating:
      name: Wertungen
      sub: θ, δ, β · Elo auf IRT-Basis
      about: P = 0,2 + 0,8·σ(θ + δ − β). Elo bewegt sich nur danach, ob eine Antwort richtig ist, mit einer Schrittweite, die schrumpft; eine Skala wie beim Schach und elf Ränge; ein Thema gilt nach einer vorsichtigen Schätzung als gemeistert.
    checks:
      name: Prüfungen
      sub: Was eine eingereichte Aufgabe bestehen muss
      about: "Was eine eingereichte Aufgabe bestehen muss: ihre Struktur und fünf verschiedene Antwortmöglichkeiten, die Buchstaben der Lektionssprache, unterschiedliche Erklärungen, das Lösungsprogramm, die Selbstprüfung, die Lesbarkeit, Beinahe-Duplikate und das Bild: sein Format, seine Beschriftungen im Abgleich mit dem Aufgabentext und dass keine Antwort darauf steht. Alle nicht bestandenen Prüfungen werden auf einmal gemeldet."
    solver:
      name: Löser
      sub: Starlark-Sandbox, Schrittlimit
      about: Führt das Starlark-Programm des Modells aus, das die Antwortmöglichkeiten durchprobiert; genau eine muss sich als richtig erweisen. Limits für Schritte und Zeit, kein Netzwerk und keine Dateien.
    content:
      name: Inhalte
      sub: Kataloge, Referenzaufgaben, Anweisungen
      about: "Alles, was in das Binary eingebaut und kein Code ist: die Kataloge der Themen, Fallen und Fähigkeiten, die Referenzaufgaben, die Schemas, die Vorlagen für Lösungsprogramme, ein Beispiel für jede Art von Bild und die Anweisungen an das Modell samt ihrer Version."
    widget:
      name: Widget
      sub: Die Karte · eine HTML-Datei
      about: "Die Karte: Preact, gebaut zu einer einzigen HTML-Datei, die nichts von anderswo lädt, mit den Wörterbüchern der Sprachen darin. Das Layout funktioniert ab 320 px, und die Schaltflächen lassen sich gut mit dem Finger treffen."
    store:
      name: Speicher
      sub: Das Profil und die aktuelle Aufgabe
      about: Findet das Profil anhand einer versteckten Markierung, vergleicht vor dem Schreiben, bringt zwei Tabs in Einklang, stellt die Datei auf Wunsch der erwachsenen Person aus Versionen wieder her, die Google Drive für immer behält – und kommt mit einem kleinen Budget an Drive-Aufrufen aus.
    seal:
      name: Versiegelung
      sub: Tokens und die versiegelte Antwort
      about: "Ein Mechanismus, zwei Zwecke: Er versiegelt die Anmeldung und die Tokens von Google in die Tokens, die der Host hält, und die Antwort einer Aufgabe – der aktuellen und der vorab geschriebenen – ins Profil. Die Schlüssel kommen aus Secret Manager und werden anhand der Schlüssel-ID rotiert."
    logs:
      name: Protokollierung
      sub: Zusammenfassungen, keine personenbezogenen Daten
      about: "Eine strukturierte Zusammenfassung pro Aufruf: das Tool, das Ergebnis, die Dauer, die Version der Anweisungen; Versuche und die Gründe einer Ablehnung als Ereignisse der Aufgabe. Keine personenbezogenen Daten, kein Aufgabentext, keine Antworten."
    boot:
      name: Container und Konfiguration
      sub: Umgebung, Version, Herunterfahren
      about: Verbindet die Teile miteinander und schließt sie in umgekehrter Reihenfolge, arbeitet mit Zeitlimits und geordnetem Herunterfahren, liest die gesamte Konfiguration aus der Umgebung – und weigert sich, mit Entwicklungsschaltern auf Cloud Run zu starten.
    goauth:
      name: Google OAuth
      sub: Nur drive.file
      about: Die Anmeldung der erwachsenen Person, nur mit der Berechtigung drive.file, dazu Erneuerung und Widerruf. Der Widerruf eines beliebigen Tokens beendet jeden Zugriff.
    gdrive:
      name: Drive API v3
      sub: Der einzige Langzeitspeicher
      about: "Der einzige Langzeitspeicher: ein JSON-Profil in einem sichtbaren Ordner namens MathTrail im Google Drive der Familie, gelesen und geschrieben mit dem eigenen Token der Familie."
    sm:
      name: Secret Manager
      sub: Siegelschlüssel, das Client-Secret
      about: "Die Siegelschlüssel und das Client-Secret von Google: festgelegte Versionen, einmal beim Start einer Instanz gelesen."
    ar:
      name: Artifact Registry
      sub: Das Image, per Digest
      about: Das Image jeder Revision, per Digest; alte Images werden gelöscht.
    clog:
      name: Cloud Logging
      sub: Wohin stdout geht
      about: Wohin das stdout des Dienstes geht. Die Zeilen, nach denen Kinder gezählt werden, bleiben 62 Tage in einem eigenen Bucket.
    bq:
      name: BigQuery → Data Studio
      sub: Zahlen, jahrelang aufbewahrt
      about: Nutzungszahlen werden jahrelang aufbewahrt und jede Nacht neu gezählt; keine Tabelle enthält den Namen, unter dem ein Kind gezählt wird. Ein privater Bericht und ein öffentlicher, der keine Gruppe mit weniger als zehn Kindern zeigt.
    ga:
      name: Actions
      sub: Build, Prüfungen, Deployment
      about: Der Build, die Prüfungen, das Veröffentlichen des Images und das Deployment über Workload Identity-Föderation – ohne Dienstkontoschlüssel.
    pages:
      name: Pages
      sub: Diese Website, Datenschutz und Nutzungsbedingungen
      about: "Diese Website: die Seiten der Themen sowie die Datenschutzerklärung und die Nutzungsbedingungen, auf die der Zustimmungsbildschirm verlinkt."
