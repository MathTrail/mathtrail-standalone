    items:
      - Eine Datenbank
      - Warteschlangen
      - Ein Sitzungsspeicher
      - Ein gemeinsamer Cache
      - Ein Vorrat fertiger Aufgaben
      - Ein Client für eine LLM-API
      - REST und OpenAPI
profile:
  title: Die Profildatei
  lead: "Ein Kind, eine JSON-Datei: kein Cache irgendeiner Wahrheit auf einem Server, sondern die Wahrheit selbst. Jeder Block hat eine Obergrenze, die bei jedem Schreiben eingehalten wird, sodass die Datei nie unbegrenzt wächst: Eine übliche hält das Ziel ein, und eine nahe an ihren Obergrenzen überschreitet es. Vergangene Aufgaben werden als Fingerabdrücke aufbewahrt, nicht als Text."
  size: Größe der Datei
  legend: Welche Größe angezeigt wird
  typical: Üblich
  cap: Nahe den Obergrenzen
  total: "≈ {kb} KB"
  kb: "{kb} KB"
  goal: "Ziel {kb} KB"
  segment: "{name} · {typical} / {cap} KB"
  heads:
    block: Block
    holds: Was er enthält
    writers: Wer ihn schreibt
    size: Größe
  blocks:
    fingerprints:
      name: Fingerabdrücke
      holds: Bis zu 200 Skizzen der gestellten Aufgaben für die Prüfung auf Beinahe-Duplikate – ohne Text, ohne Thema, ohne Datum
    history:
      name: Verlauf der Wertung
      holds: Wo θ und das δ des Themas vor jeder der letzten Antworten standen, und θ und jedes Thema zu Beginn jedes der letzten 7 Tage mit Antworten
    ratings:
      name: Wertungen und Themen
      holds: "θ und wo das Kind angefangen hat; für jedes Thema: δ, die Antworten, die Fallen, in die es getappt ist, ob das Thema gemeistert ist und auf welcher Stufe"
    recent:
      name: Letzte Antworten
      holds: Die letzten 20 Antworten und übersprungenen Aufgaben – und nie weniger als die 5 Antworten, die die Regel liest
    sealed:
      name: Aktuelle Aufgabe, versiegelt
      holds: Die Antwort, die Falle hinter jeder falschen Antwortmöglichkeit, die Lösung und das Lösungsprogramm – eine einzige undurchsichtige Zeichenkette
    open:
      name: Aktuelle Aufgabe, offen
      holds: "Was die Karte zeigt: der Text, das Bild, fünf Antwortmöglichkeiten, der Tipp – und nach der Antwort die Antwort selbst"
    request:
      name: Offene Anfrage
      holds: "Während die Aufgabe geschrieben wird: ihre ID, der Auftrag, die verbrauchten Versuche und wer das Thema gewählt hat"
    service:
      name: Dienst und Kind
      holds: Die Version des Schemas, eine zufällige UUID, die Revision; das Pseudonym, die Klasse, die Interessen, die Notizen; die Zähler des Tages
  every-write: jeder Schreibvorgang
  note: "Eine vorab geschriebene Aufgabe liegt neben der aktuellen und wiegt ungefähr gleich viel. Was die Datei nicht enthält: die Texte vergangener Aufgaben, die Antwort im Klartext, bevor das Kind geantwortet hat, irgendetwas, das die erwachsene Person benennt, und einen Rang – Ränge werden beim Anzeigen berechnet. Google Drive kennt kein bedingtes Schreiben, deshalb wird die Datei vor dem Speichern noch einmal gelesen, und das Schreiben wird abgelehnt, wenn sie sich geändert hat: Zwei Tabs überschreiben einander nie stillschweigend."
seal:
  title: Versiegelt – und wie lange
  lead: "Ein Mechanismus für zwei Zwecke: Er versiegelt die Anmeldung in die Tokens, die der Chat hält, und die Antwort einer Aufgabe – der aktuellen und der vorab geschriebenen – ins Profil. Jedes Siegel trägt seinen Zweck, sodass ein Zugriffstoken nicht als Aktualisierungstoken durchgehen kann und eine versiegelte Antwort als nichts anderes."
  token:
    title: Ein Token, zerlegt
    version: Version des Formats
    purpose: Zweck
    purposes:
      c: Code
      a: Zugriff
      r: Aktualisierung
      d: Client
      s: state
      k: Zustimmung
      t: Antwort einer Aufgabe
    key: Schlüssel-ID
    key-note: stammt aus dem Schlüssel selbst, daher fällt eine Rotation nicht auf
    cipher: Geheimtext
    cipher-note: XChaCha20-Poly1305, eine zufällige 192-Bit-Nonce
    note: "Kein JWT: Niemand außer dem Dienst liest es, und aus einer undurchsichtigen Zeichenkette kann kein Claim in ein Protokoll gelangen."
  life:
    title: Gültigkeitsdauern, auf logarithmischer Skala
    ticks:
      - 1 min
      - 1 h
      - 1 Tag
      - 1 Woche
      - 6 Monate
    items:
      code:
        name: Autorisierungscode
        life: 60 s
      signin:
        name: Laufende Anmeldung
        life: 10 min
      access:
        name: Zugriffstoken
        life: 15 min
      refresh:
        name: Aktualisierungstoken
        life: 30 Tage, gleitend, höchstens 90
      key:
        name: Siegelschlüssel
        life: alle 90 Tage rotiert
      approvals:
        name: Genehmigte Clients
        life: 180 Tage
    note: Ein Server ohne Zustand kann einen Code nicht als benutzt markieren, deshalb bleibt das Zeitfenster des Codes klein. Nach einer Rotation gilt der vorige Schlüssel weiter, sodass beim Wechsel des Schlüssels weder ein Token noch eine versiegelte Antwort verloren geht.
