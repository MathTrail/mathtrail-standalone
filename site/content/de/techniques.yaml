# The page of the techniques of olympiad problem solving, for a parent, in
# German. Which techniques there are, their groups and order, the topics each
# one leads to, and each example's level and the answer its solver proves are
# the site's data; the words here follow them, technique by technique. The
# pictures of a technique's steps are laid out by the page, and only their
# words are here.

title: Problemlösetechniken
description: Die Techniken, mit denen sich viele Olympiade-Aufgaben auf einmal knacken lassen, jede mit einer Aufgabe, einer Zeichnung und einer ausgearbeiteten Lösung, dazu ein Anhaltspunkt dafür, welche sich anbietet.

hero:
  title: Problemlösetechniken für Olympiade-Mathematik
  lead: >-
    Eine Olympiade-Aufgabe bringt kein fertiges Lösungsverfahren mit. Dafür
    gibt es Techniken, die bei vielen Aufgaben zugleich funktionieren. Hier
    sind die {count}, die am häufigsten vorkommen, jeweils mit einer Aufgabe,
    einer Zeichnung und einer Lösung.
  advice: >-
    Versuchen Sie sich mit Ihrem Kind an der Aufgabe, bevor Sie die Lösung
    öffnen. Am wichtigsten ist es, zu bemerken, welche Technik geholfen hat,
    damit man sie beim nächsten Mal wiedererkennt.

start:
  title: Wie man jede Aufgabe angeht
  lead: >-
    Bevor Sie eine Technik wählen, hilft es, vier Schritte zu durchlaufen. Der
    Mathematiker George Pólya hat sie in seinem Buch *Schule des Denkens*
    (1945) beschrieben.
  steps:
    - title: Die Aufgabe verstehen
      text: Erzähl die Aufgabe mit deinen eigenen Worten nach. Was weißt du? Was ist gesucht?
    - title: Einen Plan ausdenken
      text: Woran erinnert dich die Aufgabe? Welche Technik von dieser Seite könntest du ausprobieren?
    - title: Den Plan ausführen
      text: Geh Schritt für Schritt vor und schreib auf, was jeder Schritt ergibt.
    - title: Rückschau halten
      text: Setz die Antwort in die Aufgabe ein. Passt alles? Könnte es noch eine andere Antwort geben?

groups:
  see:
    title: Die Aufgabe veranschaulichen
    lead: >-
      Zuerst muss man die Aufgabe verstehen. Diese Techniken machen aus Worten
      ein Bild, eine Tabelle oder ein kleines Beispiel.
  find:
    title: Die Antwort finden
    lead: >-
      Wenn klar ist, worum es geht, führen diese Techniken zur Antwort, ohne
      dass unterwegs etwas verloren geht.
  prove:
    title: Beweisen
    lead: >-
      Bei einer Olympiade lautet die Frage oft nicht „wie viele“, sondern „kann
      es passieren“. Dann reicht Zählen nicht: Man muss erklären, warum es
      nicht anders sein kann.

techniques:
  draw:
    name: Die Aufgabe zeichnen
    what: >-
      Ein Bild oder eine Skizze macht aus Worten etwas, das man ansehen kann.
      Linien, Punkte und Pfeile genügen; schön muss es nicht sein.
    when: „um … mehr als“, Alter, Fahrten, Teile eines Ganzen.
    task: >-
      Ein Bruder ist 4 Jahre älter als seine Schwester. Zusammen sind sie 16
      Jahre alt. Wie alt ist der Bruder?
    steps:
      - Das Alter der Schwester als Balken zeichnen, das des Bruders als gleich langen Balken und 4 Jahre mehr.
      - "Die zusätzlichen 4 Jahre wegnehmen: 16 − 4 = 12. Das sind zwei gleiche Balken."
      - "Ein Balken ist 12 ÷ 2 = 6 Jahre: Das ist die Schwester. Der Bruder ist 6 + 4 = 10."
    answer: Der Bruder ist 10 Jahre alt.
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: "oben: die Schwester, unten: der Bruder; zusammen 16 Jahre"
      less: 16 − 4 = 12, zwei gleiche Balken
      found: der Bruder ist 6 + 4 = 10
    caption: >-
      Die Skizze zeigt, was man schwer im Kopf behält: Ohne die zusätzlichen
      vier Jahre sind Bruder und Schwester gleich alt.
  table:
    name: Eine Tabelle anlegen
    what: >-
      Wenn es viele Hinweise gibt, behält man sie schwer im Kopf. Eine Tabelle
      merkt sie sich für Sie: Jeder Hinweis ist ein Kreuz, und wo in einer
      Zeile nur noch ein Kästchen frei ist, steht die Antwort.
    when: mehrere Personen, mehrere Dinge und Hinweise mit „nicht“.
    task: >-
      Anton, Bea und Vera haben eine Katze, einen Hund und einen Papagei, jedes
      Kind genau ein Tier. Anton hat nicht die Katze. Bea hat Angst vor Hunden.
      Die Katze wohnt nicht bei Bea. Wer hat welches Tier?
    steps:
      - "Für jeden Hinweis ein Kreuz setzen: Anton – nicht die Katze; Bea – nicht der Hund; die Katze – nicht bei Bea."
      - "Bei Bea ist nur noch ein Kästchen frei: der Papagei. Also hat weder Anton noch Vera den Papagei."
      - Für Anton bleibt der Hund, für Vera die Katze.
    answer: Anton hat den Hund, Bea den Papagei, Vera die Katze.
    pictures:
      children:
        anya: Anton
        borya: Bea
        vera: Vera
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: A
        borya: B
        vera: V
      pets:
        cat: Katze
        dog: Hund
        parrot: Papagei
    caption: Die kleine Zahl in einem Kästchen ist der Schritt der Lösung, in dem es markiert wurde.
  small-numbers:
    name: Mit kleinen Zahlen beginnen
    aka: Ein Spezialfall
    what: >-
      Wenn die Zahlen groß sind und Sie nicht sehen, wo Sie anfangen sollen,
      lösen Sie dieselbe Aufgabe mit kleinen Zahlen. Erkennen Sie die Regel
      und wenden Sie sie dann auf die großen an.
    when: große Zahlen, „hundert“, „tausend“, lange Reihen.
    task: >-
      Entlang einer 100 Meter langen Straße werden Pfosten aufgestellt, alle 5
      Meter einer, auch an beiden Enden. Wie viele Pfosten braucht man?
    steps:
      - "Hundert Meter lassen sich nicht zeichnen, also eine Straße von 10 m nehmen. Pfosten bei 0, 5 und 10 m: 3 Pfosten für 2 Zwischenräume."
      - "Bei 15 und 20 m ist es genauso: Es gibt immer einen Pfosten mehr als Zwischenräume."
      - Auf 100 m gibt es 100 ÷ 5 = 20 Zwischenräume, also 21 Pfosten.
    answer: 21 Pfosten.
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: "10 m: 2 Zwischenräume, 3 Pfosten"
      fifteen: "15 m: 3 Zwischenräume, 4 Pfosten"
      twenty: "20 m: 4 Zwischenräume, 5 Pfosten"
      table: die Straße in Metern, ihre Zwischenräume und ihre Pfosten
    caption: >-
      Die Regel zeigt sich schon an einer kurzen Straße; dann genügt es, sie
      auf hundert Meter anzuwenden.
  systematic:
    name: Systematisch auflisten
    what: >-
      Beim Auflisten aufs Geratewohl wird bestimmt etwas übersehen oder doppelt
      gezählt. Systematisch auflisten heißt, der Reihe nach vorzugehen: erst
      nach einem Merkmal, dann nach dem nächsten. Ein Baumdiagramm hilft
      dabei.
    when: „auf wie viele Arten“, „wie viele Zahlen“, „schreib alle Möglichkeiten auf“.
    task: >-
      Wie viele verschiedene zweistellige Zahlen kann man aus den Ziffern 2, 4,
      6 und 8 bilden, wenn keine Ziffer in einer Zahl zweimal vorkommt?
    steps:
      - "Eine Reihenfolge wählen: erst die Zehnerziffer, dann die Einerziffer."
      - Die Zehnerziffer ist 2, 4, 6 oder 8. Jede lässt drei andere für die Einer übrig.
      - "Ast für Ast aufschreiben: 24, 26, 28, 42, 46, 48, 62, 64, 68, 82, 84, 86. Keine fehlt, und keine kommt doppelt vor."
    answer: 12 Zahlen.
    pictures:
      first: die erste Ziffer ist eine von vier
      total: 4 Äste × 3 Zahlen = 12
    caption: "Im Baum geht nichts verloren: Jede erste Ziffer hat ihre eigenen Äste."
  backwards:
    name: Vom Ende her rechnen
    aka: Rückwärtsarbeiten
    what: >-
      Wenn Sie wissen, wie die Geschichte endet, und gefragt wird, wie sie
      begann, gehen Sie rückwärts. Machen Sie aus jeder Handlung ihr Gegenteil:
      Aus „aß“ wird „gab zurück“, aus „multiplizierte“ wird „teilte“.
    when: Man kennt das Ergebnis am Ende und sucht, was am Anfang war.
    task: >-
      In einer Schale lagen Äpfel. Tilda aß die Hälfte davon. Dann aß Moritz
      die Hälfte vom Rest und noch einen Apfel. Übrig blieben 2 Äpfel. Wie
      viele Äpfel lagen am Anfang in der Schale?
    steps:
      - "Mit dem Bekannten beginnen: Am Ende waren es 2 Äpfel."
      - "Bevor Moritz aß: den einen Apfel zurückgeben, 2 + 1 = 3. Das war die Hälfte, also waren es 6."
      - "Bevor Tilda aß: 6 war die Hälfte, also waren es 12. Probe: 12 → 6 → 6 − 3 − 1 = 2."
    answer: 12 Äpfel.
    pictures:
      end: am Ende
      undo-petya: +1, ×2
      undo-tanya: ×2
      check: "Probe:"
    caption: >-
      Von rechts nach links gehen und alles umgekehrt machen: Aus „aß die
      Hälfte“ wird „mal 2“, aus „aß noch einen“ wird „plus 1“.
  all-the-same:
    name: Annehmen, alle seien gleich
    aka: Rechnen mit einer Annahme
    what: >-
      Wenn in einer Aufgabe Dinge von zwei Arten vorkommen, stellen Sie sich
      vor, alle wären von einer Art. Zählen Sie, um wie viel das Ergebnis
      danebenliegt, und Sie sehen, wie viele ausgetauscht werden müssen.
    when: "zwei Arten von Dingen und eine bekannte Gesamtzahl: Köpfe und Beine, Münzen mit zwei Werten."
    task: >-
      Auf einem Hof laufen Hühner und Kaninchen herum. Zusammen haben sie 10
      Köpfe und 28 Beine. Wie viele Kaninchen sind auf dem Hof?
    steps:
      - Angenommen, alle 10 sind Hühner. Dann gibt es 10 × 2 = 20 Beine.
      - "In Wirklichkeit sind es 28 Beine: 8 mehr."
      - "Jedes Kaninchen anstelle eines Huhns bringt 2 Beine mehr: 8 ÷ 2 = 4 Kaninchen. Probe: 4 × 4 + 6 × 2 = 28."
    answer: 4 Kaninchen.
    # What each counter under the problem stands for.
    legend:
      hen: ein Huhn, 2 Beine
      rabbit: ein Kaninchen, 4 Beine
    pictures:
      guess: "= 20 Beine"
      short: Beine fehlen
      fits: "4 Kaninchen und 6 Hühner: 16 + 12 = 28 Beine"
    caption: >-
      Erst so zählen, als wären alle gleich, dann genau so viele austauschen,
      wie nötig sind, damit es passt.
  pattern:
    name: Ein Muster suchen
    what: >-
      Sehen Sie sich die ersten Schritte an und finden Sie heraus, was sich
      wiederholt. Mit dem Stück, das sich wiederholt, können Sie weit
      vorausspringen, ohne alles dazwischen zu zeichnen.
    when: "Muster, Reihen, der Kalender: „welches ist das zwanzigste“, „welches ist das hundertste“."
    task: >-
      Flaggen hängen der Reihe nach: rot, gelb, grün, blau, dann wieder rot,
      gelb, grün, blau und so weiter. Welche Farbe hat die 23. Flagge?
    steps:
      - "Das Stück finden, das sich wiederholt: rot, gelb, grün, blau, vier Flaggen."
      - 23 Flaggen sind 5 volle Vierergruppen, also 20 Flaggen, und noch 3.
      - Die 23. ist die dritte in ihrer Vierergruppe, und die dritte ist immer grün.
    answer: Grün.
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21., 22., 23.
    caption: >-
      Dreiundzwanzig Flaggen muss man nicht zeichnen: Es genügt zu sehen,
      welchen Platz die Flagge in ihrer Vierergruppe einnimmt.
  opposite:
    name: Das Gegenteil annehmen
    aka: Widerspruchsbeweis
    what: >-
      Um zu beweisen, dass etwas unmöglich ist, nehmen Sie an, es sei möglich,
      und folgen Sie der Überlegung, bis Sie auf einen Widerspruch stoßen. Fast
      jede Aufgabe zum Thema „Ritter und Lügner“ wird so gelöst.
    when: „kann es passieren“, „beweise, dass es unmöglich ist“, wer die Wahrheit sagt.
    task: >-
      Auf einer Insel leben Ritter, die immer die Wahrheit sagen, und Lügner,
      die immer lügen. Anton sagte: „Bea ist eine Lügnerin.“ Bea sagte: „Anton
      und ich sind beide Ritter.“ Wer ist wer?
    steps:
      - >-
        **Angenommen, Bea sagt die Wahrheit.** Dann sind Anton und sie, wie sie
        sagt, beide Ritter. Doch Anton, ein Ritter, hat gesagt, dass Bea eine
        Lügnerin ist. **Ein Widerspruch.**
      - "Also ist Bea eine Lügnerin, und ihre Worte sind falsch: Anton und sie sind nicht beide Ritter. Das passt."
      - "Anton sagte: „Bea ist eine Lügnerin“, und das stimmt. Wahres sagt nur ein Ritter, also ist Anton ein Ritter."
    answer: Anton ist ein Ritter, und Bea ist eine Lügnerin.
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: A
      borya: B
      anya-said: „Bea ist eine Lügnerin“
      borya-said: „Anton und ich sind beide Ritter“
    pictures:
      said: „Bea ist eine Lügnerin“
      false: „beide Ritter“ ist falsch
      true: „Bea ist eine Lügnerin“ ist wahr
    caption: Ein Weg führt in eine Sackgasse, also ist der andere richtig.
  parity:
    name: Auf die Parität achten
    what: >-
      Manchmal muss man nicht alles wissen: Es genügt zu wissen, ob eine Zahl
      gerade oder ungerade ist. Wechselt etwas bei jedem Schritt zwischen
      gerade und ungerade, verrät die Zahl der Schritte sofort, wo man landen
      kann und wo nicht.
    when: Sprünge, Züge, Vertauschungen, „jedes zweite“, „kann das herauskommen“.
    task: >-
      Ein Grashüpfer sitzt auf einem Zahlenstrahl bei der Null. Jeder Sprung
      bringt ihn genau um 1 nach links oder nach rechts. Kann er nach 5
      Sprüngen wieder bei der Null sein?
    steps:
      - "Die Felder abwechselnd färben: gerade und ungerade."
      - "Jeder Sprung wechselt die Farbe: von einem geraden Feld auf ein ungerades und zurück."
      - Nach 5 Sprüngen, einer ungeraden Zahl, sitzt der Grashüpfer mit Sicherheit auf einem ungeraden Feld, und die Null ist gerade.
    answer: Nein, das kann er nicht.
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: blaue Felder sind gerade, orange ungerade, der Pfeil markiert den Start
      jumps: jeder Sprung und die Farbe des Feldes danach
      after: nach dem 5. Sprung nur ungerade Felder
    caption: >-
      Man muss nicht verfolgen, wohin genau der Grashüpfer gesprungen ist: Es
      genügt, die Farbe seines Feldes zu verfolgen.
  pigeonhole:
    name: Tauben und Käfige
    aka: Das Schubfachprinzip
    what: >-
      Gibt es mehr Tauben als Käfige, sitzen in irgendeinem Käfig mindestens
      zwei Tauben. Das klingt selbstverständlich, beweist aber Dinge, die
      unmöglich nachzuprüfen scheinen.
    when: „beweise, dass es … geben muss“, „mindestens zwei“, „mit Sicherheit“.
    task: >-
      Wie oft musst du würfeln, um sicher zu sein, dass irgendeine Zahl
      mindestens zweimal fällt?
    steps:
      - "Ein Würfel hat 6 Zahlen: Das sind 6 „Käfige“. Die Würfe sind die „Tauben“."
      - "Nach 6 Würfen können die Zahlen noch alle verschieden sein: 1, 2, 3, 4, 5, 6."
      - "Für den siebten Wurf ist kein Käfig mehr frei: Eine Zahl fällt zum zweiten Mal. Also 7 Würfe."
    answer: 7 Würfe.
    pictures:
      throw: ein blauer Punkt ist ein Wurf
      seventh: der 7. Wurf landet in einem schon besetzten Käfig
    caption: Selbst wenn die ersten sechs Würfe alle verschieden sind, muss der siebte einen von ihnen wiederholen.
  mirror:
    name: Züge spiegeln
    aka: Eine Symmetriestrategie
    what: >-
      Bei Spielen zu zweit gewinnt oft, wer die Züge des Gegenübers spiegeln
      kann. Dann hat man immer einen Gegenzug, solange das Gegenüber einen Zug
      hat.
    when: "Spiele zu zweit: „wer gewinnt bei richtigem Spiel“."
    task: >-
      Ein Streifen hat 9 Kästchen. Zwei spielen gegeneinander und legen
      abwechselnd einen Spielstein in ein leeres Kästchen, das nicht neben
      einem besetzten liegt. Wer keinen Stein mehr legen kann, verliert. Wohin
      muss, wer anfängt, den ersten Stein legen, um zu gewinnen, egal wie das
      Gegenüber spielt?
    steps:
      - Mit dem ersten Zug einen Stein in die Mitte legen, ins fünfte Kästchen.
      - "Jeden Zug des Gegenübers spiegelbildlich beantworten: mit dem Kästchen gegenüber, auf der anderen Seite der Mitte."
      - War das Kästchen des Gegenübers frei und lag nicht neben einem Stein, gilt das auch für das gespiegelte Kästchen. Also gehen dem Gegenüber zuerst die Züge aus.
    answer: In die Mitte, ins 5. Kästchen, und danach jeden Zug spiegeln.
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: wer anfängt
      second: das Gegenüber
      moves: die Zahl ist die Nummer des Zugs
    pictures:
      answer: das Gegenüber nimmt das 1., die Antwort ist das 9.
      stuck: "jedes freie Kästchen liegt neben einem besetzten: Das Gegenüber hat verloren"
    caption: >-
      Ein Streifen hat nur eine Mitte, und jedes andere Kästchen hat ein
      Spiegelbild. Deshalb hat, wer anfängt, immer noch einen Zug.

labels:
  when: "Wann es hilft:"
  task: Aufgabe · {grades}
  show: Lösung zeigen
  hide: Lösung ausblenden
  topics: "In den Themen:"

cues:
  title: Welche Technik sich anbietet
  lead: >-
    Ein Anhaltspunkt aus dem Wortlaut der Aufgabe. Keine Regel: Viele Aufgaben
    lassen sich mit zwei Techniken zugleich knacken.
  if: In der Aufgabe…
  try: …versuchen Sie
  rows:
    - „um … mehr als“, Alter, Teile eines Ganzen
    - viele Personen, Dinge und Hinweise mit „nicht“
    - große Zahlen und keine Ahnung, wo man anfangen soll
    - „auf wie viele Arten“, „wie viele Zahlen“
    - das Ende ist bekannt, gefragt ist der Anfang
    - zwei Arten von Dingen und eine Gesamtzahl
    - "etwas wiederholt sich: „welches ist das zwanzigste“"
    - „kann es passieren“, „beweise, dass es unmöglich ist“
    - „mit Sicherheit“, „mindestens zwei“
    - "ein Spiel zu zweit: „wer gewinnt“"
