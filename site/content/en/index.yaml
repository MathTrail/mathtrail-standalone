# The home page, for a parent: what MathTrail is, why not just ask the chat,
# how a lesson goes — the card of the widget at every step — and how to
# connect. The grades, the names of the traps, the card's picture, options and
# rating, the connector's address and the card's own words are not here: they
# are the catalog's numbers, the site's data, the widget's words and the
# site's own.

title: MathTrail — olympiad maths in your chat
description: "Olympiad maths for children in the chat you already use: checked tasks that do not run out, a diagnosis of every mistake and a memory of how the child is progressing."

hero:
  free: Free
  open: Free software
  # The parent's part of a lesson, which the line under the buttons tells:
  # leave the child to the task.
  laissez: Laissez-faire
  title: Olympiad maths, in the chat you already use.
  # The promise, word for word as the README gives it.
  lead: An endless stream of checked olympiad-style maths tasks for grades {range}, in any language, with a diagnosis of the child's mistake and a memory of how they are progressing.
  # How the task on the card was picked for the lesson's child: the child's
  # topics, then the chance of a right answer and the reasons. The topics and
  # the numbers are the site's data.
  pick:
    label: How the next task was picked
    title: Picked for Galt
    skills: Galt's skills
    why: Why this task
    auto: Auto-picked
    chance: "{chance} chance — in the zone"
    reasons:
      - weakest topic
      - missed the end post yesterday
      - not practised for 5 days
  see: See a lesson
  note: Pour yourself some tea while your child solves.
  caption: The Fourth of July is a good day for a first task.

# The frame a card stands in: the chat a parent already uses, with the
# parent's message above the card.
chat:
  title: Your chat
  ask: A new task, please
  progress: How is my child doing?

pillars:
  title: Why not just ask the chat?
  lead: "A chat model writes a task in a second — and slips just as fast: two options that are both right, a solution that does not add up, yesterday's task with new numbers. And if your child insists, it happily agrees. MathTrail leaves the model what it does well — writing — and checks everything else with a program."
  # A chat asked alone for a task. Its options, and which of them are right,
  # are the site's data.
  alone:
    name: Just a chat
    ask: An olympiad task for grade 3
    task: A number divides by 2 and by 3. Which number could it be?
    flag: Two correct answers — nobody checked
  # The chat alone against the chat with MathTrail, both asked what the chat
  # alone was asked, point against point.
  versus:
    asked: "“{ask}”"
    alone:
      - Two options can both be right — or none.
      - Agrees with a wrong answer if the child insists.
      - Forgets where your child went wrong.
      - "You have to know what to ask: topics, levels, what comes next."
      - Every task is a one-off, with no model of how children learn.
      - No map of what your child already knows.
    ours:
      name: Chat + MathTrail
      points:
        - "Exactly one correct option: a solver tries every case."
        - The answer is recorded with a tap — no arguing it right.
        - Remembers skills and mistakes and picks the next task.
        - "You just say “a new task”: MathTrail picks the topic and the level."
        - "A skill model built on research: Elo on top of IRT, 11 ranks."
        - A rating for every topic, and a map of which topics build on which.
  tiles:
    # The languages are named each in itself; this follows them.
    endless:
      title: Tasks do not run out.
      text: Each task is written fresh for your child's topic, level, interests and latest mistake — in your chat's language, not pulled from a fixed bank.
      more: + any
    checked:
      title: A program checks the model.
      text: "A task reaches your child only after it passes every check: one correct option, the answer reproduced by a solver, readable for the grade, not a repeat, and a picture, where there is one, labelled as the question names it, with no answer on it."
      checks:
        - one answer
        - solver
        - readable
        - not a repeat
    diagnosis:
      title: A mistake is a diagnosis.
      # The traps are the catalog's, under the names the card gives them.
      text: Every wrong option hides a named trap — “{first}”, “{second}”, “{third}”. The explanation starts from how your child reasoned, not from the right answer.
      trap: "Trap: counted the gaps, not the posts"
  behind:
    title: What sits behind every task
    # Under the words, what the parent says, and what MathTrail picks.
    coach:
      title: No need to be a teacher.
      text: You do not have to know olympiad topics or pick a level. Say “a new task” — the coach decides what to practise next and how hard it should be.
      picked: "topic + level: picked"
    research:
      title: A model built on research.
      text: The chance to solve comes from a skill model used in psychometrics — Elo on top of item response theory — and tasks stay where a child succeeds 70–85% of the time.
      formula: P = 0.2 + 0.8·σ(θ + δ − β)
    # Under the words, a topic between two it builds on, as the catalog has
    # them.
    map:
      title: A map of skills and topics.
      text: MathTrail knows which topics build on which — ordering and enumeration come before knights and liars — and keeps your child's rating in every topic.

lesson:
  eyebrow: How a lesson goes
  title: One task at a time, in your own chat.
  lead: You sit alongside; your child taps. Beside each step is the card as the chat draws it at that moment.
  # The steps in the order a lesson takes them, each beside its card.
  steps:
    generating:
      title: Ask for a task
      text: Type “a new task, please”. MathTrail picks the topic and the difficulty, the chat writes the task, and a program checks every answer before your child sees it.
    selected:
      title: Answer with a button
      text: Five options, A to E. A tap records the answer straight away — before any explanation, so nothing can talk it into being right.
    hint:
      title: Stuck? A hint, not the answer
      text: The hint points to a way in — draw a smaller fence — and the answer stays hidden until your child commits to one.
    wrong:
      title: A wrong answer becomes a lesson
      text: Each wrong option hides a known trap. The card names it from your child's side — “counted the gaps instead of the posts” — then walks through the solution.
    question:
      title: Ask why, in your own words
      text: Once the answer is in, ask in the chat — “why one more post?” — and the model answers about this very task.
    progress:
      title: Progress you can read
      text: The rank reached and the rank of every topic, the mistakes that keep coming back, what comes next — and a review for you of what goes well and what to develop.
  # The name of the child the cards show, an invented one, which the first
  # screen picks a task for.
  child: Galt
  # Two messages of the chat beneath a card answered wrong: the adult's
  # question and the model's reply, about the step and to nobody, for the adult
  # to read out to the child. They are the site's words, never the card's.
  chat:
    label: An illustration of the chat
    adult: The adult
    model: The model
    question: Why one more post?
    reply: Along the fence from the left, each gap ends with a post, so 4 gaps bring 4 posts, and the first post stands before them all. 4 + 1 = 5.

# The task of the lesson: a variant of a reference task, never one word for
# word.
task:
  question: A fence is 12 metres long. Posts stand every 3 metres, including at both ends. How many posts are there?
  hint: Try a smaller fence first, 6 metres long, with a post every 3 metres. Draw it and count the posts.
  # The trap behind each wrong option, as the card says it once that option
  # is picked: the steps pick one, and the card on the first screen any.
  traps:
    a: Gave the gap between the posts, not the number of posts.
    b: Counted the gaps instead of the posts.
    d: Multiplied the length by the gap instead of dividing it.
    e: Took the length of the fence from the question instead of counting the posts.
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4 gaps. A straight fence with posts at both ends has one post more than gaps. 4 + 1 = 5 posts.

connect:
  eyebrow: Connect
  title: A few steps to the first task.
  claude:
    pill: Works now · the free plan too
    # The steps of Claude's own help on custom connectors, as the README gives
    # them; the address follows the third.
    steps:
      open: In Claude, open {connectors}.
      add: Press **+** and choose **Add custom connector**.
      paste: "Paste the address:"
      sign: "Press **Add**, then **Connect**, and sign in with Google. MathTrail asks to keep one file in your Google Drive — your child's profile. Allow it on Google's screen: without that file there is nowhere to keep the progress."
      chat: "In a chat, press **+** → **Connectors**, switch MathTrail on and say: “Let's do a MathTrail task.”"
    # Claude's own names for the page, the same in every language.
    connectors: Customize → Connectors
    note: The free plan allows one custom connector.
  chatgpt:
    pill: Not in the directory yet
    text: Free ChatGPT accounts add apps only from ChatGPT's directory. As soon as MathTrail is listed there, find it by name, connect it and sign in with Google. It is not listed yet.
    dev: "Until then, ChatGPT's developer mode adds an app by its address, on Plus, Pro, Business, Enterprise and Education plans, on the web: turn it on and add an app with the address above, as {openai}. MathTrail is still being tested in ChatGPT."
    openai: OpenAI describes
  need: You need a Claude or ChatGPT account and a Google account; your child needs neither.

