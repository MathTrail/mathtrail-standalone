# The page "Why", for a parent: why olympiad maths is worth a child's time,
# how long people have learned it, what research has found about it, how it
# differs from a school lesson, what a parent can do, how MathTrail goes about
# it, and why it is no ordinary app. The grades, the topics' names and the
# card's own words are not here: they are the catalog's numbers and the
# widget's words. The card's options, its drawing, the history's pictures and
# the works the page cites are the site's data; a finding here says what its
# work found, no more.

title: Why olympiad maths
description: Why olympiad problems are worth a child's time, what research has found about them, and how a parent can help with MathTrail.

# The label of the note that says plainly what the page does not promise.
honest: Honestly

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: A fence is 12 metres long. Posts stand every 3 metres, including at both ends. How many posts are there?
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: Counted the gaps instead of the posts.
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4 gaps. A straight fence with posts at both ends has one post more than gaps. 4 + 1 = 5 posts.

hero:
  title: Why olympiad maths for your child
  lead: School teaches how to solve a problem by an example worked in class. Olympiad problems teach how to find a way when there is no example to follow. Up to grade {last}, a parent can prepare a child for them, and MathTrail is made for that.
  free: Free
  open: Open source
  school:
    label: A school sum
    text: You need to know how to divide.
    sum: 12 ÷ 3 = 4
  olympiad:
    label: An olympiad problem
    answer: "Answer: {answer}"
    trap: "Trap: 4 is the gaps, not the posts"
    text: You need to understand what is going on.
  caption: The same numbers. A different way of thinking.

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: Thinking with no example to follow has been taught for over two thousand years
  lead: Non-standard problems are nothing new. In many countries and many centuries, people learned to find a solution nobody had shown them and to explain why it is right, and each generation handed the skill on to the next.
  quote: “There is no royal road to geometry.”
  quoted: Euclid to King Ptolemy, who asked whether geometry could be learned more easily than through the Elements. So Proclus tells it, in the fifth century.
  # What a screen reader calls the choice of a picture.
  choice: Pictures of the history
  eras:
    - label: The ancient world · to the 6th century
      title: Proofs and books of problems
      text: The Greeks began to prove why a rule is true. In China, The Nine Chapters on the Mathematical Art gathered 246 problems with their solutions. In India, numbers came to be written with a zero, the way we still write them.
    - label: The Middle Ages and after · 9th–19th centuries
      title: A problem as a challenge
      text: In Baghdad, al-Khwarizmi wrote the book whose title gave us the word “algebra”. In Italy, mathematicians fought duels with problems, and in Japan, problems hung in temples on wooden tablets.
    - label: Late 19th and 20th centuries
      title: Problems for every child
      text: "Every child went to school, and the most curious got maths circles and olympiads: in Hungary from 1894, in Leningrad from 1934."
    - label: Today
      title: A mentor for every child
      text: "A personal mentor was once for the few: Aristotle taught Alexander the Great. Now every child can have one. The companion in the MathTrail coach never hands over the answer: like the great teachers of the past, it asks the questions that lead a child to the solution."
      link: See the coach →
  pictures:
    athens:
      place: Greece
      alt: "A fragment of a fresco: a grey-haired scholar bends over a slate and draws with compasses, four pupils around him."
      caption: Euclid draws with compasses on a slate as his pupils watch; some say it is Archimedes. A fragment of Raphael's fresco The School of Athens, 1509–1511.
    confucius:
      place: China
      alt: "A painting: a teacher sits among his pupils in the open air, and they listen and argue."
      caption: Confucius with his pupils. Counting was one of the “six arts” an educated person had to know. A 19th-century painting by an unknown artist.
    aryabhata:
      place: India
      alt: "A white statue: a scholar in a wrap stretches out his hand."
      caption: "Aryabhata, an Indian mathematician and astronomer of the 5th century. Nobody knows what he looked like: this is a modern statue in Pune."
    istanbul:
      place: The Islamic world
      alt: "A miniature: scholars in turbans at work with a globe, instruments and books."
      caption: Astronomers and mathematicians at work in Taqi al-Din's observatory in Istanbul. An Ottoman miniature of the late 16th century.
    pacioli:
      place: Italy
      alt: "A portrait: a friar and mathematician points at a slate inscribed Euclides, a pupil beside him and a glass polyhedron hanging over the table."
      caption: The mathematician Luca Pacioli with a pupil. The edge of the slate with the drawing reads “Euclides”. A portrait of 1495, attributed to Jacopo de' Barbari.
    sangaku:
      place: Japan
      alt: A wooden tablet with coloured drawings of circles and columns of characters.
      caption: "A sangaku, a tablet of geometry problems, at the Konnō Hachiman-gū shrine in Tokyo, 1859. Photo: Momotarou2012, CC BY-SA 3.0."
    rachinsky:
      place: Russia
      alt: "A painting: boys in peasant shirts stand at a blackboard with a problem and think, and one in front rests his chin on his hand."
      caption: "Pupils of a village school work out a problem from the board in their heads: (10² + 11² + 12² + 13² + 14²) ÷ 365. Nikolay Bogdanov-Belsky, Mental Arithmetic. In the Public School of S. A. Rachinsky, 1895."
    st-louis:
      place: USA
      alt: "A photograph of a class: children write columns of numbers on the board, the teacher helps a girl, and the others sit at their desks with books."
      caption: Second-graders work sums at the board. Bates School, St. Louis, early 20th century.
    moscow:
      place: USSR
      alt: "A photograph: a schoolboy at a blackboard with drawings of solid geometry looks back and smiles."
      caption: "A school exam: a pupil at the board with a problem in solid geometry. Moscow, the 1950s. Photo: Yu. D. Korolev, Main Archive of Moscow, CC BY 4.0."
    coach-canvas:
      place: MathTrail
      chip: A solution on a canvas
      alt: "A tablet's screen: a problem about posts along a road, a dotted sketch on the canvas, and beside it the fox companion's hint and the steps: understand, plan, solve, check."
      caption: "The MathTrail coach's prototype: the child draws a solution on a canvas, and the companion suggests starting with small numbers."
    coach-sheet:
      place: MathTrail
      chip: Problems from a sheet
      alt: "A tablet's screen: the camera takes a sheet of olympiad problems, and the coach has found six problems on it."
      caption: "The MathTrail coach's prototype: the child photographs a sheet of problems, and the coach finds six problems on it."
    coach-map:
      place: MathTrail
      chip: A map of topics
      alt: "A tablet's screen: a map of olympiad topics in three steps, from the basics to hard problems, and beside it the topic Enumeration and the child's rank in it."
      caption: "The MathTrail coach's prototype: a map of topics from the simple to the hard, and the child's rank in each."

research:
  title: What research has found
  lead: Olympiad problems have been set to children for more than a century, yet careful studies of what they do are few. These are four of them.
  # Each finding under a tag of where and whom, a short line in large letters
  # with a line under it, and the words of the small drawing under its text.
  findings:
    rebholz2022:
      tag: Germany · grades 3–4
      big: A course of problems
      small: and better results in two places
      title: Preparation shows at school too
      text: In Germany, third- and fourth-graders took a course of olympiad-style problems. At the Mathematical Olympiad they did clearly better than children who entered without the course, and the fourth-graders also did better on a school maths test. Their teachers had picked them for the course.
      mark:
        - at the olympiad
        - in a school test
    biondi2012:
      tag: Brazil · 2009
      big: 19 million
      small: pupils took part in one year
      title: Olympiad schools score higher in maths
      text: Brazil's maths olympiad for public schools is open to every pupil, and 19 million took part in 2009. Schools that entered it had better maths results among their ninth-graders on the national test, and better still the more years they had entered.
      mark: more years of taking part, higher scores
    agarwal2020:
      tag: The International Olympiad
      big: IMO
      small: the higher the score, the further in science
      title: Strong olympians go far in science
      text: The higher a teenager scored at the International Mathematical Olympiad, the more often they went on to a doctorate, published research, were cited and won the highest prizes in mathematics.
      mark:
        - a doctorate
        - papers
        - citations
        - top prizes
    nunes2007:
      tag: United Kingdom · age 6
      big: 16 months
      small: six-year-olds' logic foretold their maths
      title: Reasoning is learned from the age of six
      text: How well six-year-olds reasoned logically foretold their maths 16 months later. Children who were taught to reason this way made more progress in maths than children who were not.
      mark:
        from: age 6
        to: +16 months

school:
  title: School and olympiads teach different things
  lead: This is no reproach to school, which has a different job. But the knack of finding a solution when no method is given does not appear by itself. It is trained.
  lesson: A usual lesson
  olympiad: An olympiad problem
  # Above the rows, an example of each: a school sum with its answer left
  # blank, and the fence in short, with its posts.
  example: An example
  sum: 12 ÷ 3 =
  done: "The method was shown in class: all that is left is to repeat it."
  fence: A fence 12 m long, posts every 3 m, including both ends. How many posts?
  found: "No method is given, and it has to be found: 4 gaps, and one post more than gaps, so 5."
  rows:
    shape:
      label: How the problem is built
      lesson: A method is shown, then repeated on similar examples
      olympiad: No method is given, and it has to be found
    valued:
      label: What counts
      lesson: Working fast and without slips
      olympiad: Understanding what is going on, and explaining why
    mistake:
      label: What a mistake means
      lesson: A mark lost
      olympiad: A sign of where the reasoning turned the wrong way
    teaches:
      label: What it teaches
      lesson: To use a tool you know
      olympiad: To invent one when there is none

time:
  title: Why school has no time for it
  # Each card with the words of the small drawing at its foot.
  cards:
    syllabus:
      title: A syllabus for the whole class
      text: A teacher has to bring every pupil up to the standard. Hours for problems beyond the syllabus are hard to find.
      lesson: A lesson
      length: 45 minutes
      all: the syllabus for all
      extra: problems beyond it
    answer:
      title: A test sees the answer, not the thought
      text: A test checks the result. There is seldom time to go through how a child reasoned, and where exactly it went wrong.
      steps: "the working: not looked at"
      answer: "Answer: {answer}"
    circle:
      title: A maths circle is not everywhere
      text: Not every school runs an olympiad circle, and the nearest one may be far away or take only older children.
      none: none
      circle: a circle

parent:
  title: A parent can prepare a child
  note: MathTrail does not replace a teacher of olympiad maths, and a strong circle with a coach will give more. But up to grade {last} you can prepare a child for olympiads yourself.
  unneeded:
    title: You do not need
    items:
      - A degree in maths
      - To know the solutions in advance
      - To find and check problems
  taken:
    title: MathTrail takes on
    items:
      - the problems
      - the answers
      - explaining mistakes
      - picking the level
  needed:
    title: What it takes from you
    items:
      - title: Your child's curiosity
        text: An olympiad problem is a puzzle, not a test. A child should be curious, not afraid of being wrong.
      - title: To explain what it is for
        text: Not “to get top marks”, but to learn to invent a way when nobody has shown how.
      - title: Your time and interest
        text: A little time beside your child, better often than a lot at once. Your interest in a problem is catching.
  # Three moments of a lesson, each with what the child says and what the
  # parent might answer; the letters stand for who speaks.
  explain:
    title: How to explain to a child what it is for
    lead: Three common moments, and what you might say. C stands for your child.
    child: C
    you: You
    talks:
      why:
        moment: Asks “what for?”
        child: Why do I need these problems? Nobody set them.
        you: "It's like a riddle: the answer is hidden, and you can find it."
      wrong:
        moment: Gets it wrong
        child: I got it wrong again…
        you: "Here you are allowed to be wrong: a mistake shows where to think again."
      right:
        moment: Gets it right
        child: Done! The answer is five.
        you: The best part is not the answer, but how you got to it.

thinking:
  title: How MathTrail teaches to think
  lead: Not by the number of problems, but by what happens around each one.
  points:
    - title: One problem, one idea
      text: Every problem belongs to a topic, such as “{enumeration}”, “{parity}” or “{knights}”. The topics form a map, from the simple to the hard.
    - title: A problem within reach
      text: Every topic has a rating of its own. By it MathTrail chooses what comes next, the topic and the difficulty; the grade only sets the start.
    - title: A mistake is a diagnosis
      text: Behind every wrong option stands a named trap. The explanation starts from how the child reasoned, not from the right answer.
    - title: A hint instead of the answer
      text: The child can open a hint on the card, and the adult can ask in the chat, in the child's own words, “why not 6?”. The model answers about this very problem.
  topics: See the topics →
  # The name of the child the card on this page shows, an invented one.
  child: Comet
  caption: The card as a chat shows it after a wrong answer. The child and the numbers are an example.
  # Two messages of the chat beneath the card: the adult's question and the
  # model's reply, about the step and to nobody, for the adult to read out to
  # the child. They are the site's words, never the card's.
  chat:
    label: An illustration of the chat
    adult: The adult
    model: The model
    question: Why not 6?
    reply: Six would count a post twice. Along the fence from the left, each gap ends with a post, so 4 gaps bring 4 posts, and the first post stands before them all. 4 + 1 = 5.

app:
  title: Why this is no ordinary app
  lead: In a study of the apps that three-to-five-year-olds play, about two in three had designs that keep a child playing longer ({source}). MathTrail is built differently, and that can be checked.
  # A make-believe app of the kind that keeps a child at the screen, every
  # trick of it, and what MathTrail has of them.
  bait:
    coins: 12,450
    gems: "87"
    timer: 03:59 to your bonus
    cheer: You're a champion!!!
    praise: You solved 1 sum out of 1. Amazing!
    chest: Open the chest!
    hat: Dragon hat · $9.99
    premium: Go premium for ×2 coins!
    caption: Look familiar? MathTrail has none of it.
  # Each card with the short things at its foot that show what it says.
  cards:
    checked:
      title: A program checks every problem
      text: The model writes a problem and a program that solves it. The server runs the program in a sealed sandbox and checks that exactly one option is right, that the answer agrees, that the text suits the grade and that it does not repeat the text of earlier problems. A problem that fails never reaches the child.
      checks:
        - one answer
        - it adds up
        - within reach
        - not a repeat
      fails: fails → never reaches the child
    free:
      title: Free, and plainly why
      text: MathTrail has no AI of its own. The problem is written by the model of your chat, within your plan, and Claude's free plan will do. The server has almost nothing to pay for, so there are no subscriptions, no ads and no locked topics.
      price: $0
      none:
        - subscriptions
        - ads
        - locked topics
    data:
      title: The data stays with you
      text: The child's profile is a file in your Google Drive. Only the answer and the solution of the problem being solved are sealed, so that the child cannot peek. The server keeps nothing between requests and sells nothing.
      # After the name of the profile's file.
      where: your Google Drive
      server: "on the server: nothing"
    screen:
      title: Nothing to keep a child at the screen
      text: No coins, no chests, no timers, no ads. Once the problem is solved, the chat can be closed and the problem talked over at dinner.
      none:
        - coins
        - chests
        - timers
        - ads
      after: problem solved → dinner
