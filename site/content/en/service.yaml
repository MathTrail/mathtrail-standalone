title: How the service works
description: "How MathTrail works inside: the parts of the service and how they link, a lesson call by call, where its state lives, the profile's file in the parent's Drive and what is sealed in it."
hero:
  badge: For technical readers
  title: How the service works
  lead: "MathTrail stands between the chat a family already uses and the parent's Google Drive. The chat's model writes every task, and the service decides whether it reaches the child. It is one program: it calls no model of its own and keeps nothing between requests."
  chips:
    - One Go binary on Cloud Run
    - Stateless
    - No database
    - No LLM calls of its own
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail in three tiers
  client:
    title: Chat client
    tag: 1 · client
    others: other MCP Apps hosts
    note: The chat's model writes the task, and the card shows it to the child.
  mcp: "{via} · tool calls over HTTPS"
  cloud:
    title: MathTrail on Google Cloud
    tag: 2 · runtime
    sub: Cloud Run · one Go binary · stateless
    core: The core — pure computation
    around: "Around it: OAuth, the MCP server, the card, sealing, limits."
  drive: "{via} · with the parent's own token"
  storage:
    title: Google Drive
    tag: 3 · storage
    note: One file per child, in the parent's own Drive — the only thing kept for long.
map:
  title: The map
  lead: Who talks to whom. Neither the child nor the adult reaches MathTrail directly — they talk to the chat host. Everything in the middle block is a part of one process, not a separate service. Choose any part to see what it does and what it links to.
  legend: Parts of the service
  whole: Nothing chosen
  hint: "Choose a part of the map: everything it links to stays bright, and the rest fades."
  linked: Links to
  reset: Clear ✕
  columns:
    family:
      title: The family's chat
      sub: Claude in a browser, on a computer and on a phone · ChatGPT
    service:
