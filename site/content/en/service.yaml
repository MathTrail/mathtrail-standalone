      sub: One Go binary · Cloud Run · a domain of its own
      tag: between the parts, plain function calls
    outside:
      title: Google and GitHub
      sub: The only services outside the binary
  groups:
    people:
      title: People
      short: The family's chat
    host:
      title: Chat host
      short: Chat host
    entry:
      title: The way in
      short: MathTrail · the way in
    tools:
      title: Tools — read the profile, compute, write it back
      short: MathTrail · tools
    core:
      title: Pure computation — no network
      short: MathTrail · pure computation
    around:
      title: Around the core
      short: MathTrail · around the core
