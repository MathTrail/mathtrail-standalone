      title: The parent's Google account
      short: The parent's Google account
    cloud:
      title: Google Cloud
      short: Google Cloud
    github:
      title: GitHub
      short: GitHub
  parts:
    adult:
      name: Adult
      sub: Parent or tutor · the one who signs in
      about: "A parent or a tutor. Owns both the chat account and the Google account: connects MathTrail, signs in once, creates the profile, runs the lesson in the chat and follows the progress. The only one who signs in, and the only one who types."
    kid:
      name: Child
      sub: Grades 1–6 · no sign-in of their own
      about: Grades 1–6. Solves tasks on the card, in the adult's chat. Has no sign-in of their own.
    model:
      name: The host's model
      sub: Writes the task, the solver, the explanations
      about: Claude or ChatGPT. Writes the task, a Starlark solver, an explanation behind each wrong option and a self-check; leads the lesson in words wherever cards are not drawn. MathTrail itself calls no model.
    appsrt:
      name: MCP Apps runtime
      sub: The sandboxed frame the card lives in
      about: Draws the card in a sandboxed frame, passes it the language, the platform and the size, and forwards the card's own calls with the host's token — the card itself never sees the token.
    cimd:
      name: Client metadata document
      sub: The host's client_id is an HTTPS address
      about: The host names itself by an HTTPS address. MathTrail fetches the document at that address, guarded against SSRF, rather than keeping a registry of clients.
    router:
      name: HTTP router
      sub: /mcp · /oauth/* · /health
      about: "The only way in: /health, /mcp, the OAuth endpoints and .well-known. Timeouts, a limit on the body's size, an Origin check; the issuer is its own domain, and any other Host gets a 404."
    authsrv:
      name: Authorization server
      sub: OAuth 2.1 + PKCE, consent
      about: "MathTrail is its own OAuth 2.1 server with PKCE: metadata, a consent screen of its own, sign-in with Google, tokens, renewal and revocation. Everything a server with state would keep is sealed into tokens and cookies."
    mcpsrv:
      name: MCP server
      sub: Streamable HTTP, stateless
      about: "The protocol: Streamable HTTP 2026-07-28, stateless, on the official Go SDK. It lists and calls the tools, serves the card as a ui:// resource and hands the model its instructions with their version."
    limits:
      name: Limits
      sub: Per address, per account, per day
      about: A pace per address before sign-in and per account after it, and an overall ceiling, all in memory — then the daily ceilings, which the profile counts. Past a limit, a plain sentence the model passes on.
    tools:
      name: Tools
      about: "Twelve tools of one shape: read the profile, compute, write it back. The model calls most of them; the card calls its own — for the task, the answer, the progress and the profile's form. Nothing secret ever goes into a result."
    rule:
      name: The rule
      sub: Topic, goal, difficulty corridor
      about: "Picks the brief deterministically: after a mistake, the same topic, to consolidate it; otherwise the topic not seen for the longest; the difficulty from the corridor where the chance of success is 70–85 %."
    rating:
      name: Ratings
      sub: θ, δ, β · Elo over IRT
      about: P = 0.2 + 0.8·σ(θ + δ − β). Elo moves only on whether an answer is right, with a step that shrinks; a chess scale and eleven ranks; a topic counts as mastered by a cautious estimate.
    checks:
      name: Checks
      sub: What a handed-in task must pass
      about: "What a handed-in task must pass: its structure and five different options, the letters of the lesson's language, distinct explanations, the solver, the self-check, readability, near-duplicates and the picture: its format, its labels against the question, and no answer written on it. Every failure is reported at once."
    solver:
      name: Solver
      sub: Starlark sandbox, step limit
      about: Runs the model's Starlark program, which tries the options; exactly one must come out right. Limits on steps and time, no network and no files.
    content:
      name: Content
      sub: Catalogs, reference tasks, instructions
      about: "Everything built into the binary that is not code: the catalogs of topics, traps and skills, the reference tasks, the schemas, the solver templates, an example of each kind of picture and the model's instructions with their version."
    widget:
      name: Widget
      sub: The card · one HTML file
      about: "The card: Preact built into one HTML file that loads nothing from elsewhere, the languages' dictionaries inside it. The layout works from 320 px, and the buttons fit a finger."
    store:
      name: Store
      sub: The profile and the current task
      about: Finds the profile by a hidden mark, compares before it writes, reconciles two tabs, restores the file from Drive's pinned revisions when the parent asks — and keeps within a small budget of Drive calls.
    seal:
      name: Sealing
      sub: Tokens and the sealed answer
      about: "One mechanism, two jobs: it seals the sign-in and Google's tokens into the tokens the host holds, and a task's answer — the current task's and the one written ahead — into the profile. The keys come from Secret Manager and rotate by key id."
    logs:
      name: Logging
      sub: Summaries, no personal data
      about: "One structured summary per call: the tool, the outcome, the duration, the instructions version; attempts and the reasons for a refusal as events of the task. No personal data, no task text, no answers."
    boot:
      name: Container and configuration
      sub: Environment, version, shutdown
      about: Wires the parts together and closes them in reverse order, works with timeouts and a graceful shutdown, reads all its configuration from the environment — and refuses to start on Cloud Run with development switches.
    goauth:
      name: Google OAuth
      sub: drive.file alone
      about: The parent's sign-in with the drive.file scope alone, renewal and revocation. Revoking any token ends all access.
    gdrive:
      name: Drive API v3
      sub: The only long-term storage
      about: "The only long-term storage: one JSON profile in a visible MathTrail folder of the parent's Drive, read and written with the parent's own token."
    sm:
      name: Secret Manager
      sub: Sealing keys, the client secret
      about: "The sealing keys and Google's client secret: pinned versions, read once when an instance starts."
    ar:
      name: Artifact Registry
      sub: The image, by digest
      about: The image of every revision, by digest; old images are deleted.
    clog:
      name: Cloud Logging
      sub: Where stdout goes
      about: Where the service's stdout goes. The lines children are counted by are kept for 62 days in a bucket of their own.
    bq:
      name: BigQuery → Data Studio
      sub: Counts kept for years
      about: Counts of use are kept for years and counted again every night; no table holds the name a child is counted under. A private report and a public one, which shows no group of fewer than ten children.
    ga:
      name: Actions
      sub: Build, checks, deploy
      about: The build, the checks, publishing the image and the deploy through Workload Identity Federation — with no service-account keys.
    pages:
      name: Pages
      sub: This site, the policy and the terms
      about: "This site: the topics' pages, and the privacy policy and the terms the consent screen links to."
