flow:
  title: A lesson, call by call
  lead: The model and the card call the same tools and stand on one source of truth — the profile's file in the parent's Drive. For a lesson to go on, they have nothing to tell each other.
  legend: Scenario
  scenarios:
    task: Task
    answer: Answer
    signin: Sign-in
  kinds:
    call: a call
    reply: its answer
    host: inside the host
  actors:
    adult: Adult
    kid: Child
    card: Card
    model: The host's model
    service: MathTrail
    drive: Drive
    browser: The parent's browser
    host: Host
    google: Google
  task:
    rows:
      - “a new task, please”
      - next_task
      - "The host draws the card as soon as the call begins: “Preparing the next task…”"
      - limits · the rule picks the topic, the level and the difficulty
      - write the open request
      - the request is open — fetch the package
      - get_package
      - brief · 3 reference tasks · traps · templates · picture examples
      - The model writes the task, a Starlark solver and a self-check
      - submit_task — up to 3 attempts
      - checks · the solver must find exactly one right option
      - the task becomes the current one, its answer sealed
      - read_task — the card asks every 4 s
      - text · picture · five options · hint — no answer
    caption: "Every call reads the profile from Drive as well — those reads are left out. The card that waits never sees the package: its reference tasks carry their answers. While the child solves, the model writes the next task ahead with prepare_task, and when another is asked for, next_task puts it on a new card at once — without this wait."
  answer:
    rows:
      - presses C
      - submit_answer — the chat spends no turn
      - the first answer alone · the seal is opened now · θ and δ move only on whether it is right
      - write the ratings and the history
      - right or not · the trap behind C · the picture of the solution · the steps · the rating before → after
      - The card turns into how the answer went, in the task's place
      - ui/update-model-context — one line, read with the adult's next message
      - “why one more post?”
      - answers about this very task, adding to the card
    caption: The press records the answer before anything is explained, and the card turns into how it went at once. The chat spends no turn, and the model draws nothing. It reads the card's line with the adult's next message, and answers a question about the task without retelling the card. If the host's line to the model is lost, the model catches up at its next call.
  signin:
    rows:
      - POST /mcp, no token
      - 401 · where the metadata is
      - opens /oauth/authorize · PKCE S256
      - authorize
      - "A consent screen of its own: which client, and where it will send the parent back"
      - sign-in with Google · drive.file alone
      - back, with Google's code
      - /oauth/callback
      - exchange the code
      - /about — whose Drive is it?
      - user id = HMAC of the Drive account · Google's tokens sealed into our code
      - 302 · code = mt1.c.…
      - hands the code back
      - /oauth/token · code + verifier
      - access 15 min · refresh 30 days
    caption: "The parent signs in once. The service keeps nothing of this exchange: the request travels in a sealed state, and Google's tokens in a sealed code."
  machine:
    title: The current task as a state machine
    lead: Every “only once” rule is a field of the profile, checked within the same read, computation and write. Nothing else remembers anything.
    forward:
      - brief ready
      - sealed, handed out
      - recorded once
    turns:
      - refused, attempts left — no more than three per request
      - three refusals, or 15 minutes from the request's opening; the day's tasks are not spent, and three refusals count as a failed request of the day
      - “Another task” before an answer — a skip is recorded, the rating untouched
      - any later answer — from a second tab or from the model — gets the first result back and writes nothing
      - the next task, on a new card; the one answered is no longer current
      - the next task was written ahead — next_task puts it on a new card at once, skipping requested
      - the seal can no longer be opened — the key rotated twice; nothing is recorded
state:
  title: Where the state lives
  lead: "Everything a server with state would keep in a database is kept by someone else: in a sealed token the chat holds, in a cookie in the parent's browser, or in the parent's own Drive. Restart the service or start a second copy — nothing is lost."
  self:
    label: MathTrail itself
    value: Nothing
    note: No accounts, no sessions, no registrations, no Google tokens. Every request carries all it needs.
  stores:
    tokens:
      title: The chat's token store
      sub: Sealed tokens, opaque to the host
      rows:
        access:
          name: Access token
          life: 15 min
        refresh:
          name: Refresh token
          life: 30 days, ≤ 90
      note: Sealed inside are Google's tokens, an opaque user id for the limits, and the country the parent signed in from.
    browser:
      title: The parent's browser
      sub: Two cookies, no session
      rows:
        approvals:
          name: Approved clients
          life: 180 days
        csrf:
          name: Sign-in guard (CSRF)
          life: 10 min
      note: Losing them costs one more consent screen, or a new sign-in.
    drive:
      title: The parent's Drive
      sub: The only thing kept for long
      rows:
        profile:
          life: until deleted
      note: The profile, the ratings and the current task, its answer sealed. The parent can open the file, and Drive keeps its history.
    secrets:
      title: Secret Manager
      sub: Read once, when an instance starts
      rows:
        keys:
          name: Sealing keys
          sub: after a rotation, the previous key is still accepted
          life: 90 days
        client:
          name: Google's client secret
          life: pinned
    memory:
      title: The instance's memory
      sub: "Caches alone: lost on a restart, and nothing breaks"
      rows:
        rates:
          name: Request rate counters
          life: minutes
        location:
          name: Where the profile's file is
          life: 10 min
        clients:
          name: Clients' documents
          life: 5 min – 24 h
  absent:
    title: Left out of v1 on purpose
    items:
      - A database
      - Queues
      - A session store
      - A shared cache
      - A bank of ready tasks
      - An LLM API client
      - REST and OpenAPI
profile:
  title: The profile's file
  lead: "One child, one JSON file: not a cache of some truth on a server, but the truth itself. Every block has a cap, held on every write, so the file never grows without a bound: a usual one keeps within the target, and one near its caps goes past it. Past tasks are kept as fingerprints, not as text."
  size: The file's size
  legend: Which size to show
  typical: Usually
  cap: Near the caps
  total: "≈ {kb} KB"
  kb: "{kb} KB"
  goal: "target {kb} KB"
  segment: "{name} · {typical} / {cap} KB"
  heads:
    block: Block
    holds: What it holds
    writers: Who writes it
    size: Size
  blocks:
    fingerprints:
      name: Fingerprints
      holds: Up to 200 sketches of the tasks handed out, for the near-duplicate check — no text, no topic, no date
    history:
      name: Rating history
      holds: Where θ and the topic's δ stood before each recent answer, and θ and every topic at the start of each of the last 7 days with answers
    ratings:
      name: Ratings and topics
      holds: "θ and where the child started; for each topic: δ, the answers, the traps they fell into, mastery and its level"
    recent:
      name: Recent answers
      holds: The last 20 answers and skips — and never fewer than the 5 answers the rule reads
    sealed:
      name: Current task, sealed
      holds: The answer, the trap behind each wrong option, the solution and the solver — one opaque string
    open:
      name: Current task, open
      holds: "What the card shows: the text, the picture, five options, the hint — and, after the answer, the answer itself"
    request:
      name: Open request
      holds: "While the task is being written: its id, the brief, the attempts used and who picked the topic"
    service:
      name: Service and child
      holds: The schema version, a random UUID, the revision; the pseudonym, the grade, the interests, the notes; the day's counters
  every-write: every write
  note: "A task written ahead lies beside the current one and weighs about as much. What the file does not hold: the texts of past tasks, the answer in the open until the child has answered, anything that names the parent, and a rank — ranks are computed when they are shown. Drive has no conditional write, so the file is read again before a save, and the write is refused if it has changed: two tabs never silently overwrite each other."
seal:
  title: Sealed — and for how long
  lead: "One mechanism does two jobs: it seals the sign-in into the tokens the chat holds, and a task's answer — the current task's and the one written ahead — into the profile. Each seal carries its purpose, so an access token cannot pass for a refresh token, and a sealed answer cannot pass for anything else."
  token:
    title: A token, taken apart
    version: the format's version
    purpose: purpose
    purposes:
      c: code
      a: access
      r: refresh
      d: client
      s: state
      k: consent
      t: a task's answer
    key: key id
    key-note: taken from the key itself, so a rotation goes unnoticed
    cipher: ciphertext
    cipher-note: XChaCha20-Poly1305, a random 192-bit nonce
    note: "Not a JWT: no one but the service reads it, and no claim can leak into a log from an opaque string."
  life:
    title: Lifetimes, on a logarithmic scale
    ticks:
      - 1 min
      - 1 h
      - 1 day
      - 1 week
      - 6 months
    items:
      code:
        name: Authorization code
        life: 60 s
      signin:
        name: Sign-in in progress
        life: 10 min
      access:
        name: Access token
        life: 15 min
      refresh:
        name: Refresh token
        life: 30 days, sliding, 90 at most
      key:
        name: Sealing key
        life: rotated every 90 days
      approvals:
        name: Approved clients
        life: 180 days
    note: A server without state cannot mark a code as used, so the code's window is kept small. After a rotation the previous key is still accepted, so neither a token nor a sealed answer is lost when the key changes.
