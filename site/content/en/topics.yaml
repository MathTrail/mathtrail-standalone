# The page of the topics: what a child's tasks are about, how the topics build
# on one another, and every topic of the catalog with a drawing and a line for
# the parent. A topic's name is the card's own, from the widget's words; its
# grades and its links are the catalog's, and its group the site's data.

title: Topics in MathTrail
description: Every topic MathTrail sets tasks in, how the topics build on one another, and what each is about.

hero:
  title: What tasks your child solves
  lead: Every MathTrail task belongs to one topic. Here are all of them, what their tasks are like, and how some topics stand on others.
  # The name of the child the card on this page shows, an invented one.
  child: Comet
  caption: The progress as a chat shows it, with a rank in every topic. The child and the numbers are an example.

map:
  title: How the topics link
  lead: Some topics stand on others. Enumeration is needed for the pigeonhole principle and for knights and liars alike. When a child is stuck, it helps to step back to the topic a hard one stands on.
  layers:
    - step: Step 1
      name: Foundations
      lead: Almost no prior knowledge.
    - step: Step 2
      name: Rules
      lead: Reasoning by hand becomes a rule.
    - step: Step 3
      name: Hard problems
      lead: Several ideas to hold in mind at once.
  hint: Point at a topic, or reach it with Tab, to light up what it stands on and what it opens.
  # Said under the map while a topic is pointed at: its name, every topic
  # below it, and every topic above it.
  say: "**{topic}** · first: {before} · opens: {after}"
  foundation: nothing, it is a foundation
  summit: nothing, it is a summit
  legend:
    first: First
    topic: Topic
    then: Then

groups:
  label: Groups of topics
  logic: "Reasoning: suppose, draw the consequence, find the contradiction."
  counting: Count every case, and leave none out.
  time: Clocks, days of the week and years, and what changes with them.
  numbers: Numbers where the idea matters more than the speed of counting.
  parts: "A whole cut into parts: shares, percentages and ratios."
  games: Find the plan that works whatever the other player or the scales do.

# Every topic of the catalog, by its slug: a line for the parent. Its card's
# drawing is the site's data, the site's own illustration and never a reference
# task's; the words of a drawing of the site's own are here.
topics:
  ordering:
    phrase: "Who is taller, older, faster: line everyone up from a few clues."
  knights-and-liars:
    phrase: Some always tell the truth, the others always lie. Work out who is who from what they say.
  enumeration:
    phrase: List every case in order, so that none is lost and none counted twice.
  gaps-and-boundaries:
    phrase: "Posts and spans, floors and stairs: when to add one, and when not to."
  clocks:
    phrase: "How much time has passed, and what the time will be: the hands, the dial, going past noon."
  calendar-and-age:
    phrase: Days of the week, months and ages. A gap in age never changes, and the week comes round again.
  pigeonhole-principle:
    phrase: With more pigeons than holes, some hole is bound to hold two.
  parity-and-alternation:
    phrase: "Even and odd, every other one: what can be known without counting it all."
  arithmetic-with-a-trick:
    phrase: "Count cleverly: reorder, group, and spot the easy way before working it out."
  weighing-and-pouring:
    phrase: Find the fake coin in the fewest weighings, or measure out water with jugs that have no marks.
  parts-and-shares:
    phrase: "A half, a third, a quarter: a part of the whole, and the whole from its part."
  percentages:
    phrase: How much that is in percent, and of what. A percent is one hundredth.
  ratios-and-sharing:
    phrase: Share in the ratio 2 to 3, and find how much one part is.
  figures-on-a-grid:
    phrase: Area and perimeter by the squares. Cut, fit together, and count without missing one.
  divisibility-and-remainders:
    phrase: Whether a number divides evenly, and what is left over when it does not.
  overlapping-groups:
    phrase: Some children go to two clubs at once. How not to count them twice.
  winning-strategy:
    phrase: Who takes the last match? Look for the positions that win whatever the other player does.
