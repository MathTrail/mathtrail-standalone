live:
  title: Données réelles
  lead: On voit ici, mois après mois, si les promesses du modèle se réalisent chez de vrais enfants. Les chiffres viennent du journal des réponses, sans aucun nom ni aucun texte de problème.
  rule: Une tranche n’est affichée que si elle compte au moins {children} et au moins {answers}, et chaque effectif y est arrondi à un multiple de {rounded}. Une tranche plus petite est omise plutôt que fusionnée avec une autre.
  measures:
    chances: Promis → réalisé
    kept_up: Réalisé − promis, selon le nombre de réponses
    share: La part de bonnes réponses aux problèmes de la règle
  frame:
    coming:
      badge: À venir
      when: Les chiffres arrivent une fois qu’un mois entier est compté, au début du mois suivant.
    too_few:
      badge: Trop peu pour l’instant
      when: En {month}, trop peu d’enfants ont répondu aux problèmes de la règle pour qu’un seul chiffre puisse être affiché.
  ready:
    month: "En {month} : {children} et {answers} aux problèmes choisis par la règle."
    weighed: Seules les réponses aux problèmes choisis par la règle sont prises en compte, après la série d’essai de {trial} et sans l’indice, tous chats confondus.
    corridor: La part des problèmes dans le couloir ne peut pas se mesurer sur des réponses réelles, puisque chaque problème ne reçoit qu’une réponse.
    columns:
      promised: Promis
      came_true: Réalisé
      answers: Réponses
      children: Enfants
    chances:
      none: Ce mois-ci, aucune tranche de probabilité promise ne compte assez d’enfants pour être affichée.
      shown:
        caption: Chaque tranche de probabilité promise est un point, d’autant plus gros qu’elle compte de réponses. Sur la diagonale en pointillés, la promesse s’est réalisée, et la bande est le couloir dans lequel la règle choisit les problèmes.
        up: ↑ part de bonnes réponses
        across: probabilité promise →
        ideal: promesse tenue
        band: couloir
        range: "{from}–{to}"
        heading: Probabilité promise
    kept_up:
      none: Ce mois-ci, aucune tranche des réponses de l’enfant ne compte assez d’enfants pour être affichée.
      shown:
        caption: Une bonne réponse compte pour un et une mauvaise pour zéro ; on en retranche la probabilité promise, et on fait la moyenne de la différence sur les réponses. À droite de la ligne en pointillés, les enfants ont fait mieux que promis, et une moustache s’étend d’une erreur type de chaque côté, calculée par enfant.
        range: "{first}–{last}"
        open: "{first} et au-delà"
        heading: Numéro de réponse
        margin: Réalisé moins promis
        error: Erreur type
    share:
      expected: attendu ≈ {middle}, le milieu du couloir
      caption: La règle demande le problème dont la probabilité de réussite est la plus proche de {middle}, le milieu du couloir qui va de {low} à {high}. Le point est la part de bonnes réponses, et la ligne en pointillés, le milieu du couloir.

sources:
  title: D’où viennent les problèmes de référence
  lead: Le droit d’auteur ne protège pas les idées, mais il protège les textes. C’est pourquoi, d’un livre, on ne prend que l’idée d’un problème et sa réponse ; l’énoncé, l’histoire, les réponses proposées et les pièges sont réécrits.
  authors:
    perelman:
      name: Yakov Perelman
      books:
        firsthundred: For Young Mathematicians. The First Hundred Puzzles
        secondhundred: The Second Hundred Puzzles
        living: « Oh, les maths ! »
        arithmetic: Entertaining Arithmetic
        quick: Quick Reckoning
    ignatyev:
      name: Emelian Ignatiev
      books:
        wit: In the Realm of Ingenuity, or Arithmetic for Everyone
    dudeney:
      name: Henry E. Dudeney
      books:
        amusements: Amusements in Mathematics
        canterbury: « Les Énigmes de Canterbury »
    loyd:
      name: Sam Loyd
      books:
        cyclopedia: Cyclopedia of Puzzles
    carroll:
      name: Lewis Carroll
      books:
        tangled: « Un Conte embrouillé »
        pillow: « Énigmes mathématiques de Lewis Carroll »
  died: † {year}
  public: Dans le domaine public
  public_note: Les droits d’auteur sur ces livres ont expiré. Ils appartiennent à tous, et chacun peut les utiliser gratuitement.
  total: Au total, {count} {noun}
  each: chacun avec un solveur et un piège derrière chaque mauvaise réponse
  level: "{count} · niveaux {first}–{last}"
  note: Le style suit celui des recueils soviétiques. Un problème de référence n’a pas de champ pour sa source, si bien que l’auteur de l’idée d’un problème ne peut pas être nommé.

