    corridor_static:
      name: Problèmes dans le couloir {low}–{high}
      unit: l’enfant qui stagne · part des problèmes, plus c’est mieux
  interval: "{low}–{high}"
  goal_at_most: objectif ≤ {bound}
  goal_at_least: objectif ≥ {bound}
  ceiling: plafond {value}
  marks:
    reached:
      name: Atteint
      means: Tout l’intervalle se trouve du bon côté de l’objectif.
    on_the_edge:
      name: À la limite
