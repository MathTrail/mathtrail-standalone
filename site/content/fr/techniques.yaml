# The page of the techniques of olympiad problem solving, for a parent, in
# French. Which techniques there are, their groups and order, the topics each
# one leads to, and each example's level and the answer its solver proves are
# the site's data; the words here follow them, technique by technique. The
# pictures of a technique's steps are laid out by the page, and only their
# words are here.

title: Techniques de résolution de problèmes de maths
description: Les techniques de résolution de problèmes qui débloquent de nombreuses énigmes de maths d’olympiade à la fois, chacune avec un problème corrigé et un dessin.

hero:
  title: Techniques pour résoudre les problèmes de maths d’olympiade
  lead: >-
    Un problème d’olympiade n’est pas livré avec une méthode toute faite. En
    revanche, il existe des techniques qui marchent pour de nombreux problèmes
    à la fois. Voici les {count} qui reviennent le plus souvent, chacune avec
    un problème, un dessin et une solution.
  advice: >-
    Essayez de résoudre le problème avec votre enfant avant d’ouvrir la
    solution. Le plus important est de remarquer quelle technique a marché,
    pour la reconnaître la prochaine fois.

start:
  title: Par où commencer n’importe quel problème
  lead: >-
    Avant de choisir une technique, il est utile de passer par quatre phases.
    Le mathématicien George Pólya les a exposées dans son livre
    *Comment poser et résoudre un problème* (1945).
  steps:
    - title: Comprendre le problème
      text: Dis-le avec tes propres mots. Qu’est-ce que tu sais ? Qu’est-ce que tu dois trouver ?
    - title: Concevoir un plan
      text: À quoi est-ce que ça te fait penser ? Quelle technique de cette page pourrais-tu essayer ?
    - title: Mettre le plan à exécution
      text: Étape par étape, en notant ce que donne chacune.
    - title: Revenir sur la solution
      text: Remets la réponse dans l’énoncé. Est-ce que tout colle ? Pourrait-il y avoir une autre réponse ?

groups:
  see:
    title: Voir le problème
    lead: >-
      D’abord, il faut comprendre le problème. Ces techniques transforment les
      mots en dessin, en tableau ou en petit exemple.
  find:
    title: Trouver la réponse
    lead: >-
      Une fois qu’on a compris ce qui se passe, ces techniques mènent à la
      réponse sans rien perdre en chemin.
  prove:
    title: Le démontrer
    lead: >-
      Aux olympiades, la question n’est souvent pas « combien » mais
      « est-ce possible ». Alors, compter ne suffit pas : il faut expliquer
      pourquoi il ne peut pas en être autrement.

techniques:
  draw:
    name: Dessiner le problème
    what: >-
      Un dessin ou un schéma transforme les mots en quelque chose qu’on peut
      regarder. Des traits, des points et des flèches suffisent ; pas besoin
      que ce soit joli.
    when: « tant de plus que », âges, trajets, parties d’un tout.
    task: >-
      Un frère a 4 ans de plus que sa sœur. À eux deux, ils ont 16 ans. Quel
      âge a le frère ?
    steps:
      - On représente l’âge de la sœur par une barre, et celui du frère par la même barre plus 4 ans.
      - "On enlève les 4 ans en trop : 16 − 4 = 12. Cela fait deux barres égales."
      - "Une barre vaut 12 ÷ 2 = 6 ans : c’est la sœur. Le frère a 6 + 4 = 10 ans."
    answer: Le frère a 10 ans.
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: "en haut : la sœur, en bas : le frère ; ensemble 16 ans"
      less: 16 − 4 = 12, deux barres égales
      found: le frère a 6 + 4 = 10 ans
    caption: >-
      Le schéma montre ce qu’il est difficile de garder en tête : sans les
      quatre ans en trop, le frère et la sœur ont le même âge.
  table:
    name: Faire un tableau
    what: >-
      Quand il y a beaucoup de données, il est difficile de les garder en tête.
      Un tableau les garde pour vous : chaque donnée est une croix, et là où
      une ligne n’a plus qu’une case libre, c’est la réponse.
    when: plusieurs personnes, plusieurs choses, et des données avec « pas ».
    task: >-
      Adam, Billie et Jade ont un chat, un chien et un perroquet, un animal
      chacun. Adam n’a pas le chat. Billie a peur des chiens. Le chat ne vit
      pas chez Billie. Qui a quel animal ?
    steps:
      - "On met une croix pour chaque donnée : Adam, pas le chat ; Billie, pas le chien ; le chat, pas chez Billie."
      - "Il ne reste à Billie qu’une case : le perroquet. Donc ni Adam ni Jade n’ont le perroquet."
      - Il reste le chien à Adam, et le chat à Jade.
    answer: Adam a le chien, Billie le perroquet, Jade le chat.
    pictures:
      children:
        anya: Adam
        borya: Billie
        vera: Jade
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: A
        borya: B
        vera: J
      pets:
        cat: chat
        dog: chien
        parrot: perroquet
    caption: Le petit nombre dans une case indique à quelle étape de la solution elle a été marquée.
  small-numbers:
    name: Commencer par de petits nombres
    aka: Un cas particulier
    what: >-
      Quand les nombres sont grands et que vous ne voyez pas par où commencer,
      résolvez le même problème avec de petits nombres. Repérez la règle, puis
      appliquez-la aux grands.
    when: grands nombres, « cent », « mille », longues rangées.
    task: >-
      Le long d’une route de 100 mètres, on plante un poteau tous les 5 mètres,
      y compris aux deux bouts. Combien faut-il de poteaux ?
    steps:
      - "On ne peut pas dessiner cent mètres, alors on prend une route de 10 m. Poteaux à 0, 5 et 10 m : 3 poteaux pour 2 intervalles."
      - "Pour 15 et 20 m, c’est pareil : il y a toujours un poteau de plus que d’intervalles."
      - Sur 100 m, il y a 100 ÷ 5 = 20 intervalles, donc il y a 21 poteaux.
    answer: 21 poteaux.
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: "10 m : 2 intervalles, 3 poteaux"
      fifteen: "15 m : 3 intervalles, 4 poteaux"
      twenty: "20 m : 4 intervalles, 5 poteaux"
      table: la route en mètres, ses intervalles et ses poteaux
    caption: >-
      La règle se voit déjà sur une route courte ; ensuite, il suffit de
      l’appliquer à cent mètres.
  systematic:
    name: Énumérer avec méthode
    what: >-
      Énumérer au hasard, c’est forcément oublier quelque chose ou le compter
      deux fois. Énumérer avec méthode, c’est avancer dans l’ordre : d’abord
      selon un critère, puis selon le suivant. Un arbre des possibles est
      pratique pour cela.
    when: « de combien de façons », « combien de nombres », « écris toutes les possibilités ».
    task: >-
      Combien de nombres différents à deux chiffres peut-on former avec les
      chiffres 2, 4, 6 et 8, si aucun chiffre n’est utilisé deux fois dans un
      même nombre ?
    steps:
      - "On choisit un ordre : d’abord le chiffre des dizaines, puis celui des unités."
      - Le chiffre des dizaines est 2, 4, 6 ou 8. Chacun en laisse trois autres pour les unités.
      - "On les écrit branche par branche : 24, 26, 28, 42, 46, 48, 62, 64, 68, 82, 84, 86. Aucun n’est oublié, et aucun n’est répété."
    answer: 12 nombres.
    pictures:
      first: le premier chiffre est l’un des quatre
      total: 4 branches × 3 nombres = 12
    caption: "L’arbre ne laisse rien échapper : chaque premier chiffre a ses propres branches."
  backwards:
    name: Partir de la fin
    aka: Raisonner à rebours
    what: >-
      Quand vous savez comment l’histoire se termine et qu’on vous demande
      comment elle a commencé, remontez le fil. Changez chaque action en son
      contraire : « a mangé » en « a rendu », « a multiplié » en « a divisé ».
    when: on sait ce qu’on a obtenu à la fin, et il faut trouver ce qu’il y avait au début.
    task: >-
      Il y avait des pommes dans une coupe. Sophie en a mangé la moitié. Puis
      Pierre a mangé la moitié de ce qui restait, et une pomme de plus. Il est
      resté 2 pommes. Combien de pommes y avait-il au début ?
    steps:
      - "On part de ce qu’on sait : à la fin, il restait 2 pommes."
      - "Avant Pierre : on rend la pomme en plus, 2 + 1 = 3. C’était la moitié, donc il y en avait 6."
      - "Avant Sophie : 6 était la moitié, donc il y en avait 12. Vérification : 12 → 6 → 6 − 3 − 1 = 2."
    answer: 12 pommes.
    pictures:
      end: à la fin
      undo-petya: +1, ×2
      undo-tanya: ×2
      check: "vérification :"
    caption: >-
      On va de droite à gauche et on fait tout à l’envers :
      « a mangé la moitié » devient « fois 2 », « a mangé une de plus »
      devient « plus 1 ».
  all-the-same:
    name: Supposer qu’ils sont tous pareils
    aka: La méthode de fausse position
    what: >-
      Quand un problème parle de choses de deux sortes, imaginez qu’elles sont
      toutes de la même sorte. Calculez de combien le résultat s’écarte, et
      vous verrez combien il faut en échanger.
    when: "deux sortes de choses et un total connu : têtes et pattes, pièces de deux valeurs."
    task: >-
      Des poules et des lapins se promènent dans une cour. Ensemble, ils ont
      10 têtes et 28 pattes. Combien y a-t-il de lapins dans la cour ?
    steps:
      - Supposons que les 10 soient des poules. Il y a alors 10 × 2 = 20 pattes.
      - "En réalité, il y a 28 pattes : 8 de plus."
      - "Chaque lapin à la place d’une poule ajoute 2 pattes : 8 ÷ 2 = 4 lapins. Vérification : 4 × 4 + 6 × 2 = 28."
    answer: 4 lapins.
    # What each counter under the problem stands for.
    legend:
      hen: une poule, 2 pattes
      rabbit: un lapin, 4 pattes
    pictures:
      guess: "= 20 pattes"
      short: pattes manquantes
      fits: "4 lapins et 6 poules : 16 + 12 = 28 pattes"
    caption: >-
      On compte d’abord comme s’ils étaient tous pareils, puis on en change
      exactement autant qu’il faut pour que le compte soit juste.
  pattern:
    name: Chercher une régularité
    what: >-
      Regardez les premières étapes et trouvez ce qui se répète. Le motif qui
      revient permet de sauter loin en avant sans tout dessiner entre les deux.
    when: "motifs, rangées, calendrier : « quel sera le vingtième », « quel sera le centième »."
    task: >-
      Des drapeaux sont accrochés dans cet ordre : rouge, jaune, vert, bleu,
      puis de nouveau rouge, jaune, vert, bleu, et ainsi de suite. De quelle
      couleur est le 23e drapeau ?
    steps:
      - "On trouve le motif qui se répète : rouge, jaune, vert, bleu, quatre drapeaux."
      - 23 drapeaux, c’est 5 groupes complets de quatre, soit 20 drapeaux, et encore 3.
      - Le 23e est le troisième de son groupe de quatre, et le troisième est toujours vert.
    answer: Vert.
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21e, 22e, 23e
    caption: >-
      Inutile de dessiner vingt-trois drapeaux : il suffit de voir quelle
      place le drapeau occupe dans son groupe de quatre.
  opposite:
    name: Supposer le contraire
    aka: Le raisonnement par l’absurde
    what: >-
      Pour prouver que quelque chose est impossible, supposez que c’est
      possible, et suivez le raisonnement jusqu’à tomber sur une
      contradiction. Presque tous les problèmes de chevaliers et menteurs se
      résolvent ainsi.
    when: « est-ce possible », « prouve que c’est impossible », qui dit la vérité.
    task: >-
      Sur une île vivent des chevaliers, qui disent toujours la vérité, et des
      menteurs, qui mentent toujours. Adam a dit : « Billie est une menteuse. »
      Billie a dit : « Adam et moi sommes tous deux chevaliers. » Qui est qui ?
    steps:
      - >-
        **Supposons que Billie fasse partie des chevaliers.** Alors ses paroles
        sont vraies, et Adam est lui aussi un chevalier. Mais Adam, chevalier,
        a dit que Billie est une menteuse. **Contradiction.**
      - "Donc Billie est une menteuse, et ses paroles sont fausses : Adam et elle ne sont pas tous deux chevaliers. C’est cohérent."
      - Adam a dit « Billie est une menteuse », et c’est vrai. Seul un chevalier dit des choses vraies, donc Adam est un chevalier.
    answer: Adam est un chevalier, et Billie est une menteuse.
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: A
      borya: B
      anya-said: « Billie est une menteuse »
      borya-said: « Adam et moi sommes tous deux chevaliers »
    pictures:
      said: « Billie est une menteuse »
      false: « tous deux chevaliers » est faux
      true: « Billie est une menteuse » est vrai
    caption: Un chemin mène à une impasse, donc c’est l’autre qui est le bon.
  parity:
    name: Surveiller la parité
    what: >-
      Parfois, inutile de tout savoir : il suffit de savoir si un nombre est
      pair ou impair. Si quelque chose change de parité à chaque étape, le
      nombre d’étapes dit tout de suite où l’on peut arriver et où c’est
      impossible.
    when: sauts, coups, échanges, « un sur deux », « peut-on obtenir ».
    task: >-
      Une sauterelle est posée sur le zéro d’une droite graduée. Chaque saut la
      déplace d’exactement 1 vers la gauche ou vers la droite. Peut-elle se
      retrouver sur le zéro après 5 sauts ?
    steps:
      - "On colorie les cases en alternance : paires et impaires."
      - "Chaque saut change la couleur : d’une case paire à une case impaire, et inversement."
      - Après 5 sauts, un nombre impair, la sauterelle est forcément sur une case impaire, or zéro est pair.
    answer: Non, elle ne peut pas.
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: en bleu les paires, en orange les impaires, la flèche marque le départ
      jumps: chaque saut, et la couleur de la case où il arrive
      after: après le 5e saut, seulement des cases impaires
    caption: >-
      Inutile de suivre où la sauterelle est allée exactement : il suffit de
      suivre la couleur de sa case.
  pigeonhole:
    name: Les pigeons et les cages
    aka: Le principe des tiroirs
    what: >-
      S’il y a plus de pigeons que de cages, une des cages contient au moins
      deux pigeons. Cela paraît évident, et pourtant cela permet de prouver des
      choses qui semblent impossibles à vérifier.
    when: « prouve qu’il y a forcément », « au moins deux », « à coup sûr ».
    task: >-
      Combien de fois dois-tu lancer un dé pour qu’à coup sûr un même nombre
      sorte au moins deux fois ?
    steps:
      - "Un dé a 6 nombres : ce sont 6 « cages ». Les lancers sont les « pigeons »."
      - "Après 6 lancers, les nombres peuvent encore être tous différents : 1, 2, 3, 4, 5, 6."
      - "Au septième lancer, il ne reste plus de cage libre : un nombre sort une deuxième fois. Donc 7 lancers."
    answer: 7 lancers.
    pictures:
      throw: un point bleu est un lancer
      seventh: le 7e lancer tombe dans une case déjà prise
    caption: Même si les six premiers lancers sont tous différents, le septième doit en répéter un.
  mirror:
    name: Jouer en miroir
    aka: Une stratégie symétrique
    what: >-
      Dans les jeux à deux joueurs, on gagne souvent si l’on sait reproduire en
      miroir les coups de l’autre. On a alors toujours une réponse, tant que
      l’adversaire a un coup à jouer.
    when: "jeux à deux joueurs : « qui gagne en jouant bien »."
    task: >-
      Une bande compte 9 cases. Deux joueurs posent à tour de rôle un jeton
      dans une case vide qui n’est pas à côté d’une case occupée. Qui ne peut
      plus poser de jeton a perdu. Où le premier joueur doit-il poser le
      premier jeton pour gagner, quoi que fasse l’autre ?
    steps:
      - Au premier coup, on pose un jeton au milieu, sur la cinquième case.
      - "On répond à chaque coup de l’adversaire par son reflet : la case symétrique, de l’autre côté du milieu."
      - Si la case de l’adversaire était libre et pas à côté d’un jeton, son reflet l’est aussi. C’est donc l’adversaire qui tombe à court de coups en premier.
    answer: Au milieu, sur la 5e case, puis reproduire chaque coup en miroir.
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: le premier joueur
      second: l’autre joueur
      moves: le nombre est le numéro du coup
    pictures:
      answer: l’autre joueur prend la 1re, on répond par la 9e
      stuck: "chaque case libre touche une case prise : l’autre joueur a perdu"
    caption: >-
      Une bande n’a qu’un milieu, et chaque autre case a son reflet. C’est
      pourquoi le premier joueur ne tombe jamais à court de coups.

labels:
  when: "Quand l’utiliser :"
  task: Problème · {grades}
  show: Voir la solution
  hide: Masquer la solution
  topics: "Dans les thèmes :"

cues:
  title: Quelle technique essayer
  lead: >-
    Un indice tiré des mots de l’énoncé. Ce n’est pas une règle : beaucoup de
    problèmes cèdent à deux techniques à la fois.
  if: Si le problème comporte…
  try: …essayez
  rows:
    - « tant de plus que », âges, parties d’un tout
    - beaucoup de personnes, de choses et de données avec « pas »
    - de grands nombres, et on ne sait pas par où commencer
    - « de combien de façons », « combien de nombres »
    - la fin est connue, et on demande le début
    - deux sortes de choses et un total
    - "quelque chose se répète : « quel sera le vingtième »"
    - « est-ce possible », « prouve que c’est impossible »
    - « à coup sûr », « au moins deux »
    - "un jeu à deux : « qui gagne »"
