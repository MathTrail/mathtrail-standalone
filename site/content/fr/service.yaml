title: Comment fonctionne le service
description: "Comment MathTrail fonctionne de l’intérieur : les parties du service et leurs liens, une leçon appel par appel, où vit son état, le fichier du profil dans le Drive du parent et ce qui y est scellé."
hero:
  badge: Pour un public technique
  title: Comment fonctionne le service
  lead: "MathTrail se place entre le chat qu’une famille utilise déjà et le Google Drive du parent. Le modèle du chat écrit chaque problème, et le service décide s’il parvient jusqu’à l’enfant. C’est un seul programme : il n’appelle aucun modèle qui lui soit propre et ne garde rien d’une requête à l’autre."
  chips:
    - Un binaire Go sur Cloud Run
    - Sans état
    - Sans base de données
    - Aucun appel LLM de sa part
    - MCP 2026-07-28 · MCP Apps
  figure: MathTrail en trois couches
  client:
    title: Client de chat
    tag: 1 · client
    others: autres hôtes MCP Apps
    note: Le modèle du chat écrit le problème, et la carte le montre à l’enfant.
  mcp: "{via} · appels d’outils en HTTPS"
  cloud:
    title: MathTrail sur Google Cloud
    tag: 2 · exécution
    sub: Cloud Run · un binaire Go · sans état
    core: "Le cœur : du calcul pur"
    around: "Autour de lui : OAuth, le serveur MCP, la carte, le scellement, les limites."
  drive: "{via} · avec le propre jeton du parent"
  storage:
    title: Google Drive
    tag: 3 · stockage
    note: "Un fichier par enfant, dans le propre Drive du parent : la seule chose conservée longtemps."
map:
  title: Le plan
  lead: "Qui parle à qui. Ni l’enfant ni l’adulte n’accèdent directement à MathTrail : tout passe par l’hôte du chat. Tout ce qui se trouve dans le bloc central fait partie d’un seul processus, et non d’un service distinct. Choisissez une partie pour voir ce qu’elle fait et à quoi elle est reliée."
  legend: Parties du service
  whole: Aucune partie choisie
  hint: "Choisissez une partie du plan : tout ce qui lui est relié reste bien visible, et le reste s’estompe."
  linked: En lien avec
  reset: Effacer ✕
  columns:
    family:
      title: Le chat de la famille
      sub: Claude dans un navigateur, sur ordinateur et sur téléphone · ChatGPT
    service:
      title: MathTrail
      sub: Un binaire Go · Cloud Run · son propre domaine
      tag: entre les parties, de simples appels de fonction
    outside:
      title: Google et GitHub
      sub: Les seuls services hors du binaire
