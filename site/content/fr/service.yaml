  parts:
    adult:
      name: Adulte
      sub: Parent ou enseignant · la personne qui se connecte
      about: "Un parent ou un enseignant. Titulaire du compte du chat comme du compte Google : connecte MathTrail, se connecte une fois, crée le profil, mène la leçon dans le chat et suit les progrès. La seule personne qui se connecte, et la seule qui écrit."
    kid:
      name: Enfant
      sub: Niveaux 1–6 · sans connexion personnelle
      about: Niveaux 1–6. Résout les problèmes sur la carte, dans le chat de l’adulte. N’a pas de connexion personnelle.
    model:
      name: Le modèle de l’hôte
      sub: Écrit le problème, le solveur, les explications
      about: Claude ou ChatGPT. Écrit le problème, un solveur en Starlark, une explication pour chaque mauvaise réponse proposée et une autovérification ; mène la leçon avec des mots partout où les cartes ne s’affichent pas. MathTrail lui-même n’appelle aucun modèle.
    appsrt:
      name: Environnement d’exécution MCP Apps
      sub: Le cadre isolé où vit la carte
      about: "Affiche la carte dans un cadre isolé, lui transmet la langue, la plateforme et la taille, et relaie les propres appels de la carte avec le jeton de l’hôte : la carte elle-même ne voit jamais le jeton."
    cimd:
      name: Document de métadonnées du client
      sub: Le client_id de l’hôte est une adresse HTTPS
      about: L’hôte se désigne par une adresse HTTPS. MathTrail récupère le document à cette adresse, avec une protection contre la SSRF, plutôt que de tenir un registre des clients.
    router:
      name: Routeur HTTP
      sub: /mcp · /oauth/* · /health
      about: "La seule entrée : /health, /mcp, les points de terminaison OAuth et .well-known. Des délais d’expiration, une limite de taille du corps des requêtes, un contrôle de l’en-tête Origin ; l’émetteur est son propre domaine, et tout autre Host reçoit une erreur 404."
    authsrv:
      name: Serveur d’autorisation
      sub: OAuth 2.1 + PKCE, consentement
      about: "MathTrail est son propre serveur OAuth 2.1 avec PKCE : métadonnées, son propre écran de consentement, connexion avec Google, jetons, renouvellement et révocation. Tout ce qu’un serveur avec état conserverait est scellé dans des jetons et des cookies."
    mcpsrv:
      name: Serveur MCP
      sub: Streamable HTTP, sans état
      about: "Le protocole : Streamable HTTP 2026-07-28, sans état, sur le SDK Go officiel. Il liste et appelle les outils, sert la carte comme ressource ui:// et remet au modèle ses instructions avec leur version."
    limits:
      name: Limites
      sub: Par adresse, par compte, par jour
      about: Un rythme par adresse avant la connexion et par compte après, et un plafond global, le tout en mémoire ; puis les plafonds quotidiens, que le profil compte. Au-delà d’une limite, une phrase simple que le modèle transmet.
    tools:
      name: Outils
      about: "Douze outils de même forme : lire le profil, calculer, le réécrire. Le modèle appelle la plupart d’entre eux ; la carte appelle les siens, pour le problème, la réponse, les progrès et le formulaire du profil. Rien de secret n’entre jamais dans un résultat."
    rule:
      name: La règle
      sub: Thème, objectif, couloir de difficulté
      about: "Choisit la consigne de façon déterministe : après une erreur, le même thème, pour le consolider ; sinon, le thème absent depuis le plus longtemps ; la difficulté, dans le couloir où la probabilité de réussite est de 70–85 %."
    rating:
      name: Scores
      sub: θ, δ, β · Elo sur TRI
      about: P = 0,2 + 0,8·σ(θ + δ − β). Elo ne bouge que selon qu’une réponse est juste ou non, avec un pas qui diminue ; une échelle comme aux échecs et onze étapes ; un thème compte comme maîtrisé selon une estimation prudente.
    checks:
      name: Vérifications
      sub: Ce que doit passer un problème soumis
      about: "Ce que doit passer un problème soumis : sa structure et cinq réponses proposées différentes, les lettres de la langue de la leçon, des explications distinctes, le solveur, l’autovérification, la lisibilité, les quasi-doublons et le dessin : son format, ses étiquettes confrontées à l’énoncé, et aucune réponse écrite dessus. Tous les échecs sont signalés en une seule fois."
    solver:
      name: Solveur
      sub: Bac à sable Starlark, limite de pas
      about: Exécute le programme Starlark du modèle, qui essaie les réponses proposées ; exactement une doit se révéler juste. Limites de pas et de temps, ni réseau ni fichiers.
    content:
      name: Contenu
      sub: Catalogues, problèmes de référence, instructions
      about: "Tout ce qui est intégré au binaire sans être du code : les catalogues de thèmes, de pièges et de compétences, les problèmes de référence, les schémas, les modèles de solveurs, un exemple de chaque type de dessin et les instructions du modèle avec leur version."
    widget:
      name: Widget
      sub: La carte · un seul fichier HTML
      about: "La carte : du Preact compilé en un seul fichier HTML qui ne charge rien d’ailleurs, avec les dictionnaires des langues à l’intérieur. La mise en page fonctionne dès 320 px, et les boutons sont à la taille d’un doigt."
    store:
      name: Stockage
      sub: Le profil et le problème en cours
      about: Retrouve le profil grâce à une marque cachée, compare avant d’écrire, réconcilie deux onglets, restaure le fichier depuis les révisions épinglées de Drive quand le parent le demande, et s’en tient à un petit budget d’appels à Drive.
    seal:
      name: Scellement
      sub: Jetons et réponse scellée
      about: "Un mécanisme, deux rôles : il scelle la connexion et les jetons de Google dans les jetons que détient l’hôte, et la réponse d’un problème (celle du problème en cours et celle du problème écrit à l’avance) dans le profil. Les clés viennent de Secret Manager et font l’objet d’une rotation par identifiant de clé."
    logs:
      name: Journalisation
      sub: Résumés, sans données personnelles
      about: "Un résumé structuré par appel : l’outil, l’issue, la durée, la version des instructions ; les tentatives et les motifs d’un refus, comme événements du problème. Aucune donnée personnelle, aucun texte de problème, aucune réponse."
    boot:
      name: Conteneur et configuration
      sub: Environnement, version, arrêt
      about: Assemble les parties et les ferme dans l’ordre inverse, fonctionne avec des délais d’expiration et un arrêt propre, lit toute sa configuration dans l’environnement, et refuse de démarrer sur Cloud Run avec des options de développement.
    goauth:
      name: Google OAuth
      sub: drive.file seulement
      about: La connexion du parent avec le seul champ d’application drive.file, son renouvellement et sa révocation. Révoquer n’importe quel jeton met fin à tout accès.
    gdrive:
      name: Drive API v3
      sub: Le seul stockage à long terme
      about: "Le seul stockage à long terme : un profil JSON dans un dossier MathTrail visible du Drive du parent, lu et écrit avec le propre jeton du parent."
    sm:
      name: Secret Manager
      sub: Clés de scellement, secret client
      about: "Les clés de scellement et le secret client de Google : des versions épinglées, lues une seule fois au démarrage d’une instance."
    ar:
      name: Artifact Registry
      sub: L’image, par son condensé
      about: L’image de chaque révision, par son condensé ; les anciennes images sont supprimées.
    clog:
      name: Cloud Logging
      sub: Où va stdout
      about: Là où va le stdout du service. Les lignes qui servent à compter les enfants sont conservées 62 jours dans un bucket à part.
    bq:
      name: BigQuery → Data Studio
      sub: Décomptes conservés pendant des années
      about: Les décomptes d’utilisation sont conservés pendant des années et recalculés chaque nuit ; aucune table ne contient le nom sous lequel on compte chaque enfant. Un rapport privé et un rapport public, qui ne montre aucun groupe de moins de dix enfants.
    ga:
      name: Actions
      sub: Compilation, vérifications, déploiement
      about: La compilation, les vérifications, la publication de l’image et le déploiement via la fédération d’identité de charge de travail, sans clé de compte de service.
    pages:
      name: Pages
      sub: Ce site, la politique et les conditions
      about: "Ce site : les pages des thèmes, ainsi que la politique de confidentialité et les conditions d’utilisation vers lesquelles renvoie l’écran de consentement."
