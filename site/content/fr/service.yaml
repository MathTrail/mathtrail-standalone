flow:
  title: Une leçon, appel par appel
  lead: "Le modèle et la carte appellent les mêmes outils et reposent sur une seule source de vérité : le fichier du profil dans le Drive du parent. Pour que la leçon se poursuive, ils n’ont rien à se dire."
  legend: Scénario
  scenarios:
    task: Problème
    answer: Réponse
    signin: Connexion
  kinds:
    call: un appel
    reply: sa réponse
    host: dans l’hôte
  actors:
    adult: Adulte
    kid: Enfant
    card: Carte
    model: Le modèle de l’hôte
    service: MathTrail
    drive: Drive
    browser: Le navigateur du parent
    host: Hôte
    google: Google
  task:
    rows:
      - « un nouveau problème, s’il te plaît »
      - next_task
      - "L’hôte affiche la carte dès que l’appel commence : « Préparation du prochain problème… »"
      - limites · la règle choisit le thème, le niveau et la difficulté
      - écrire la demande ouverte
      - "la demande est ouverte : récupérer le paquet"
      - get_package
      - consigne · 3 problèmes de référence · pièges · modèles · exemples de dessins
      - Le modèle écrit le problème, un solveur Starlark et une autovérification
      - "submit_task : jusqu’à 3 tentatives"
      - vérifications · le solveur doit trouver exactement une bonne réponse
      - le problème devient le problème en cours, sa réponse scellée
      - "read_task : la carte interroge toutes les 4 s"
      - texte · dessin · cinq réponses proposées · indice, sans la réponse
    caption: "Chaque appel lit aussi le profil dans Drive ; ces lectures ne sont pas représentées. La carte qui attend ne voit jamais le paquet : ses problèmes de référence contiennent leurs réponses. Pendant que l’enfant résout le problème, le modèle écrit à l’avance le suivant avec prepare_task, et quand on en demande un autre, next_task le place aussitôt sur une nouvelle carte, sans cette attente."
  answer:
    rows:
      - appuie sur C
      - "submit_answer : le chat ne consomme aucun tour"
      - la première réponse seulement · le sceau s’ouvre maintenant · θ et δ ne bougent que selon qu’elle est juste ou non
      - écrire les scores et l’historique
      - juste ou non · le piège derrière C · le dessin de la solution · les étapes · le score avant → après
      - La carte devient l’analyse de la réponse, à la place du problème
      - "ui/update-model-context : une ligne, lue avec le prochain message de l’adulte"
      - « pourquoi un poteau de plus ? »
      - répond sur ce problème précis, en complément de la carte
    caption: L’appui enregistre la réponse avant toute explication, et la carte devient aussitôt l’analyse de la réponse. Le chat ne consomme aucun tour, et le modèle ne dessine rien. Il lit la ligne de la carte avec le prochain message de l’adulte, et répond à une question sur le problème sans redire ce que montre la carte. Si la ligne envoyée par l’hôte au modèle se perd, le modèle se rattrape à son appel suivant.
  signin:
    rows:
      - POST /mcp, sans jeton
      - 401 · où sont les métadonnées
      - ouvre /oauth/authorize · PKCE S256
      - authorize
      - "Son propre écran de consentement : quel client, et où il renverra le parent"
      - connexion avec Google · drive.file seulement
      - retour, avec le code de Google
      - /oauth/callback
      - échanger le code
      - "/about : à qui est ce Drive ?"
      - id utilisateur = HMAC du compte Drive · jetons de Google scellés dans notre code
      - 302 · code = mt1.c.…
      - rend le code
      - /oauth/token · code + vérificateur
      - accès 15 min · actualisation 30 jours
    caption: "Le parent se connecte une seule fois. Le service ne garde rien de cet échange : la requête voyage scellée dans le paramètre state, et les jetons de Google dans un code scellé."
  machine:
    title: Le problème en cours comme machine à états
    lead: Chaque règle « une seule fois » est un champ du profil, vérifié au sein d’une même lecture, d’un même calcul et d’une même écriture. Rien d’autre ne retient quoi que ce soit.
    forward:
      - consigne prête
      - scellé, remis
      - enregistrée une fois
    turns:
      - "refusé, tentatives restantes : pas plus de trois par demande"
      - trois refus, ou 15 minutes depuis l’ouverture de la demande ; aucun problème du jour n’est consommé, et trois refus comptent comme une demande échouée de la journée
      - "« Un autre problème » avant une réponse : le problème est enregistré sans réponse, le score reste inchangé"
      - toute réponse ultérieure (depuis un deuxième onglet ou depuis le modèle) reçoit le premier résultat et n’écrit rien
      - le problème suivant, sur une nouvelle carte ; celui auquel on a répondu n’est plus en cours
      - "le problème suivant était écrit à l’avance : next_task le place aussitôt sur une nouvelle carte, en sautant requested"
      - le sceau ne peut plus être ouvert, car la clé a subi deux rotations ; rien n’est enregistré
state:
  title: Où vit l’état
  lead: "Tout ce qu’un serveur avec état garderait dans une base de données est gardé par d’autres : dans un jeton scellé que détient le chat, dans un cookie du navigateur du parent, ou dans le propre Drive du parent. Redémarrez le service ou lancez-en une deuxième copie : rien n’est perdu."
  self:
    label: MathTrail lui-même
    value: Rien
    note: Ni comptes, ni sessions, ni enregistrements de clients, ni jetons Google. Chaque requête porte tout ce dont elle a besoin.
  stores:
    tokens:
      title: Le stockage des jetons du chat
      sub: Jetons scellés, opaques pour l’hôte
      rows:
        access:
          name: Jeton d’accès
          life: 15 min
        refresh:
          name: Jeton d’actualisation
          life: 30 jours, ≤ 90
      note: À l’intérieur sont scellés les jetons de Google, un identifiant utilisateur opaque pour les limites, et le pays depuis lequel le parent se connecte.
    browser:
      title: Le navigateur du parent
      sub: Deux cookies, pas de session
      rows:
        approvals:
          name: Clients approuvés
          life: 180 jours
        csrf:
          name: Protection de la connexion (CSRF)
          life: 10 min
      note: Les perdre coûte un écran de consentement de plus, ou une nouvelle connexion.
    drive:
      title: Le Drive du parent
      sub: La seule chose conservée longtemps
      rows:
        profile:
          life: jusqu’à sa suppression
      note: Le profil, les scores et le problème en cours, avec sa réponse scellée. Le parent peut ouvrir le fichier, et Drive en garde l’historique.
    secrets:
      title: Secret Manager
      sub: Lus une fois, au démarrage d’une instance
      rows:
        keys:
          name: Clés de scellement
          sub: après une rotation, la clé précédente reste acceptée
          life: 90 jours
        client:
          name: Secret client de Google
          life: épinglé
    memory:
      title: La mémoire de l’instance
      sub: "Rien que des caches : perdus au redémarrage, sans rien casser"
      rows:
        rates:
          name: Compteurs du rythme des requêtes
          life: minutes
        location:
          name: Où se trouve le fichier du profil
          life: 10 min
        clients:
          name: Documents des clients
          life: de 5 min à 24 h
  absent:
    title: Ce que la v1 écarte volontairement
    items:
      - Base de données
      - Files d’attente
      - Stockage de sessions
      - Cache partagé
      - Banque de problèmes tout prêts
      - Client d’API LLM
      - REST et OpenAPI
profile:
  title: Le fichier du profil
  lead: "Un fichier JSON par enfant : non pas le cache d’une vérité stockée sur un serveur, mais la vérité elle-même. Chaque bloc a un plafond, respecté à chaque écriture, si bien que le fichier ne grossit jamais sans limite : un fichier ordinaire reste sous la cible, et un fichier proche de ses plafonds la dépasse. Les problèmes passés sont conservés sous forme d’empreintes, pas de texte."
  size: Taille du fichier
  legend: Quelle taille afficher
  typical: En général
  cap: Près des plafonds
  total: "≈ {kb} Ko"
  kb: "{kb} Ko"
  goal: "cible {kb} Ko"
  segment: "{name} · {typical} / {cap} Ko"
  heads:
    block: Bloc
    holds: Ce qu’il contient
    writers: Qui l’écrit
    size: Taille
  blocks:
    fingerprints:
      name: Empreintes
      holds: Jusqu’à 200 esquisses des problèmes remis, pour la vérification des quasi-doublons, sans texte, sans thème, sans date
    history:
      name: Historique des scores
      holds: Où se trouvaient θ et le δ du thème avant chaque réponse récente, ainsi que θ et chaque thème au début de chacun des 7 derniers jours avec des réponses
    ratings:
      name: Scores et thèmes
      holds: "θ et le point de départ de l’enfant ; pour chaque thème : δ, les réponses, les pièges où l’enfant s’est fait prendre, la maîtrise et son niveau"
    recent:
      name: Dernières réponses
      holds: Les 20 derniers problèmes, avec ou sans réponse, et jamais moins que les 5 réponses que lit la règle
    sealed:
      name: Problème en cours, scellé
      holds: La réponse, le piège derrière chaque mauvaise réponse proposée, la solution et le solveur, en une seule chaîne opaque
    open:
      name: Problème en cours, en clair
      holds: "Ce que montre la carte : le texte, le dessin, cinq réponses proposées, l’indice et, après la réponse, la réponse elle-même"
    request:
      name: Demande ouverte
      holds: "Pendant l’écriture du problème : son identifiant, la consigne, les tentatives utilisées et qui a choisi le thème"
    service:
      name: Service et enfant
      holds: La version du schéma, un UUID aléatoire, la révision ; le pseudonyme, le niveau scolaire, les centres d’intérêt, les remarques ; les compteurs du jour
  every-write: chaque écriture
  note: "Un problème écrit à l’avance se trouve à côté du problème en cours et pèse à peu près autant. Ce que le fichier ne contient pas : les textes des problèmes passés, la réponse en clair tant que l’enfant n’a pas répondu, quoi que ce soit qui désigne le parent, et l’étape (les étapes sont calculées au moment de l’affichage). Drive n’a pas d’écriture conditionnelle, donc le fichier est relu avant un enregistrement, et l’écriture est refusée s’il a changé : deux onglets ne s’écrasent jamais l’un l’autre en silence."
seal:
  title: Ce qui est scellé, et pour combien de temps
  lead: "Un seul mécanisme remplit deux rôles : il scelle la connexion dans les jetons que détient le chat, et la réponse d’un problème (celle du problème en cours et celle du problème écrit à l’avance) dans le profil. Chaque sceau porte sa finalité, si bien qu’un jeton d’accès ne peut pas passer pour un jeton d’actualisation, ni une réponse scellée pour quoi que ce soit d’autre."
  token:
    title: Un jeton, décortiqué
    version: version du format
    purpose: finalité
    purposes:
      c: code
      a: accès
      r: actualisation
      d: client
      s: state
      k: consentement
      t: réponse d’un problème
    key: id de clé
    key-note: tiré de la clé elle-même, si bien qu’une rotation passe inaperçue
    cipher: texte chiffré
    cipher-note: XChaCha20-Poly1305, un nonce aléatoire de 192 bits
    note: "Pas un JWT : personne d’autre que le service ne le lit, et aucun claim ne peut fuir d’une chaîne opaque vers un journal."
  life:
    title: Durées de vie, sur une échelle logarithmique
    ticks:
      - 1 min
      - 1 h
      - 1 jour
      - 1 sem.
      - 6 mois
    items:
      code:
        name: Code d’autorisation
        life: 60 s
      signin:
        name: Connexion en cours
        life: 10 min
      access:
        name: Jeton d’accès
        life: 15 min
      refresh:
        name: Jeton d’actualisation
        life: 30 jours glissants, 90 au plus
      key:
        name: Clé de scellement
        life: rotation tous les 90 jours
      approvals:
        name: Clients approuvés
        life: 180 jours
    note: Un serveur sans état ne peut pas marquer un code comme utilisé, c’est pourquoi la fenêtre du code reste courte. Après une rotation, la clé précédente est encore acceptée, si bien qu’aucun jeton ni aucune réponse scellée ne se perd quand la clé change.
