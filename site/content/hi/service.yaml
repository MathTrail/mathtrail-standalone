flow:
  title: एक पाठ, कॉल-दर-कॉल
  lead: मॉडल और कार्ड एक ही टूल कॉल करते हैं और सच के एक ही स्रोत पर टिके हैं — अभिभावक की Drive में प्रोफ़ाइल की फ़ाइल। पाठ चलता रहे, इसके लिए उन्हें एक-दूसरे को कुछ बताने की ज़रूरत नहीं।
  legend: परिदृश्य
  scenarios:
    task: सवाल
    answer: जवाब
    signin: साइन-इन
  kinds:
    call: कॉल
    reply: उसका जवाब
    host: होस्ट के अंदर
  actors:
    adult: बड़ा व्यक्ति
    kid: बच्चा
    card: कार्ड
    model: होस्ट का मॉडल
    service: MathTrail
    drive: Drive
    browser: अभिभावक का ब्राउज़र
    host: होस्ट
    google: Google
  task:
    rows:
      - “एक नया सवाल दें”
      - next_task
      - "कॉल शुरू होते ही होस्ट कार्ड दिखाता है: “अगला सवाल तैयार हो रहा है…”"
      - सीमाएँ · नियम विषय, स्तर और कठिनाई चुनता है
      - खुला अनुरोध लिखना
      - अनुरोध खुला है — पैकेज लें
      - get_package
      - ब्रीफ़ · 3 संदर्भ सवाल · जाल · टेंपलेट · चित्रों के उदाहरण
      - मॉडल सवाल, Starlark सॉल्वर और खुद की जाँच लिखता है
      - submit_task — ज़्यादा से ज़्यादा 3 कोशिशें
      - जाँचें · सॉल्वर को ठीक एक सही विकल्प मिलना चाहिए
      - सवाल मौजूदा बन जाता है, उसका जवाब सीलबंद
      - read_task — कार्ड हर 4 सेकंड में पूछता है
      - टेक्स्ट · चित्र · पाँच विकल्प · संकेत — जवाब नहीं
    caption: "हर कॉल Drive से प्रोफ़ाइल भी पढ़ती है — पढ़ने की ये कॉल यहाँ छोड़ दी गई हैं। इंतज़ार करने वाला कार्ड पैकेज कभी नहीं देखता: पैकेज के संदर्भ सवालों में उनके जवाब होते हैं। जब तक बच्चा हल करे, मॉडल prepare_task से अगला सवाल पहले से लिख लेता है, और जब अगला सवाल माँगा जाता है, तो next_task उसे तुरंत एक नए कार्ड पर रख देता है — इस इंतज़ार के बिना।"
  answer:
    rows:
      - C दबाना
      - submit_answer — चैट की कोई बारी खर्च नहीं होती
      - सिर्फ़ पहला जवाब · सील अब खोली जाती है · θ और δ सिर्फ़ इस पर बदलते हैं कि जवाब सही है या नहीं
      - रेटिंग और इतिहास लिखना
      - सही या नहीं · C के पीछे का जाल · हल का चित्र · कदम · रेटिंग पहले → बाद में
      - कार्ड, सवाल की जगह, जवाब के विश्लेषण में बदल जाता है
      - ui/update-model-context — एक पंक्ति, जो बड़े व्यक्ति के अगले संदेश के साथ पढ़ी जाती है
      - “एक खंभा ज़्यादा क्यों?”
      - ठीक इसी सवाल के बारे में जवाब देता है, कार्ड की बात को आगे बढ़ाते हुए
    caption: दबाते ही जवाब दर्ज हो जाता है, कुछ भी समझाए जाने से पहले, और कार्ड तुरंत जवाब के विश्लेषण में बदल जाता है। चैट की कोई बारी खर्च नहीं होती, और मॉडल कुछ नहीं बनाता। वह कार्ड की पंक्ति बड़े व्यक्ति के अगले संदेश के साथ पढ़ता है, और सवाल के बारे में पूछी गई बात का जवाब कार्ड को दोहराए बिना देता है। अगर होस्ट से मॉडल को भेजी गई पंक्ति खो जाए, तो मॉडल अपनी अगली कॉल पर छूटी बात जान लेता है।
  signin:
    rows:
      - POST /mcp, बिना टोकन
      - 401 · मेटाडेटा कहाँ है
      - /oauth/authorize खोलता है · PKCE S256
      - authorize
      - "अपनी सहमति स्क्रीन: कौन-सा क्लाइंट, और वह अभिभावक को कहाँ वापस भेजेगा"
      - Google से साइन-इन · सिर्फ़ drive.file
      - वापस, Google के कोड के साथ
      - /oauth/callback
      - कोड एक्सचेंज करना
      - /about — यह Drive किसकी है?
      - यूज़र आईडी = Drive खाते का HMAC · Google के टोकन हमारे कोड में सीलबंद
      - 302 · code = mt1.c.…
      - कोड वापस सौंपता है
      - /oauth/token · कोड + verifier
      - ऐक्सेस 15 मि॰ · रीफ़्रेश 30 दिन
    caption: "अभिभावक को सिर्फ़ एक बार साइन इन करना होता है। सेवा इस लेन-देन का कुछ भी नहीं रखती: अनुरोध सीलबंद स्टेट में जाता है, और Google के टोकन सीलबंद कोड में।"
  machine:
    title: स्टेट मशीन के रूप में मौजूदा सवाल
    lead: “सिर्फ़ एक बार” वाला हर नियम प्रोफ़ाइल का एक फ़ील्ड है, जो पढ़ने, गणना और लिखने के उसी एक चक्र में जाँचा जाता है। इसके अलावा कहीं कुछ याद नहीं रखा जाता।
    forward:
      - ब्रीफ़ तैयार
      - सीलबंद, सौंपा गया
      - एक बार दर्ज
    turns:
      - अस्वीकार, कोशिशें बाकी — हर अनुरोध पर तीन से ज़्यादा नहीं
      - तीन बार अस्वीकार, या अनुरोध खुलने के 15 मिनट बाद; दिन के सवाल खर्च नहीं होते, और तीन अस्वीकार दिन के एक नाकाम अनुरोध के रूप में गिने जाते हैं
      - जवाब से पहले “अगला सवाल” — दर्ज होता है कि सवाल छोड़ा गया, रेटिंग वही रहती है
      - बाद का कोई भी जवाब — दूसरे टैब से या मॉडल से — पहला नतीजा ही वापस पाता है और कुछ नहीं लिखता
      - अगला सवाल, नए कार्ड पर; जिस सवाल का जवाब दिया जा चुका, वह अब मौजूदा नहीं
      - अगला सवाल पहले से लिखा हुआ था — next_task उसे तुरंत नए कार्ड पर रख देता है, requested को छोड़कर
      - सील अब खोली नहीं जा सकती — कुंजी दो बार बदल चुकी है; कुछ दर्ज नहीं होता
