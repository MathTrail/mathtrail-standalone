  parts:
    adult:
      name: बड़ा व्यक्ति
      sub: अभिभावक या ट्यूटर · जो साइन इन करता है
      about: "अभिभावक या ट्यूटर। चैट का खाता और Google खाता, दोनों उसी के होते हैं: वह MathTrail जोड़ता है, एक बार साइन इन करता है, प्रोफ़ाइल बनाता है, चैट में पाठ चलाता है और प्रगति पर नज़र रखता है। सिर्फ़ वही साइन इन करता है, और सिर्फ़ वही टाइप करता है।"
    kid:
      name: बच्चा
      sub: कक्षा 1–6 · अपना कोई साइन-इन नहीं
      about: कक्षा 1–6। सवाल बड़े व्यक्ति के चैट में, कार्ड पर हल होते हैं। बच्चे का अपना कोई साइन-इन नहीं होता।
    model:
      name: होस्ट का मॉडल
      sub: सवाल, सॉल्वर और व्याख्याएँ लिखता है
      about: Claude या ChatGPT। सवाल, उसे हल करने वाला Starlark प्रोग्राम (सॉल्वर), हर गलत विकल्प के पीछे की व्याख्या और खुद की जाँच लिखता है; जहाँ कार्ड नहीं दिखाए जाते, वहाँ पाठ शब्दों में चलाता है। MathTrail खुद किसी मॉडल को कॉल नहीं करता।
    appsrt:
      name: MCP Apps रनटाइम
      sub: सैंडबॉक्स वाला फ़्रेम, जिसमें कार्ड रहता है
      about: कार्ड को सैंडबॉक्स वाले फ़्रेम में दिखाता है, उसे भाषा, प्लेटफ़ॉर्म और आकार बताता है, और कार्ड की अपनी कॉल होस्ट के टोकन के साथ आगे भेजता है — कार्ड खुद टोकन कभी नहीं देखता।
    cimd:
      name: क्लाइंट का मेटाडेटा दस्तावेज़
      sub: होस्ट का client_id एक HTTPS पता है
      about: होस्ट अपनी पहचान एक HTTPS पते से बताता है। MathTrail क्लाइंटों की रजिस्ट्री रखने के बजाय उसी पते से दस्तावेज़ लाता है, SSRF से बचाव के साथ।
    router:
      name: HTTP राउटर
      sub: /mcp · /oauth/* · /health
      about: "अंदर आने का इकलौता रास्ता: /health, /mcp, OAuth के एंडपॉइंट और .well-known। टाइमआउट, बॉडी के आकार की सीमा, Origin की जाँच; जारीकर्ता उसका अपना डोमेन है, और किसी भी दूसरे Host को 404 मिलता है।"
    authsrv:
      name: ऑथराइज़ेशन सर्वर
      sub: OAuth 2.1 + PKCE, सहमति
      about: "MathTrail खुद अपना OAuth 2.1 सर्वर है, PKCE के साथ: मेटाडेटा, अपनी सहमति स्क्रीन, Google से साइन-इन, टोकन, रिन्यू करना और रद्द करना। स्टेट वाला सर्वर जो कुछ रखता, वह सब टोकनों और कुकियों में सील कर दिया जाता है।"
    mcpsrv:
      name: MCP सर्वर
      sub: Streamable HTTP, स्टेटलेस
      about: "प्रोटोकॉल: Streamable HTTP 2026-07-28, स्टेटलेस, आधिकारिक Go SDK पर। यह टूलों की सूची देता है और उन्हें कॉल करता है, कार्ड को ui:// रिसोर्स के रूप में देता है और मॉडल को उसके निर्देश उनके संस्करण के साथ सौंपता है।"
    limits:
      name: सीमाएँ
      sub: प्रति पता, प्रति खाता, प्रति दिन
      about: साइन-इन से पहले हर पते के लिए और उसके बाद हर खाते के लिए एक रफ़्तार, और एक कुल ऊपरी सीमा, सब मेमोरी में — फिर रोज़ की ऊपरी सीमाएँ, जिनकी गिनती प्रोफ़ाइल में होती है। सीमा पार होने पर एक सादा वाक्य, जिसे मॉडल आगे पहुँचा देता है।
    tools:
      name: टूल
      about: "एक ही ढाँचे के बारह टूल: प्रोफ़ाइल पढ़ना, गणना करना, उसे वापस लिखना। ज़्यादातर टूल मॉडल कॉल करता है; कार्ड अपने टूल कॉल करता है — सवाल, जवाब, प्रगति और प्रोफ़ाइल के फ़ॉर्म के लिए। किसी नतीजे में कभी कोई गुप्त चीज़ नहीं जाती।"
    rule:
      name: नियम
      sub: विषय, लक्ष्य, कठिनाई का दायरा
      about: "ब्रीफ़ तय नियम से चुनता है: गलती के बाद वही विषय, उसे पक्का करने के लिए; वरना वह विषय, जो सबसे लंबे समय से नहीं आया; कठिनाई उस दायरे से, जहाँ सही जवाब की संभावना 70–85% है।"
    rating:
      name: रेटिंग
      sub: θ, δ, β · IRT के ऊपर Elo
      about: P = 0.2 + 0.8·σ(θ + δ − β)। Elo सिर्फ़ इस पर बदलता है कि जवाब सही है या नहीं, और उसका कदम घटता जाता है; शतरंज वाला पैमाना और ग्यारह पड़ाव; विषय एक सतर्क अनुमान से सीख लिया गया माना जाता है।
    checks:
      name: जाँचें
      sub: भेजे गए सवाल को क्या पास करना है
      about: "भेजे गए सवाल को यह सब पास करना है: उसका ढाँचा और पाँच अलग-अलग विकल्प, पाठ की भाषा के अक्षर, अलग-अलग व्याख्याएँ, सॉल्वर, खुद की जाँच, पढ़ने में आसानी, लगभग दोहराव और चित्र: उसका फ़ॉर्मैट, सवाल के हिसाब से उसके लेबल, और यह कि उस पर जवाब न लिखा हो। सारी विफल जाँचें एक साथ बताई जाती हैं।"
    solver:
      name: सॉल्वर
      sub: Starlark सैंडबॉक्स, कदमों की सीमा
      about: मॉडल का Starlark प्रोग्राम चलाता है, जो सारे विकल्प आज़माता है; ठीक एक ही विकल्प सही निकलना चाहिए। कदमों और समय की सीमा, न नेटवर्क, न फ़ाइलें।
    content:
      name: सामग्री
      sub: कैटलॉग, संदर्भ सवाल, निर्देश
      about: "बाइनरी में शामिल वह सब, जो कोड नहीं है: विषयों, जालों और कौशलों के कैटलॉग, संदर्भ सवाल, स्कीमा, सॉल्वर के टेंपलेट, हर तरह के चित्र का एक उदाहरण और मॉडल के निर्देश, उनके संस्करण के साथ।"
    widget:
      name: विजेट
      sub: कार्ड · एक HTML फ़ाइल
      about: "कार्ड: Preact से बनी एक ही HTML फ़ाइल, जो कहीं और से कुछ लोड नहीं करती; भाषाओं के शब्दकोश उसी के अंदर हैं। लेआउट 320 px से काम करता है, और बटन उँगली से दबाने लायक हैं।"
    store:
      name: स्टोर
      sub: प्रोफ़ाइल और मौजूदा सवाल
      about: प्रोफ़ाइल को एक छिपे निशान से ढूँढता है, लिखने से पहले तुलना करता है, दो टैब के बीच तालमेल बिठाता है, अभिभावक के कहने पर Drive के पिन किए हुए रिविज़न से फ़ाइल वापस लाता है — और Drive कॉल के एक छोटे बजट के भीतर रहता है।
    seal:
      name: सील करना
      sub: टोकन और सीलबंद जवाब
      about: "एक तंत्र, दो काम: यह साइन-इन और Google के टोकन को उन टोकनों में सील करता है जो होस्ट के पास रहते हैं, और सवाल के जवाब को — मौजूदा सवाल के और पहले से लिखे गए सवाल के — प्रोफ़ाइल में। कुंजियाँ Secret Manager से आती हैं और कुंजी की आईडी के सहारे बदली जाती हैं।"
    logs:
      name: लॉगिंग
      sub: सारांश, कोई निजी डेटा नहीं
      about: "हर कॉल का एक संरचित सारांश: टूल, नतीजा, अवधि, निर्देशों का संस्करण; कोशिशें और अस्वीकार के कारण, सवाल के इवेंट के रूप में। कोई निजी डेटा नहीं, सवालों का कोई टेक्स्ट नहीं, कोई जवाब नहीं।"
    boot:
      name: कंटेनर और सेटिंग
      sub: एनवायरनमेंट, संस्करण, बंद होना
      about: हिस्सों को आपस में जोड़ता है और उन्हें उलटे क्रम में बंद करता है, टाइमआउट और व्यवस्थित ढंग से बंद होने के साथ काम करता है, अपनी सारी सेटिंग एनवायरनमेंट से पढ़ता है — और डेवलपमेंट स्विच चालू हों, तो Cloud Run पर शुरू होने से मना कर देता है।
    goauth:
      name: Google OAuth
      sub: सिर्फ़ drive.file
      about: अभिभावक का साइन-इन, सिर्फ़ drive.file स्कोप के साथ, रिन्यू करना और रद्द करना। कोई भी टोकन रद्द करते ही सारा ऐक्सेस खत्म हो जाता है।
    gdrive:
      name: Drive API v3
      sub: लंबे समय का इकलौता स्टोरेज
      about: "लंबे समय का इकलौता स्टोरेज: अभिभावक की Drive के एक दिखने वाले MathTrail फ़ोल्डर में एक JSON प्रोफ़ाइल, जिसे अभिभावक के अपने टोकन से पढ़ा और लिखा जाता है।"
    sm:
      name: Secret Manager
      sub: सील करने की कुंजियाँ, क्लाइंट सीक्रेट
      about: "सील करने की कुंजियाँ और Google का क्लाइंट सीक्रेट: पिन किए हुए संस्करण, जिन्हें इंस्टेंस शुरू होते समय एक बार पढ़ा जाता है।"
    ar:
      name: Artifact Registry
      sub: इमेज, डाइजेस्ट से
      about: हर रिविज़न की इमेज, डाइजेस्ट से; पुरानी इमेज मिटा दी जाती हैं।
    clog:
      name: Cloud Logging
      sub: जहाँ stdout जाता है
      about: जहाँ सेवा का stdout जाता है। जिन पंक्तियों से बच्चों की गिनती होती है, वे 62 दिन तक अपने अलग बकेट में रखी जाती हैं।
    bq:
      name: BigQuery → Data Studio
      sub: सालों तक रखे जाने वाले आँकड़े
      about: इस्तेमाल के आँकड़े सालों तक रखे जाते हैं और हर रात दोबारा गिने जाते हैं; किसी भी टेबल में बच्चे का गिनती का नाम नहीं होता। एक निजी रिपोर्ट और एक सार्वजनिक, जो दस से कम बच्चों का कोई समूह नहीं दिखाती।
    ga:
