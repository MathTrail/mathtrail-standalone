title: सेवा कैसे काम करती है
description: "MathTrail अंदर से कैसे काम करता है: उसके हिस्से और उनका आपसी जुड़ाव, कॉल-दर-कॉल एक पाठ, उसकी स्टेट कहाँ रहती है, और अभिभावक की Drive में प्रोफ़ाइल की फ़ाइल।"
hero:
  badge: तकनीकी पाठकों के लिए
  title: सेवा कैसे काम करती है
  lead: "परिवार जिस चैट को पहले से इस्तेमाल करता है, MathTrail उसके और अभिभावक की Google Drive के बीच खड़ा है। हर सवाल चैट का मॉडल लिखता है, और सेवा तय करती है कि वह बच्चे तक पहुँचेगा या नहीं। यह एक ही प्रोग्राम है, जो खुद किसी मॉडल को कॉल नहीं करता और अनुरोधों के बीच कुछ भी नहीं रखता।"
