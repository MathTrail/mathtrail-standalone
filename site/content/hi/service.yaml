      name: खुला अनुरोध
      holds: "जब तक सवाल लिखा जा रहा हो: उसकी आईडी, ब्रीफ़, इस्तेमाल हुई कोशिशें और विषय किसने चुना"
    service:
      name: सेवा और बच्चा
      holds: स्कीमा का संस्करण, एक रैंडम UUID, रिविज़न; छद्म नाम, कक्षा, रुचियाँ, नोट्स; दिन के काउंटर
  every-write: हर बार लिखने पर
  note: "पहले से लिखा गया सवाल मौजूदा सवाल के बगल में रहता है और लगभग उतनी ही जगह लेता है। फ़ाइल में क्या नहीं होता: पुराने सवालों के टेक्स्ट, बच्चे के जवाब देने तक खुले रूप में जवाब, अभिभावक का नाम बताने वाली कोई भी चीज़, और पड़ाव — पड़ाव दिखाते समय ही निकाले जाते हैं। Drive में शर्त के साथ लिखने की सुविधा नहीं है, इसलिए सेव करने से पहले फ़ाइल दोबारा पढ़ी जाती है, और अगर वह बदल गई हो, तो लिखना रोक दिया जाता है: दो टैब कभी चुपचाप एक-दूसरे का लिखा नहीं मिटाते।"
seal:
  title: सीलबंद — और कब तक के लिए
  lead: "एक ही तंत्र दो काम करता है: वह साइन-इन को उन टोकनों में सील करता है जो चैट के पास रहते हैं, और सवाल के जवाब को — मौजूदा सवाल के और पहले से लिखे गए सवाल के — प्रोफ़ाइल में। हर सील में उसका मकसद दर्ज होता है, इसलिए ऐक्सेस टोकन रीफ़्रेश टोकन बनकर नहीं चल सकता, और सीलबंद जवाब किसी और चीज़ के रूप में भी नहीं।"
  token:
    title: एक टोकन, हिस्सा-दर-हिस्सा
    version: फ़ॉर्मैट का संस्करण
    purpose: मकसद
    purposes:
      c: कोड
      a: ऐक्सेस
      r: रीफ़्रेश
      d: क्लाइंट
      s: स्टेट
      k: सहमति
      t: सवाल का जवाब
    key: कुंजी की आईडी
    key-note: खुद कुंजी से ली जाती है, इसलिए कुंजी बदलने का पता भी नहीं चलता
    cipher: सिफ़रटेक्स्ट
    cipher-note: XChaCha20-Poly1305, एक रैंडम 192-बिट nonce
    note: "यह JWT नहीं है: इसे सेवा के सिवा कोई नहीं पढ़ता, और अपारदर्शी स्ट्रिंग से कोई क्लेम लॉग में लीक नहीं हो सकता।"
  life:
    title: वैधता की अवधि, लघुगणकीय पैमाने पर
    ticks:
      - 1 मि॰
      - 1 घं॰
      - 1 दिन
      - 1 हफ़्ता
      - 6 महीने
    items:
      code:
        name: ऑथराइज़ेशन कोड
        life: 60 से॰
      signin:
        name: जारी साइन-इन
        life: 10 मि॰
      access:
        name: ऐक्सेस टोकन
        life: 15 मि॰
      refresh:
        name: रीफ़्रेश टोकन
        life: 30 दिन, आगे खिसकती, अधिक से अधिक 90
      key:
        name: सील करने की कुंजी
        life: हर 90 दिन में बदली जाती है
      approvals:
        name: मंज़ूर किए गए क्लाइंट
        life: 180 दिन
    note: बिना स्टेट वाला सर्वर किसी कोड पर “इस्तेमाल हो चुका” का निशान नहीं लगा सकता, इसलिए कोड की समय-सीमा छोटी रखी जाती है। कुंजी बदलने के बाद भी पिछली कुंजी मानी जाती है, इसलिए कुंजी बदलने पर न कोई टोकन खोता है, न कोई सीलबंद जवाब।
