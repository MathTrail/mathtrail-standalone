map:
  title: नक्शा
  lead: किसकी किससे बात होती है। न बच्चे की, न बड़े व्यक्ति की MathTrail से सीधी बात होती है — दोनों की बात चैट होस्ट से होती है। बीच वाले ब्लॉक में जो कुछ है, वह एक ही प्रोसेस का हिस्सा है, कोई अलग सेवा नहीं। कोई भी हिस्सा चुनें, तो दिखेगा कि वह क्या करता है और किससे जुड़ा है।
  legend: सेवा के हिस्से
