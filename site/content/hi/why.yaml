        text: “पूरे नंबर लाने के लिए” नहीं, बल्कि यह सीखने के लिए कि जब किसी ने तरीका न दिखाया हो, तब खुद रास्ता कैसे निकालें।
      - title: आपका समय और रुचि
        text: "बच्चे के पास बैठकर थोड़ा-सा समय: एक साथ बहुत ज़्यादा समय देने से बेहतर है अक्सर थोड़ा-थोड़ा देना। किसी सवाल में आपकी रुचि बच्चे तक भी फैलती है।"
