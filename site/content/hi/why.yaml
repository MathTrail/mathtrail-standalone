      why:
        moment: "सवाल: “किसलिए?”"
        child: मुझे ये सवाल क्यों चाहिए? किसी ने तो दिए भी नहीं।
        you: "यह एक पहेली की तरह है: जवाब छिपा है, और उसे ढूँढा जा सकता है।"
