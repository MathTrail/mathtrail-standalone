# The page "Why", for a parent, in Hindi: why olympiad maths is worth a
# child's time, how long people have learned it, what research has found about
# it, how it differs from a school lesson, what a parent can do, how MathTrail
# goes about it, and why it is no ordinary app. The grades, the topics' names
# and the card's own words are not here: they are the catalog's numbers and the
# widget's words. The card's options, its drawing, the history's pictures and
# the works the page cites are the site's data; a finding here says what its
# work found, no more.

title: "बच्चों के लिए ओलंपियाड गणित क्यों: शोध क्या कहता है"
description: ओलंपियाड गणित और सोचने वाले सवाल बच्चों के समय के लायक क्यों हैं, शोध ने इनके और तार्किक सोच के बारे में क्या पाया, और अभिभावक MathTrail के साथ कैसे मदद करें।

# The label of the note that says plainly what the page does not promise.
honest: सच कहें तो

# The fence: the problem the first screen sets beside a school sum, and the
# card further down shows answered wrong. A variant of the site's own, never a
# reference task word for word.
task:
  question: एक बाड़ 12 मीटर लंबी है। हर 3 मीटर पर एक खंभा लगा है, दोनों सिरों पर भी। कितने खंभे हैं?
  # The trap behind the wrong option picked on the card, as the card says it.
  trap: खंभों की जगह अंतराल गिने गए।
  # The solution, a sentence for each step the card numbers.
  solution: 12 ÷ 3 = 4 अंतराल। सीधी बाड़ में, जिसके दोनों सिरों पर खंभे हों, खंभे अंतरालों से एक ज़्यादा होते हैं। 4 + 1 = 5 खंभे।

hero:
  title: आपके बच्चे के लिए ओलंपियाड गणित क्यों
  lead: स्कूल सिखाता है कि कक्षा में हल किए गए उदाहरण की तरह सवाल कैसे हल करें। ओलंपियाड के सवाल सिखाते हैं कि जब सामने कोई उदाहरण न हो, तब रास्ता कैसे ढूँढें। कक्षा {last} तक बच्चे को इनके लिए तैयार करना अभिभावक के बस में है, और MathTrail इसी के लिए बना है।
  free: मुफ़्त
  open: ओपन सोर्स
  school:
    label: स्कूल का सवाल
    text: भाग देना आना चाहिए।
    sum: 12 ÷ 3 = 4
  olympiad:
    label: ओलंपियाड का सवाल
    answer: "जवाब: {answer}"
    trap: "जाल: 4 अंतराल हैं, खंभे नहीं"
    text: समझ आना चाहिए कि हो क्या रहा है।
  caption: वही संख्याएँ। सोचने का अलग तरीका।

# How long people have learned to find a way with no example to follow: a
# saying of Euclid's, then four eras, each with three pictures the page shows
# in turn. The pictures are the site's data, era by era; each has the place a
# chip over it names, its words for a screen reader and its caption with its
# author and licence, and the chip that picks it, where that is not its place.
history:
  title: बिना उदाहरण के सोचना दो हज़ार साल से भी ज़्यादा समय से सिखाया जा रहा है
  lead: लीक से हटकर सवाल नए नहीं हैं। कई देशों में और कई सदियों तक लोगों ने वह हल ढूँढना सीखा, जो उन्हें किसी ने नहीं दिखाया था, और यह समझाना भी कि वह सही क्यों है; और हर पीढ़ी ने यह हुनर अगली पीढ़ी को सौंपा।
  quote: “ज्यामिति तक कोई शाही रास्ता नहीं जाता।”
  quoted: यूक्लिड का जवाब राजा टॉलेमी को, जिन्होंने पूछा था कि क्या ज्यामिति “एलिमेंट्स” से आसान किसी रास्ते से सीखी जा सकती है। 5वीं सदी में प्रोक्लस ने यह किस्सा इसी तरह सुनाया।
  # What a screen reader calls the choice of a picture.
  choice: इतिहास के चित्र
  eras:
    - label: प्राचीन दुनिया · 6ठी सदी तक
      title: प्रमाण और सवालों की किताबें
      text: यूनानियों ने यह सिद्ध करना शुरू किया कि कोई नियम सही क्यों है। चीन में “गणितीय कला पर नौ अध्याय” नाम की किताब में 246 सवाल उनके हलों के साथ इकट्ठा किए गए। भारत में संख्याएँ शून्य के साथ लिखी जाने लगीं, जैसे हम आज भी लिखते हैं।
    - label: मध्य युग और उसके बाद · 9वीं–19वीं सदी
      title: चुनौती के रूप में सवाल
      text: बग़दाद में अल-ख़्वारिज़्मी ने वह किताब लिखी, जिसके नाम से दुनिया को “algebra” (बीजगणित) शब्द मिला। इटली में गणितज्ञों के बीच सवालों से द्वंद्व होते थे, और जापान में सवाल लकड़ी की तख्तियों पर लिखकर मंदिरों में टाँगे जाते थे।
    - label: 19वीं सदी का अंत और 20वीं सदी
      title: हर बच्चे के लिए सवाल
      text: "सभी बच्चे स्कूल जाने लगे, और सबसे जिज्ञासु बच्चों को गणित क्लब और ओलंपियाड मिले: हंगरी में 1894 से, लेनिनग्राद में 1934 से।"
    - label: आज
      title: हर बच्चे के लिए एक मार्गदर्शक
      text: "कभी निजी मार्गदर्शक गिने-चुने लोगों को ही मिलता था: अरस्तु ने सिकंदर महान को पढ़ाया था। अब हर बच्चे के पास ऐसा मार्गदर्शक हो सकता है। MathTrail कोच का साथी कभी जवाब नहीं थमाता: अतीत के महान शिक्षकों की तरह वह ऐसे सवाल पूछता है, जो बच्चे को हल तक ले जाते हैं।"
      link: कोच देखें →
  pictures:
    athens:
      place: यूनान
      alt: "एक फ्रेस्को का हिस्सा: सफ़ेद बालों वाले एक विद्वान स्लेट पर झुककर परकार से चित्र बना रहे हैं, उनके चारों ओर चार शिष्य।"
      caption: यूक्लिड स्लेट पर परकार से चित्र बना रहे हैं और उनके शिष्य देख रहे हैं; कुछ लोगों के अनुसार यह आर्किमिडीज़ हैं। राफेल के फ्रेस्को “एथेंस का विद्यालय” का हिस्सा, 1509–1511।
    confucius:
      place: चीन
      alt: "एक पेंटिंग: एक शिक्षक खुले आसमान के नीचे अपने शिष्यों के बीच बैठे हैं, और शिष्य सुन रहे हैं और बहस कर रहे हैं।"
      caption: अपने शिष्यों के साथ कन्फ़्यूशियस। गिनती उन “छह कलाओं” में से एक थी, जो हर पढ़े-लिखे व्यक्ति को आनी चाहिए थीं। 19वीं सदी की एक पेंटिंग, चित्रकार अज्ञात।
    aryabhata:
      place: भारत
      alt: "एक सफ़ेद मूर्ति: चादर ओढ़े एक विद्वान अपना हाथ आगे बढ़ा रहे हैं।"
      caption: "आर्यभट, 5वीं सदी के भारतीय गणितज्ञ और खगोलशास्त्री। कोई नहीं जानता कि वे कैसे दिखते थे: यह पुणे में लगी एक आधुनिक मूर्ति है।"
    istanbul:
      place: इस्लामी दुनिया
      alt: "एक लघुचित्र: पगड़ी बाँधे विद्वान ग्लोब, उपकरणों और किताबों के साथ काम कर रहे हैं।"
      caption: इस्तांबुल में तक़ी अल-दीन की वेधशाला में काम करते खगोलशास्त्री और गणितज्ञ। 16वीं सदी के अंत का एक उस्मानी लघुचित्र।
    pacioli:
      place: इटली
      alt: "एक पोर्ट्रेट: एक ईसाई भिक्षु और गणितज्ञ Euclides लिखी एक स्लेट की ओर इशारा कर रहे हैं, पास में एक शिष्य खड़ा है और मेज़ के ऊपर काँच का एक बहुफलक लटक रहा है।"
      caption: गणितज्ञ लूका पचोली एक शिष्य के साथ। चित्र वाली स्लेट के किनारे पर “Euclides” लिखा है। 1495 का एक पोर्ट्रेट, जिसे याकोपो दे' बारबारी का बनाया माना जाता है।
    sangaku:
      place: जापान
      alt: लकड़ी की एक तख्ती, जिस पर वृत्तों के रंगीन चित्र और अक्षरों की खड़ी पंक्तियाँ हैं।
      caption: "सांगाकु, यानी ज्यामिति के सवालों वाली तख्ती, टोक्यो के कोन्नो हाचिमान-गू मंदिर में, 1859। फ़ोटो: Momotarou2012, CC BY-SA 3.0।"
    rachinsky:
      place: रूस
      alt: "एक पेंटिंग: किसानों वाली कमीज़ें पहने लड़के सवाल लिखे ब्लैकबोर्ड के पास खड़े होकर सोच रहे हैं, और आगे खड़ा एक लड़का ठुड्डी हाथ पर टिकाए है।"
      caption: "गाँव के एक स्कूल के छात्र बोर्ड पर लिखा सवाल मन में हल कर रहे हैं: (10² + 11² + 12² + 13² + 14²) ÷ 365। निकोलाई बोगदानोव-बेल्स्की, “मौखिक गणना। एस. ए. राचिंस्की के जन-विद्यालय में”, 1895।"
    st-louis:
      place: अमेरिका
      alt: "एक कक्षा की फ़ोटो: बच्चे बोर्ड पर संख्याओं के स्तंभ लिख रहे हैं, शिक्षिका एक लड़की की मदद कर रही हैं, और बाकी बच्चे किताबें लिए अपनी डेस्क पर बैठे हैं।"
      caption: कक्षा 2 के बच्चे बोर्ड पर सवाल हल कर रहे हैं। बेट्स स्कूल, सेंट लुईस, 20वीं सदी की शुरुआत।
    moscow:
      place: सोवियत संघ
      alt: "एक फ़ोटो: ठोस ज्यामिति के चित्रों वाले ब्लैकबोर्ड के पास एक स्कूली लड़का पीछे मुड़कर मुस्कुरा रहा है।"
      caption: "स्कूल की परीक्षा: बोर्ड के पास ठोस ज्यामिति के एक सवाल के साथ एक छात्र। मास्को, 1950 का दशक। फ़ोटो: Yu. D. Korolev, मास्को का मुख्य अभिलेखागार, CC BY 4.0।"
    coach-canvas:
      place: MathTrail
      chip: कैनवास पर हल
      alt: "टैबलेट की स्क्रीन: सड़क के किनारे खंभों के बारे में एक सवाल, कैनवास पर बिंदुओं वाला स्केच, और बगल में लोमड़ी साथी का संकेत और कदम: समझना, योजना बनाना, हल करना, जाँचना।"
      caption: "MathTrail कोच का प्रोटोटाइप: कैनवास पर हल बच्चे के हाथ से बनता है, और साथी छोटी संख्याओं से शुरू करने का सुझाव देता है।"
    coach-sheet:
      place: MathTrail
      chip: पन्ने से सवाल
      alt: "टैबलेट की स्क्रीन: कैमरा ओलंपियाड के सवालों वाले एक पन्ने की फ़ोटो ले रहा है, और कोच को उस पर छह सवाल मिले हैं।"
      caption: "MathTrail कोच का प्रोटोटाइप: बच्चे ने सवालों वाले पन्ने की फ़ोटो ली है, और कोच ने उस पर छह सवाल ढूँढ लिए हैं।"
    coach-map:
      place: MathTrail
      chip: विषयों का नक्शा
      alt: "टैबलेट की स्क्रीन: ओलंपियाड के विषयों का तीन चरणों वाला नक्शा, आधार से कठिन सवालों तक, और बगल में “सभी विकल्प गिनना” विषय और उसमें बच्चे का पड़ाव।"
      caption: "MathTrail कोच का प्रोटोटाइप: आसान से कठिन तक विषयों का नक्शा, और हर विषय में बच्चे का पड़ाव।"

research:
  title: शोध ने क्या पाया
  lead: बच्चों को ओलंपियाड के सवाल सौ साल से भी ज़्यादा समय से दिए जा रहे हैं, फिर भी इनके असर पर सावधानी से किए गए अध्ययन कम ही हैं। ये उनमें से चार हैं।
  # Each finding under a tag of where and whom, a short line in large letters
  # with a line under it, and the words of the small drawing under its text.
  findings:
    rebholz2022:
      tag: जर्मनी · कक्षा 3–4
      big: सवालों का एक कोर्स
      small: और दो जगह बेहतर नतीजे
      title: तैयारी का असर स्कूल में भी दिखता है
      text: जर्मनी में कक्षा 3 और 4 के बच्चों ने ओलंपियाड जैसे सवालों का एक कोर्स किया। गणित ओलंपियाड में उनका प्रदर्शन बिना कोर्स के भाग लेने वाले बच्चों से साफ़ तौर पर बेहतर रहा, और कक्षा 4 के बच्चों ने स्कूल के गणित टेस्ट में भी बेहतर किया। इस कोर्स के लिए उन्हें उनके शिक्षकों ने चुना था।
      mark:
        - ओलंपियाड में
        - स्कूल के टेस्ट में
    biondi2012:
      tag: ब्राज़ील · 2009
      big: 1.9 करोड़
      small: छात्रों ने एक साल में हिस्सा लिया
      title: ओलंपियाड वाले स्कूल गणित में ज़्यादा अंक लाते हैं
      text: ब्राज़ील के सरकारी स्कूलों का गणित ओलंपियाड हर छात्र के लिए खुला है, और 2009 में इसमें 1.9 करोड़ छात्रों ने हिस्सा लिया। जिन स्कूलों ने इसमें भाग लिया, राष्ट्रीय परीक्षा में उनके कक्षा 9 के छात्रों के गणित के नतीजे बेहतर रहे, और स्कूल ने जितने ज़्यादा साल भाग लिया, नतीजे उतने ही बेहतर।
      mark: भाग लेने के ज़्यादा साल, ज़्यादा अंक
    agarwal2020:
      tag: अंतरराष्ट्रीय ओलंपियाड
      big: IMO
      small: जितने ज़्यादा अंक, विज्ञान में उतना आगे
      title: ओलंपियाड के मज़बूत प्रतिभागी विज्ञान में दूर तक जाते हैं
      text: अंतरराष्ट्रीय गणित ओलंपियाड में किशोरों के अंक जितने ज़्यादा थे, उतनी ही ज़्यादा बार उन्होंने आगे चलकर डॉक्टरेट की उपाधि पाई, शोध प्रकाशित किया, उनके काम का हवाला दिया गया और उन्होंने गणित के सबसे बड़े पुरस्कार जीते।
      mark:
        - डॉक्टरेट
        - शोध-पत्र
        - हवाले
        - शीर्ष पुरस्कार
    nunes2007:
      tag: ब्रिटेन · 6 साल
      big: 16 महीने
      small: 6 साल के बच्चों के तर्क से उनके गणित का अंदाज़ा मिला
      title: तर्क करना छह साल की उम्र से सीखा जाता है
