# The page of the topic of counting figures, for a parent, in Hindi.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "आकृतियाँ गिनना"
description: "“आकृतियाँ गिनना” विषय के सवाल (तीलियों की पहेलियाँ) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।"
hero:
  lead: "कुछ रेखाओं के चित्र में पहली नज़र से ज़्यादा त्रिभुज और वर्ग छिपे होते हैं: छोटे भी, और कई टुकड़ों से बने बड़े भी। ये सवाल सबको गिनने को कहते हैं, या यह बताने को कि आकृति बदलने के लिए कौन-सी तीलियाँ हटाएँ। पूरा हुनर आकार के हिसाब से गिनने में है, सबसे छोटे से शुरू करके।"
  method: "आकार के हिसाब से गिनना, सबसे छोटे से बड़े तक"
  teaches: "हर आकृति को एक ही बार गिनना, बिना छोड़े और बिना दोहराए"
  art:
    count: "4 छोटे वर्ग और 1 बड़ा: 5"
basis:
  title: "आकृति किसे गिनें"
  cards:
    - title: "बड़ी भी गिनी जाती हैं"
      text: "2 गुणा 2 खानों के वर्ग में 4 छोटे वर्ग हैं और उनके चारों ओर 1 बड़ा वर्ग। कई टुकड़ों से बनी आकृति भी गिनी जाती है।"
      art:
        count: "4 + 1 = 5 वर्ग"
    - title: "भुजाएँ रेखाओं पर"
      text: "त्रिभुज तभी गिना जाता है जब उसकी हर भुजा चित्र की किसी रेखा पर हो। कोने से कोने तक की दो रेखाएँ वर्ग में 8 त्रिभुज बनाती हैं।"
      art:
        count: "4 छोटे और दो टुकड़ों वाले 4: 8"
    - title: "एक तीली, एक भुजा"
      text: "जहाँ तीलियों के दो वर्ग छूते हैं, वहाँ उनकी एक तीली साझा होती है। 3 वर्गों की पंक्ति में 10 तीलियाँ लगती हैं, 12 नहीं।"
      art:
        count: "3 + 3 + 4 = 10 तीलियाँ"
idea:
  title: "एक-एक आकार करके गिनें"
  lead: "आकृतियों को आकार के क्रम में लिखें: पहले सबसे छोटी, फिर दो टुकड़ों वाली, फिर बड़ी, और सबको जोड़ें।"
  table:
    head:
      - "चित्र"
      - "सबसे छोटी"
      - "बड़ी"
      - "कुल"
    rows:
      - - "2 गुणा 2 खानों का वर्ग"
        - "4"
        - "1"
        - "5"
      - - "3 गुणा 3 खानों का वर्ग"
        - "9"
        - "4 + 1"
        - "14"
      - - "2 गुणा 3 खानों का आयत"
        - "6"
        - "2"
        - "8"
  note:
    title: "यह क्यों ज़रूरी है"
    text: "बच्चे अक्सर सिर्फ़ छोटी आकृतियाँ गिनते हैं, या किसी बड़ी को उसके दो टुकड़ों से दो बार गिन लेते हैं। एक-एक आकार करके चलने और हर आकार लिखने से दोनों गलतियाँ हट जाती हैं।"
method:
  title: "हल कैसे करें: सबसे छोटे से शुरू करके"
  lead: "चित्र में जितने आकारों की आकृतियाँ हो सकती हैं, उन सबके नाम लें, हर आकार अलग गिनें और फिर जोड़ें। तीलियों में पूछें कि हर तीली किन वर्गों की भुजा है। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।"
  steps:
    - "सबसे छोटी आकृतियाँ ढूँढकर गिनें"
    - "हर बड़े आकार की आकृतियाँ बारी-बारी से गिनें"
    - "जोड़ें और जाँचें कि कोई आकार छूटा तो नहीं"
examples:
  - title: "ऊपर से दो रेखाएँ"
    question: "एक त्रिभुज के ऊपरी कोने से उसके आधार तक दो रेखाएँ जाती हैं। चित्र में कितने त्रिभुज हैं?"
    steps:
      - "दो रेखाएँ त्रिभुज को 3 छोटे त्रिभुजों में बाँटती हैं।"
      - "पास-पास के दो छोटे त्रिभुज मिलकर एक त्रिभुज बनाते हैं: ऐसे 2 जोड़े हैं।"
      - "पूरा त्रिभुज 1 और है। कुल 3 + 2 + 1 = 6।"
    answer: "6 त्रिभुज।"
    note:
      title: "जल्दी जाँच"
      text: "यहाँ हर त्रिभुज का शीर्ष कोने पर है और आधार नीचे की रेखा पर। उस रेखा पर 4 बिंदु हैं, और उनमें से कोई भी 2 एक आधार बनाते हैं: 6 जोड़े।"
    art:
      count: "3 + 2 + 1 = 6"
  - title: "3 गुणा 3 का वर्ग"
    question: "3 गुणा 3 खानों का एक वर्ग उसकी सभी रेखाओं के साथ बना है। उसमें किसी भी आकार के कितने वर्ग हैं?"
    steps:
      - "एक खाने के वर्ग: 3-3 की 3 पंक्तियाँ, यानी 9।"
      - "2 गुणा 2 के वर्ग 2-2 जगहों की 2 पंक्तियों में आते हैं, यानी 4।"
      - "पूरा 3 गुणा 3 का वर्ग 1 और है। कुल 9 + 4 + 1 = 14।"
    answer: "14 वर्ग।"
    note:
      title: "9 नहीं"
      text: "9 सिर्फ़ छोटे वर्गों को गिनता है। कई खानों से बना वर्ग भी वर्ग है।"
    art:
      sizes: "एक खाने के 9, 2 गुणा 2 के 4, 3 गुणा 3 का 1"
  - title: "हटाने वाली तीलियाँ"
    question: "12 तीलियाँ 2 गुणा 2 खानों का वर्ग बनाती हैं। कम से कम कितनी तीलियाँ हटानी होंगी ताकि किसी भी आकार का कोई वर्ग न बचे?"
    steps:
      - "कुल 5 वर्ग हैं: 4 छोटे और 1 बड़ा।"
      - "एक तीली ज़्यादा से ज़्यादा 2 वर्गों की भुजा है, इसलिए 2 तीलियाँ ज़्यादा से ज़्यादा 4 वर्ग तोड़ती हैं, और एक बचता है।"
      - "अंदर की 2 खड़ी तीलियाँ चारों छोटे वर्ग तोड़ती हैं, और ऊपर की 1 तीली बड़ा वर्ग तोड़ती है: 3 तीलियाँ।"
    answer: "3 तीलियाँ।"
    note:
      title: "2 क्यों नहीं"
      text: "हर तीली 1 या 2 वर्ग तोड़ती है, और तोड़ने हैं 5, इसलिए 2 तीलियाँ कम हैं।"
    art:
      taken: "टूटी रेखा वाली तीलियाँ हटाई जाती हैं"
traps:
  missed_case:
    shows: "आकृतियों का कोई आकार छूट जाता है: छोटे वर्गों के चारों ओर का बड़ा वर्ग, या दो टुकड़ों वाले त्रिभुज।"
    say: "“क्या कई टुकड़ों से बनी कोई बड़ी आकृति है?”"
  double_count:
    shows: "एक आकृति दो बार गिनी जाती है, उसके दो टुकड़ों से, या साझा तीली दोनों वर्गों के लिए गिनी जाती है।"
    say: "“क्या यह आकृति पहले गिनी जा चुकी है?”"
  stopped_early:
    shows: "गिनती सबसे छोटी आकृतियों पर, या पहले सही दिखने वाले जवाब पर रुक जाती है।"
    say: "“क्या दूसरे आकार की आकृतियाँ भी हैं?”"
home:
  - title: "खानेदार कागज़"
    text: "साथ मिलकर 2 गुणा 2 खानों का वर्ग बनाएँ और उसके वर्ग गिनें। फिर 3 गुणा 3 आज़माएँ।"
  - title: "तीलियाँ"
    text: "तीलियों या सींकों से वर्गों की एक पंक्ति बनाएँ। 4 वर्गों के लिए कितनी चाहिए? 5 के लिए?"
  - title: "एक-एक आकार"
    text: "गिनते समय हर आकार ज़ोर से बोलें: छोटी, फिर दो टुकड़ों वाली, फिर बड़ी। संख्याएँ लिखें और जोड़ें।"
ask: "“आकृतियाँ गिनना” विषय पर एक सवाल दें"
