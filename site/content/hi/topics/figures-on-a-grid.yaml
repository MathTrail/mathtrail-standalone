# The page of the topic of figures on a square grid, for a parent, in Hindi.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: वर्गाकार ग्रिड पर आकृतियाँ
description: “वर्गाकार ग्रिड पर आकृतियाँ” विषय के सवाल (खानेदार कागज़ पर क्षेत्रफल और परिमाप) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    खानेदार कागज़ पर एक आकृति बनाएँ: वह कितने खाने घेरती है, और उसका किनारा
    कितना लंबा है? इन सवालों में क्षेत्रफल खानों में गिना जाता है और परिमाप
    खानों की भुजाओं में, और दोनों में उलझन होना आसान है: आयत का कोने वाला एक
    खाना हट जाए, तब भी उसका परिमाप वही रह सकता है। कुछ भी छोड़े बिना और
    कुछ भी दो बार गिने बिना गिनना ही पूरा कौशल है।
  method: हर खाने की बाहरी भुजाएँ गिनना
  teaches: क्षेत्रफल और परिमाप में फ़र्क करना, और खाने व भुजाएँ बिना छोड़े या दोहराए गिनना
  # The words of its drawing: the figure over it, what each of its two copies
  # counts, and what the numbers in the cells mean.
  art:
    line: तीन खानों की एक आकृति
    area: क्षेत्रफल, 3 खाने
    perimeter: परिमाप, 8 भुजाएँ
    out: "दाईं ओर की संख्याएँ: खाने की कितनी भुजाएँ बाहर की ओर हैं, 3 + 2 + 3 = 8"

basis:
  title: ग्रिड के नियम
  cards:
    - title: क्षेत्रफल यानी खाने
      text: >-
        खानेदार कागज़ पर किसी आकृति का क्षेत्रफल उन खानों की संख्या है जिन्हें
        वह घेरती है। दो आधे खाने मिलकर एक पूरा खाना बनाते हैं।
      art:
        cells: 3 खाने
    - title: परिमाप यानी भुजाएँ
      text: >-
        परिमाप किनारे पर आने वाली खानों की भुजाओं की संख्या है। जो भुजा आकृति के
        दो खानों में साझा हो, वह अंदर है और गिनी नहीं जाती।
      art:
        shared: अंदर की साझा भुजा नहीं गिनी जाती
    - title: अलग-अलग चीज़ें
      text: >-
        एक ही क्षेत्रफल वाली दो आकृतियों के परिमाप अलग-अलग हो सकते हैं: एक
        पंक्ति में रखे चार खानों का परिमाप 10 है, और वर्ग में रखे चार खानों का
        8।
      art:
        perimeter: परिमाप {count}

idea:
  title: बाहरी भुजाएँ गिनें
  lead: हर खाने की 4 भुजाएँ होती हैं। कोई भुजा परिमाप में तभी गिनी जाती है जब उसकी दूसरी तरफ़ आकृति का कोई खाना न हो।
  table:
    head:
      - आकृति
      - क्षेत्रफल, खानों में
      - परिमाप, भुजाओं में
    rows:
      - - 1 खाना
        - "1"
        - "4"
      - - अगल-बगल 2 खाने
        - "2"
        - 4 + 4 − 2 = 6
      - - एक पंक्ति में 4 खाने
        - "4"
        - "10"
      - - 2 × 2 का वर्ग
        - "4"
        - "8"
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      बच्चे अक्सर परिमाप के लिए खाने गिन लेते हैं, या हर खाने की हर भुजा गिन
      लेते हैं, जिससे साझा भुजाएँ दो बार गिनी जाती हैं। सिर्फ़ बाहर की ओर वाली
      भुजाएँ गिनने से ये दोनों गलतियाँ दूर हो जाती हैं।

method:
  title: "हल कैसे करें: किनारे पर चलना"
  lead: >-
    खानेदार कागज़ पर आकृति बनाएँ। क्षेत्रफल के लिए खानों को पंक्ति-दर-पंक्ति
    गिनें। परिमाप के लिए किनारे पर चारों ओर चलें और रास्ते में आने वाली खानों की
    भुजाएँ गिनें। जब आकृति को काटा जाए, तो टुकड़ों को ऐसे क्रम में लिखें कि न
    कोई छूटे, न कोई दो बार गिना जाए। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के
    स्तर तक जाते हैं।
  steps:
    - खानेदार कागज़ पर आकृति बनाना
    - क्षेत्रफल के लिए खाने गिनना, परिमाप के लिए बाहरी भुजाएँ
    - गिनने के दूसरे तरीके से जाँचना
  # The key under the steps: what the drawings' lines and numbers mean.
  legend:
    border: किनारा, यानी परिमाप
    cut: काटने की रेखा
    count: "संख्या: कितनी भुजाएँ बाहर की ओर हैं"

examples:
  - title: क्रॉस
    question: >-
      एक क्रॉस 5 खानों से बना है: एक बीच में, और बीच वाले की चारों भुजाओं पर
      एक-एक। खानों की भुजाओं में क्रॉस का परिमाप कितना है?
    steps:
      - क्रॉस के 4 सिरों में से हर एक की 3 भुजाएँ बाहर की ओर हैं, इसलिए सिरे 4 × 3 = 12 भुजाएँ देते हैं।
      - बीच वाले खाने की कोई भुजा बाहर नहीं है, क्योंकि उसकी हर भुजा किसी सिरे से लगी है।
      - इसलिए परिमाप खानों की 12 भुजाओं के बराबर है।
    answer: खानों की 12 भुजाएँ।
    note:
      title: गिनने का दूसरा तरीका
      text: >-
        5 खानों की 5 × 4 = 20 भुजाएँ हैं। बीच वाले खाने और सिरों के बीच की 4
        भुजाएँ दो-दो बार गिनी गई हैं, हर खाने की ओर से एक बार, और वे अंदर हैं:
        20 − 2 × 4 = 12।
    art:
      ends: 4 सिरे, हर एक की 3 भुजाएँ
      middle: बीच वाला, 0
      border: किनारा, 12 भुजाएँ
      inner: लाल रंग में, अंदर की 4 भुजाएँ
  - title: पट्टी के दो टुकड़े
    question: >-
      2 × 4 खानों की एक पट्टी को ग्रिड की रेखाओं के साथ-साथ 4 खानों वाले दो
      टुकड़ों में काटा जाता है, और हर टुकड़ा जुड़ा हुआ रहना चाहिए। इसे कितने
      अलग-अलग तरीकों से काटा जा सकता है?
    steps:
      - "बीच से लंबाई में सीधा काटने पर 4 खानों वाली दो पंक्तियाँ मिलती हैं: 1 तरीका।"
      - "बीच से चौड़ाई में सीधा काटने पर 2 × 2 के दो वर्ग मिलते हैं: 1 तरीका।"
      - >-
        अगर काटने की रेखा पहले चौड़ाई में, फिर लंबाई में, फिर से चौड़ाई में चले,
        तो दो L आकार मिलते हैं, और उसका मोड़ एक ओर भी हो सकता है और दूसरी ओर भी:
        2 तरीके। कुल 4 तरीके।
    answer: 4 तरीके।
    note:
      title: 8 क्यों नहीं?
      text: >-
        टुकड़ों को एक-एक करके लिखने पर काटने का हर तरीका दो बार मिलता है, उसके
        दोनों टुकड़ों में से हर एक के लिए एक बार। यह तय कर लेने पर कि पहले
        टुकड़े में ऊपर बाईं ओर वाला खाना होगा, हर तरीका एक ही बार गिना जाता है।
    art:
      along: लंबाई में
      across: चौड़ाई में
      step: मोड़
      back: उलटी ओर
      same: काटने का एक ही तरीका
      dot: "बिंदु: ऊपर बाईं ओर का खाना, हमेशा नीले हिस्से में"
  - title: विकर्ण
    question: >-
      खानेदार कागज़ पर 3 × 5 खानों का एक आयत बना है, और उसके एक कोने से विपरीत
      कोने तक एक रेखा खींची गई है। यह रेखा कितने खानों से होकर गुज़रती है? कोई
      खाना तभी गिना जाता है जब रेखा उसके अंदर से गुज़रे, सिर्फ़ उसके कोने को
      छूने पर नहीं।
    steps:
      - >-
        एक कोने से दूसरे कोने तक जाते हुए रेखा जब भी आयत के अंदर ग्रिड की कोई
        रेखा पार करती है, एक नए खाने में पहुँच जाती है।
      - >-
        वह एक दिशा की 4 रेखाएँ और दूसरी दिशा की 2 रेखाएँ पार करती है, और कभी दो
        रेखाएँ एक साथ नहीं: 1 के सिवा 3 और 5 का कोई सार्व गुणनखंड नहीं, इसलिए
        रास्ते में रेखा खानों के किसी कोने से नहीं गुज़रती।
      - वह 1 खाने में शुरू होती है और 4 + 2 = 6 और खानों में जाती है, कुल 7 खाने।
    answer: 7 खाने।
    note:
      title: कोने से होकर
      text: >-
        4 × 6 खानों के आयत में रेखा खानों के एक कोने से होकर गुज़रती है, जहाँ वह
        दो रेखाएँ एक साथ पार करती है और दो की जगह एक ही खाने में जाती है। वह 4 +
        6 − 2 = 8 खानों से गुज़रती है: 2 वह सबसे बड़ी संख्या है जिससे 4 और 6
        दोनों विभाज्य हैं।
    art:
      points: बिंदु, जहाँ विकर्ण ग्रिड की रेखाओं को काटता है
      down: 4 खड़ी रेखाएँ
      across: 2 आड़ी रेखाएँ
      green: 1 + 4 + 2 = 7 हरे खाने
      node: "लाल बिंदु खानों का कोना है: 8 खाने"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      एक ही चीज़ दो बार गिनी जाती है: खानों की साझा भुजाएँ परिमाप में जोड़ दी
      जाती हैं, या पट्टी को काटने का हर तरीका उसके दोनों टुकड़ों के लिए एक-एक
      बार लिख लिया जाता है।
    say: “क्या कोई भुजा, या काटने का कोई तरीका, दोनों ओर से गिना गया है?”
    art:
      question: अगल-बगल दो खानों का परिमाप
  missed_case:
    shows: >-
      कोई स्थिति छूट जाती है: काटने का वह तरीका जिसका मोड़ उलटी ओर है, अंदर वाले
      कोने में किनारे का एक टुकड़ा, या लेटे हुए डोमिनो के साथ खड़े डोमिनो भी।
    say: “क्या कोई तरीका अभी आज़माया नहीं गया, जैसे उलटी ओर वाला?”
    art:
      question: 2 × 4 की पट्टी को काटने के तरीके
  ignored_condition:
    shows: >-
      कोई शर्त छूट जाती है: बिखर जाने वाले टुकड़े को भी टुकड़ा गिन लिया जाता है,
      सिर्फ़ कोने से छूने वाले खाने को पड़ोसी मान लिया जाता है, या कहा जाता है
      कि रेखा उस खाने से गुज़रती है जिसे वह सिर्फ़ छूती है।
    say: “क्या यह टुकड़ा, या यह खाना, सच में वैसा है जैसा सवाल कहता है?”
    art:
      question: हर हिस्सा जुड़ा हुआ
      broken: नीला हिस्सा बिखर गया
      whole: दोनों हिस्से जुड़े हुए

home:
  - title: खानेदार कागज़
    text: >-
      खानेदार कागज़ पास रखें और साथ मिलकर 4 या 5 खानों की आकृतियाँ बनाएँ। किसका
      किनारा सबसे लंबा है? किसका सबसे छोटा?
  - title: किनारे पर चलें
    text: >-
      परिमाप गिनने के लिए उँगली को किनारे पर भुजा-दर-भुजा चलाएँ। फिर हर खाने की
      बाहरी भुजाएँ गिनें, और जाँचें कि दोनों गिनतियाँ मिलती हैं।
  - title: काटें और गिनें
    text: >-
      कागज़ की एक पट्टी को एक ही आकार के दो टुकड़ों में, जितने तरीकों से हो सके,
      काटें। उन्हें ऐसे रखें कि कोई तरीका न छूटे और न दोहराया जाए।

# What a parent can write in the chat to get a task on this topic.
ask: “वर्गाकार ग्रिड पर आकृतियाँ” विषय पर एक सवाल दें
