# The page of the topic of the calendar and age, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: कैलेंडर और उम्र
description: “कैलेंडर और उम्र” विषय के सवाल, यानी हफ़्ते के दिनों, तारीखों और उम्र के सवाल, क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    आज मंगलवार है: 30 दिन बाद कौन-सा दिन होगा? माँ 30 साल की हैं और अनु 6
    साल की: जब माँ की उम्र अनु की उम्र से दुगुनी होगी, तब अनु कितने साल की
    होगी? कैलेंडर और उम्र के इन सवालों में बच्चे को हफ़्तों, महीनों और सालों
    के साथ काम करना होता है, और इनमें से ज़्यादातर दो बातों पर टिके हैं:
    हफ़्ता हर 7 दिन बाद फिर से शुरू होता है, और दो लोगों की उम्र का अंतर कभी
    नहीं बदलता।
  method: पूरे हफ़्ते हटा देना, उम्र का अंतर बनाए रखना
  teaches: दिनों और सालों को एक-एक करके गिने बिना गिनना
  # The words of its drawing: a month whose Tuesdays stand in one column.
  art:
    line: हफ़्ता हर 7 दिन बाद फिर से शुरू होता है
    tuesdays: सारे मंगलवार एक ही स्तंभ में, एक-दूसरे से 7 दिन दूर

basis:
  title: कैलेंडर के नियम
  cards:
    - title: हफ़्ता फिर से शुरू होता है
      text: >-
        हर 7 दिन बाद हफ़्ते का वही दिन लौट आता है। इसलिए 30 दिन आगे के लिए
        सिर्फ़ वे 2 दिन मायने रखते हैं, जो 4 पूरे हफ़्तों के बाद बचते हैं।
      art:
        week: 7 दिन
        month: 30 दिन = 4 हफ़्ते और 2 दिन
    - title: अवधि के दोनों सिरे
      text: >-
        3 मई से 10 मई 7 दिन आगे है, पर 3 से 10 तारीख तक की छुट्टियाँ 8 दिन
        चलती हैं, क्योंकि पहला और आखिरी, दोनों दिन गिने जाते हैं।
      art:
        holidays: "3 से 10 तारीख तक: छुट्टी के 8 दिन"
    - title: अंतर वही रहता है
      text: >-
        माँ अभी अनु से 24 साल बड़ी हैं, और 10 साल बाद भी 24 साल ही बड़ी
        रहेंगी: हर साल दोनों की उम्र एक-एक साल बढ़ती है।
      art:
        now: अभी
        then: 10 साल बाद
        anya: अनु
        mum: माँ

idea:
  title: पूरे हफ़्ते हटा दें
  lead: इतने दिन बाद हफ़्ते का कौन-सा दिन होगा? सिर्फ़ वह मायने रखता है, जो पूरे हफ़्तों के बाद बचता है।
  table:
    head:
      - कितने दिन बाद
      - पूरे हफ़्ते और बचे दिन
      - अगर आज सोमवार हो
    rows:
      - - "10"
        - 1 हफ़्ता और 3 दिन
        - गुरुवार
      - - "15"
        - 2 हफ़्ते और 1 दिन
        - मंगलवार
      - - "30"
        - 4 हफ़्ते और 2 दिन
        - बुधवार
      - - "100"
        - 14 हफ़्ते और 2 दिन
        - बुधवार
  # The words of the drawings of whole weeks and the days left over.
  art:
    week: 7 दिन
    weeks: 14 × 7 दिन
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      सौ दिन उँगलियों पर गिनने में देर लगती है, और गलती आसानी से हो जाती है।
      पूरे हफ़्ते हटा देने से यह एक-दो दिन का कदम रह जाता है।

method:
  title: "हल कैसे करें: जो नहीं बदलता, उसे ढूँढना"
  lead: >-
    वह ढूँढें, जो वैसा ही रहता है: हफ़्ता हर 7 दिन बाद फिर से शुरू होता है,
    और दो लोगों की उम्र का अंतर कभी नहीं बदलता। इसकी मदद से जो मायने नहीं
    रखता, उसे हटा दें, फिर सिर्फ़ बचा हुआ गिनें। नीचे दिए उदाहरण सबसे आसान से
    ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - ढूँढना कि क्या बार-बार आता है या वैसा ही रहता है
    - पूरे हफ़्ते हटा देना, या उम्र के अंतर से काम लेना
    - बचा हुआ गिनना, और जाँचना कि दोनों सिरे गिने जाते हैं या नहीं
  # The key under the steps: what the drawings' blocks and colours mean.
  legend:
    week: 7 दिन
    whole: पूरा हफ़्ता
    day: बचा हुआ दिन
    difference: उम्र का अंतर

examples:
  - title: फूलों को पानी
    question: >-
      कविता हर 3 दिन पर फूलों को पानी देती है। पहली बार वह सोमवार को पानी
      देती है। 4थी बार वह हफ़्ते के किस दिन पानी देती है?
    steps:
      - >-
        1ली से 4थी बार पानी देने तक 3 दिन के 3 अंतराल हैं, 4 नहीं:
        3 × 3 = 9 दिन।
      - 9 दिन यानी एक हफ़्ता और 2 दिन।
      - सोमवार के एक हफ़्ते बाद फिर सोमवार आता है, और उसके 2 दिन बाद बुधवार।
    answer: बुधवार को।
    badge: बुध
    note:
      title: शनिवार क्यों नहीं?
      text: >-
        4 × 3 = 12 दिन गिनने पर 4थी बार के बाद भी एक अंतराल जुड़ जाता है। 4
        बार पानी देने के बीच 3 अंतराल होते हैं, जैसे 4 खंभों के बीच।
    art:
      monday: सोम
      first: पहली बार सोमवार को, फिर हर 3 दिन पर
      three-days: 3 दिन
      gaps: 3 अंतराल × 3 दिन = 9 दिन
      week: 7 दिन
      numbers: "नीले दिनों के नीचे: कौन-सी बार पानी दिया गया"
      no-gap: 4थी बार के बाद कोई अंतराल नहीं
  - title: वर्षा और पापा
    question: >-
      पापा वर्षा से 28 साल बड़े हैं। 4 साल बाद उनकी उम्र वर्षा की तब की उम्र
      से 3 गुना होगी। वर्षा अभी कितने साल की है?
    steps:
      - "अंतर कभी नहीं बदलता: 4 साल बाद भी पापा 28 साल ही बड़े होंगे।"
      - >-
        तब पापा की उम्र में वर्षा की उम्र जितने तीन हिस्से हैं, जैसा चित्र में
        है। दो अतिरिक्त हिस्से ही वे 28 साल हैं, इसलिए एक हिस्सा 28 ÷ 2 = 14
        है।
      - >-
        4 साल बाद वर्षा 14 साल की होगी, इसलिए अभी वह 14 − 4 = 10 साल की है।
        जाँच: पापा अभी 38 साल के हैं, और 4 साल बाद 42 = 3 × 14।
    answer: 10 साल।
    art:
      now: अभी
      then: 4 साल बाद
      vera: वर्षा
      dad: पापा
      difference: "नारंगी: अंतर, 28 साल"
      parts: "4 साल बाद: 2 हिस्से = 28, एक हिस्सा = 14"
      check: "जाँच: 38 + 4 = 42 = 3 × 14"
  - title: सम तारीखों वाले तीन शनिवार
    question: >-
      किसी महीने में तीन शनिवार सम तारीखों पर पड़ते हैं। उस महीने की 25 तारीख
      को हफ़्ते का कौन-सा दिन है?
    steps:
      - >-
        शनिवार हर 7 दिन बाद आते हैं, और 7 विषम है, इसलिए उनकी तारीखें
        बारी-बारी आती हैं: सम, विषम, सम, विषम…
      - >-
        तीन सम तारीखों के लिए पाँच शनिवार चाहिए, और पहला शनिवार सम तारीख पर।
        पाँचवाँ शनिवार पहले वाले के 28 दिन बाद आता है और उसे भी उसी महीने में
        आना है, इसलिए पहला शनिवार 3 तारीख के बाद का नहीं हो सकता। पहली तीन
        तारीखों में अकेली सम तारीख 2 है: शनिवार 2, 9, 16, 23 और 30 तारीख को हैं।
      - 23 तारीख को शनिवार है, इसलिए दो दिन बाद, 25 तारीख को, सोमवार है।
    answer: सोमवार।
    badge: सोम
    note:
      title: कैलेंडर में सम-विषम
      text: >-
        इस सवाल की कुंजी सम-विषम है: 7 विषम है, इसलिए हफ़्ते के एक ही दिन की
        तारीखें हर हफ़्ते सम और विषम के बीच बदलती हैं।
    art:
      even: "नीला: सम, नारंगी: विषम"
      first: पहला शनिवार
      fifth: पाँचवाँ शनिवार
      saturdays: शनिवार नीले में, और 25 तारीख को सोमवार

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      दिनों की गिनती में एक की चूक होती है: आज को ही आगे के दिनों में पहला दिन
      गिन लिया जाता है, 4 बार पानी देने के बीच 4 अंतराल मान लिए जाते हैं, या
      अवधि का एक सिरा छूट जाता है, जैसे सोमवार से रविवार तक की छुट्टियों में।
    say: "“दिन 1 कौन-सा है: आज या कल?”"
    art:
      gaps: 4 बार पानी देने के बीच के अंतराल
  wrong_operation:
    shows: >-
      ऐसी संक्रिया चुन ली जाती है, जो सवाल नहीं माँगता: सवाल पूछता है कि कोई
      कितने साल बड़ा है, पर दोनों उम्रें जोड़ दी जाती हैं; या एक तारीख दूसरी से
      घटा दी जाती है, जबकि दोनों अलग-अलग महीनों की हैं।
    say: "“शब्दों में बताओ: संख्या बढ़ती है, घटती है या वैसी ही रहती है?”"
    art:
      older: माँ (30) अनु (6) से कितने साल बड़ी हैं?
  ignored_condition:
    shows: >-
      कैलेंडर की या सवाल की कोई बात छूट जाती है: कि इस महीने में 30 दिन हैं,
      31 नहीं, या कि 365 दिन यानी पूरे हफ़्ते और एक दिन ज़्यादा।
    say: “इस महीने में कितने दिन हैं?”
    art:
      year: सोमवार के 365 दिन बाद
      weeks: 52 × 7 दिन
      monday: सोम
      tuesday: मंगल

home:
  - title: दीवार पर कैलेंडर
    text: >-
      कागज़ का कैलेंडर ऐसी जगह टाँगें, जहाँ तक बच्चे का हाथ पहुँचे, और उसके
      बारे में पूछें: अगले महीने की 1 तारीख को हफ़्ते का कौन-सा दिन होगा? इस
      महीने में कितने शुक्रवार हैं?
  - title: परिवार में उम्रें
    text: >-
      सबकी उम्र और उनके बीच के अंतर लिख लें। एक साल बाद फिर देखें: उम्रें
      बदल गई हैं, पर अंतर नहीं बदले।
  - title: उलटी गिनती
    text: >-
      जन्मदिन या किसी त्योहार तक के दिन साथ मिलकर गिनें, पहले एक-एक करके, फिर
      पूरे हफ़्तों में, और देखें कि दोनों तरीकों से एक ही जवाब आता है।

