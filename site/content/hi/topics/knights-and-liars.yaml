# The page of the topic of knights and liars, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: सच्चे और झूठे
description: “सच्चे और झूठे” विषय के सवाल (अंग्रेज़ी में knights and knaves) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words every drawing of the page writes its islanders in: the letters
# of a knight and of a liar, and the islanders' own.
art:
  knight: स
  liar: झ
  a: A
  b: B
  c: C

hero:
  lead: >-
    एक द्वीप पर सच्चे रहते हैं, जो हमेशा सच बोलते हैं, और झूठे, जो हमेशा झूठ
    बोलते हैं। अंग्रेज़ी में इन पहेलियों को knights and knaves भी कहते हैं। उनकी
    बातों से पता लगाना होता है कि कौन क्या है। बहुत-से बच्चों के लिए यह असली
    तार्किक सोच से पहली मुलाकात होती है: कुछ मान लेना, देखना कि यह बात कहाँ तक
    ले जाती है, और विरोधाभास पहचानना।
  method: "“मान लेते हैं कि यह सच्चा है…”"
  teaches: कदम-दर-कदम सोचना, और अपना हल खुद जाँचना
  # The words of its drawing: the key of the letters over it, and in it the
  # first example's two suppositions and how each ends.
  art:
    knight: सच्चा हमेशा सच बोलता है
    liar: झूठा हमेशा झूठ बोलता है
    says: “मैं झूठा हूँ, और B सच्चा है”
    rule: मान लेते हैं, फिर जाँचते हैं
    if-knight: "मान लेते हैं कि A सच्चा है: तब A झूठा है"
    contradiction: विरोधाभास
    if-liar: "मान लेते हैं कि A झूठा है: तब B भी झूठा है"
    fits: मेल खाता है

basis:
  title: द्वीप के नियम
  cards:
    - mark: स
      title: सच्चा
      text: हमेशा सच बोलता है। सच्चे का हर कथन सच होता है, बिना किसी अपवाद के।
    - mark: झ
      title: झूठा
      text: हमेशा झूठ बोलता है। झूठे का हर कथन झूठ होता है, और झूठा कभी सच नहीं बोलता, गलती से भी नहीं।
    - mark: "?"
      title: कोई तीसरा नहीं
      text: हर द्वीपवासी या तो सच्चा है या झूठा। उन्हें शक्ल से अलग नहीं पहचाना जा सकता, सिर्फ़ उनकी बातों से।

idea:
  title: कौन क्या कह सकता है
  lead: दो वाक्यों से शुरू करें। वे तुरंत दिखा देते हैं कि ऐसे सवाल कैसे काम करते हैं।
  table:
    head:
      - वाक्य
      - सच्चा
      - झूठा
      - इसका मतलब
    rows:
      - - “मैं सच्चा हूँ”
        - "✓ कह सकता है: यह सच है"
        - "✓ कह सकता है: यह झूठ है, जैसी झूठे की बात होनी चाहिए"
        - "इससे कुछ पता नहीं चलता: इसे कोई भी कह सकता है।"
      - - “मैं झूठा हूँ”
        - "✕ नहीं कह सकता: यह झूठ होगा"
        - "✕ नहीं कह सकता: यह सच होगा"
        - "असंभव वाक्य: इसे कोई नहीं कह सकता।"
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      जब कोई द्वीपवासी कहता है “मैं सच्चा हूँ”, तो इस वाक्य को काटा जा सकता है:
      इससे कुछ नहीं बदलता। और अगर हल के बीच में पता चले कि किसी ने असल में “मैं
      झूठा हूँ” कह दिया है, तो शुरू में मानी गई बात गलत है।

method:
  title: "हल कैसे करें: “मान लेते हैं कि…”"
  lead: >-
    लगभग हर ऐसा सवाल एक ही तरह से हल होता है: एक द्वीपवासी चुनें, मान लें कि
    वह सच्चा है या झूठा, और देखें कि उससे क्या निकलता है। नीचे दिए उदाहरण सबसे
    आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - मान लेना
    - देखना कि उससे क्या निकलता है
    - विरोधाभास ढूँढना, या जवाब जाँचना

examples:
  - title: रास्ते पर दो
    question: >-
      दो द्वीपवासी, A और B, एक रास्ते पर मिलते हैं। A कहता है: “मैं झूठा हूँ,
      और B सच्चा है।” कौन क्या है?
    steps:
      - >-
        **मान लेते हैं कि A सच्चा है।** तब उसकी बात सच है, और A झूठा है। पर
        हमने माना था कि A सच्चा है: **विरोधाभास**, इसलिए यह स्थिति असंभव है।
      - >-
        **मान लेते हैं कि A झूठा है।** तब उसकी बात झूठी है। उसका पहला आधा
        हिस्सा, “मैं झूठा हूँ”, सच है, इसलिए दूसरा आधा झूठा है: B सच्चा नहीं,
        बल्कि झूठा है। **सब मेल खाता है।**
    answer: A और B दोनों झूठे हैं।
    note:
      title: झूठा “मैं झूठा हूँ” कैसे कह सकता है?
      text: >-
        अपने-आप में “मैं झूठा हूँ” असंभव है। पर “और” से किसी दूसरे वाक्य के साथ
        जुड़ जाए, तो झूठा इसे कह सकता है: पूरे वाक्य के झूठा होने के लिए उसके
        एक हिस्से का झूठा होना काफ़ी है।
    art:
      says: “मैं झूठा हूँ, और B सच्चा है”
      contradiction: विरोधाभास
      fits: सब मेल खाता है
      alone: “मैं झूठा हूँ”
      nobody: इसे कोई नहीं कह सकता
      liar-can: झूठा इसे कह सकता है
  - title: आरोपों की शृंखला
    question: >-
      तीन द्वीपवासी, A, B और C, यह कहते हैं। A: “B झूठा है।” B: “C सच्चा है।”
      C: “A और B दोनों झूठे हैं।” कौन सच्चा है, और कौन झूठा?
    steps:
      - >-
        **शुरुआत कहाँ से करें?** उससे, जो सबसे ज़्यादा कहता है, क्योंकि उसकी
        बात से ज़्यादा कुछ निकलता है। वह C है।
      - >-
        **मान लेते हैं कि C सच्चा है।** तब A और B दोनों झूठे हैं। पर B ने कहा
        था “C सच्चा है”, जो सच होता, और झूठा कभी कुछ सच नहीं कहता।
        **विरोधाभास।**
      - >-
        **तो C झूठा है।** तब B का “C सच्चा है” झूठ है, और B भी झूठा है।
      - A ने कहा “B झूठा है”, और यह सच है। तो A सच्चा है।
    answer: A सच्चा है; B और C झूठे हैं।
    note:
      title: "जाँच: हर वाक्य एक बार फिर"
      text: >-
        A: “B झूठा है” सच है, और कहने वाला सच्चा है। B: “C सच्चा है” झूठ है, और
        कहने वाला झूठा है। C: “A और B दोनों झूठे हैं” झूठ है, क्योंकि A सच्चा
        है, और कहने वाला झूठा है। सब मेल खाता है।
    art:
      a-says: “B झूठा है”
      b-says: “C सच्चा है”
      c-says: “A और B दोनों झूठे हैं”
      most: सबसे ज़्यादा कहता है
      contradiction: विरोधाभास
      true-knight: सच, और कहने वाला सच्चा
      false-liar: झूठ, और कहने वाला झूठा
  - title: गोल मेज़
    question: >-
      दस द्वीपवासी एक गोल मेज़ के चारों ओर बैठे हैं। उनमें से हर एक कहता है:
      “मेरा दाईं ओर वाला पड़ोसी झूठा है।” मेज़ पर कितने सच्चे हैं?
    steps:
      - >-
        अगर द्वीपवासी सच्चा है, तो उसकी बात सच है: दाईं ओर वाला पड़ोसी झूठा है।
      - >-
        अगर द्वीपवासी झूठा है, तो उसकी बात झूठी है: दाईं ओर वाला पड़ोसी सच्चा
        है।
      - >-
        तो मेज़ के चारों ओर सच्चे और झूठे बारी-बारी से बैठे हैं: स, झ, स, झ… दस
        में से ठीक आधे सच्चे हैं: **5 सच्चे**।
    answer: 5 सच्चे।
    note:
      title: और अगर मेज़ पर 9 द्वीपवासी बैठे हों?
      text: >-
        कुर्सियाँ विषम संख्या में हों, तो घेरे में बारी-बारी से बैठने का क्रम
        कभी पूरा नहीं होता: आखिरी और पहला एक ही तरह के होंगे। ऐसी मेज़ हो ही नहीं
        सकती। यहाँ “सच्चे और झूठे” विषय सम-विषम से मिलता है।
    art:
      right-liar: दाईं ओर वाला पड़ोसी झूठा है
      right-knight: दाईं ओर वाला पड़ोसी सच्चा है
      half: 5 और 5
      kinds: सच्चे और झूठे
      turns: हर कोई घड़ी की दिशा में अगले पड़ोसी को देखता है
      clash: आखिरी और पहला एक ही तरह के हैं

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      स और झ लिख दिए जाते हैं, पर हर वाक्य को एक बार फिर नहीं जाँचा जाता, और
      उनमें से एक मेल नहीं खाता।
    say: “हर वाक्य फिर से पढ़ो। वह सच है या झूठ, और उसे किसने कहा?”
  trusted_statement:
    shows: >-
      द्वीपवासी की बात पर यह पूछे बिना भरोसा कर लिया जाता है कि उसे किसने कहा:
      A ने B को झूठा कहा, तो B झूठा ही होगा।
    say: “और अगर यह झूठे ने कहा हो? तब सच क्या है?”
  stopped_early:
    shows: >-
      पहले द्वीपवासी का पता चलते ही हल वहीं रुक जाता है, और बाकियों के बारे में
      कुछ तय नहीं होता।
    say: “अच्छा, A झूठा है। इससे B के बारे में क्या पता चलता है?”

home:
  - title: द्वीप का खेल खेलें
    text: >-
      आप झूठे की भूमिका निभाएँ, और बच्चा आपसे सवाल पूछे। जल्द ही बच्चे को समझ
      आ जाता है कि “क्या आपकी बात झूठी है?” का आपका जवाब हमेशा “नहीं” होता है।
  - title: बताने के बजाय पूछें
    text: >-
      जवाब के बजाय एक सवाल: “और अगर वह सच्चा हो, तो फिर क्या?” यही इस विषय का
      मुख्य विचार है।
  - title: पेंसिल से स और झ लिखें
    text: >-
      हर नाम के ऊपर एक मानी गई बात। विरोधाभास? उसे मिटाएँ और दूसरी आज़माएँ।

# What a parent can write in the chat to get a task on this topic.
ask: “सच्चे और झूठे” विषय पर एक सवाल दें
