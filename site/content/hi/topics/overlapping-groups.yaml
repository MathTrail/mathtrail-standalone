# The page of the topic of overlapping groups, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: आपस में मिलते समूह
description: “आपस में मिलते समूह” विषय के सवाल (वेन आरेख वाले सवाल) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    कुछ बच्चे शतरंज क्लब जाते हैं, कुछ फ़ुटबॉल खेलने, कुछ दोनों जगह, और कुछ
    कहीं नहीं। इन सवालों में समूह आपस में मिलते हैं, और पूरी तरकीब यह है कि
    हर किसी को ठीक एक बार गिना जाए। वेन आरेख, यानी कागज़ पर बने दो घेरे,
    उलझे हुए सवाल को चार संख्याओं में बदल देता है।
  method: घेरे बनाना और बीच से शुरू करना
  teaches: किसी को दो बार गिने बिना गिनना, और यह बताना कि हर संख्या का क्या मतलब है
  # The words of its drawing: what the two circles are, and what their middle
  # means.
  art:
    line: कक्षा के क्लब
    chess: शतरंज
    football: फ़ुटबॉल
    middle: बीच में वे, जो दोनों में जाते हैं

basis:
  title: दो घेरों के नियम
  cards:
    - title: जोड़ने पर दोहरी गिनती
      text: >-
        दोनों समूहों को जोड़ने से, जो बच्चे दोनों में हैं, वे दो बार गिने जाते
        हैं, हर समूह में एक बार। उन्हें एक बार घटा दें, तो हर किसी की गिनती
        एक ही बार होती है।
      art:
        choir: गायन मंडली 14
        art: चित्रकला 11
        twice: "14 + 11 = 25, पर इनमें से 4 दो बार गिने गए: 25 − 4 = 21"
    - title: कुछ किसी में नहीं
      text: >-
        किसी समूह में होना ज़रूरी नहीं। पूरी कक्षा में वे हैं जो कम से कम एक
        समूह में हैं, और वे भी जो किसी में नहीं।
      art:
        class: पूरी कक्षा
        none: 9 किसी समूह में नहीं
    - title: जब बीच की संख्या न दी गई हो
      text: >-
        अगर यह नहीं बताया गया कि दोनों समूहों में कितने हैं, तो उस संख्या की
        सिर्फ़ सीमाएँ बताई जा सकती हैं: समूहों का साझा हिस्सा जितना बड़ा, उतने
        ही कम बच्चे कम से कम एक समूह में होंगे।
      art:
        little: कम साझा
        much: ज़्यादा साझा

idea:
  title: चित्र के चार हिस्से
  lead: >-
    30 छात्र: 14 गायन मंडली में गाते हैं, 11 चित्रकला क्लब जाते हैं, और 4
    दोनों में हैं। चित्र को बीच से बाहर की ओर भरते हैं।
  table:
    head:
      - हिस्सा
      - कितने
      - कैसे निकालें
    rows:
      - - दोनों में
        - "4"
        - दिया गया
      - - सिर्फ़ गायन मंडली
        - 14 − 4 = 10
        - गायन मंडली, दोनों वालों के बिना
      - - सिर्फ़ चित्रकला
        - 11 − 4 = 7
        - चित्रकला क्लब, दोनों वालों के बिना
      - - किसी में नहीं
        - 30 − 10 − 7 − 4 = 9
        - बाकी सब
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      ज़्यादातर गलत जवाब तब आते हैं, जब दोनों समूह जोड़ दिए जाते हैं और भुला
      दिया जाता है कि बीच वाले दो बार गिने गए, या जब सवाल पूरी गायन मंडली के
      बारे में पूछता है और जवाब “सिर्फ़ गायन मंडली” दे दिया जाता है। चित्र को
      बीच से बाहर की ओर भरने से ये दोनों गलतियाँ नहीं होतीं।

method:
  title: "हल कैसे करें: बीच से बाहर की ओर"
  lead: >-
    एक-दूसरे पर चढ़े दो घेरे बनाएँ। पहले बीच में वे लिखें जो दोनों में हैं,
    फिर हर घेरा बीच के बिना, और आखिर में वे जो बाहर हैं। जब बीच की संख्या न
    दी गई हो, तो वे मान आज़माएँ जो वह ले सकती है, और देखें कि कौन-से सही
    बैठते हैं। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - घेरे बनाना
    - पहले बीच भरना, फिर बाकी
    - जाँचना कि हिस्सों का जोड़ सबके बराबर है
  # The key under the steps: what a ring on a number means.
  legend:
    filled: "नीला गोला: इस कदम में क्या भरा जाता है"

examples:
  - title: बहनें और भाई
    question: >-
      24 बच्चों के एक समूह में 15 की एक बहन है, 11 का एक भाई है, और 6 के बहन
      भी है और भाई भी। कितने बच्चों के न बहन है, न भाई?
    steps:
      - >-
        एक-दूसरे पर चढ़े दो घेरे बनाते हैं, “बहन” और “भाई”। बीच में: वे 6
        बच्चे, जिनके दोनों हैं।
      - "सिर्फ़ बहन: 15 − 6 = 9। सिर्फ़ भाई: 11 − 6 = 5।"
      - "घेरों में: 9 + 6 + 5 = 20 बच्चे। उनके बाहर: 24 − 20 = 4।"
    answer: 4 बच्चे।
    art:
      sister: बहन
      brother: भाई
      all: "कुल: 24"
      only: 15 − 6 = 9 · 11 − 6 = 5
      out: 24 − 20 = 4 बाहर
  - title: सेब और नाशपाती
    question: >-
      25 बच्चों के एक समूह में 18 को सेब पसंद है और 16 को नाशपाती। कम से कम
      कितने बच्चों को दोनों पसंद हो सकते हैं?
    steps:
      - >-
        बीच को जितना हो सके छोटा रखने के लिए, सेब पसंद करने वालों और नाशपाती
        पसंद करने वालों को जितना हो सके अलग रखते हैं।
      - >-
        अलग-अलग रहने के लिए उन्हें 18 + 16 = 34 जगहें चाहिए, पर बच्चे सिर्फ़
        25 हैं: इनमें से 34 − 25 = 9 को दोनों घेरों में होना ही होगा।
      - >-
        9 संभव है: 9 को सिर्फ़ सेब पसंद है, 7 को सिर्फ़ नाशपाती और 9 को दोनों,
        कुल 25, और कोई बाहर नहीं छूटा।
    answer: 9 बच्चे।
    note:
      title: और ज़्यादा से ज़्यादा?
      text: >-
        ज़्यादा से ज़्यादा, नाशपाती पसंद करने वाले सभी 16 बच्चों को सेब भी पसंद
        हो सकता है। बीच की संख्या 9 और 16 के बीच है, और सवाल छोटे सिरे के बारे
        में पूछ रहा था।
    art:
      apples: सेब
      kids: बच्चे
      pears: नाशपाती
      ends: सेब बाएँ सिरे से, नाशपाती दाएँ से
      violet: "बैंगनी, जिन्हें दोनों पसंद हैं: 9"
      all: "कुल: 25"
      inside: नाशपाती वाले सभी 16, सेब के अंदर
  - title: तीन विषय
    question: >-
      20 छात्रों में से हर एक को तीन विषयों में से कम से कम एक पसंद है: गणित,
      पढ़ना और चित्रकला। 12 को गणित पसंद है, 10 को पढ़ना और 9 को चित्रकला।
      तीनों विषय किसी को पसंद नहीं। कितने छात्रों को ठीक दो विषय पसंद हैं?
    steps:
      - >-
        तीनों संख्याएँ जोड़ते हैं: 12 + 10 + 9 = 31। जिस छात्र को एक विषय पसंद
        है, वह इस जोड़ में एक बार गिना जाता है, और जिसे दो पसंद हैं, वह दो बार।
      - >-
        छात्र 20 हैं, इसलिए 31 − 20 = 11 गिनतियाँ ज़्यादा हैं, दो बार गिने गए
        हर छात्र के लिए एक।
      - >-
        तो 11 छात्रों को ठीक दो विषय पसंद हैं। जाँच: 9 को एक पसंद है और 11 को
        दो, और 9 + 2 × 11 = 31।
    answer: 11 छात्र।
    note:
      title: जानबूझकर दो बार गिनना
      text: >-
        यहाँ तरकीब घेरों में नहीं, जोड़ में है: हर छात्र अपने हर पसंदीदा विषय के
        लिए उसमें एक जोड़ता है। समूहों वाले ओलंपियाड के सवाल अक्सर एक ही चीज़ को
        दो तरह से गिनने पर टिके होते हैं।
    art:
      maths: गणित 12
      reading: पढ़ना 10
      drawing: चित्रकला 9
      once: एक बार
      twice: दो बार
      each: हर एक के लिए एक, 20; ज़्यादा, 31 − 20 = 11

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  double_count:
    shows: >-
      दोनों समूह, 15 और 11, जोड़ दिए जाते हैं और योग को बच्चों की संख्या मान
      लिया जाता है: जो दोनों समूहों में हैं, वे दो बार गिने जाते हैं।
    say: “क्या कोई दोनों घेरों में गिना गया है?”
    art:
      question: बहन 15, भाई 11, दोनों 6
  answered_other_question:
    shows: >-
      चित्र का कोई हिस्सा निकाला जाता है और वही जवाब में दे दिया जाता है,
      जबकि सवाल किसी दूसरे हिस्से के बारे में था: “किसी में नहीं” की जगह
      “दोनों में”, या पूरी गायन मंडली की जगह “सिर्फ़ गायन मंडली”।
    say: “चित्र में वह हिस्सा दिखाओ, जिसके बारे में सवाल पूछ रहा है।”
    art:
      question: "सवाल: कितनों के न बहन है, न भाई?"
  missed_case:
    shows: >-
      चित्र का कोई हिस्सा छूट जाता है: सब में से एक समूह घटा दिया जाता है और
      दूसरा भुला दिया जाता है, या जो तीनों समूहों में हैं, उन्हें वापस नहीं
      जोड़ा जाता।
    say: “क्या चित्र का हर हिस्सा भर गया है?”
    art:
      question: "24 बच्चे: बहन 15, भाई 11, दोनों 6"

home:
  - title: फ़र्श पर दो छल्ले
    text: >-
      फ़र्श पर दो छल्ले या रस्सी के दो घेरे ऐसे रखें कि वे एक-दूसरे पर चढ़ें,
      और उनमें खिलौने छाँटें: “लाल” और “मुलायम”। मुलायम लाल भालू बीच में
      जाएगा।
  - title: छह कौन?
    text: >-
      जब बच्चे का जवाब हो “छह”, तो पूछें: “छह कौन?” दोनों क्लबों में जाने
      वाले छह और किसी क्लब में न जाने वाले छह, ये अलग-अलग जवाब हैं।
  - title: परिवार में सर्वे
    text: >-
      परिवार से दो सवाल पूछें, जैसे किसे चाय पसंद है और किसे कोको, और साथ
      मिलकर घेरे बनाएँ। गिनती अक्सर बीच में ही गड़बड़ाती है।

