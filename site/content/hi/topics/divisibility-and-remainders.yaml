# The page of the topic of divisibility and remainders, for a parent, in
# Hindi. The topic's name, its group, its grades and its traps' names are not
# here: they are the card's words and the catalog's numbers. The page's
# drawings, each example's level, and the answer its solver proves, are the
# site's data; an example here is worked through to that answer. The traps are
# the topic's commonest, counted in its reference tasks.

title: विभाज्यता और शेषफल
description: “विभाज्यता और शेषफल” विषय के सवाल (विभाज्यता के नियम) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    29 छात्र सैर पर जाते हैं, और हर कार में उनमें से 4 बैठते हैं। कितनी कारें
    चाहिए? इन सवालों में शेषफल के साथ भाग देना होता है, और फिर तय करना होता है
    कि शेषफल का मतलब क्या है: एक और कार, बची हुई एक टॉफ़ी, या अगली पंक्ति में एक
    जगह। विभाज्यता के नियम “क्या यह विभाज्य है?” का जवाब बिलकुल भाग दिए बिना दे
    देते हैं।
  method: संख्या को पूरे समूहों और बचे हुए हिस्से के रूप में लिखना
  teaches: शेषफल को सवाल के अपने शब्दों में समझना, और भाग दिए बिना विभाज्यता जाँचना
  # The words of its drawing: what it divides over it, and what the division
  # comes to under it.
  art:
    line: 14 चीज़ें, 3 के समूहों में
    groups: 4 पूरे समूह और 2 बाकी

basis:
  title: भाग के नियम
  cards:
    - title: शेषफल भाजक से छोटा
      text: >-
        7 से भाग देने पर शेषफल 0, 1, 2 और इसी तरह 6 तक होता है। अगर वह 7 या उससे
        ज़्यादा निकले, तो एक और समूह बन जाता है।
      art:
        remainders: "7 से भाग देने पर शेषफल: 0 से 6"
    - title: शेषफल का मतलब
      text: >-
        4 सीटों वाली कारों में 29 छात्र यानी 7 पूरी भरी कारें और 1 छात्र बाकी,
        इसलिए 8 कारें चाहिए। एक ही भाग से जवाब 7 भी हो सकता है, 8 भी या 1 भी: यह
        सवाल तय करता है।
      art:
        cars: 29 = 7 × 4 + 1, इसलिए 8 कारें चाहिए
    - title: विभाज्यता के नियम
      text: >-
        कोई संख्या 2 से विभाज्य है अगर उसका आखिरी अंक सम हो, 5 से अगर वह 0 या 5
        पर खत्म हो, और 3 या 9 से अगर उसके अंकों का योग उनसे विभाज्य हो।
      # The rules on its drawing, the digits each looks at in bold.
      art:
        by-two: 2 से
        even: "आखिरी अंक सम है: 13**6**"
        by-five: 5 से
        five: "आखिरी अंक 0 या 5 है: 24**5**"
        by-three: 3 और 9 से
        digits: "अंकों का योग: 3 + 8 + 1 + 6 = **18**"

idea:
  title: समूह और बचा हुआ हिस्सा
  lead: हर पूर्ण संख्या को पूरे समूहों और बचे हुए हिस्से के रूप में लिखा जा सकता है। सवाल तय करता है कि उसे इन दोनों में से क्या चाहिए।
  table:
    head:
      - सवाल
      - भाग · नीले में, जो पूछा गया है
      - जवाब
    rows:
      - - 29 छात्रों को 4 सीटों वाली कितनी कारें चाहिए?
        - 29 = 7 × 4 + 1
        - 8 कारें
      - - "29 टॉफ़ियाँ 4 बच्चों में बाँटी जाती हैं: हर एक को कितनी मिलती हैं?"
        - 29 = 7 × 4 + 1
        - हर एक को 7 टॉफ़ियाँ
      - - 29 में से कितनी टॉफ़ियाँ बचती हैं?
        - 29 = 7 × 4 + 1
        - 1 टॉफ़ी
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      हर पंक्ति में भाग एक ही है; बदलता सिर्फ़ मतलब है। भाग सही हो, तब भी जवाब
      में पूरे समूहों की संख्या आ सकती है जबकि सवाल शेषफल पूछ रहा हो, या आखिरी
      छात्र के लिए कार छूट सकती है।

method:
  title: "हल कैसे करें: पूरे समूह और शेषफल"
  lead: >-
    संख्या को पूरे समूहों और बचे हुए हिस्से के रूप में लिखें। फिर सवाल दोबारा
    पढ़ें और तय करें कि वह क्या चाहता है: समूह, शेषफल, या एक समूह ज़्यादा। जब
    सवाल सबसे छोटी संख्या या किसी खास गुण वाला अंक पूछे, तो उन्हें क्रम से
    आज़माएँ। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - पूरे समूहों और शेषफल में बाँटना
    - तय करना कि सवाल क्या पूछ रहा है
    - जवाब को सवाल के शब्दों से मिलाकर जाँचना
  # The key under the steps: what the drawings' groups mean.
  legend:
    group: पूरा समूह
    rest: बचा हुआ हिस्सा

examples:
  - title: सैर के लिए बसें
    question: >-
      150 छात्र स्कूल की सैर पर जाते हैं, और हर बस में 40 सीटें हैं। कितनी बसें
      चाहिए?
    steps:
      - "छात्रों को 40 के समूहों में गिनते हैं: 150 = 3 × 40 + 30। तीन बसें भर जाती हैं, और 30 छात्र बचते हैं।"
      - इन 30 छात्रों को भी एक बस चाहिए, भले ही वह पूरी न भरे।
      - 3 + 1 = 4 बसें।
    answer: 4 बसें।
    note:
      title: 3 या 30 क्यों नहीं?
      text: >-
        3 पूरी भरी बसों की संख्या है, और 30 उन छात्रों की संख्या है जो आखिरी बस
        में जाते हैं। सवाल उन सभी बसों के बारे में पूछ रहा है जिनकी ज़रूरत है।
    art:
      seats: 40 सीटें
      pupils: 150 छात्र
      left: बाकी
      part: 40 में से 30 सीटें
      full: भरी हुई
      last: आखिरी बस में
      all: सभी बसें
  - title: 38*6 में तारा
    question: >-
      38*6 में तारे की जगह कौन-सा अंक होना चाहिए, ताकि संख्या 9 से बिना शेष के
      विभाज्य हो?
    steps:
      - कोई संख्या 9 से ठीक तभी विभाज्य होती है, जब उसके अंकों का योग 9 से विभाज्य हो।
      - >-
        ज्ञात अंकों का योग 3 + 8 + 6 = 17 है, और तारा 0 से 9 तक का कोई अंक है,
        इसलिए योग 17 से 26 तक कुछ भी हो सकता है।
      - "17 से 26 तक की संख्याओं में 9 से सिर्फ़ 18 विभाज्य है, इसलिए तारा 1 है: 3816 = 9 × 424।"
    answer: अंक 1।
    note:
      title: और 3 के लिए?
      text: >-
        3 के लिए योग 3 से विभाज्य होना चाहिए: 18, 21 और 24 तीनों विभाज्य हैं,
        इसलिए तारा 1, 4 या 7 हो सकता है। 9 का नियम ज़्यादा सख्त है, और यहाँ वह
        सिर्फ़ एक अंक छोड़ता है।
    art:
      sum: क्या अंकों का योग 9 से विभाज्य है?
  - title: सौ बार 2
    question: >-
      सौ बार 2 लिखकर सबको आपस में गुणा किया गया: 2 × 2 × 2 × … × 2। गुणनफल का
      आखिरी अंक क्या है?
    steps:
      - >-
        एक-एक करके 2 से गुणा करते हुए आखिरी अंक पर नज़र रखते हैं: 2, 4, 8, 16,
        32, 64, 128, 256। आखिरी अंक 2, 4, 8, 6 के क्रम में आते हैं और फिर दोहराए
        जाते हैं।
      - >-
        पैटर्न की लंबाई 4 है, और 100 = 25 × 4: सौवाँ 2 पैटर्न का 25वाँ दौर पूरा
        करता है और उसके 4थे स्थान पर आता है।
      - पैटर्न के 4थे स्थान पर 6 है, इसलिए गुणनफल का आखिरी अंक 6 है।
    answer: "6।"
    note:
      title: छिपे हुए शेषफल
      text: >-
        मायने सिर्फ़ उस शेषफल के थे जो 100 को 4 से भाग देने पर बचता है: उसी ने
        बताया कि सौवाँ 2 पैटर्न में कहाँ आता है। दोहराई जाने वाली चीज़ों के बारे
        में बहुत-से सवालों के जवाब शेषफल से मिलते हैं: आखिरी अंक, हफ़्ते के दिन,
        घेरे में जगहें।
    art:
      first: नीले में, पैटर्न का पहला दौर
      rounds: 4 बार 2 के 25 दौर = 100 बार 2
      place: "शेषफल 0: दौर का आखिरी, 4था स्थान"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  remainder_vs_quotient:
    shows: >-
      पूरे समूह और शेषफल आपस में जगह बदल लेते हैं: सवाल बसें पूछ रहा है और जवाब
      में बचे हुए 30 छात्र बता दिए जाते हैं, या पैटर्न के पूरे दौरों की संख्या,
      25, को उसमें स्थान मान लिया जाता है।
    say: “सवाल पूरे समूहों के बारे में है या बचे हुए हिस्से के बारे में?”
    art:
      question: कितनी बसें चाहिए?
      left: बचे हुए छात्र
      buses: बसें
  off_by_one:
    shows: >-
      जवाब में एक समूह की चूक हो जाती है: आखिरी 30 छात्रों की बस भुला दी जाती है
      और जवाब 3 आता है, 4 नहीं, या पैटर्न में स्थान 0 से गिने जाते हैं, 1 से
      नहीं।
    say: “क्या बचे हुए हिस्से के लिए एक और समूह चाहिए?”
    art:
      question: 150 छात्र, एक बस में 40 सीटें
  missed_case:
    shows: >-
      एक स्थिति मिलते ही खोज रुक जाती है: तारा 1 है, और जब सवाल 3 के बारे में
      हो, तब यह जाँचा नहीं जाता कि 4 और 7 भी सही बैठते हैं या नहीं।
    say: “क्या 0 से 9 तक हर अंक आज़माया गया है?”
    art:
      question: 38*6, 3 से विभाज्य
      more: बस इतना ही?

home:
  - title: शेषफल के साथ बाँटें
    text: >-
      टॉफ़ियाँ या कार्ड परिवार में बाँटें और नतीजा दो हिस्सों में बताएँ: हर एक
      को कितना मिलता है, और कितना बचता है।
  - title: अंकों से जाँच
    text: >-
      बड़ी संख्याएँ सोचें और उनके अंक जोड़कर जाँचें कि वे 3 और 9 से विभाज्य हैं
      या नहीं, फिर कैलकुलेटर पर भाग देकर देखें कि नियम कैसे काम करता है।
  - title: दोहराई जाने वाली चीज़ें
    text: >-
      घूमकर लौटने वाले पैटर्न ढूँढें: हफ़्ते के दिन, माला के मनकों के रंग, 3, 9,
      27, 81 के आखिरी अंक। पूछें कि 50 कदम आगे क्या आएगा।

