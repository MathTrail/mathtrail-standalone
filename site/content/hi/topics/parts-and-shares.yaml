# The page of the topic of parts and shares, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: पूरे के हिस्से
description: “पूरे के हिस्से” विषय के सवाल, यानी भिन्न के सवाल, क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    रवि पिज़्ज़ा का एक-तिहाई खाता है, और अनु बचे हुए का आधा खाती है। ज़्यादा
    किसने खाया? भिन्न के इन सवालों में हर भिन्न किसी न किसी चीज़ का हिस्सा होता
    है, और ज़्यादातर मुश्किल यह जानने में है कि किसका: पूरे का या बचे हुए का।
    बराबर हिस्सों में कटी कागज़ की पट्टी यह बात किसी भी नियम से बेहतर दिखाती है।
  method: पूरे को एक पट्टी की तरह बनाना और उसे बराबर हिस्सों में काटना
  teaches: “किसका हिस्सा?” पूछना, और हिस्से से पूरा निकालना
  # The words of its drawing: the share over it, and what it comes to.
  art:
    line: 12 का 3/4
    sum: 12 का 3/4 = 9
    one: "12 ÷ 4 = 3 एक हिस्से में, और 3 हिस्से यानी 9"

basis:
  title: हिस्सों के नियम
  cards:
    - title: किसका हिस्सा?
      text: >-
        भिन्न हमेशा किसी चीज़ का भिन्न होता है। “बाकी का एक-चौथाई” और “पूरे का
        एक-चौथाई” अलग-अलग संख्याएँ हैं, इसलिए पहले पता करें कि भिन्न किस चीज़ का
        लिया जा रहा है।
      art:
        whole: पूरे का एक-चौथाई
        rest: बाकी का एक-चौथाई
    - title: एक हिस्से के ज़रिए
      text: >-
        20 का 3/4 निकालने के लिए 4 से भाग दें और 3 हिस्से लें: 15। जिस पूरे का
        3/4 हिस्सा 15 है, उसे निकालने के लिए 3 से भाग देकर एक हिस्सा पाएँ और 4
        हिस्से लें: 20।
    - title: हिस्से मिलकर पूरा बनाते हैं
      text: >-
        जो दे दिया गया और जो बचा, दोनों मिलकर एक पूरा बनाते हैं। अगर 1/3 और 1/4
        दे दिए गए, तो 1 − 1/3 − 1/4 = 5/12 बचता है।

idea:
  title: एक हिस्से में कितना
  lead: सवाल कुछ भी हो, पहले पता करें कि एक हिस्से में कितना है, फिर उतने हिस्से लें जितने सवाल को चाहिए।
  table:
    head:
      - दिया गया
      - पट्टी और एक हिस्सा
      - पूछा गया
    rows:
      - - 20 का 3/4
        - "20 ÷ 4 = 5"
        - 3 हिस्से, 15
      - - किसी संख्या का 3/4 हिस्सा 15 है
        - "15 ÷ 3 = 5"
        - संख्या, 4 हिस्से, 20
      - - किसी संख्या का 2/5 हिस्सा 14 है
        - "14 ÷ 2 = 7"
        - संख्या, 5 हिस्से, 35
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      भिन्न के सवालों में ज़्यादातर गलतियाँ हिसाब में नहीं, पूरे में होती हैं:
      हिस्सा गलत मात्रा का ले लिया जाता है। हर कदम से पहले पूरे को ज़ोर से बोलने
      पर ये गलतियाँ पकड़ में आ जाती हैं।

method:
  title: "हल कैसे करें: पट्टी बनाना"
  lead: >-
    पूरे को एक लंबी पट्टी की तरह बनाएँ और उसे उतने बराबर हिस्सों में काटें
    जितने भिन्न का हर बताता है। जब हिस्सा बचे हुए का लिया जाए, तो बचे हुए को एक
    नई पट्टी की तरह बनाएँ। फिर पता करें कि एक हिस्से में कितना है। नीचे दिए
    उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - पूरे को पट्टी की तरह बनाना
    - उसे बराबर हिस्सों में काटना, और ज़रूरत हो तो बाकी को फिर से
    - एक हिस्सा निकालना, फिर उतने हिस्से जितने सवाल पूछता है
  # The key under the steps: what the strips' colours mean.
  legend:
    given: पहले ही दे दिया गया
    sought: जो ढूँढना है

examples:
  - title: बेकरी के बन
    question: >-
      एक बेकरी वाला 60 बन बनाता है। दोपहर तक वह उनमें से आधे बेच देता है, और
      शाम तक बाकी के दो-तिहाई। कितने बन बचे?
    steps:
      - 60 बनों का आधा 30 है, तो दोपहर के बाद 30 बन बचते हैं।
      - >-
        बाकी के दो-तिहाई यानी 30 के दो-तिहाई, 60 के नहीं: शाम को
        30 ÷ 3 × 2 = 20 बन बिकते हैं।
      - 30 − 20 = 10 बन बचते हैं।
    answer: 10 बन।
    note:
      title: किसके दो-तिहाई?
      text: >-
        सभी 60 बनों के दो-तिहाई 40 होते, और 30 + 40 = 70 बन उससे ज़्यादा हैं
        जितने बेकरी वाले ने बनाए थे। “बाकी के दो-तिहाई” का मतलब है उस समय बचे
        हुए का हिस्सा।
    art:
      rest: बाकी अब एक नया पूरा है
      evening: शाम को 20 बिके
      all: दोपहर तक 30 · शाम को 20 · बचे 10
      over: 30 + 40 = 70, 60 में नहीं समाता
  - title: सातवें हिस्सों में बँटी किताब
    question: >-
      सोमवार को तरुण एक किताब का 2/7 पढ़ता है, और मंगलवार को उसका 3/7। तब 40
      पन्ने बचते हैं। किताब में कितने पन्ने हैं?
    steps:
      - दो दिनों में तरुण किताब का 2/7 + 3/7 = 5/7 पढ़ता है, तो उसका 2/7 बचता है।
      - "यही 2/7 वे 40 पन्ने हैं: एक सातवाँ हिस्सा 40 ÷ 2 = 20 पन्ने है।"
      - "पूरी किताब में सात सातवें हिस्से हैं: 7 × 20 = 140 पन्ने।"
    answer: 140 पन्ने।
    note:
      title: 40 कौन-सा हिस्सा है?
      text: >-
        40 पन्ने वह हैं जो बचा, यानी किताब का 2/7, न कि वह 5/7 जो तरुण ने पढ़ा।
        इन्हें 5/7 मान लेने पर किताब 56 पन्नों की बनती, और उसमें सिर्फ़ 16 पन्ने
        बचते।
    art:
      sevenths: किताब, 7 बराबर हिस्से
      monday: सोमवार
      tuesday: मंगलवार
      read: 40 पढ़ा हुआ हिस्सा नहीं
  - title: बाज़ार में अंडे
    question: >-
      दादी बाज़ार में अंडे बेचती हैं। पहला ग्राहक उनके आधे अंडे और ऊपर से आधा
      अंडा लेता है। दूसरा बचे हुए अंडों का आधा और ऊपर से आधा अंडा लेता है, और
      तीसरा भी ऐसा ही करता है। तब सारे अंडे बिक जाते हैं, और किसी ने कोई अंडा
      नहीं तोड़ा। दादी के पास कितने अंडे थे?
    steps:
      - >-
        अंत से शुरू करते हैं। तीसरे ग्राहक ने आधे अंडे और ऊपर से आधा अंडा लिया,
        और कुछ नहीं बचा: तो अंडों का आधा हिस्सा आधा अंडा था, और दादी के पास 1
        अंडा था।
      - >-
        दूसरे ग्राहक से पहले भी यही: आधे अंडे और ऊपर से आधा अंडा जाने के बाद 1
        अंडा बचा, तो अंडों का आधा डेढ़ था, और अंडे 3 थे।
      - >-
        पहले ग्राहक से पहले अंडों का आधा साढ़े तीन था, तो अंडे 7 थे। जाँच:
        7 → 3 → 1 → 0।
    answer: 7 अंडे।
    note:
      title: अंत से शुरू करना
      text: >-
        जब हर हिस्सा बचे हुए का हिस्सा हो, तो शुरू करने की सबसे आसान जगह अंत है:
        वहाँ मात्रा पता होती है। पीछे की ओर हर कदम एक हिस्से को उलटता है: आधा
        अंडा जोड़ें, फिर दुगुना करें।
    art:
      basket: टोकरी में कितने अंडे?
      third: "तीसरा ग्राहक: 1 था"
      third-took: 0.5 + ½ = 1 लिया, 0 बचा
      second: "दूसरा ग्राहक: 3 थे"
      second-took: 1.5 + ½ = 2 लिए, 1 बचा
      first: "पहला ग्राहक: 7 थे"
      first-took: 3.5 + ½ = 4 लिए, 3 बचे
      back: "एक कदम पीछे: + ½, फिर × 2"

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  part_whole_swap:
    shows: >-
      हिस्सा गलत मात्रा का ले लिया जाता है: सभी 60 बनों के दो-तिहाई, न कि बचे
      हुए 30 के; या बचे हुए 40 पन्नों को तरुण का पढ़ा हुआ हिस्सा मान लिया जाता
      है।
    say: “किसके दो-तिहाई? पट्टी पर उँगली रखकर दिखाओ।”
    art:
      question: बाकी के दो-तिहाई
      of-all: 60 का 2/3 =
      of-rest: 30 का 2/3 =
  answered_other_question:
    shows: >-
      रास्ते में मिली कोई संख्या जवाब बन जाती है: बचे हुए बनों की जगह शाम को बिके
      20 बन, या पूरी किताब की जगह तरुण के पढ़े हुए 100 पन्ने।
    say: “सवाल ठीक-ठीक क्या पूछ रहा है?”
    art:
      question: कितने बन बचे?
      evening: शाम को बिके
      left: बचे
  stopped_early:
    shows: >-
      हल एक कदम पहले रुक जाता है: किताब का एक सातवाँ हिस्सा, 20 पन्ने, निकल आता
      है, पर उससे पूरी किताब कभी नहीं निकाली जाती; या दोपहर तक बिके बन घटा दिए
      जाते हैं और शाम वाले छूट जाते हैं।
    say: “क्या यही जवाब है, या उसकी ओर बस एक कदम?”
    art:
      question: किताब में कितने पन्ने हैं?

home:
  - title: साथ मिलकर काटें
    text: >-
      एक सेब, पिज़्ज़ा या कागज़ की शीट को बराबर हिस्सों में काटें और उनके नाम
      बोलें: आधे, तिहाई, चौथाई। फिर कुछ हिस्से हटाएँ और पूछें कि कौन-सा हिस्सा
      बचा।
  - title: किसका हिस्सा?
    text: >-
      जब किसी रेसिपी या खेल में कोई भिन्न आए, तो पूछें: “किसका एक-तिहाई?” अक्सर
      इसी सवाल का जवाब पूरा सवाल हल कर देता है।
  - title: पट्टी
    text: >-
      घर पर किसी भी बँटवारे के लिए साथ मिलकर पट्टी बनाएँ: बराबर खानों में बँटा
      एक लंबा आयत। यह इस विषय के हर सवाल में काम आती है।

# What a parent can write in the chat to get a task on this topic.
