# The page of the topic of ordering, for a parent, in Hindi. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: क्रम में लगाना
description: “क्रम में लगाना” विषय के सवाल (क्रम व्यवस्था, यानी कौन ज़्यादा लंबा है या कौन पहले आया जैसी तर्क की पहेलियाँ) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words every drawing of the page writes its four children in: the
# initial of each, and the name.
art:
  ann: अ
  ann-name: अनु
  ben: र
  ben-name: रवि
  kate: क
  kate-name: कविता
  dan-name: दीपक
  taller: लंबा

hero:
  lead: >-
    कौन ज़्यादा लंबा है, कौन बड़ा है, कौन पहले आया? तर्क की इन पहेलियों में,
    जिन्हें क्रम व्यवस्था के सवाल भी कहते हैं, कुछ तुलनाओं को जोड़कर एक क्रम
    बनाना होता है: लंबाई के हिसाब से, उम्र के हिसाब से, कतार या दौड़ में जगह के
    हिसाब से। बहुत-से बच्चों के लिए यह तर्क की पहली शृंखला होती है, जिसमें हर
    सुराग एक कड़ी है और कोई भी कड़ी छोड़ी नहीं जा सकती।
  method: एक रेखा खींचना और सबको उस पर रखना
  teaches: सुरागों को जोड़कर एक तस्वीर बनाना, और तुलना को दोनों ओर से पढ़ना
  # The words of its drawing: the clues and the rule over it, and the line's
  # two ends in it.
  art:
    line: सुराग
    clue-1: “अनु रवि से लंबी है”
    clue-2: “कविता रवि से छोटी है”
    clue-3: “दीपक कविता से छोटा है”
    rule: सबको एक रेखा पर रखते हैं
    top: सबसे लंबा
    bottom: सबसे छोटा

basis:
  title: रेखा के नियम
  cards:
    - title: हर सुराग एक तीर है
      text: >-
        “अनु रवि से लंबी है” रेखा पर अनु को रवि से पहले रखता है। सुराग चाहे
        किसी भी चीज़ की तुलना करे, लंबाई की, उम्र की या दौड़ में जगह की, वह
        बताता है कि पहले कौन आता है।
      art:
        clue: “अनु रवि से लंबी है”
    - title: दोनों ओर से पढ़ें
      text: >-
        “रवि अनु से छोटा है” वही कहता है जो “अनु रवि से लंबी है”। रेखा पर रखने
        से पहले हर सुराग को ऐसे मोड़ें कि सभी एक ही दिशा में हों।
      art:
        clue: “अनु रवि से लंबी है”
        turned: “रवि अनु से छोटा है”
    - title: शृंखला आगे बढ़ती है
      text: >-
        अगर अनु रवि से लंबी है और रवि कविता से लंबा है, तो अनु कविता से भी लंबी
        है, भले ही कोई सुराग यह न कहे।
      art:
        implied: अनु कविता से लंबी है

idea:
  title: हर सुराग को एक ही दिशा में मोड़ें
  lead: रेखा को सुराग-दर-सुराग बनाएँ, पर हर सुराग को पहले “से लंबा” वाले रूप में बदल लें। हर कदम पर रेखा में एक नया व्यक्ति जुड़ता है।
  table:
    head:
      - सुराग
      - “से लंबा” वाले रूप में
      - अब तक की रेखा
    rows:
      - - “अनु रवि से लंबी है”
        - अनु रवि से **लंबी** है
        - अनु > रवि
      - - “कविता रवि से छोटी है”
        - रवि कविता से **लंबा** है
        - अनु > रवि > कविता
      - - “दीपक कविता से छोटा है”
        - कविता दीपक से **लंबी** है
        - अनु > रवि > कविता > दीपक
  # The words of the drawings of the table: the note on a clue turned round.
  art:
    turned: उलटा गया
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      यहाँ ज़्यादातर गलतियाँ तब होती हैं जब सुराग उलटे सिरे से पढ़ लिया जाता है:
      “छोटा” को “लंबा” समझ लिया जाता है, “बाद में” को “पहले”। जो सुराग रेखा पर
      रखने से पहले ही उलट दिया गया हो, उसे गलत नहीं पढ़ा जा सकता।

method:
  title: "हल कैसे करें: रेखा खींचना"
  lead: >-
    सबसे लंबे से सबसे छोटे तक, या पहले से आखिरी तक, एक रेखा खींचें और उस पर
    सुराग एक-एक करके रखें, पहले वे जो पक्के हैं। जिसे अभी रखा नहीं जा सकता,
    उसे अगले सुराग का इंतज़ार करना होता है। नीचे दिए उदाहरण सबसे आसान से
    ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - हर सुराग को एक ही दिशा में मोड़ना
    - सुरागों को रेखा पर रखना, पहले पक्के वाले
    - जवाब पढ़ना, और हर सुराग को उससे मिलाकर जाँचना
  # The key under the steps: what the drawings' rings and outlines mean.
  legend:
    added: "नीला घेरा: इस कदम से जो जुड़ता है"
    free: अभी खाली जगह
    block: "ब्लॉक: दो, जो हमेशा अगल-बगल हैं"

examples:
  - title: तीन नावें
    question: >-
      तीन नावों में दौड़ हुई: एक लाल, एक नीली और एक हरी। लाल नाव नीली नाव के
      बाद पहुँची। हरी नाव नीली नाव से पहले पहुँची। कौन-सी नाव जीती?
    steps:
      - >-
        पहले सुराग को उलटते हैं: लाल नाव नीली के बाद पहुँची, यानी नीली नाव लाल
        से पहले पहुँची।
      - >-
        रेखा पर जो पहले पहुँची, वह बाईं ओर: नीली, फिर लाल। हरी नाव नीली से पहले
        पहुँची, इसलिए वह दोनों से आगे जाती है: हरी, नीली, लाल।
      - >-
        रेखा पर पहली हरी नाव है। जाँच: लाल नीली के बाद, हाँ; हरी नीली से पहले,
        हाँ।
    answer: हरी नाव जीती।
    badge: "1"
    art:
      red: लाल
      blue: नीली
      green: हरी
      before: पहले
      waits: इंतज़ार में
  - title: कैंटीन की कतार
    question: >-
      कैंटीन की कतार में पाँच बच्चे खड़े हैं: लता, हर्ष, नमिता, ओम और पवन।
      नमिता तीसरे स्थान पर खड़ी है। ओम ठीक नमिता के पीछे खड़ा है। हर्ष लता से
      आगे कहीं खड़ा है, और लता आखिरी नहीं है। सबसे आखिर में कौन खड़ा है?
    steps:
      - >-
        जो पक्का है, वह लिखते हैं: नमिता तीसरी है, और ठीक उसके पीछे ओम चौथा
        है। स्थान 1, 2 और 5 हर्ष, लता और पवन के लिए बचते हैं।
      - >-
        लता आखिरी नहीं है, इसलिए वह पहली या दूसरी है। हर्ष उससे आगे कहीं खड़ा
        है, इसलिए वह पहली नहीं हो सकती: लता दूसरी है, और हर्ष पहला।
      - >-
        बची हुई इकलौती जगह, पाँचवीं, पवन की है। हर सुराग जाँचते हैं: सभी सही
        बैठते हैं।
    answer: सबसे आखिर में पवन खड़ा है।
    badge: प
    note:
      title: हर सुराग मायने रखता है
      text: >-
        “लता आखिरी नहीं है” के बिना लता आखिर में भी खड़ी हो सकती थी: “नहीं”
        वाला यही छोटा सुराग कतार तय करता है।
    art:
      lena: ल
      lena-name: लता
      max: ह
      max-name: हर्ष
      nina: न
      nina-name: नमिता
      oleg: ओ
      oleg-name: ओम
      pavel: प
      pavel-name: पवन
      wait: इंतज़ार में
      waits: इंतज़ार में
      other: उस सुराग के बिना यह कतार भी सही बैठती
  - title: छह धावक
    question: >-
      एक दौड़ में छह धावक थे: आशा, भरत, जय, सपना, ईशान और फ़रहा। कोई भी दो एक
      साथ नहीं पहुँचे। भरत ठीक आशा के बाद पहुँचा। जय सपना के बाद, लेकिन आशा से
      पहले पहुँचा। फ़रहा ठीक ईशान से पहले पहुँची, और ईशान आखिरी नहीं था। सपना
      पहली नहीं थी। दौड़ किसने जीती?
    steps:
      - >-
        ब्लॉक ढूँढते हैं: “भरत ठीक आशा के बाद” से आशा-भरत बनता है, और “फ़रहा
        ठीक ईशान से पहले” से फ़रहा-ईशान। सपना, फिर जय, फिर ब्लॉक आशा-भरत, इसी
        क्रम में आते हैं।
      - >-
        सपना पहली नहीं थी, यानी उससे पहले कोई पहुँचा। जय, आशा और भरत, तीनों
        सपना के बाद पहुँचे: उससे आगे सिर्फ़ फ़रहा और ईशान हो सकते हैं, और वे
        साथ-साथ आते हैं।
      - >-
        तो दौड़ की शुरुआत फ़रहा-ईशान से होती है: फ़रहा, ईशान, सपना, जय, आशा,
        भरत। ईशान आखिरी नहीं है, जैसा सुराग कहता है। हर सुराग सही बैठता है।
    answer: फ़रहा जीती।
    badge: फ़
    note:
      title: ब्लॉक साथ-साथ चलते हैं
      text: >-
        जब सुराग कहता है “ठीक बाद”, तो दोनों धावक जहाँ भी जाएँ, अगल-बगल ही रहते
        हैं। उन्हें एक ब्लॉक मानें, तो छह धावकों की जगह चार चीज़ें ही रखनी होती
        हैं।
    art:
      ada: आ
      ada-name: आशा
      bob: भ
      bob-name: भरत
      cid: ज
      cid-name: जय
      dot: स
      dot-name: सपना
      eli: ई
      eli-name: ईशान
      fay: फ़
      fay-name: फ़रहा
      blocks: ब्लॉक
      order: क्रम
      only: “?” की जगह सिर्फ़ ये आ सकते हैं
      six: 6 धावक
      four: 4 ब्लॉक

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      एक सुराग पर ध्यान जाता है और दूसरा छूट जाता है, अक्सर “नहीं” वाला कोई
      छोटा सुराग, और रेखा पर गलत जवाब के लिए जगह बच जाती है।
    say: “कौन-सा सुराग अभी इस्तेमाल नहीं हुआ?”
    art:
      question: सुराग “लता आखिरी नहीं है” छूट गया
  reversed_relation:
    shows: >-
      “कविता रवि से छोटी है” को रेखा पर ऐसे रखा जाता है मानो कविता ज़्यादा लंबी
      हो: सुराग उलटे सिरे से पढ़ा जाता है, और जवाब उलटा निकलता है।
    say: “तो लंबा कौन है? इसे उलटकर बोलो।”
    art:
      clue: “कविता रवि से छोटी है”
  stopped_early:
    shows: >-
      जैसे ही पता चलता है कि कोई एक किसी दूसरे से छोटा है, वही जवाब दे दिया
      जाता है, जबकि शृंखला आगे जाती है: रवि अनु से छोटा है, पर कविता उससे भी
      छोटी है।
    say: “क्या रेखा पर आगे कोई और है?”
    art:
      clue-1: “रवि अनु से छोटा है”
      clue-2: “कविता रवि से छोटी है”
      who: सबसे छोटा कौन है?

home:
  - title: परिवार को कतार में खड़ा करें
    text: >-
      घर के सभी लोगों को पहले लंबाई के हिसाब से, फिर उम्र के हिसाब से खड़ा करें,
      और हर सुराग ज़ोर से बोलें: “पापा माँ से लंबे हैं, इसलिए पापा पहले खड़े
      होंगे।”
  - title: जवाब से पहले रेखा
    text: >-
      जवाब से पहले कागज़ पर रेखा माँगें। चित्र से तुरंत दिख जाता है कि कोई सुराग
      छूटा है या उलटी दिशा में मुड़ा है।
  - title: उलटकर बोलना
    text: >-
      एक झटपट खेल खेलें: आप कहें “बिल्ली कुत्ते से छोटी है”, और बच्चा उसे
      उलटकर कहे: “कुत्ता बिल्ली से बड़ा है।”

# What a parent can write in the chat to get a task on this topic.
ask: “क्रम में लगाना” विषय पर एक सवाल दें
