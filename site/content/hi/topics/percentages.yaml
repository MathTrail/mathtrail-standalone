# The page of the topic of percentages, for a parent, in Hindi. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: प्रतिशत
description: “प्रतिशत” विषय के सवाल क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    कोई कीमत 20% घटती है, और फिर दोबारा 20%। क्या वह 40% घट गई? प्रतिशत के इन
    सवालों में एक प्रतिशत किसी चीज़ का सौवाँ हिस्सा है, और सारी मुश्किल यह
    जानने में है कि वह चीज़ क्या है: पुरानी कीमत या नई, सारे पक्षी या सिर्फ़
    मुर्गियाँ। अगर बच्चा हर कदम से पहले “किसका प्रतिशत?” पूछे, तो ज़्यादातर
    गलतियाँ टल जाती हैं।
  method: हर कदम से पहले “किसका प्रतिशत?” पूछना
  teaches: यह पता करना कि प्रतिशत किसका लिया जा रहा है, और यह पहचानना कि वह कब बदलता है
  # The words of its drawing: the whole it is drawn for.
  art:
    line: 100% यानी 50

basis:
  title: प्रतिशत के नियम
  cards:
    - title: सौवाँ हिस्सा
      text: >-
        एक प्रतिशत किसी मात्रा का सौवाँ हिस्सा है। 100% पूरी मात्रा है, और 50%
        उसका आधा।
      art:
        half: 50% यानी आधा
    - title: किसका प्रतिशत?
      text: >-
        प्रतिशत हमेशा किसी चीज़ का होता है: पुरानी कीमत का या नई का, सारे
        मेहमानों का या सिर्फ़ लड़कियों का। एक ही 10% अलग-अलग मात्राओं से
        अलग-अलग संख्याएँ देता है।
      art:
        tens: 200 का 10% = 20 · 50 का 10% = 5
    - title: पहले दस प्रतिशत
      text: >-
        10% मात्रा को 10 से भाग देने पर मिलता है। उससे 20%, 30% या 5% बस एक कदम
        दूर हैं: 80 का 30% यानी 3 × 8 = 24।
      art:
        eighty: 80 यानी 8 के दस हिस्से

idea:
  title: आधार बदलता है
  lead: हर प्रतिशत उस समय की मात्रा का होता है। जब कीमत दो बार बदले, तो दूसरा बदलाव नई कीमत का होता है।
  table:
    head:
      - कदम
      - किसका
      - उसके बाद कीमत
    rows:
      - - 20% छूट
        - 200 का, यानी 40 कम
        - "160"
      - - फिर से 20% छूट
        - 160 का, यानी 32 कम
        - "128"
      - - दोनों मिलाकर
        - 200 का, यानी 72 कम
        - 36% छूट, 40% नहीं
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      दुकानें, बैंक और खबरें प्रतिशत में बात करती हैं, और पेच हमेशा यह होता है
      कि वे प्रतिशत किसके हैं। “किसका प्रतिशत?” पूछने की आदत बच्चे को ओलंपियाड
      के लिए भी तैयार करती है और दुकान के लिए भी।

method:
  title: "हल कैसे करें: सौ प्रतिशत पहचानना"
  lead: >-
    हर कदम से पहले बोलें कि कौन-सी मात्रा 100% है। उसका 1% या 10% निकालें, फिर
    वह प्रतिशत जो सवाल को चाहिए। जब मात्रा बदले, तो नए 100% से फिर शुरू करें।
    नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - बताना कि 100% क्या है
    - उसका 1% या 10% निकालना
    - पूछा गया प्रतिशत लेना, और जाँचना कि वह किसका है
  # The key under the steps: what a grid of the drawings stands for.
  legend:
    hundred: 100 खानों का ग्रिड यानी 100%

examples:
  - title: खेल क्लब
    question: >-
      एक स्कूल में 300 छात्र हैं, और उनमें से 35% किसी खेल क्लब में जाते हैं।
      कितने छात्र किसी खेल क्लब में नहीं जाते?
    steps:
      - "100% यानी सभी 300 छात्र, तो 1% यानी 300 ÷ 100 = 3 छात्र।"
      - जो क्लब नहीं जाते, वे छात्रों का 100% − 35% = 65% हैं।
      - 65% यानी 65 × 3 = 195 छात्र।
    answer: 195 छात्र।
    note:
      title: दूसरा तरीका
      text: >-
        300 का 35% यानी 35 × 3 = 105 छात्र जाते हैं, और 300 − 105 = 195। दोनों
        तरीकों से एक ही जवाब मिलता है; सीधे 65% लेने से एक कदम बचता है।
    art:
      go: 100 में से 35 खाने क्लब जाने वालों के
      grid: पूरा ग्रिड यानी 300 छात्र
      cell: एक खाना यानी 3 छात्र
      go-short: जाते हैं
      do-not: नहीं जाते
  - title: साइकिल की कीमत
    question: >-
      एक साइकिल की कीमत 400 सिक्के है। वसंत में उसकी कीमत 25% बढ़ती है, और
      पतझड़ में नई कीमत 20% घटती है। अब साइकिल की कीमत कितनी है?
    steps:
      - >-
        वसंत में 100% यानी पुरानी कीमत, 400 सिक्के: उसका 25% है 100 सिक्के, तो
        साइकिल 500 की हो जाती है।
      - "पतझड़ में 100% यानी नई कीमत, 500 सिक्के: उसका 20% है 100 सिक्के।"
      - 500 − 100 = 400। साइकिल की कीमत फिर से 400 सिक्के है।
    answer: 400 सिक्के।
    note:
      title: 420 क्यों नहीं?
      text: >-
        420 में पतझड़ के 20% पुरानी कीमत से लिए गए हैं, यानी 80 सिक्के। पर पतझड़
        तक कीमत 500 हो चुकी थी, और 500 का 20% है 100।
    art:
      coins: सिक्के, वसंत से पहले की कीमत
      quarters: "100% = 400: 25% के चार हिस्से"
      five-hundred: 500 सिक्के
      fifths: "100% = 500: 20% के पाँच हिस्से"
      of-old: 400 का 20% = 80 →
      of-new: 500 का 20% = 100 →
  - title: सूखते तरबूज़
    question: >-
      एक किसान के पास 200 किलोग्राम तरबूज़ हैं, जिनमें 99% पानी है। एक हफ़्ते
      बाद वे थोड़े सूख गए हैं और उनमें 98% पानी है। अब उनका वज़न कितना है?
    steps:
      - >-
        न सूखने वाला हिस्सा वह है जो पानी नहीं है: 200 किलोग्राम का 1%, यानी 2
        किलोग्राम। यह 2 किलोग्राम ही रहता है।
      - एक हफ़्ते बाद पानी 98% है, तो वही 2 किलोग्राम नए वज़न का 2% हैं।
      - "2% यानी 2 किलोग्राम, तो 1% यानी 1 किलोग्राम और 100% यानी 100 किलोग्राम।"
    answer: 100 किलोग्राम।
    note:
      title: आधा वज़न?
      text: >-
        हाँ। पानी सिर्फ़ 99% से 98% पर आया, पर जो हिस्सा पानी नहीं है, वह 1% से
        2% होकर दुगुना हो गया। वे 2 किलोग्राम वैसे ही रहे, इसलिए पूरे वज़न को आधा
        होना ही था।
    art:
      melons: 200 कि॰ग्रा॰, 99% पानी
      dry: "200 कि॰ग्रा॰: एक खाना यानी 1 कि॰ग्रा॰; नारंगी खाने पानी नहीं, 2 कि॰ग्रा॰"
      same: वही 2 कि॰ग्रा॰ अब 100 में से 2 खाने हैं
      was: पहले 200 कि॰ग्रा॰
      became: बाद में 100 कि॰ग्रा॰
      water: पानी 99%

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  percent_wrong_base:
    shows: >-
      प्रतिशत गलत मात्रा से निकाला जाता है: पतझड़ के 20% नई कीमत की जगह पुरानी
      कीमत से, या 98% तरबूज़ों के पुराने वज़न से।
    say: “अभी कौन-सी मात्रा 100% है?”
    art:
      question: पतझड़ में कीमत 500, 20% छूट
      of-old: 400 का 20% =
      of-new: 500 का 20% =
  part_whole_swap:
    shows: >-
      हिस्से को पूरा, या पूरे को हिस्सा मान लिया जाता है: जो 2 किलोग्राम पानी
      नहीं हैं, उन्हें तरबूज़ों का वज़न बता दिया जाता है, या पूरा स्कूल गिन लिया
      जाता है, जबकि सवाल उसके एक हिस्से के बारे में पूछता है।
    say: “यह संख्या हिस्सा है या पूरा?”
    art:
      question: तरबूज़ों का वज़न कितना है?
      dry: 2 कि॰ग्रा॰
      only-dry: सिर्फ़ जो पानी नहीं
      all: 100 कि॰ग्रा॰
      weight: पूरा वज़न
  answered_other_question:
    shows: >-
      रास्ते में मिली कोई संख्या जवाब बन जाती है: क्लब जाने वाले 105 छात्र, जबकि
      सवाल उनके बारे में पूछता है जो नहीं जाते; या कीमत की जगह वे 100 सिक्के,
      जितनी कीमत बदली।
    say: “सवाल ठीक-ठीक क्या पूछ रहा है?”
    art:
      question: कितने छात्र क्लब नहीं जाते?
      go: जाते हैं
      do-not: नहीं जाते

home:
  - title: दुकान में प्रतिशत
    text: >-
      दुकान में छूट वाली कोई कीमत ढूँढें और साथ मिलकर हिसाब लगाएँ: 150 पर 20%
      छूट के बाद कीमत कितनी होगी? 10% से शुरू करें।
  - title: पहले दस प्रतिशत
    text: >-
      किसी भी चीज़ का 10% निकालने का अभ्यास करें: 80 का, 350 का, 1200 का। 10% से
      ज़्यादातर दूसरे प्रतिशत बस एक कदम दूर हैं।
  - title: किसका प्रतिशत?
    text: >-
      जब खबरों में या किसी विज्ञापन में कोई प्रतिशत सुनाई दे, तो साथ मिलकर पूछें:
      किसका प्रतिशत? अक्सर यह कोई नहीं बताता।

# What a parent can write in the chat to get a task on this topic.
