# The page of the topic of gaps and boundaries, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: अंतराल और किनारे
description: “अंतराल और किनारे” विषय के सवाल क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    एक कतार में छह पेड़: उनके बीच कितने अंतराल हैं? पाँच टुकड़ों में कटा एक
    लट्ठा: कितने कट लगे? इन सवालों में या तो चीज़ें गिनी जाती हैं या उनके बीच
    के अंतराल, और दोनों संख्याओं में एक का फ़र्क होता है। ज़्यादातर गलत जवाब इसी एक से आते हैं, और किसी छोटी
    स्थिति का झटपट बना चित्र इसे ठीक कर देता है।
  method: छोटी स्थिति का चित्र बनाकर उस पर गिनना
  teaches: चीज़ों को उनके बीच के अंतरालों से अलग पहचानना, और किसी नियम को चित्र पर जाँचना
  # The words of its drawing: the fence and the rule over it, and the two
  # counts under it.
  art:
    line: बाड़ के चार खंभे
    rule: पहले खंभे गिनते हैं, फिर उनके बीच के अंतराल
    posts: "**4** खंभे"
    spans: "**3** अंतराल"

basis:
  title: अंतरालों के नियम
  cards:
    - title: कतार में एक कम
      text: >-
        अंतराल चीज़ों के बीच होते हैं, इसलिए कतार में अंतराल हमेशा चीज़ों से एक
        कम होते हैं: छह पेड़, पाँच अंतराल; लट्ठे के पाँच टुकड़े, चार कट।
      art:
        trees: 6 पेड़, 5 अंतराल
    - title: घेरे में उतने ही
      text: >-
        जब कतार घेरे में बंद हो जाती है, जैसे क्यारी के चारों ओर झाड़ियाँ, तो
        आखिरी और पहली चीज़ के बीच भी एक अंतराल होता है: अंतराल उतने ही होते हैं
        जितनी चीज़ें।
      art:
        bushes: 8 झाड़ियाँ, 8 अंतराल
    - title: दोनों सिरे गिने जाते हैं
      text: >-
        पन्ना 3 से पन्ना 7 तक 7 − 3 = 4 कदम हैं, पर पन्ने 5 हैं, क्योंकि पहला
        पन्ना भी पढ़ा जाता है। दोनों सिरों के साथ “… से … तक” गिनने पर एक जुड़
        जाता है।
      art:
        steps: 4 कदम
        pages: 4 कदम, पर 5 पन्ने

idea:
  title: चीज़ें या अंतराल?
  lead: हर सवाल इन दोनों में से किसी एक को गिनता है। कतार, घेरा और “… से … तक” अलग-अलग तरह से गिने जाते हैं, और एक छोटा-सा चित्र दिखा देता है कि कैसे।
  table:
    head:
      - चित्र
      - क्या गिना जाता है
      - कितने
    rows:
      - - कतार में 6 पेड़
        - उनके बीच के अंतराल
        - 6 − 1 = 5
      - - 5 टुकड़ों में एक लट्ठा
        - कट
        - 5 − 1 = 4
      - - क्यारी के चारों ओर 8 झाड़ियाँ
        - उनके बीच के अंतराल
        - "8"
      - - पन्ने 3 से 7 तक
        - पढ़े गए पन्ने
        - 7 − 3 + 1 = 5
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      जिस जवाब में एक की चूक हो, वह लगभग सही दिखता है, इसलिए बच्चे का ध्यान उस
      पर कम ही जाता है। कागज़ पर बने दो-तीन खंभे तुरंत दिखा देते हैं कि एक
      जोड़ना है, एक घटाना है, या कुछ भी नहीं।

method:
  title: "हल कैसे करें: छोटी स्थिति का चित्र बनाना"
  lead: >-
    चीज़ों को बिंदुओं या खंभों की तरह बनाएँ, पहले किसी छोटी संख्या के लिए, दो
    या तीन। चित्र पर अंतराल गिनें, नियम देखें, और उसके बाद ही उसे सवाल की
    संख्याओं पर लगाएँ। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते
    हैं।
  steps:
    - चीज़ें और अंतराल बनाना
    - पता करना कि सवाल इनमें से किसे गिनता है
    - हल निकालना, और नियम को छोटी स्थिति पर जाँचना
  # The key under the steps: what the drawings' blue and red mean.
  legend:
    counted: "नीले में: जो गिना जाता है"
    cut: कट

examples:
  - title: बस का रास्ता
    question: >-
      एक बस के रास्ते में 6 स्टॉप हैं। एक स्टॉप से अगले तक पहुँचने में बस को 3
      मिनट लगते हैं। पहले स्टॉप से आखिरी तक बस को कितने मिनट लगते हैं?
    steps:
      - 6 स्टॉपों को बिंदुओं से बनाते हैं। बस उनके बीच के अंतरालों पर चलती है।
      - 6 स्टॉपों के बीच 5 अंतराल हैं, स्टॉपों से एक कम।
      - "हर अंतराल में 3 मिनट लगते हैं: 5 × 3 = 15।"
    answer: 15 मिनट।
    note:
      title: 18 क्यों नहीं?
      text: >-
        6 × 3 = 18 हर स्टॉप को उसका अपना अंतराल दे देता है, पर आखिरी स्टॉप के
        बाद बस कहीं नहीं जाती: मिनट स्टॉपों के बीच ही खर्च होते हैं।
    art:
      stops: 6 स्टॉप, अगले स्टॉप तक 3 मिनट
      minutes: "{count} मि॰"
      total: 5 × 3 = 15 मिनट
      end: 6ठे स्टॉप के बाद रास्ता नहीं
  - title: मंज़िल 9 और मंज़िल 3
    question: >-
      लता एक इमारत की मंज़िल 9 पर रहती है और मधु उसी इमारत की मंज़िल 3 पर,
      और दोनों मंज़िल 1 से पैदल चढ़ती हैं। सारे ज़ीने एक जैसे हैं। लता मधु के
      मुकाबले कितने गुना सीढ़ियाँ चढ़ती है?
    steps:
      - >-
        मधु मंज़िल 1 से मंज़िल 3 तक चढ़ती है: 2 ज़ीने, 1 से 2 तक और 2 से 3 तक।
      - >-
        लता मंज़िल 1 से मंज़िल 9 तक चढ़ती है, यानी 8 ज़ीने, उसकी मंज़िल की
        संख्या से एक कम।
      - "सारे ज़ीने एक जैसे हैं, इसलिए 8 ÷ 2 = 4। लता 4 गुना सीढ़ियाँ चढ़ती है।"
    answer: 4 गुना।
    note:
      title: 3 गुना क्यों नहीं?
      text: >-
        9 ÷ 3 = 3 मंज़िलों को बाँटता है, पर सीढ़ियाँ मंज़िलों के बीच के ज़ीनों पर
        हैं, और मंज़िल 1 तक कोई नहीं चढ़ता।
    art:
      masha: म
      lena: ल
      third: मंज़िल 3
      ninth: मंज़िल 9
      from: दोनों मंज़िल 1 से चढ़ती हैं
      masha-name: मधु
      lena-name: लता
      two: ज़ीने
      eight: ज़ीने
      times: लता के 8 ज़ीने, यानी 4 बार मधु के 2
      floors: मंज़िलें
      flights: ज़ीने
  - title: कितने लट्ठे?
    question: >-
      लकड़हारों ने आरी से कुछ लट्ठे काटे, और हर लट्ठे को कम से कम एक बार काटा
      गया। उन्होंने कुल 9 कट लगाए और उन्हें 14 टुकड़े मिले। उन्होंने कितने लट्ठे
      काटे?
    steps:
      - >-
        एक लट्ठा काटते हैं: 1 कट से 2 टुकड़े बनते हैं, 2 कट से 3। आखिर में हर
        लट्ठे के टुकड़े उसके कटों से एक ज़्यादा होते हैं।
      - इसे सभी लट्ठों के लिए जोड़ते हैं। टुकड़े उतने हैं जितने कट, और हर लट्ठे का एक और।
      - 14 − 9 = 5। लट्ठे 5 थे।
    answer: 5 लट्ठे।
    note:
      title: क्या इससे फ़र्क पड़ता है कि कट कैसे बँटे?
      text: >-
        नहीं। 9 कट वाले पाँच लट्ठों से 14 टुकड़े ही बनते हैं, चाहे ज़्यादातर कट
        एक ही लट्ठे पर लगे हों या लगभग बराबर बँटे हों: हर कट एक टुकड़े को दो
        बना देता है।
    art:
      cuts: 9 कट
      pieces: 14 टुकड़े
      logs: "लट्ठे: ?"
      one: 1 कट, 2 टुकड़े
      two: 2 कट, 3 टुकड़े
      sum: "टुकड़े = कट + लट्ठे: 9 = 6 + 3"
      all: 9 कट · 14 टुकड़े · 5 लट्ठे

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  off_by_one:
    shows: >-
      स्टॉपों के बीच के अंतरालों की जगह स्टॉप गिने जाते हैं, या खंभों की जगह
      अंतराल: 6 स्टॉप से 6 × 3 = 18 मिनट बन जाते हैं। जवाब में एक की चूक है,
      इसलिए वह लगभग सही दिखता है।
    say: “तीन स्टॉप बनाओ। उनके बीच कितने अंतराल हैं?”
  wrong_operation:
    shows: >-
      सवाल की संख्याओं के साथ वह किया जाता है जो चित्र नहीं माँगता: उन्हें जोड़
      दिया जाता है, 6 + 3, या किसी एक को दुगुना कर दिया जाता है, जबकि अंतराल
      गिनकर हर एक को उसके मिनट देने थे।
    say: “एक अंतराल में कितना समय लगता है, और अंतराल कितने हैं?”
  number_from_text:
    shows: >-
      सवाल की कोई संख्या ही जवाब बन जाती है: 6 स्टॉप, जबकि सवाल मिनट पूछ रहा
      है, या मंज़िल 9, जबकि सवाल ज़ीने पूछ रहा है।
    say: "“यह संख्या क्या गिनती है: स्टॉप या अंतराल?”"
    art:
      question: "सवाल: कितने मिनट?"
      stops: स्टॉप
      minutes: मिनट

home:
  - title: उँगलियाँ और अंतराल
    text: >-
      अपनी उँगलियाँ फैलाएँ: पाँच उँगलियाँ, उनके बीच चार अंतराल। यह पूरे विषय
      का सबसे झटपट चित्र है, और यह हमेशा हाथ में ही रहता है।
  - title: घर के रास्ते की सीढ़ियाँ
    text: >-
      सीढ़ियों पर मंज़िलें और ज़ीने साथ मिलकर गिनें: मंज़िल 1 से मंज़िल 4 तक
      कितने ज़ीने? और मंज़िल 2 से मंज़िल 4 तक?
  - title: खंभे और बेंचें
    text: >-
      सैर पर बाड़ के खंभे और उनके बीच के अंतराल गिनें, या तालाब के चारों ओर की
      बेंचें। कतार में अंतराल एक कम होते हैं; घेरे में उतने ही।

