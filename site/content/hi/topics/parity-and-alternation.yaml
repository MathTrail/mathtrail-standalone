# The page of the topic of parity and alternation, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: सम-विषम और बारी-बारी
description: “सम-विषम और बारी-बारी” विषय के सवाल, यानी सम और विषम संख्याओं और बारी-बारी आने वाली चीज़ों के सवाल, क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words the page's drawings say of a number and of a corner of the cube.
art:
  even: सम
  odd: विषम
  start: शुरू

hero:
  lead: >-
    क्या 15 बच्चे घेरे में ऐसे खड़े हो सकते हैं कि पूरे घेरे में लड़का, लड़की,
    लड़का, लड़की बारी-बारी आएँ? इन सवालों में सम और विषम संख्याएँ सब कुछ गिने
    बिना या हर तरीका आज़माए बिना जवाब दे देती हैं: नौका किस किनारे पर है, इतने
    अंक बन सकते हैं या नहीं, आखिरी चाल किसकी होगी। बहुत से बच्चे सम-विषम में
    पहली बार ऐसी चीज़ से मिलते हैं, जो चालें कैसे भी चलें, वैसी ही रहती है।
  method: देखना कि हर चाल सम और विषम के साथ क्या करती है
  teaches: हर तरीका आज़माए बिना “क्या ऐसा हो सकता है?” का जवाब देना
  # The words of its drawing: who takes turns, the key of the colours, and
  # what the two circles show.
  art:
    line: घेरे में लड़के और लड़कियाँ बारी-बारी
    boy: लड़का
    girl: लड़की
    six: "6 बच्चे: बनता है"
    five: "5 बच्चे: नहीं बनता"
    even: घेरे में बारी-बारी तभी बनता है, जब बच्चों की संख्या सम हो

basis:
  title: सम-विषम के नियम
  cards:
    - title: सम के जोड़े बनते हैं
      text: >-
        चीज़ें सम संख्या में हों, तो उनके जोड़े बन जाते हैं, एक भी नहीं बचती।
        विषम संख्या में हमेशा एक चीज़ बिना जोड़े के रह जाती है।
    - title: सिर्फ़ विषम संख्याएँ मायने रखती हैं
      text: >-
        सम और सम का योग सम, विषम और विषम का योग सम, और सम और विषम का योग विषम
        होता है। इसलिए योग सम है या नहीं, यह सिर्फ़ इस पर निर्भर है कि उसमें
        कितनी विषम संख्याएँ हैं।
    - title: बारी-बारी
      text: >-
        जब दो चीज़ें बारी-बारी आती हैं, तो एक विषम जगहों पर होती है और दूसरी सम
        जगहों पर। पूरे घेरे में बारी-बारी का क्रम तभी बनता है, जब घेरे में
        जगहें सम संख्या में हों।
      art:
        places: लड़के विषम जगहों पर, लड़कियाँ सम जगहों पर

idea:
  title: सिर्फ़ विषम संख्याएँ गिनें
  lead: योग सम है या नहीं, यह जानने के लिए जोड़ने की ज़रूरत नहीं। गिनें कि उसमें कितनी विषम संख्याएँ हैं।
  table:
    head:
      - योग
      - उसमें विषम संख्याएँ
      - योग है
    rows:
      - - 4 + 6 + 8
        - एक भी नहीं
        - सम
      - - 3 + 5
        - "2"
        - सम
      - - 3 + 5 + 7
        - "3"
        - विषम
      - - 1 + 2 + … + 10
        - "5"
        - विषम
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      ओलंपियाड के बहुत से सवाल पूछते हैं कि क्या कुछ हो भी सकता है। सम-विषम
      तरीके आज़माए बिना “नहीं” कह सकता है: अगर हर चाल किसी संख्या को सम ही
      रखती है और लक्ष्य के लिए उसे विषम होना है, तो कोई भी चाल लक्ष्य तक कभी
      नहीं ले जाएगी।

method:
  title: "हल कैसे करें: सम-विषम पर नज़र रखना"
  lead: >-
    सवाल में ऐसी संख्या ढूँढें, जो सम या विषम हो: कोई गिनती, कोई योग, पंक्ति
    में कोई जगह। देखें कि हर चाल या हर कदम से उसका क्या होता है, वह बदलती है
    या वैसी ही रहती है, और शुरुआत की तुलना लक्ष्य से करें। नीचे दिए उदाहरण
    सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - ढूँढना कि क्या सम या विषम है
    - देखना कि हर कदम उसके साथ क्या करता है
    - शुरुआत की तुलना लक्ष्य से करना

examples:
  - title: नौका
    question: >-
      एक नौका गाड़ियों को नदी के पार ले जाती है और वापस लाती है, बार-बार। शुरू
      में वह बाएँ किनारे पर है। नदी को 7 बार पार करने के बाद वह किस किनारे पर
      होगी?
    steps:
      - 1 बार पार करने के बाद नौका दाएँ किनारे पर होती है, और 2 बार के बाद फिर बाएँ पर।
      - >-
        हर दो बार पार करने पर वह वहीं लौट आती है, जहाँ से चली थी। इसलिए सम बार
        पार करने के बाद वह बाएँ किनारे पर होती है, और विषम बार के बाद दाएँ पर।
      - 7 विषम है, इसलिए नौका दाएँ किनारे पर है।
    answer: दाएँ किनारे पर।
    badge: →
    note:
      title: बस गिन क्यों न लें?
      text: >-
        7 बार पार करने के लिए गिनना जल्दी हो जाता है। नियम 100 बार के लिए भी
        उतनी ही जल्दी जवाब देता है, और कठिन सवालों को नियम की ही ज़रूरत होती
        है।
    art:
      start: शुरू में, बाएँ किनारे पर
      none: 0 बार पार
      one: 1 बार पार
      two: 2 बार पार
      left: बायाँ किनारा
      right: दायाँ किनारा
  - title: चार डार्ट
    question: >-
      रवि 4 डार्ट एक ऐसे निशाने पर फेंकता है, जिसके घेरों के 1, 3, 5 और 7 अंक
      हैं, और हर डार्ट निशाने पर लगता है। रवि कहता है कि उसके 15 अंक हुए। क्या
      यह सच हो सकता है?
    steps:
      - हर घेरे के अंक विषम हैं।
      - >-
        दो विषम संख्याओं का योग सम होता है। 4 डार्ट यानी दो जोड़े, और हर जोड़े
        से सम अंक मिलते हैं, इसलिए 4 डार्ट मिलकर भी सम अंक ही देते हैं।
      - 15 विषम है, इसलिए रवि के इतने अंक नहीं हो सकते।
    answer: नहीं।
    badge: ✕
    note:
      title: और 3 डार्ट हों तो?
      text: >-
        तीन विषम संख्याओं का योग विषम होता है, और 15 बन सकता है: 5 + 5 + 5,
        या 7 + 7 + 1।
    art:
      darts: 4 डार्ट, सब निशाने पर
      rings: हर घेरा विषम
      only-even: और 4 डार्ट से सिर्फ़ सम अंक बनते हैं
  - title: घन पर मकड़ी
    question: >-
      तार से बने एक घन के एक कोने पर मकड़ी बैठी है। हर मिनट वह एक किनारे के
      साथ-साथ रेंगकर अगले कोने तक जाती है। क्या ठीक 7 मिनट बाद वह उसी कोने पर
      वापस पहुँच सकती है, जहाँ से चली थी?
    steps:
      - >-
        कोनों को रंगते हैं: शुरुआत वाला सफ़ेद, उसके पड़ोसी काले, उनके पड़ोसी
        सफ़ेद, और इसी तरह आगे। जैसा चित्र में दिखता है, हर किनारा एक काले कोने
        को एक सफ़ेद कोने से जोड़ता है।
      - >-
        इसलिए हर मिनट रंग बदलता है: 1 मिनट बाद मकड़ी काले कोने पर होती है, 2
        मिनट बाद सफ़ेद पर, और मिनटों की किसी भी विषम संख्या के बाद काले पर।
      - 7 विषम है, और शुरुआत वाला कोना सफ़ेद है। मकड़ी वापस नहीं पहुँच सकती।
    answer: नहीं।
    badge: ✕
    note:
      title: और 8 मिनट बाद?
      text: >-
        हाँ: एक किनारे पर जाकर लौटना, ऐसा चार बार करने से वह वापस शुरुआत वाले
        कोने पर आ जाती है। रंग बताते हैं कि कब ऐसा नहीं हो सकता; सम संख्या में
        मिनट काफ़ी हैं, यह अलग से दिखाना पड़ता है।
    art:
      edge: हर मिनट एक किनारा
      minutes: "मिनट: सम पर सफ़ेद कोना, विषम पर काला"
      seven: 7 मिनट बाद
      back: जाना और लौटना × 4
      eight: 8 मिनट

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_parity:
    shows: >-
      सम और विषम आपस में जगह बदल लेते हैं: मान लिया जाता है कि 7 बार पार करने
      के बाद नौका वहीं लौट आई, जहाँ से चली थी, या कि चार विषम संख्याओं का योग
      विषम होता है।
    say: "“छोटी संख्याओं से आज़माओ: 1 बार पार करने के बाद नौका कहाँ है, 2 बार के बाद?”"
    art:
      question: 7 बार पार करने के बाद नौका कहाँ है?
  ignored_condition:
    shows: >-
      सवाल की एक शर्त छूट जाती है: तीन डार्ट से 15 अंक बना लिए जाते हैं, और यह
      ध्यान नहीं रहता कि रवि ने चार फेंके थे; या ऐसी संख्या चुन ली जाती है, जो
      एक सुराग पर ठीक बैठती है और दूसरे पर नहीं।
    say: “सवाल फिर से पढ़ो। क्या तुम्हारा जवाब उसके हर शब्द पर ठीक बैठता है?”
    art:
      question: "डार्ट: 4"
      three: 3 डार्ट
      always: हमेशा सम
  off_by_one:
    shows: >-
      पंक्ति में जगह गिनने में एक की चूक होती है: शुरुआत को ही पहली बार पार
      करना मान लिया जाता है, या जो पंक्ति लड़के से शुरू होकर लड़के पर खत्म होती
      है, उसमें लड़के और लड़कियाँ बराबर मान लिए जाते हैं।
    say: “शुरू के कुछ लिखकर देखो। नंबर 1 कौन-सा है?”
    art:
      equal: दोनों बराबर

home:
  - title: सम या विषम?
    text: >-
      मुट्ठी में कुछ बटन छिपाएँ और बच्चे को अंदाज़ा लगाने दें: सम या विषम? फिर
      बटनों के जोड़े बनाकर साथ मिलकर जाँचें।
  - title: दसवीं चाल किसकी होगी?
    text: >-
      किसी भी ऐसे खेल में, जिसमें दो खिलाड़ी बारी-बारी चलते हैं, खेल खत्म होने
      से पहले पूछें: दसवीं चाल किसकी होगी? और पंद्रहवीं? जवाब सम-विषम से मिलता
      है, आगे खेलकर नहीं।
  - title: घरों के नंबर
    text: >-
      किसी गली में घरों के नंबर देखें: एक ओर सम, दूसरी ओर विषम। नंबर 37 किस ओर
      होगा?

# What a parent can write in the chat to get a task on this topic.
ask: “सम-विषम और बारी-बारी” विषय पर एक सवाल दें
