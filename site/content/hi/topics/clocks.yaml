# The page of the topic of clocks, for a parent, in Hindi. The topic's name,
# its group, its grades and its traps' names are not here: they are the card's
# words and the catalog's numbers. The page's drawings, each example's level,
# and the answer its solver proves, are the site's data; an example here is
# worked through to that answer. The traps are the topic's commonest, counted in
# its reference tasks.

title: घड़ी
description: “घड़ी” विषय के सवाल, यानी घड़ी और बीते समय के सवाल, क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words the page's drawings write a length of time in.
art:
  minutes: "{count} मि॰"
  hours: "{count} घं॰"
  both: "{hours} घं॰ {minutes} मि॰"

hero:
  lead: >-
    सैर 4:50 बजे शुरू होती है और 25 मिनट चलती है: यह कितने बजे खत्म होगी?
    घड़ी और बीते समय के इन सवालों में बच्चे को समय जोड़ना और घटाना होता है,
    और पेच यह है कि घंटे में 60 मिनट होते हैं, 100 नहीं। सबसे ज़्यादा गलतियाँ
    तब होती हैं, जब समय पूरे घंटे, दोपहर 12 बजे या आधी रात के पार जाता है।
  method: पहले पूरे घंटे तक जाना, फिर आगे बढ़ना
  teaches: घंटे और आधी रात के पार समय गिनना, और घड़ी के समय को बीते समय से अलग पहचानना
  # The words of its drawing: the walk over it, and what its line of time
  # shows under it.
  art:
    line: 4:50 से 25 मिनट की सैर
    whole: पहले पूरे घंटे तक, फिर आगे

basis:
  title: घड़ी के नियम
  cards:
    - title: एक घंटे में 60 मिनट
      text: >-
        100 नहीं। इसलिए 8:50 के 20 मिनट बाद 9:10 बजते हैं, 8:70 नहीं, और 110
        मिनट यानी 1 घंटा 50 मिनट, 1 घंटा 10 नहीं।
    - title: पूरे घंटे से होकर
      text: >-
        घंटे के पार समय जोड़ना हो, तो पहले पूरे घंटे तक जाएँ और बाकी समय उसके
        बाद जोड़ें: 8:50 से 9:00 तक 10 मिनट, फिर 10 और।
    - title: एक दिन में 24 घंटे
      text: >-
        23:59 के बाद अगले दिन का 0:00 आता है। 22:00 से 6:00 तक का समय यानी
        आधी रात तक 2 घंटे और उसके बाद 6 घंटे।
      art:
        midnight: "0:00 यानी आधी रात, अगले दिन की शुरुआत"

idea:
  title: पूरे घंटे से होकर
  lead: एक समय से दूसरे समय तक कितना समय बीता? रास्ते में पूरे घंटे पर रुकें। इससे एक कठिन घटाव दो आसान कदमों में बदल जाता है।
  table:
    head:
      - कब से कब तक
      - पूरे घंटे से होकर
      - कितना समय
    rows:
      - - 8:40 से 9:15 तक
        - 20 मि॰ + 15 मि॰
        - 35 मि॰
      - - 10:50 से 12:30 तक
        - 10 मि॰ + 1 घं॰ 30 मि॰
        - 1 घं॰ 40 मि॰
      - - 22:30 से 6:00 तक
        - 1 घं॰ 30 मि॰ + 6 घं॰
        - 7 घं॰ 30 मि॰
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      एक समय को दूसरे के नीचे लिखकर घटाने पर, 9:15 − 8:40, बच्चे का मन 60 की
      जगह 100 मिनट उधार लेने का करता है। पूरे घंटे से होकर आगे गिनने में यह
      गलती कभी नहीं होती।

method:
  title: "हल कैसे करें: समय की रेखा"
  lead: >-
    एक रेखा खींचें और उस पर समय क्रम से लिखें, पहले वाला बाईं ओर। पहले पूरे
    घंटे तक जाएँ, फिर पूरे-पूरे घंटों में आगे बढ़ें, फिर बचे हुए मिनट जोड़ें।
    नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - रेखा पर समय क्रम से लिखना, पहले वाला पहले
    - पहले पूरे घंटे तक जाना, फिर आगे बढ़ना
    - कदमों को जोड़ना, और जाँचना कि जवाब पहले होना चाहिए या बाद में
  # The key under the steps: what the drawings' boxes and arrows mean.
  legend:
    whole: पूरा घंटा
    lasts: कितना समय

examples:
  - title: तैराकी की क्लास
    question: >-
      तरुण की तैराकी की क्लास 3:45 बजे शुरू होती है और 40 मिनट चलती है। यह
      कितने बजे खत्म होती है?
    steps:
      - "3:45 से पूरे घंटे तक, यानी 4:00 तक, 15 मिनट होते हैं।"
      - "4:00 के बाद 40 − 15 = 25 मिनट बचते हैं।"
      - "4:00 के 25 मिनट बाद 4:25 बजते हैं।"
    answer: 4:25 बजे।
    note:
      title: 3:85 क्यों नहीं?
      text: >-
        45 + 40 = 85, पर घड़ी में 85 मिनट होते ही नहीं: 60 पर घंटा बदल जाता
        है। पहले पूरे घंटे तक जाने से ऐसा समय कभी नहीं बनता।
    art:
      start: क्लास शुरू, 40 मिनट की
      split: 40 मिनट = 15 (4:00 तक) + 25 (बाद में)
      never: ऐसा समय नहीं होता
      right: सही
  - title: शतरंज का टूर्नामेंट
    question: >-
      एक शतरंज टूर्नामेंट में 5 दौर हैं। हर दौर 50 मिनट चलता है, और हर दो
      दौरों के बीच 15 मिनट का ब्रेक होता है। पहला दौर 10:00 बजे शुरू होता है।
      आखिरी दौर कितने बजे खत्म होता है?
    steps:
      - "5 दौर, हर एक 50 मिनट का: 5 × 50 = 250 मिनट का खेल।"
      - >-
        ब्रेक सिर्फ़ दौरों के बीच होते हैं, इसलिए वे 4 हैं, 5 नहीं:
        4 × 15 = 60 मिनट।
      - >-
        250 + 60 = 310 मिनट, यानी 5 घंटे 10 मिनट। 10:00 के 5 घंटे 10 मिनट
        बाद 15:10 बजते हैं।
    answer: 15:10 बजे।
    note:
      title: 13:10 क्यों नहीं?
      text: >-
        310 मिनट 3 घंटे 10 मिनट नहीं हैं: घंटे में 60 मिनट होते हैं, 100 नहीं।
        310 = 5 × 60 + 10।
    art:
      round: दौर, 50 मि॰
      break: ब्रेक, 15 मि॰
      rounds: 5 × 50 = 250 मिनट
      breaks: "ब्रेक दौरों से एक कम: 4 × 15 = 60"
      total: 310 मि॰ = 5 × 60 + 10
      hours: 5 घंटे, हर एक 60 मिनट का, और ऊपर से 10
  - title: दो शहर
    question: >-
      अनु दूसरे शहर में रहती है, और दादी हवाई जहाज़ से उससे मिलने जाती हैं।
      जहाज़ दादी के शहर की घड़ियों के हिसाब से 8:00 बजे उड़ान भरता है और अनु के
      शहर की घड़ियों के हिसाब से 8:30 बजे उतरता है। अनु के शहर की घड़ियाँ दादी
      के शहर की घड़ियों से 4 घंटे कम दिखाती हैं। उड़ान कितनी देर की है?
    steps:
      - >-
        8:00 और 8:30 अलग-अलग घड़ियों पर पढ़े गए हैं, इसलिए पहले दोनों समय एक
        ही घड़ी पर लाते हैं: दादी की घड़ी पर।
      - "जब अनु के शहर की घड़ियाँ 8:30 दिखाती हैं, तब दादी के शहर की घड़ियाँ 4 घंटे ज़्यादा दिखाती हैं: 12:30।"
      - "एक ही घड़ी पर 8:00 से 12:30 तक 4 घंटे 30 मिनट होते हैं।"
    answer: 4 घंटे 30 मिनट।
    badge: "4:30"
    note:
      title: आधा घंटा?
      text: >-
        8:30 − 8:00 आधा घंटा तभी है, जब दोनों समय एक ही घड़ी के हों। दो शहरों
        के समय की तुलना तब की जाती है, जब उनमें से एक को दूसरे की घड़ी पर ले
        आया जाए।
    art:
      take-off: उड़ान भरना, दादी के यहाँ
      landing: उतरना, अनु के यहाँ
      grandma-clock: दादी की घड़ी
      ann-clock: अनु की घड़ी
      at-ann: अनु के यहाँ
      at-grandma: दादी के यहाँ
      grandma: दादी
      ann: अनु
      other: अलग-अलग घड़ियाँ

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  wrong_operation:
    shows: >-
      ऐसी संक्रिया चुन ली जाती है, जो सवाल नहीं माँगता: घड़ी के दो समय ऐसे
      जोड़ दिए जाते हैं, जैसे वे मात्राएँ हों, 3 बजे और 5 बजे मिलकर 8, या जहाँ
      बस आगे गिनना है, वहाँ गुणा कर दिया जाता है। घड़ी का समय रेखा पर एक बिंदु
      है, कोई मात्रा नहीं।
    say: “यह घड़ी का समय है या बीता हुआ समय?”
    art:
      question: "3:00 से 5:00 तक: कितना समय?"
  time_unit_mixup:
    shows: >-
      मिनट ऐसे गिने जाते हैं, जैसे घंटे में 100 मिनट हों: 3:45 में 40 मिनट और
      जोड़ने पर 3:85 बन जाता है, या 310 मिनट 3 घंटे 10 मिनट बन जाते हैं।
    say: “एक घंटे में कितने मिनट होते हैं?”
    art:
      question: "3:45 के 40 मिनट बाद"
  reversed_relation:
    shows: >-
      पहले और बाद आपस में जगह बदल लेते हैं: सवाल आगे की ओर चलता है, पर गिनती
      पीछे की ओर होती है, या समय का जो अंतर घटाना था, वह जोड़ दिया जाता है, और
      जहाज़ उड़ान भरने से पहले ही उतर जाता है।
    say: “जवाब शुरुआत से पहले होना चाहिए या बाद में?”
    art:
      question: दादी की घड़ी पर 8:00 बजे उड़ान भरना
      before: उड़ान भरने से पहले उतरना?

home:
  - title: सुइयों वाली घड़ी
    text: >-
      सुइयों वाली घड़ी ऐसी जगह रखें, जहाँ बच्चे को वह दिखे, और बातों-बातों में
      पूछें: पंद्रह मिनट बाद कितने बजेंगे? और बीस मिनट पहले कितने बजे थे?
  - title: कितना समय बाकी है?
    text: >-
      कार्टून या सैर से पहले साथ मिलकर अंदाज़ा लगाएँ कि कितनी देर और इंतज़ार
      करना है, फिर घड़ी पर जाँचें। असली इंतज़ार में मिनट महसूस होते हैं।
  - title: दिन की योजना
    text: >-
      छुट्टी के एक दिन की योजना समय के साथ लिखें: 11:30 से 12:15 तक सैर,
      12:30 बजे दोपहर का खाना। हर हिस्सा कितनी देर का है, और उनके बीच कितना
      समय है?

# What a parent can write in the chat to get a task on this topic.
