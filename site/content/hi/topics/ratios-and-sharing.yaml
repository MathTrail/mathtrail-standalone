# The page of the topic of ratios and sharing, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: अनुपात और बँटवारा
description: “अनुपात और बँटवारा” विषय के सवाल (अनुपात और समानुपात) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words the page's drawings name their people and boxes in.
art:
  ann: अनु
  ben: रवि
  a: A
  b: B

hero:
  lead: >-
    अनु और रवि 35 टॉफ़ियाँ 3 : 4 के अनुपात में बाँटते हैं। हर एक को कितनी
    टॉफ़ियाँ मिलती हैं? इन सवालों में अनुपात यह बताता है कि हर एक को कितने बराबर
    हिस्से मिलते हैं, यह नहीं कि कितनी चीज़ें। सबसे पहले हिस्सों को गिनने और फिर
    एक हिस्से का मान निकालने से अनुपात का हर सवाल भाग का सवाल बन जाता है।
  method: हिस्से गिनना, फिर एक हिस्से का मान निकालना
  teaches: अनुपात को बराबर हिस्सों के रूप में देखना, और रेसिपी की मात्राएँ बढ़ाना या घटाना
  # The words of its drawing: what is shared over it, and what the parts come
  # to under it.
  art:
    line: "35 टॉफ़ियाँ 3 : 4 के अनुपात में"
    parts: 7 हिस्से = 35, एक हिस्सा = 5
    shares: अनु को 3 × 5 = 15, रवि को 4 × 5 = 20

basis:
  title: अनुपात के नियम
  cards:
    - title: अनुपात यानी हिस्से
      text: >-
        3 : 4 का मतलब है: एक के हर 3 बराबर हिस्सों पर दूसरे के 4 हिस्से। कुल
        मिलाकर ये 7 बराबर हिस्से हैं, 3 या 4 नहीं।
      art:
        seven: "3 : 4 यानी 7 बराबर हिस्से"
    - title: पहले एक हिस्सा
      text: >-
        एक हिस्सा निकालने के लिए कुल को हिस्सों की संख्या से भाग दें, फिर उसे हर
        एक के हिस्सों की संख्या से गुणा करें: 35 ÷ 7 = 5, इसलिए 3 हिस्से 15 हैं
        और 4 हिस्से 20।
      art:
        one: एक हिस्से में 35 ÷ 7 = 5
    - title: दोनों ओर एक ही संख्या से गुणा
      text: >-
        अगर अनुपात की दोनों संख्याओं को एक ही संख्या से गुणा किया जाए, तो अनुपात
        वही रहता है: 3 : 4 वही है जो 6 : 8 और 30 : 40। रेसिपी ऐसे ही बढ़ाई जाती
        है।

idea:
  title: हिस्से गिनें
  lead: अनुपात कोई भी हो, पहले उसकी संख्याएँ जोड़ें। यही योग बताता है कि पूरा कितने बराबर हिस्सों में बँटता है।
  table:
    head:
      - क्या बाँटना है
      - हिस्से
      - एक हिस्सा और बँटवारा
    rows:
      - - "35 टॉफ़ियाँ, 3 : 4"
        - 3 + 4 = 7
        - 35 ÷ 7 = 5, इसलिए 15 और 20
      - - "60 कार्ड, 1 : 2 : 3"
        - 1 + 2 + 3 = 6
        - 60 ÷ 6 = 10, इसलिए 10, 20 और 30
      - - "45 मनके, 2 : 7"
        - 2 + 7 = 9
        - 45 ÷ 9 = 5, इसलिए 10 और 35
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      सबसे आम गलती है अनुपात की संख्याओं के योग की जगह उनमें से किसी एक संख्या
      से भाग देना: 35 ÷ 3 या 35 ÷ 4। हर हिस्से के लिए एक खाना बनाने से योग छूट
      ही नहीं सकता।

method:
  title: "हल कैसे करें: हर हिस्से के लिए एक खाना"
  lead: >-
    अनुपात के हर हिस्से के लिए एक खाना बनाएँ, और हर हिस्सेदार के लिए खानों की एक
    पंक्ति। सारे खाने गिनें, निकालें कि एक खाने में कितना आता है, फिर हर एक का
    हिस्सा भरें। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - हर हिस्से के लिए एक खाना बनाना
    - निकालना कि एक खाने में कितना आता है
    - हर एक का हिस्सा भरना, और कुल की जाँच करना
  # The key under the steps: what a tile of the drawings means.
  legend:
    one: एक हिस्सा और उसका मान
    spoken: सवाल में बताए गए हिस्से

examples:
  - title: मशरूम
    question: >-
      हर्ष और लता मिलकर 45 मशरूम तोड़ते हैं। हर्ष के हर 4 मशरूमों पर लता 5
      मशरूम तोड़ती है। लता कितने मशरूम तोड़ती है?
    steps:
      - "4 : 5 का मतलब है हर्ष के 4 हिस्से और लता के 5, कुल 9 बराबर हिस्से।"
      - एक हिस्से में 45 ÷ 9 = 5 मशरूम हैं।
      - "लता के 5 हिस्से हैं: 5 × 5 = 25 मशरूम। जाँच: हर्ष के 20 हैं, और 20 + 25 = 45।"
    answer: 25 मशरूम।
    note:
      title: 45 ÷ 5 क्यों नहीं?
      text: >-
        45 ÷ 5 = 9 में सिर्फ़ लता की संख्या से भाग दिया गया है। 45 मशरूम तो पूरे
        9 हिस्से हैं, हर्ष और लता के मिलाकर।
    art:
      max: ह
      lena: ल
      together: कुल 45 मशरूम
      max-name: हर्ष
      lena-name: लता
      nine: 9 खाने, 45 मशरूम
      each: हर खाने में 45 ÷ 9 = 5
      only-lena: सिर्फ़ लता
  - title: गायन मंडली
    question: >-
      एक गायन मंडली में हर 4 लड़कों पर 7 लड़कियाँ हैं, और लड़कियाँ लड़कों से 9
      ज़्यादा हैं। मंडली में कितने बच्चे गाते हैं?
    steps:
      - >-
        लड़के 4 हिस्से हैं और लड़कियाँ 7 हिस्से, इसलिए लड़कियों के हिस्से लड़कों
        से 3 ज़्यादा हैं।
      - "ये 3 हिस्से ही वे 9 ज़्यादा लड़कियाँ हैं: एक हिस्से में 9 ÷ 3 = 3 बच्चे हैं।"
      - >-
        मंडली में 4 + 7 = 11 हिस्से हैं: 11 × 3 = 33 बच्चे। जाँच: 12 लड़के और 21
        लड़कियाँ, यानी लड़कियाँ 9 ज़्यादा।
    answer: 33 बच्चे।
    note:
      title: 9 कौन-से हिस्से हैं?
      text: >-
        9 का मतलब लड़कियों के 7 हिस्से नहीं, बल्कि वे 3 हिस्से हैं जो लड़कियों
        के पास लड़कों से ज़्यादा हैं। 9 को 7 या 11 से भाग देने पर बच्चों की कोई
        पूरी संख्या नहीं मिलती।
    art:
      boys: लड़के
      girls: लड़कियाँ
      nine: 9 लड़कियाँ
      choir: 11 खाने × 3 = 33
      this-nine: यही 9 है
  - title: दो डिब्बे
    question: >-
      दो डिब्बों में कंचे 3 : 1 के अनुपात में हैं। पहले डिब्बे से 10 कंचे दूसरे
      डिब्बे में डालने पर दोनों डिब्बों में बराबर कंचे हो जाते हैं। कुल कितने
      कंचे हैं?
    steps:
      - >-
        कंचों को एक डिब्बे से दूसरे में डालने से उनकी कुल संख्या नहीं बदलती: वह
        शुरू में और बाद में एक ही रहती है।
      - >-
        शुरू में कुल 4 हिस्से हैं, और पहले डिब्बे में उनमें से 3 हैं। बाद में
        उसमें कुल का आधा है, यानी उन्हीं 4 हिस्सों में से 2। इसलिए उसमें से 1
        हिस्सा निकला।
      - >-
        यही हिस्सा वे 10 कंचे हैं जो दूसरे डिब्बे में डाले गए: कुल 4 × 10 = 40।
        जाँच: शुरू में 30 और 10, बाद में 20 और 20।
    answer: 40 कंचे।
    note:
      title: जो नहीं बदलता
      text: >-
        अनुपात के सवालों में अक्सर कोई ऐसी चीज़ छिपी होती है जो नहीं बदलती: यहाँ
        वह कुल संख्या है। दोनों अनुपातों को उसी एक कुल के हिस्सों में नापने से
        ही उनकी तुलना हो पाती है।
    art:
      box-a: डिब्बा A
      box-b: डिब्बा B
      four: कुल 4 हिस्से, शुरू में भी और बाद में भी
      before: शुरू में
      after: बाद में
      part: 1 हिस्सा

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ratio_total_confusion:
    shows: >-
      अनुपात की संख्याओं को कुल के हिस्से मान लिया जाता है: 4 : 5 को 5 में से 4
      पढ़ लिया जाता है, या 45 मशरूमों को 4 + 5 = 9 हिस्सों की जगह 5 से भाग दे
      दिया जाता है।
    say: “कुल कितने बराबर हिस्से हैं?”
    art:
      question: "45 मशरूम, 4 : 5"
      one: एक हिस्से में
  wrong_operation:
    shows: >-
      जहाँ अनुपात में गुणा करना चाहिए, वहाँ जोड़ दिया जाता है: 6 और लोगों के लिए
      रेसिपी में 6 अंडे और डाल दिए जाते हैं, जबकि अंडों को लोगों की संख्या के
      साथ उसी अनुपात में बढ़ना चाहिए।
    say: “अगर लोग दुगुने हो जाएँ, तो अंडों का क्या होगा?”
    art:
      question: 3 अंडे 2 लोगों के लिए, और 8 के लिए?
  ignored_condition:
    shows: >-
      कोई शर्त छूट जाती है: पूरा 1000 ग्रा॰ मैदा इस्तेमाल कर लिया जाता है, जबकि
      उसके लिए 300 ग्रा॰ चीनी कम है, या 56 सीपियाँ, जिन्हें 3 : 4 के अनुपात में
      बाँटना है, 28 और 28 में बाँट दी जाती हैं।
    say: “क्या इतने मैदे के लिए चीनी काफ़ी है?”
    art:
      question: "मैदा और चीनी 5 : 2, 1000 ग्रा॰ और 300 ग्रा॰"
      short: चीनी कम है
      one: एक हिस्से में

home:
  - title: रसोई में अनुपात
    text: >-
      साथ मिलकर किसी अनुपात से शरबत बनाएँ या आटा गूँधें: एक कप जूस पर तीन कप
      पानी। फिर दुगुना बनाएँ, और देखें कि क्या-क्या दुगुना होता है।
  - title: कागज़ पर खाने
    text: >-
      घर पर कुछ भी बाँटते समय, टॉफ़ियाँ हों या घर के काम, हर हिस्से के लिए एक
      खाना बनाएँ और खानों को भरें। सोचने का काम खाने ही कर देते हैं।
  - title: नक्शे और मॉडल
    text: >-
      किसी नक्शे या मॉडल कार का पैमाना देखें: 1 : 50 का मतलब है कि हर सेंटीमीटर
      50 के बराबर है। साथ मिलकर कुछ नापें और उसे पैमाने के हिसाब से बड़ा करें।

# What a parent can write in the chat to get a task on this topic.
ask: “अनुपात और बँटवारा” विषय पर एक सवाल दें
