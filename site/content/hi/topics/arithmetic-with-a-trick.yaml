# The page of the topic of arithmetic with a trick, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: पेचीदा अंकगणित
description: “पेचीदा अंकगणित” विषय के सवाल (गणित ट्रिक्स, “मैंने एक संख्या सोची”) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    19 + 23 + 81 + 77 कितना होता है? क्रम से जोड़ने पर हासिल वाले तीन जोड़ करने
    पड़ते हैं; 19 + 81 और 23 + 77 की जोड़ियाँ बनाने पर यह 100 + 100 बन जाता है।
    गणित ट्रिक्स वाले इन सवालों में सही क्रम मिलते ही हिसाब आसान हो जाता है, और
    “मैंने एक संख्या सोची” वाली पहेलियाँ अंत से कदम उलटकर हल होती हैं। असली
    कौशल है गिनने से पहले देखना।
  method: गिनने से पहले आसान क्रम ढूँढना
  teaches: योग या गुणनफल को नए समूहों में बाँटना, और कदमों का सिलसिला अंत से उलटना
  # The words of its drawing: the sum's numbers paired colour by colour into
  # two easy hundreds.
  art:
    pairs: एक रंग की जोड़ियाँ जोड़ते हैं
    look: पहले देखना, फिर गिनना

basis:
  title: चतुराई से गिनने के नियम
  cards:
    - title: कोई भी क्रम
      text: >-
        संख्याओं को किसी भी क्रम में जोड़ा या गुणा किया जा सकता है, और किसी भी
        तरह समूहों में रखा जा सकता है: 25 × 9 × 4 वही है जो 25 × 4 × 9 है, यानी
        100 × 9।
    - title: गोल संख्याएँ
      text: >-
        ऐसी जोड़ियाँ ढूँढें जो 10, 100 या 1000 बनाती हैं: 36 + 64, 25 × 4,
        125 × 8। गोल संख्या के साथ आगे का हिसाब आसान रहता है।
    - title: अंत से कदम उलटें
      text: >-
        “मैंने एक संख्या सोची” वाली पहेलियों में नतीजे से पीछे की ओर चलें और हर
        कदम उलटें: जो जोड़ा गया था, उसे घटाया जाता है, और जो दुगुना किया गया था,
        उसे आधा किया जाता है।
      art:
        undoes: का उलटा
        back: नतीजे से पीछे की ओर

idea:
  title: गिनने से पहले देखें
  lead: एक ही योग का हिसाब लंबा भी हो सकता है और छोटा भी। गिनने से पहले वे जोड़ियाँ और समूह ढूँढें जिनसे गोल संख्याएँ बनती हैं।
  table:
    head:
      - सवाल
      - आसान रास्ता
      - जवाब
    rows:
      - - 19 + 23 + 81 + 77
        - (19 + 81) + (23 + 77)
        - "200"
      - - 4 × 19 × 25
        - (4 × 25) × 19
        - "1900"
      - - 1 + 2 + 3 + … + 10
        - 11 की पाँच जोड़ियाँ, जैसे 1 + 10 और 2 + 9
        - "55"
  # The words of the drawings of the easy way, all rows' in one place.
  art:
    pairs: 11 की पाँच जोड़ियाँ
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      ओलंपियाड में जान-बूझकर ऐसे योग दिए जाते हैं जिनका लंबा हिसाब धीमा होता
      है: असली बात छोटा रास्ता पहचानने की है। पहले जोड़ियाँ ढूँढने की आदत से
      बच्चे को सवाल की बनावट दिखने लगती है, और यह अंकगणित से कहीं आगे काम आता
      है।

method:
  title: "हल कैसे करें: गोल संख्याएँ ढूँढना"
  lead: >-
    गिनने से पहले पूरे सवाल को देखें। जिन संख्याओं से गोल संख्या बनती है, उनकी
    जोड़ियाँ बनाएँ, जिन गुणनखंडों से 10 या 100 बनता है, उन्हें पास-पास रखें, और
    कदमों के सिलसिले में अंत से शुरू करके उन्हें एक-एक करके उलटें। नीचे दिए
    उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - पहले पूरे सवाल को देखना
    - गोल संख्याओं के समूह बनाना, या अंत से कदम उलटना
    - जवाब को किसी दूसरे तरीके से जाँचना
  # The key under the steps: what the drawings' colours mean.
  legend:
    pair: एक रंग, एक जोड़ी
    undo: उलटने वाला कदम

examples:
  - title: दस बनाने वाली जोड़ियाँ
    question: >-
      6 + 7 + 8 + 2 + 3 + 4 कितना होता है?
    steps:
      - "10 बनाने वाली जोड़ियाँ ढूँढते हैं। यहाँ ऐसी तीन जोड़ियाँ हैं: 6 + 4, 7 + 3 और 8 + 2।"
      - तीन दहाइयाँ मिलकर 30 बनती हैं।
      - "तो 6 + 7 + 8 + 2 + 3 + 4 = 30, और वह भी बिना किसी हासिल के।"
    answer: "30।"
    note:
      title: लंबा रास्ता
      text: >-
        6 + 7 = 13, फिर 21, 23, 26 और 30। जवाब वही है, पर इसमें एक की जगह पाँच
        कदम लगते हैं, और हर कदम पर चूक हो सकती है।
    art:
      tens: एक रंग, दस बनाने वाली एक जोड़ी
  - title: सोची हुई संख्या
    question: >-
      मधु ने एक संख्या सोची। उसने उसे दुगुना किया, 7 जोड़ा और नतीजे को 3 से भाग
      दिया। उसे 9 मिला। मधु ने कौन-सी संख्या सोची थी?
    steps:
      - अंत से चलते हैं और हर कदम उलटते हैं, सबसे पहले आखिरी कदम।
      - >-
        उसने 3 से भाग दिया और उसे 9 मिला, तो उससे पहले संख्या 9 × 3 = 27 थी।
        उसने 7 जोड़ा, तो उससे पहले संख्या 27 − 7 = 20 थी।
      - "उसने संख्या को दुगुना किया था, तो वह 20 ÷ 2 = 10 थी। जाँच: 10 × 2 + 7 = 27, और 27 ÷ 3 = 9।"
    answer: "10।"
    note:
      title: उलटे क्रम में
      text: >-
        जो कदम सबसे आखिर में किया गया, वही सबसे पहले उलटा जाता है, जैसे जूते
        मोज़ों से पहले उतरते हैं। कदमों को उसी क्रम में उलटने से, जिसमें वे किए
        गए थे, गलत संख्या मिलती है।
    art:
      masha: मधु
      back: अंत से
      check: जाँच
      "on": पहनना
      "off": उतारना
      socks: मोज़े
      shoes: जूते
  - title: दो बड़े गुणनफल
    question: >-
      2026 × 2026 − 2027 × 2025 कितना होता है? बड़ी संख्याओं को गुणा किए बिना
      निकालो।
    steps:
      - >-
        दोनों गुणनफलों में 2026 × 2025 छिपा है: 2026 × 2026 यानी 2026 × 2025 और
        ऊपर से एक 2026।
      - और 2027 × 2025 यानी 2026 × 2025 और ऊपर से एक 2025।
      - "तो अंतर 2026 − 2025 = 1 है, और किसी बड़ी संख्या को गुणा नहीं करना पड़ा।"
    answer: "1।"
    note:
      title: छोटी संख्याओं पर आज़माएँ
      text: >-
        यही बात किन्हीं भी संख्याओं के लिए सही है: 5 × 5 − 6 × 4 = 25 − 24 = 1।
        किसी ट्रिक पर भरोसा करने का सबसे पक्का तरीका है उसे पहले छोटी संख्याओं
        पर आज़माना।
    art:
      cancel: बराबर हिस्से कट जाते हैं, और पट्टियाँ बचती हैं

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  stopped_early:
    shows: >-
      हल आखिर तक पहुँचने से पहले रुक जाता है: तीन में से दो जोड़ियाँ जोड़ी जाती
      हैं और तीसरी छूट जाती है, या सिलसिले का एक ही कदम उलटा जाता है और उसका
      नतीजा जवाब के रूप में दे दिया जाता है।
    say: “क्या हर संख्या इस्तेमाल हुई, और हर कदम उलटा गया?”
  wrong_operation:
    shows: >-
      कदम को उलटी संक्रिया की जगह उसी संक्रिया से उलटा जाता है: 7 घटाने की जगह
      फिर से जोड़ दिया जाता है, या 9 को 3 से गुणा करने की जगह भाग दे दिया जाता
      है।
    say: “जोड़ने का उलटा क्या है? भाग देने का उलटा क्या है?”
    art:
      undo: 27 पर “+ 7” को उलटना
  number_from_text:
    shows: >-
      सवाल की कोई संख्या ही जवाब बन जाती है: सोची हुई संख्या की जगह वह 9, जो
      मधु को मिला, या वह 7, जो उसने जोड़ा।
    say: “यह वह संख्या है जो उसे मिली, या वह जो उसने सोची?”
    art:
      question: मधु ने कौन-सी संख्या सोची थी?
      got: मधु को जो मिला
      thought: उसने जो सोचा

home:
  - title: दस की जोड़ियाँ
    text: >-
      छह या आठ छोटी संख्याएँ पर्चियों पर लिखें और बच्चे से कहें कि सब कुछ
      जोड़ने से पहले वे जोड़ियाँ ढूँढे जिनसे 10 बनता है।
  - title: संख्या पहचानने का खेल
    text: >-
      “मैंने एक संख्या सोची” दोनों तरफ़ से खेलें: पहले आप कदम और नतीजा बताएँ और
      बच्चा संख्या ढूँढे, फिर कदम बच्चा खुद बनाए।
  - title: खरीदारी में चतुराई
    text: >-
      दुकान में कीमतों को चतुराई से चुने क्रम में जोड़ें: 99 यानी 100 से 1 कम,
      और 49 और 51 मिलकर 100 बनाते हैं। पहले गोल करें, फिर ठीक करें।

# What a parent can write in the chat to get a task on this topic.
