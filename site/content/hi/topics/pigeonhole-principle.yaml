# The page of the topic of the pigeonhole principle, for a parent, in Hindi.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: कबूतरखाना सिद्धांत
description: “कबूतरखाना सिद्धांत” विषय के सवाल (अंग्रेज़ी में pigeonhole principle) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

hero:
  lead: >-
    पाँच कबूतर उड़कर चार खानों में बैठते हैं: किसी न किसी खाने में दो कबूतर
    ज़रूर होंगे। इन सवालों में बच्चे को सिद्ध करना होता है कि किस्मत चाहे
    जितनी बुरी हो, कुछ होना ही है: अँधेरी दराज़ से एक ही रंग के दो मोज़े, एक
    ही महीने में दो जन्मदिन। यह अच्छी किस्मत की जगह सबसे बुरी स्थिति के बारे
    में सोचने का पहला परिचय है।
  method: सबसे बुरी किस्मत को आखिर तक ले जाना, फिर एक जोड़ना
  teaches: सिद्ध करना कि कुछ होना ही है, सिर्फ़ यह नहीं कि हो सकता है
  # The words of its drawing: the pigeons and the cages over it, and what the
  # seating always comes to.
  art:
    line: पाँच कबूतर, चार खाने
    seat: जैसे चाहें बिठाएँ
    two: दो
    always: वे कैसे भी बैठें, किसी खाने में दो होंगे

basis:
  title: सबसे बुरी स्थिति के नियम
  cards:
    - title: खानों से ज़्यादा कबूतर
      text: >-
        अगर कबूतर खानों से ज़्यादा हैं, तो किसी न किसी खाने में कम से कम दो
        होंगे। उन्हें जितना चाहें बराबर बाँटें: एक हमेशा बच जाता है।
    - title: पक्का करना
      text: >-
        “पक्का” का मतलब है: थैले से चाहे जो निकले। इसलिए मान लें कि सब कुछ
        जितना बुरा हो सकता है, उतना ही बुरा होता है, और देखें कि बुरी किस्मत
        कहाँ तक जा सकती है।
      art:
        luck: अच्छी किस्मत
        not-counted: गिनती में नहीं
        bad-luck: बुरी किस्मत
    - title: एक और से बात तय होती है
      text: >-
        जब बुरी किस्मत खत्म हो जाती है, यानी हर रंग एक-एक बार निकल चुका है और
        हर खाना एक-एक बार भर चुका है, तब अगला ज़रूर वही देगा, जो चाहिए।
      art:
        eighth: हर दिन के लिए एक; आठवाँ जोड़ा बनाता है

idea:
  title: सबसे बुरी किस्मत, फिर एक और
  lead: हर सवाल पूछता है कि पक्का क्या है। जवाब यह है कि बुरी किस्मत कहाँ तक जा सकती है, और फिर एक और।
  table:
    head:
      - पक्का चाहिए
      - बुरी किस्मत पहले दे सकती है
      - इसलिए लें
    rows:
      - - हफ़्ते के एक ही दिन जन्मे दो लोग
        - 7 में से हर दिन जन्मा एक व्यक्ति
        - 7 + 1 = 8 लोग
      - - 6 नीली और 4 लाल गेंदों में से एक लाल गेंद
        - सारी 6 नीली गेंदें
        - 6 + 1 = 7 गेंदें
      - - 6 नीली और 4 लाल गेंदों में से दो लाल गेंदें
        - सारी 6 नीली गेंदें और एक लाल
        - 6 + 1 + 1 = 8 गेंदें
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      बच्चे अक्सर किस्मत पर भरोसा करते हैं: “शायद मुझे पहली बार में ही दो लाल
      गेंदें मिल जाएँ।” जिस सवाल में “पक्का” लिखा हो, वह पूछता है कि सबसे बुरी
      किस्मत में क्या होगा, और यह आदत किसी भी फ़ॉर्मूले से ज़्यादा कीमती है।

method:
  title: "हल कैसे करें: सबसे बुरी किस्मत, फिर एक और"
  lead: >-
    खानों के नाम तय करें, जैसे रंग, महीने या हफ़्ते के दिन, और सबसे बुरी
    किस्मत को आखिर तक ले जाएँ: हर वह चीज़ निकालें, जिससे अभी वह नहीं मिलता, जो
    सवाल माँगता है। अगला ज़रूर देगा। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के
    स्तर तक जाते हैं।
  steps:
    - खाने और कबूतर ढूँढना
    - सबसे बुरी किस्मत को आखिर तक ले जाना
    - एक जोड़ना, और जाँचना कि उससे बात तय हो जाती है
  # The key under the steps: what the drawings' bracket and ring mean.
  legend:
    bad-luck: बुरी किस्मत
    decides: बात तय करने वाला एक और

examples:
  - title: जार में टॉफ़ियाँ
    question: >-
      एक जार में 8 नींबू वाली और 2 संतरे वाली टॉफ़ियाँ हैं। बिना देखे सुमन को
      कितनी टॉफ़ियाँ निकालनी होंगी, ताकि एक संतरे वाली टॉफ़ी पक्की हो जाए?
    steps:
      - >-
        सुमन को संतरे वाली टॉफ़ी चाहिए। सबसे बुरी किस्मत यह है कि एक के बाद एक
        नींबू वाली निकले।
      - >-
        नींबू वाली टॉफ़ियाँ सिर्फ़ 8 हैं: इन 8 के बाद जार में सिर्फ़ संतरे वाली
        बचती हैं।
      - "9वीं टॉफ़ी ज़रूर संतरे वाली होगी: 8 + 1 = 9।"
    answer: 9 टॉफ़ियाँ।
    art:
      lemon: नींबू वाली, 8
      orange: संतरे वाली, 2
      unlucky: बदकिस्मती
      all-lemons: सारी 8 नींबू वाली
      lemons: 8 नींबू वाली
  - title: दो काले मोज़े
    question: >-
      एक दराज़ में 8 काले, 6 सफ़ेद और 2 धारीदार मोज़े आपस में मिले हुए रखे हैं।
      अँधेरे में गौरव को कितने मोज़े निकालने होंगे, ताकि दो काले मोज़े पक्के हो
      जाएँ?
    steps:
      - >-
        सबसे बुरी किस्मत: पहले वे मोज़े निकलते हैं, जो काले नहीं हैं। सफ़ेद 6
        हैं और धारीदार 2, यानी 8 मोज़े, जिनमें एक भी काला नहीं।
      - >-
        बुरी किस्मत अब भी आगे चल सकती है: अगला मोज़ा काला है, पर बस एक। यानी
        9 मोज़े, और उनमें सिर्फ़ एक काला।
      - >-
        10वाँ मोज़ा भी ज़रूर काला होगा, क्योंकि अब सिर्फ़ काले मोज़े बचे हैं। तो
        10 मोज़े।
    answer: 10 मोज़े।
    note:
      title: 9 क्यों नहीं?
      text: >-
        सारे 6 सफ़ेद और 2 धारीदार मोज़ों के बाद भी बुरी किस्मत की एक बारी बाकी
        है: एक अकेला काला मोज़ा। दो काले मोज़े 10वें के साथ ही पक्के होते हैं।
    art:
      black: काले, 8
      white: सफ़ेद, 6
      striped: धारीदार, 2
      no-black: 8, एक भी काला नहीं
      not-black: 8, काले नहीं
      one: एक
      only-one: 9 मोज़े, और काला सिर्फ़ एक
  - title: ग्रिड में योग
    question: >-
      2 × 2 के ग्रिड के हर घर में 1, 2 या 3 लिखा है। हर पंक्ति, हर स्तंभ और
      हर विकर्ण की दो संख्याओं का योग निकालो। क्या यह सच है कि इन छह योगों में
      से दो हमेशा बराबर होते हैं?
    steps:
      - >-
        खाने गिनते हैं: 1, 2 और 3 में से दो संख्याओं का योग 2, 3, 4, 5 और 6
        में से कोई एक होता है, कुल पाँच मान।
      - "कबूतर गिनते हैं: 2 पंक्तियाँ, 2 स्तंभ और 2 विकर्ण 6 योग देते हैं।"
      - >-
        छह योग और सिर्फ़ पाँच मान: ग्रिड में संख्याएँ चाहे जो हों, दो योग बराबर
        होने ही हैं।
    answer: हाँ, हमेशा।
    badge: "हाँ"
    note:
      title: खाने हमेशा डिब्बे नहीं होते
      text: >-
        यहाँ खाने वे मान हैं, जो योग ले सकता है, और कबूतर ग्रिड की रेखाएँ हैं।
        इन सवालों की कला यही पहचानना है कि खानों की भूमिका कौन निभाता है।
    art:
      example: "जैसे: हर घर में 1, 2 या 3"
      cages: 5 खाने, यानी हो सकने वाले योग
      row: पंक्ति
      column: स्तंभ
      diagonal: विकर्ण
      pigeons: 6 योग, 6 कबूतर
      two: "6 कबूतर, 5 खाने: किसी खाने में दो होंगे"
      cages-name: खाने
      pigeons-name: कबूतर

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  best_case_not_worst:
    shows: >-
      किस्मत पर भरोसा कर लिया जाता है: “अगर पहले दो मोज़े काले निकलें, तो दो
      काफ़ी हैं।” पर सवाल में “पक्का” लिखा है, और यही शब्द किस्मत को बाहर कर
      देता है।
    say: “और अगर किस्मत बिलकुल साथ न दे तो?”
    art:
      question: दो काले मोज़े, पक्के
  ignored_condition:
    shows: >-
      सवाल का एक शब्द छूट जाता है: “दो काले मोज़े” को “एक रंग के दो मोज़े” पढ़
      लिया जाता है, या “हर रंग का एक” को “एक ही रंग”।
    say: “सवाल फिर से पढ़ो। ठीक-ठीक क्या पक्का होना चाहिए?”
    art:
      question: "चाहिए: दो **काले** मोज़े"
      black-pair: काले मोज़ों का जोड़ा
  off_by_one:
    shows: >-
      सबसे बुरी किस्मत आखिर तक पहुँचते ही हल वहीं रुक जाता है, और वह एक और
      छूट जाता है, जिससे बात तय होती है; या फिर एक ज़्यादा जोड़ दिया जाता है।
    say: “सबसे बुरी किस्मत के बाद अगला क्या देगा?”
    art:
      question: 8 नींबू वाली और 2 संतरे वाली

home:
  - title: अँधेरे में मोज़े
    text: >-
      दो-तीन रंगों के मोज़े एक थैले में डालें और आँखें बंद करके निकालें: कितने
      मोज़ों के बाद जोड़ा पक्का होता है? कई बार आज़माएँ। किस्मत बदलती है, जवाब
      नहीं।
  - title: होना ही है या हो सकता है?
    text: >-
      जब बच्चा कहे “ऐसा हो सकता है”, तो पूछें: “और क्या ऐसा नहीं भी हो
      सकता?” “हो सकता है” और “होना ही है” के बीच का अंतर ही पूरा विषय है।
  - title: खाने ढूँढें
    text: >-
      रोज़ की गिनतियों में साथ मिलकर खाने ढूँढें: हफ़्ते के सात दिन, बारह महीने,
      चार मौसम। “हम 30 लोग हैं: क्या हममें से दो लोगों का जन्मदिन एक ही महीने
      में पड़ना पक्का है?”

