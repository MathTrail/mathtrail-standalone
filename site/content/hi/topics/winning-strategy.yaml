title: जीतने की रणनीति वाले खेल
description: “जीतने की रणनीति वाले खेल” विषय के सवाल (गणितीय खेल, जैसे निम) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words the page's drawings say of a position.
art:
  loses: जिसकी चाल हो, उसकी हार
  wins: जीत

hero:
  lead: >-
    मेज़ पर 20 तीलियाँ हैं, और खिलाड़ी बारी-बारी से उनमें से 1, 2 या 3 उठाते
    हैं। जो आखिरी तीली उठाए, जीत उसी की होती है, जैसे निम नाम के गणितीय खेल में।
    क्या पहला खिलाड़ी हमेशा जीत सकता है? इन सवालों में ऐसी योजना ढूँढनी होती है
    जो सामने वाले खिलाड़ी की किसी भी चाल पर जीत दिलाए, और वह खेल के अंत से पीछे
    की ओर चलकर मिलती है: यह देखकर कि किन स्थितियों में जिसकी चाल हो, उसकी हार
    होती है।
  method: अंत से पीछे की ओर चलना और हारने वाली स्थितियाँ ढूँढना
  teaches: ऐसी योजना ढूँढना जो सामने वाले खिलाड़ी की किसी भी चाल पर जीत दिलाए
  # The words of its drawing: the game it is drawn for.
  art:
    line: 1, 2 या 3 तीलियाँ उठाते हैं; आखिरी तीली जो उठाए, जीत उसकी

basis:
  title: खेलों के नियम
  cards:
    - title: अंत से
      text: >-
        खेल के अंत से शुरू करें, जहाँ जीत-हार साफ़ है, और पीछे की ओर चलें: कोई
        स्थिति हारने वाली है, अगर उससे हर चाल ऐसी स्थिति तक ले जाए जो सामने वाले
        खिलाड़ी के लिए जीतने वाली हो।
      art:
        back: 0 से, यानी खेल के अंत से, बड़ी संख्याओं की ओर
    - title: हारने वाली स्थिति सौंपना
      text: >-
        जीतने वाली चाल सामने वाले खिलाड़ी के लिए हारने वाली स्थिति छोड़ती है।
        अगर ऐसी कोई चाल न हो, तो स्थिति हारने वाली है, खिलाड़ी में कितनी भी
        होशियारी हो।
      art:
        take: 2 उठाना
        losing: सामने वाले के लिए हारने वाली
    - title: चाल की नकल, आईने की तरह
      text: >-
        कई खेलों में जीत बराबरी बनाए रखने से मिलती है: हर चाल का ऐसा जवाब देकर
        कि दोनों चालों का योग हर बार उतना ही रहे, या आईने की तरह दूसरी तरफ़ वही
        चाल चलकर।
      art:
        they: सामने वाला
        answer: जवाब

idea:
  title: हारने वाली स्थितियाँ
  lead: 1, 2 या 3 तीलियाँ उठाने वाले खेल में, जहाँ आखिरी तीली जिताती है, जिसकी चाल हो उसके लिए हारने वाली स्थितियाँ हर 4 पर आती हैं।
  table:
    head:
      - बची हुई तीलियाँ
      - सबसे अच्छी चाल
      - क्यों
    rows:
      - - 1, 2 या 3
        - सब उठा लेना
        - आखिरी तीली जिताती है
      - - "4"
        - कोई चाल नहीं जिताती
        - किसी भी चाल के बाद बाकी तीलियाँ सामने वाले खिलाड़ी के हाथ लगती हैं
      - - 5, 6 या 7
        - 1, 2 या 3 उठाकर 4 छोड़ना
        - सामने वाले खिलाड़ी को हारने वाली 4 मिलती हैं
      - - "8"
        - कोई चाल नहीं जिताती
        - हर चाल 5, 6 या 7 छोड़ती है
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      बच्चे अक्सर सोचते हैं कि पहला खिलाड़ी ज़रूर जीतेगा, या इस उम्मीद में खेलते
      हैं कि सामने वाले खिलाड़ी से चूक हो जाए। जीतने की रणनीति सबसे अच्छे खेल के
      सामने भी काम करती है, और उसे ढूँढने के लिए अंत से सोचना पड़ता है। यह आदत
      खेलों से कहीं आगे काम आती है।

method:
  title: "हल कैसे करें: खेल के अंत से"
  lead: >-
    स्थितियाँ सबसे छोटी से शुरू करके लिखें। अगर किसी स्थिति से हर चाल जीतने वाली
    स्थिति तक ले जाए, तो उसे हारने वाली लिखें, और अगर कोई एक चाल हारने वाली
    स्थिति तक ले जाए, तो जीतने वाली। शुरुआत से जीतने वाली चाल वह है जो हारने
    वाली स्थिति छोड़े। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते
    हैं।
  steps:
    - खेल के अंत वाली स्थितियों से शुरू करना
    - सबसे छोटी से शुरू करके हर स्थिति को जीतने वाली या हारने वाली लिखना
    - वह चाल ढूँढना जो सामने वाले खिलाड़ी के लिए हारने वाली स्थिति छोड़े

examples:
  - title: कटोरे में टॉफ़ियाँ
    question: >-
      एक कटोरे में 23 टॉफ़ियाँ हैं। किरण और यश बारी-बारी से चाल चलते हैं, और
      पहली चाल किरण चलती है। हर चाल में 1, 2, 3 या 4 टॉफ़ियाँ उठाई जाती हैं। जो
      आखिरी टॉफ़ी उठाए, जीत उसी की। पक्की जीत के लिए किरण को पहली चाल में कितनी
      टॉफ़ियाँ उठानी होंगी?
    steps:
      - >-
        अंत से: अगर 1 से 4 टॉफ़ियाँ बची हों, तो सारी एक ही चाल में उठ जाती हैं,
        और जीत उसी की होती है जिसकी चाल हो। अगर 5 बची हों, तो हर चाल सामने वाले
        खिलाड़ी के लिए 1 से 4 छोड़ती है, इसलिए 5 हारने वाली स्थिति है।
      - >-
        इसी तरह 10, 15 और 20 भी हारने वाली हैं: इनमें से कुछ भी उठाया जाए, सामने
        वाला खिलाड़ी कटोरे में 5 का अगला गुणज छोड़ सकता है।
      - >-
        इसलिए किरण 3 उठाती है और 20 छोड़ती है। यश जितनी भी उठाए, किरण बाकी उठाकर
        योग 5 पूरा करती है: कटोरे में 15, 10, 5 बचती हैं, और आखिर में कुछ नहीं
        बचता।
    answer: 3 टॉफ़ियाँ।
    note:
      title: 4 क्यों न उठाएँ?
      text: >-
        4 उठाने पर 19 बचती हैं, और यश 4 उठाकर 15 छोड़ देता है, जो किरण के लिए
        हारने वाला कटोरा है। जो खिलाड़ी कोई गलती न करे, उसके सामने सिर्फ़ वही
        पहली चाल जिताती है जो 5 के गुणज तक ले जाए।
    art:
      sweets: 23 टॉफ़ियाँ, एक चाल में 1 से 4
      kim: किरण −3
      answer: यश x उठाए, तो किरण 5 − x
      leo: यश −4
      lost: किरण के लिए हारने वाला कटोरा
  - title: राजा की सैर
    question: >-
      5 × 5 के बोर्ड के नीचे वाले बाएँ कोने में एक राजा खड़ा है। दो खिलाड़ी
      बारी-बारी से उसे एक खाना ऊपर, एक खाना दाएँ, या एक खाना तिरछे ऊपर-दाएँ
      चलाते हैं। जो राजा को ऊपर वाले दाएँ कोने में पहुँचाए, जीत उसी की। अगर
      दोनों सबसे अच्छा खेलें, तो जीत किसकी होगी?
    steps:
      - >-
        गिनते हैं कि राजा को अभी कितनी पंक्तियाँ और कितने स्तंभ चलने बाकी हैं।
        जो खाना कोने से एक चाल दूर हो, वहाँ से जिसकी चाल हो, उसकी तुरंत जीत होती
        है।
      - >-
        जिसकी चाल हो, उसके लिए कोई खाना तब हारने वाला है जब दोनों संख्याएँ सम
        हों: हर चाल उनमें से एक को विषम बना देती है, और सामने वाला खिलाड़ी दोनों
        को फिर से सम बना सकता है।
      - >-
        शुरू में राजा कोने से 4 पंक्तियाँ और 4 स्तंभ दूर है, दोनों सम, इसलिए
        पहला खिलाड़ी हारता है। दूसरा हर बार राजा को सम खाने पर ले जाकर जवाब देता
        है और कोने तक पहुँच जाता है।
    answer: दूसरा खिलाड़ी।
    badge: दूसरा
    note:
      title: पहले चलना काफ़ी नहीं
      text: >-
        यहाँ पहले खिलाड़ी की हार तय है, वह कुछ भी करे। हर नए खेल में, यह मानने
        से पहले कि पहली चाल जीतती है, अंत से जाँच लेना अच्छा रहता है।
    art:
      moves: "चालें: ऊपर, दाएँ, तिरछे ऊपर-दाएँ"
      green: हरे, एक चाल में जीत
      red: लाल बिंदु, जिसकी चाल हो उसकी हार
      start: राजा हारने वाले खाने से शुरू करता है
  - title: डेज़ी का फूल
    question: >-
      डेज़ी के एक फूल में घेरे में 12 पंखुड़ियाँ हैं। दो खिलाड़ी बारी-बारी से या
      तो एक पंखुड़ी तोड़ते हैं, या साथ-साथ उगी दो पंखुड़ियाँ, जिनके बीच कोई खाली
      जगह न हो। जो आखिरी पंखुड़ी तोड़े, जीत उसी की। अगर दोनों सबसे अच्छा खेलें,
      तो जीत किसकी होगी?
    steps:
      - >-
        पहला खिलाड़ी चाहे एक पंखुड़ी तोड़े या दो, घेरा खुलकर 11 या 10 पंखुड़ियों
        की पंक्ति बन जाता है।
      - >-
        दूसरा खिलाड़ी उस पंक्ति के ठीक बीच से तोड़ता है: 11 की पंक्ति से एक
        पंखुड़ी, या 10 की पंक्ति से दो। आमने-सामने दो बराबर पंक्तियाँ बचती हैं।
      - >-
        उसके बाद दूसरा खिलाड़ी पहले खिलाड़ी की हर चाल की नकल सामने वाली पंक्ति
        में करता है। जब तक पहले खिलाड़ी के पास कोई चाल है, दूसरे के पास भी है,
        इसलिए आखिरी पंखुड़ी दूसरा तोड़ता है।
    answer: दूसरा खिलाड़ी।
    badge: दूसरा
    note:
      title: बीच से क्यों?
      text: >-
        पंक्ति को दो बराबर हिस्सों में बाँटने से स्थिति सममित हो जाती है। नकल
        करने से हार नहीं हो सकती: किसी चाल की नकल हमेशा की जा सकती है, क्योंकि
        सामने वाली पंक्ति बिलकुल वैसी ही दिखती है।
    art:
      eleven: पहले ने एक तोड़ी, 11 की पंक्ति बची
      two-rows: 5 पंखुड़ियों वाली दो पंक्तियाँ
      mirror: पहले ने नीली पंक्ति में तोड़ा, दूसरे ने नारंगी में नकल की

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      खेल का कोई नियम छूट जाता है: एक चाल में 5 टॉफ़ियाँ उठा ली जाती हैं, जबकि
      ज़्यादा से ज़्यादा 4 की अनुमति है, या राजा बाईं ओर चल देता है, जो नियमों
      में मना है। जिस चाल की अनुमति ही नहीं, उस पर बनी योजना से कोई जीत नहीं
      मिलती।
    say: “नियम कौन-सी चालों की अनुमति देते हैं?”
    art:
      question: एक चाल में 1 से 4 टॉफ़ियाँ
      five: 5 उठाना
      three: 3 उठाना
  first_move_assumed:
    shows: >-
      पहले चलने को ही जीत मान लिया जाता है: “किरण शुरू करती है, इसलिए किरण
      जीतेगी।” कई खेलों में, जैसे राजा की सैर में, पहले खिलाड़ी की हार तय होती
      है, वह कुछ भी करे।
    say: “और अगर सामने वाला खिलाड़ी कोई गलती न करे तो?”
    art:
      question: राजा की सैर
      first: पहला जीतता है
      second: दूसरा
  best_case_not_worst:
    shows: >-
      योजना तभी काम करती है जब सामने वाले खिलाड़ी से चूक हो: किरण 4 उठाती है और
      उम्मीद करती है कि यश उसके बाद बहुत कम उठाए। जीतने की रणनीति को सामने वाले
      खिलाड़ी की सबसे अच्छी चाल का जवाब देना होता है।
    say: “इस पर सामने वाले खिलाड़ी का सबसे अच्छा जवाब क्या है?”
    art:
      question: 23 से किरण की पहली चाल
      leo: यश −4

home:
  - title: तीलियों का खेल खेलें
    text: >-
      15 तीलियों में से 1, 2 या 3 उठाने वाला खेल खेलें, और बच्चे को पहले चलने
      दें। कुछ बार जीतें, फिर पूछें कि 4 के गुणज बार-बार क्यों लौट आते हैं।
  - title: चाल की नकल करें
    text: >-
      सममित बोर्ड वाले किसी भी खेल में सामने वाले खिलाड़ी की चाल की नकल उलटी
      तरफ़ करके देखें। पूछें कि नकल कब काम करती है और कब टूट जाती है।
  - title: पाला बदलें
    text: >-
      जब बच्चे को जीतने वाली योजना मिल जाए, तो पाला बदलें: अब बच्चा दूसरे नंबर
      पर चले। यह समझाना कि वहाँ से योजना क्यों हारती है, इस विषय का ज़्यादा गहरा
      आधा हिस्सा है।

