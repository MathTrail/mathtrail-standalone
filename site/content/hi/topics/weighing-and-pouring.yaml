# The page of the topic of weighing and pouring, for a parent, in Hindi. The
# topic's name, its group, its grades and its traps' names are not here: they
# are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: तौलना और उड़ेलना
description: “तौलना और उड़ेलना” विषय के सवाल (तराज़ू पर हल्का सिक्का, पानी के जग) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words the page's drawings write a jug's size, a step and a move in.
art:
  litres: "{count} ली॰"
  step: कदम
  pour: उड़ेलना
  empty: खाली करना
  fill: भरना
  top: ऊपर तक भरना

hero:
  lead: >-
    5 लीटर और 3 लीटर के दो जगों से ठीक 4 लीटर कैसे नापा जाए? बिना बाटों वाले
    तराज़ू से बहुत-से सिक्कों में से अकेला हल्का सिक्का कैसे ढूँढा जाए? इन
    सवालों में बच्चे को कदमों का एक छोटा-सा सिलसिला पहले से तय करना होता है, और
    हर नियम मायने रखता है: जगों पर कोई निशान नहीं, तराज़ू के लिए कोई बाट नहीं।
    यह एल्गोरिदम से पहली मुलाकात है, यानी ऐसी योजनाओं से जो हर हाल में काम
    करती हैं।
  method: हर स्थिति लिखना और सबसे छोटा रास्ता ढूँढना
  teaches: कदमों की योजना पहले से बनाना, और तौलने के हर नतीजे को सोचकर देखना
  # The words of its drawing: what is measured over it, and what each pair of
  # jugs is.
  art:
    line: 5 और 3 ली॰ के जगों से 4 ली॰ नापना
    pair: "हर जोड़ी एक स्थिति है: किस जग में कितना पानी है"

basis:
  title: तौलने और उड़ेलने के नियम
  cards:
    - title: स्थिति यानी सभी जग
      text: >-
        हर कदम के बाद लिखें कि किस जग में कितना पानी है: 5 और 0, फिर 2 और 3।
        स्थितियों की सूची दिखाती है कि कहाँ तक पहुँचा जा सकता है और कौन-सी
        स्थितियाँ पहले ही आ चुकी हैं।
    - title: तीन नतीजे
      text: >-
        तराज़ू बाईं ओर झुक सकता है, दाईं ओर झुक सकता है या बराबर रह सकता है,
        इसलिए हर बार तौलने के तीन नतीजे होते हैं। सिक्कों को दो नहीं, तीन
        समूहों में बाँटें।
      art:
        left: बाएँ
        level: बराबर
        right: दाएँ
    - title: हर नियम मायने रखता है
      text: >-
        जगों पर कोई निशान नहीं, पानी फेंकने की मनाही, बाट सिर्फ़ एक पलड़े पर: हर
        नियम बदल देता है कि किन कदमों की अनुमति है, और इसलिए जवाब भी।
      art:
        no-marks: कोई निशान नहीं
        pour-out: पानी फेंकना
        unless: जब तक सवाल इसकी अनुमति न दे
        weight: बाट
        one-pan: सिर्फ़ एक पलड़े पर

idea:
  title: तौलने के तीन नतीजे
  lead: हर बार तौलने के तीन नतीजे होते हैं, इसलिए एक बार तौलकर सिक्कों को तीन समूहों में बाँटा जा सकता है। इसी से तय होता है कि कितनी बार तौलकर कितने सिक्के जाँचे जा सकते हैं।
  table:
    head:
      - कितनी बार तौला
      - नतीजे
      - कितने सिक्के जाँचे जा सकते हैं
    rows:
      - - "1"
        - "3"
        - 3 तक
      - - "2"
        - 3 × 3 = 9
        - 9 तक
      - - "3"
        - 3 × 3 × 3 = 27
        - 27 तक
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      आधे सिक्कों को बाकी आधे सिक्कों के सामने तौलने पर ज़रूरत से ज़्यादा बार
      तौलना पड़ता है। पूरा विचार यही देखना है कि तराज़ू दो नहीं, तीन तरह से
      जवाब देता है, और यही विचार आगे चलकर कंप्यूटर विज्ञान में खोज के रूप में
      लौटता है।

method:
  title: "हल कैसे करें: स्थितियों की सारणी"
  lead: >-
    उड़ेलने के सवालों में एक सारणी बनाएँ, जिसमें हर जग का एक स्तंभ और हर कदम की
    एक पंक्ति हो, और हर पंक्ति से हर वह कदम आज़माएँ जिसकी अनुमति है, जब तक
    लक्ष्य न दिख जाए; वह जिस कदम पर पहली बार दिखे, वही कदमों की सबसे कम संख्या
    है। तौलने के सवालों में पहले से सोचें कि तीनों में से हर नतीजे के बाद क्या
    करना है। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - स्थिति लिखना, यानी किस जग में या किस पलड़े पर क्या है
    - उससे हर वह कदम आज़माना जिसकी अनुमति है
    - लक्ष्य पर रुकना और कदम गिनना
  # The key under the steps: what a frame on the drawings means.
  legend:
    goal: लक्ष्य पूरा हुआ

examples:
  - title: एक लीटर
    question: >-
      एक रसोइन के पास 3 लीटर का एक खाली जग, 5 लीटर का एक खाली जग और एक नल है।
      जगों पर कोई निशान नहीं हैं। एक कदम में वह नल से कोई जग भरती है, किसी जग
      को खाली करती है, या एक जग से दूसरे में तब तक उड़ेलती है जब तक पहला खाली न
      हो जाए या दूसरा भर न जाए। किसी जग में ठीक 1 लीटर पाने के लिए कम से कम
      कितने कदम लगेंगे?
    steps:
      - 3 लीटर वाला जग भरते हैं और उसे 5 लीटर वाले जग में उड़ेलते हैं, जिसमें अब 3 लीटर है।
      - >-
        3 लीटर वाला जग फिर से भरते हैं और उससे तब तक उड़ेलते हैं जब तक बड़ा जग भर
        न जाए: उसमें बस 2 लीटर और आता है।
      - "छोटे जग में 1 लीटर बचता है, 4 कदमों के बाद: भरना, उड़ेलना, भरना, उड़ेलना।"
    answer: 4 कदम।
    note:
      title: कम क्यों नहीं?
      text: >-
        तीन कदमों तक की हर स्थिति की सारणी में 1 लीटर कहीं नहीं है: जगों में
        सिर्फ़ 0, 2, 3 या 5 लीटर होता है। पहला लीटर चौथे कदम के बाद आता है।
    art:
      jugs: 3 और 5 ली॰ के जग, बिना निशान
      rows: 4 कदम, खाली जगों के बाद 4 पंक्तियाँ
      three: "3 कदमों में:"
      no-litre: एक लीटर नहीं
  - title: आठ सिक्के
    question: >-
      एक जैसे दिखने वाले 8 सिक्के हैं। उनमें से एक नकली है और बाकियों से हल्का
      है; बाकी सबका वज़न बराबर है। नकली सिक्का पक्के तौर पर ढूँढने के लिए बिना
      बाटों वाले तराज़ू पर कम से कम कितनी बार तौलना पड़ेगा?
    steps:
      - हर पलड़े पर 3 सिक्के रखते हैं और 2 अलग रख देते हैं।
      - >-
        अगर कोई पलड़ा ऊपर उठे, तो नकली सिक्का उसी के 3 सिक्कों में है: 1 को 1 के
        सामने तौलते हैं; जो हल्का हो, वही नकली है, और अगर दोनों बराबर रहें, तो
        तीसरा सिक्का।
      - >-
        अगर पलड़े बराबर रहें, तो नकली सिक्का अलग रखे 2 सिक्कों में से एक है:
        उन्हें आपस में तौलते हैं। दोनों ही स्थितियों में 2 बार तौलना काफ़ी है, और
        1 बार काफ़ी नहीं: उसके सिर्फ़ 3 नतीजे होते हैं, और सिक्के 8 हैं।
    answer: 2 बार तौलना।
    note:
      title: 4 और 4 क्यों नहीं?
      text: >-
        4 को 4 के सामने तौलने पर पहली बार के बाद 4 सिक्के बचते हैं, और 4 सिक्कों
        के लिए 2 बार और तौलना पड़ता है, यानी कुल 3 बार। तीन-तीन के समूहों से
        “बराबर” वाला नतीजा भी काम में हाथ बँटाता है।
    art:
      one-lighter: 8 में से एक हल्का है
      three: 3 बनाम 3
      aside: अलग रखे
      lighter: बायाँ हल्का
      one: 1 बनाम 1
      found: जो हल्का, वही; बराबर हों तो तीसरा
      level: बराबर
      of-two: अलग रखे 2 में से
      never-level: कभी बराबर नहीं
      four-left: 4 बचे → 2 बार और तौलना
  - title: सौ सिक्के
    question: >-
      एक जैसे दिखने वाले 100 सिक्कों में से एक नकली है और बाकियों से हल्का है;
      बाकी सबका वज़न बराबर है। नकली सिक्का पक्के तौर पर ढूँढने के लिए बिना बाटों
      वाले तराज़ू पर कम से कम कितनी बार तौलना पड़ेगा?
    steps:
      - >-
        हर बार तौलने के 3 नतीजे होते हैं, इसलिए 4 बार तौलकर ज़्यादा से ज़्यादा
        3 × 3 × 3 × 3 = 81 स्थितियों में फ़र्क किया जा सकता है। यह 100 सिक्कों से
        कम है, इसलिए 4 बार तौलना काफ़ी नहीं।
      - >-
        हर पलड़े पर 33 सिक्के रखते हैं और 34 अलग रखते हैं: कुछ भी हो, ज़्यादा से
        ज़्यादा 34 सिक्के बचते हैं। इसी तरह 34 घटकर ज़्यादा से ज़्यादा 12 रह जाते
        हैं, फिर 4, फिर 2, फिर 1।
      - इस तरह कुल 5 बार तौलना होता है, और सिक्के 100 से घटकर 34, 12, 4, 2 और 1 रह जाते हैं।
    answer: 5 बार तौलना।
    note:
      title: प्रमाण के दो हिस्से
      text: >-
        जवाब के लिए दोनों चाहिए: एक योजना, जो 5 बार तौलकर नकली सिक्का ढूँढ ले,
        और नतीजों की गिनती, जो दिखाए कि 4 बार कभी काफ़ी नहीं हो सकता। “कम से कम”
        वाले ओलंपियाड सवालों के जवाब में हमेशा ये दो हिस्से होते हैं।
    art:
      aside: अलग रखे
      numbers: तीरों के ऊपर की संख्याएँ तौलने की बारी बताती हैं
      plan: योजना
      always: 5 बार तौलकर वह हमेशा मिलता है
      bound: सीमा
      at-most: 4 बार में ज़्यादा से ज़्यादा 81 स्थितियाँ

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  ignored_condition:
    shows: >-
      सवाल का कोई नियम अनजाने में टूट जाता है: पानी फेंक दिया जाता है, जबकि सवाल
      इसकी अनुमति नहीं देता; जग को ऐसे निशान तक भरा जाता है जो उस पर है ही नहीं;
      या बाट उसी पलड़े पर रख दिया जाता है जिस पर तौली जाने वाली चीज़ है।
    say: “सवाल किन कदमों की अनुमति देता है?”
    art:
      question: जगों पर कोई निशान नहीं
      to-mark: “1 ली॰ तक” भरना
      after-pouring: 1 ली॰, उड़ेलकर
  stopped_early:
    shows: >-
      नतीजा पक्का होने से पहले ही योजना रुक जाती है: एक बार तौलकर नकली सिक्के
      वाला समूह मिल जाता है और खोज वहीं खत्म हो जाती है, या उड़ेलना 2 लीटर पर
      रुक जाता है, जबकि लक्ष्य 1 था।
    say: “तराज़ू ने जो भी दिखाया हो, क्या अब तुम्हें पक्का पता है?”
    art:
      question: पहली बार तौलने के बाद
      here: “यहीं है”, पर कौन-सा?
      one-more: एक बार और तौलना
  off_by_one:
    shows: >-
      कदम गिनने में एक की चूक होती है: नल से पहली बार भरना छूट जाता है, या
      आखिरी बार उड़ेलना दो बार गिना जाता है।
    say: "“सारणी पर फिर से गिनो: एक पंक्ति, एक कदम।”"
    art:
      question: सारणी की एक पंक्ति, एक कदम
      three: 3 कदम
      four: 4 कदम
      empty: खाली → 4 स्थितियाँ

home:
  - title: सिंक में जग
    text: >-
      अलग-अलग नाप के दो कप लें और कोई ऐसी मात्रा नापने की कोशिश करें, जो दोनों
      में से किसी भी कप में ठीक-ठीक नहीं आती। सिंक सबसे अच्छी प्रयोगशाला है, और
      गिरा हुआ पानी कोई नुकसान नहीं करता।
  - title: हल्की चीज़ ढूँढें
    text: >-
      एक जैसी दिखने वाली कुछ चीज़ों में एक हल्की चीज़ छिपाएँ और उसे घर के तराज़ू
      से, या दो थैलियों वाले कपड़ों के हैंगर से ढूँढें। गिनें कि कितनी बार तौलना
      पड़ा।
  - title: पहले योजना
    text: >-
      उड़ेलने या तौलने से पहले योजना को सारणी के रूप में लिखें और उसे
      कदम-दर-कदम जाँचें। कौशल पहले से योजना बनाने में है, किस्मत में नहीं।

# What a parent can write in the chat to get a task on this topic.
ask: “तौलना और उड़ेलना” विषय पर एक सवाल दें
