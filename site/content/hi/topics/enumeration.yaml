# The page of the topic of enumeration, for a parent, in Hindi. The topic's
# name, its group, its grades and its traps' names are not here: they are the
# card's words and the catalog's numbers. The page's drawings, each example's
# level, and the answer its solver proves, are the site's data; an example here
# is worked through to that answer. The traps are the topic's commonest, counted
# in its reference tasks.

title: सभी विकल्प गिनना
description: “सभी विकल्प गिनना” विषय के सवाल (गिनती के सवाल) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।

# The words every drawing of the page writes its people in: the three
# children's letters, and Lea's and Tom's initials.
art:
  a: A
  b: B
  c: C
  lea: र
  tom: त

hero:
  lead: >-
    इन अंकों से कितनी संख्याएँ लिखी जा सकती हैं? कितनी बार हाथ मिलेंगे, कपड़ों
    के कितने सेट बनेंगे, कतार में खड़े होने के कितने तरीके हैं? गिनती के इन
    सवालों में हर स्थिति ऐसे क्रम में लिखी जाती है कि कोई छूटे नहीं और कोई दो
    बार न गिनी जाए। नियम से बनी सूची उन सवालों के लिए बच्चे का पहला औज़ार है,
    जिनका जवाब अंदाज़े से नहीं निकल सकता।
  method: नियम से स्थितियों की सूची बनाना
  teaches: क्रम से काम करना, और पहचानना कि कब स्थितियों को लिखे बिना गिना जा सकता है
  # The words of its drawing: the question and the rule over it, and the count
  # under it.
  art:
    line: 1, 2 और 3 में से अलग-अलग अंकों वाली दो अंकों की कितनी संख्याएँ बनती हैं?
    rule: "नियम से सूची: पहला अंक पहले"
    count: पहले अंक के 3 विकल्प × दूसरे के 2 = 6 संख्याएँ

basis:
  title: सूची के नियम
  cards:
    - title: क्रम से
      text: >-
        स्थितियों को लिखने से पहले क्रम में लगाएँ: पहले अक्षर के हिसाब से, फिर
        दूसरे के हिसाब से। क्रम वाली सूची में छूटी हुई स्थिति एक खाली जगह छोड़
        देती है, जो साफ़ दिखती है।
      art:
        on: "{child} पहले"
        # The case the listing lost: its two letters and a question mark, as the
        # language writes one.
        lost: "{first}{second}?"
    - title: हर स्थिति एक बार
      text: >-
        गिनने से पहले तय करें कि दो स्थितियाँ किस बात से अलग होती हैं। रचना और
        तरुण का हाथ मिलाना एक ही बार गिना जाता है, पर कतार में रचना तरुण से आगे
        हो या तरुण रचना से आगे, ये दो अलग कतारें हैं।
      art:
        handshake: 1 बार हाथ मिलाना
        queues: 2 कतारें
    - title: विकल्प गुणा होते हैं
      text: >-
        जब कोई स्थिति एक के बाद एक चुनने से बनती है, पहले कप और फिर तश्तरी, तो
        गिनती गुणा से करें: 3 कप और 2 तश्तरियों से 3 × 2 = 6 सेट बनते हैं।
      art:
        sets: 3 × 2 = 6 सेट

idea:
  title: क्या क्रम मायने रखता है?
  lead: तीनों बच्चे वही हैं, A, B और C, पर अलग-अलग सवालों पर गिनती अलग-अलग निकलती है।
  table:
    head:
      - सवाल
      - क्या क्रम मायने रखता है?
      - स्थितियाँ
    rows:
      - - वे कितने तरीकों से एक कतार में खड़े हो सकते हैं?
        - "हाँ: AB और BA दो अलग कतारें हैं"
        - ABC, ACB, BAC, BCA, CAB, CBA — 6
      - - किसी काम पर कितनी जोड़ियाँ भेजी जा सकती हैं?
        - "नहीं: AB और BA एक ही जोड़ी हैं"
        - AB, AC, BC — 3
      - - एक कप्तान और एक सहायक कितने तरीकों से चुने जा सकते हैं?
        - "हाँ: कप्तान पहले आता है (बड़े आकार में)"
        - AB, AC, BA, BC, CA, CB — 6
  note:
    title: यह क्यों ज़रूरी है
    text: >-
      यहाँ ज़्यादातर गलत जवाबों में एक स्थिति दो बार गिनी जाती है, या दो अलग
      स्थितियाँ एक मान ली जाती हैं। पहले यह तय कर लेने से कि क्रम मायने रखता है
      या नहीं, पता चल जाता है कि किस गलती से बचना है।

method:
  title: "हल कैसे करें: नियम से सूची"
  lead: >-
    पहले एक नियम बनाएँ, कि सूची में पहले क्या आएगा और उसके बाद क्या, फिर उसी
    नियम से स्थितियाँ लिखें, या जब नियम से कोई पैटर्न दिखने लगे, तो उन्हें गिन
    लें। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।
  steps:
    - तय करना कि दो स्थितियाँ किस बात से अलग हैं
    - नियम से स्थितियों की सूची बनाना
    - उन्हें गिनना, या जब चुनाव एक के बाद एक हों, तो गुणा करना
  # The key under the steps: what a frame on the drawings means.
  legend:
    frame: "नीला फ़्रेम: इस कदम से जो जुड़ता है"

examples:
  - title: दो धारियों वाले झंडे
    question: >-
      एक झंडे में दो धारियाँ हैं, एक के ऊपर एक। हर धारी लाल, पीली या हरी है, और
      दोनों धारियों के रंग अलग-अलग हैं। ऐसे कितने अलग-अलग झंडे हैं?
    steps:
      - >-
        झंडों को ऊपर वाली धारी के हिसाब से क्रम में लगाते हैं। ऊपर लाल हो, तो
        नीचे वाली पीली या हरी है: दो झंडे।
      - >-
        ऊपर पीली हो, तो नीचे लाल या हरी: दो और। ऊपर हरी हो, तो लाल या पीली: दो
        और।
      - >-
        ऊपर के लिए 3 रंग, और हर बार नीचे के लिए 2 बचते हैं:
        3 × 2 = 6 झंडे।
    answer: 6 झंडे।
    art:
      paints: तीन रंग, धारियों के रंग अलग-अलग
      red-top: ऊपर लाल
      red: लाल
      yellow: पीली
      green: हरी
      top: ऊपर ↓
      bottom: नीचे →
      same: "×: एक ही रंग दो बार मना है, 9 − 3 = 6"
  - title: तीन के अंतर वाले अंक
    question: दो अंकों की ऐसी कितनी संख्याएँ हैं जिनके अंकों में 3 का अंतर हो, जैसे 14 या 30?
    steps:
      - >-
        दहाई के अंक को 1 से 9 तक लेते हैं, और उसके पास इकाई का हर वह अंक लिखते
        हैं जो उससे 3 दूर है: 1 → 4; 2 → 5; 3 → 0 और 6; 4 → 1 और 7; और इसी तरह
        आगे।
      - >-
        दहाई में 3, 4, 5 या 6 हो, तो हर एक से दो संख्याएँ बनती हैं, 3 कम और 3
        ज़्यादा। 1, 2, 7, 8 या 9 हो, तो सिर्फ़ एक: दूसरी संख्या अंक नहीं होगी।
      - >-
        4 × 2 + 5 × 1 = 13 संख्याएँ: 14, 25, 30, 36, 41, 47, 52, 58, 63, 69,
        74, 85, 96।
    answer: 13 संख्याएँ।
    note:
      title: सबसे ज़्यादा छूटने वाली स्थिति
      text: >-
        30 वह संख्या है जिसे बच्चे भूल जाते हैं: संख्या के अंत में 0 आ सकता है,
        भले ही शुरू में न आ सके। नियम वाली सूची इसे ढूँढ लेती है, याद से बनी
        सूची नहीं।
    art:
      given: दहाई और इकाई में 3 का अंतर
      under: ऊपर दहाई, उनके नीचे मेल खाती इकाइयाँ
      two: "नीले में: हर एक से दो संख्याएँ"
      can: मान्य
      not: दो अंकों की नहीं
  - title: दो 2 अगल-बगल नहीं
    question: >-
      सिर्फ़ 1 और 2 अंकों से चार अंकों की ऐसी कितनी संख्याएँ लिखी जा सकती हैं,
      जिनमें कोई भी दो 2 अगल-बगल न हों?
    steps:
      - >-
        ये इतनी ज़्यादा हैं कि अंदाज़ा नहीं लगाया जा सकता, इसलिए इन्हें
        अंक-दर-अंक बनाते हैं। एक अंक: 1 और 2, दो संख्याएँ। दो अंक: 11, 12 और
        21, तीन, क्योंकि 22 मान्य नहीं है।
      - >-
        मान्य संख्या 1 पर या 2 पर खत्म होती है। 1 पर खत्म हो, तो वह एक अंक कम
        वाली किसी भी मान्य संख्या के अंत में 1 लगाकर बनती है। 2 पर खत्म हो, तो
        उससे पहले का अंक 1 होना चाहिए: वह दो अंक कम वाली किसी भी मान्य संख्या
        के अंत में 12 लगाकर बनती है। तो हर गिनती अपने से पहले की दो गिनतियों का
        योग है: तीन अंकों के लिए 3 + 2 = 5, और चार अंकों के लिए 5 + 3 = 8।
      - >-
        सूची बनाकर जाँचते हैं: 1111, 1112, 1121, 1211, 2111, 1212, 2112, 2121,
        आठ।
    answer: 8 संख्याएँ।
    note:
      title: बढ़ती हुई गिनती
      text: >-
        गिनतियाँ 2, 3, 5, 8 आगे 13, 21, 34 बनती जाती हैं, और हर एक अपने से
        पहले की दो का योग है। ओलंपियाड के सवालों को ऐसी गिनतियाँ बहुत पसंद हैं जो
        छोटी गिनतियों से बनती हैं।
    art:
      twos: दो 2 अगल-बगल मान्य नहीं
      one: 1 अंक
      two: 2 अंक
      three: 3 अंक
      four: 4 अंक

# The commonest traps of the topic's reference tasks, the commonest first.
traps:
  missed_case:
    shows: >-
      स्थितियाँ जैसे-जैसे याद आती हैं, वैसे-वैसे लिखी जाती हैं, और एक छूट जाती
      है, अक्सर 0 वाली या ऐसी जिसमें कोई अंक दोहराया गया हो।
    say: “इन्हें किस क्रम में लिखा है? चलो, इन्हें नियम से दोबारा लिखें।”
    art:
      question: अंकों में 3 का अंतर
  wrong_operation:
    shows: >-
      जहाँ विकल्प गुणा होते हैं, वहाँ जोड़ दिया जाता है, जिससे 3 कमीज़ें और 2
      स्कार्फ़ मिलकर 5 हो जाते हैं; या जहाँ जोड़ी चुनी जाती है और कोई अपने ही
      साथ जोड़ी नहीं बनाता, वहाँ गुणा कर दिया जाता है।
    say: "“एक कमीज़ लो: उससे कितने सेट बनते हैं? और कमीज़ें कितनी हैं?”"
    art:
      question: 3 कमीज़ें और 2 स्कार्फ़
  double_count:
    shows: >-
      रचना का तरुण से हाथ मिलाना और तरुण का रचना से हाथ मिलाना दो बार गिना
      जाता है, जबकि हाथ एक ही बार मिला।
    say: “क्या यह वही स्थिति है जो हमारे पास पहले से है?”

home:
  - title: खिलौने को कपड़े पहनाएँ
    text: >-
      बच्चे को किसी खिलौने के लिए दो टोपियाँ और तीन स्कार्फ़ दें, और पूछें कि
      उसे कितने तरीकों से कपड़े पहनाए जा सकते हैं। फिर सूची माँगें और साथ मिलकर
      जाँचें।
  - title: नियम पूछें
    text: >-
      जब बच्चा स्थितियाँ लिखे, तो पूछें: “इन्हें किस क्रम में लिखा है?” नियम
      वाली सूची को जाँचा जा सकता है।
  - title: कोड वाला ताला
    text: >-
      कोई ऐसा ताला सोचें जिसका कोड 1, 2 और 3 में से दो अंकों का हो, और बच्चे को
      पता लगाने दें कि चोर को कितने कोड आज़माने पड़ेंगे।

# What a parent can write in the chat to get a task on this topic.
ask: “सभी विकल्प गिनना” विषय पर एक सवाल दें
