# The page of the topic of cubes and paper, for a parent, in Hindi.
# The topic's name, its group, its grades and its traps' names are not here:
# they are the card's words and the catalog's numbers. The page's drawings, each
# example's level, and the answer its solver proves, are the site's data; an
# example here is worked through to that answer. The traps are the topic's
# commonest, counted in its reference tasks.

title: "घन और कागज़"
description: "“घन और कागज़” विषय के सवाल (घन का जाल, कागज़ मोड़ना) क्या होते हैं, इन्हें कैसे हल करते हैं, बच्चे कहाँ गलती करते हैं और घर पर कैसे मदद करें।"
hero:
  lead: "छह वर्गों का सपाट जाल मोड़कर घन बन जाता है; मुड़ा हुआ कागज़ एक बार छेदने पर खुलकर कई छेद दिखाता है; पंक्ति पर लुढ़कते पासे की ऊपर वाली संख्या पहले से निकाली जा सकती है। ये सवाल मोड़ने, लुढ़कने या खोलने की कल्पना एक-एक कदम करके हल होते हैं।"
  method: "एक-एक कदम मोड़ना, लुढ़काना या खोलना"
  teaches: "यह देखना कि सपाट आकृति ठोस कैसे बनती है, और उल्टा"
  art:
    opposite: "1 और 5 आमने-सामने आते हैं"
basis:
  title: "मोड़ने के नियम"
  cards:
    - title: "आमने-सामने के फलक कभी नहीं छूते"
      text: "जाल में एक ही पंक्ति के दो वर्ग, जिनके बीच एक वर्ग हो, घन के आमने-सामने के फलक बनते हैं।"
      art:
        opposite: "3 और 6 आमने-सामने हैं"
    - title: "मोड़ परतें दुगनी करता है"
      text: "एक बार मुड़े कागज़ में मोड़ जहाँ उसे रखता है वहाँ 2 परतें होती हैं, और फिर मोड़ने पर 4। छेद हर परत में छेद करता है।"
      art:
        holes: "2 मोड़, 4 परतें, 4 छेद"
    - title: "पासे पर 7"
      text: "पासे पर आमने-सामने के फलकों की संख्याओं का जोड़ 7 होता है: 1 और 6, 2 और 5, 3 और 4।"
      art:
        bottom: "ऊपर 2, नीचे 5"
idea:
  title: "एक-एक कदम"
  lead: "मन में एक-एक कदम मोड़ें, लुढ़काएँ या खोलें, और देखें कि हर कदम क्या करता है।"
  table:
    head:
      - "क्या किया जाता है"
      - "क्या बदलता है"
    rows:
      - - "जाल का एक वर्ग ऊपर मुड़ता है"
        - "वह घन का अगला फलक बनता है"
      - - "कागज़ एक बार मोड़ा जाता है"
        - "जहाँ वह टिकता है वहाँ परतें दुगनी होती हैं"
      - - "पासा एक किनारे पर लुढ़कता है"
        - "बगल का फलक ऊपर आता है"
      - - "पासा दो बार सीधा लुढ़कता है"
        - "नीचे का फलक ऊपर आता है"
  note:
    title: "यह क्यों ज़रूरी है"
    text: "बच्चे अक्सर पूरा नतीजा एक साथ अंदाज़े से बताते हैं। हर कदम आसान है, और उन्हें एक-एक करके चलने से अंदाज़े की ज़रूरत नहीं रहती।"
method:
  title: "हल कैसे करें: एक बार में एक मोड़"
  lead: "पहले आने वाला वर्ग, मोड़ या लुढ़कना बताएँ, कहें कि वह क्या करता है, फिर अगले पर जाएँ। जहाँ हो सके, कागज़ का जाल काटें या असली पासा लेकर जाँचें। नीचे दिए उदाहरण सबसे आसान से ओलंपियाड के स्तर तक जाते हैं।"
  steps:
    - "पहला वर्ग, मोड़ या लुढ़कना चुनें"
    - "बताएँ कि वह फलकों या परतों के साथ क्या करता है"
    - "कदम-दर-कदम आगे बढ़ें, फिर कागज़ या पासे से जाँचें"
examples:
  - title: "सामने वाला फलक"
    question: "एक घन का जाल क्रॉस जैसा है: ऊपर से 1, 2, 3 और 4 क्रमांक वाले 4 वर्गों का एक स्तंभ, और वर्ग 2 के दोनों ओर वर्ग 5 और 6। मोड़ने पर 2 के सामने कौन-सी संख्या आएगी?"
    steps:
      - "वर्ग 1 और 3 स्तंभ में 2 के पास हैं, इसलिए उसे छूते हैं।"
      - "वर्ग 5 और 6 2 के बगल में हैं, इसलिए वे भी उसे छूते हैं।"
      - "वर्ग 4, 2 से दो वर्ग नीचे है और बीच में 3 है: वह 2 के सामने आता है।"
    answer: "संख्या 4।"
    note:
      title: "कागज़ से जाँचें"
      text: "खानेदार कागज़ पर क्रॉस बनाएँ, काटें और मोड़ें: 2 और 4 आमने-सामने आते हैं।"
    art:
      opposite: "2 और 4 आमने-सामने हैं"
  - title: "दो मोड़ और एक छेद"
    question: "एक वर्गाकार कागज़ को आधा मोड़ा गया, फिर दोबारा आधा। मुड़े कागज़ में एक छेद किया गया। खोलने पर उसमें कितने छेद होंगे?"
    steps:
      - "पहला मोड़ 2 परतें देता है।"
      - "दूसरा मोड़ उन्हें दुगना करता है: 4 परतें।"
      - "छेद चारों परतों से होकर जाता है, इसलिए खुले कागज़ में 4 छेद हैं।"
    answer: "4 छेद।"
    note:
      title: "छेद कहाँ हैं"
      text: "छेद कागज़ के 4 चौथाई हिस्सों में हैं, और हर छेद मोड़ की रेखा के पार अगले का दर्पण-प्रतिबिंब है।"
    art:
      holes: "हर चौथाई में एक छेद"
  - title: "लुढ़कता पासा"
    question: "एक पासे के ऊपर 2 है। वह अपने किनारे पर सीधा आगे दो बार लुढ़कता है। पासे के आमने-सामने के फलकों का जोड़ 7 होता है। अब ऊपर कौन-सी संख्या है?"
    steps:
      - "पहला लुढ़कना पीछे वाले फलक को ऊपर लाता है।"
      - "दूसरा लुढ़कना उस फलक को ऊपर लाता है जो शुरू में नीचे था।"
      - "नीचे 2 के सामने वाली संख्या थी, यानी 7 − 2 = 5।"
    answer: "संख्या 5।"
    note:
      title: "चार बार लुढ़कने के बाद"
      text: "दो बार और लुढ़कने से 2 फिर ऊपर आ जाता है: सीधा लुढ़कने पर ऊपर का फलक हर 4 बार में लौटता है।"
    art:
      top: "ऊपर 5"
traps:
  missed_case:
    shows: "कोई फलक, परत या स्थिति छूट जाती है: मोड़ने पर किसी दूसरे को छूने वाला वर्ग, या वह परत जिसमें से छेद भी होकर जाता है।"
    say: "“क्या कोई फलक या परत अभी गिननी बाकी है?”"
  ignored_condition:
    shows: "सवाल का कोई नियम छूट जाता है: पास-पास के वर्गों को आमने-सामने के फलक मान लिया जाता है, या भुला दिया जाता है कि पासे के आमने-सामने के फलकों का जोड़ 7 है।"
    say: "“क्या यह सवाल के नियम पर खरा उतरता है?”"
  stopped_early:
    shows: "हल एक कदम पहले रुक जाता है: पहले मोड़ के बाद, या पासे के एक बार लुढ़कने के बाद।"
    say: "“क्या एक कदम और बाकी है?”"
home:
  - title: "कागज़ के जाल"
    text: "छह वर्गों का क्रॉस बनाएँ, काटें और मोड़कर घन बनाएँ। कौन-से वर्ग आमने-सामने आए?"
  - title: "मोड़ें और छेदें"
    text: "एक कागज़ को दो बार मोड़ें, पेंसिल से एक छेद करें, और खोलने से पहले साथ मिलकर छेदों का अंदाज़ा लगाएँ।"
  - title: "असली पासा"
    text: "साथ मिलकर पासा देखें: कौन-सी संख्याएँ आमने-सामने हैं? उसे मेज़ पर लुढ़काएँ और देखने से पहले ऊपर की संख्या बताएँ।"
ask: "“घन और कागज़” विषय पर एक सवाल दें"
