title: शोध
description: "वे आँकड़े, जिन पर MathTrail टिका है: हर सवाल की जाँचें, लक्ष्यों की कसौटी पर छात्र मॉडल, और सवालों के विचार कहाँ से आते हैं।"

hero:
  badge: तकनीकी पाठकों के लिए
  title: मॉडल लिखता है,
  title_end: सेवा जाँचती है।
  lead: MathTrail कैसे किसी सवाल को {count} {noun} पास करने के बाद ही बच्चे तक पहुँचने देता है, और जाँचें क्या नहीं देखतीं।
  paper: पूरा शोध-पत्र · PDF, {count} {noun}
  code: कोड और डेटा
  flow:
    task: सवाल
    example: "{length} मीटर लंबी बाड़ में हर {gap} मीटर पर एक खंभा है, दोनों सिरों पर भी। कितने खंभे हैं?"
    solver: सॉल्वर
    sum: "{length} ÷ {gap} + {one} = {posts} → {letter}"
    hands_in: सवाल और उसका सॉल्वर
    back: खारिज, वापस भेजा गया
    twice: सॉल्वर दो बार चलता है
    asks: एक ही सही विकल्प · कक्षा के हिसाब से पढ़ने लायक शब्द · पिछले सवालों का दोहराव नहीं
    passed: हर जाँच में पास
    sealed: बच्चे के जवाब देने तक जवाब सीलबंद
  grades: कक्षा {first}–{last}
  licence: ओपन सोर्स कोड, MIT

theses:
  title: चार बातें, जो शोध-पत्र दिखाता है
  writes:
    title: चैट का मॉडल लिखता है
    text: हर सवाल उसी चैट का मॉडल लिखता है, जिसे परिवार पहले से इस्तेमाल करता है, बच्चे की भाषा में और बच्चे के करीब की किसी कहानी के इर्द-गिर्द। MathTrail खुद किसी मॉडल को कॉल नहीं करता। यह एक छोटी, तय नियम से चलने वाली सेवा है, जो एक अनुरोध से दूसरे अनुरोध के बीच बच्चे का कुछ भी अपने पास नहीं रखती।
    model: चैट का मॉडल
    model_does: लिखना
    service: MathTrail
    service_does: जाँचना
    child: बच्चा
    child_does: हल करना
  twice:
    title: सॉल्वर दो बार चलता है
    text: सवाल के साथ मॉडल एक छोटा प्रोग्राम (सॉल्वर) भी लिखता है, जो जवाब निकालकर सही विकल्प का अक्षर बताता है। सेवा उसे चलाती है, फिर अक्षरों को {count} {noun} आगे खिसका देती है, जिससे {from} अब {to} बन जाता है, और उसे फिर से चलाती है। जो प्रोग्राम सचमुच जवाब निकालता है, उसे जवाब नई जगह पर मिल जाता है; जिसने अक्षर हाथ से लिख दिया था, उसे नहीं मिलता। दूसरी बार प्रोग्राम तभी चलाया जाता है, जब पहली बार चलाने पर वह ठीक एक विकल्प चुनता है।
    first: पहली बार
    second: दूसरी बार, अक्षर खिसकाकर
    picks: → {letter}
    caption: जिस प्रोग्राम ने “{letter}” हाथ से लिखा था, वह दूसरी बार चलाने पर {value} की ओर इशारा करता है, और सवाल खारिज हो जाता है।
  sealed:
    title: जवाब सीलबंद है
    text: जवाब, हल, व्याख्याएँ और सॉल्वर एन्क्रिप्ट करके बच्चे की प्रोफ़ाइल में रखे जाते हैं, जो अभिभावक की Google Drive में है। जब तक बच्चा जवाब न दे, ये न तो किसी ऐसी चीज़ में होते हैं जो सेवा कार्ड या चैट के मॉडल को देती है, न ही उसके किसी लॉग में।
    sees: बच्चे को क्या दिखता है
    seen: सवाल · चित्र · विकल्प · संकेत
    hidden: जवाब आने तक सीलबंद
    kept: जवाब · हल · व्याख्याएँ
    cipher: XChaCha20-Poly1305 · बच्चे और सवाल से बँधा हुआ
    outside: सील जहाँ तक नहीं पहुँचती, वह खुद चैट है। जिस मॉडल ने सवाल लिखा, वह उसका जवाब जानता है, और चैट का अपना लॉग, जिसमें उसकी टूल कॉल दर्ज हैं, यह जवाब उस बड़े व्यक्ति को दिखा देता है जो उसे खोले।
  reach:
    title: थोड़ा ज़्यादा कठिन, पर पहुँच में
    text: छात्र मॉडल अनुमान लगाता है कि बच्चे के किसी सवाल को हल कर लेने की कितनी संभावना है, और सेवा वह सवाल माँगती है जिसकी संभावना {middle} के सबसे करीब हो, जो {low} से {high} तक के दायरे का बीच है। हर बच्चे के साथ सबसे पहले शुरुआती दौर चलता है, यानी पहले {trial}, जिससे पता चलता है कि शुरुआत कहाँ से हो।
    guess: c = {guess}, यानी {options} में से एक तुक्के से सही
    corridor: लक्ष्य दायरा

model:
  title: लक्ष्यों की कसौटी पर छात्र मॉडल
  lead: सेवा बच्चे के साथ कितनी बारीकी से चलती है, सवालों को कितनी अच्छी तरह पहुँच में रखती है, किसी विषय में महारत कितने भरोसे से घोषित करती है, और सिलसिले के आखिर में बच्चे को क्या दिखाया जाता है। आँकड़े बेंच के हैं, काल्पनिक बच्चों पर, और उसी कोड से निकाले गए हैं जिससे यह साइट बनी है।
  run:
    commit: commit {commit} · {date}
    size: "{children} × {answers}"
    seed: सीड {seed}
  paper: शोध-पत्र नियम को वैसा बताता है जैसा वह उस commit पर था जिस पर उसके आँकड़े निकाले गए, यानी {commit}। यह पेज सेवा को वैसे ही दिखाता है, जैसे वह अभी चलती है, इसलिए दोनों में फ़र्क है।
  key:
    service: अभी की सेवा
    interval: "{interval} अंतराल"
    goal: लक्ष्य
    ceiling: ऊपरी सीमा, यानी ऐसा अनुमान जिसे पता है कि बच्चा कहाँ है
  groups:
    step: अनुमान बच्चे के साथ कैसे चलता है
    mastery: महारत कैसे घोषित होती है
    screen: सिलसिले के आखिर में बच्चे को क्या दिखाया जाता है
    screen_note: "जवाब {first}–{last} · लक्ष्य: जवाब {earlyfirst}–{earlylast} के समय से ज़्यादा नहीं"
    context: तुलना के लिए, बिना लक्ष्य के
  rows:
    lag:
      name: बच्चे के सीखते समय उससे पिछड़ना
      unit: लॉजिट, जितना कम, उतना बेहतर · सबसे अच्छा संभव {best}
    corridor_learning:
      name: "{low}–{high} के दायरे में सवाल"
      unit: सीखते हुए · सवालों का हिस्सा, जितना ज़्यादा, उतना बेहतर
    jump_unsettled:
      name: छलाँग के बाद अनुमान का पीछे रह जाना
      unit: बच्चों का हिस्सा, जितना कम, उतना बेहतर
    false_mastery_static:
      name: महारत की गलत घोषणाएँ
      unit: महारत की सभी घोषणाओं में हिस्सा, जितना कम, उतना बेहतर
    false_mastery_wide:
      name: महारत की गलत घोषणाएँ, दूर-दूर के विषय
      unit: महारत की सभी घोषणाओं में हिस्सा, जितना कम, उतना बेहतर
    late_mastery_static:
      name: महारत घोषित होने तक जवाब
      unit: जवाब, जितने कम, उतना बेहतर
    late_mastery_wide:
      name: महारत घोषित होने तक जवाब, दूर-दूर के विषय
      unit: जवाब, जितने कम, उतना बेहतर
    card_move_static:
      name: रेटिंग कितनी खिसकती है
      unit: ज़्यादातर जवाबों पर अंक, जितने कम, उतना बेहतर
    rank_changes_static:
      name: पड़ाव कितनी बार बदलता है
      unit: हर सौ जवाबों पर बदलाव, जितने कम, उतना बेहतर
    card_move_learning:
      name: रेटिंग, सीखते हुए
      unit: ज़्यादातर जवाबों पर अंक, जितने कम, उतना बेहतर
    rank_changes_learning:
      name: पड़ाव, सीखते हुए
      unit: हर सौ जवाबों पर बदलाव, जितने कम, उतना बेहतर
    error_static:
      name: "{after} दर्ज होने पर अनुमान की चूक"
