      means: लक्ष्य सेवा के अपने ही आँकड़े से लिया गया है, इसलिए यह इस नियम की परख नहीं, बल्कि अगले नियम के लिए पैमाना है।

live:
  title: असली आँकड़े
  lead: यहाँ महीने-दर-महीने दिखता है कि मॉडल के वादे असली बच्चों के लिए सच होते हैं या नहीं। आँकड़े जवाबों के लॉग से आते हैं, जिसमें न किसी का नाम होता है, न किसी सवाल के शब्द।
  rule: कोई श्रेणी तभी दिखाई जाती है, जब उसमें कम से कम {children} और कम से कम {answers} हों, और उसकी हर गिनती {rounded} के किसी गुणज तक गोल की जाती है। इससे छोटी श्रेणी छोड़ दी जाती है, किसी दूसरी श्रेणी में मिलाई नहीं जाती।
  measures:
    chances: वादा → हकीकत
    kept_up: हकीकत − वादा, दिए गए जवाबों की गिनती के हिसाब से
    share: नियम के सवालों पर सही जवाबों का हिस्सा
  frame:
    coming:
      badge: जल्द ही
      when: आँकड़े तब आएँगे जब पूरा महीना गिन लिया जाएगा, यानी अगले महीने की शुरुआत में।
    too_few:
      badge: अभी बहुत कम
      when: "{month} में नियम के सवालों के जवाब इतने कम बच्चों ने दिए कि कोई भी आँकड़ा दिखाया नहीं जा सकता।"
  ready:
    month: "{month}: नियम के चुने सवालों पर {children} और {answers}।"
    weighed: सिर्फ़ नियम के चुने सवालों के जवाब गिने जाते हैं, शुरुआती दौर के बाद, यानी पहले {trial} छोड़कर, और बिना संकेत के, सभी चैट से एक साथ।
    corridor: असली जवाबों पर दायरे में आने वाले सवालों का हिस्सा नहीं मापा जा सकता, क्योंकि हर सवाल का जवाब एक ही बार दिया जाता है।
    columns:
      promised: वादा
      came_true: हकीकत
      answers: जवाब
      children: बच्चे
    chances:
      none: इस महीने वादा की गई संभावना की किसी भी श्रेणी में इतने बच्चे नहीं हैं कि उसे दिखाया जा सके।
      shown:
        caption: वादा की गई संभावना की हर श्रेणी एक बिंदु है, और जितने ज़्यादा जवाब, उतना बड़ा बिंदु। टूटी रेखा वाले विकर्ण पर वादा सच हुआ, और पट्टी वह दायरा है जिसमें नियम सवाल चुनता है।
        up: ↑ सही जवाबों का हिस्सा
        across: वादा की गई संभावना →
        ideal: वादा पूरा
        band: दायरा
        range: "{from}–{to}"
        heading: वादा की गई संभावना
    kept_up:
      none: इस महीने बच्चे के जवाबों के क्रम की किसी भी श्रेणी में इतने बच्चे नहीं हैं कि उसे दिखाया जा सके।
      shown:
        caption: सही जवाब को एक और गलत को शून्य गिना जाता है, उसमें से वादा की गई संभावना घटाई जाती है, और यह अंतर सभी जवाबों पर औसत किया जाता है। टूटी रेखा के दाईं ओर बच्चों का प्रदर्शन वादे से बेहतर रहा, और त्रुटि रेखा दोनों ओर एक मानक त्रुटि तक जाती है, जो बच्चों के हिसाब से गिनी गई है।
        range: "{first}–{last}"
        open: "{first} और आगे"
        heading: जवाब का क्रमांक
        margin: हकीकत घटा वादा
        error: मानक त्रुटि
    share:
      expected: अपेक्षित ≈ {middle}, दायरे का बीच
      caption: नियम वह सवाल माँगता है जिसकी संभावना {middle} के सबसे करीब हो, जो {low} से {high} तक के दायरे का बीच है। बिंदु सही जवाबों का हिस्सा है, और टूटी रेखा दायरे का बीच।

sources:
  title: सवालों के विचार कहाँ से आए
  lead: विचारों पर कॉपीराइट नहीं होता, लिखे हुए शब्दों पर होता है। इसलिए किताब से सिर्फ़ सवाल का विचार और उसका जवाब लिया जाता है, और सवाल के वाक्य, कहानी, विकल्प और जाल नए सिरे से लिखे जाते हैं।
  authors:
    perelman:
      name: याकोव पेरेल्मान
      books:
        firsthundred: For Young Mathematicians. The First Hundred Puzzles
        secondhundred: The Second Hundred Puzzles
        living: “सरस गणित”
        arithmetic: Entertaining Arithmetic
        quick: Quick Reckoning
    ignatyev:
      name: येमेल्यान इग्नात्येव
      books:
        wit: In the Realm of Ingenuity, or Arithmetic for Everyone
    dudeney:
      name: हेनरी ई. ड्यूडनी
      books:
        amusements: Amusements in Mathematics
        canterbury: The Canterbury Puzzles
    loyd:
      name: सैम लॉयड
      books:
        cyclopedia: Cyclopedia of Puzzles
    carroll:
      name: लुइस कैरल
      books:
        tangled: A Tangled Tale
        pillow: Pillow Problems
  died: निधन {year}
  public: सार्वजनिक डोमेन में
  public_note: इन किताबों पर कॉपीराइट की अवधि खत्म हो चुकी है। ये सबकी हैं, और हर किसी को इनका मुफ़्त इस्तेमाल करने की छूट है।
  collections:
    mathnet:
      name: MathNet
      note: कई देशों के ओलंपियाड सवालों का एक खुला संग्रह। हर विषय की विचारों की एक सूची होती है, जिन पर उसके सवाल बनते हैं, और कक्षा {first}–{last} के लिए इनमें से कुछ विचार इसी संग्रह से लिए गए हैं, और कुछ संदर्भ सवालों के सवाल का प्रकार भी। कुछ देश अपने सवालों के अधिकार अपने पास रखते हैं, इसलिए यहाँ से भी सिर्फ़ विचार लिया जाता है, लिखा हुआ पाठ कभी नहीं।
    gsm:
      name: GSM8K
      note: अंग्रेज़ी में स्कूली शब्द-सवालों का एक खुला संग्रह। कक्षा {first}–{last} के कुछ संदर्भ सवालों के सवाल का प्रकार इसी से लिया गया है, और उनका पाठ नए सिरे से लिखा गया है।
  total: कुल {count} {noun}
  each: हर एक के साथ सॉल्वर, और हर गलत विकल्प के पीछे एक जाल
  level: "{count} · कक्षा {first}–{last}"
  note: शैली सोवियत सवाल-संग्रहों जैसी है। विचार, और कई संदर्भ सवालों के सवाल का प्रकार, गणित मंडलियों और ओलंपियाड के रूसी संग्रहों से भी लिए जाते हैं, जिन्हें सवालों के डेटाबेस problems.ru में पढ़ा गया; उनका पाठ संरक्षित है, इसलिए उनसे भी सिर्फ़ विचार या सवाल का प्रकार लिया जाता है, लिखा हुआ पाठ कभी नहीं। संदर्भ सवाल में उसके स्रोत का कोई फ़ील्ड नहीं होता, इसलिए किसी सवाल के विचार के लेखक का नाम नहीं बताया जा सकता।

