# The page of the techniques of olympiad problem solving, for a parent, in
# Hindi. Which techniques there are, their groups and order, the topics each
# one leads to, and each example's level and the answer its solver proves are
# the site's data; the words here follow them, technique by technique. The
# pictures of a technique's steps are laid out by the page, and only their
# words are here.

title: ओलंपियाड गणित के सवाल हल करने के तरीके
description: सवाल हल करने के ऐसे तरीके, जो बच्चों के लिए ओलंपियाड गणित के कई सवालों पर एक साथ काम आते हैं। हर तरीके के साथ एक सवाल, एक चित्र और कदम-दर-कदम हल।

hero:
  title: ओलंपियाड के सवाल हल करने के तरीके
  lead: >-
    ओलंपियाड के सवाल को हल करने की कोई बनी-बनाई विधि नहीं होती। उसकी जगह ऐसे
    तरीके होते हैं, जो एक साथ कई सवालों पर लागू होते हैं। यहाँ सबसे ज़्यादा काम
    आने वाले {count} दिए गए हैं, हर एक के साथ एक सवाल, एक चित्र और हल।
  advice: >-
    हल खोलने से पहले बच्चे के साथ मिलकर सवाल हल करके देखें। सबसे ज़रूरी बात यह
    देखना है कि कौन-सा तरीका काम आया, ताकि अगली बार उसे पहचाना जा सके।

start:
  title: किसी भी सवाल को कहाँ से शुरू करें
  lead: >-
    तरीका चुनने से पहले चार कदमों से गुज़रना फ़ायदेमंद है। गणितज्ञ जॉर्ज पोल्या
    ने इन्हें अपनी किताब *“How to Solve It”* (1945) में बताया था।
  steps:
    - title: सवाल समझना
      text: अपने शब्दों में सवाल दोबारा बताओ। क्या दिया गया है? क्या पूछा गया है?
    - title: योजना बनाना
      text: यह तुम्हें किस चीज़ की याद दिलाता है? इस पेज का कौन-सा तरीका आज़माया जा सकता है?
    - title: योजना पर अमल करना
      text: कदम-दर-कदम, हर कदम से जो निकले, उसे लिखते हुए।
    - title: पीछे मुड़कर जाँचना
      text: जवाब को वापस सवाल में रखकर देखो। क्या सब कुछ ठीक बैठता है? क्या कोई दूसरा जवाब भी हो सकता है?

groups:
  see:
    title: सवाल को देखना
    lead: >-
      पहले सवाल को समझना ज़रूरी है। ये तरीके शब्दों को चित्र, सारणी या छोटे
      उदाहरण में बदल देते हैं।
  find:
    title: जवाब ढूँढना
    lead: >-
      जब साफ़ हो जाए कि क्या हो रहा है, तो ये तरीके रास्ते में कुछ भी खोए बिना
      जवाब तक ले जाते हैं।
  prove:
    title: सिद्ध करना
    lead: >-
      ओलंपियाड में अक्सर सवाल “कितने” का नहीं, बल्कि “क्या ऐसा हो सकता है” का
      होता है। तब गिनना काफ़ी नहीं: समझाना पड़ता है कि इसके सिवा कुछ और क्यों
      नहीं हो सकता।

techniques:
  draw:
    name: चित्र बनाना
    what: >-
      चित्र या आरेख शब्दों को ऐसी चीज़ में बदल देता है, जिसे देखा जा सके।
      रेखाएँ, बिंदु और तीर काफ़ी हैं; चित्र का सुंदर होना ज़रूरी नहीं।
    when: “… से इतना ज़्यादा”, उम्र, सफ़र, पूरे के हिस्से।
    task: >-
      भाई अपनी बहन से 4 साल बड़ा है। दोनों की उम्र मिलाकर 16 साल है। भाई कितने
      साल का है?
    steps:
      - बहन की उम्र को एक पट्टी की तरह बनाते हैं, और भाई की उम्र को वैसी ही पट्टी और 4 साल ज़्यादा।
      - "ज़्यादा वाले 4 साल हटा देते हैं: 16 − 4 = 12। ये दो बराबर पट्टियाँ हैं।"
      - "एक पट्टी 12 ÷ 2 = 6 साल है: यह बहन की उम्र है। भाई 6 + 4 = 10 साल का है।"
    answer: भाई 10 साल का है।
    # Under each step's picture, what it shows: the bars are the sister's age
    # and the brother's, as the page's words name them.
    pictures:
      sum: "ऊपर: बहन, नीचे: भाई; दोनों मिलाकर 16 साल"
      less: 16 − 4 = 12, दो बराबर पट्टियाँ
      found: भाई की उम्र 6 + 4 = 10
    caption: >-
      आरेख वह दिखाता है, जिसे दिमाग में रखना मुश्किल है: ज़्यादा वाले चार साल
      के बिना भाई और बहन की उम्र बराबर है।
  table:
    name: सारणी बनाना
    what: >-
      जब सुराग बहुत हों, तो उन्हें दिमाग में रखना मुश्किल होता है। सारणी उन्हें
      आपके लिए सँभाल लेती है: हर सुराग एक क्रॉस है, और जिस पंक्ति में एक ही
      खाली खाना बचे, वहीं जवाब है।
    when: कई लोग, कई चीज़ें, और “नहीं” वाले सुराग।
    task: >-
      अदिति, मोहन और वर्षा के पास एक बिल्ली, एक कुत्ता और एक तोता है, हर एक के
      पास एक जानवर। अदिति बिल्ली नहीं पालती। मोहन कुत्तों से डरता है। बिल्ली
      मोहन के पास नहीं रहती। किसके पास कौन-सा जानवर है?
    steps:
      - "हर सुराग के लिए क्रॉस लगाते हैं: अदिति, बिल्ली नहीं; मोहन, कुत्ता नहीं; बिल्ली, मोहन के पास नहीं।"
      - "मोहन के लिए एक ही खाना बचा: तोता। तो तोता न अदिति के पास है, न वर्षा के पास।"
      - अदिति के लिए कुत्ता बचता है, और वर्षा के लिए बिल्ली।
    answer: अदिति के पास कुत्ता है, मोहन के पास तोता, वर्षा के पास बिल्ली।
    pictures:
      children:
        anya: अदिति
        borya: मोहन
        vera: वर्षा
      # The letter drawn on each child's face, one no other child's shares.
      faces:
        anya: अ
        borya: म
        vera: व
      pets:
        cat: बिल्ली
        dog: कुत्ता
        parrot: तोता
    caption: खाने में लिखी छोटी संख्या हल का वह कदम है, जिस पर उस खाने में निशान लगाया गया।
  small-numbers:
    name: छोटी संख्याओं से शुरू करना
    aka: विशेष स्थिति
    what: >-
      जब संख्याएँ बड़ी हों और समझ न आए कि कहाँ से शुरू करें, तो वही सवाल छोटी
      संख्याओं के साथ हल करें। नियम पहचानें, फिर उसे बड़ी संख्याओं पर लगाएँ।
    when: बड़ी संख्याएँ, “सौ”, “हज़ार”, लंबी पंक्तियाँ।
    task: >-
      100 मीटर लंबी सड़क के किनारे खंभे लगाए जाते हैं, हर 5 मीटर पर एक, दोनों
      सिरों पर भी। कितने खंभे चाहिए?
    steps:
      - "सौ मीटर का चित्र नहीं बनाया जा सकता, इसलिए 10 मीटर की सड़क लेते हैं। खंभे 0, 5 और 10 मीटर पर: 2 अंतरालों के लिए 3 खंभे।"
      - "15 और 20 मीटर के लिए भी यही बात है: खंभे हमेशा अंतरालों से एक ज़्यादा होते हैं।"
      - 100 मीटर पर 100 ÷ 5 = 20 अंतराल हैं, इसलिए खंभे 21 हैं।
    answer: 21 खंभे।
    # Under each road, its length, its gaps and its posts; under the table,
    # what its columns hold.
    pictures:
      ten: "10 मी: 2 अंतराल, 3 खंभे"
      fifteen: "15 मी: 3 अंतराल, 4 खंभे"
      twenty: "20 मी: 4 अंतराल, 5 खंभे"
      table: सड़क मीटर में, उसके अंतराल और खंभे
    caption: >-
      नियम छोटी सड़क पर ही दिख जाता है; फिर उसे सौ मीटर पर लगाना काफ़ी है।
  systematic:
    name: तय क्रम में सूची बनाना
    what: >-
      बेतरतीब ढंग से सूची बनाने पर कुछ न कुछ ज़रूर छूट जाता है या दो बार गिना
      जाता है। तय क्रम वाली सूची सिलसिलेवार बनती है: पहले एक विशेषता के हिसाब
      से, फिर अगली के हिसाब से। इसके लिए पेड़ जैसा चित्र (वृक्ष आरेख) काम का है।
    when: “कितने तरीकों से”, “कितनी संख्याएँ”, “सभी विकल्प लिखो”।
    task: >-
      अंक 2, 4, 6 और 8 से दो अंकों की कितनी अलग-अलग संख्याएँ बनाई जा सकती हैं,
      अगर एक संख्या में कोई अंक दो बार न आए?
    steps:
      - "एक क्रम चुनते हैं: पहले दहाई का अंक, फिर इकाई का।"
      - दहाई का अंक 2, 4, 6 या 8 है। हर एक के बाद इकाई के लिए तीन दूसरे अंक बचते हैं।
      - "इन्हें शाखा-दर-शाखा लिखते हैं: 24, 26, 28, 42, 46, 48, 62, 64, 68, 82, 84, 86। कोई संख्या नहीं छूटी, और कोई दोहराई नहीं गई।"
    answer: 12 संख्याएँ।
    pictures:
      first: पहला अंक चार में से एक है
      total: 4 शाखाएँ × 3 संख्याएँ = 12
    caption: "वृक्ष आरेख में कुछ नहीं छूटता: हर पहले अंक की अपनी शाखाएँ हैं।"
  backwards:
    name: अंत से शुरू करना
    aka: उलटे क्रम में हल करना
    what: >-
      जब कहानी का अंत पता हो और पूछा जाए कि शुरुआत कैसी थी, तो पीछे की ओर
      चलें। हर क्रिया को उसकी उलटी क्रिया में बदलें: “खाया” को “वापस रखा” में,
      “गुणा किया” को “भाग दिया” में।
    when: अंत में क्या निकला, यह पता है, और ढूँढना है कि शुरू में क्या था।
    task: >-
      एक कटोरे में कुछ सेब थे। तनु ने उनमें से आधे खा लिए। फिर राहुल ने बचे हुए
      सेबों में से आधे खाए, और एक सेब और। 2 सेब बचे। शुरू में कितने सेब थे?
    steps:
      - "जो पता है, वहीं से शुरू करते हैं: अंत में 2 सेब थे।"
      - "राहुल से पहले: वह एक सेब वापस रखते हैं, 2 + 1 = 3। यह आधा था, तो 6 थे।"
      - "तनु से पहले: 6 आधा था, तो 12 थे। जाँच: 12 → 6 → 6 − 3 − 1 = 2।"
    answer: 12 सेब।
    pictures:
      end: अंत में
      undo-petya: +1, ×2
      undo-tanya: ×2
      check: "जाँच:"
    caption: >-
      दाएँ से बाएँ चलते हैं और सब कुछ उलटा करते हैं: “आधे खाए” की जगह
      “2 से गुणा करना”, “एक और खाया” की जगह “1 जोड़ना”।
  all-the-same:
    name: मान लेना कि सब एक जैसे हैं
    aka: मान लेने का तरीका
    what: >-
      जब सवाल में दो तरह की चीज़ें हों, तो कल्पना करें कि सब एक ही तरह की हैं।
      गिनें कि जवाब कितना दूर रह गया, फिर दिख जाएगा कि कितनी चीज़ें बदलनी हैं।
    when: "दो तरह की चीज़ें, जिनकी कुल संख्या पता है: सिर और पैर, दो अलग-अलग मूल्य के सिक्के।"
    task: >-
      एक आँगन में मुर्गियाँ और खरगोश घूम रहे हैं। उनके कुल मिलाकर 10 सिर और 28
      पैर हैं। आँगन में कितने खरगोश हैं?
    steps:
      - मान लेते हैं कि सभी 10 मुर्गियाँ हैं। तब पैर 10 × 2 = 20 होंगे।
      - "असल में पैर 28 हैं: 8 ज़्यादा।"
      - "मुर्गी की जगह हर खरगोश 2 पैर बढ़ाता है: 8 ÷ 2 = 4 खरगोश। जाँच: 4 × 4 + 6 × 2 = 28।"
    answer: 4 खरगोश।
    # What each counter under the problem stands for.
    legend:
      hen: मुर्गी, 2 पैर
      rabbit: खरगोश, 4 पैर
    pictures:
      guess: "= 20 पैर"
      short: कम पड़ते पैर
      fits: "4 खरगोश और 6 मुर्गियाँ: 16 + 12 = 28 पैर"
    caption: >-
      पहले ऐसे गिनते हैं मानो सब एक जैसे हों, फिर ठीक उतने बदलते हैं, जितनों से
      हिसाब बैठ जाए।
  pattern:
    name: पैटर्न ढूँढना
    what: >-
      पहले कुछ कदम देखें और ढूँढें कि क्या दोहराया जा रहा है। दोहराए जाने वाले
      हिस्से की मदद से बीच का सब कुछ बनाए बिना सीधे बहुत आगे पहुँचा जा सकता है।
    when: "पैटर्न, पंक्तियाँ, कैलेंडर: “बीसवाँ कौन-सा होगा”, “सौवाँ कौन-सा होगा”।"
    task: >-
      झंडे इस क्रम में टँगे हैं: लाल, पीला, हरा, नीला, फिर दोबारा लाल, पीला,
      हरा, नीला, और इसी तरह आगे। 23वाँ झंडा किस रंग का है?
    steps:
      - "दोहराया जाने वाला हिस्सा ढूँढते हैं: लाल, पीला, हरा, नीला, यानी चार झंडे।"
      - 23 झंडों में चार-चार के 5 पूरे समूह हैं, यानी 20 झंडे, और फिर 3 और।
      - 23वाँ झंडा अपने चार के समूह में तीसरा है, और तीसरा हमेशा हरा होता है।
    answer: हरा।
    pictures:
      sum: 23 = 4 × 5 + 3
      last: 21, 22, 23
    caption: >-
      तेईस झंडे बनाने की ज़रूरत नहीं: इतना देखना काफ़ी है कि झंडा अपने चार के
      समूह में किस जगह पर है।
  opposite:
    name: उलटा मान लेना
    aka: विरोधाभास से प्रमाण
    what: >-
      यह सिद्ध करने के लिए कि कुछ नहीं हो सकता, मान लें कि वह हो सकता है, और
      तर्क को तब तक आगे बढ़ाएँ, जब तक कोई विरोधाभास सामने न आ जाए। “सच्चे और
      झूठे” विषय के लगभग सभी सवाल ऐसे ही हल होते हैं।
    when: “क्या ऐसा हो सकता है”, “सिद्ध करो कि यह असंभव है”, कौन सच बोल रहा है।
    task: >-
      एक द्वीप पर सच्चे रहते हैं, जो हमेशा सच बोलते हैं, और झूठे, जो हमेशा झूठ
      बोलते हैं। अदिति ने कहा: “मोहन झूठा है।” मोहन ने कहा: “अदिति और मैं,
      दोनों सच्चे हैं।” कौन क्या है?
    steps:
      - >-
        **मान लेते हैं कि मोहन सच्चा है।** तब उसकी बात सच है, और अदिति भी
        सच्ची है। पर सच्ची अदिति ने कहा कि मोहन झूठा है। **विरोधाभास।**
      - "तो मोहन झूठा है, और उसकी बात झूठी है: यह सच नहीं कि अदिति और वह दोनों सच्चे हैं। यह ठीक बैठता है।"
      - अदिति ने कहा “मोहन झूठा है”, और यह सच है। सच सिर्फ़ सच्चे बोलते हैं, इसलिए अदिति सच्ची है।
    answer: अदिति सच्ची है, और मोहन झूठा है।
    # Who said what, under the problem, each by a letter of their name.
    legend:
      anya: अ
      borya: स
      anya-said: “मोहन झूठा है”
      borya-said: “अदिति और मैं, दोनों सच्चे हैं”
    pictures:
      said: “मोहन झूठा है”
      false: “दोनों सच्चे” झूठ है
      true: “मोहन झूठा है” सच है
    caption: एक रास्ता बंद गली में ले जाता है, इसलिए दूसरा सही है।
  parity:
    name: सम-विषम पर नज़र रखना
    what: >-
      कभी-कभी सब कुछ जानना ज़रूरी नहीं: इतना जानना काफ़ी है कि संख्या सम है या
      विषम। अगर कोई चीज़ हर कदम पर सम और विषम के बीच बदलती है, तो कदमों की
      संख्या तुरंत बता देती है कि कहाँ पहुँचा जा सकता है और कहाँ नहीं।
    when: छलाँगें, चालें, अदला-बदली, “एक छोड़कर एक”, “क्या ऐसा निकल सकता है”।
    task: >-
      एक टिड्डा संख्या रेखा पर शून्य पर बैठा है। हर छलाँग उसे ठीक 1 बाईं या
      दाईं ओर ले जाती है। क्या 5 छलाँगों के बाद वह फिर से शून्य पर हो सकता है?
    steps:
      - "खानों को बारी-बारी से रंगते हैं: सम और विषम।"
      - "हर छलाँग रंग बदल देती है: सम खाने से विषम पर, और फिर वापस।"
      - 5 छलाँगों के बाद, यानी विषम संख्या के बाद, टिड्डा ज़रूर किसी विषम खाने पर होगा, और शून्य सम है।
    answer: नहीं, ऐसा नहीं हो सकता।
    # The pictures hold no words: what their colours and pointers mean is said
    # under them.
    pictures:
      colours: नीले सम हैं, नारंगी विषम, और निशान शुरुआत का है
      jumps: हर छलाँग, और उसके बाद खाने का रंग
      after: 5वीं छलाँग के बाद, सिर्फ़ विषम खाने
    caption: >-
      यह देखने की ज़रूरत नहीं कि टिड्डा ठीक-ठीक कहाँ गया: उसके खाने के रंग पर
      नज़र रखना काफ़ी है।
  pigeonhole:
    name: कबूतर और खाने
    aka: कबूतरखाना सिद्धांत
    what: >-
      अगर कबूतर खानों से ज़्यादा हों, तो किसी न किसी खाने में कम से कम दो कबूतर
      होंगे। यह बात साफ़-सी लगती है, फिर भी इससे वे बातें सिद्ध होती हैं, जिन्हें
      जाँचना असंभव लगता है।
    when: “सिद्ध करो कि ज़रूर होगा”, “कम से कम दो”, “पक्के तौर पर”।
    task: >-
      पासा कितनी बार फेंकना होगा, ताकि यह पक्का हो कि कोई न कोई संख्या कम से कम
      दो बार आएगी?
    steps:
      - "पासे पर 6 संख्याएँ हैं: ये 6 “खाने” हैं। हर बार पासा फेंकना एक “कबूतर” है।"
      - "6 बार फेंकने के बाद भी सारी संख्याएँ अलग-अलग हो सकती हैं: 1, 2, 3, 4, 5, 6।"
      - "सातवीं बार फेंकने पर कोई खाली खाना नहीं बचता: कोई संख्या दूसरी बार आती है। तो 7 बार फेंकना होगा।"
    answer: 7 बार फेंकना।
    pictures:
      throw: नीला बिंदु यानी एक बार फेंकना
      seventh: 7वीं बार फेंकने पर बिंदु पहले से भरे खाने में आता है
    caption: पहली छह बार सारी संख्याएँ अलग-अलग आएँ, तब भी सातवीं बार उनमें से कोई एक संख्या दोबारा आएगी ही।
  mirror:
    name: चालों को आईने की तरह दोहराना
    aka: सममित रणनीति
    what: >-
      दो खिलाड़ियों वाले खेलों में अक्सर जीत उसी की होती है, जो सामने वाले की
      चालों को आईने की तरह दोहरा सके। तब आपके पास हमेशा जवाबी चाल रहती है, जब
      तक सामने वाले के पास कोई चाल हो।
    when: "दो खिलाड़ियों वाले खेल: “सही खेलने पर कौन जीतेगा”।"
    task: >-
      एक पट्टी में 9 खाने हैं। दो खिलाड़ी बारी-बारी से किसी ऐसे खाली खाने में गोटी
      रखते हैं, जो किसी भरे खाने के बगल में न हो। जो गोटी न रख पाए, उसकी हार।
      पहले खिलाड़ी को पहली गोटी कहाँ रखनी चाहिए, ताकि सामने वाला चाहे जैसे खेले,
      जीत उसी की हो?
    steps:
      - पहली चाल में गोटी बीच वाले, यानी पाँचवें खाने में रखते हैं।
      - "सामने वाले की हर चाल का जवाब उसकी आईने वाली चाल से देते हैं: बीच के उस पार, ठीक उलटी ओर का खाना।"
      - अगर सामने वाले का खाना खाली था और किसी गोटी के बगल में नहीं था, तो उसका आईने वाला खाना भी ऐसा ही है। इसलिए चालें पहले सामने वाले की खत्म होती हैं।
    answer: बीच में, 5वें खाने में, और फिर हर चाल को आईने की तरह दोहराना।
    # What the colours and the numbers in the strip's cells mean.
    legend:
      first: पहला खिलाड़ी
      second: सामने वाला खिलाड़ी
      moves: संख्या यानी चाल का क्रम
    pictures:
      answer: सामने वाले ने 1ला खाना लिया, जवाब में 9वाँ
      stuck: "हर खाली खाना किसी भरे खाने के बगल में है: सामने वाले की हार"
    caption: >-
      पट्टी का बीच एक ही है, और बाकी हर खाने का एक आईने वाला खाना है। इसीलिए
      पहले खिलाड़ी की चालें कभी खत्म नहीं होतीं।

