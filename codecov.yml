# What Codecov does with the coverage profile the tests upload. The profile
# itself is produced by the test run; nothing here measures anything.

coverage:
  status:
    # The whole repository may not quietly slide downwards. The allowance is
    # there because a refactor that deletes covered code moves the number a
    # little through no fault of its own.
    project:
      default:
        target: auto
        threshold: 1%
    # New and changed lines are held to a higher standard than the average of
    # everything written before them: this is the number that decides whether a
    # change arrives with the tests that prove it.
    patch:
      default:
        target: 90%

# The contract every store is held to, the stand-ins for Google's sign-in and
# for Google Drive, and the paces tests are held to, are test code that lives
# in a package rather than a test file, because a test file cannot be shared
# between packages. Like any
# test it measures rather than being measured: the lines that report a failure
# never run while the code under test behaves.
#
# The research module is a Go module of its own with checks of its own, and
# none of its tests run with the service's: until they do, its code is not
# counted, so that nothing it adds or removes moves the service's number.
ignore:
  - "internal/store/storetest"
  - "internal/infra/googleauth/googletest"
  - "internal/infra/drive/drivetest"
  - "internal/ratelimit/ratelimittest"
  - "internal/infra/starlark/starlarktest"
  - "research"

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
