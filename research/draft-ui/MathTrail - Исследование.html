  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

pace:nowrap;text-decoration:none\" style-hover=\"background:#f0f4f9;color:#1f1f1f;text-decoration:none\">О нас<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;padding:2px;border:1px solid #c4c7c5;border-radius:999px;flex:none\">\n      <a href=\"#\" style=\"min-width:40px;height:32px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#444746;text-decoration:none\">EN<\u002Fa>\n      <a href=\"#\" style=\"min-width:40px;height:32px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#041e49;background:#d3e3fd;text-decoration:none\">RU<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"Research hero\" style=\"max-width:1120px;margin:0 auto;padding:72px 24px 0\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:40px 56px;padding-bottom:40px;border-bottom:1px solid #8e9196\">\n  <div style=\"flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:28px\">\n  <h1 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:clamp(44px,5.4vw,66px);line-height:1.02;letter-spacing:-0.02em;color:#1f1f1f\">\n    <span style=\"font-weight:400;display:block\">Модель пишет,<\u002Fspan>\n    <span style=\"font-weight:700;display:block\">сервис проверяет.<\u002Fspan>\n  <\u002Fh1>\n    <p style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:clamp(19px,2vw,22px);line-height:1.45;color:#444746;max-width:30em;text-wrap:pretty\">Как MathTrail допускает до ребёнка только те задачи, в которых ни одна из десяти проверок не нашла ошибки, — и чего эти проверки не видят.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <a href=\"{{ pdfHref }}\" download=\"MathTrail-paper-a.ru.pdf\" target=\"_blank\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;background:#0b57d0;color:#fff;font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap\" style-hover=\"background:#0842a0;color:#fff;text-decoration:none;box-shadow:0 1px 3px rgba(60,64,67,.3)\">Статья целиком · PDF, 16 стр.<\u002Fa>\n      <a href=\"https://github.com/MathTrail/mathtrail-standalone\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid #747775;color:#0b57d0;font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap\" style-hover=\"background:#f0f4f9;color:#0842a0;text-decoration:none\">Код и данные<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-screen-label=\"Hero diagram\" style=\"flex:0 1 392px;min-width:min(100%,300px);background:#f1f4f7;border-radius:24px;padding:24px 16px 24px 24px\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 30px;grid-template-rows:48px auto 40px 48px auto 40px auto\">\n      <div style=\"grid-column:1;grid-row:1;background:#fff;border:1px solid #8e9196;border-bottom:0;border-radius:12px 12px 0 0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <span style=\"font-size:16px;font-weight:600\">Модель чата<\u002Fspan><span style=\"font-size:13px;color:#747775\">пишет<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:2;background:#fff;border:1px solid #8e9196;border-top:1px solid #e6e8eb;border-radius:0 0 12px 12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:12px;color:#747775\">задача<\u002Fspan><span style=\"font-size:14px;line-height:20px\">Забор длиной 12 м, столбы через каждые 3 м, включая концы. Сколько столбов?<\u002Fspan><\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:12px;color:#747775\">решатель<\u002Fspan><span style=\"font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;background:#f1f3f5;border-radius:6px;padding:5px 8px\">12 : 3 + 1 = 5 → C<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:3;display:flex;align-items:stretch;justify-content:space-between;gap:8px\">\n        <span style=\"display:flex;align-items:center;gap:10px;padding-left:28px\"><span style=\"display:flex;flex-direction:column;align-items:center;height:100%\"><span style=\"flex:1;width:1.5px;background:#747775\"><\u002Fspan><span style=\"border-top:7px solid #747775;border-left:5px solid transparent;border-right:5px solid transparent\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:#444746\">задача и решатель<\u002Fspan><\u002Fspan>\n        <span style=\"display:flex;align-items:center;font-size:13px;color:#747775;text-align:right\">отказ — обратно<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:2;grid-row:1 / 5;position:relative;margin:24px 0;width:20px;border:1.5px dashed #747775;border-left:0;border-radius:0 12px 12px 0\">\n        <span style=\"position:absolute;left:-7px;top:-5.5px;border-right:8px solid #747775;border-top:5px solid transparent;border-bottom:5px solid transparent\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:4;background:#e4ecf2;border:1.5px solid #2f5b76;border-bottom:0;border-radius:12px 12px 0 0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <span style=\"font-size:16px;font-weight:600;color:#1d3d52\">MathTrail<\u002Fspan><span style=\"font-size:13px;font-weight:500;color:#2f5b76\">проверяет<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:5;background:#e4ecf2;border:1.5px solid #2f5b76;border-top:1px solid rgba(47,91,118,.25);border-radius:0 0 12px 12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#1d3d52\"><span style=\"font-weight:600\">10 проверок<\u002Fspan><span>решатель — дважды<\u002Fspan><\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px\">\n          <sc-for list=\"{{ checkCells }}\" as=\"c\" hint-placeholder-count=\"10\">\n            <span style=\"height:22px;border-radius:5px;background:#2f5b76;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700\">✓<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-size:13px;line-height:19px;color:#1d3d52\">один верный вариант · текст по силам классу · не повтор прошлых задач<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:6;display:flex;align-items:stretch;padding-left:28px;gap:10px\">\n        <span style=\"display:flex;flex-direction:column;align-items:center\"><span style=\"flex:1;width:2px;background:#2f5b76\"><\u002Fspan><span style=\"border-top:7px solid #2f5b76;border-left:5px solid transparent;border-right:5px solid transparent\"><\u002Fspan><\u002Fspan>\n        <span style=\"display:flex;align-items:center;font-size:13px;font-weight:600;color:#2f5b76\">прошла все проверки<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1;grid-row:7;background:#fff;border:1px solid #8e9196;border-radius:12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font-size:16px;font-weight:600\">Ребёнок<\u002Fspan><span style=\"font-size:13px;color:#747775\">решает<\u002Fspan><\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px\">\n          <sc-for list=\"{{ heroOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <span style=\"border:1px solid #b5b9be;border-radius:6px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px\"><span style=\"font-size:10px;color:#747775\">{{ o.l }}<\u002Fspan><span style=\"font-size:15px\">{{ o.v }}<\u002Fspan><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"align-self:flex-start;background:#f1f3f5;border-radius:999px;padding:3px 10px;font-size:12px;color:#444746\">ответ запечатан до ответа ребёнка<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px 28px;padding:16px 0;font-family:Onest,system-ui,sans-serif;font-size:17px;color:#444746\">\n    <span><span style=\"color:#1f1f1f;font-weight:600\">603<\u002Fspan> эталонные задачи<\u002Fspan>\n    <span><span style=\"color:#1f1f1f;font-weight:600\">10<\u002Fspan> проверок<\u002Fspan>\n    <span><span style=\"color:#1f1f1f;font-weight:600\">17<\u002Fspan> тем<\u002Fspan>\n    <span><span style=\"color:#1f1f1f;font-weight:600\">20<\u002Fspan> ловушек<\u002Fspan>\n    <span>1–6 класс<\u002Fspan>\n    <span>открытый код, MIT<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Theses\" style=\"max-width:1120px;margin:0 auto;padding:48px 24px 0\">\n  <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);border-bottom:1px solid #d5d8dc;padding:32px 0\">\n    <span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;color:#747775;padding-top:4px\">01<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px 56px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:600\">Пишет модель чата<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:27px;color:#444746;text-wrap:pretty\">Каждую задачу пишет модель того чата, в котором вы уже работаете, — на языке ребёнка и в близком ему сюжете. Сам MathTrail моделей не вызывает: это небольшой детерминированный сервис, который ничего не хранит между запросами.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap\">\n        <span style=\"display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #8e9196;border-radius:6px;padding:12px 16px;min-width:116px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:18px\">Модель чата<\u002Fspan><span style=\"font-family:Onest,system-ui,sans-serif;font-size:15px;color:#747775\">пишет<\u002Fspan><\u002Fspan>\n        <span style=\"color:#747775;font-size:18px\">⟶<\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid #2f5b76;background:#e4ecf2;border-radius:6px;padding:12px 16px;min-width:116px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:18px;font-weight:600;color:#1d3d52\">MathTrail<\u002Fspan><span style=\"font-family:Onest,system-ui,sans-serif;font-size:15px;color:#2f5b76\">проверяет<\u002Fspan><\u002Fspan>\n        <span style=\"color:#747775;font-size:18px\">⟶<\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #8e9196;border-radius:6px;padding:12px 16px;min-width:116px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:18px\">Ребёнок<\u002Fspan><span style=\"font-family:Onest,system-ui,sans-serif;font-size:15px;color:#747775\">решает<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);border-bottom:1px solid #d5d8dc;padding:32px 0\">\n    <span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;color:#747775;padding-top:4px\">02<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px 56px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:600\">Решатель запускается дважды<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:27px;color:#444746;text-wrap:pretty\">Вместе с задачей модель пишет короткую программу, которая вычисляет ответ и называет букву верного варианта. Сервис запускает её, сдвигает буквы на две — A становится C — и запускает снова. Программа, которая честно считает, найдёт ответ на новом месте; та, что вписала букву вручную, — нет.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;font-family:Onest,system-ui,sans-serif\">\n        <div style=\"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap\">\n          <span style=\"width:96px;font-size:14px;line-height:18px;color:#747775;padding-bottom:10px;font-family:Onest,system-ui,sans-serif\">1-й запуск<\u002Fspan>\n          <span style=\"display:grid;grid-template-columns:repeat(5,44px);gap:4px\">\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">A<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">3<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">B<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">4<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#2f5b76;font-weight:700;font-family:Onest,system-ui,sans-serif\">C<\u002Fspan><span style=\"width:44px;height:38px;background:#2f5b76;border:1px solid #2f5b76;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600\">5<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">D<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">6<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">E<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">12<\u002Fspan><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:18px;color:#2f5b76;padding-bottom:8px\">→ C<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap\">\n          <span style=\"width:96px;font-size:14px;line-height:18px;color:#747775;padding-bottom:2px;font-family:Onest,system-ui,sans-serif\">2-й запуск, буквы сдвинуты<\u002Fspan>\n          <span style=\"display:grid;grid-template-columns:repeat(5,44px);gap:4px\">\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">A<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">6<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">B<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">12<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">C<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">3<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#747775;font-family:Onest,system-ui,sans-serif\">D<\u002Fspan><span style=\"width:44px;height:38px;border:1px solid #b5b9be;display:flex;align-items:center;justify-content:center;font-size:18px\">4<\u002Fspan><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"font-size:12px;color:#2f5b76;font-weight:700;font-family:Onest,system-ui,sans-serif\">E<\u002Fspan><span style=\"width:44px;height:38px;background:#2f5b76;border:1px solid #2f5b76;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600\">5<\u002Fspan><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:18px;color:#2f5b76;padding-bottom:8px\">→ E<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:15px;line-height:22px;color:#444746;font-family:Onest,system-ui,sans-serif;max-width:400px\">Программа, вписавшая «C», во втором запуске укажет на 3 — и задача будет отвергнута.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);border-bottom:1px solid #d5d8dc;padding:32px 0\">\n    <span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;color:#747775;padding-top:4px\">03<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px 56px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:600\">Ответ запечатан<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:27px;color:#444746;text-wrap:pretty\">Ответ, решение, объяснения и решатель шифруются и лежат в профиле ребёнка на Google Диске родителя. Пока ребёнок не ответил, их нет ни в карточке задачи, ни в логах сервиса.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid #b5b9be\">\n          <div style=\"background:#f1f3f5;padding:18px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #b5b9be\">\n            <span style=\"font-size:13px;color:#747775\">Видит ребёнок<\u002Fspan>\n            <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:24px\">вопрос · рисунок · варианты · подсказка<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#2f5b76;color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:13px;color:#d4e1ea\">Запечатано до ответа<\u002Fspan>\n            <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:24px\">ответ · решение · объяснения<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;color:#747775\">XChaCha20-Poly1305 · привязано к ребёнку и задаче<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);border-bottom:1px solid #8e9196;padding:32px 0\">\n    <span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;color:#747775;padding-top:4px\">04<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px 56px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <h2 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:600\">Чуть сложнее — но посильно<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:27px;color:#444746;text-wrap:pretty\">Модель ученика предсказывает, с какой вероятностью ребёнок решит задачу, и сервис заказывает ту, где этот шанс ближе всего к 77,5 % — середине коридора 70–85 %. Новый ребёнок сначала проходит пробную серию из пяти задач — так находится его стартовый уровень.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:Onest,system-ui,sans-serif;font-size:clamp(20px,2.4vw,26px);white-space:nowrap;overflow-x:auto\">P = c + (1 − c) · σ(θ + δ<sub style=\"font-size:.6em\">t<\u002Fsub> − β)<\u002Fdiv>\n        <div style=\"position:relative;height:56px\">\n          <div style=\"position:absolute;left:0;right:0;top:8px;height:16px;background:#e6e8eb\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;width:20%;top:8px;height:16px;background:repeating-linear-gradient(135deg,#c9ccd1 0 3px,transparent 3px 7px)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:70%;width:15%;top:8px;height:16px;background:#2f5b76\"><\u002Fdiv>\n          <span style=\"position:absolute;left:0;top:30px;font-size:13px;color:#747775\">0<\u002Fspan>\n          <span style=\"position:absolute;left:20%;top:30px;transform:translateX(-50%);font-size:13px;color:#747775\">0,2<\u002Fspan>\n          <span style=\"position:absolute;left:70%;top:30px;transform:translateX(-50%);font-size:13px;color:#2f5b76;font-weight:600\">0,70<\u002Fspan>\n          <span style=\"position:absolute;left:85%;top:30px;transform:translateX(-50%);font-size:13px;color:#2f5b76;font-weight:600\">0,85<\u002Fspan>\n          <span style=\"position:absolute;right:0;top:30px;font-size:13px;color:#747775\">1<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:#444746\">\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;background:repeating-linear-gradient(135deg,#9aa0a6 0 2px,transparent 2px 5px)\"><\u002Fspan>c = 0,2 — угадать один из пяти<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;background:#2f5b76\"><\u002Fspan>целевой коридор<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showStudentModel }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"student-model\" data-screen-label=\"Student model dashboard\" style=\"max-width:1120px;margin:0 auto;padding:88px 24px 0\">\n  <h2 style=\"margin:0;font-size:clamp(32px,4vw,44px);line-height:1.12;font-weight:500;letter-spacing:-0.025em\">Модель ученика: цифры и цели<\u002Fh2>\n  <p style=\"margin:12px 0 0;font-size:17px;line-height:27px;color:#444746;max-width:46em;text-wrap:pretty\">Как близко сервис следует за ребёнком, держит ли задачи посильными, насколько уверенно объявляет тему освоенной и что ребёнок видит в конце серии. Числа — со стенда симулированных детей, посчитаны по коду, из которого собран сайт.<\u002Fp>\n  <div style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:6px 20px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;color:#444746\">\n    <span>коммит 66680ac · 6 октября 2026<\u002Fspan><span>1000 детей × 200 ответов<\u002Fspan><span>зерно 20261001<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top:28px;overflow-x:auto\">\n    <div style=\"min-width:680px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 22px;padding-bottom:14px;border-bottom:1px solid #8e9196;font-size:13px;color:#444746\">\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:12px;background:#2f5b76\"><\u002Fspan>сервис сейчас<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:12px;background:#1d3d52;opacity:.3\"><\u002Fspan>95 % интервал<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:0;height:14px;border-left:1.5px dashed #1f1f1f\"><\u002Fspan>цель<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:0;height:14px;border-left:1.5px dotted #2f5b76\"><\u002Fspan>потолок — оценка, которая знает уровень ребёнка<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:28px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:1px solid #8e9196\">\n        <span style=\"font-size:15px;font-weight:600;color:#2f5b76\">Как оценка следует за ребёнком<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 120px;gap:24px;align-items:center;padding:16px 0;border-bottom:1px solid #d5d8dc\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:17px;line-height:23px;font-weight:600\">Отставание от ребёнка, который учится<\u002Fspan>\n          <span style=\"font-size:13px;line-height:19px;color:#747775\">логит, меньше — лучше · лучшее возможное — 0<\u002Fspan>\n          <span style=\"align-self:flex-start;margin-top:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#e6e8eb;color:#444746\">Планка<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding:8px 0 24px\">\n          <span style=\"position:absolute;left:24%;top:0;bottom:18px;border-left:1.5px dashed #1f1f1f;z-index:1\"><\u002Fspan><span style=\"position:absolute;left:24%;bottom:0;padding-left:6px;font-size:12px;font-weight:600;white-space:nowrap\">цель ≤ 0,24<\u002Fspan>\n          <div style=\"position:relative;height:22px;background:#e6e8eb\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:54%;background:#2f5b76\"><\u002Fdiv>\n            <div style=\"position:absolute;left:52%;width:4%;top:-4px;bottom:-4px;background:#1d3d52;opacity:.3\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right\">\n          <span style=\"font-size:26px;line-height:1;font-weight:500;letter-spacing:-0.01em;white-space:nowrap\">0,54<\u002Fspan>\n          <span style=\"font-size:12px;color:#747775;white-space:nowrap\">0,52–0,56<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 120px;gap:24px;align-items:center;padding:16px 0;border-bottom:1px solid #d5d8dc\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:17px;line-height:23px;font-weight:600\">Задачи в коридоре 70–85 %<\u002Fspan>\n          <span style=\"font-size:13px;line-height:19px;color:#747775\">ребёнок учится · доля задач, больше — лучше<\u002Fspan>\n          <span style=\"align-self:flex-start;margin-top:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#e6e8eb;color:#444746\">Планка<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;padding:8px 0 24px\">\n          <span style=\"position:absolute;left:43.9%;top:0;bottom:18px;border-left:1.5px dashed #1f1f1f;z-index:1\"><\u002Fspan><span style=\"position:absolute;left:43.9%;bottom:0;transform:translateX(-100%);padding-right:6px;font-size:12px;font-weight:600;white-space:nowrap\">цель ≥ 43,9 %<\u002Fspan><span style=\"position:absolute;left:61.1%;top:0;bottom:18px;border-left:1.5px dotted #2f5b76\"><\u002Fspan><span style=\"position:absolute;left:61.1%;bottom:0;padding-left:6px;font-size:12px;color:#2f5b76;white-space:nowrap\">потолок 61,1 %<\u002Fspan>\n          <div style=\"position:relative;height:22px;background:#e6e8eb\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:37.5%;background:#2f5b76\"><\u002Fdiv>\n            <div st acing:-0.01em;white-space:nowrap\">42,8 %<\u002Fspan>\n          <span style=\"font-size:12px;color:#747775;white-space:nowrap\">42,3–43,3 %<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 32px;font-size:14px;line-height:21px;color:#444746\">\n    <span style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"align-self:flex-start;margin-top:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#c4eed0;color:#0a3818\">Достигнута<\u002Fspan>Весь интервал — по лучшую сторону цели.<\u002Fspan>\n    <span style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"align-self:flex-start;margin-top:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#ffdad6;color:#8c1d18\">Не достигнута<\u002Fspan>Весь интервал — по худшую сторону цели.<\u002Fspan>\n    <span style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"align-self:flex-start;margin-top:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#e6e8eb;color:#444746\">Планка<\u002Fspan>Цель выведена из числа самого сервиса: это ориентир для следующего правила, а не проверка нынешнего.<\u002Fspan>\n  <\u002Fdiv>\n  \n\n  <div style=\"margin-top:56px;display:flex;flex-direction:column;gap:8px\">\n    <h3 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:26px;line-height:1.2;font-weight:600\">Живые данные<\u002Fh3>\n    <p style=\"margin:0;font-size:16px;line-height:25px;color:#444746;max-width:46em\">Сбываются ли обещания модели у настоящих детей — месяц за месяцем, по журналу ответов, без имён и текстов задач.<\u002Fp>\n    <span style=\"align-self:flex-start;margin-top:4px;background:#fef7e0;color:#5c3c00;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600\">Пример: смоделированные данные<\u002Fspan>\n  <\u002Fdiv>\n eight:16px;background:#f1f3f5\"><span style=\"position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid #8e9196\"><\u002Fspan><span style=\"position:absolute;right:50%;top:0;bottom:0;width:15.0%;background:#2f5b76\"><\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;font-family:Onest,system-ui,sans-serif;font-size:18px;color:#1f1f1f\">−0,03<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) 60px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e6e8eb;font-size:14px\">\n          <span style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"color:#1f1f1f;font-weight:600\">21–50<\u002Fspan><span style=\"font-size:12px;color:#747775\">375 отв.<\u002Fspan><\u002Fspan>\n          <span style=\"position:relative;height:16px;background:#f1f3f5\"><span style=\"position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid #8e9196\"><\u002Fspan><span style=\"position:absolute;right:50%;top:0;bottom:0;width:25.0%;background:#2f5b76\"><\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;font-family:Onest,system-ui,sans-serif;font-size:18px;color:#1f1f1f\">−0,05<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) 60px;gap:12px;align-items:center;padding:10px 0;font-size:14px\">\n          <span style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"color:#1f1f1f;font-weight:600\">51 и больше<\u002Fspan><span style=\"font-size:12px;color:#747775\">205 отв.<\u002Fspan><\u002Fspan>\n          <span style=\"position:relative;height:16px;background:#f1f3f5\"><span style=\"position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid #8e9196\"><\u002Fspan><span style=\"position:absolute;right:50%;top:0;bottom:0;width:35.0%;background:#2f5b76\"><\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;font-family:Onest,system-ui,sans-serif;font-size:18px;color:#1f1f1f\">−0,07<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:14px;line-height:21px;color:#444746\">Разница растёт с числом ответов — оценка отстаёт от ребёнка, который учится.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #8e9196;padding-top:18px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:18px;font-weight:600\">Доля верных на задачах правила<\u002Fspan>\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:44px;line-height:1;color:#2f5b76\">0,74<\u002Fspan><span style=\"font-size:14px;color:#444746\">ожидаем ≈ 0,775 — середину коридора<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;height:16px;background:#e6e8eb;margin-top:4px\">\n        <span style=\"position:absolute;left:70%;width:15%;top:0;bottom:0;background:rgba(47,91,118,.25)\"><\u002Fspan>\n        <span style=\"position:absolute;left:77.5%;top:-6px;bottom:-6px;border-left:1.5px dashed #1f1f1f\"><\u002Fspan>\n        <span style=\"position:absolute;left:74%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2f5b76;border:2px solid #fff;box-shadow:0 0 0 1px #2f5b76\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#747775\"><span>0<\u002Fspan><span>1<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:14px;line-height:21px;color:#444746\">1 290 ответов на задачи, выбранные правилом, за сентябрь 2026.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"sources\" data-screen-label=\"Sources\" style=\"max-width:1120px;margin:0 auto;padding:88px 24px 0\">\n  <h2 style=\"margin:0;font-family:Onest,system-ui,sans-serif;font-size:clamp(32px,4vw,44px);line-height:1.12;font-weight:500;letter-spacing:-0.025em\">Откуда взялись эталонные задачи<\u002Fh2>\n  <p style=\"margin:12px 0 0;font-size:17px;line-height:27px;color:#444746;max-width:44em;text-wrap:pretty\">Идеи не охраняются авторским правом, а текст охраняется. Поэтому из книги берётся только идея задачи и ответ, а формулировку, сюжет, варианты и ловушки пишем заново.<\u002Fp>\n\n\n  <div style=\"margin-top:40px;border-top:1px solid #8e9196\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 40px;align-items:baseline;padding:22px 0;border-bottom:1px solid #d5d8dc\">\n      <span style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Я. И. Перельман<\u002Fspan><span style=\"font-size:14px;color:#747775\">† 1942<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:26px;color:#444746\">«Первая сотня головоломок», «Вторая сотня головоломок», «Живая математика», «Занимательная арифметика», «Быстрый счёт»<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 40px;align-items:baseline;padding:22px 0;border-bottom:1px solid #d5d8dc\">\n      <span style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Е. И. Игнатьев<\u002Fspan><span style=\"font-size:14px;color:#747775\">† 1923<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:26px;color:#444746\">«В царстве смекалки», 1908<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 40px;align-items:baseline;padding:22px 0;border-bottom:1px solid #d5d8dc\">\n      <span style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Генри Э. Дьюдени<\u002Fspan><span style=\"font-size:14px;color:#747775\">† 1930<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:26px;color:#444746\">Amusements in Mathematics, The Canterbury Puzzles<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 40px;align-items:baseline;padding:22px 0;border-bottom:1px solid #d5d8dc\">\n      <span style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Сэм Лойд<\u002Fspan><span style=\"font-size:14px;color:#747775\">† 1911<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:26px;color:#444746\">Cyclopedia of Puzzles<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 40px;align-items:baseline;padding:22px 0;border-bottom:1px solid #8e9196\">\n      <span style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Льюис Кэрролл<\u002Fspan><span style=\"font-size:14px;color:#747775\">† 1898<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:26px;color:#444746\">A Tangled Tale, Pillow Problems<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px\">\n    <span style=\"background:#e4ecf2;color:#1d3d52;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600\">Общественное достояние<\u002Fspan>\n    <span style=\"font-size:15px;line-height:23px;color:#444746;max-width:44em\">Срок охраны авторских прав на эти книги истёк — они принадлежат всем, и пользоваться ими можно бесплатно.<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:56px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px\">\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:22px;font-weight:600\">Итог — 603 эталонные задачи<\u002Fspan>\n      <span style=\"font-size:14px;color:#747775\">у каждой — решатель и ловушка за каждым неверным вариантом<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;height:48px;font-size:15px;font-weight:600\">\n      <div style=\"flex:200 1 0;background:#d9dce0;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden\">200 <span style=\"font-weight:400\">· 1–2 класс<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:250 1 0;background:#9db3c3;color:#0f2533;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden\">250 <span style=\"font-weight:400\">· 3–4 класс<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:153 1 0;background:#2f5b76;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden\">153 <span style=\"font-weight:400\">· 5–6 класс<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-size:14px;line-height:22px;color:#747775;max-width:52em\">Ориентир стиля — советские сборники. У эталонных задач нет поля «источник», поэтому автора идеи конкретной задачи указать нельзя.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1120px;margin:0 auto;padding:88px 24px 0\">\n  <div style=\"border-top:1px solid #8e9196;border-bottom:1px solid #8e9196;padding:36px 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;max-width:640px\">\n      <span style=\"font-family:Onest,system-ui,sans-serif;font-size:clamp(24px,3vw,30px);line-height:1.2;font-weight:600\">Статья целиком<\u002Fspan>\n      <span style=\"font-size:16px;line-height:25px;color:#444746\">Методы, таблицы, протоколы, ограничения и этика — 16 страниц.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <a href=\"{{ pdfHref }}\" download=\"MathTrail-paper-a.ru.pdf\" target=\"_blank\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#0b57d0;color:#fff;font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap\" style-hover=\"background:#0842a0;color:#fff;text-decoration:none;box-shadow:0 1px 3px rgba(60,64,67,.3)\">Открыть PDF<\u002Fa>\n      <a href=\"https://github.com/MathTrail/mathtrail-standalone\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid #747775;color:#0b57d0;font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap\" style-hover=\"background:#f0f4f9;color:#0842a0;text-decoration:none\">Код на GitHub<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width:1200px;margin:0 auto;padding:48px 24px 64px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n  <a href=\"MathTrail%20White.dc.html\" style=\"display:flex;align-items:center;gap:10px;color:#1f1f1f;text-decoration:none\"><img src=\"e60b406c-ea30-49b2-9996-f40bc3c805c9\" alt=\"\" style=\"width:24px;height:24px;display:block\"><span style=\"font-size:18px;font-weight:600\">MathTrail<\u002Fspan><\u002Fa>\n  <nav style=\"display:flex;flex-wrap:wrap;gap:8px 24px;font-size:15px\">\n    <a href=\"Research.dc.html\" style=\"color:#1f1f1f;font-weight:500\">Исследование<\u002Fa>\n    <a href=\"About.dc.html\" style=\"color:#444746\">О нас<\u002Fa>\n    <a href=\"#\" style=\"color:#444746\">Политика конфиденциальности<\u002Fa>\n    <a href=\"#\" style=\"color:#444746\">Условия использования<\u002Fa>\n    <a href=\"https://github.com/MathTrail/mathtrail-standalone\" style=\"color:#444746\">GitHub<\u002Fa>\n  <\u002Fnav>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStudentModel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showStudentModel: this.props.showStudentModel ?? true,\n      pdfHref: (window.__resources && window.__resources.paperPdf) || 'assets/paper-a.ru.pdf',\n      checkCells: Array.from({ length: 10 }, (_, i) => i),\n      heroOpts: [['A', '3'], ['B', '4'], ['C', '5'], ['D', '6'], ['E', '12']].map(([l, v]) => ({ l, v }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
