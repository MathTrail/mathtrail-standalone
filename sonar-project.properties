# What the static analysis is told about this project. It describes the shape of
# the repository and nothing else: the coverage reports named at the end are
# produced by the test runs, not by the scanner.

sonar.projectKey=MathTrail_mathtrail-standalone
sonar.organization=mathtrail

sonar.sources=.
sonar.tests=.
# Tests are the files Go and Vitest run as tests, the contract every store is
# held to, the stand-ins for Google's sign-in and for Google Drive, and the host
# the widget's tests talk to: test code that lives beside the code rather than
# in a test file, because a test file cannot be shared. Like any test it
# measures and is not measured.
sonar.test.inclusions=**/*_test.go,internal/store/storetest/**,internal/infra/starlark/starlarktest/**,internal/infra/googleauth/googletest/**,internal/infra/drive/drivetest/**,web/**/*.test.ts,web/**/*.test.tsx,web/src/**/testing/**

# Reference vectors, the rendered site, generated mocks and the design draft with
# its bundled React: none of it is code anybody here writes, and all of it would
# be measured as if it were. The research module and the load tool have checks
# of their own and are not part of the product's quality gate.
sonar.exclusions=testdata/**,site/dist/**,**/mocks/**,research/**,tools/**,draft/**
sonar.test.exclusions=research/**,tools/**
# The widget's entry point only finds the page's root and starts the widget,
# and what it starts is what the tests cover. The build's configurations are
# declarations: the build test and every run of the tests are what load them.
# The preview is a page for looking at the widget: it ships nowhere and is
# judged by eye.
sonar.coverage.exclusions=web/src/widget/main.ts,web/*.config.ts,web/src/preview/**

# "Hardcoded IP address" is a warning against an address a program connects to.
# The blocks in the fetch of a client's document are the opposite: the networks
# a fetch refuses to reach, fixed by the RFCs that reserve them, and moving them
# into configuration would only make the guard easier to switch off.
sonar.issue.ignore.multicriteria=ip,drawing,drawingfocus
sonar.issue.ignore.multicriteria.ip.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.ip.resourceKey=internal/infra/cimd/address.go
# "Prefer an <img> element to the img role" is advice for pictures an <img>
# can hold. A task's text drawing is a picture made of characters, and the
# role is what keeps a screen reader from reading it out character by
# character.
sonar.issue.ignore.multicriteria.drawing.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.drawing.resourceKey=web/src/design/blocks.tsx
# "tabIndex only on interactive elements" does not know a frame that scrolls:
# a drawing wider than the card scrolls sideways inside its own frame, and a
# keyboard has to reach the frame to scroll it. The rule is Biome's too, and
# Biome holds every other line of the file to it: only the drawing's is let
# through, by a comment on that line.
sonar.issue.ignore.multicriteria.drawingfocus.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.drawingfocus.resourceKey=web/src/design/blocks.tsx

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
