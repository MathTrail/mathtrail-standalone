# What the static analysis is told about this project. It describes the shape of
# the repository and nothing else: the coverage reports named at the end are
# produced by the test runs, not by the scanner.

sonar.projectKey=MathTrail_mathtrail-standalone
sonar.organization=mathtrail

sonar.sources=.
sonar.tests=.
# Tests are the files Go and Vitest run as tests, the contract every store is
# held to, the stand-ins for Google's sign-in and for Google Drive, the paces
# tests are held to, the watch on the solver's slots, the database of countries
# tests look addresses up in, and the host the widget's tests talk to: test code
# that lives beside the code rather than in a test file, because a test file
# cannot be shared. So is the program a test builds to read back what the
# linker set. So are the measure of the widget's layout, the pictures of the
# README and of Claude's directory, the directories' icons and the measure of
# the width the site's menu folds at, which run in real browsers rather than in
# Vitest, and the driving of the preview they share.
# Like any test they measure and are not measured.
sonar.test.inclusions=**/*_test.go,internal/store/storetest/**,internal/infra/starlark/starlarktest/**,internal/infra/googleauth/googletest/**,internal/infra/drive/drivetest/**,internal/ratelimit/ratelimittest/**,internal/infra/geoip/geoiptest/**,internal/version/testdata/**,web/**/*.test.ts,web/**/*.test.tsx,web/src/**/testing/**,web/tools/**/testing/**,web/scripts/drive.ts,web/scripts/fold.ts,web/scripts/icons.ts,web/scripts/layout.ts,web/scripts/listing.ts,web/scripts/screens.ts

# Reference vectors, the rendered site, generated mocks, and the pages a design
# tool exported with their bundled React: the coach's prototype, the research
# page's draft and the author's drafts, which come and go as each is ported.
# None of it is code anybody here writes, and all of it would be measured as if
# it were. The load tool and the learners' bench have checks of their own and
# are not part of the product's quality gate; the research module is, but for
# the design draft of its page.
sonar.exclusions=testdata/**,site/dist/**,site/assets/coach-prototype.html,**/mocks/**,tools/**,draft/**,research/draft-ui/**
sonar.test.exclusions=tools/**
# The widget's entry point only finds the page's root and starts the widget,
# and what it starts is what the tests cover. The build's configurations are
# declarations: the build test and every run of the tests are what load them.
# The preview is a page for looking at the widget: it ships nowhere and is
# judged by eye.
sonar.coverage.exclusions=web/src/widget/main.ts,web/src/demo/main.tsx,web/*.config.ts,web/vite.config.*.ts,web/src/preview/**

# "Hardcoded IP address" is a warning against an address a program connects to.
# The blocks in the fetch of a client's document are the opposite: the networks
# a fetch refuses to reach, fixed by the RFCs that reserve them, and moving them
# into configuration would only make the guard easier to switch off.
sonar.issue.ignore.multicriteria=ip,testaddresses,fuzzargs,sqlnames,sqlempty,picture,tablefocus,topicrow,menugroup,panelescape,chatlines,thumbshapes,numbertiles,logcuts,sumterms,ogpages,photodraws,siteout,sitecheckdir,cardscope,sitemapnames,sitemarkers,doiaddresses,loopback,sheetloads,releasetag,locale
sonar.issue.ignore.multicriteria.ip.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.ip.resourceKey=internal/infra/cimd/address.go
# The same warning on the database of countries tests read: its addresses are
# of the documentation and private ranges the database is written with, and
# nothing connects to them.
sonar.issue.ignore.multicriteria.testaddresses.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.testaddresses.resourceKey=internal/infra/geoip/geoiptest/geoiptest.go
# "Too many parameters" on a fuzz target: the fuzzer mutates each parameter on
# its own, so every field of an edit is a parameter of its own, and folding
# them into fewer would leave the fuzzer fewer things to vary.
sonar.issue.ignore.multicriteria.fuzzargs.ruleKey=go:S107
sonar.issue.ignore.multicriteria.fuzzargs.resourceKey=internal/domain/profile/edit_test.go
# "Define a constant instead of duplicating this literal" is advice for
# PL/SQL, read into BigQuery's SQL. The literals repeated in the counts are the
# names of the log's events and the word a missing value is counted under: in
# place, each condition reads as what it counts, where a variable would hide it
# behind a name of its own.
sonar.issue.ignore.multicriteria.sqlnames.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqlnames.resourceKey=infra/analytics/**/*.sql
# "Use IS NULL instead of comparing with NULL" takes '' for NULL, as Oracle
# stores it. In BigQuery '' is an empty string: the nightly counts read a value
# a line lacks as '', and leave such lines out by comparing with it. The other
# queries compare with no '', so the rule still reads them for a comparison
# with NULL itself.
sonar.issue.ignore.multicriteria.sqlempty.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.sqlempty.resourceKey=infra/analytics/nightly.sql
# "Prefer an <img> element to the img role" is advice for pictures an <img>
# can hold. A task's picture is drawn in the page as SVG, in the colours of
# the card's theme, which an <img> would not take; the role is what tells a
# screen reader it is one picture, named by its label, rather than its shapes
# and words one by one.
sonar.issue.ignore.multicriteria.picture.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.picture.resourceKey=web/src/design/picture/diagram.tsx
# The same rule on the site's frame for a table: a table wider than a phone
# scrolls sideways inside its own frame, and a keyboard has to reach the frame
# to scroll it. Sonar lets a rule through for a whole file or not at all, so
# the file is let through here; Biome holds every other line of it to the
# rule, and lets the frame's through by a comment on that line.
sonar.issue.ignore.multicriteria.tablefocus.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.tablefocus.resourceKey=web/src/site/TableFrame.tsx
# "Prefer <fieldset> to the group role" on the card's rows of topics: a
# fieldset lays its legend out above its content, and a row on a wide card has
# its name in a column beside its topics. Biome lets the row through by a
# comment on that line, and holds the rest of the file to the rule.
sonar.issue.ignore.multicriteria.topicrow.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.topicrow.resourceKey=web/src/widget/TopicChoice.tsx
# The same rule on the group of the site's menu that holds the technical
# pages together: a fieldset groups a form's controls and draws its legend
# above them, and these are links in the menu's row. Biome lets the group
# through by a comment on that line, and holds the rest of the file to the
# rule.
sonar.issue.ignore.multicriteria.menugroup.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.menugroup.resourceKey=web/src/site/Header.tsx
# "Non-interactive elements should not listen to the keyboard" on the card's
# panel of topics: Escape closes the panel from whichever of its buttons has
# the focus, and a key a button does not use rises to the panel, which is the
# one place that sees them all.
sonar.issue.ignore.multicriteria.panelescape.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.panelescape.resourceKey=web/src/widget/TopicChoice.tsx
# "Do not use an array index in keys" on the site's illustrated chats, and on
# the drawings of its topics where the same value comes more than once: the
# shapes of a thumb, the digits of a number, the logs of a pile and the
# numbers of a sum. Each is a fixed list, drawn once into the page's HTML and
# never reordered, added to or taken from, which is the one case where an
# index names its element for good; and where two elements are alike, their
# place is all that tells them apart. Sonar marks a file whole, and the whole
# file is such a case: everything in these files is drawn into the site's
# pages when the site is built, and no browser draws it again, so no key of
# theirs is ever compared with another. A drawing moved where a browser draws
# it, as the home page's demo draws its cards, takes its file out of the mark.
sonar.issue.ignore.multicriteria.chatlines.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.chatlines.resourceKey=web/src/site/Chat.tsx
sonar.issue.ignore.multicriteria.thumbshapes.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.thumbshapes.resourceKey=web/src/site/TopicThumbs.tsx
sonar.issue.ignore.multicriteria.numbertiles.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.numbertiles.resourceKey=web/src/site/art/enumeration.tsx
sonar.issue.ignore.multicriteria.logcuts.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.logcuts.resourceKey=web/src/site/art/gaps-and-boundaries.tsx
sonar.issue.ignore.multicriteria.sumterms.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.sumterms.resourceKey=web/src/site/art/parity-and-alternation.tsx
# "Unexpected await inside a loop" on the photographs of the home page: one
# browser page opens the page of each language in turn, and the next can only
# open once the last is photographed.
sonar.issue.ignore.multicriteria.ogpages.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.ogpages.resourceKey=web/scripts/og.ts
# The same rule on the family's photographs of the page "About": one browser
# page draws them in turn, so that one original at full size is in memory and
# in the page at a time. Drawn at once, all of them would be, and the page
# would still draw and encode them one by one on its single thread.
sonar.issue.ignore.multicriteria.photodraws.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.photodraws.resourceKey=web/scripts/photos.ts
# "Path traversal through a command line a model supplied" reads the build of
# the site as a tool a model drives. Its command line is written in the
# repository's own recipes, and the build refuses to replace a directory that
# holds anything but an earlier build of the site.
sonar.issue.ignore.multicriteria.siteout.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.siteout.resourceKey=web/scripts/prerender-site.ts
# The same warning on the site's checker: its command line is written in the
# repository's own recipes too, and it only reads the directory it is pointed
# at, writing nothing anywhere.
sonar.issue.ignore.multicriteria.sitecheckdir.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.sitecheckdir.resourceKey=web/tools/sitecheck/check.ts
# The same warning on the check of whether a change touches the cards: it
# appends one line, card=true or card=false, to the file its command line
# names, so that the answer stays apart from whatever the build prints, and
# writes nothing else anywhere. Writing where it is told is what the option
# is for.
sonar.issue.ignore.multicriteria.cardscope.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.cardscope.resourceKey=web/scripts/scope.ts
# "Using http is insecure" is a warning against an address a program fetches.
# The sitemap's vocabularies are names that nothing fetches, the protocol
# spells them with http, and a crawler compares them as written.
sonar.issue.ignore.multicriteria.sitemapnames.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.sitemapnames.resourceKey=web/src/site/metadata.ts
# The site's checker searches a stylesheet for "http://" and "https://": they
# are what it looks for, the sign of a load from another origin, and nothing
# fetches them.
sonar.issue.ignore.multicriteria.sitemarkers.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.sitemarkers.resourceKey=web/tools/sitecheck/check.ts
# The same warning on the forms a person may write a work's identifier in for
# the research's check of citations: an address of doi.org or arxiv.org, with
# either scheme, is read for the identifier it holds and never fetched. The
# file holds that reading alone; the addresses the check fetches are elsewhere.
sonar.issue.ignore.multicriteria.doiaddresses.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.doiaddresses.resourceKey=research/tools/citecheck/identifier.go
# The same warning on the endpoint the research's check of isolation serves a
# command-line client: it listens on the loopback interface alone, so nothing
# sent to it leaves the machine, and the client could only reach it over TLS
# if it were made to trust a certificate of the check's own.
sonar.issue.ignore.multicriteria.loopback.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.loopback.resourceKey=research/tools/isolation/main.go
# "Simplify this regular expression" counts the alternatives of the one that
# reads what a stylesheet loads. Its two forms, url() and @import, are one
# expression on purpose: matched in one pass, a url() written inside an
# @import's string is never read as a second load, which two expressions
# would need code of their own to prevent.
sonar.issue.ignore.multicriteria.sheetloads.ruleKey=typescript:S5843
sonar.issue.ignore.multicriteria.sheetloads.resourceKey=web/tools/sitecheck/stylesheet.ts
# "Code from a fork checked out with the rights of this repository" on the jobs
# that photograph a release for the README and publish the pictures. They need
# the release job, which runs only on a commit of this repository's own, and
# check out the tag that job put on that commit. The mark covers the whole
# file, so a job added to it that checks out code needs the release job as
# well, or repeats its condition.
sonar.issue.ignore.multicriteria.releasetag.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.releasetag.resourceKey=.github/workflows/release.yml
# "Name a local variable in lower case" on the locale a function of the
# product's facts sets for itself: LC_ALL is the name the shell reads its
# locale from, and in the C locale it lists the files Terraform reads in the
# order Terraform reads them.
sonar.issue.ignore.multicriteria.locale.ruleKey=shelldre:S7684
sonar.issue.ignore.multicriteria.locale.resourceKey=research/evidence/product.sh

# The service's profile and the research module's, each written in its module's
# folder.
sonar.go.coverage.reportPaths=coverage.out,research/coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
