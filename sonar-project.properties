# What the static analysis is told about this project. It describes the shape of
# the repository and nothing else: the coverage report named at the end is
# produced by the test run, not by the scanner.

sonar.projectKey=MathTrail_mathtrail-standalone
sonar.organization=mathtrail

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Reference vectors, the rendered site and generated mocks: none of it is code
# anybody writes, and all of it would be measured as if it were.
sonar.exclusions=testdata/**,site/dist/**,**/mocks/**

sonar.go.coverage.reportPaths=coverage.out
