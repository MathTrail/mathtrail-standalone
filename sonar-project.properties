# What the static analysis is told about this project. It describes the shape of
# the repository and nothing else: the coverage reports named at the end are
# produced by the test runs, not by the scanner.

sonar.projectKey=MathTrail_mathtrail-standalone
sonar.organization=mathtrail

sonar.sources=.
sonar.tests=.
# Tests are the files Go and Vitest run as tests, the contract every store is
# held to, and the host the widget's tests talk to: test code that lives beside
# the code rather than in a test file, because a test file cannot be shared.
# Like any test it measures and is not measured.
sonar.test.inclusions=**/*_test.go,internal/store/storetest/**,web/**/*.test.ts,web/**/*.test.tsx,web/src/**/testing/**

# Reference vectors, the rendered site and generated mocks: none of it is code
# anybody writes, and all of it would be measured as if it were. The research
# module has checks of its own and is not part of the product's quality gate.
sonar.exclusions=testdata/**,site/dist/**,**/mocks/**,research/**
sonar.test.exclusions=research/**
# The widget's entry point only finds the page's root and starts the widget,
# and what it starts is what the tests cover. The build's configurations are
# declarations: the build test and every run of the tests are what load them.
sonar.coverage.exclusions=web/src/widget/main.ts,web/*.config.ts

sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
