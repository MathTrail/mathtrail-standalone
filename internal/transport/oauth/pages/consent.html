<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ index .Words "consent.title" }}</title>
<style>{{ .Style }}</style>
</head>
<body>
<main class="auth">
<p class="auth-brand">MathTrail</p>
<h1>{{ template "phrase" .Heading }}</h1>
<p>{{ template "phrase" .Return }}</p>
{{- if .Loopback }}
<p class="auth-warning">{{ index .Words "consent.loopback" }}</p>
{{- end }}
<p>{{ index .Words "consent.google" }}</p>
<form method="post" action="/oauth/consent">
<input type="hidden" name="request" value="{{ .Request }}">
<div class="auth-actions">
<button type="submit" name="decision" value="allow" class="auth-primary">{{ index .Words "consent.allow" }}</button>
<button type="submit" name="decision" value="deny" class="auth-secondary">{{ index .Words "consent.deny" }}</button>
</div>
</form>
<p class="auth-small">{{ template "phrase" .Legal }}</p>
</main>
</body>
</html>
