# What the secret scan looks for: everything it looks for by default, less one
# false alarm. A bibliography key — a family name, a year and a word, such as
# gupta2025beyond — follows the word "Key" in the research's literature notes
# and in the tests of its citation checker, and the generic rule for API keys
# reads it as a key. The exception is held to those two places and to that
# shape together, so a real key there, or a key of that shape anywhere else,
# is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "Bibliography keys in the research's literature notes and citation checker"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)research/(literature|tools/citecheck)/''']
regexes = ['''^[a-z]+[0-9]{4}[a-z]+$''']

# The tests of the reviewers' sign-in share one password, made up as the recipe
# that makes a real one makes it: thirty-two random characters, which the
# generic rule for API keys reads as a key. The exception names that one
# password in those three tests alone; the real one lives in Secret Manager and
# reaches the service through its environment, never through the repository.
[[allowlists]]
description = "The made-up password of the reviewers' sign-in in its tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/(app/log_test|config/config_test|transport/oauth/reviewer_internal_test)\.go$''']
regexes = ['''^Xk3-vQ9_tLm2Wp7Rz4Yb8Nc1Jd6Hf5Gs$''']
